services:
  postgres:
    image: postgres:16
    container_name: poster-app-postgres
    environment:
      POSTGRES_USER: poster_app
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: poster_app_dev
    # Host port comes from POSTGRES_PORT so the root .env stays the single
    # place it is configured. Other projects on this machine publish postgres
    # on 5432 and 5433; a literal here is how chobii once pointed at one.
    # `bun run dev` / `dev:services` derive POSTGRES_PORT from DATABASE_URL.
    ports:
      - "${POSTGRES_PORT:-5440}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poster_app -d poster_app_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: poster-app-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: poster-app-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:
