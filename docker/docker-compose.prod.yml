version: "3.8"

services:
  # ── Cloudflare Tunnel ────────────────────────────────────────────────
  # Exposes the app to the internet via Cloudflare's network.
  # No port forwarding or static IP needed.
  #
  # Setup:
  #   1. Install cloudflared: brew install cloudflared
  #   2. Login: cloudflared tunnel login
  #   3. Create tunnel: cloudflared tunnel create masonart
  #   4. Copy the tunnel credentials JSON to docker/cloudflared/
  #   5. Set TUNNEL_TOKEN in .env (or use credentials file)
  #
  # See: https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - web
      - api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  # ── API Server ───────────────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: Dockerfile
      target: api
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-masonart}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-masonart}
      - REDIS_URL=redis://redis:6379
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - APP_URL=${APP_URL}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@masonart.com}
      - TWO_FACTOR_API_KEY=${TWO_FACTOR_API_KEY}
      - R2_ENDPOINT=${R2_ENDPOINT}
      - R2_ACCESS_KEY=${R2_ACCESS_KEY}
      - R2_SECRET_KEY=${R2_SECRET_KEY}
      - R2_BUCKET=${R2_BUCKET:-masonart-prod}
      - CDN_URL=${CDN_URL}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # oven/bun:1-slim ships no curl — probe with the runtime, same as the
      # Dockerfile HEALTHCHECK. /api/health is the canonical path.
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # ── Web Server (SSR) ────────────────────────────────────────────────
  web:
    build:
      context: ..
      dockerfile: Dockerfile
      target: web
    expose:
      - "3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - VITE_API_URL=${VITE_API_URL:-http://api:3000}
      - VITE_CDN_URL=${VITE_CDN_URL:-}
      - VITE_SENTRY_DSN=${VITE_SENTRY_DSN:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # node:20-slim ships no curl — probe with the runtime.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # ── PostgreSQL ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-masonart}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-masonart}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-masonart}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Redis ───────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  # ── MinIO (optional - use if not using Cloudflare R2) ───────────────
  # Uncomment if you want local S3-compatible storage instead of R2
  # minio:
  #   image: minio/minio:latest
  #   command: server /data --console-address ":9001"
  #   environment:
  #     - MINIO_ROOT_USER=${R2_ACCESS_KEY:-minioadmin}
  #     - MINIO_ROOT_PASSWORD=${R2_SECRET_KEY:-minioadmin}
  #   volumes:
  #     - minio_data:/data
  #   healthcheck:
  #     test: ["CMD", "mc", "ready", "local"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  # minio_data:
