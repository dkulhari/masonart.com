# Production stack — Mac mini behind the shared platform edge
# (docs/GO-LIVE-PLAN.md, customs-copilot docs/XTOMS-DEPLOYMENT-GUIDE.md).
#
# Not invoked directly on the mini — `deploy/Makefile` (run from the dev
# machine) resolves this file + deploy/.env into one rendered compose file
# and ships it over; the mini only ever pulls images. Ingress is the shared
# platform stack (platform-tunnel + platform-traefik): api/web join the
# external `platform` network and register their routes via the labels
# below. chobii.art runs NO cloudflared and holds NO tunnel token. postgres
# and redis stay on the stack's default network, reachable only by api/web.
#
# Every var whose absence would degrade silently in production carries a
# `:?` guard naming the consequence — a missing value must kill the render,
# not ship a stack that "deploys fine, breaks quietly" (cc #94, #131).

name: chobii

networks:
  platform:
    # Created once per host: docker network create platform
    # (make -C deploy platform-network)
    external: true

services:
  # ── API Server (Bun/Hono; BullMQ worker runs in-process) ─────────────
  api:
    image: ghcr.io/dkulhari/chobii-api:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: Dockerfile
      target: api
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-chobii}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-chobii}
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in deploy/.env — sessions cannot be signed without it}
      BETTER_AUTH_URL: https://${PUBLIC_HOSTNAME:-chobii.art}
      APP_URL: https://${PUBLIC_HOSTNAME:-chobii.art}
      SITE_URL: https://${PUBLIC_HOSTNAME:-chobii.art}
      # Same-origin by construction — single hostname, path-routed (#287)
      CORS_ORIGIN: https://${PUBLIC_HOSTNAME:-chobii.art}
      FRONTEND_URL: https://${PUBLIC_HOSTNAME:-chobii.art}
      # Payments — webhooks are the sole source of truth for payment state
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:?set RAZORPAY_KEY_ID in deploy/.env — checkout cannot create orders}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:?set RAZORPAY_KEY_SECRET in deploy/.env}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:?set RAZORPAY_WEBHOOK_SECRET in deploy/.env — payment webhooks would be rejected}
      # Email — unset silently drops all email and signups dead-end (cc #131)
      RESEND_API_KEY: ${RESEND_API_KEY:?set RESEND_API_KEY in deploy/.env — verification/order emails silently drop without it}
      EMAIL_FROM: ${EMAIL_FROM:?set EMAIL_FROM in deploy/.env, e.g. noreply@xtoms.xyz}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      # SMS (India, DLT-gated)
      TWO_FACTOR_API_KEY: ${TWO_FACTOR_API_KEY:?set TWO_FACTOR_API_KEY in deploy/.env — OTP login breaks without it}
      TWO_FACTOR_OTP_TEMPLATE: ${TWO_FACTOR_OTP_TEMPLATE:-}
      TWO_FACTOR_ORDER_CONFIRMED_TEMPLATE: ${TWO_FACTOR_ORDER_CONFIRMED_TEMPLATE:-}
      TWO_FACTOR_SHIPPED_TEMPLATE: ${TWO_FACTOR_SHIPPED_TEMPLATE:-}
      TWO_FACTOR_OUT_FOR_DELIVERY_TEMPLATE: ${TWO_FACTOR_OUT_FOR_DELIVERY_TEMPLATE:-}
      TWO_FACTOR_DELIVERED_TEMPLATE: ${TWO_FACTOR_DELIVERED_TEMPLATE:-}
      # Object storage / CDN — unset keys black-hole uploads (cc #94 class)
      R2_ENDPOINT: ${R2_ENDPOINT:?set R2_ENDPOINT in deploy/.env — uploads black-hole without it}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY:?set R2_ACCESS_KEY in deploy/.env}
      R2_SECRET_KEY: ${R2_SECRET_KEY:?set R2_SECRET_KEY in deploy/.env}
      R2_BUCKET: ${R2_BUCKET:?set R2_BUCKET in deploy/.env, e.g. chobii-prod}
      CDN_URL: ${CDN_URL:?set CDN_URL in deploy/.env, e.g. https://cdn.chobii.art — image URLs break without it}
      # AI generation — at least one provider key is enforced by `make gen-compose`
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN:-}
      GOOGLE_AI_STUDIO_KEY: ${GOOGLE_AI_STUDIO_KEY:-}
      FAL_API_KEY: ${FAL_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # OAuth (optional)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # First-boot admin seed (make first-boot / admin-promote)
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      # Observability (optional by design — the app runs without them)
      SENTRY_DSN: ${SENTRY_DSN:-}
      # chobii.art is production (still Razorpay TEST mode until the live-keys
      # go-live step). SENTRY_DSN is unset today, so this only matters once
      # Sentry is wired up.
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # DB pool tunables (defaults in code)
      DB_POOL_MAX: ${DB_POOL_MAX:-}
      DB_POOL_IDLE_TIMEOUT: ${DB_POOL_IDLE_TIMEOUT:-}
      DB_POOL_CONNECT_TIMEOUT: ${DB_POOL_CONNECT_TIMEOUT:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # oven/bun:1-slim ships no curl — probe with the runtime, same as the
      # Dockerfile HEALTHCHECK. /api/health is the canonical path.
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    # Guardrail on the shared 8GB mini — sharp/WebP image work is the
    # likeliest spike; revisit this limit first if OOM-killed.
    mem_limit: 512m
    networks: [default, platform]
    labels:
      traefik.enable: "true"
      # api sits on two networks — pin which one traefik dials.
      traefik.docker.network: platform
      # Longer rule outranks the web catch-all (traefik v3 length-based
      # priority). No StripPrefix: the api serves its routes under /api.
      # /sitemap.xml is served by the api (routes/sitemap.ts) but sits outside
      # the /api prefix — without the extra Path() it falls through to web's
      # 404 while robots.txt advertises it (pre-cutover latent bug).
      traefik.http.routers.chobii-api.rule: "Host(`${PUBLIC_HOSTNAME:-chobii.art}`) && (PathPrefix(`/api`) || Path(`/sitemap.xml`))"
      traefik.http.routers.chobii-api.entrypoints: web
      traefik.http.services.chobii-api.loadbalancer.server.port: "3000"

  # ── Web Server (React Router v7 SSR) ─────────────────────────────────
  web:
    image: ghcr.io/dkulhari/chobii-web:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: Dockerfile
      target: web
      args:
        # Same-origin: bakes relative API URLs into the browser bundle;
        # the ingress routes /api/* to the api container (#287, cc #96).
        VITE_API_URL: ""
        VITE_CDN_URL: ${CDN_URL:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    environment:
      NODE_ENV: production
      PORT: "3001"
      # SSR-side fetches go over the compose network, not the public edge
      VITE_API_URL: http://api:3000
      VITE_APP_URL: https://${PUBLIC_HOSTNAME:-chobii.art}
      VITE_CDN_URL: ${CDN_URL:?set CDN_URL in deploy/.env}
      VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Slim images ship no curl — probe with the runtime (web runs on bun,
      # which serves the SSR fetch handler directly).
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3001/').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    mem_limit: 256m
    networks: [default, platform]
    labels:
      traefik.enable: "true"
      traefik.docker.network: platform
      traefik.http.routers.chobii-web.rule: "Host(`${PUBLIC_HOSTNAME:-chobii.art}`)"
      traefik.http.routers.chobii-web.entrypoints: web
      traefik.http.services.chobii-web.loadbalancer.server.port: "3001"
      # Security headers for SSR pages (#264). The api sets its own via Hono
      # secureHeaders; the TanStack Start server entry (packages/web/app/
      # server.tsx) sets none, so traefik adds them at the edge for every web
      # response. This block is the ONLY place the web CSP is defined —
      # packages/web/tests/security-headers.test.ts pins that.
      traefik.http.routers.chobii-web.middlewares: chobii-web-headers
      traefik.http.middlewares.chobii-web-headers.headers.stsSeconds: "15552000"
      traefik.http.middlewares.chobii-web-headers.headers.stsIncludeSubdomains: "true"
      # TLS terminates at the Cloudflare edge, so traefik sees plain HTTP and
      # would suppress STS without this
      traefik.http.middlewares.chobii-web-headers.headers.forceSTSHeader: "true"
      # Nothing frames chobii.art, not even chobii.art — no <iframe> exists in
      # packages/web/app. Razorpay's checkout iframe is an outbound frame
      # (frame-src), not an inbound one, so DENY costs nothing. Kept in step
      # with the CSP's frame-ancestors 'none' below.
      traefik.http.middlewares.chobii-web-headers.headers.customFrameOptionsValue: DENY
      traefik.http.middlewares.chobii-web-headers.headers.contentTypeNosniff: "true"
      traefik.http.middlewares.chobii-web-headers.headers.referrerPolicy: strict-origin-when-cross-origin
      traefik.http.middlewares.chobii-web-headers.headers.customResponseHeaders.Permissions-Policy: "camera=(), microphone=(), geolocation=()"
      # CSP ENFORCED (#344). Phase 1 shipped this same policy as
      # Content-Security-Policy-Report-Only on 2026-07-27 (commit 5cefed33);
      # phase 2 audited the app source for every origin it actually reaches,
      # widened the policy for the three it was missing, and dropped
      # -Report-Only. Each non-obvious source, and why it is here:
      #
      #   script-src 'unsafe-inline' — TanStack Start streams an inline
      #     hydration script and a static traefik header cannot carry a
      #     per-response nonce. 'unsafe-eval' is deliberately absent.
      #   script/frame/connect razorpay — checkout.js is injected by
      #     PaymentButton / AddFundsButton / account/wallet; the modal is an
      #     iframe from api.razorpay.com; lumberjack is its telemetry sink.
      #   style-src + font-src fonts.googleapis.com / fonts.gstatic.com —
      #     Poppins + Urbanist, linked from app/routes/__root.tsx.
      #   img-src blob: — URL.createObjectURL previews in the AI generator's
      #     ReferenceImageUploader, admin ProductForm and lib/product-images.
      #   img-src CDN pair — cdn.chobii.art plus the pre-cutover host still
      #     present in older product rows; unsplash is seed data and
      #     lh3.googleusercontent.com is the Google sign-in avatar.
      #   connect-src 'self' — the browser talks to the API same-origin
      #     (the image is built with VITE_API_URL=""), so no host needed.
      #
      # Adding a third-party origin to the app without adding it here blocks
      # the resource in production; the guard test fails first instead.
      traefik.http.middlewares.chobii-web-headers.headers.customResponseHeaders.Content-Security-Policy: "default-src 'self'; script-src 'self' 'unsafe-inline' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://cdn.chobii.art https://chobii-cdn.xtoms.xyz https://images.unsplash.com https://lh3.googleusercontent.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.razorpay.com https://lumberjack.razorpay.com; frame-src https://api.razorpay.com https://checkout.razorpay.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"

  # ── PostgreSQL — default network only, never on `platform` ───────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chobii}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-chobii}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chobii}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 256m

  # ── Redis — cache + BullMQ; AOF for crash recovery, no backups ───────
  redis:
    image: redis:7-alpine
    # noeviction, NOT allkeys-lru: BullMQ requires it — LRU eviction
    # silently destroys queued AI-generation jobs. maxmemory sits below
    # the container limit so redis overhead can't trip the OOM killer.
    command: redis-server --maxmemory 96mb --maxmemory-policy noeviction --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 128m

volumes:
  postgres_data:
  redis_data:
