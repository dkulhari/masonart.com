# =============================================================================
# MasonArt CI Test Pipeline
# =============================================================================
# Runs all tests (unit, integration, E2E) on push and pull requests
# Uses PostgreSQL and Redis services for database-dependent tests
# =============================================================================

name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Node/Bun configuration
  BUN_VERSION: "1.1.38"
  NODE_VERSION: "20"

  # Test environment flags
  CI: true
  NODE_ENV: test

  # Skip runtime tests by default (enable in specific jobs)
  SKIP_DOCKER_RUNTIME_TESTS: true
  SKIP_ENV_VALIDATION: true

jobs:
  # ===========================================================================
  # Lint and Type Check
  # ===========================================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

  # ===========================================================================
  # Unit Tests - Shared Package
  # ===========================================================================
  test-shared:
    name: Unit Tests (Shared)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build shared package
        run: bun run --filter @masonart/shared build

      - name: Run shared package tests
        run: bun run --filter @masonart/shared test

  # ===========================================================================
  # Unit Tests - Web Package
  # ===========================================================================
  test-web:
    name: Unit Tests (Web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build shared package (dependency)
        run: bun run --filter @masonart/shared build

      - name: Run web package tests
        run: bun run --filter @masonart/web test
        env:
          VITE_API_URL: http://localhost:3000
          VITE_CDN_URL: http://localhost:9000/poster-app-dev

  # ===========================================================================
  # Unit Tests - API Package (No DB)
  # ===========================================================================
  test-api-unit:
    name: Unit Tests (API - No DB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build shared package (dependency)
        run: bun run --filter @masonart/shared build

      - name: Run API package tests (skip DB runtime tests)
        run: bun run --filter @masonart/api test
        env:
          SKIP_DB_RUNTIME_TESTS: true
          SKIP_REDIS_RUNTIME_TESTS: true
          DATABASE_URL: postgresql://poster_app:dev_password@localhost:5432/poster_app_dev
          REDIS_URL: redis://localhost:6379
          BETTER_AUTH_SECRET: test-secret-key-for-ci
          R2_ENDPOINT: http://localhost:9000
          R2_ACCESS_KEY: minioadmin
          R2_SECRET_KEY: minioadmin
          R2_BUCKET: poster-app-test
          RAZORPAY_KEY_ID: rzp_test_ci
          RAZORPAY_KEY_SECRET: test_secret_ci
          RAZORPAY_WEBHOOK_SECRET: test_webhook_secret_ci

  # ===========================================================================
  # Integration Tests - API with Database
  # ===========================================================================
  test-api-integration:
    name: Integration Tests (API with DB)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: poster_app
          POSTGRES_PASSWORD: dev_password
          POSTGRES_DB: poster_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U poster_app -d poster_app_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build shared package (dependency)
        run: bun run --filter @masonart/shared build

      - name: Push database schema
        run: bun run --filter @masonart/api db:push
        env:
          DATABASE_URL: postgresql://poster_app:dev_password@localhost:5432/poster_app_test

      - name: Run API tests with database
        run: bun run --filter @masonart/api test
        env:
          SKIP_DB_RUNTIME_TESTS: false
          SKIP_REDIS_RUNTIME_TESTS: false
          DATABASE_URL: postgresql://poster_app:dev_password@localhost:5432/poster_app_test
          REDIS_URL: redis://localhost:6379
          BETTER_AUTH_SECRET: test-secret-key-for-ci
          R2_ENDPOINT: http://localhost:9000
          R2_ACCESS_KEY: minioadmin
          R2_SECRET_KEY: minioadmin
          R2_BUCKET: poster-app-test
          RAZORPAY_KEY_ID: rzp_test_ci
          RAZORPAY_KEY_SECRET: test_secret_ci
          RAZORPAY_WEBHOOK_SECRET: test_webhook_secret_ci

  # ===========================================================================
  # Root Integration Tests
  # ===========================================================================
  test-integration:
    name: Integration Tests (Root)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: poster_app
          POSTGRES_PASSWORD: dev_password
          POSTGRES_DB: poster_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U poster_app -d poster_app_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build shared package
        run: bun run --filter @masonart/shared build

      - name: Push database schema
        run: bun run --filter @masonart/api db:push
        env:
          DATABASE_URL: postgresql://poster_app:dev_password@localhost:5432/poster_app_test

      - name: Run setup tests
        run: bunx vitest run tests/setup/
        env:
          SKIP_DOCKER_RUNTIME_TESTS: true
          SKIP_ENV_VALIDATION: true

      - name: Run integration tests
        run: bunx vitest run tests/integration/
        env:
          SKIP_DB_RUNTIME_TESTS: false
          DATABASE_URL: postgresql://poster_app:dev_password@localhost:5432/poster_app_test
          REDIS_URL: redis://localhost:6379

  # ===========================================================================
  # E2E Tests with Playwright
  # ===========================================================================
  test-e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: poster_app
          POSTGRES_PASSWORD: dev_password
          POSTGRES_DB: poster_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U poster_app -d poster_app_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Build shared package
        run: bun run --filter @masonart/shared build

      - name: Push database schema
        run: bun run --filter @masonart/api db:push
        env:
          DATABASE_URL: postgresql://poster_app:dev_password@localhost:5432/poster_app_test

      - name: Seed database
        run: bun run --filter @masonart/api seed
        env:
          DATABASE_URL: postgresql://poster_app:dev_password@localhost:5432/poster_app_test
          REDIS_URL: redis://localhost:6379

      - name: Run E2E tests (Chromium only in CI)
        run: bunx playwright test --project=chromium
        env:
          DATABASE_URL: postgresql://poster_app:dev_password@localhost:5432/poster_app_test
          REDIS_URL: redis://localhost:6379
          BETTER_AUTH_SECRET: test-secret-key-for-ci
          R2_ENDPOINT: http://localhost:9000
          R2_ACCESS_KEY: minioadmin
          R2_SECRET_KEY: minioadmin
          R2_BUCKET: poster-app-test
          CDN_URL: http://localhost:9000/poster-app-test
          VITE_API_URL: http://localhost:3000
          VITE_CDN_URL: http://localhost:9000/poster-app-test
          API_PORT: 3000
          WEB_PORT: 3001
          APP_NAME: MasonArt
          APP_URL: http://localhost:3001

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  # ===========================================================================
  # Test Summary
  # ===========================================================================
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [lint, test-shared, test-web, test-api-unit, test-api-integration, test-integration, test-e2e]
    if: always()
    steps:
      - name: Check test results
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.lint.result }}" == "success" ]; then
            echo "- :white_check_mark: Lint & Type Check" >> $GITHUB_STEP_SUMMARY
          else
            echo "- :x: Lint & Type Check" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.test-shared.result }}" == "success" ]; then
            echo "- :white_check_mark: Unit Tests (Shared)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- :x: Unit Tests (Shared)" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.test-web.result }}" == "success" ]; then
            echo "- :white_check_mark: Unit Tests (Web)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- :x: Unit Tests (Web)" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.test-api-unit.result }}" == "success" ]; then
            echo "- :white_check_mark: Unit Tests (API - No DB)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- :x: Unit Tests (API - No DB)" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.test-api-integration.result }}" == "success" ]; then
            echo "- :white_check_mark: Integration Tests (API with DB)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- :x: Integration Tests (API with DB)" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.test-integration.result }}" == "success" ]; then
            echo "- :white_check_mark: Integration Tests (Root)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- :x: Integration Tests (Root)" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.test-e2e.result }}" == "success" ]; then
            echo "- :white_check_mark: E2E Tests (Playwright)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- :x: E2E Tests (Playwright)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail if any tests failed
        if: |
          needs.lint.result == 'failure' ||
          needs.test-shared.result == 'failure' ||
          needs.test-web.result == 'failure' ||
          needs.test-api-unit.result == 'failure' ||
          needs.test-api-integration.result == 'failure' ||
          needs.test-integration.result == 'failure' ||
          needs.test-e2e.result == 'failure'
        run: |
          echo "One or more test jobs failed!"
          exit 1
