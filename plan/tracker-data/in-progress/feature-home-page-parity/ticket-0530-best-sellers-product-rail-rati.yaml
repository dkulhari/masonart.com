      - Heading reads "Best Seller" (singular), which is what the band itself says on mesonart; "Best Sellers" is only their nav label.
      - The band renders NOTHING on an empty list rather than a heading over a dead track.
      - NOT built: mesonart's category tab row under the Best Seller heading (Wabi-Sabi Art / Plaster & Texture Art / Pop Art / Minimalist Paintings / Colorful Art). It is a per-style refetch of the rail and is out of this ticket's description; the facets endpoint could back it if someone wants it later.

