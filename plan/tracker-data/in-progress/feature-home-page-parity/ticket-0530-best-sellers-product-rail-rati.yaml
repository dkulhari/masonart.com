      DATA SOURCE — and the actual cause of "no ratings, no counts":
      This was never a ProductCard defect. `product/ProductCard` has drawn the star row + `(count)` since the collection parity work and `/posters` shows it. The home page did not, because it reads `GET /api/products/featured`, whose SQL projection (packages/api/src/routes/products.ts:667-699) selects NO review aggregate — no `averageRating`, no `reviewCount`. Every home card therefore arrived unrated, and ProductRating correctly rendered nothing rather than inventing a score.

      `GET /api/products` DOES join the aggregate (`round(avg(reviews.rating),1)` over approved reviews only, `count(reviews.id)`) — products.ts:506-522. So the rail reads the LIST endpoint with `sortBy=salesCount&sortOrder=desc`, which is real units sold from settled orders with the curator's isPopular/popularOrder pin above it — not the featured flag and not a hand-written list. Ratings are real: verified against the dev catalogue (41 active products; Wabi-Sabi Study 5.0/2, Desert Bloom 4.0/1, Cosmic Harmony 4.5/2, Mountain Majesty 5.0/2).

      MEASURED GEOMETRY (verified in the browser at 1440x900 and 390x844):
      - desktop: track 1400 wide, 4 cards of 335 at a 20px gutter — 4*335+3*20 = 1400 exactly
      - mobile: card 287px inside 390 (bar's is 286), next card peeks at x=327 (bar's at 322); the track bleeds past the page gutter and `scroll-pl` snaps a card back to x=20 — confirmed by scrolling it and re-measuring
      - View All pill 142x56 (bar's 148x49), centred under the rail, leading clipboard icon
      - prev/next 56px circles at the far right of the heading row, prev disabled at rest

      DECISIONS:
