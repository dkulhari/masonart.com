    text: |-
      Built. New TrustList.tsx — four rows, icon + bold title + `?` tooltip + muted sub-line.

      Copy is CORRECTED against our real policy, not copied from the reference. Every claim cited:
      - "Made Just For You" / "Every piece is printed to order — production takes 2-4 business days" (app/routes/shipping.tsx). The reference's "Ship After You Are Satisfied" maps to our photo-approval workflow, but packages/api/src/services/approval.ts shows that only fires for isAiGenerated order items, not the whole catalogue — so it is a tooltip aside, not a blanket headline claim.
      - "Free Shipping Over ₹999" / "Free on orders over ₹999 — smaller orders see the cost at checkout" (app/routes/shipping.tsx). Deliberately NOT the reference's "on All Orders", which is false for us.
      - "30 Days Easy Returns" with a real Learn more. link to /returns (app/routes/returns.tsx).
      - "Safe Payment Options" / "Secure checkout via Razorpay — cards, UPI, netbanking & wallets" (app/routes/faq.tsx).
      Corroboration: Footer.tsx's existing USP strip had independently made the same corrections, which confirms the reading.

      The `?` is a real button with aria-describedby/aria-expanded, opening on hover, focus or click (click covers touch) and closing on blur, second click or Escape. 6 dedicated tests.

      Still needs a blind critic verdict before this is done.
