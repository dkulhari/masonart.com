ticket_number: 436
title: Storefront - cart saving row, locked for non-members
description: |-
  ## Task
  Cart shows what the sale is worth: per-line saving and a cart-level saving row. When lines come back `locked`, the row reads as a locked saving with a "Join the gallery" button rather than a silent absence.

  This is the gate's whole point of contact — the customer sees the number they are not getting yet, at the moment they are about to pay.

  ## Context
  Part of feature: sale-promotions
  Phase: 4 — Frontend
  Design: `docs/superpowers/specs/2026-08-05-sale-promotions-design.md` §5, §7

  Reads the T7 payload (`items[].pricing`, `savingTotal`). The Join button target lands with `gallery-membership`; until then it links to registration with `?join=gallery`. Totals shown must equal what the server will charge — never recompute a discount client-side.
