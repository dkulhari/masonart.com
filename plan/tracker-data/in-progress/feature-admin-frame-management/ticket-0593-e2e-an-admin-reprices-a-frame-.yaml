    text: |-
      📝 **Spec written and committed — but NOT executed. Blocked on a decision, not on code.**

      **Commit**: `aae6925c` — test(e2e): an admin reprices a frame and the storefront charges it

      **Why it has not run**: `./scripts/run-tests.sh e2e` does two things I will not do unprompted on this machine.

      1. **Line 232, "Always: migrate schema"**, against `docker/docker-compose` — which is the same `poster-app-postgres` container on :5440 that every other session on this box shares. That applies migration 0014 (dropping the `frame_type` type, altering a column) to the shared dev database, with no down-migration.
      2. **It starts dev servers on shared ports.** With many concurrent sessions here, that is its own collision.

      Earlier in this feature I validated 0014 by building a throwaway `frames_migration_check` database on the same server and applying it there (see #582) — safe because it touched nothing else. The E2E cannot be isolated that cheaply: it needs the app, the API, Redis, seeded users and the real database together.

      **What IS verified**:
      - `bunx playwright test tests/e2e/admin-frames.spec.ts --project=chromium --list` enumerates all four tests, so the spec parses and its structure is valid.
      - Every selector was read out of the implementation rather than guessed: `admin-frames-table` (`admin/frames/index.tsx:100`), `frame-price-basis` and `frame-selector-label` (`FrameSelector.tsx:223,237`), the swatch `<button>` with `aria-pressed` (`:314`), and the form labels the #590 tests already exercise.

      **Two design points worth keeping:**

      **It is deliberately NOT mocked.** The sibling admin specs intercept `/api/admin/**` with `page.route`. That is right for asserting how a screen renders a payload, and useless here — a mocked write and a mocked read agree with each other by construction while the database, the cache and the formula go untested. The three boundaries this crosses are the entire reason it exists.

      **The quoted uplift is read off the admin preview, not recomputed in the test.** Whatever the preview says is what the storefront is then held to. A test that recomputed the expected number could pass while the preview lied to the admin — which is the failure mode this feature is most exposed to.

      **Housekeeping in the spec**: `afterEach` restores the original pricing, and the last-active-frame test unarchives everything it archived. A repriced or archived frame leaking into later specs would surface as a failure somewhere unrelated.

      Left `in-progress` rather than marked done, because the ticket's own step 4 is "confirm the E2E spec passes" and I have not.
