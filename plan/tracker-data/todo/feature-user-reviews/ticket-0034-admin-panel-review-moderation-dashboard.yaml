ticket_number: 34
title: 'Admin Panel - Review Moderation Dashboard'
description: |-
  Create admin dashboard for review moderation following existing admin panel patterns.

  ## Implementation Details

  ### Route Location
  `packages/web/app/routes/admin/reviews.tsx`

  ### Components

  **AdminReviewsPage**
  - Page layout matching other admin pages
  - Stats cards at top (pending, approved, rejected, today)
  - Filterable review list below
  - Bulk actions support

  **ReviewModerationTable**
  - Columns: Product, Author, Rating, Preview, Status, Date, Actions
  - Sortable columns
  - Row click expands full review
  - Quick approve/reject buttons

  **ReviewModerationModal**
  - Full review content display
  - Product link and image thumbnail
  - Author info and history
  - Approve/Reject buttons
  - Moderator notes textarea
  - View previous moderation actions

  **AdminReviewFilters**
  - Status filter (pending, approved, rejected, all)
  - Date range filter
  - Product search
  - Author search

  ### Features
  - Real-time count badges (pending count)
  - Bulk approve/reject selected
  - Keyboard shortcuts (a=approve, r=reject, n=next)
  - Pagination with page size selector

  ### Navigation
  - Add "Reviews" to admin sidebar
  - Badge showing pending count
  - Link in admin dashboard stats

  ## Testing Requirements

  ### E2E Tests (tests/e2e/admin/reviews.spec.ts)

  **Access Control**
  1. test('admin can access reviews page')
  2. test('customer cannot access reviews page')
  3. test('trade user cannot access reviews page')

  **Display Tests**
  4. test('stats cards show correct counts')
  5. test('pending reviews listed by default')
  6. test('filtering by status works')
  7. test('search by product works')

  **Moderation Tests**
  8. test('approve button changes status to approved')
  9. test('reject button changes status to rejected')
  10. test('moderator notes saved on rejection')
  11. test('approved review appears on product page')
  12. test('rejected review hidden from product page')

  **Bulk Actions**
  13. test('select multiple reviews')
  14. test('bulk approve selected reviews')

  ## Acceptance Criteria
  - [ ] Admin-only access enforced
  - [ ] Stats dashboard with pending count
  - [ ] Filter and search functionality
  - [ ] Quick approve/reject workflow
  - [ ] Moderator notes tracked
  - [ ] E2E tests passing
  - [ ] Matches existing admin panel styling
