ticket_number: 33
title: 'Integration - Product Page Reviews'
description: |-
  Integrate review components into product detail page following existing page patterns.

  ## Implementation Details

  ### Files to Modify
  - `packages/web/app/routes/posters/$slug.tsx` - Add reviews section
  - `packages/web/app/routes/products/$id.tsx` - Add reviews section (if exists)

  ### Integration Points

  **Product Detail Page Updates**
  1. Add ReviewSummary below product info
     - Show average rating with star display
     - Show total review count
     - "Write a Review" CTA button

  2. Add Reviews Section (tab or scroll section)
     - ReviewFilters for sorting/filtering
     - ReviewList with pagination
     - ReviewForm (modal or inline)

  **Data Fetching**
  - Fetch reviews alongside product data
  - Use TanStack Query for caching
  - Optimistic updates for new reviews

  **SEO Considerations**
  - Add aggregate rating structured data (JSON-LD)
  - Schema: Product with aggregateRating
  - Include reviewCount and ratingValue

  ### Layout
  ```
  [Product Images] [Product Info]
                   [Price, Add to Cart]
                   [Star Rating Summary] [Write Review]

  ─────────────────────────────────────

  [Reviews Section]
  [Filters: Sort by, Filter by rating]
  [Review 1]
  [Review 2]
  [Review 3]
  [Load More / Pagination]
  ```

  ## Testing Requirements

  ### E2E Tests (tests/e2e/reviews/product-integration.spec.ts)

  **Display Tests**
  1. test('product page shows review summary')
  2. test('clicking reviews tab scrolls to reviews')
  3. test('review count matches API response')
  4. test('average rating displays correctly')

  **Interaction Tests**
  5. test('write review button opens form for auth user')
  6. test('write review button redirects unauth user to login')
  7. test('sorting reviews updates list')
  8. test('filtering by rating works')
  9. test('pagination loads more reviews')

  **SEO Tests**
  10. test('aggregate rating JSON-LD present')
  11. test('JSON-LD has correct ratingValue')
  12. test('JSON-LD has correct reviewCount')

  ## Acceptance Criteria
  - [ ] Reviews visible on all product pages
  - [ ] Summary shows above fold
  - [ ] Review list with sorting/filtering
  - [ ] Write review button with auth check
  - [ ] Structured data for SEO
  - [ ] E2E tests passing
  - [ ] Mobile responsive layout
