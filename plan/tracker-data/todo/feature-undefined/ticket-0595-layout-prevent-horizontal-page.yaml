ticket_number: 595
title: 'Layout: Prevent horizontal page overflow and right-edge clipping on narrowed viewports'
description: |-
  ## Task
  Fix horizontal page overflow and right-edge viewport clipping when reducing browser window size / on narrow mobile viewports.

  ## Context
  When shrinking the viewport width, certain layout containers or fixed-width child elements cause horizontal scrolling and right-edge clipping. Need to ensure root containers enforce `max-w-full` / `overflow-x-hidden` and clean responsive sizing across breakpoints.
