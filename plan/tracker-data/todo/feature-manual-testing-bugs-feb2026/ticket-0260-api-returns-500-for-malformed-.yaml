ticket_number: 260
title: API returns 500 for malformed JSON body instead of 400
description: 'Sending a POST request with invalid JSON body (e.g. ''not json'' as body with Content-Type: application/json) to endpoints like /api/auth/sign-in/email returns HTTP 500 with an empty response body. This should return 400 Bad Request with a message like "Invalid JSON body". A 500 error indicates an unhandled exception which could potentially leak information in different environments. All other validation errors correctly return 400 with descriptive messages. Reproduction: curl -X POST http://localhost:3000/api/auth/sign-in/email -H "Content-Type: application/json" -d "not json"'
