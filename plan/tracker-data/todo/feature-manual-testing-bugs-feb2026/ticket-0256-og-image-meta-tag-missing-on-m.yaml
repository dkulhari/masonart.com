ticket_number: 256
title: og:image meta tag missing on most pages except /posters
description: 'The og:image Open Graph meta tag is properly set on the /posters page with a custom collection image, but is completely missing on all other pages tested: home /, /create, /gallery, /auth/login, /cart, /checkout. Social media shares from these pages will have no preview image. The /posters page has excellent OG implementation with og:image, og:image:secure_url, og:image:alt, og:image:type, og:image:width, og:image:height. This should be replicated to other public pages using appropriate default images.'
