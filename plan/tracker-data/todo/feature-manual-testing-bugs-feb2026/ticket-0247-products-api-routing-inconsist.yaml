ticket_number: 247
title: 'Products API routing inconsistency: trailing slash returns 401, no slash hangs'
description: |-
  ## Bug
  `GET /api/products/` (with trailing slash) returns 401 Unauthorized immediately, while `GET /api/products` (without trailing slash) hangs indefinitely. This suggests a routing or middleware issue where the two paths match different handlers.

  ## Steps to Reproduce
  ```bash
  curl -s --max-time 5 -o /dev/null -w "%{http_code}" http://localhost:3000/api/products/  # 401
  curl -s --max-time 5 -o /dev/null -w "%{http_code}" http://localhost:3000/api/products   # 000 (timeout)
  ```

  ## Impact
  Indicates a deeper routing bug that likely causes the critical Products API timeout (#238).
