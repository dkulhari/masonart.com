ticket_number: 268
title: Web server returns 500 instead of 406 for non-HTML Accept headers
description: |-
  When a request is made to the web server with Accept: application/json or Accept: text/plain, it returns HTTP 500 with body {"error":"Only HTML requests are supported here"}.

  The HTTP status should be 406 Not Acceptable, not 500 Internal Server Error.

  Test results:
  - Accept: application/json → 500 (should be 406)
  - Accept: text/plain → 500 (should be 406)  
  - Accept: */* → 200 (correct)
  - No Accept header → 200 (correct)

  Affects all web routes (/, /posters, /create, etc.).
