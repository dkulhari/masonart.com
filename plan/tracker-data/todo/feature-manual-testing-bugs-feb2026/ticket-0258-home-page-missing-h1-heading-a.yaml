ticket_number: 258
title: Home page missing H1 heading - accessibility violation
description: The home page (/) has no H1 heading tag. The heading hierarchy starts at H2 for sections like "Featured Collection", "Shop by Style", "Create Your Own Masterpiece", "Why Choose MasonArt". Every page should have exactly one H1 for proper heading hierarchy. This is a WCAG 2.1 accessibility violation and hurts SEO. The hero section likely needs an H1 tag for the main page title. Other pages like /posters, /create, /gallery all have proper H1 tags.
