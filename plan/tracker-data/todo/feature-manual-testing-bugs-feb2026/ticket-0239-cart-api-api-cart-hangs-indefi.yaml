ticket_number: 239
title: Cart API (/api/cart) hangs indefinitely - empty reply from server
description: |-
  ## Bug
  GET `/api/cart` never returns a response. Same behavior as Products API - hangs for ~5+ seconds then empty reply.

  ## Steps to Reproduce
  1. `curl --max-time 5 http://localhost:3000/api/cart`
  2. Observe timeout with HTTP 000

  ## Note
  Cart page still works because it uses client-side Zustand store, but server-side cart operations are broken.

  ## Expected
  401 Unauthorized (for unauthenticated) or 200 OK with cart contents
