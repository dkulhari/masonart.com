    text: |-
      UPDATE: More detailed testing shows sign-up validation is PARTIALLY working:

      - Password validation works correctly: `{"email":"test@test.com","password":"12","name":"Test"}` → 400 `{"code":"PASSWORD_TOO_SHORT","message":"Password too short"}` ✅
      - Empty name → 500 (should be 400) ❌
      - Missing name field → 500 (should be 400) ❌
      - Invalid email format → 500 (should be 400) ❌

      The issue appears to be specifically in name and email validation, NOT password validation. Password validation is handled by Better Auth itself, while name/email validation may have a bug in the custom validation layer or the error is thrown by the database constraint rather than caught by validation.
