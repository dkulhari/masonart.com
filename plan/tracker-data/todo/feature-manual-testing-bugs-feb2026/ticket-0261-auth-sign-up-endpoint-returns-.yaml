ticket_number: 261
title: Auth sign-up endpoint returns 500 for all validation errors
description: "POST /api/auth/sign-up/email returns HTTP 500 for ALL invalid input scenarios instead of 400 with validation messages. Tested: missing email, invalid email format, short name (1 char), XSS in name field - all return 500 with empty body. In contrast, the sign-in endpoint correctly returns 400 with descriptive errors for missing password and empty email. This suggests the sign-up validation middleware or handler has an unhandled exception. Severity is high because: 1) Users get no feedback on what they did wrong, 2) A 500 indicates unhandled exceptions which may leak info in production, 3) This is a core user flow."
