ticket_number: 248
title: Cart icon aria-label doesn't include item count for screen readers
description: |-
  ## Bug
  The desktop cart icon has `aria-label="Shopping cart"` statically, but the accessibility tree shows "Shopping cart, 2 items" in one place and just "Shopping cart" in another. The desktop version (shown in raw HTML source from curl) does NOT include item count in the aria-label, while the client-side rendered version does.

  This means SSR HTML delivered to crawlers/screen readers may lack the item count.

  ## Expected
  `aria-label` should dynamically include item count: "Shopping cart, 2 items"
