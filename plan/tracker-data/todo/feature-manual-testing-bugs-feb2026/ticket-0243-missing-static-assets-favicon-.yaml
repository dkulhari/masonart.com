ticket_number: 243
title: 'Missing static assets: favicon.ico, apple-touch-icon.png, site.webmanifest all return 404'
description: |-
  ## Bug
  Three static assets referenced in the HTML `<head>` all return 404:
  - `/favicon.ico` - 404
  - `/apple-touch-icon.png` - 404 (referenced as `sizes="180x180"`)
  - `/site.webmanifest` - returns HTML 404 page instead of JSON manifest
  - `/favicon-32x32.png` and `/favicon-16x16.png` - also likely 404 (referenced in head)

  ## Steps to Reproduce
  ```bash
  curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/favicon.ico  # 404
  curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/apple-touch-icon.png  # 404
  curl -s http://localhost:3001/site.webmanifest | head -1  # HTML, not JSON
  ```

  ## Impact
  - No favicon in browser tab
  - No icon when saving to home screen on iOS/Android
  - PWA functionality broken without valid manifest

  ## Expected
  Valid static asset files served for each referenced resource
