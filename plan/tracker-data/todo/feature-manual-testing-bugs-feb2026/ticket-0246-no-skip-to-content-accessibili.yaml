ticket_number: 246
title: No skip-to-content accessibility link on any page
description: |-
  ## Bug
  No skip-to-main-content link exists on any page. This is an important accessibility feature for keyboard/screen-reader users to bypass the navigation.

  ## Impact
  WCAG 2.1 Level A violation (Success Criterion 2.4.1 - Bypass Blocks). Keyboard users must tab through all navigation links before reaching page content.

  ## Expected
  A visually-hidden link that becomes visible on focus, jumping to `<main>` content.
