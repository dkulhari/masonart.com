ticket_number: 242
title: Forgot password page (/auth/forgot-password) returns 404
description: |-
  ## Bug
  The login page at `/auth/login` contains a "Forgot password?" link pointing to `/auth/forgot-password`, but this page returns 404.

  ## Steps to Reproduce
  1. Navigate to http://localhost:3001/auth/login
  2. Click "Forgot password?" link
  3. Observe 404 page

  ## Impact
  Users who forget their password cannot recover their accounts.

  ## Expected
  A password reset form that sends reset email
