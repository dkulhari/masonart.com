    code: |
      import { describe, it, expect, vi } from 'vitest'
      import { render, screen } from '@testing-library/react'
      import { MediaCropControl, toNormalisedCrop } from '~/components/admin/MediaCropControl'

      describe('toNormalisedCrop', () => {
        it('converts react-easy-crop percentage areas to 0..1', () => {
          expect(toNormalisedCrop({ x: 10, y: 20, width: 50, height: 50 }))
            .toEqual({ x: 0.1, y: 0.2, w: 0.5, h: 0.5 })
        })
        it('clamps values outside 0..1', () => {
          expect(toNormalisedCrop({ x: -5, y: 0, width: 150, height: 50 }))
            .toEqual({ x: 0, y: 0, w: 1, h: 0.5 })
        })
      })

      describe('MediaCropControl', () => {
        it('renders a crop viewport for photographic types', () => {
          render(<MediaCropControl type="room-mockup" src="blob:x" onCropChange={vi.fn()} />)
          expect(screen.getByTestId('crop-viewport')).toBeInTheDocument()
        })

        it("shows a matted preview and NO crop viewport for type 'main'", () => {
          render(<MediaCropControl type="main" src="blob:x" onCropChange={vi.fn()} />)
          expect(screen.queryByTestId('crop-viewport')).not.toBeInTheDocument()
          expect(screen.getByTestId('mat-preview')).toBeInTheDocument()
        })

        it('exposes a zoom control for photographic types', () => {
          render(<MediaCropControl type="detail" src="blob:x" onCropChange={vi.fn()} />)
          expect(screen.getByLabelText(/zoom/i)).toBeInTheDocument()
        })
      })
