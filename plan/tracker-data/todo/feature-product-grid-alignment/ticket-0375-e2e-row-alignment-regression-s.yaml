    expected_result: FAIL until T9 and T11 have landed
    status: pending
    code: |
      import { test, expect, type Page } from '@playwright/test'

      const WIDTHS = [
        { w: 1440, h: 900, cols: 4 },
        { w: 1024, h: 900, cols: 3 },
        { w: 375, h: 812, cols: 2 },
      ]

      async function cardBoxes(page: Page) {
        return page.$$eval('[data-testid="product-card"]', (els) =>
          els.map((el) => {
            const r = el.getBoundingClientRect()
            const media = el.querySelector('[data-testid="media-box"]')!.getBoundingClientRect()
            return {
              top: Math.round(r.top),
              height: +r.height.toFixed(2),
              mediaW: +media.width.toFixed(2),
              mediaH: +media.height.toFixed(2),
            }
          }),
        )
      }

      for (const { w, h, cols } of WIDTHS) {
        test.describe(`grid at ${w}px`, () => {
          test.beforeEach(async ({ page }) => {
            await page.setViewportSize({ width: w, height: h })
            await page.goto('/posters', { waitUntil: 'networkidle' })
          })

          test(`renders ${cols} columns`, async ({ page }) => {
            const boxes = await cardBoxes(page)
            const rows = new Map<number, number>()
            boxes.forEach((b) => rows.set(b.top, (rows.get(b.top) ?? 0) + 1))
            expect(Math.max(...rows.values())).toBe(cols)
          })

          test('every card in a row has an identical height', async ({ page }) => {
            const boxes = await cardBoxes(page)
            expect(boxes.length).toBeGreaterThan(0)
            const rows = new Map<number, Set<number>>()
            boxes.forEach((b) => {
              if (!rows.has(b.top)) rows.set(b.top, new Set())
              rows.get(b.top)!.add(b.height)
            })
            for (const [top, heights] of rows) {
              expect(heights.size, `row at y=${top} has heights ${[...heights].join(', ')}`).toBe(1)
            }
          })

          test('every media box is square', async ({ page }) => {
            for (const b of await cardBoxes(page)) {
              expect(Math.abs(b.mediaW - b.mediaH)).toBeLessThanOrEqual(1)
            }
          })
        })
      }

      test('home page featured grid does not shift as products resolve', async ({ page }) => {
        await page.setViewportSize({ width: 1440, height: 900 })
        let shift = 0
        await page.addInitScript(() => {
          ;(window as any).__cls = 0
          new PerformanceObserver((l) => {
            for (const e of l.getEntries() as any[]) if (!e.hadRecentInput) (window as any).__cls += e.value
          }).observe({ type: 'layout-shift', buffered: true })
        })
        await page.goto('/', { waitUntil: 'networkidle' })
        await page.waitForTimeout(1500)
        shift = await page.evaluate(() => (window as any).__cls)
        expect(shift).toBeLessThan(0.05)
      })

      test('hover swaps the image without moving the card', async ({ page }) => {
        await page.setViewportSize({ width: 1440, height: 900 })
        await page.goto('/posters', { waitUntil: 'networkidle' })
        const card = page.locator('[data-testid="product-card"]').filter({ has: page.locator('[data-testid="card-dots"]') }).first()
        await expect(card).toBeVisible()
        const before = await card.boundingBox()
        const media = card.locator('[data-testid="media-box"]')
        const box = (await media.boundingBox())!
        await page.mouse.move(box.x + box.width * 0.8, box.y + box.height * 0.5, { steps: 6 })
        await page.waitForTimeout(700)
        await expect(card.locator('img.absolute.opacity-100')).toHaveCount(1)
        expect(await card.boundingBox()).toEqual(before)
      })

      test('no hover affordances below md', async ({ page }) => {
        await page.setViewportSize({ width: 375, height: 812 })
        await page.goto('/posters', { waitUntil: 'networkidle' })
        await expect(page.locator('[data-testid="card-dots"]:visible')).toHaveCount(0)
      })
