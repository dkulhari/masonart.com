ticket_number: 370
title: Card - productCardTokens + ProductCardMedia with cursor-X hover scrub
description: |-
  ## Task

  Build the square media box and the hover interaction. This is the only stateful part of the card, which is why it gets its own file.

  **Structure that makes rows align** - one in-flow image sets the height, every hover slide is absolute and cannot:

  ```
  <Link>                              relative, overflow-hidden, bg-mat, rounded
    <img>            images[0]        IN FLOW: w-full aspect-square -> defines box height
    <img> x N        images[1..]      absolute inset-0, opacity 0/1 crossfade
    <dots>                            N-1 dots, absolute
  ```

  **Hover scrub**, generalised past mesonart's hardcoded `mediaCount === 2|3|4`:

  ```ts
  function zoneFor(clientX, el, n) {
    const { left, width } = el.getBoundingClientRect()
    const zones = n - 1          // slide 0 is the rest state, unreachable while hovering
    return Math.min(zones, Math.max(1, Math.ceil(((clientX - left) / width) * zones)))
  }
  ```

  Measured on mesonart, entering fresh at 8 cursor fractions: `0.02/0.10/0.20 -> 1`, `0.35/0.50/0.65 -> 2`, `0.80/0.98 -> 3`. Not time-based - holding still for 5.6s kept the index frozen.

  ## Context

  Part of feature: product-grid-alignment
  Phase: 4 - Card and grid
  Depends on: T1

  Routing is **TanStack Router** (`@tanstack/react-router`), not React Router - the root CLAUDE.md is stale on this.

  Deliberate divergences from mesonart, all justified in the spec:
  - set `sizes` on every image (their omission causes a measured 6.7x over-fetch)
  - unmount hover slides below `md` rather than `display:none` them (they download 4 unused images per card on mobile)
  - keep keyboard reachability; dots are `aria-hidden` decorative, since every image is reachable on the product page
  - gate transitions behind `motion-safe:`
  - `object-contain`, not `object-cover`: the pipeline guarantees square, so this never fires - but if a bad asset slips through, `cover` would silently crop it. Pair with a dev-only assertion that logs on `width !== height`.

  ## Acceptance criteria
  - One image renders a plain card with no hover affordances
  - Two or more images crossfade on hover, index driven by cursor X
  - Pointer-leave returns to slide 0
  - Touch pointers are ignored (`pointerType !== 'mouse'`), so a tap navigates rather than swapping
  - Card footprint is pixel-identical at rest and during hover
