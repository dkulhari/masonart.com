    code: |
      import { describe, it, expect, vi } from 'vitest'
      import { render, screen, fireEvent } from '@testing-library/react'
      import type { ProductImage } from '@chobii/shared'
      import { ProductMediaRows } from '~/components/admin/ProductMediaRows'

      const img = (over: Partial<ProductImage>): ProductImage => ({
        id: 'i', url: 'u', altText: 'a', type: 'detail', sortOrder: 0,
        width: 1500, height: 1500, originalKey: 'o', ...over,
      })

      describe('ProductMediaRows', () => {
        it('renders a type selector per row', () => {
          render(<ProductMediaRows images={[img({ id: '1' }), img({ id: '2' })]} onChange={vi.fn()} />)
          expect(screen.getAllByLabelText(/media type/i)).toHaveLength(2)
        })

        it('demotes the previous main when another row is set to main', () => {
          const onChange = vi.fn()
          render(<ProductMediaRows images={[img({ id: '1', type: 'main' }), img({ id: '2' })]} onChange={onChange} />)
          fireEvent.change(screen.getAllByLabelText(/media type/i)[1], { target: { value: 'main' } })
          const next = onChange.mock.calls.at(-1)![0] as ProductImage[]
          expect(next.filter((i) => i.type === 'main')).toHaveLength(1)
          expect(next.find((i) => i.type === 'main')!.id).toBe('2')
        })

        it('renumbers sortOrder contiguously from 0 after reorder', () => {
          const onChange = vi.fn()
          render(<ProductMediaRows images={[img({ id: '1', sortOrder: 0 }), img({ id: '2', sortOrder: 1 }), img({ id: '3', sortOrder: 2 })]} onChange={onChange} />)
          fireEvent.click(screen.getAllByLabelText(/move up/i)[2])
          const next = onChange.mock.calls.at(-1)![0] as ProductImage[]
          expect(next.map((i) => i.sortOrder)).toEqual([0, 1, 2])
          expect(next.map((i) => i.id)).toEqual(['1', '3', '2'])
        })

        it('warns when a source is below 1200px on its long edge', () => {
          render(<ProductMediaRows images={[img({ id: '1' })]} onChange={vi.fn()} sourceDimensions={{ '1': { width: 900, height: 600 } }} />)
          expect(screen.getByText(/low resolution/i)).toBeInTheDocument()
        })
      })
