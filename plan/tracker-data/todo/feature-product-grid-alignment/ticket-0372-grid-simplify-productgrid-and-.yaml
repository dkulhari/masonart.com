      describe('ProductGrid', () => {
        it('uses the measured mesonart column counts', () => {
          const { container } = render(<ProductGrid products={[]} />)
          const grid = container.querySelector('ul')!
          expect(grid.className).toContain('grid-cols-2')
          expect(grid.className).toContain('md:grid-cols-3')
          expect(grid.className).toContain('xl:grid-cols-4')
        })

        it('uses the measured 20px / 13.5px gaps', () => {
          const { container } = render(<ProductGrid products={[]} />)
          const grid = container.querySelector('ul')!
          expect(grid.className).toContain('gap-x-[13.5px]')
          expect(grid.className).toContain('gap-y-5')
        })

        it('omits grid-flow-row-dense so DOM order equals visual order', () => {
          expect(src).not.toContain('grid-flow-row-dense')
        })

        it('no longer exposes ratio, column or gap configuration', () => {
          for (const dead of ['uniformAspectRatio', 'GRID_COLUMN_CLASSES', 'GAP_CLASSES']) {
            expect(src).not.toContain(dead)
          }
        })
      })
