      // reset() gains the two new fields:
      const reset = () =>
        useWishlistStore.setState({
          ids: [],
          isLoaded: false,
          isPending: false,
          isAuthenticated: null,
          inFlight: null,
        })

      // Every existing case inside describe('load') now needs a known session,
