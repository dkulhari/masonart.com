      //   useWishlistStore.setState({ isAuthenticated: true })

      describe('load', () => {
        it('makes one request when every card mounts in the same tick', async () => {
          // The isLoaded guard flips only after the await resolves, so concurrent
          // callers all sailed past it — six hearts were six 401s.
          useWishlistStore.setState({ isAuthenticated: true })
          const spy = stubFetch({ items: [{ id: PRODUCT_A }] })

          await Promise.all([
            useWishlistStore.getState().load(),
            useWishlistStore.getState().load(),
            useWishlistStore.getState().load(),
          ])

          expect(spy).toHaveBeenCalledTimes(1)
          expect(useWishlistStore.getState().ids).toEqual([PRODUCT_A])
        })

        it('does not touch the network before the session is known', async () => {
          const spy = stubFetch({ items: [] })

          await useWishlistStore.getState().load()

          expect(spy).not.toHaveBeenCalled()
        })
      })

      describe('setAuthenticated', () => {
        it('settles a signed-out visitor without a request', () => {
          const spy = stubFetch({ items: [] })

          useWishlistStore.getState().setAuthenticated(false)

          expect(spy).not.toHaveBeenCalled()
          // Loaded, so the hearts stop waiting and render empty.
          expect(useWishlistStore.getState().isLoaded).toBe(true)
          expect(useWishlistStore.getState().ids).toEqual([])
        })

        it('loads once when the session turns out to be signed in', async () => {
          const spy = stubFetch({ items: [{ id: PRODUCT_A }] })

          useWishlistStore.getState().setAuthenticated(true)
          await useWishlistStore.getState().inFlight

          expect(spy).toHaveBeenCalledTimes(1)
          expect(useWishlistStore.getState().ids).toEqual([PRODUCT_A])
        })
      })
