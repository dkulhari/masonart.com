ticket_number: 467
title: API - admin CRUD for collections
description: |-
  ## Task

  `/api/admin/collections`, behind the same staff-role middleware as `/api/admin/products`:

  - `GET /` — list with counts, including inactive ones
  - `GET /:id` — full row for the edit form
  - `POST /` — create, validated by `createCollectionSchema`
  - `PATCH /:id` — update, validated by `updateCollectionSchema`
  - `DELETE /:id` — delete, cascading its `collection_products` rows

  Every write busts the public collections cache. The style-derived endpoint never had to, because its input was a constants file; this one's input is a table, and a stale rail after an admin edit is the obvious first bug.

  Slug collisions return 409 with the offending slug, not a 500 from the unique index.

  ## Context

  Feature: curated-collections, Phase 4.

  Follow `packages/api/src/routes/admin/reviews.ts` — Hono app, `zValidator`, `requireAuth` + `requireAdmin`, `deleteCached` for cache busting. Mount with `app.route('/api/admin/collections', adminCollectionsApp)` in `packages/api/src/index.ts` alongside the other admin mounts.
