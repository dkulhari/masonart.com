ticket_number: 472
title: Admin - collections list with discover reorder
description: |-
  ## Task

  `/admin/collections` — the list view.

  Columns: title, slug, kind, resolved product count, active, in-discover, discover order. Row actions: edit, delete (confirm first), toggle active, toggle in-discover.

  Discover ordering is edited here, not on the form: ordering is a property of the set, not of any one collection. Reordering posts the whole ordered list to the transactional endpoint.

  Empty state points at the create button rather than rendering a headless table.

  ## Context

  Feature: curated-collections, Phase 6. Depends on the admin API tickets.

  Follow `packages/web/app/routes/admin/products/index.tsx` and `components/admin/ProductsTable.tsx` for the table, filter and pagination idiom. Add the nav entry in `packages/web/app/lib/admin-nav.ts` so the role-aware sidebar picks it up.
