ticket_number: 475
title: E2E - collection pages, the Discover rail and admin authoring
description: |-
  ## Task

  One feature-level spec at `tests/e2e/collections.spec.ts`.

  Storefront:

  - the rail on /posters renders chips and a chip navigates to `/collections/<slug>`
  - the collection page shows the collection's own H1 and description
  - a facet applied inside a collection narrows within it and never escapes it — the assertion that proves the intersection rule end to end
  - Best Sellers and Latest Work reach a populated grid, which no style facet could have expressed
  - an unknown slug 404s

  Admin:

  - create a rule collection, see the count preview, save it, and find it on the storefront
  - toggle show-in-discover and watch the chip appear in the rail

  ## Context

  Feature: curated-collections, final phase.

  Use `waitUntil: 'networkidle'` in `beforeEach`, per the repo convention in CLAUDE.md. Scope selectors for mobile vs desktop — the same test ids exist in both trees.

  Run with `--project=chromium --no-deps`; the auth setup project's admin/trade login is failing for unrelated reasons and blocks the whole run otherwise. The admin cases need a staff storage state, so check what `tests/e2e/auth.setup.ts` provides before writing them.
