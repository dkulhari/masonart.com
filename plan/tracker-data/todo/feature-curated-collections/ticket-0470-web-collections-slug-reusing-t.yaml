ticket_number: 470
title: Web - /collections/$slug reusing the collection-page shell
description: |-
  ## Task

  A real, crawlable page per collection at `/collections/$slug`.

  It reuses what /posters already has — beige header band with breadcrumbs and display H1, Discover rail, sticky toolbar with count and sort, facet rail, product grid, lazy paging — fed by `GET /api/collections/:slug` instead of `/api/products`.

  Differences from /posters:

  - H1, description and breadcrumb trail come from the collection row
  - facet counts are scoped to the collection
  - the rail marks this collection as current
  - unknown or inactive slug renders the 404, not an empty grid

  ## Context

  Feature: curated-collections, Phase 5. Depends on the detail endpoint and the chips ticket.

  Lift the shared shell out of `routes/posters/index.tsx` rather than copying it — a second 700-line copy of the collection page is how the two drift. Extract the common part into a component both routes render.

  `validateSearch` must coerce numbers and split comma-joined arrays. router.tsx overrides TanStack's search serialisation; a schema that assumes typed values error-boundaries the route to a blank page — the trap `posters/index.tsx` already documents.
