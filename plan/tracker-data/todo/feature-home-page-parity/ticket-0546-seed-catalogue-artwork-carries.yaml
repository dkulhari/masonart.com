      Priority critical -> low. Not blocking go-live for now, despite the blocks-go-live label still on the record — treat this comment as the authority over the label until someone reconciles them.

      What changes in the work right now: builders stop routing around watermarked catalogue imagery. That constraint was costing real choices — the #533 builder abandoned an otherwise good first pass that gave each promo tile a room-mockup from a product in its own destination, purely because Custom Art kept landing on a watermarked image. Watermarked artwork is acceptable in any band from here.

      What does not change: this is still a live production surface, not a quarantined folder like #544, so it should be revisited before launch rather than closed. Leaving the ticket open with the audit steps intact.
