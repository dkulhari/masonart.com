ticket_number: 546
title: Seed catalogue artwork carries a MESON ART watermark baked into the pixels
description: |-
  Found independently by the #531 and #538 builders, and it is more serious than the development placeholder photography in #544.

  Our seed product artwork is scraped from mesonart and several images have "MESON ART" burned into the pixels. This is not a folder we can git-ignore — it is product imagery already rendering on product cards, on the PDP, and now on the home page's popular tiles, where a tighter crop makes the watermark more legible rather than less. It is visible in the very first screenshots taken of our own home page at the start of this feature.

  Three of the eight collection representative tiles are affected. The #538 builder separately rejected `dev-reference/story/still.jpg` for the same reason — mesonart's wordmark and tagline burned into the frame.

  This is distinct from #544. #544 is about photography we deliberately borrowed and quarantined; this is a competitor's watermark inside our own catalogue records, reaching users through normal product surfaces.

  To close: audit the catalogue for watermarked artwork, and either replace those products' imagery or remove the affected records. Do not attempt to erase the watermark from the pixels — that does not resolve the underlying question of whose artwork it is.
