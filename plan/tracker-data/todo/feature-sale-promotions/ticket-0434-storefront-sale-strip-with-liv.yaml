ticket_number: 434
title: Storefront - sale strip with live countdown above the header
description: |-
  ## Task
  Beige strip above the announcement bar: promotion headline + `HH : MM : SS` counting to the resolved deadline. Renders `null` when no promotion is active — no hardcoded "40% OFF" string anywhere in the component.

  Also rewrite the omission comment at `AnnouncementBar.tsx:11-14` (the constraint survives, only the reason it was unbuildable expires) and update the parity analysis §3.1 row that records the strip as blocked.

  ## Context
  Part of feature: sale-promotions
  Phase: 4 — Frontend
  Design: `docs/superpowers/specs/2026-08-05-sale-promotions-design.md` §6, §7
  Closes: mesonart parity analysis §3.1 row 1

  Deadline comes resolved from the server (T10) — the component only formats and ticks down; it must not compute a window itself. The strip is NOT sticky: the header is `sticky top-0` and the collection toolbar sits at `top-16` assuming the header alone owns that offset (see the note in `AnnouncementBar.tsx`).

  Band colour is the existing `bg-band` token — do not introduce a new colour.
