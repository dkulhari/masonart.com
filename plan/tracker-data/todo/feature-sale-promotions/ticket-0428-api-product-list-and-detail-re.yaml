ticket_number: 428
title: API - product list and detail return the resolved sale price
description: |-
  ## Task
  Attach `sale: ResolvedSalePrice | null` to every product returned by the list and detail routes, resolved through `promotion-pricing.ts`. Load the exclusion and inclusion id sets once per request, not per product.

  `endsAt` must never appear in the response — assert it in the test, because the real end date leaking into the network tab defeats the countdown design (§6).

  ## Context
  Part of feature: sale-promotions
  Phase: 3 — API surfaces
  Design: `docs/superpowers/specs/2026-08-05-sale-promotions-design.md` §5, §7

  Routes: `packages/api/src/routes/products.ts`. Membership comes from the session (`isMember`), defaulting to `false` for guests until `gallery-membership` lands. Route tests mock `db` — see the header note in `tests/routes/product-facets.test.ts`; keep the schema-shape guard in `tests/database/` doing the real column checking.

  Redis caching already wraps the product list (`CacheKeys.PRODUCT_LIST`): the cache key must include member state, or a guest response gets served to a member.
