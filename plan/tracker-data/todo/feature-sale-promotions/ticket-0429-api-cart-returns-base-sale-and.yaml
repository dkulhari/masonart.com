ticket_number: 429
title: API - cart returns base, sale and locked per line without touching stored lineTotal
description: |-
  ## Task
  Cart read resolves sale pricing per line and returns `{ base, sale, locked }` alongside the stored figures, plus a cart-level saving total.

  **Stored `cartItem.lineTotal` stays a BASE price.** `routes/cart.ts:196-204` computes `(unitPrice + framePrice) * quantity` at add-to-cart time; baking a sale price into that column means a cart held across the end of a sale still charges sale prices. Sale is resolved at read time, every time.

  ## Context
  Part of feature: sale-promotions
  Phase: 3 — API surfaces
  Design: `docs/superpowers/specs/2026-08-05-sale-promotions-design.md` §5

  Carts support guests via the `GUEST_CART_COOKIE` session (`routes/cart.ts:272-276`), so `isMember` is false for them and every line comes back `locked` under a membersOnly promotion. `carts.couponCode`/`couponDiscount` (`schema/cart.ts:73-75`) stay unused — this feature has no codes (design D1).
