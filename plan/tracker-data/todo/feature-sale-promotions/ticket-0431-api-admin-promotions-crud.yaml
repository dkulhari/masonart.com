    code: |-
      /**
       * Admin CRUD for sale promotions.
       *
       * Writes invalidate the resolver's 60s cache, so enabling a sale is visible
       * on the storefront immediately rather than up to a minute later.
       *
       * `isActive` in the list response is DERIVED per row — there is no status
       * column to read (see schema/promotions.ts).
       */

      import { Hono } from 'hono'
      import { createPromotionInputSchema, updatePromotionInputSchema } from '@chobii/shared'
      import { db } from '../../database'
      import {
        promotions,
        promotionProducts,
        promotionExclusions,
      } from '../../database/schema/promotions'
      import { invalidateActivePromotions, isPromotionActive } from '../../lib/promotion-pricing'

      // GET / — list with derived isActive
      // POST / — create (validated), plus promotion_product / promotion_exclusion rows
      // PATCH /:id — update, replacing the pinned and excluded id sets in a transaction
      // POST /:id/enable, POST /:id/disable — toggle isEnabled
      // DELETE /:id
      // Every mutating handler ends with invalidateActivePromotions()
