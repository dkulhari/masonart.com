  - id: 3
    action: implement
    description: Re-resolve pricing server-side and write the discount, promotionId and limit check
    file: packages/api/src/routes/orders.ts
    status: pending
    code: |-
      // Replaces: const discount = "0.00"; // TODO: Apply coupon if provided

      const activePromotions = await getActivePromotions()
      const { includedIds, excludedIds } = await loadPromotionProductSets(activePromotions)
      const isMember = Boolean(user.galleryMember)

      let discountTotal = 0
      let appliedPromotionId: string | null = null
      const lineDiscounts = new Map<string, string>()

      for (const item of activeItems) {
        const sale = resolveSalePrice(item.product, activePromotions, {
          isMember,
          includedIds,
          excludedIds,
        })
        // locked === the viewer is not a member: they pay base. The gate cannot be
        // bypassed by holding a cart open through a logout.
        if (!sale || sale.locked) continue
        const perUnit = parseFloat(sale.basePrice) - parseFloat(sale.salePrice)
        const lineDiscount = (perUnit * item.quantity).toFixed(2)
        lineDiscounts.set(item.id, lineDiscount)
        discountTotal += parseFloat(lineDiscount)
        appliedPromotionId = sale.promotionId
      }

      if (appliedPromotionId) {
        const limit = activePromotions.find((p) => p.id === appliedPromotionId)?.perCustomerOrderLimit
        if (limit) {
          const used = await countSettledOrdersForPromotion(user.id, appliedPromotionId)
          if (used >= limit) {
            return c.json({ error: `This offer is limited to ${limit} order(s) per customer` }, 400)
          }
        }
      }

      // One bucket per source (design D8). `discount` is composed, not assigned:
      // the expression is then already correct on the day codes land.
      const promotionDiscount = discountTotal.toFixed(2)
      const couponDiscount = "0.00" // reserved for D8; nothing here writes it
      const discount = (
        parseFloat(promotionDiscount) + parseFloat(couponDiscount)
      ).toFixed(2)

      // ...and on the insert: promotionId: appliedPromotionId, promotionDiscount,
      // couponDiscount, discount, couponCode: null (no codes in this feature —
      // design D1), plus itemDiscount from lineDiscounts.
      //
      // Also: drop `couponCode` from the create-order zod schema (orders.ts:75),
      // and add promotionId / promotionDiscount to the order response mappings
      // (orders.ts:569-570 and admin/orders.ts:529-530), which already return
      // couponCode / couponDiscount.
