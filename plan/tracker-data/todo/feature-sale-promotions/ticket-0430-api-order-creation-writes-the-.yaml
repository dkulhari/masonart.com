ticket_number: 430
title: API - order creation writes the real discount and enforces the per-customer limit
description: |-
  ## Task
  Replace `const discount = "0.00"; // TODO: Apply coupon if provided` (`routes/orders.ts:268`). Order creation re-resolves sale pricing from the database, writes `promotionId`, a real `orders.discount`, and per-line `order_items.itemDiscount`, and enforces `perCustomerOrderLimit`.

  **The server is the only pricing authority.** Any price sent by the client is ignored. A non-member at order time pays base, so the gate cannot be bypassed by holding a cart open through a logout.

  Also stop storing an unvalidated `couponCode` from client input (`routes/orders.ts:298`) — this feature has no codes (design D1), so the field should not be written from request input.

  ## Context
  Part of feature: sale-promotions
  Phase: 3 — API surfaces
  Design: `docs/superpowers/specs/2026-08-05-sale-promotions-design.md` §5

  Order creation already requires an account (`routes/orders.ts` builds from `user.id`). `perCustomerOrderLimit` counts that customer's settled orders carrying the same `promotionId` — reuse the settled-order status logic from `lib/product-sales.ts` (`VOIDED_ORDER_STATUSES`).
