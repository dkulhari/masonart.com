ticket_number: 596
title: 'Mobile top bar layout parity: [menu][search] left, centred wordmark, [wishlist][cart] right, 56px'
description: |-
  ## Task
  The mobile top bar is structurally different from mesonart's, which is the first thing that reads as "not the same site" on a phone.

  Measured live on mesonart.com at mobile width (DOM, not screenshots):
  - bar height 56px (`header header--center`, sticky top:0, z=11)
  - left cluster: hamburger + search, icon hit boxes 35x44
  - wordmark absolutely centred at ALL widths
  - right cluster: wishlist (with count) + cart (with count)
  - no account icon in the bar — Account lives in the dock and the drawer footer

  Ours today (`packages/web/app/components/layout/Header.tsx:208`): 64px bar, wordmark LEFT on mobile (centred only from `md`), right cluster is cart + hamburger only. No search, no wishlist.

  ## Context
  - `Header.tsx:208` — `relative flex h-16 items-center justify-between md:justify-end`; drop `md:justify-end` and make the height `h-14 md:h-16`
  - `Header.tsx:215-217` — wordmark `Link`; the centring classes are `md:absolute md:left-1/2 md:-translate-x-1/2`, drop the `md:` prefixes
  - `Header.tsx:285-312` — the mobile action cluster to rebuild; search opens the existing `isSearchOpen` state, wishlist links `/wishlist` with `displayWishlistCount`, both already exist in the desktop cluster at `:240-281`
  - `HEADER_HEIGHT_CLASS` at `Header.tsx:51` is the shared contract with the collection toolbar's `sticky top-16` and `--chrome-offset`. Nothing sticky sits under the header below `md`, so keep the constant at `h-16` for `md`+ and only shrink the mobile bar — do not repoint the constant.
  - Existing structure test: `packages/web/tests/components/layout/Header.structure.test.tsx`
