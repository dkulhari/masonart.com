ticket_number: 599
title: 'Mobile drawer inventory: All Art, the 12 styles and the remaining pages, at mesonart''s 24px scale'
description: |-
  ## Task
  The mobile drawer is a second, independent nav tree and it carries far less than the desktop rows do. Today (`Header.tsx:569-627`) it is 7 page links at `text-base` plus Wishlist and Account. None of the 12 styles are reachable on a phone at all, and neither is All Art.

  mesonart's drawer carries 21 entries, in this order:
  All Art (chevron, opens a second sliding panel) · Best Sellers · New Arrivals · the 12 styles · Artists · Reviews · Sale · Trade Program · Commission Art · Gift Card · About

  Measured type: 24px, weight 300, letter-spacing -0.6px, colour rgb(23,23,23), row padding 10px 0.

  ## Context
  - Generate the styles from `STYLE_OPTIONS` in `@chobii/shared`, the way nav row 2 does at `Header.tsx:511` — twelve hardcoded links here would restart the drift #395 closed
  - `MobileNavLink` at `Header.tsx:726` carries the type; bump it to the measured scale rather than styling links inline
  - Sale already has its mobile half: `SaleMobileNavLink` at `Header.tsx:676` — promotion-gated, absent rather than disabled
  - All Art's submenu can reuse `AllArtMegaMenu`'s data source (`packages/web/app/components/layout/AllArtMegaMenu.tsx`); as a second panel inside the drawer, not the desktop mega panel
  - Only link to routes that exist — Artists / Trade Program / Commission Art / Gift Card may not all have pages yet; skip the ones that don't rather than shipping dead links
  - Depends on the left slide-in drawer ticket landing first
