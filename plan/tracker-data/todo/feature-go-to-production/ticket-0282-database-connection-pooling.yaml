ticket_number: 282
title: "Configure database connection pooling for production"
description: |-
  ## Task
  Ensure database connections are properly pooled to handle concurrent production traffic without exhausting connections.

  ## Requirements
  - Review current Drizzle/pg connection configuration
  - Set appropriate pool size (min: 2, max: 20, configurable via env)
  - Add connection timeout (30s)
  - Add idle connection timeout (10s)
  - Consider PgBouncer if hosting platform supports it
  - Add connection pool metrics to health check endpoint

  ## Environment Variables
  - `DB_POOL_MIN` — minimum pool size (default: 2)
  - `DB_POOL_MAX` — maximum pool size (default: 20)
  - `DB_POOL_IDLE_TIMEOUT` — idle timeout in ms (default: 10000)

  ## Files to Modify
  - `packages/api/src/database/index.ts` or connection config
  - `packages/api/src/routes/health.ts` (add pool metrics)
  - `.env.example`
