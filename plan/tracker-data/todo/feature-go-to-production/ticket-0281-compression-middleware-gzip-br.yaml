ticket_number: 281
title: "Add gzip/brotli compression middleware to API responses"
description: |-
  ## Task
  Add response compression to reduce bandwidth usage and improve load times.

  ## Requirements
  - Add compression middleware to Hono API server
  - Support both gzip and brotli (prefer brotli when client supports it)
  - Skip compression for already-compressed content (images, videos)
  - Minimum size threshold: don't compress responses under 1KB
  - Verify compression works with SSR responses from web server

  ## Implementation
  - Use `hono/compress` middleware or `@hono/compress`
  - Apply globally after CORS but before routes

  ## Files to Modify
  - `packages/api/src/index.ts`
  - `packages/web/` server config if needed
