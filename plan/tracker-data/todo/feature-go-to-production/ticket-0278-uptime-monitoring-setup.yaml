ticket_number: 278
title: "Set up external uptime monitoring for production"
description: |-
  ## Task
  Configure external uptime monitoring to detect outages before users report them.

  ## Requirements
  - Monitor /api/health endpoint every 60 seconds
  - Monitor web homepage every 60 seconds
  - Alert via Slack/email on downtime
  - Track uptime percentage (target: 99.9%)
  - Status page (optional but nice-to-have)

  ## Tools to Consider
  - UptimeRobot (free tier: 50 monitors)
  - BetterUptime (better status pages)
  - Checkly (supports API monitoring with assertions)

  ## Dependencies
  - Ticket #270 (health check endpoint) should be done first
