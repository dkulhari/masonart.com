    status: pending
    code: |-
      /**
       * Whether the viewer is in the gallery.
       *
       * Reads the flag better-auth ships in the session (additionalFields), so the
       * server already knows it at first paint — no flash of an unlocked price.
       *
       * This hook decides whether a saving reads as locked. It never decides what
       * the saving is: that number comes resolved from the API.
       */

      import { useSession } from '~/lib/auth-client'

      export type JoinSource = 'banner' | 'rail' | 'cart' | 'registration' | 'sale-page'

      export function useGalleryMembership() {
        const { data, isPending, refetch } = useSession()
        const isMember = Boolean(data?.user?.galleryMember)

        async function join(source: JoinSource) {
          const response = await fetch('/api/gallery/join', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ source }),
          })
          if (!response.ok) return false
          await refetch()
          return true
        }

        return { isMember, isLoading: isPending, join }
      }
