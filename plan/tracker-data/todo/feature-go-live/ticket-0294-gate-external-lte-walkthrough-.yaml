title: 'Gate: external LTE walkthrough + suites x2 + flip GO-LIVE-PLAN to LIVE'
description: |-
  Phase: Gate. The launch proof — every item verified against https://masonart.com from OUTSIDE the LAN (phone on LTE), results recorded here. Blocked by all other go-live tickets plus go-to-production #278 (uptime monitoring) and #283 (backups).

  Checklist (docs/GO-LIVE-PLAN.md §5):
  1. Signup → real Resend verification email → verify → login; SMS OTP login via 2Factor completes.
  2. Homepage/category/product pages render; images load from cdn.masonart.com.
  3. Cart → checkout → Razorpay test card 4111 1111 1111 1111 → webhook flips order to paid → confirmation email arrives → order in account history.
  4. Webhook redelivery from Razorpay dashboard is a no-op; failure card 4000 0000 0000 0002 yields clean failed state.
  5. AI generation: prompt → BullMQ job → image in R2 → renders via CDN → in user's creations.
  6. Admin: promoted admin reaches /admin; normal account 403s.
  7. Hardening: auth hammer → 429 (second device unaffected — proves per-IP buckets); CSP/HSTS headers present; forced error lands in Sentry + fires Slack; UptimeRobot green.
  8. Full unit + Playwright suites x2 green; merge; flip docs/GO-LIVE-PLAN.md status PLANNED → LIVE; record a launch exit statement listing owner-pending items (real Razorpay keys/pricing, cache-purge automation, CI).

  Acceptance: all items pass and are recorded; status flipped; exit statement written.
  Lesson: cc #86 gate pattern.
