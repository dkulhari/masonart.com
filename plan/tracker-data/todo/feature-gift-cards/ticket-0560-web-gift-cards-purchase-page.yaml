ticket_number: 560
title: Web - /gift-cards purchase page
description: |-
  ## Task
  A storefront page at `/gift-cards`: amount (presets plus a custom field, bounded ₹500–₹50,000), recipient email and name, sender name, optional message, optional send date capped a year out. Posts to `POST /api/gift-cards/purchase`, then hands off to the existing Razorpay payment flow with the returned `orderId`.

  ## Say what the customer is buying
  Two things belong on the page because they are surprising otherwise:
  - the card **never expires**
  - it can be spent across several orders; whatever is left stays on the card

  And one operational fact: the code goes to the recipient's email address, so a typo there is not recoverable by us.

  ## Context
  Part of feature: gift-cards
  Phase: 7 — Storefront
  Design: `docs/superpowers/specs/2026-08-06-gift-cards-design.md` §5, §10

  Bounds live in `packages/shared/src/schemas/gift-card.ts` — read them, do not retype the numbers.
