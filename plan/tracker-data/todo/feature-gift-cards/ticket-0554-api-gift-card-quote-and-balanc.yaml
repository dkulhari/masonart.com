  - id: 3
    action: implement
    description: Add the quote endpoint to the orders route
    file: packages/api/src/routes/orders.ts
    status: pending
    code: |-
      // POST /:id/gift-card — quote only. Nothing is debited here; the debit
      // happens at payment initiation under a row lock, because a quote taken now
      // may be hours stale by the time the customer pays.

      ordersApp.post(
        "/:id/gift-card",
        giftCardCodeRateLimit,
        zValidator("json", giftCardCodeInputSchema),
        async (c) => {
          const user = c.get("user");
          const order = await findOwnedOrder(c.req.param("id"), user.id);
          if (!order) return c.json({ error: "Order not found" }, 404);

          try {
            const quote = await quoteGiftCard(
              c.req.valid("json").code,
              toPaise(order.total),
            );
            return c.json(quote);
          } catch (error) {
            if (error instanceof GiftCardError) {
              return c.json({ error: error.message }, 400);
            }
            throw error;
          }
        },
      );
  - id: 4
    action: implement
    description: Add the balance endpoint and the shared rate limiter
    file: packages/api/src/routes/gift-cards.ts
    status: pending
    code: |-
      // An endpoint that answers questions about a bearer code is a free-money
      // oracle if left unthrottled. Same shape as otpRateLimit.
      const giftCardCodeRateLimit = rateLimit({
        windowMs: 60_000,
        max: 10,
        message: "Too many gift card attempts. Please try again shortly.",
      });

      giftCardsApp.post(
        "/balance",
        giftCardCodeRateLimit,
        zValidator("json", giftCardCodeInputSchema),
        async (c) => {
          try {
            const quote = await quoteGiftCard(c.req.valid("json").code, Number.MAX_SAFE_INTEGER)
            return c.json({ last4: quote.last4, balancePaise: quote.balancePaise })
          } catch (error) {
            if (error instanceof GiftCardError) return c.json({ error: error.message }, 400)
            throw error
          }
        },
      );
