    code: |-
      // Where the status transitions to 'cancelled' (~line 623), inside the same
      // transaction: a failed cancel must not credit the card.

      if (input.status === 'cancelled' && order.paymentStatus !== 'paid') {
        // Held balance goes back. Without this the customer silently loses it —
        // and a card with less money on it looks exactly like one that was spent.
        await voidGiftCardHold(tx, order.id)
      }
