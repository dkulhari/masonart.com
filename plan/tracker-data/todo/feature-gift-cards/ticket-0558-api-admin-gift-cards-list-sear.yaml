ticket_number: 558
title: 'API - admin gift cards: list, search, issue, disable, adjust, liability'
description: |-
  ## Task
  New `packages/api/src/routes/admin/gift-cards.ts`, admin-only.

  - `GET /` — paginated list with derived status, balance, recipient, purchase order link
  - `GET /?q=` — search by full code (hashed, then looked up) or by last four (indexed column)
  - `GET /:id` — card plus its full ledger
  - `POST /` — issue a card. **Returns the plaintext code once**, in this response and never again
  - `POST /:id/disable` and `/:id/enable` — toggle `disabledAt`; rows are never deleted
  - `POST /:id/adjust` — balance correction with a mandatory reason, mirroring `adjustWalletBalance` (`services/wallet.ts:652`)
  - `GET /liability` — total outstanding balance

  ## The liability figure is the point of the whole screen
  Unredeemed gift cards are money the business owes. That question currently has no answer at all. `SELECT SUM(balance_paise)` over non-disabled cards.

  ## No response may carry a full code
  Except the one-time issue response. Search by code takes a code in and returns a card — it must not echo it back.

  ## Context
  Part of feature: gift-cards
  Phase: 6 — Admin
  Design: `docs/superpowers/specs/2026-08-06-gift-cards-design.md` §9

  An adjustment without a reason is unauditable; make it required at the schema, not the UI.
