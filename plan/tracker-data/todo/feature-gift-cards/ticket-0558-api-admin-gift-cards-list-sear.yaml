    code: |-
      // Search accepts either form. A full code is hashed and looked up; the last
      // four hits the indexed column. Neither echoes a code back.
      const where = looksLikeFullCode(q)
        ? eq(giftCards.codeHash, hashGiftCardCode(q))
        : eq(giftCards.codeLast4, q.toUpperCase())

      // Liability: what the business owes in unredeemed cards. Disabled cards are
      // excluded — they cannot be spent.
      const [{ liabilityPaise }] = await db
        .select({ liabilityPaise: sql<number>`COALESCE(SUM(balance_paise), 0)::int` })
        .from(giftCards)
        .where(isNull(giftCards.disabledAt))
