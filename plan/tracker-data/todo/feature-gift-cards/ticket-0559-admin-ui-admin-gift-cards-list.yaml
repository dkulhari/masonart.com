ticket_number: 559
title: Admin UI - /admin/gift-cards list, detail and issue form
description: |-
  ## Task
  Three screens under `packages/web/app/routes/admin`, on the admin API from #gc-15.

  - **List** — last four, initial and current balance, derived status badge, recipient, purchase order link, search box accepting a full code or last four. **Total outstanding liability sits at the top**, because that is the number nobody can currently answer.
  - **Detail** — the card, its full ledger in date order, a disable/enable toggle, and a balance adjustment form with a required reason.
  - **Issue form** — amount, optional recipient and message. On success the generated code is shown **once**, with an explicit warning that it cannot be retrieved again.

  ## The one-time code display is the whole UX risk
  Only the hash is stored. An admin who closes that dialog without copying the code has lost it, and the recovery is to disable the card and issue a replacement. Say so on the screen, plainly, next to the code — not in a tooltip.

  ## Context
  Part of feature: gift-cards
  Phase: 6 — Admin
  Design: `docs/superpowers/specs/2026-08-06-gift-cards-design.md` §9

  Follow the existing admin route and table patterns; do not introduce a new table component.
