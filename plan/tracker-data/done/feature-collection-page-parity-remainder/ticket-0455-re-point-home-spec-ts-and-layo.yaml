      ✅ **Completed**

      **Commit**: `d8af6605` - test(e2e): re-point home and layout specs at the rebranded markup

      **Files Changed**:
      - `tests/e2e/home.spec.ts` — 7 cases re-pointed
      - `tests/e2e/layout.spec.ts` — 9 cases re-pointed

      **Summary**:

      home.spec.ts
      - `svg.fill-yellow-400` → `svg.fill-rating` (rating stars)
      - `.bg-brand-100.text-brand-600` → `.bg-highlight.text-foreground`, still count 4 (value-prop icons)
      - `.bg-white/10.backdrop-blur` → `.rounded-2xl.bg-background/10`, scoped to the AI section — `rounded-2xl` separates the icon scrim from the three feature boxes that share the tint at `rounded-lg`
      - `should have gradient background` → `should sit on the inverted band`. The brand gradient is gone; the section is `SectionBand tone="ink"`. Now asserts `bg-foreground` + `text-background` on the section AND that no `bg-gradient-to-*` survives on it — strictly more than the old case checked.
      - `.grid.grid-cols-2` matched three elements; scoped to `section:has(h2:has-text("Featured Collection"))` and narrowed to the ProductGrid `ul`
      - card title and price go through `getByTestId('card-content')` — the title is `p a[href^="/posters/"]` and the price sits beside it, per the pattern #448 established. Title case also gained `not.toHaveText('')`.

      layout.spec.ts
      - `nav a[href="/posters"]` → `getByTestId('pages-nav').locator('a[href="/posters"]')` — the styles row's "All Art" link shares the href (#401). 2 cases.
      - `header a[href="/account"]` → `header a[href="/account"][aria-label="Account"]` — the wishlist heart parks at /account until Phase F and the mobile drawer carries its own entry, so the bare href resolves to three. 4 cases.
      - footer shop links: `?style=abstract` → `?subjects=abstract`, `?style=botanical` → `?subjects=flowers`, `?style=minimalist` → `?styles=minimalist-art` (#452). The singular `?style=` was wrong before that ticket too.
      - theme-color `#f97316` → `#171717`. Decision resolved in favour of the rebrand: `__root.tsx` carries an explicit comment that it follows `--primary` and that leaving it orange put a strip of the retired palette above every page. The source is the intent; the test was the stale side.

      No assertion weakened. Nothing skipped or `fixme`d — the 9 skips in the run are the pre-existing `describe.skip('Root Layout - Responsive Design')` block and the `aria-expanded` case, untouched by this ticket.

      **Verification**:
      - Command: `bunx playwright test tests/e2e/home.spec.ts tests/e2e/layout.spec.ts --project=chromium --no-deps --workers=2 --reporter=line`
      - Result: PASS (153 tests — 144 passing, 0 failing, 9 skipped, 1.7m)
      - Baseline before the fix, same command: 128 passed, 16 failed, 9 skipped — the 16 being exactly the 7 + 9 the ticket measured.
