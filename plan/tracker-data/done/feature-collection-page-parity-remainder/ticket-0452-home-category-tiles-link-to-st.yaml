    text: |-
      ✅ **Completed**

      **Commit**: `089ffa41` - fix(web): category links point at facets that exist, and only when filled

      **Files Changed**:
      - `packages/web/app/lib/homeCategories.ts` — new; tile definitions carrying `group` + `id`, `categoryHref()`, `visibleCategories()`
      - `packages/web/app/routes/index.tsx` — loader reads `/api/products/facets` alongside featured products; `CategoriesSection` takes the filtered tiles and renders nothing when there are none
      - `packages/web/app/components/layout/Footer.tsx` — three Shop links had the same defect
      - `packages/shared/src/constants/facets.ts` — `typography` added to `SUBJECT_OPTIONS`
      - `packages/shared/tests/constants/facets.test.ts` — Subject 17 → 18, with the reason
      - `packages/web/tests/lib/homeCategories.test.ts` — new; 11 cases
      - `tests/e2e/home.spec.ts`, `tests/e2e/product-listing.spec.ts` — the `fixme` comes off; category cases follow the new links

      **Summary**:

      Per your call — keep the categories so new art has something to be filed under, show them only where artwork exists.

      A tile now carries the facet **group** as well as the value, because `abstract` filters as a subject and `minimalist-art` as a style. One `?styles=` for all four is precisely what broke them. A test walks `CATEGORY_TILES` and asserts each value is in the vocabulary its group names, so a dead tile is now a failing test rather than a link that quietly goes nowhere.

      Mapping: Abstract → `subjects=abstract`, Nature → `subjects=landscape` (there is no `nature`; landscape is what the tile's own photograph shows), Minimalist → `styles=minimalist-art`, Typography → `subjects=typography`.

      `typography` is a local addition to `SUBJECT_OPTIONS` — mesonart does not have it, and the parity test says so. A category the storefront advertises has to be one art can be tagged with; the vocabulary is what makes the tile *possible*, and the count is what makes it *visible*. Nothing carries it today, so the tile is hidden, and the admin form (driven by the same constants) now offers it when someone uploads a typographic piece.

      Visibility comes from `/api/products/facets`, fetched in the home loader via `Promise.allSettled` so a failing facets call costs the tiles and not the featured grid. No counts at all renders nothing rather than guessing — a tile onto an empty grid is the failure this ticket is about, and a transient blip should not reintroduce it. Live counts today: abstract 10, landscape 8, minimalist-art 5, typography 0 → three tiles, Typography hidden.

      **Found while here**: the footer's Shop column had the same three broken links. Fixed in the same commit; "Botanical" is now "Flowers", which is the subject it actually filters by — renaming it beat pointing it at something close enough.

      **Verification**:
      - `bunx vitest run` (shared) → PASS, 881 tests; (web `tests/lib` + `tests/components/layout`) → PASS, 263 tests including 11 new
      - `bunx playwright test tests/e2e/product-listing.spec.ts --project=chromium --no-deps --workers=2` → PASS, 115 expected, 0 unexpected, **0 skipped** — the `fixme` this ticket blocked is now a passing test, plus a new one asserting no tile exists for a category nothing carries
      - `tests/e2e/home.spec.ts` → every category case green. 7 failures remain, all pre-existing rebrand-era staleness (`fill-yellow-400`, `from-brand-600`, `bg-brand-100`, card `h3`/price, an unscoped `.grid.grid-cols-2`) — the same count as before this ticket, now filed as **#455** along with 9 in `layout.spec.ts`
      - API checked directly: `?subjects=typography` → 200, `?subjects=not-a-subject` → 400, so validation is live against the rebuilt vocabulary
      - Typecheck: 23 errors, unchanged count, none in the touched files
