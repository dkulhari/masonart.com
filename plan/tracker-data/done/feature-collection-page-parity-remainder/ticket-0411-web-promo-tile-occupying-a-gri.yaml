ticket_number: 411
title: Web - promo tile occupying a grid cell
description: |-
  ## Task

  mesonart drops an occasional promo tile into a grid cell (analysis §1.3.6). We have no such component anywhere.

  - `PromoTile` - a beige `SectionBand`-toned cell carrying the real catalogue review aggregate from `GET /api/reviews/stats`: "Rated 4.8/5 by 312 reviews" plus a pill link to reviews
  - Renders **nothing** when the aggregate is null or under the minimum review threshold. No rounded-up figure, no seeded number, no placeholder copy
  - `ProductGrid` gains an optional slot: a tile and the cell index it occupies. One tile per page-load slot, not one per row

  ## Context

  Part of feature: collection-page-parity-remainder
  Phase: 3 - Web
  Files: packages/web/app/components/product/PromoTile.tsx (new), ProductGrid.tsx, routes/posters/index.tsx

  **The square media contract is untouchable.** ProductGrid.tsx documents why `grid-flow-row-dense` was deliberately NOT carried over: it exists only to back-fill holes left by mesonart's multi-cell promo blocks. Ours occupies exactly one cell, so DOM order still equals visual order and dense flow stays off. The #360-#375 alignment E2E must stay green - the tile stretches with its row like a card does.

  The grid is a `<ul>` of cards; the tile is an `<li>` too, or the list semantics break.
