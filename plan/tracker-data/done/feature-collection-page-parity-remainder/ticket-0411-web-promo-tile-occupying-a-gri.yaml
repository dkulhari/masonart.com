      **Now renders with real data.** After #414 the catalogue aggregate is 4.5 from 12 approved reviews, which clears the ten-review threshold — the tile is visible rather than the permanently-dark component this ticket was originally going to ship.

      **One test was wrong.** The "does not round up" assertion used `/\b5\/5\b/`, which matches inside `Rated 4.5/5` — the string it was written to reject appears as a substring of the correct output. Replaced with assertions on the actual rendered text.

      **E2E path correction:** the specs live at the **repo root** `tests/e2e/`, not `packages/web/tests/e2e/`. Running playwright from `packages/web` fails with `Project(s) "chromium" not found. Available projects: ""` — there is no config there. Tickets #413 and the gates in PLAN-OF-ACTION.md both imply the package path.

      **Slot semantics:** `promo.node` may be null and an out-of-range index is ignored rather than appended — a promo dangling past the last product reads as a broken card. Both are covered.
