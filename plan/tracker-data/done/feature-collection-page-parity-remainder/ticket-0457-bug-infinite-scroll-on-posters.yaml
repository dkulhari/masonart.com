    description: Write a failing e2e test that scrolls into the append and asserts the position survives
    file: tests/e2e/product-listing.spec.ts
    command: ./scripts/run-tests.sh e2e --file=product-listing.spec.ts --grep="scroll position" --max-failures=1
    expected_result: FAIL — scrollY collapses to 0 once ?page=2 lands
    status: done
    code: |
      test('keeps the scroll position when the next page appends', async ({ page }) => {
        await page.goto('/posters', { waitUntil: 'networkidle' })

        // Far enough down that the sentinel's 400px rootMargin has fired
        await page.mouse.wheel(0, 2400)
        await expect(page).toHaveURL(/page=2/, { timeout: 10000 })

        // The append has to have actually happened, or this asserts nothing
        await expect
          .poll(() => page.evaluate(() => document.body.scrollHeight), { timeout: 10000 })
          .toBeGreaterThan(4000)

        // Give any restore time to land before reading the position
        await page.waitForTimeout(1500)
        const scrollY = await page.evaluate(() => window.scrollY)
        expect(scrollY).toBeGreaterThan(1000)
      })
  - id: 3
    action: verify-fail
    description: Confirm the test reproduces the jump
    command: ./scripts/run-tests.sh e2e --file=product-listing.spec.ts --grep="scroll position" --max-failures=1
    expected_result: FAIL
    status: done
  - id: 4
    action: implement
    description: Opt the append navigation out of scroll restoration
    file: packages/web/app/routes/posters/index.tsx
    status: done
    code: |
      navigate({
        to: '/posters',
        search: { ...search, page: pagination.page + 1 },
        replace: true,
        /**
         * Appending a batch is not a navigation the reader made — the router
         * would otherwise restore this location's stored position (0) and
         * throw them back to the first row mid-scroll.
         */
        resetScroll: false,
      })
