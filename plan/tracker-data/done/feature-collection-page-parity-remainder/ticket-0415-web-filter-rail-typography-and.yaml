ticket_number: 415
title: Web - filter rail typography and chrome parity (strip the box)
description: |-
  ## Task

  Our `/posters` filter rail reads as a bordered widget bolted onto the page; mesonart's is a bare column of type. Measured live on 2026-08-04 at 1440px, both sides, computed styles (not eyeballed).

  **Measured deltas — mesonart | chobii today**

  | Thing | mesonart | ours |
  |---|---|---|
  | Rail container | no box, no border, no radius, no background | `rounded-lg border border-border` (8px radius, 0.556px `rgb(226,232,240)` slate) |
  | Scroll | rail is `position: sticky; top: 0`, page scrolls | `sticky top-20 max-h-[calc(100vh-6rem)] overflow-y-auto` — a second scrollbar inside the rail |
  | Width | 300px | 256px (`w-64`) |
  | Rail header | none | `Filters (n)` + `Clear all` row, `p-4`, `border-b` |
  | Group divider | `border-bottom: 0.667px solid rgba(23,23,23,0.06)` — warm, hairline | `border-b border-border` = `rgb(226,232,240)`, a cool slate |
  | Group padding | summary has no horizontal padding, `padding-bottom: 21.9px` | head button `px-4 py-3` |
  | Group title | 400 weight, 16px | `font-medium` = Poppins 500, 16px |
  | Group count badge | none | filled `bg-primary` pill with the active count |
  | Option list | `display: grid; gap: 12px`, 22px rows | `space-y-1`, 32px rows |
  | Option label | 14px, no row padding, no hover fill | `rounded-md px-2 py-1.5 hover:bg-accent`, 14px/20px |
  | Option count | inline right after the label, `(788)`, 14px / lh 22.4px, `rgba(23,23,23,0.6)`, `gap: 4px` | separate right-aligned span at the far edge of the row |
  | Checkbox | 20x20, `border: 0.667px solid rgba(23,23,23,0.4)`, `radius 5px`, `appearance: none` | 20x20 (`h-5 w-5`), `rounded` 6px, `border-muted-foreground/30` |
  | Chevron | 20px icon, `transform` transition `0.5s cubic-bezier(.3,1,.3,1)` | lucide chevron, no measured easing |

  **Decisions taken (2026-08-04, with the user)**

  1. **Font: keep Poppins.** mesonart's rail renders in `AtacamaTrial VAR` — a serif, 400 weight, and the only place on their site that is neither Poppins nor Urbanist. It is a *trial*-licensed face, so copying it is a licensing problem and a fourth webfont. Match their metrics (sizes, weights, colours, rhythm), not their face.
  2. **Strip the chrome to match.** Drop the box, radius and inner scroll; drop the rail header row and the per-group count badges; warm hairline dividers; count inline in parentheses. `Clear all` is not lost — `ActiveFilterTags` already renders active filters as removable chips above the grid.

  ## Context

  - Rail wrapper: `packages/web/app/routes/posters/index.tsx:642` — the `sticky top-20 max-h-[...] overflow-y-auto rounded-lg border border-border` div. The `aside` above it at :635 carries `w-64`.
  - Rail internals: `packages/web/app/components/product/ProductFilters.tsx` — header row at :194, group wrapper/head at :333-354, checkbox visual at :400-403, option label at :416.
  - Mobile drawer shares this component (`ProductFilters` is rendered twice — desktop at :643, mobile at :1056). The drawer keeps its own header; only the desktop rail loses one. Scope the change so the mobile sheet does not lose `Clear all`.
  - The token guard (`tests/styles/storefront-token-compliance.test.ts`) is law: no `font-bold`, no `brand-*`. New hairline colour should come from a token, not a literal.
  - Tests: `tests/components/product/ProductFilters.facets.test.tsx`. E2E selectors scope by `div.hidden.lg\:block` — see the mobile/desktop duplicate-test-id gotcha in CLAUDE.md.
  - Analysis: `docs/design/mesonart/mesonart-parity-analysis.md` section 3.3 and section 1.3.4.
