      ✅ **Completed**

      **Commit**: `e69ac639` — feat(web): mesonart pill scale, fill-wipe hover and in-place sort panel (#416)

      **Files Changed**:
      - `packages/web/app/components/ui/Button.tsx` — new `size="pill"` (`h-14 px-[26px] font-normal`); `outline` variant's hover is now the circle wipe (`before:` pseudo, `scale-0` → `scale-100` on `--ease-primary`, label colour on a 0.1s delay) instead of `hover:bg-primary`
      - `packages/web/app/components/product/CollectionToolbar.tsx` — both pills to `size="pill"`; dot marker replaces `ChevronDown`; count `grow` beside the toggle; bottom rule and `justify-between` dropped; sort popover replaced by an in-place morph
      - `packages/web/tests/components/product/CollectionToolbar.test.tsx` — 12 new assertions

      **Summary**:
      The panel is anchored `right-0 top-0` over the trigger and animates `width`/`height`/`border-radius` from the pill's box. Its open size is computed from `SORT_OPTIONS.length` against named constants rather than hardcoded to their 320×469 — neither dimension transitions from `auto`, and our list is eight options where theirs is nine. A `requestAnimationFrame` flag gives the browser two states to interpolate.

      Kept click-to-open against their `hover-element`: a hover-opened menu has no touch or keyboard story. Hover fires the wipe only, and there is a test asserting hover does not open it.

      Verified in a real browser (headless chromium at 1440×900, driven directly): panel mounts at 246×87 mid-transition and settles at 320×336, page stays responsive, 8 options, console clean. The Chrome-extension tab freezes on interaction, but it did so before these changes too — not a product fault.

