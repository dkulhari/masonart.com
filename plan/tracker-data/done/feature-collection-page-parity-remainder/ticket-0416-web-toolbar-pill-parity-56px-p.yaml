ticket_number: 416
title: 'Web - toolbar pill parity: 56px pills, fill-wipe hover, in-place black sort panel'
description: |-
  ## Task

  Both toolbar controls are the right idea at the wrong scale, and the sort menu is a generic popover where mesonart's *is the pill*. Measured live on 2026-08-04, computed styles plus a driven open-state capture.

  **Rest state — mesonart | chobii today**

  | Thing | mesonart | ours |
  |---|---|---|
  | Pill size | 169x56 (Hide filters), 180x56 (sort) | 146x36 both (`buttonVariants size=sm`, h-9) |
  | Padding | `18px 26px` | `0 20px` |
  | Type | Poppins **400**, 16px / lh 16px | Poppins **500**, 14.95px |
  | Outline | `::after`, `2px solid rgb(23,23,23)`, `radius 60px`, inset 0 | `border: 1.67px solid rgb(23,23,23)`, `radius 60px` |
  | Sort affordance | a small dot marker after the label | `ChevronDown` icon |
  | Toolbar layout | `Hide filters` then the count immediately after it (`gap: 16px`, count is `grow`), sort hard right | `justify-between`, so the count floats to the centre |
  | Toolbar rule | no bottom border | `border-b border-border` + `bg-background/95 backdrop-blur` |
  | Count type | Poppins 300, 18px / lh 28.8px, full-strength `rgb(23,23,23)` | `text-sm text-muted-foreground` |

  **Hover** (both pills): a `.btn-fill` circle — `border-radius: 50%`, `background rgb(23,23,23)`, 480px wide, anchored off the pill's corner — wipes across on `background-color 0.5s cubic-bezier(.3,1,.3,1)`, while `.btn-text` goes to white on `color 0.5s cubic-bezier(.3,1,.3,1) 0.1s` (note the 0.1s delay, so the text flips after the fill lands). Ours: flat `background-color 0.3s`.

  **Sort open** — the menu is not a popover. The *same element* animates:

  - `180x56` to `320x469`, transition `width, height, box-shadow 0.5s cubic-bezier(.3,1,.3,1)`, `overflow: hidden`
  - `border-radius` `60px` to `32px`, padding `20.9px 26px`, `box-shadow: none`
  - surface goes black via the same fill circle; content is white
  - header `SORT BY`, 14px, `letter-spacing: 1.4px`, uppercase, white
  - 40px white `rounded-full` close button, top right
  - 8 options, white Poppins 400 16px, 32px rows; the current option renders dimmed rather than ticked
  - opens on **click** (hover only does the fill wipe)

  Ours: click opens `absolute right-0 mt-2 w-56 rounded-lg border border-border bg-background py-1 shadow-lg` with a `Check` icon on the current option.

  **Decision taken (2026-08-04, with the user): full copy** — fill wipe, in-place morph, black panel, caps label, close button, dimmed-current. Keep click-to-open plus keyboard: the existing outside-click and Escape handlers, `aria-haspopup="listbox"`, `aria-expanded`, `role="option"`/`aria-selected` all stay. Hover must not open the menu.

  ## Context

  - `packages/web/app/components/product/CollectionToolbar.tsx` — toolbar container at :100, Hide-filters button at :107, count `<p>` at :123, sort trigger at :127, popover at :139.
  - Both pills go through `buttonVariants({ variant: 'outline', size: 'sm' })` from `~/components/ui/Button`. A 56px pill is not `size="sm"`; decide whether this is a new size on the `Button` primitive (it is the mesonart button scale, so it likely belongs there and will be reused by the PDP CTA in Phase E) or a local override. Changing the shared primitive means checking its other call sites.
  - The fill-wipe wants a `.btn-fill`-equivalent span inside `Button`; `--ease-primary` / `--ease-fast` already hold the two measured curves, so use the tokens rather than re-typing the beziers.
  - `SORT_OPTIONS` and the `${sortBy}-${sortOrder}` id contract stay untouched — `routes/posters/index.tsx` splits on the hyphen.
  - Token guard applies: `primary` / `accent` / `band` tokens only, no `brand-*`, no `font-bold`.
  - Tests: `tests/components/product/CollectionToolbar.test.tsx`. Ticket #413 (E2E for chips, both new sorts, promo tile) is still open in this feature and asserts against the sort control — land this before or alongside it so the spec is written once.
  - Analysis: `docs/design/mesonart/mesonart-parity-analysis.md` section 1.3.3 and section 3.3.
