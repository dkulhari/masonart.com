    text: |-
      ✅ **Completed**

      **Commit**: `4f046f15` — feat(api): seed style collections plus Latest Work and Best Sellers

      **Files Changed**:
      - `packages/api/src/database/seed-collections.ts` — new. `buildSeedCollections()` (pure, DB-free) and `seedCollections()` / `countCollections()`.
      - `packages/api/src/database/seed.ts` — wired in after orders and reviews; summary now prints the collection count.
      - `packages/api/tests/database/seed-collections.test.ts` — 12 tests.
      - `packages/shared/src/index.ts` — see the gotcha below.

      **A real bug this ticket surfaced, not a seed problem**

      `packages/shared/src/index.ts` **enumerates schema modules** rather than re-exporting `schemas/index.ts`. #461 added the export to `schemas/index.ts` only, so `collectionRuleSchema` was unreachable through `@chobii/shared` — it imported as `undefined`, and nothing caught it because #461's own tests import from `../../src/schemas/collection` directly.

      Two consequences worth carrying forward:
      1. **Anything added under `src/schemas/` must be listed in `src/index.ts` as well.** The inner barrel is not in the resolution chain.
      2. **`@chobii/shared` resolves through `dist/`, not `src/`.** The API and web suites read the built output, so after touching shared you must run `cd packages/shared && npx tsc -p tsconfig.json` or the consumer sees the old module. This cost two failing runs here.

      **Verified against the real database, not just in unit tests**

      Ran `seedCollections()` twice through bun with `.env` loaded:
      ```
      Collections seeded. 14 inserted, 0 already present.   run 1 inserted: 14 total: 14
      Collections seeded. 0 inserted, 14 already present.   run 2 inserted: 0  total: 14
      ```

      Then read the rows back and resolved each through `countCollection()` from #463 — end-to-end proof that a sort-only rule resolves at all:

      ```
         9 wabi-sabi-art            5 plaster-and-texture-art    5 colorful-art
         4 minimalist-art           5 pop-art                    6 surrealist-art
         6 pollock-art              6 bohemian-art               5 expressionist-art
         6 hyperrealism-art         8 graffiti-art              11 ukiyo-e-art
        38 new                     38 best-selling
      ```

      The two sort-only collections resolve to all 38 active products, which is correct and is the case no facet-derived chip could ever produce.

      **Note on running this**: do NOT use `pnpm --filter @chobii/api seed` to test it. That entry point calls `clearData()` first and truncates the catalogue, which on this shared dev database would take out every other session's work. Call `seedCollections()` directly.

      **Verification**
      - Command: `cd packages/api && npx vitest run tests/database/seed-collections.test.ts`
      - Result: PASS — 12 tests, 0 failing
      - Build: `cd packages/shared && npx tsc -p tsconfig.json` — clean
