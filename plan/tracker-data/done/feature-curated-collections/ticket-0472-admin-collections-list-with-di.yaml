    text: |-
      ✅ **Completed**

      **Commit**: `9bf0dd95` — feat(web): admin collections list with discover reorder

      **Files Changed**:
      - `packages/web/app/routes/admin/collections/index.tsx` — new
      - `packages/web/tests/routes/admin/collections-list.test.tsx` — 10 tests

      **The sidebar entry already existed and pointed nowhere.** `AdminSidebar.tsx` has had `{ label: 'Collections', href: '/admin/collections' }` in `SECONDARY_NAV_ITEMS`, and `admin-nav.ts` already listed `/admin/collections` in `CONTENT_MANAGER_ALLOWED_PREFIXES` — both referencing a route that did not exist. No nav change was needed; this ticket is what makes the link land.

      **Decisions**
      - **Order is edited on the list, not the form.** It is a property of the set. "Position 3" on an individual collection's form invites two collections both claiming it, with nowhere sensible to resolve the tie. A note on the form says where to find it.
      - **Reordering is optimistic.** The arrows are the only affordance, and a round trip per click makes reordering ten collections feel broken. A failure sets the error and reloads from the server, so the list can never silently disagree with what was saved.
      - **The count column shows zero in red.** A rule matching nothing renders an empty page and its chip vanishes from the rail — invisible on the storefront, obvious here.
      - **Delete confirms, with different copy for hand-picked collections**, because the cascade takes the curation with it and that is not cheap to redo.

      **Verification**
      - Command: `cd packages/web && npx vitest run tests/routes/admin/ tests/components/admin/`
      - Result: PASS — 47 tests, 6 files, 0 failing
      - `/admin/collections` returns **307** — the admin route guard redirecting an unauthenticated request, which is the gate working
      - Build: `npx tsc --noEmit -p tsconfig.json` — clean

      **Not verified: the page rendered with a staff session.** `tests/e2e/auth.setup.ts` cannot currently log in as admin or trade (pre-existing, unrelated — it blocked the header E2E run earlier too), so there is no authenticated browser session to drive this with. The tests are source- and contract-level. #475 is where an authenticated pass belongs, and it will need that setup fixed first.
