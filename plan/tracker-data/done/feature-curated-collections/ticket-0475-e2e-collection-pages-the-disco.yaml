    text: |-
      ✅ **Completed**

      **Commit**: `a05977c0` — test(e2e): collection pages, the Discover rail and admin authoring

      **Files Changed**:
      - `tests/e2e/collections.spec.ts` — 16 tests, chromium
      - `tests/e2e/collections.admin.spec.ts` — 11 tests, `chromium-admin` (stored staff session)

      **The "broken auth setup" was not broken — it was rate limiting, and partly my fault**

      I recorded on #467 and #472 that `auth.setup.ts` could not log in as admin or trade, treating it as pre-existing and unrelated. The real error says exactly what is wrong:

      > `Login for test-admin@chobii.art was rate limited: 429 Too Many Requests … The auth limiter allows 5 requests/60s per IP and all local traffic shares one bucket, so four role setups exceed it. Start the API with DISABLE_RATE_LIMIT=true (the packages/api dev script does this) and retry.`

      `packages/api` has `"dev": "DISABLE_RATE_LIMIT=true bun run --env-file=../../.env --hot src/index.ts"`. I had restarted the API by hand with the bare `bun run` line and dropped the flag. Restarting via `npm run dev` fixed it: **all 4 setup projects pass**, which unblocked the authenticated admin spec this ticket needed. The correction matters for #467/#472, whose comments say an authenticated pass was impossible — it was not.

      **What the tests actually pin**

      The two regressions worth catching, each a named test:
      - `marks nothing current on /posters — it is not a collection` and `renders chips as links` — chips reverting to filter toggles
      - `a facet OUTSIDE the collection empties it, never widens it` — union instead of intersection, which would show ukiyo-e work under the Pop Art heading

      Plus the case no facet vocabulary can express: Best Sellers reaching a populated grid **and** its toolbar reading "Best selling" — which was a live bug until the API started returning `appliedSort`.

      The admin spec closes the loop: create a collection, confirm it in the admin table, then load `/collections/<slug>` and assert the `<h1>`. Also the inverse — a collection left out of the rail is reachable directly but absent from the chips.

      **Two locator mistakes, both mine not the code's**
      - `getByLabel('Title')` matched three fields ("Title", "Subtitle", "SEO title"); `{ exact: true }` fixes it.
      - The membership control is a radio, not a checkbox — `.check()` reported "Clicking the checkbox did not change its state".
      - `div.hidden.lg\:block` did not identify the desktop sidebar; `#collection-filters` (FILTER_SIDEBAR_ID) does, and is genuinely absent from the mobile tree.

      **Verification**
      - `npx playwright test tests/e2e/collections.spec.ts --project=chromium` → **16 passed**
      - `npx playwright test tests/e2e/collections.admin.spec.ts --project=chromium-admin` → **11 passed**
      - `npx playwright test --project=setup` → 4 passed

      **Cleanup**: the admin tests create real collections with stamped slugs. Two probe rows were deleted afterwards; the table is back to the seeded 14. The stamping means a re-run cannot collide on the unique slug, but the rows do accumulate — a fixture-level teardown would be better than my manual delete.
