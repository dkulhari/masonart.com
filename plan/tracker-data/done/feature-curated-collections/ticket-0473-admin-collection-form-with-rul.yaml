ticket_number: 473
title: Admin - collection form with rule builder and manual picker
description: |-
  ## Task

  `/admin/collections/new` and `/admin/collections/$id` — one form, both modes.

  Fields: title, slug (suggested from the title, editable, checked for collision before submit), subtitle, description, image URL, active, show-in-discover, SEO title and description.

  Kind switch:

  - **Rule** — a builder over the shared facet vocabulary: multi-select per facet group, price range, the AI/featured flags, and a default sort from `SORT_OPTIONS`. Every option comes from `@chobii/shared`; a hardcoded list here is the drift #395 ended.
  - **Manual** — a product search-and-pick list with drag ordering. Order is the data.

  Live count preview so the admin sees what a rule resolves to before saving — a rule that matches nothing is the failure mode worth catching at authoring time.

  Switching kind after products or a rule exist warns that the other side's data will be dropped, and does not drop it until save.

  ## Context

  Feature: curated-collections, Phase 6. Depends on the admin API tickets.

  Follow `packages/web/app/components/admin/ProductForm.tsx` for form idiom, validation surfacing and the create/edit split.

  The rule builder emits exactly `collectionRuleSchema`. Validate client-side with the same schema the API validates with, so the two cannot disagree.
