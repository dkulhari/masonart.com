    text: |-
      ✅ **Completed**

      **Commit**: `1735003b` — feat(web): admin collection form with rule builder and manual picker

      **Files Changed**:
      - `packages/web/app/components/admin/CollectionForm.tsx` — new. One form, both modes.
      - `packages/web/app/routes/admin/collections/new.tsx`, `$id.tsx` — thin wrappers.
      - `packages/web/tests/components/admin/CollectionForm.test.tsx` — 15 tests.

      **An accessibility bug the tests exposed, and the fix was in the component**

      Three slug tests failed with `Unable to find a label with the text of: /^Slug$/`. The cause was real: the `Field` helper nested the hint **inside** the `<label>`, so the accessible name became *"Slug The URL: /collections/…"*. A screen-reader user hears the whole sentence on every focus, and the field cannot be found by its actual name.

      Fixed properly — `htmlFor`/`id` pairing with the hint moved to `aria-describedby` — rather than loosening the test to match the broken markup. The failing test was right.

      **A test assumption that was wrong, not the code**

      `getByRole('button', { name: 'Colorful Art' })` threw on multiple matches. `colorful-art` is deliberately in **both** the Style and Subject vocabularies — mesonart's taxonomy overlaps there and `facets.ts` documents keeping it. Changed to `getAllByRole`, with a comment recording why, since the next person will hit it too.

      **Decisions**
      - **`FACET_GROUPS` drives the builder**, so the form cannot offer a facet the API would reject. A test asserts every group renders.
      - **The default-sort control is what makes Best Sellers authorable** — a rule that is a sort with no facets. Without it the form could only express what a facet id can, which is the limitation the whole feature exists to remove.
      - **Live count preview**, run against `/api/products` rather than the collection endpoint, because when creating a collection there is nothing to query yet and the rule is the same filter payload either way. Zero is called out in red.
      - **Switching kind warns but does not discard until save.** The other side's data stays in state, so a misclick is recoverable.
      - **409 is surfaced as the colliding slug**, not a generic failure — the admin needs to know which field to change.

      **Verification**
      - Command: `cd packages/web && npx vitest run tests/components/admin/CollectionForm.test.tsx`
      - Result: PASS — 15 tests, 0 failing
      - Build: `npx tsc --noEmit -p tsconfig.json` — clean

      **Known limitation, deliberately scoped**: the manual picker is a textarea of product IDs, one per line, not a search-and-drag interface. The ordering contract and the endpoint are fully wired — `PUT /:id/products` gets the array in order — but picking products by ID is not a usable authoring experience. A real picker needs a product search component that does not exist yet. Worth its own ticket; called out rather than left to be discovered.
