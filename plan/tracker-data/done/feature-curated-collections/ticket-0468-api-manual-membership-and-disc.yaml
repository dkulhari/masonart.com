    text: |-
      ✅ **Completed**

      **Commit**: `6df8873e` — feat(api): manual membership and Discover ordering

      **Files Changed**:
      - `packages/api/src/routes/admin/collections.ts` — added `PUT /discover-order` and `PUT /:id/products`.
      - `packages/api/tests/routes/admin/collection-membership.test.ts` — 13 tests.

      **Route registration order is load-bearing.** `PUT /discover-order` is registered **above** `/:id/products` and `/:id`. Hono matches in registration order, so below them the literal segment would be swallowed as a collection id. There is a test for it (`is not shadowed by the /:id route`) because the failure mode is a 404 that looks like a missing route rather than a routing-order mistake — the same trap `products.ts` documents for `/facets`.

      **Both operations are transactional, for different reasons**
      - **Reorder**: a per-row update loop that fails halfway leaves the rail in an order that never existed and nobody chose — worse than either the old order or the new one.
      - **Membership**: clear-and-reinsert inside one transaction, so a collection is never observable as empty midway through a reorder.

      **Validation happens before any write.** Unknown ids return 400 with the offending ids named, and `transaction` is never entered — asserted directly (`expect(transactionMock).not.toHaveBeenCalled()`), since "rejected" and "rejected after partially writing" are indistinguishable from the response.

      **A rule collection refuses an explicit member list** (400). Two sources of membership is the same problem the shared schema refuses on `kind`/`rule`: whichever the resolver honours, the other is a lie the admin can still see and edit.

      **Live database verification**

      ```
      before: wabi-sabi-art , plaster-and-texture-art , colorful-art
      after : colorful-art(0) , plaster-and-texture-art(1) , wabi-sabi-art(2)
      members: 0,1,2 => positions 0..n-1 in supplied order: true
      ```

      The reorder was reversed atomically and then restored, so the seeded rail order is unchanged. The membership probe collection was created and deleted.

      **Verification**
      - Command: `cd packages/api && npx vitest run tests/routes/admin/collections.test.ts tests/routes/admin/collection-membership.test.ts tests/routes/collections.test.ts tests/routes/collection-detail.test.ts`
      - Result: PASS — **56 tests**, 0 failing (13 membership, 23 admin CRUD, 8 rail, 12 detail)
      - Build: `cd packages/shared && npx tsc -p tsconfig.json` then `cd ../api && npx tsc --noEmit` — clean

      **Reminder for anyone touching shared**: `collectionMembersSchema` and `discoverOrderSchema` come from `@chobii/shared`, which resolves through `dist/`. Shared must be rebuilt before the API sees a new export (see #464).
