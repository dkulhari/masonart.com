implementation_steps:
  - id: 1
    action: implement
    description: "Extend beforeLoad in admin layout: allow content-manager, redirect /admin -> /admin/products for content-manager, mark non-allowed sections unauthorized"
    file: packages/web/app/routes/admin.tsx
    status: pending
    code: |-
      const CONTENT_MANAGER_ALLOWED_PREFIXES = [
        '/admin/products',
        '/admin/collections',
        '/admin/categories',
      ]

      // in beforeLoad, after the authentication check:
      const userRole = context.session.user.role?.toLowerCase()
      const isAdminRole = userRole === 'admin' || userRole === 'super-admin'
      const isContentManagerRole = userRole === 'content-manager'

      if (!isAdminRole && !isContentManagerRole) {
        return { user: context.session.user, isUnauthorized: true }
      }

      if (isContentManagerRole) {
        const path = location.pathname.replace(/\/+$/, '') || '/admin'
        if (path === '/admin') {
          throw redirect({ to: '/admin/products' })
        }
        const allowed = CONTENT_MANAGER_ALLOWED_PREFIXES.some(
          (p) => path === p || path.startsWith(p + '/')
        )
        if (!allowed) {
          return { user: context.session.user, isUnauthorized: true }
        }
      }

      return { user: context.session.user, isUnauthorized: false }
