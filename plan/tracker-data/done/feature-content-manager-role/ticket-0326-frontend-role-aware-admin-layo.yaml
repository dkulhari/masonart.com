ticket_number: 326
title: Frontend - Role-aware admin layout with content-manager section guards
description: |-
  ## Task
  Update the admin layout route so content-managers can enter the admin panel but only reach their allowed sections:
  - Allow `content-manager` past the role gate (currently hardcoded to admin/super-admin at `packages/web/app/routes/admin.tsx:52`)
  - Redirect content-manager hitting `/admin` (dashboard) to `/admin/products`
  - Per-section guard: content-manager navigating to a non-allowed path (orders, customers, reviews, returns, ai-*, analytics, settings) gets the existing UnauthorizedScreen
  - Allowed path prefixes for content-manager: `/admin/products`, `/admin/collections`, `/admin/categories`

  ## Context
  Part of feature: content-manager-role
  Phase: Frontend

  The layout uses TanStack Router beforeLoad (SSR-level guard) and already returns `{ user, isUnauthorized }` to the component, which renders UnauthorizedScreen. Extend that mechanism — do not build a new one. Frontend behavior is verified by the E2E phase; this ticket verifies via typecheck + build.
