ticket_number: 327
title: Frontend - AdminSidebar role-based nav filtering
description: |-
  ## Task
  Filter the admin sidebar navigation by role: content-managers see only Products, Collections, and Categories; admins see everything (unchanged).

  ## Context
  Part of feature: content-manager-role
  Phase: Frontend

  `packages/web/app/components/admin/AdminSidebar.tsx` defines nav item arrays (Dashboard, Products, Orders, Reviews, AI Moderation, Returns, AI Generations, Customers, Analytics, then Collections/Categories/Settings) and already receives a `user` prop including `role` from admin.tsx. Filter against the same allowed hrefs used by the layout guard (`/admin/products`, `/admin/collections`, `/admin/categories`) so the two stay consistent — consider exporting the allowed-prefixes constant from a shared location (e.g. `packages/web/app/lib/admin-nav.ts`) and importing it in both files. Also apply the filter to MobileAdminHeader if it renders nav items.
