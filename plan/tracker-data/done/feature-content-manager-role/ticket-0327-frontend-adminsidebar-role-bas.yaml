  - id: 1
    action: implement
    description: Create shared constant for content-manager allowed admin prefixes and helper to filter nav items by role
    file: packages/web/app/lib/admin-nav.ts
    status: pending
    code: |-
      export const CONTENT_MANAGER_ALLOWED_PREFIXES = [
        '/admin/products',
        '/admin/collections',
        '/admin/categories',
      ] as const

      export function isAdminNavItemVisible(role: string | undefined, href: string): boolean {
        const r = role?.toLowerCase()
        if (r === 'admin' || r === 'super-admin') return true
        if (r === 'content-manager') {
          return CONTENT_MANAGER_ALLOWED_PREFIXES.some(
            (p) => href === p || href.startsWith(p + '/')
          )
        }
        return false
      }
