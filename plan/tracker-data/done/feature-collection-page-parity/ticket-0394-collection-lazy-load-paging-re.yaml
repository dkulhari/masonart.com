ticket_number: 394
title: Collection - lazy-load paging replacing the numbered component
description: |-
  ## Task

  mesonart lazy-loads on scroll with no numbered pagination (analysis §1.3.7). Ours renders a `Pagination` component.

  Replace it with append-on-scroll, using an `IntersectionObserver` sentinel below the grid.

  ## Context

  Feature: collection-page-parity
  Last ticket of the feature — it changes how the grid is populated, so it lands after the card work.

  **Files**: `packages/web/app/routes/posters/index.tsx` (grid + `Pagination` at :521)

  **Constraints — the ones that make this non-trivial**
  - **The URL must stay shareable.** `?page=` is in the URL today and someone's bookmark depends on it. Appending pages must keep the deepest loaded page in the URL, not drop the param. `router.tsx` overrides search serialisation so params arrive as strings — page must keep being coerced to a number in `validateSearch` or the route error-boundaries to a blank page.
  - **Keep a keyboard/no-JS path.** Pure infinite scroll is unreachable by keyboard and invisible to crawlers. Render a real "Load more" button and let the observer click it; that keeps the SEO and a11y story intact.
  - **SSR renders page 1 only.** The loader must keep returning the first page server-side so the page is crawlable and first paint is not empty.
  - `ItemListJsonLd` currently describes the visible page; decide whether it describes page 1 or the accumulated set, and be consistent.
  - Re-run the grid E2E: it asserts row heights and column counts against the rendered grid, and appending changes how many cards are present.
