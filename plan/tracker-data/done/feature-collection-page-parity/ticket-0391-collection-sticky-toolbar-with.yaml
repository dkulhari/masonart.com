ticket_number: 391
title: Collection - sticky toolbar with hide-filters toggle, result count and sort pill
description: |-
  ## Task

  mesonart puts a sticky toolbar between the header band and the grid (analysis §1.3.3): a "Hide filters" outline pill on the left, the result count in the middle ("3878 products"), and "Sort by: Best selling" as a pill dropdown on the right.

  Ours has none of it. Sort is a radio list *inside* the filter sidebar — `SORT_OPTIONS` at `ProductFilters.tsx:133` — which is the one place mesonart does not put it.

  - **Hide-filters toggle** collapses the desktop sidebar and widens the grid. Persist the choice; a shopper who hides filters does not want them back on every navigation.
  - **Result count** moves here from `PageHeader`.
  - **Sort pill dropdown** replaces the sidebar radio list. Same six options for now — the missing three (Featured, Most relevant, Best selling) need a sales/relevance signal and are out of scope.

  ## Context

  Feature: collection-page-parity
  Blocked by the header ticket (which removes the count from `PageHeader`).

  **Files**: `packages/web/app/routes/posters/index.tsx`, `packages/web/app/components/product/ProductFilters.tsx`

  **Constraints**
  - Sort state already round-trips through the URL (`?sortBy=`), and `router.tsx` overrides TanStack search serialisation such that all search params arrive as strings — `validateSearch` must keep coercing. Do not regress that.
  - The toolbar is sticky; the header is already `sticky top-0 z-50`, so the toolbar's offset must clear it without overlapping.
  - Mobile already has `MobileFilterButton`; the hide-filters toggle is desktop-only. Do not duplicate the mobile affordance.
  - Use `Button variant="outline"` from the Phase A primitive rather than a hand-rolled pill.
