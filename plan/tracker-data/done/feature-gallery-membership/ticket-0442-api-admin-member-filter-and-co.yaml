    text: |-
      ✅ **Completed**

      **Commit**: `59642708` — feat(admin): gallery-member filter and a consented-only email export

      **Files Changed**:
      - `packages/api/src/routes/admin/customers.ts` — `galleryMember` filter on the list, new `GET /api/admin/customers/export`, shared filter builder, CSV writer
      - `packages/api/tests/routes/admin/customers.test.ts` — 17 added tests (39 total in file), 5 gallery fixtures
      - `packages/web/app/routes/admin/customers.tsx` — Gallery filter select, "Export consented" download button, Gallery column
      - `packages/web/tests/routes/admin/customers-gallery.test.ts` — 12 tests, new file (the API file was extended in place as instructed)

      **Summary**:
      The list gains a `galleryMember` filter and now carries the four membership
      columns per row. `GET /api/admin/customers/export` returns
      `email,name,galleryJoinedAt,marketingConsentAt,joinSource` as CSV.

      The rule that mattered: `isNotNull(users.marketingConsentAt)` is pushed onto
      the condition list *after* the caller's filters, so a query parameter can only
      narrow the export, never widen it. A `galleryMember` row with a NULL consent
      stamp never leaves the handler. The test `OMITS a gallery member that carries
      no marketingConsentAt` asks for that row three ways — unfiltered, via the
      fixture search, and with an explicit `?galleryMember=true` — and all three must
      come back without it.

      `joinSource` is a real column in the file, so a rail-recovered join (#446)
      reads as `rail` and not `banner`.

      Two decisions worth recording:
      - **The boolean is a two-word enum, not `z.coerce.boolean()`**, on both sides.
        Every non-empty string is truthy, so `galleryMember=false` would have meant
        `true` and "Not members" would have listed members. On the web side the
        unrecognised case resolves to `undefined` rather than throwing, because a
        throw in `validateSearch` error-boundaries the route to a blank page
        (`router.tsx` keeps every search param a string).
      - **CSV fields are RFC 4180 quoted and formula-neutralised.** Names are user
        input and this file is opened in a spreadsheet; a leading `=`/`+`/`-`/`@`
        gets an apostrophe. Both are pinned by fixtures (`Banner, "Quoted" Member`
        and `=cmd|/c calc`).

      The export is deliberately unpaginated — a partial mailing list is worse than
      none, because the missing half is invisible.

      **Verification**:
      - Command: `cd packages/api && DATABASE_URL=…@localhost:5440/poster_app_dev bunx vitest run tests/routes/admin/customers.test.ts`
      - Result: PASS (39 tests, 39 passing — baseline before this work was 22)
      - Command: `cd packages/web && bunx vitest run tests/routes/admin/customers-gallery.test.ts`
      - Result: PASS (12 tests, 12 passing)
      - Red step confirmed first: 14 failures for the right reasons (filter ignored, unknown value accepted with 200, `/export` 404)
      - `tsc --noEmit` clean for every touched file in both packages

      **Note for whoever runs these next**: the default `DATABASE_URL` in
      `packages/api/vitest.config.ts` points at port 5433 and fails auth; the real
      dev database is on 5440.
