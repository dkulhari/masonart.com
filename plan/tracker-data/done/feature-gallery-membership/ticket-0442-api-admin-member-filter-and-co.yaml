ticket_number: 442
title: API + Admin - member filter and consented-email export
description: |-
  ## Task
  `/admin/customers` gains a gallery-member filter and an export of the consented list: email, name, `galleryJoinedAt`, `marketingConsentAt`, `joinSource`.

  The export is the deliverable of D4 — the reason membership is an explicit opt-in rather than "has an account". Only rows with a `marketingConsentAt` are exportable; a member row missing consent is a bug, not a marketable address.

  ## Context
  Part of feature: gallery-membership
  Phase: 2 — API
  Design: `docs/superpowers/specs/2026-08-05-sale-promotions-design.md` §8, §9

  Extend the existing admin customers route and screen rather than adding a parallel one (`packages/api/src/routes/admin/customers.ts`, `packages/web/app/routes/admin/customers.tsx`). Tests: `tests/routes/admin/customers.test.ts` already exists — add to it.
