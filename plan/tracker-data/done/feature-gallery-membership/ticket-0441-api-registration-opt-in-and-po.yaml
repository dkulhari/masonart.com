ticket_number: 441
title: API - registration opt-in and post-auth auto-join from the join intent
description: |-
  ## Task
  Two entry points into membership:

  1. An opt-in on registration for people arriving the ordinary way — unchecked by default; consent that was never given is not consent.
  2. `?join=gallery` intent: a guest who took the offer is sent to registration carrying the intent, and on their first successful session is joined automatically with `joinSource: 'registration'` and returned where they were.

  The intent must survive the auth redirect — that is the part that breaks silently if it is only held in component state.

  ## Context
  Part of feature: gallery-membership
  Phase: 2 — API
  Design: `docs/superpowers/specs/2026-08-05-sale-promotions-design.md` §8

  Auth is better-auth (`packages/api/src/auth/index.ts`); hook the join into the post-signup path rather than reimplementing signup. Web routes are `app/routes/auth/register.tsx` and `login.tsx`. The intent should ride a short-lived cookie or the callback URL — not component state, which is lost on the OAuth round trip.
