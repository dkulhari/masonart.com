      ✅ **Completed**

      **Commits**: `e9cadeaf` feat(api): registration opt-in and post-auth auto-join from the join intent · `d60372b0` test(web): flush the Google click through act instead of waiting on it

      **Files Changed**:
      - `packages/api/src/services/gallery-membership.ts` (new) — #440's join write extracted so BOTH paths share it; the intent cookie name/value/lifetime; `hasJoinIntent`; `consumeJoinIntent`
      - `packages/api/src/routes/gallery.ts` — delegates to `joinGallery`, response shapes unchanged
      - `packages/api/src/auth/index.ts` — `databaseHooks.session.create.after` honours the intent
      - `packages/web/app/lib/joinIntent.ts` (new) — the short-lived cookie, SSR-safe, names matched to the API
      - `packages/web/app/routes/auth/register.tsx` — `parseRegisterSearch` (carries `join`/`email`/`redirect`), the opt-in checkbox, the unlock panel, email prefill
      - tests: `packages/api/tests/routes/gallery-join-intent.test.ts`, `packages/web/tests/routes/register-join-intent.test.tsx`

      **Summary**:
      `/auth/register` validated `{ redirect }` alone, so the `?join=gallery&email=` #444 sends was stripped on arrival. `parseRegisterSearch` is hand-written rather than a Zod object because router.tsx overrides TanStack's search serialisation — everything arrives as a string, and a throw inside `validateSearch` blank-pages the route.

      The opt-in is UNCHECKED by default; `?join=gallery` pre-checks it and shows what joining unlocks (no discount written down — the depth belongs to #432). The intent rides a 30-minute cookie written on arrival, so it survives the OAuth round trip and the "Sign in" link; unticking clears it. On the far side better-auth's `session.create.after` reads the cookie and joins with `joinSource: 'registration'` — session rather than user creation because email signup auto-signs-in while production requires verification first, and both end in a session. No cookie means no read and no write, so an ordinary sign-in costs nothing.

      An existing member arriving with a stale intent is reported, not re-joined: `marketingConsentAt` is never re-stamped. That guarantee now lives in one routine instead of one route handler, which is what the test suite asserts directly.

      **Verification**:
