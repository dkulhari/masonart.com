  Part of feature: saved-addresses
  Phase: Phase 3 - Frontend API Client
  Location: `packages/web/app/lib/api.ts`

  ## Testing Requirements
  No separate tests — tested via E2E.

  ## Acceptance Criteria
  - [ ] All 5 methods implemented with proper types
  - [ ] Follows existing API client pattern
  - [ ] Error handling consistent with other namespaces
