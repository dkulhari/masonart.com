title: Add addressesApi to web API client
description: |-
  ## Task
  Add `addressesApi` namespace to `packages/web/app/lib/api.ts` with methods:
  - `list()` — GET /api/addresses
  - `create(data)` — POST /api/addresses
  - `update(id, data)` — PATCH /api/addresses/:id
  - `remove(id)` — DELETE /api/addresses/:id
  - `setDefault(id)` — PATCH /api/addresses/:id/default

  Define response types. Follow the `notificationPreferencesApi` pattern with `credentials: "include"`.

