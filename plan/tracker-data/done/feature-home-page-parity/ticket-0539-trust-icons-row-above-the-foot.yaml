      This ticket put the trust row directly above the footer, which left the page making the same four claims twice: once in TrustIconsRow, larger and on white, and again immediately below in the footer's own USP strip. Saying a thing twice on one page halves it.

      Removed the strip from packages/web/app/components/layout/Footer.tsx. The claims and their provenance now live only in TrustIconsRow, where an existing test fails if the eco / unconditional-shipping wording this footer deliberately refused ever comes back — so the dedupe cannot silently reintroduce copy we rejected.

      Note this is a deliberate divergence from mesonart, whose footer does carry the strip. Theirs has no trust row above it.

      Verified: packages/web tests/components/layout/Footer.structure.test.tsx passing.
