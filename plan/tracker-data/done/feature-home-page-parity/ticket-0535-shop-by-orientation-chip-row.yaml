    text: |-
      Built as packages/web/app/components/home/ShopByOrientationSection.tsx (new file). Test: packages/web/tests/components/home/ShopByOrientationSection.test.tsx, 8 tests green. app/routes/index.tsx NOT edited — the band still needs wiring by the integration step. It supersedes nothing; there was no orientation section before.

      SOURCE OF TRUTH — ORIENTATION_OPTIONS from @chobii/shared. The component holds no literal list; the test fails if any vocabulary label reappears as a string literal there. Two things it does own, both surface properties rather than vocabulary ones, both commented in the file and pinned by the test:

        1. ORDER. Theirs leads Vertical, not Square. A rank map reorders a copy; any id the map does not name keeps its constant order at the tail, so a seventh orientation added upstream still gets a chip instead of vanishing.
        2. ONE LABEL. Their home pill reads "Circular" where their filter sidebar reads "Circle" — the parity analysis records the sidebar wording at §1.3 and facets.test.ts pins it, so renaming the constant would buy this band a word and cost the shipped collection page one. Override lives next to the surface that needs it.

      CONSTANT FIXED. ORIENTATION_OPTIONS read `option('set-of-2-3', 'Set of 2-3')`. Both mesonart's storefront and §1.3 of the parity analysis read "Set of 2/3" — a hyphen-for-slash transcription slip. Changed to 'Set of 2/3' in packages/shared/src/constants/facets.ts and rebuilt dist. No test pinned the old string; shared (927) and web ProductFilters.facets + AllArtMegaMenu (49) all still pass. Ids untouched, so nothing in the enum, schema or seed moves.

      LINK TARGET AND PROOF. `<Link to="/posters" search={{ orientation: id }} />` — the search object goes to the router, never a hand-built query string, which is what router.tsx's overridden serialisation would throw on. Same destination the All Art mega panel's Orientation column uses; there is no per-orientation collection row to link at (seed-collections builds one per style plus "new" and "best-selling").

      Verified live against the dev server, not assumed. Rendered hrefs: /posters?orientation=portrait|square|landscape|panoramic|round|set-of-2-3. SSR product counts on those URLs: unfiltered 41, portrait 15, square 13, landscape 9, panoramic 4 — which sums to exactly 41, so the facet partitions the catalogue rather than being ignored. All six return HTTP 200 with a real page (title, toolbar, grid), no error boundary.

      DATA GAP — round and set-of-2-3 return 0 products and render the honest "No products found" empty state. Nothing in the seed carries either orientation yet; the parity analysis already booked this ("add the missing orientation families (Circle, Set of 2/3) if we adopt those facets", §5.6/§6). Both chips are kept: they are genuine vocabulary values the API accepts, and dropping them would put four chips against their six. Worth a seed ticket.
