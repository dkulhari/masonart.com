ticket_number: 535
title: Shop By Orientation chip row
description: |-
  BAR: mesonart 'Shop By Orientation'. Left-aligned heading, then a single row of large soft-cream rounded pill chips: Vertical, Square, Horizontal, Panoramic, Circular, Set Of 2/3.

  OURS TODAY: missing entirely.

  The data already exists — ORIENTATION_OPTIONS in packages/shared/src/constants/facets.ts was built to mirror this exact list including set-of-2-3. Each chip links to the collection page pre-filtered on that orientation. Note the router coerces search params as strings, so build the links through the same helper the collection page uses. Desktop + mobile (mobile wraps or scrolls, chips stay tappable).
