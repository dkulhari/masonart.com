    text: |-
      MEASUREMENTS, taken off the bar PNGs by pixel rather than by eye, then re-measured on our own render at the same two viewports.

      Chip fill rgb(245 241 230). No token existed and globals.css is a shared file three other builders are in, so it is an arbitrary value with the measurement in the comment rather than a new --token. Hover darkens to bg-band, which is a real token one step down the same family.

      Desktop 1440 — theirs: chip 52px tall, 27px horizontal padding, fully rounded, single left row, 24.5px gaps, on white. Ours: 52px tall, px-7, rounded-full, gaps 24. Chip widths theirs 113/109/132/139/115/130 vs ours 117/113/136/143/119/134. Heading 44px: theirs runs 364px wide, ours 362 at text-display (the clamp lands on 44px at 1440, which is what that token was measured for). Heading-to-chips 18px theirs, 20px ours.

      Mobile 390 — theirs is NOT the desktop row wrapped. It is a two-column grid on a full-bleed sand band, rgb(219 216 194), which is exactly our --band-strong. Chips 167px wide, 40px tall, 16.5px column gap, 12.5px row gap, 20px gutter. Ours: 167 / 40 / gap-x-4 / gap-y-3 / 20px. Band height theirs 267.5px, ours 268. Band-top to first chip theirs 92px, ours 91.6.

      The band colour really does differ between their breakpoints — the desktop capture is white edge to edge through the same section, checked across the full width. So: bg-band-strong below lg, white from lg up.

      Their chip labels carry text-transform: capitalize, which is why theirs reads "Set Of 2/3" with a capital O. Reproduced with `capitalize` rather than by writing the capital into the label, so the vocabulary string stays the vocabulary's.

      Chip label weight: first pass at our body Poppins 300 measured 144k units of ink against their 203k over an identical 59x12px "Vertical" bounding box — same size, visibly lighter stroke. font-normal (Poppins 400, already loaded) brings it to 184k at the same 59px width. The residual ~9% is face, not weight; Poppins is our stand-in for their geometric sans across the whole storefront.

      GLOBAL FINDING, NOT FIXED HERE — mesonart's desktop page gutter is 48px; ours is 20px. Measured on their s01/s02/s03/s05 (48, 48, 48, 49.5) and on our own s01/s02 (20.5, 20). It is --page-padding in globals.css, measured at 20px during global-chrome-parity and correct on mobile (theirs 21.5 there), so something adds ~28px at desktop that the token does not carry. This band uses container-wide like every other, so it is inset 20px like every other; special-casing one band would misalign it from the page it sits in. Belongs to global-chrome-parity, not to #535.

      SMALLER FINDING, NOT FIXED HERE — `Orientation` in app/components/product/ProductFilters.tsx is a five-value union that predates set-of-2-3, and PostersSearchParams['orientation'] is typed from it. The sixth chip's search object is therefore typed Record<string, unknown> (same as AllArtMegaMenu does it) rather than naming that union, or the chip the API's own zod enum accepts would be a type error. Runtime is unaffected; the union is the thing that is behind.

      Verification artefacts in the shared scratchpad: shots/ours-orientation-desktop.png, shots/ours-orientation-mobile.png, and the side-by-sides shots/cmp-535-desktop.png and shots/cmp-535-mobile.png. To render them the section was mounted into app/routes/index.tsx for the duration of two screenshots and the file restored byte-for-byte afterwards (md5 edb4a6da56a0c57de49486cc7be0f3d8 before and after, git status clean on it). No throwaway preview route was added, so routeTree.gen.ts carries nothing of mine.
