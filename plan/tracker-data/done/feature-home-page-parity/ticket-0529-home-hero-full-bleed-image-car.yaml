    text: |-
      Blind A/B result: OURS WINS on both desktop and mobile. The critic did not know which page was which.

      Faults it named on the reference: three unrelated type treatments inside one three-line lockup (light wide teal geometric, heavy tight white grotesque, ultra-bold gold carrying both a white keyline and a drop shadow) reading as three one-offs from a discount banner; their CTA pill centred 145px right of the copy it belongs to; their nominally-centred stack drifting 21px left line by line so no two lines share an axis; their mobile inverting the hierarchy relative to their own desktop. It also caught their button rendering "SHOP All ART" — an uppercase transform failing to reach the middle word.

      Do not bank this as a clean win. The critic's own closeness note:

        "Mobile was close — A wins largely by not attempting type at all"

      We won by omission. Their hero carries a campaign message; ours carries a photograph and a pill, because the promotion lockup built here was removed after it double-printed against artwork already burned into the placeholder JPEG. A critic judging craft prefers a clean photograph to a badly set message. A merchandiser would say our hero says nothing.

      That is a substance gap per-band craft judging cannot see, and it does not close on this ticket. It closes when the placeholder imagery is replaced (#544) and a real campaign has somewhere to live (#543 owns the promotion data). Whoever picks those up should revisit the hero lockup — the removal was correct given burned-in artwork, and stops being correct once the artwork is ours.

      Two defects the critic named in OURS, against its own verdict, both properties of the placeholder image rather than the carousel:
      - the row seam at y=513 slices flat across the crown of a woman's head in the lower panel
      - the triptych's three desktop columns are 430 / 466 / 448 CSS px with zero gutter, so the butt-joins between tonally clashing frames read as accidents rather than a considered three-up

      The carousel geometry itself was verified correct against the live DOM — 1344x553 at x=48, neighbours at -1326 and 1422, an 18px peek each side. Both defects resolve with real imagery.
