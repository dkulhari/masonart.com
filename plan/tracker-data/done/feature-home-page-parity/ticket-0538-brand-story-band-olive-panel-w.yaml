    text: |-
      Built: packages/web/app/components/home/BrandStorySection.tsx (new file; app/routes/index.tsx untouched — integration step mounts `<BrandStorySection />`, no props).

      WHAT IT IS
      Full-width rounded sage band (`bg-band-strong`, radius 24px, inset 8px / 16px ≥sm). Desktop: left column = "Brand Story" heading, a one-line lead, a two-paragraph story, a "Read More →" outline pill; right column = a 25rem media panel, row-spanned so it fills the band top to bottom like the bar's still. Mobile: heading → media → lead → story → pill, which is the bar's own stacked order (checked against bar-mobile-s06/s07, not assumed).

      Geometry measured off bar-desktop-full at 1440 and bar-mobile-full at 390 (2x captures, halved): band inset ~7px, radius ~22px, padding 20px mobile / 40px desktop, media 394x364 sitting 64px below the band top and ~60px above its bottom, heading ~32px mobile / ~48px desktop. Ours renders media 398 wide, 64px top inset, 66px bottom inset, heading 30/48. Verified by screenshotting the band at 1440x900 and 390x844 through a throwaway preview route, which has been deleted; routeTree.gen.ts is back to exactly what it was (the residual diff there is two other builders' preview routes, left alone).

      NOT wrapped in SectionBand, deliberately: SectionBand nests `container-wide` (20px gutter) inside a full-bleed section, so the panel would inset 20px and then indent the copy another 20px inside it. At 390 that is a 40px gutter against the bar's 20px and the copy column visibly narrows. Vertical rhythm classes kept so it still sits in the page's spacing system. Flagging for #540's rhythm pass rather than fixing shared CSS mid-flight.

      COPY — ALL OURS, sourced not invented
      Every sentence is compressed from app/routes/about.tsx, which is the only place chobii.art already tells this story:
      - Lead "Great walls make great rooms." — About's own "built around one idea: great walls make great rooms".
      - Para 1 (curated styles, quality stock, frames/mats/glass) — About §"What we do".
      - Para 2 (AI generator: describe it, choose a style, order it as a print in the frame of your choice) — About §"Create your own with AI".
      The Footer blurb says the same in one line and agrees with both. mesonart's founder story (a named person, his friend, the platform he envisioned) is another company's history and is not paraphrased anywhere here — the band has no origin narrative at all, because we do not have one on record.

      "Read More" → /about. Not /our-story: docs/Requirement.md §list-of-pages names that route but it has never been built, and a pill pointing at a 404 is worse than one pointing at the shorter true page.

      MEDIA — placeholder, and #544 owns it
      No brand video and no owned interior photography exists. Ruled out on the way: /images/categories/*.jpg and /og-*.jpg are flat generated graphics, not photographs; catalogue `room-mockup` images look exactly right and are all seeded from .cache/seed-media, the third-party set the parity analysis §3.2 calls "fine to develop against, not fine to launch on" — every one carries a competitor's watermark straight across the artwork. /frames/*.jpg is the one real owned photography in the repo but it is 240px frame-corner macros, ~3.3x upscale in this slot.

      Per the coordinator's photography note, the slot now holds a development placeholder from the git-ignored public/dev-reference/ tree, routed through a single exported constant, BRAND_STORY_MEDIA, so replacing it is one line.

      It uses story/portrait.png, NOT story/still.jpg. They are frames of the same clip; still.jpg is the cover frame and has a competitor's wordmark and the tagline "Your Fisrt Choice For Personalizabled Original Art" burned into the pixels. The placeholder allowance covers borrowing a photograph, not shipping someone else's logo on our home page — and in a blind A/B it would have identified our band as theirs. portrait.png is the same room, clean, and its native 3:4 is exactly the ratio the bar crops to on mobile.

      No play affordance. A play triangle over a still promises a video we do not have; same rule as the copy.

      SUPERSEDES: nothing. This band is additive — it is the missing section, not a restyle. ValuePropsSection ("Why Choose chobii.art?") is #539's business (trust icons row); my call on the black AI band is in the next comment.
