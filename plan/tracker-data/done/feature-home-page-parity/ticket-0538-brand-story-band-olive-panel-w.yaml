    text: |-
      INTEGRATION DECISION — the black AI band is RETIRED. #538's first choice, taken.

      `AIGeneratorSection` (the `tone="ink"` "Create Your Own Masterpiece" band) is deleted from `app/routes/index.tsx`. The AI generator is now reached from the **Custom Art tile in the #533 promo row**, which #533 had already wired to `/create` (`CUSTOM_ART_DESTINATION` in `app/components/home/PromoTilesSection.tsx`, `to: '/create'`, verified in the file rather than taken from the ledger). So the precondition #538 attached to the fallback — "keep the section if #533 has no AI destination" — was never met: the destination existed before I started, and the first choice was already satisfied by the time integration ran. Nothing new had to be built to retire the band.

      WHY, restating #538's own reasoning because it holds up against the assembled page:
      1. Nothing on the reference home page is inverted. A full-width near-black band was the loudest object on our stack and it broke the white/beige/sage alternation every other band was built to sit inside. Screenshotted end to end at 1440 and 390, the page now alternates cleanly all the way down.
      2. The band was a second CTA competing with Brand Story's single "Read More". Two "here is who we are" panels 400px apart halved both.
      3. `/create` loses nothing: it is in the primary nav, the mega-menu, the footer Shop column, the mobile tab bar's Shop panel, AND now a 4:3 promo tile with an interior photograph — a better shopfront than a text band with three feature chips.

      Nothing about the generator itself changed; only the home page's way of pointing at it.

      FALLOUT HANDLED IN THIS PASS:
      - `tests/routes/home-tokens.test.ts` asserted `AIGeneratorSection` and `tone="ink"` were present ("deliberate survivals"). Those assertions are inverted now, with the reasoning above in the test: the guard is that the route has NO inverted band. The same file's "keeps the category legibility scrims" case was already red before I started — it asserted `from-slate-700/80`, a literal that lives in `~/lib/homeCategories`, not in the route — and went out with `CategoriesSection`.
      - `tests/routes/home-tokens.test.ts` now pins the band order and that none of the five superseded sections (`HeroSection`, `FeaturedProductsSection`, `CategoriesSection`, `AIGeneratorSection`, `ValuePropsSection`) is defined inline again.

      BAND AS SHIPPED: `BrandStorySection` mounts between `CustomerReviewsSection` and `NewsletterSection`, sage `bg-band-strong` panel, measured 668px tall at 1440 / 1234px at 390, `Read More` → `/about`, portrait from `BRAND_STORY_MEDIA`. Renders correctly in both captures.
