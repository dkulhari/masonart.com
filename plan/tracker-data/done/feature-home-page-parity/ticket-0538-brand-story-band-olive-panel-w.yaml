    text: |-
      CALL ON THE BLACK AI BAND ("Create Your Own Masterpiece", AIGeneratorSection in app/routes/index.tsx ~L424).

      Recommendation: it STAYS as its own section — do not fold it into Brand Story — but it MOVES up into the merchandising stack and comes off `tone="ink"`. I have not touched it; the integration step should act on this.

      Concretely, in preference order:
      1. Best: it becomes the "Custom Art" tile in the three-promo-tile row (#533), and the standalone full-width band retires. The bar's promo row is On Sale / Quick Ship / Custom Art — mesonart already reserves a slot in that row for a made-to-order offer, and our AI generator IS our custom-art offer. That is the structurally correct home for it, and it lands above the brand copy where the bar puts every commerce CTA.
      2. If #533 ships without an AI destination: keep the section, restyle it from `tone="ink"` to `tone="beige"`, and place it after the New In rail and before Featured Artists. Same job, inside the band alternation.

      Why not fold it into Brand Story:
      - The bar's brand band has exactly ONE call to action, the Read More pill. Adding "Start Creating" would give this band two CTAs of different intent, and the band would stop being a story and start being a landing page. That is a straight loss in the blind A/B.
      - The story already carries the AI generator, in the right register: paragraph two is "when the piece you are picturing does not exist yet, our AI generator makes it", and Read More → /about opens onto the page where that is explained at length. That is the correct dose of AI in a brand-voice block — narrative, not conversion.

      Why not leave it where it is:
      - Nothing on mesonart's home page is inverted. The page is white / sage / cream bands with a lot of air; a full-width near-black band at 1440 is the loudest object on our page and it breaks the alternation #540 exists to establish. Whatever else is true, it will lose a band-vs-band comparison against a page that never goes dark.
      - Its current position (after Shop by Style, before Value Props) puts a marketing interstitial in the middle of the merchandising rails, which is precisely where the bar is densest with product. The bar runs roughly eight product/collection rails before any brand copy at all.
      - Restyling it is not the same as deleting our differentiator. The parity analysis §3.2 says to keep the AI banner as our differentiator, and both options above keep it — one as a promo tile, one as a beige band. What goes is the inverted treatment, not the offer.

      Not blocking on this: BrandStorySection is complete and correct whichever way the AI band goes, and it supersedes nothing.
