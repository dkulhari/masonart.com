  - id: 3
    action: implement
    description: Resolve sale pricing at cart read time and add the saving total
    file: packages/api/src/routes/cart.ts
    status: done
    code: |-
      // In getCartWithItems / the GET handler, after items are loaded.
      // Stored lineTotal is untouched — it is the base figure and stays that way.

      const activePromotions = await getActivePromotions()
      const { includedIds, excludedIds } = await loadPromotionProductSets(activePromotions)
      const isMember = Boolean(user?.galleryMember)

      let saving = 0
      const items = cartWithItems.items.map((item) => {
        const sale = resolveSalePrice(item.product, activePromotions, {
          isMember,
          includedIds,
          excludedIds,
        })
        const base = parseFloat(item.lineTotal) || 0
        const saleLineTotal = sale
          ? ((parseFloat(sale.salePrice) + parseFloat(item.framePrice ?? '0')) * item.quantity).toFixed(2)
          : null
        if (sale && !sale.locked && saleLineTotal) saving += base - parseFloat(saleLineTotal)

        return {
          ...item,
          pricing: {
            base: item.lineTotal,
            sale: saleLineTotal,
            locked: sale?.locked ?? false,
            headline: sale?.headline ?? null,
            percentOff: sale?.percentOff ?? null,
          },
        }
      })

      return { ...cartWithItems, items, savingTotal: saving.toFixed(2) }
