    text: |-
      ✅ **Completed**

      **Commit**: `d896d440` - feat(api): cart resolves sale at read time, stored lineTotal stays base

      **Files Changed**:
      - `packages/api/src/routes/cart.ts` — read-time sale resolution, `savingTotal`, viewer-keyed cache, widened product projection
      - `packages/api/tests/routes/cart-sale-pricing.test.ts` — new, 15 tests

      **Summary**:
      GET /api/cart returns `pricing: { base, sale, locked, headline, percentOff }` per line plus a cart-level `savingTotal`. Stored `lineTotal` is untouched on both paths — the read never writes, and a PATCH mid-sale still stores `(unitPrice + framePrice) * quantity`, which a test pins.

      **Spec deviation, deliberate** — the ticket's step-3 snippet used `sale.salePrice`, resolved from `product.basePrice`, as the line's sale unit price. A cart line is priced from the *variant* (`cartItems.unitPrice`, schema comment: "Variant base price"), so on any variant above the base size that snippet charges far less than the discount: a 40000.00 A1 print under a 40% sale would have come out at 15180.00 instead of 24000.00. Implemented instead as `resolveSalePrice({ ...item.product, basePrice: item.unitPrice }, ...)` — the resolver still owns eligibility, exclusions, the member gate and the half-up rounding; only the base it works from is the line's own unit price. Matches design §5's layering ("1. line base price − 2. promotion discount per line"). Test: *discounts the line off its own variant price, not the product base price*. **Order creation (#430) should apply the same rule** or the cart and the order will disagree.

      Two other notes:
      - The product projection gains `styles`, `subjects`, `rooms`, `isFeatured`, `basePrice` (gotcha 3 from #428). Without them a filter-scoped promotion prices the PDP and not the cart.
      - Member-keying the cart cache breaks `deleteCached(`cart:<id>`)` in `updateCartTotals` and `/merge`, which would have left mutations invisible for the 5-minute TTL. Both now go through `invalidateCartCache`, which drops the `:guest` and `:member` entries together; a test pins that.

      Frame price stays undiscounted (the sale is on the artwork); locked lines show their sale price but contribute 0 to `savingTotal`; saved-for-later lines are priced but excluded from the total, as `subtotal` excludes them.

