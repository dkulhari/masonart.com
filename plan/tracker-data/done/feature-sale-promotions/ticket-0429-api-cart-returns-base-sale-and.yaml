      Two gotchas found while implementing #427 (commit 4a998e91) — both bite this ticket:

      **1. Product facets are arrays, not scalars.** `products.styles`, `products.subjects`, `products.rooms` are `text[]` (`packages/api/src/database/schema/products.ts:111-114`). The `PricedProduct` type sketched in these tickets declared singular `style`/`subject`/`room`. The resolver now normalises both shapes via `facetValues()`, so pass the product row through as-is — do not hand-map singular fields, and do not write a test fixture with singular values only, or it will pass against a schema that cannot occur.

      **2. `@chobii/shared` needs a rebuild before its new types resolve.** #424 landed the source but `dist/` is gitignored and stale, so `tsc` rejects imports of `ResolvedSalePrice` / `PromotionScopeFilter` until you run `cd packages/shared && bunx tsc`. Build output only — no source change, nothing to stage.
