ticket_number: 433
title: Admin UI - /admin/promotions list and editor
description: |-
  ## Task
  Admin screen to configure a sale: list of promotions with derived active state, plus an editor covering name, headline, depth, scope (all / filter / product picker), exclusion picker, `membersOnly`, start and end, `isEnabled`, `priority`, `perCustomerOrderLimit`, and the countdown block.

  The countdown block carries the §6 note inline in the form — whoever configures the sale should see what `countdownMode: rolling` actually does before switching it on.

  ## Context
  Part of feature: sale-promotions
  Phase: 4 — Frontend
  Design: `docs/superpowers/specs/2026-08-05-sale-promotions-design.md` §9

  Follow existing admin route patterns (`app/routes/admin/products`, `app/routes/admin/reviews.tsx`) and their shadcn/ui form idiom. Consumes the T9 endpoints. Remember the search-param gotcha: `router.tsx` overrides TanStack search serialization, so any `validateSearch` schema must coerce numbers and split comma-joined arrays or the route error-boundaries to a blank page.
