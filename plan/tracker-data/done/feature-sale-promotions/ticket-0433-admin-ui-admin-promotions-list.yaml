    text: |-
      ✅ **Completed**

      **Commit**: `dd636345` — feat(web): admin promotions list and editor

      **Files Changed**:
      - `packages/web/app/routes/admin/promotions/index.tsx` — list, derived state badge, enable/disable/delete, state+scope+text filters via search params
      - `packages/web/app/routes/admin/promotions/$id.tsx` — editor; `new` creates, any other id loads and PATCHes
      - `packages/web/tests/routes/admin/promotions.test.tsx` — 48 tests
      - `packages/web/app/routeTree.gen.ts` — the two routes registered under /admin
      - `packages/web/app/components/admin/AdminSidebar.tsx` — Promotions nav entry (admin-only; not in CONTENT_MANAGER_ALLOWED_PREFIXES, so content-managers do not see it)

      **Summary**:
      - `isActive` is read from the API, never re-derived. `promotionState()` only distinguishes the shades the API does not name: off > live (server's answer) > scheduled/ended by the clock.
      - The editor validates with `createPromotionInputSchema` from `@chobii/shared` directly rather than restating its rules; zod issue paths are collapsed onto the top-level field.
      - `fromAdminPromotion` loads BOTH membership sets, because PATCH replaces both wholesale — the collections-form bug (loading without members and wiping them on save) would repeat here as silently un-excluding products.
      - Filter scope renders only styles/subjects/rooms (the three axes `promotionScopeFilterSchema.strict()` accepts), derived from `FACET_GROUPS`.
      - §6 note is the countdown selector's `aria-describedby` hint, so it sits with the control: rolling is a per-visitor cookie clock that re-mints on the next load, nothing ends at zero; real counts down to the end date for everyone.
      - Empty state reports the storefront, not the database: "No sale is running." plus what that means for the strip, countdown, badges and announcement bar. The same line shows above the table when rows exist but none are live.
      - Search schema splits comma-joined arrays (copied from /admin/customers' roleListParam) and `.catch()`es every field so a mangled URL drops the filter instead of blanking the route.

      **Verification**:
      - Command: `cd packages/web && bunx vitest run tests/routes/admin/promotions.test.tsx`
      - Result: PASS (48 tests, 48 passing, 0 failing)
      - Command: `cd packages/web && bunx tsc --noEmit`
      - Result: 22 errors total, none in any file this ticket touched (baseline is ~26)
