      Interim assumption for the totals block, pending #510 (DECISION NEEDED — subtotal semantics and free-shipping threshold):

      `orders.subtotal` stays GROSS (sum of base line totals, unchanged from today) and `total = subtotal + shipping − discount + tax` keeps subtracting the discount exactly once. The free-shipping threshold therefore keeps reading the gross figure, as it does today.

      Chosen because it changes nothing that already exists: the only new money movement is the promotion discount itself. §5 of the design doc reads as though subtotal becomes net — following that literally while `total` still subtracts `discount` would take the promotion off twice.

      If #510 lands on net subtotal or a net threshold, the totals block in `routes/orders.ts` is the single place that changes.
