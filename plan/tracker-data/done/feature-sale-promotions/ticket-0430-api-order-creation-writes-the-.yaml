    text: |-
      ✅ **Completed**

      **Commit**: `059f1ee0` - feat(api): order creation writes the real promotion discount

      **Files Changed**:
      - `packages/api/src/routes/orders.ts` — `resolvePromotionDiscounts()` + `countSettledOrdersForPromotion()`; totals block writes `promotionId`, `promotionDiscount`, derived `discount`, per-line `itemDiscount`; `couponCode` dropped from the input schema and written as null; create + detail responses carry the promotion figures
      - `packages/api/src/routes/admin/orders.ts` — admin order detail returns `promotionId` / `promotionDiscount`
      - `packages/api/src/lib/product-sales.ts` — `VOIDED_ORDER_STATUSES` exported so "settled" means one thing
      - `packages/api/tests/routes/order-promotion-pricing.test.ts` — new, 21 tests
      - `packages/api/tests/routes/orders.test.ts` — the coupon-code validation block replaced; it described a schema field that no longer exists

      **Summary**:
      Order creation re-resolves every line through `promotion-pricing` and ignores anything the request says about money. Per the mid-flight correction from #429 (`d896d440`), the discount comes off the line's own `unitPrice` — `resolveSalePrice({ ...item.product, basePrice: item.unitPrice }, ...)` — so cart and order quote the same total for the same basket; the frame stays at full price, matching `priceCartLine`. A non-member at order time gets `locked` and pays base.

      `perCustomerOrderLimit` counts the customer's settled orders (`payment_status = 'paid'`, status not in `VOIDED_ORDER_STATUSES`) under the same `promotionId`, one count per promotion actually in play — an unlimited promotion asks the database nothing. Past the limit the order still goes through at base rather than being refused at the till.

      Money model as specified: `itemDiscount` per line → `promotionDiscount` their sum → `discount` composed from `promotionDiscount + couponDiscount`, which stays `'0.00'`. Interim totals assumption honoured — `subtotal` gross, discount subtracted once in `total`, `calculateShippingCost` untouched (a test pins the free-shipping threshold reading the gross figure).

      Two judgement calls worth recording: the frame's `priceAddition` is never discounted (a promotion scopes over products, and frames are not products — and this matches what #429 landed), and when two promotions somehow price one basket the deepest contributor is what `orders.promotionId` records, since one column cannot hold both.

