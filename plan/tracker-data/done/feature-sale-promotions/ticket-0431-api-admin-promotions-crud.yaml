      ✅ **Completed**

      **Commit**: `a9cdf9df` - feat(api): admin CRUD for sale promotions

      **Files Changed**:
      - `packages/api/src/routes/admin/promotions.ts` (new) - admin-guarded CRUD router
      - `packages/api/tests/routes/admin/promotions.test.ts` (new) - 28 tests
      - `packages/api/src/index.ts` - mounted at `/api/admin/promotions` (4-line addition)

      **Endpoints**:
      - `GET /` — list, ordered by priority then recency, with derived `isActive` and both membership sets
      - `POST /` — create (201), validated by `createPromotionInputSchema`
      - `PATCH /:id` — update, replacing the pinned and excluded sets
      - `POST /:id/enable` | `POST /:id/disable` — toggle without resending a whole body
      - `DELETE /:id` — membership rows cascade

      **Design notes**:
      - Every mutating handler ends with `invalidateActivePromotions()`, so an enable is visible on the storefront immediately rather than up to 60s later.
      - `isActive` is computed per row via `isPromotionActive(row, now)`. No status column is read; the list test proves three promotions with `isEnabled=true` return three different answers (running / scheduled / ended).
      - `PATCH` clears and re-inserts both sets inside the same transaction as the row update. A test asserts the old ids are gone rather than merged, and another asserts a 400 leaves the existing sets untouched.
      - Unknown product ids are rejected as a 400 naming them, rather than surfacing as a 500 from a foreign key violation mid-write.
      - `endsAt` is serialized here (unlike the storefront payload) because the admin edit form cannot round-trip a date it is never told.

      **Verification**:
      - Command: `cd packages/api && bunx vitest run tests/routes/admin/promotions.test.ts`
      - Result: PASS (28 tests, 28 passing, 0 failing)
      - Typecheck: `bunx tsc --noEmit` in packages/api — 0 errors
      - Red phase confirmed first: all 28 failed with "Cannot find module .../routes/admin/promotions"
