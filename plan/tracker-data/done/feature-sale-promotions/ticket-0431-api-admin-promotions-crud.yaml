title: API - admin promotions CRUD
description: |-
  ## Task
  Admin-guarded CRUD at `packages/api/src/routes/admin/promotions.ts`: list, create, update, enable/disable, delete, plus setting the pinned product list and the exclusion list.

  Writes call `invalidateActivePromotions()` so enabling a sale takes effect immediately rather than after the 60s resolver cache expires.

  ## Context
  Part of feature: sale-promotions
  Phase: 3 — API surfaces
  Design: `docs/superpowers/specs/2026-08-05-sale-promotions-design.md` §9

  Follow the existing admin route pattern (`routes/admin/orders.ts`, `routes/admin/customers.ts`) and their admin-role guard. Validate with `createPromotionInputSchema` / `updatePromotionInputSchema` from `@chobii/shared` (T2). Tests go in `tests/routes/admin/`, matching `tests/routes/admin/customers.test.ts`.
