    text: |-
      ✅ **Completed**

      **Commit**: `aa24b758` - feat(web): the cart shows what the sale is worth, locked or not

      **Files Changed**:
      - `packages/web/app/routes/cart/index.tsx` — `readCartSaving()` reads the #429 payload (`items[].pricing` + `savingTotal`); per-line `LineSaving` under each cart line; `Sale saving` row and the locked block in `OrderSummary`; `JoinGalleryModal` (#444) opened with `source: 'cart'`; `CartContent` exported for the test.
      - `packages/web/tests/routes/cart-saving.test.tsx` — 12 tests (new).

      **Summary**:
      - Nothing discounted → no row anywhere (also true before the priced cart has loaded).
      - Member: per-line `base − sale` plus the cart-level row printing the server's own `savingTotal`; the line figures sum to it.
      - Guest under a members-only sale: the server truthfully reports `savingTotal: '0.00'` (it charges base), so the locked teaser is summed from the locked lines' `base − sale` — the same subtraction the server's `lineSaving()` does, never a percentage applied client-side. Same number a member is shown, presented as locked, with a "Join the gallery" button in the summary next to the checkout button.
      - Membership from `useGalleryMembership()` (#443): a member is never shown the gate, and a payload cached from before they joined triggers exactly one refetch instead of a locally invented unlocked figure.

      **Note for the feature owner**: the storefront cart page renders lines from the local Zustand store and nothing in `packages/web` currently writes to `/api/cart`, so pricing is matched onto the displayed lines by product+variant+frame and the rows stay absent until the server cart carries the same lines. Wiring the cart to the server cart is outside this ticket.

      **Verification**:
