title: Resolver - resolveSalePrice with scope matching, exclusions, member gate and rounding
description: |-
  ## Task
  Complete `promotion-pricing.ts` with `resolveSalePrice(product, promotions, { isMember, excludedIds, includedIds })` returning `{ promotionId, headline, percentOff, basePrice, salePrice, locked } | null`.

  Rules: an exclusion beats every scope; `filter` scope matches on style/subject/room/isFeatured; `products` scope matches the explicit list; `membersOnly` + non-member yields `locked: true` (price shown, base charged); rounding is half-up to 2dp PER LINE, never on a cart subtotal, or line sums stop reconciling with the total.

  ## Context
  Part of feature: sale-promotions
  Phase: 2 — Resolver
  Design: `docs/superpowers/specs/2026-08-05-sale-promotions-design.md` §5

  Builds on T4 (`isPromotionActive`, `selectPromotion`, `getActivePromotions`). Prices are `decimal(10,2)` strings throughout (`schema/products.ts:96,203`) — keep them strings and format with `.toFixed(2)`, matching `calculateLineTotal` at `routes/cart.ts:196-204`.
