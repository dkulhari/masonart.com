      ✅ **Completed**

      **Commit**: `4a998e91` — feat(api): resolveSalePrice — scope, exclusions, member gate, per-line rounding

      **Files Changed**:
      - `packages/api/src/lib/promotion-pricing.ts` — appended `resolveSalePrice`, `matchesScope`, `facetValues`, `missesAxis`, `toMoney` and `loadPromotionProductSets` to the T4 module
      - `packages/api/tests/lib/promotion-pricing.test.ts` — 20 new cases alongside the 8 from #426

      **Summary**:
      Exclusion is checked before scope matching, so it beats every scope including a pinned `products` list. `filter` matches on style/subject/room/isFeatured, every named axis required; an empty filter matches nothing (scope `all` is how you price the catalogue). `membersOnly` + non-member yields `locked: true` — price shown, base charged. Rounding is half-up to 2dp per line.

      `loadPromotionProductSets(activePromotions)` reads `promotion_product` and `promotion_exclusion` in one query each and returns flat `{ includedIds, excludedIds }` sets for #428/#429/#430 to load once per request.

      **Two deviations from the ticket's code, both deliberate:**

      1. **`PricedProduct` reads plural facets as well as singular.** The ticket's type had `style`/`subject`/`room` scalars, but `products` (schema/products.ts:111-114) stores `styles`/`subjects`/`rooms` as `text[]`. As written, the `filter` scope would have matched nothing in production while every ticket test passed. `facetValues()` accepts both shapes; a test covers a real array-shaped row.
      2. **Stale `@chobii/shared` build.** #424 landed the source but `packages/shared/dist/` had no `promotion` module, so `tsc` rejected the `PromotionScopeFilter`/`ResolvedSalePrice` type imports. Rebuilt shared (`bunx tsc`, build output only — `dist/` is gitignored, no source touched). Worth knowing for #428+: **the shared package needs a rebuild before its new exports typecheck downstream.**

      The ticket's `toMoney` was checked against real half-up boundaries before being kept — `2.675 → 2.68`, `50.005 → 50.01`, `10.01 less 50% → 5.01`. The `Number.EPSILON` nudge does hold; a boundary test now pins it.

