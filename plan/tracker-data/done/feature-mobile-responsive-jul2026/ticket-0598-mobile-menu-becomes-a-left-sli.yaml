ticket_number: 598
title: Mobile menu becomes a left slide-in drawer instead of a top dropdown
description: |-
  ## Task
  Our mobile menu drops down from under the header (`Header.tsx:567`: `fixed inset-x-0 top-16`, full width, `max-h-[calc(100vh-4rem)]`). mesonart's is a left slide-in panel.

  Measured on mesonart.com:
  - `menu-drawer drawer drawer--start`, `drawer__inner` is `width:100%; max-width:576px`, full viewport height, white
  - enters from x = -576 to 0 under `transform .6s cubic-bezier(0.7, 0, 0.2, 1)`
  - drag handle pill at the top centre, close X at the top right
  - the link list scrolls inside the panel while the footer stays pinned

  This ticket is the container only — the link inventory is a separate ticket, and the footer another.

  ## Context
  - `Header.tsx:552-630` — the current drawer and its scrim
  - Keep it a SIBLING of `<header>` (see the note at `Header.tsx:340`): the header sets `backdrop-blur`, and a backdrop-filter is a containing block for fixed descendants — nested, the scrim collapsed to the 64px header box (#348)
  - Scroll lock and Escape are already wired at `Header.tsx:168-183`; reuse, don't duplicate
  - `MobileFiltersSheet` on /posters is the existing slide-in sheet in this codebase — follow its transform/scrim pattern
  - E2E lives at `tests/e2e/`; the feature convention is one E2E pass per feature, so extend rather than add a file if a mobile-nav spec already exists
