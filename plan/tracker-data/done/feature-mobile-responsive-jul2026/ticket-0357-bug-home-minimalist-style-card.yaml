    text: |-
      ✅ **Completed**

      **Commit**: `8d2c4c5c` — fix(web): legible captions on the Shop by Style cards

      **Files Changed**:
      - `packages/web/app/routes/index.tsx`

      **Implementation**: took the ticket's recommended option — a text-protection scrim on **all four** cards rather than only retuning Minimalist. The colour gradient carries brand identity but is translucent by design, so it cannot be relied on for legibility; a flat `bg-black/25` scrim under the text keeps captions readable whatever image sits behind them, including any added later. Also deepened the Minimalist gradient (`gray-600/70 → slate-700/80 → slate-900/70`), raised the description to `text-white/90`, and added a subtle text-shadow.

      **Verification**:
      - Visual: the Minimalist caption is now clearly readable; the dark ring and brown dot behind it are muted (before/after screenshots captured)
      - Measured by compositing each card to a canvas and sampling the pixels behind the caption — worst-case contrast against white text: Abstract 9.35, Nature 10.51, **Minimalist 6.46**, Typography 12.95. All clear WCAG AA (4.5:1).
      - Web suite 1362/1362

      **Caveat on the numbers**: the composite approximates each card's gradient with a single slate tone rather than reproducing the real per-card gradient, so the ratios are indicative rather than authoritative — the visual check is the primary evidence. A precise check would need pixel sampling from a rendered screenshot; disproportionate for a low-priority polish item, but worth knowing if this is ever revisited.
