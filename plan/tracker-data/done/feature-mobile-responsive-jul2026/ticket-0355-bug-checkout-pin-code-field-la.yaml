ticket_number: 355
title: "BUG: Checkout PIN code field lacks inputmode=numeric — QWERTY keyboard for a 6-digit PIN"
description: |-
  ## Problem

  The checkout `postalCode` field is `type="text"` with no `inputmode`, so mobile users get a full QWERTY keyboard when entering a 6-digit Indian PIN code. They have to switch to the numeric layout manually.

  **Verified on production chobii.art at 390x844, 2026-07-28.** The field reports `type: text`, `inputmode: null`, `pattern: null`.

  By contrast the `phone` field is correctly `type="tel"` and does get a numeric keypad — so the pattern is understood elsewhere in the same form.

  ## Fix

  Add `inputMode="numeric"` and `pattern="[0-9]{6}"` with `maxLength={6}` to the PIN code field. Keep `type="text"` so leading zeros are preserved (`type="number"` is the wrong tool here — it strips them and adds unwanted spinners).

  ## Acceptance criteria

  - Focusing PIN code on mobile opens the numeric keypad
  - Leading zeros are preserved
  - Existing PIN validation still rejects non-6-digit input
