    text: |-
      ✅ **Completed**

      **Commit**: `5d36ffbd` — feat(web): the mobile drawer gets a pinned footer

      **Files Changed**:
      - `packages/web/app/lib/socialLinks.ts` — new; `SOCIAL_LINKS` (Instagram / Facebook / Twitter, each with its lucide icon)
      - `packages/web/app/components/layout/Header.tsx` — `data-testid="mobile-nav-footer"` pinned outside the scrolling area (`shrink-0`, safe-area padding); `MOBILE_DRAWER_ACTION_CLASS` pill; `isSignedIn` off the root-route session; Account row removed from the list
      - `packages/web/app/components/layout/Footer.tsx` — maps `SOCIAL_LINKS` instead of three inline hrefs
      - `packages/web/tests/components/layout/Header.structure.test.tsx` — `mobile drawer footer (#600)`, 7 assertions
      - `packages/web/tests/components/layout/Footer.structure.test.tsx` — page footer reads the shared list
      - `tests/e2e/mobile-nav.spec.ts` — 2 new tests, plus a settle-wait in the shared `openMenu` helper

      **Design decisions**:
      - **Currency row skipped**, per the ticket: single-currency storefront, and a selector with one option is a control that cannot be used.
      - **Three socials, not theirs' four.** No YouTube or Pinterest accounts exist; a link to an account that does not exist is worse than an absent icon — same rule #599 applied to Artists / Trade Program / Commission Art.
      - **`SOCIAL_LINKS` extracted rather than imported from Footer.** The ticket said read the URLs from `Footer.tsx`; they were inline JSX there, so a shared module is the version of that which cannot drift. The page footer now reads the same list. The hrefs are the bare domains that were already there — still handle-less, but wrong in exactly one place now.
      - **Account control is a pill, not a 24px row.** The footer is a different register from the list: one action, not another destination.
      - **Account row dropped from the list** now the footer carries it. Wishlist stays — it has no footer control.
      - **Signed-in/out branch reads the same session `MobileTabBar` does**, so the dock and the drawer cannot send the same visitor to two different places.

      **Verified**:
      - `npx vitest run tests/components/layout/` — 170 passed (8 files); the 8 new assertions were confirmed failing first (6 red, 2 already true)
      - `npx playwright test tests/e2e/mobile-nav.spec.ts` — **17 passed**, including the pinned-footer geometry test and the login-redirect/social test
      - `npx vitest run tests/routes/reviews.test.tsx` — 17 passed (the other suite that renders Footer)
      - `npx tsc --noEmit` — 22 errors, all pre-existing and none in `components/layout/` or `lib/`

      **Worth knowing**: the pinned-footer test caught a latent flake in the shared `openMenu` helper — it returned as soon as the toggle reported `aria-expanded`, which is 600ms before the panel finishes sliding, so any geometry read was taken mid-transition. The helper now settles on the panel's left edge before returning; every test in the file benefits.
