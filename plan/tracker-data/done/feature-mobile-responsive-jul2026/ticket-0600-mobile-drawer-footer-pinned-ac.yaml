ticket_number: 600
title: 'Mobile drawer footer: pinned account/login row and social icons'
description: |-
  ## Task
  mesonart's drawer has a footer pinned below the scrolling link list: a currency selector row (`India (INR ₹)`), a Login pill button, and Facebook / Instagram / YouTube / Pinterest icons. Ours ends the list with plain Wishlist and Account links and has no footer at all.

  Ship the account control and the socials. Skip the currency selector — we are single-currency, and a selector with one option is worse than none.

  ## Context
  - `Header.tsx:552-630` — the drawer; the footer sits outside the scrolling list so it stays pinned
  - Signed-in vs signed-out follows what `MobileTabBar` already does (`MobileTabBar.tsx:169-181`): `/account` when there is a session, otherwise `/auth/login` with `search={{ redirect: '/account' }}` so the round trip is pre-filled
  - Social URLs already exist in `packages/web/app/components/layout/Footer.tsx` — read them from there rather than retyping the hrefs
  - Depends on the left slide-in drawer ticket landing first
