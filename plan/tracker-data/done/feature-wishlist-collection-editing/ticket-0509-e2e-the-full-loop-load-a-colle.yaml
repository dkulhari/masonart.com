    text: |-
      ✅ **Completed**

      **Commit**: `88c84e2c` — test(e2e): load a collection, reorder it, save it back

      **Files Changed**:
      - `tests/e2e/wishlist-collection-edit.admin.spec.ts` — 7 tests, chromium-admin, serial

      **Passed on the first run**, which is worth noting only because every other spec in this feature needed two or three attempts — the traps had all been hit and written down by then: hearts toggle, ProductCard has no heading, the staff wishlist is shared, and optimistic moves need polling.

      **The order is read off the storefront, not the admin form.** The form can hold the right order and fail to persist it — that is precisely how #503's membership-wiping bug looked from the inside, and it passed its own tests while doing it. Anything asserting on the form would have been green through that bug too.

      **What it pins**
      - loading brings members back **in the collection's order**, matching what was staged
      - the confirm appears before a non-empty wishlist is replaced, and names it
      - a **rule collection offers no load action at all**
      - the overwrite confirm names the target before anything is destroyed
      - the reordered list reaches `/collections/<slug>` in the new order

      **Titles are stamped, not just slugs.** A partially-failed probe run earlier left two collections both called "Loop Probe", and `aria-label="Edit Loop Probe"` hit a strict-mode violation on the next run. A unique slug does not help when the locator reads the title — noted on #508 and acted on here.

      **Verification**
      - Command: `npx playwright test tests/e2e/wishlist-collection-edit.admin.spec.ts --project=chromium-admin --workers=1`
      - Result: PASS — 7 tests, 0 failing, first attempt
      - Probe collections cleaned up; the table is back to the seeded 14

      **Serial, and why**: one staff account means one wishlist, so parallel tests overwrite each other and trip the reorder guard. Same as `wishlist-staging.admin.spec.ts`, documented in the file rather than left as a bare `mode: 'serial'`.
