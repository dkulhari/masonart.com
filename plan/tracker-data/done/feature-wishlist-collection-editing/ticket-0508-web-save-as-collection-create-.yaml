    text: |-
      ✅ **Completed**

      **Commit**: `0f125f66` — feat(web): save the wishlist as a new collection or over an existing one

      **Files Changed**:
      - `packages/web/app/components/wishlist/WishlistStagingBar.tsx` — the two-destination save flow
      - `packages/web/tests/components/wishlist/WishlistSaveAs.test.tsx` — 8 tests
      - `packages/web/tests/components/wishlist/WishlistStagingBar.test.tsx` — 4 tests updated for the changed interaction

      **The loop closes here.** #507 could load a collection in, but saving only offered "create new" — so editing produced a *copy*. Verified end to end in the browser:

      ```
      1. wishlist   : Emerald Dreams | Blush Hour | Urban Soul
      2. loaded back: Emerald Dreams | Blush Hour | Urban Soul   matches: true
      3. rearranged : Blush Hour | Emerald Dreams | Urban Soul
      4. overwritten
      5. storefront : Blush Hour | Emerald Dreams | Urban Soul
         LOOP CLOSED: true
      ```

      **A real ambiguity the tests surfaced.** The overwrite panel and its nested confirm dialog both had a button labelled "Cancel". The test failed with `Found multiple elements with the role "button" and name /Cancel/i` — and the same ambiguity applies to a person reading the panel. Renamed the outer one to **"Back"**, which is what it actually does. Fixing the UI beat scoping the query.

      **Four #503 tests were updated, not deleted.** They clicked "Create collection from these" directly; that button now sits behind "Save as collection". The interaction genuinely changed, so the tests follow it through the new flow rather than asserting on markup that no longer exists.

      **Decisions**
      - **No staging context.** The wishlist remembers nothing about where its contents came from. Load A, rearrange, save over B is legitimate. Carrying context to prevent that would be more state for less freedom — the owner's simplification of my first design, and it is better.
      - **Overwrite confirms with numbers**: which collection, and how many products it currently holds. It replaces rather than merges, and a destructive action offered through a dropdown otherwise reads as harmless.
      - **Manual collections only in the picker.** `GET /api/admin/collections` already returns `kind`, so the filter is client-side. A rule collection's rule *is* its membership; offering it would be offering an operation the API refuses.

      **Verification**
      - Command: `cd packages/web && npx vitest run tests/components/ tests/stores/`
      - Result: PASS — **1239 tests across 63 files**, 0 failing
      - Build: `npx tsc --noEmit -p tsconfig.json` — clean
      - Probe collections cleaned up after each browser run

      **Note on the probe runs**: a partially-failed run left two collections both titled "Loop Probe", and the next run's `a[aria-label="Edit Loop Probe"]` hit a strict-mode violation. Stamped titles, not just stamped slugs, would have avoided it — worth doing in #509's spec.
