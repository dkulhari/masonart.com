    text: |-
      Built. New ShareRow.tsx — "Share:" label with glyphs on the left, "? Need help?" on the right.

      Sharing is real, replacing the old handler-less button: the primary glyph calls navigator.share() when available, falling back to copy-link on non-abort errors and no-opping on a user-cancelled AbortError. Facebook/X/LinkedIn glyphs open real share-intent URLs. A dedicated copy-link button uses the Clipboard API with a hidden-textarea/execCommand fallback and announces success through an aria-live status region. The url prop defaults to window.location.href.

      "Need help?" points at /contact, a real route (app/routes/contact.tsx) found by grepping for a support page — not invented.

      31 tests across the three leaf components pass. tsc clean.

      Still needs a blind critic verdict before this is done.
