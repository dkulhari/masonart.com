description: |-
  Core backend services for wallet operations including exchange rates and wallet management.

  ## Implementation Details

  ### Files Created

  **services/exchange-rate.ts:**
  - Live USD/INR exchange rate fetching
  - 1-hour Redis cache for rate data
  - USD cents to INR paise conversion
  - Conversion formula with configurable markup

  **services/wallet.ts:**
  - getWalletBalance(): Get user's current balance
  - calculateGenerationCost(): Calculate cost for AI generation
  - processPayment(): Deduct from wallet for generation
  - processRefund(): Refund on failed generation
  - createTransaction(): Log wallet transactions

  **middleware/wallet.ts:**
  - requireSufficientFunds: Middleware to verify balance before AI generation
  - Handles free generation credits
  - Returns cost preview in response

