ticket_number: 45
title: Database Schema - Wallet Tables
description: |-
  Database schema for wallet system with transaction tracking and pricing configuration.

  ## Implementation Details

  ### Schema Location
  `packages/api/src/database/schema/wallet.ts`

  ### Tables Created

  **wallet_transactions table:**
  - id: uuid (primary key)
  - userId: uuid (FK to users)
  - type: transaction_type enum
  - amountPaise: integer
  - balanceAfterPaise: integer
  - description: text
  - referenceId: varchar (nullable)
  - createdAt: timestamp

  **wallet_pricing_config table:**
  - id: uuid (primary key)
  - modelId: varchar
  - baseCostUsdCents: integer
  - markupPercentage: integer
  - isActive: boolean
  - createdAt, updatedAt

  ### User Table Extensions
  - walletBalancePaise: integer (default 0)
  - freeGenerationsRemaining: integer (default 3)

  ### Enums
  - transaction_type: 'topup', 'generation', 'refund', 'admin_credit', 'admin_debit'

  ## Commit
