ticket_number: 403
title: Search - drawer over the existing endpoint, opened from the header
description: |-
  ## Task

  Build `packages/web/app/components/layout/SearchDrawer.tsx` and wire the header's search control to it.

  `GET /api/products/search` and `productsApi.search()` both already exist — what is missing is any way to reach them from the UI.

  **Behaviour**
  - Debounced query (~250ms), in-flight request cancelled when a newer one starts.
  - Results render as rows: thumbnail, title, price; each links to the PDP.
  - Empty query shows style shortcuts built from `STYLE_OPTIONS` in `@chobii/shared`, linking at `/posters?styles=<id>`.
  - No results shows a plain statement, not a spinner that never resolves.
  - Keyboard: `/` and `Cmd/Ctrl-K` open, Escape closes, Up/Down move the highlight, Enter opens it.

  ## Context

  Feature: advanced-search

  **Constraints**
  - **Cancel in flight.** Typing "abstract" is eight keystrokes; without cancellation the last response is not necessarily the last request and results flicker between queries. Use an AbortController or a request-sequence guard.
  - **The panel must be a SIBLING of `<header>`, not a child.** The header sets `backdrop-blur`, which establishes a containing block and collapses a nested fixed overlay to zero height — the exact bug #348 fixed for the mobile nav drawer.
  - Scroll-lock and Escape mirror that drawer.
  - `/` must not hijack typing: ignore it when focus is already in an input, textarea or contenteditable.
  - The header search button is currently absent — #401 left it out deliberately rather than shipping something that looks interactive and does nothing. It becomes real here.
  - Token guard applies: no `font-bold`, no brand utilities.
