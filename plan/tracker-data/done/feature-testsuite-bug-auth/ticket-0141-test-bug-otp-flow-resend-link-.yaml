ticket_number: 141
title: "Test Bug: OTP Flow Resend link - invalid CSS selector syntax"
description: |-
  ## Test Failure
  **File**: `tests/e2e/auth.spec.ts`
  **Test**: Login Page › OTP Flow › should display Resend OTP link
  **Line**: 850

  ## Error (Test Infrastructure Issue)
  ```
  Error: expect(locator).toBeVisible() failed

  Locator: button:has-text(/Resend/)
  Expected: visible
  Error: Unexpected token "/" while parsing css selector "button:has-text(/Resend/)". Did you mean to CSS.escape it?
  ```

  ## Classification
  This is a **test bug** - invalid Playwright selector syntax. The `:has-text()` pseudo-selector doesn't support regex with `/pattern/` syntax.

  ## Fix
  Replace with valid Playwright selector:
  - `page.getByRole('button', { name: /Resend/ })` for regex matching
  - Or `page.locator('button:has-text("Resend")')` for literal text
