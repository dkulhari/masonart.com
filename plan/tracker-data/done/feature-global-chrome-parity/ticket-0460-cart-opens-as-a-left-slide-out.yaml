      1. Width left at `max-w-md` (448px); theirs is 576px. Not asked for, and it re-flows the whole panel — say the word and it is a one-line change.
      2. The `:3001` dev server another session owns holds a **stale Tailwind config** — it will not serve `animate-drawer-in-right` until that process restarts. The spec was verified against a fresh server on :3005, since killing another session's server was not mine to do.
      3. The `left` → `right` fix to Header.tsx's comment is uncommitted: that file is dirty with another session's AllArtMegaMenu work, so it will ride along with their commit rather than have me stage their in-flight changes.
