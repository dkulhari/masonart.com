    text: |-
      🔁 **Follow-up 2** — `6c0312a3` (corners + close button) and `8bd49249` (empty state)

      All three measured off their live drawer, then re-measured on ours after the change:

      | | theirs | ours |
      |---|---|---|
      | corner | `34px 0 0 34px` + `overflow: hidden` | identical — `--drawer-radius`, `rounded-l-[…]` |
      | close | outline pill's wipe, 48px circle | `<Button variant="outline" className="h-12 w-12 rounded-full p-0">` — ChooseOptions' exact close button (#420) |
      | empty heading | "Your cart is currently empty.", Urbanist 300 / 32px | identical |
      | empty chips | 12px radius, 12/20 padding, 16px, `rgba(23,23,23,0.024)` | identical |

      **Corner:** rounded only on the page-facing edge, square where it meets the viewport. Bigger than `--card-radius` on purpose — one corner on a full-height panel is not four on a card. `overflow-hidden` with it, or the items list squares the corners off as it scrolls under them.

      **Close button:** the drawer had picked up a `ghost` variant that exists nowhere else. Two modal surfaces closing with two different buttons is how a system drifts.

      **Empty state:** ours was an 18px semibold line over a grey shopping-bag circle with one Browse Posters button — a button back to the catalogue the user was already looking at. Theirs offers collections instead, which is the better answer. Ours are Best Sellers, New In and All Art: the two sorts the header nav already carries (`salesCount-desc`, `createdAt-desc` — `SORT_OPTIONS` ids the collection route validates) plus the full list, so no destination is invented. The chip tint is the one the Quickview's inputs use.

      **Verification**:
      - `npx vitest run tests/components/cart/` → PASS, 12 tests
      - `E2E_BASE_URL=http://localhost:3005 npx playwright test tests/e2e/cart-drawer.spec.ts --project=chromium --no-deps` → PASS, 11/11, including computed radius `34px 0px 0px 34px` and the Best Sellers chip landing on `/posters?sortBy=salesCount&sortOrder=desc`
      - Live measurement of our drawer, side by side with the numbers above — every value identical

      Note: `tests/e2e/cart.spec.ts`'s "Your cart is empty" / "Browse Posters" assertions are the **/cart page**, untouched by this.

      Still open: width is `max-w-md` (448px) against their 576px.
