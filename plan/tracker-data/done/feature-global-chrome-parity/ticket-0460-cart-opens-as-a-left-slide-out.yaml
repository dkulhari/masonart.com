    text: |-
      🔁 **Follow-up correction** — `3a37188c` fix(web): the cart drawer opens right, at their weight, on their button

      The first pass put the drawer on the left. Measured mesonart's live `cart-drawer` element and corrected all three points:

      | | theirs (measured) | ours now |
      |---|---|---|
      | side | `drawer--end`, flush right | `right-0`, flush right |
      | motion | `transform 0.6s cubic-bezier(.7, 0, .2, 1)` | `animate-drawer-in-right`, same curve as `--ease-drawer` |
      | close | `button button--secondary button--close`, 48px round | `<Button variant="ghost" size="icon" className="h-12 w-12">` |

      Their left-hand drawer is the **menu** (`drawer--start`) — that is what the original "opens in left" read on.

      **Worth knowing:** the timing had to become a named animation in `tailwind.config.ts`. `animate-in slide-in-from-right duration-[600ms]` does not work — tailwindcss-animate's `.animate-in` sets `animation-duration: 150ms` itself and beats the duration utility sitting on the same element. The class looked correct and the drawer still slid at 0.15s. The E2E now asserts the **computed** `animationDuration` / `animationTimingFunction`, which is the only assertion that catches it.

      Also moved the drawer's CTAs and the empty state's onto `buttonVariants` — same reasoning as the close button.

      **Verification**:
      - `cd packages/web && npx vitest run tests/components/cart/ tests/styles/` → PASS, 52 tests
      - `E2E_BASE_URL=http://localhost:3005 npx playwright test tests/e2e/cart-drawer.spec.ts --project=chromium --no-deps` → PASS, 10/10, including computed `0.6s` / `cubic-bezier(0.7, 0, 0.2, 1)`
