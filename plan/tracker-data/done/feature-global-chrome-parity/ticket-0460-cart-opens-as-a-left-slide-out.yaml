    text: |-
      🔁 **Follow-up 3** — `aae9ab89` feat(web): drawer at their 576px, with the X under the pointer

      **Width**: `max-w-md` → `max-w-xl` (36rem = their measured 576px exactly).

      **The pointer**: their overlay is `cursor: none` and carries a `<mouse-cursor>` element holding an X — fixed, `pointer-events-none`. The arrow is replaced by the close control while the pointer is outside the panel. Same treatment ChooseOptions got in #420, ported here: the whole backdrop closes the drawer, so the pointer should say so rather than leaving the shopper to guess that clicking outside works. The backdrop also drops `backdrop-blur-sm` and moves to their flat `rgba(23,23,23,0.7)`.

      Two edges handled: the follower unmounts on the backdrop's `mouseleave`, which is what fires when the pointer crosses onto the panel, so the X never sits under the drawer; and the effect cleanup resets it, so reopening does not paint it at last session's coordinates. Escape and the panel's close button still cover touch and keyboard — this is a pointer affordance, never the only way out.

      **Verification**:
      - `npx vitest run tests/components/cart/` → PASS, 14 tests
      - `E2E_BASE_URL=http://localhost:3005 npx playwright test tests/e2e/cart-drawer.spec.ts --project=chromium --no-deps` → PASS, 13/13
      - Live measurement after the change: panel 576px, `rightGap: 0`, `34px 0px 0px 34px`; backdrop `rgba(23, 23, 23, 0.7)`, `cursor: none`, no filter; follower a 48px circle centred exactly on the pointer

      The drawer now matches theirs on every value measured so far: side, width, radius, motion, backdrop, cursor, close button, and the empty state's type and chips.
