    description: Build AllArtMegaMenu - five columns generated from the shared vocabularies, two promo cards from CATEGORY_TILES, hover-open sheet on the measured curve
    file: packages/web/app/components/layout/AllArtMegaMenu.tsx
    status: done
    code: |-
      import { Link } from '@tanstack/react-router'
      import { ChevronRight, ArrowRight } from 'lucide-react'
      import { useEffect, useRef, useState } from 'react'
      import {
        STYLE_OPTIONS,
        SUBJECT_OPTIONS,
        ORIENTATION_OPTIONS,
        COLOR_OPTIONS,
      } from '@chobii/shared'
      import { CATEGORY_TILES } from '~/lib/homeCategories'
      import { cn } from '~/lib/utils'

      /**
       * The All Art mega panel (mesonart parity).
       *
       * Five columns of the site's own filter vocabulary, opened by hovering the
       * first entry of the styles row. Measured from mesonart.com: a full-width
       * white sheet that grows downward on `cubic-bezier(0.6, 0, 0.4, 1)` over
       * 500ms, five link columns in a 4fr track, two promo cards in a 1fr track.
       *
       * Hover-open is a deliberate departure from #416, where the sort pill
       * rejected it. Taken with the user for parity; the trigger stays a real link
       * so a click still lands on /posters, and every option inside is an <a>.
       *
       * The panel is an OVERLAY. It renders `absolute` inside the nav-rows block
       * (already a sibling of <header>, because the header's backdrop-blur
       * collapses fixed descendants - #348) and is deliberately outside anything
       * `useChromeOffset` measures: counted there, the collection toolbar would
       * jump down by the panel's height on every hover (#401 / #421).
       */

      interface MegaColumn {
        heading: string
        /** Headings 1 and 2 are links themselves and carry a chevron, as theirs do. */
        headingSearch?: Record<string, unknown>
        links: Array<{ id: string; label: string; search: Record<string, unknown> }>
      }

      const BEST_SELLERS_SEARCH = { sortBy: 'salesCount', sortOrder: 'desc' }
      const NEW_IN_SEARCH = { sortBy: 'createdAt', sortOrder: 'desc' }

      /**
       * Their column 1 lists monthly drops (New Art-202607 …). We have no timed
       * collection entity, so it carries the row-1 destinations instead - the same
       * three doors, named the same way, rather than eight invented ones.
       */
      const MEGA_COLUMNS: readonly MegaColumn[] = [
        {
          heading: 'All Artwork',
          headingSearch: {},
          links: [
            { id: 'all', label: 'All Art', search: {} },
            { id: 'new-in', label: 'New In', search: NEW_IN_SEARCH },
            { id: 'best-sellers', label: 'Best Sellers', search: BEST_SELLERS_SEARCH },
          ],
        },
        {
          heading: 'Style',
          headingSearch: {},
          links: STYLE_OPTIONS.map((o) => ({
            id: o.id,
            label: o.label,
            search: { styles: o.id },
          })),
        },
        {
          heading: 'Subject',
          links: SUBJECT_OPTIONS.map((o) => ({
            id: o.id,
            label: o.label,
            search: { subjects: o.id },
          })),
        },
        {
          // Single-valued on the route, unlike the comma lists above.
          heading: 'Orientation',
          links: ORIENTATION_OPTIONS.map((o) => ({
            id: o.id,
            label: o.label,
            search: { orientation: o.id },
          })),
        },
        {
          heading: 'Color',
          links: COLOR_OPTIONS.map((o) => ({
            id: o.id,
            label: o.label,
            search: { colors: o.id },
          })),
        },
      ]

      /** Their two promo cards, fed from tiles that already pair a real image with a real facet value. */
      const PROMO_CARDS = CATEGORY_TILES.slice(0, 2)

      export function AllArtMegaMenu({ onNavigate }: { onNavigate?: () => void }) {
        const [isOpen, setIsOpen] = useState(false)
        const rootRef = useRef<HTMLDivElement>(null)

        // Escape and outside-click close it. Hover-open has no keyboard path by
        // decision, but a panel that cannot be dismissed without moving the mouse
        // back through it is a trap.
        useEffect(() => {
          if (!isOpen) return
          const onKeyDown = (e: KeyboardEvent) => {
            if (e.key === 'Escape') setIsOpen(false)
          }
          const onPointerDown = (e: PointerEvent) => {
            if (!rootRef.current?.contains(e.target as Node)) setIsOpen(false)
          }
          document.addEventListener('keydown', onKeyDown)
          document.addEventListener('pointerdown', onPointerDown)
          return () => {
            document.removeEventListener('keydown', onKeyDown)
            document.removeEventListener('pointerdown', onPointerDown)
          }
        }, [isOpen])

        const close = () => {
          setIsOpen(false)
          onNavigate?.()
        }

        return (
          <div
            ref={rootRef}
            onMouseEnter={() => setIsOpen(true)}
            onMouseLeave={() => setIsOpen(false)}
            data-testid="all-art-mega"
            data-open={isOpen}
          >
            {/* The trigger stays a link: click navigates, hover opens. Theirs does
                the same through `data-link` on the <summary>. */}
            <Link
              to="/posters"
              search={{}}
              onClick={close}
              aria-expanded={isOpen}
              className="whitespace-nowrap text-nav text-muted-foreground transition-colors hover:text-foreground"
            >
              All Art
            </Link>

            {/* Scrim. Dims the page behind, the way theirs greys the announcement
                bar and grid. Pointer-events off so leaving the panel still closes it. */}
            <div
              aria-hidden="true"
              className={cn(
                'pointer-events-none fixed inset-0 top-0 z-30 bg-black/30 transition-opacity duration-500 motion-reduce:transition-none',
                isOpen ? 'opacity-100' : 'invisible opacity-0'
              )}
            />

            {/* The sheet. Grid-rows 0fr/1fr grows it downward on their curve rather
                than sliding it, which is what `padding 0.5s` does on their side. */}
            <div
              className={cn(
                'absolute left-0 top-full z-40 grid w-full overflow-hidden bg-background transition-[grid-template-rows,opacity] duration-500 motion-reduce:transition-none',
                isOpen
                  ? 'grid-rows-[1fr] opacity-100'
                  : 'invisible grid-rows-[0fr] opacity-0'
              )}
              style={{ transitionTimingFunction: 'cubic-bezier(0.6, 0, 0.4, 1)' }}
            >
              <div className="min-h-0">
                <div className="container-wide grid grid-cols-[4fr_1fr] gap-6 pb-14 pt-3">
                  <div className="grid grid-cols-5 gap-6">
                    {MEGA_COLUMNS.map((column) => (
                      <div key={column.heading}>
                        {column.headingSearch ? (
                          <Link
                            to="/posters"
                            search={column.headingSearch}
                            onClick={close}
                            className="mb-8 flex items-center gap-1 text-base font-medium capitalize tracking-[-0.4px] text-foreground"
                          >
                            {column.heading}
                            <ChevronRight className="h-4 w-4" />
                          </Link>
                        ) : (
                          <p className="mb-8 text-base font-medium capitalize tracking-[-0.4px] text-foreground">
                            {column.heading}
                          </p>
                        )}
                        <ul>
                          {column.links.map((link) => (
                            <li key={link.id}>
                              <Link
                                to="/posters"
                                search={link.search}
                                onClick={close}
                                className="block pb-2 text-sm leading-[21px] text-muted-foreground transition-colors hover:text-foreground"
                              >
                                {link.label}
                              </Link>
                            </li>
                          ))}
                        </ul>
                      </div>
                    ))}
                  </div>

                  {/* Promo column. 4:3 card with a caption and trailing arrow, then
                      a square one - their proportions. */}
                  <div className="flex flex-col gap-6">
                    {PROMO_CARDS.map((tile, index) => (
                      <Link
                        key={tile.id}
                        to="/posters"
                        search={{ [tile.group]: tile.id }}
                        onClick={close}
                        className="group block"
                      >
                        <img
                          src={tile.image}
                          alt={tile.name}
                          loading="lazy"
                          className={cn(
                            'w-full rounded-sm object-cover',
                            index === 0 ? 'aspect-[4/3]' : 'aspect-square'
                          )}
                        />
                        {index === 0 && (
                          <span className="mt-3 flex items-center justify-between text-xl tracking-tight text-foreground">
                            {tile.description}
                            <ArrowRight className="h-4 w-4" />
                          </span>
                        )}
                      </Link>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          </div>
        )
      }
