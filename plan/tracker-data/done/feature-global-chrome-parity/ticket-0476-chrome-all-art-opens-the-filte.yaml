      import { test, expect } from '@playwright/test'

      test.beforeEach(async ({ page }) => {
        await page.goto('/', { waitUntil: 'networkidle' })
      })

      const mega = (page) => page.getByTestId('all-art-mega')

      test('hovering All Art opens the five filter columns', async ({ page }) => {
        await expect(mega(page)).toHaveAttribute('data-open', 'false')
        await mega(page).getByRole('link', { name: 'All Art', exact: true }).hover()
        await expect(mega(page)).toHaveAttribute('data-open', 'true')

        for (const heading of ['All Artwork', 'Style', 'Subject', 'Orientation', 'Color']) {
          await expect(mega(page).getByText(heading, { exact: true })).toBeVisible()
        }
      })

      test('a column link lands on the filtered collection', async ({ page }) => {
        await mega(page).getByRole('link', { name: 'All Art', exact: true }).hover()
        await mega(page).getByRole('link', { name: 'Minimalist Art' }).click()
        await expect(page).toHaveURL(/\/posters\?.*styles=minimalist-art/)
      })

      test('Escape closes it', async ({ page }) => {
        await mega(page).getByRole('link', { name: 'All Art', exact: true }).hover()
        await expect(mega(page)).toHaveAttribute('data-open', 'true')
        await page.keyboard.press('Escape')
        await expect(mega(page)).toHaveAttribute('data-open', 'false')
      })

      test('the collection toolbar does not move when the panel opens', async ({ page }) => {
        await page.goto('/posters', { waitUntil: 'networkidle' })
        const toolbar = page.getByTestId('collection-toolbar')
        const before = await toolbar.boundingBox()
        await mega(page).getByRole('link', { name: 'All Art', exact: true }).hover()
        await expect(mega(page)).toHaveAttribute('data-open', 'true')
        const after = await toolbar.boundingBox()
        expect(after?.y).toBeCloseTo(before?.y ?? 0, 0)
      })
