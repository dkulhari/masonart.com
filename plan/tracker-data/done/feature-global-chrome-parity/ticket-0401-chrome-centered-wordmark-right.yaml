ticket_number: 401
title: Chrome - centered wordmark, right action cluster, two-row nav
description: |-
  ## Task

  Restructure `Header.tsx` to mesonart's shape (analysis §1.1):

  - **Centered wordmark** on desktop, with the action cluster (Search, Account, Wishlist, Cart) right. Ours is left-logo / centre-nav / right-actions.
  - **Nav row 1** — pages: Posters, Create, Gallery, About, plus the staff entry when present.
  - **Nav row 2** — styles, generated from `STYLE_OPTIONS` in `@chobii/shared`, each linking to `/posters?styles=<id>`.

  ## Context

  Feature: global-chrome-parity
  Blocked by nothing; the vocabulary landed in #395.

  **Constraints — all four are pinned by `tests/components/layout/chrome-tokens.test.ts` and must survive:**
  - Mobile drawer scroll-lock and Escape (#348), including the scrim being a SIBLING of `<header>` rather than a child — the header sets `backdrop-blur`, which establishes a containing block and collapses a nested fixed scrim to zero height.
  - Cart aria-label carries the item count (#248).
  - Role-aware staff entry via `staffAreaLabel` / `staffAreaHref` (#362).
  - Wishlist badge hydration gate (#389 / #498).

  **Also**
  - Search is a placeholder button here; the drawer is feature 5. It must not look interactive-but-broken — either wire it to `/posters` or ship it in the same change as the drawer.
  - Mobile keeps ONE row plus the drawer. Two nav rows and an announcement bar is most of a phone screen.
  - Twelve style links will overflow on a laptop — the row scrolls horizontally rather than wrapping to three lines.
  - Header height feeds the collection toolbar's `sticky top-16`. If the header grows, that offset must move with it or the toolbar hides behind it.
