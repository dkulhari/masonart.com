ticket_number: 364
title: Shared contract - Collapse three ProductImage shapes into one, add MAT_* constants
description: |-
  ## Task

  Three incompatible `ProductImage` shapes exist today. Collapse them into one shared definition, because the whole feature depends on distinguishing `type: 'main'` from `type: 'room-mockup'`.

  | Location | Current shape |
  |---|---|
  | `packages/shared/src/types/product.ts:328` | `{ id, url, thumbnailUrl?, altText, type, sortOrder, width?, height? }` |
  | dev DB `products.images` jsonb | `{ id, url, alt, isPrimary, sortOrder, width, height }` |
  | `packages/web/app/components/product/ProductCard.tsx:18` | `{ id, url, alt?, isPrimary?, webpUrl?, width?, height?, variants? }` |

  The shared type wins. `isPrimary` is dropped (superseded by `type: 'main'` + `sortOrder`), `width`/`height` become required, `crop` and `originalKey` are added.

  Also add the mat constants here rather than in the API, because they are the one value that must agree across the server/CSS boundary (see feature description, "one cross-boundary coupling").

  ## Context

  Part of feature: product-grid-alignment
  Phase: 1 - Shared contract (blocks every other ticket)

  No migration needed - product is pre-launch, data is reseeded in T11.
  After this lands, `packages/web` and `packages/api` must both import from `@chobii/shared`; no local redefinitions.
