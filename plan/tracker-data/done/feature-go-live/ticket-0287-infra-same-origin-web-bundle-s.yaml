ticket_number: 287
title: 'Infra: same-origin web bundle + single-hostname config'
description: |-
  Phase: Infra. Switch from the two-subdomain design (api.masonart.com) to a single hostname, path-routed.

  Work items:
  - Audit packages/web for every VITE_API_URL fallback — each must use ?? (not ||) so an empty-string build arg survives and bakes relative same-origin URLs. All fetches, uploads, and the API client must go through the shared base.
  - Dockerfile builder stage: ARG VITE_API_URL (default preserves dev behavior).
  - Prod compose: APP_URL/BETTER_AUTH_URL = https://masonart.com; drop multi-domain CORS_ORIGIN; webhook URL becomes https://masonart.com/api/webhooks/razorpay.
  - Defense in depth: verify no emitted web asset filename can start with 'api' (Vite chunk naming), so even a mis-edited tunnel route regex cannot swallow assets. Do NOT rename the SSR entry (cc #98 crash-loop).

  Acceptance: compose config resolves; local prod-mode stack serves web+api on one origin; login cookie is first-party; grep shows zero || fallbacks on VITE_API_URL.
  Lessons: cc #84, #96, #97, #98.
