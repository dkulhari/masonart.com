      ✅ **Completed**

      **Commit**: `dddbfc5f` - refactor(web): upgrade TanStack Start to 1.168, replace serve.ts with bundled server entry

      **Files Changed**:
      - `bun.lock` - @tanstack/react-start 1.149.4→1.168.32, react-router 1.149.3→1.170.18 (package.json range ^1.93.0 unchanged)
      - `packages/web/app/server.tsx` (new) - custom server entry via @tanstack/react-start/server-entry; serves dist/client with immutable cache headers, delegates to SSR; bundled into dist/server/server.js (customs-copilot pattern)
      - `packages/web/serve.ts` (deleted) - external wrapper no longer needed
      - `packages/web/package.json` - start script → `bun run dist/server/server.js`
      - `Dockerfile` - web stage: dropped serve.ts COPY, CMD → `packages/web/dist/server/server.js`
      - `app/routes/approve/$token.tsx`, `admin/approvals/$id.tsx`, `admin/approvals/index.tsx` - removed `as any` route-id casts (the 1.168 transformer requires plain string literals; the casts silently broke route-tree crawling → "Crawling result not available")
      - `packages/web/app/routeTree.gen.ts` - regenerated by 1.168 generator
      - `packages/web/tests/build.test.ts` - refreshed 4 stale expectations (pre-existing failures: .output-era start script, srcDirectory quoting, account routes now under _authed/, typecheck subprocess timeout)

      **Key finding**: the claude-mem note "1.168 serves client assets from the SSR bundle natively" was inaccurate — customs-copilot does it via an app-authored `app/server.tsx` bundled at build time. Adopted the same pattern, so the capability is now in the bundle rather than an external wrapper.

      **Verification**:
      - Command: `cd packages/web && bunx vitest run` → PASS, 1342/1342 tests (29 files)
      - Command: `bun run build` (web) → PASS
      - Command: `docker build --target web` + container run → `/` 200 SSR HTML; `/assets/*.js` 200 with `Cache-Control: public, max-age=31536000, immutable`; `/posters` 200; path traversal 404; healthcheck `healthy`
      - Typecheck: 0 new errors vs pre-upgrade baseline worktree (26 pre-existing errors remain, out of scope); 1 baseline error actually fixed (addresses.tsx route-path cast)
      - API test failures (39) reproduced identically on pre-upgrade baseline — environmental (missing API keys / DB state), unrelated

      **Follow-ups worth ticketing separately**: (1) 26 pre-existing web typecheck errors; (2) redeploy staging via `make -C deploy build-push-deploy` to ship this — deliberately left for the owner alongside the #294 gate walkthrough.
