ticket_number: 290
title: "BUG: prod compose healthchecks exec curl but slim images have no curl — web can never start"
description: |-
  Phase: Hardening. docker/docker-compose.prod.yml healthchecks use ['CMD','curl','-f',...] but oven/bun:1-slim (api) and node:20-slim (web) ship no curl. Both containers report unhealthy forever; web's depends_on api service_healthy therefore blocks web from EVER starting. Launch blocker found in plan review.

  Fix: replace compose healthchecks with runtime probes, matching the (already correct) Dockerfile HEALTHCHECKs:
  - api: bun -e "fetch('http://localhost:3000/api/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"
  - web: node -e equivalent against :3001.
  Note /health vs /api/health inconsistency between compose and Dockerfile — standardize on /api/health.

  Acceptance: prod-mode compose up shows api and web reach healthy; docker inspect health log shows passing probes.
  Lesson: cc runbook L4 (bun-slim has no curl).
