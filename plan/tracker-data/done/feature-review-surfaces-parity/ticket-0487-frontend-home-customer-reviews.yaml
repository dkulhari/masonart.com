    text: |-
      ✅ **Completed**

      **Commit**: `4cbefbd2` — feat(web): home customer reviews strip

      **Files Changed**:
      - `packages/web/app/components/home/CustomerReviewsSection.tsx` — new. `CustomerReviewsStrip` (presentational, carries the suppression rule), `HomeReviewCard`, and the connected `CustomerReviewsSection`.
      - `packages/web/app/routes/index.tsx` — mounts `<CustomerReviewsSection />` between `<ValuePropsSection />` and `<NewsletterSection />`.
      - `packages/web/tests/components/home/CustomerReviewsSection.test.tsx` — new, 17 tests.

      **Summary**:
      - **Suppression rule**: the whole section returns `null` when `reviewCount < 10`, when `averageRating === null` however many reviews there are, and when the feed came back empty (a heading above an empty rail is worse than silence). No placeholder, no synthetic "0.0". `MIN_REVIEWS_FOR_HOME_STRIP` is restated locally rather than imported from the route module — so a home chunk does not drag in `/reviews` — and a test pins it to `MIN_REVIEWS_FOR_AGGREGATE`, so the two surfaces cannot drift into being two designs.
      - **Score band**: same score / `StarRating` / count shape and copy as the `/reviews` aggregate header, inside the existing `SectionBand` (`tone="sand"`, so it does not collide with the beige newsletter that follows) with `DisplayHeading as="h2"`. No new band style.
      - **Rail**: `overflow-x-auto snap-x snap-mandatory` with two `ChevronLeft`/`ChevronRight` buttons, the DiscoverChips shape. No carousel dependency. The arrows read the rail's own `scrollLeft`/`scrollWidth`/`clientWidth` via a scroll + resize listener and `disabled` at each end.
      - **Data**: `useReviewFeed(1, 12)` plus `productsApi.catalogueReviewStats()` through `useQuery` — client-fetched, and via `productsApi` because there is no Vite `/api` proxy.
      - **View All**: outline `buttonVariants` pill to `/reviews`. Plain `<a>`, matching every other link in `index.tsx`.
      - Card body is CSS `line-clamp-5`, not a JS slice — full text stays in the DOM, no fabricated ellipsis. `author: null` falls back to "Verified customer".

      **Verification**:
      - Command: `cd packages/web && bunx vitest run tests/components/home/CustomerReviewsSection.test.tsx tests/routes/reviews.test.tsx`
