ticket_number: 487
title: Frontend - home Customer Reviews strip with score band and carousel
description: |-
  ## Task

  Mesonart's home section 10 (`customer_review` ×2): a score strip over a horizontally scrollable rail of review cards, with a View All pill to `/reviews`. Currently the home page has no review presence at all.

  ## Context

  Part of feature: review-surfaces-parity
  Phase: Frontend
  Depends on: the client layer, the /reviews route

  - `packages/web/app/routes/index.tsx` — existing sections are `HeroSection` (:182), `FeaturedProductsSection` (:251), `CategoriesSection` (:329), `AIGeneratorSection` (:417), `ValuePropsSection` (:498), `NewsletterSection` (:536). Mesonart places reviews late in the stack, after the merchandising rails and before the brand story — mount it between `ValuePropsSection` and `NewsletterSection`
  - **The whole section renders `null` below 10 approved reviews.** Same rule as `PromoTile`. Today there are 12 approved across 9 products, so it will render — but barely, and a seed reset must not produce a fake "4.9/5"
  - Reuse `SectionBand` and `DisplayHeading`; do not invent a new band style
  - The rail is CSS scroll-snap with arrow buttons, matching the collection Discover carousel. No carousel dependency
