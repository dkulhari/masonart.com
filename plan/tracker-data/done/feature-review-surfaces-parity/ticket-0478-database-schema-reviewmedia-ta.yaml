    text: |-
      ✅ **Completed**

      **Commit**: `cb405876` — feat(db): reviewMedia table for review photos and videos

      **Files Changed**:
      - `packages/api/src/database/schema/review-media.ts` (new) — `reviewMediaTypeEnum` ['image','video'], `reviewMediaStatusEnum` ['processing','ready','failed'], `reviewMedia` pgTable, `reviewMediaRelations` (one → reviews), types `ReviewMedia`/`NewReviewMedia`/`ReviewMediaType`/`ReviewMediaStatus`
      - `packages/api/src/database/schema/reviews.ts` — `reviewsRelations` now takes `{ one, many }` and declares `media: many(reviewMedia)`
      - `packages/api/src/database/schema/index.ts` — barrel export below `./reviews`
      - `packages/api/src/database/migrations/0006_common_venom.sql` (new) + `meta/0006_snapshot.json`, `meta/_journal.json` — generated and applied to the dev DB
      - `packages/api/tests/database/review-media.test.ts` (new) — 19 tests

      **Summary**:
      Media-agnostic `review_media` table: `id`, `reviewId` (FK → reviews, ON DELETE CASCADE, notNull), `mediaType` notNull, `url` notNull, `thumbnailUrl`, `posterUrl`, `durationSeconds`, `width`, `height`, `sizeBytes` (all nullable), `sortOrder` default 0 notNull, `processingStatus` default 'ready' notNull, `processingError`, `createdAt`/`updatedAt` (`$onUpdate`). Indexes `review_media_review_id_idx` and composite `review_media_review_sort_idx` (reviewId, sortOrder). Media carries no moderation status — it inherits the parent review's `status`; `processingStatus` is transcode-pipeline only.

      **Verification**:
      - Command: `cd packages/api && DATABASE_URL=postgresql://poster_app:dev_password@localhost:5440/poster_app_dev bunx vitest run tests/database/review-media.test.ts`
      - Result: PASS (19 tests, 19 passing, 0 failing) — DB connection established, so no vacuous skips
      - Output:
      ```
      ✅ Database connection established for review_media schema tests
       ✓ tests/database/review-media.test.ts (19 tests) 172ms
       Test Files  1 passed (1)
            Tests  19 passed (19)
      ```
      - RED evidence (step 2): `Error: Cannot find module '../../src/database/schema/review-media'` — 1 failed suite before the module existed
      - Regression: `bunx vitest run tests/database/reviews.test.ts` → 15 passed (15)
      - Build: `cd packages/api && bun run typecheck` → exit 0

      **Notes**:
      - Steps 1/2/6 were run as `bunx vitest run tests/database/review-media.test.ts` instead of the ticket's `bun run test -- review-media`: the repo's own `.claude/hooks/guard-test-scope.py` denies the latter as a pathless whole-package `vitest run`. Same file, same DATABASE_URL, scoped by path.
      - `reviews.ts` ↔ `review-media.ts` is the schema dir's first circular import. Verified safe: drizzle's `relations()` stores the config callback lazily, and a live `db.query.reviews.findMany({ with: { media: true } })` against the dev DB returned rows with the `media` array populated.
      - Test rows are cleaned up in `afterAll`; dev DB verified back to 14 reviews / 0 review_media after the run.
