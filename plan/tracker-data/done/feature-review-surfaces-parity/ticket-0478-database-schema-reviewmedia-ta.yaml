ticket_number: 478
title: Database Schema - reviewMedia table, enums, relations and migration
description: |-
  ## Task

  Add a media-agnostic `reviewMedia` table so reviews can carry customer photos AND videos. `mediaType` enum from day one means video is additive later rather than a migration rewrite.

  Media has no moderation status of its own — it inherits the parent review's `status`. `processingStatus` tracks the transcode pipeline only (`processing` | `ready` | `failed`), not moderation.

  ## Context

  Part of feature: review-surfaces-parity
  Phase: Database Schema

  - Mirror `approvalPhotos` at `packages/api/src/database/schema/approvals.ts:112` — same url/thumbnailUrl/sortOrder shape
  - Parent table: `packages/api/src/database/schema/reviews.ts`
  - Drizzle config writes migrations to `packages/api/src/database/migrations/` (last is `0005_dapper_hulk.sql`)
  - Schema barrel is `packages/api/src/database/schema/index.ts`; reviews is exported at line 26
  - DB tests skip gracefully when `SKIP_DB_RUNTIME_TESTS=true`; follow `packages/api/tests/database/reviews.test.ts`
  - The dev DB is on port **5440**, not the 5433 default baked into the test files
