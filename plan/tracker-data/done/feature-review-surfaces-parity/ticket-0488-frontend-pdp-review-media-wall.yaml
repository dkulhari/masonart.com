    text: |-
      ✅ **Completed**

      **Commit**: `3419af3f` - feat(web): PDP review media wall with video lightbox

      **Files Changed**:
      - `packages/web/app/components/product/ReviewMediaWall.tsx` (new) - media grid + portal lightbox
      - `packages/web/app/routes/posters/$slug.tsx` - mounts `<ReviewMediaWall>` directly above `<ProductReviews>`
      - `packages/web/tests/components/product/ReviewMediaWall.test.tsx` (new) - 11 tests

      **Summary**:
      - Reads `useReviewMediaFeed(productId)` from the #484 client layer. Square-tile grid, 2 cols mobile / 3 sm / 6 desktop, images `loading="lazy"`.
      - Video tiles: `poster` (posterUrl, falling back to thumbnailUrl), `preload="none"`, `muted`, `playsInline`, `controls={false}`, no `autoPlay`, with a play badge and a `0:12`-style duration chip. The lightbox video also keeps `preload="none"` so arrowing past a clip never fetches it — only pressing play does.
      - Returns `null` when the feed is empty **or still loading**: no orphan heading, no skeleton that resolves to nothing (which would be a layout shift on most products).
      - Lightbox is a `createPortal` overlay, not a native `<dialog>` — `showModal` puts the page in the top layer and blocks the e2e harness. Focus moves to the close button on open, Tab is trapped both directions, Escape closes and restores focus to the tile that opened it, ArrowLeft/ArrowRight walk the wall (wrapping), click-outside closes via an `aria-hidden` backdrop that is deliberately not a tab stop.
      - Review title/body/author beside the media come from `useReviews(productId, { sortBy: 'newest', page: 1, limit: 10 })` — filters chosen to be byte-identical to `ProductReviews`' so both share one cache entry — and gated with `enabled: openIndex !== null`. On the PDP that means zero extra requests; the rating and date fall back to the feed item when a caption is not in cache.

      **Verification**:
      - Command: `cd packages/web && bunx vitest run tests/components/product/ReviewMediaWall.test.tsx`
      - Result: PASS (11 tests, 11 passing, 0 failing)
      - Output:
      ```
       ✓ renders one tile per media item for the product
       ✓ renders photos as images and clips as posters with a play badge
       ✓ never autoplays a tile and never preloads its bytes
       ✓ renders nothing at all when the feed is empty
       ✓ renders nothing while the feed is still loading
       ✓ opens a lightbox on the clicked item showing its review
       ✓ does not use a native dialog element
       ✓ moves focus into the lightbox when it opens
       ✓ advances and rewinds with the arrow keys
       ✓ closes on Escape and returns focus to the tile that opened it
       ✓ keeps Tab inside the lightbox
       Test Files  1 passed (1)
            Tests  11 passed (11)
      ```
      - Regression: `bunx vitest run tests/components/product tests/components/reviews` → 18 files, **396 tests passed**, 0 failing.
      - Types: `bunx tsc --noEmit` → 0 errors in `ReviewMediaWall.tsx` and `posters/$slug.tsx` (unrelated pre-existing errors elsewhere untouched).
