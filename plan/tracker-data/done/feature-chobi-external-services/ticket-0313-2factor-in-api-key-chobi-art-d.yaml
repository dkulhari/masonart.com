description: |-
  ## Task
  TWO_FACTOR_API_KEY is PLACEHOLDER in deploy/.env — phone/OTP login and order SMS are dead on staging. Also the code's template-name defaults are still the legacy registered IDs (MasonArt, MasonArtOrderConfirmed, MasonArtShipped, MasonArtOutForDelivery, MasonArtDelivered in packages/api/src/services/sms.ts).

