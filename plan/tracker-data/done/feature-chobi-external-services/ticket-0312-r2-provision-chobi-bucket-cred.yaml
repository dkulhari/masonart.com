ticket_number: 312
title: R2 - Provision chobi bucket, credentials and chobi-cdn CDN route
description: |-
  ## Task
  Replace the legacy masonart R2 setup with chobi-named resources and real credentials. Currently R2_ENDPOINT/R2_ACCESS_KEY/R2_SECRET_KEY are PLACEHOLDER in deploy/.env and R2_BUCKET/CDN_URL still point at masonart-staging / masonart-cdn.xtoms.xyz — uploads and AI-generation storage are broken on staging.

  Steps: create Cloudflare R2 bucket `chobi-staging` with **versioning enabled** (customer uploads and AI generations are non-reproducible); create an R2 API token scoped to the bucket; add custom domain `chobi-cdn.xtoms.xyz` for the bucket (rides the existing zone); update deploy/.env (R2_ENDPOINT, R2_ACCESS_KEY, R2_SECRET_KEY, R2_BUCKET=chobi-staging, CDN_URL=https://chobi-cdn.xtoms.xyz); remove the 'legacy' annotations in deploy/.env.example.

  ## Context
  Part of feature: chobi-external-services
  ⚠️ CDN_URL is baked into the web browser bundle at BUILD time (VITE_CDN_URL build arg) — a web image rebuild + redeploy is REQUIRED, not just a container restart: make -C deploy build-push-deploy.
