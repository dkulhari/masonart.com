      - `bunx tsc --noEmit` (web + api packages): zero new errors introduced by any commit; pre-existing baseline noise unchanged.
      - `bunx vitest run` scoped to every touched file: 165 (stores/lib), 39 (useCart/useCartActions/auth-transition), 21 (useCartActions full suite incl. new syncError test), 83 (api cart + cart-guest-merge incl. new race-guard test) — all passing, 0 failures.
      - Item 4's e2e test could not get a live local pass: this dev box has no `/api` Vite proxy and the API's `CORS_ORIGIN` is pinned to `localhost:3001`, so neither the shared dev server (relative fetch → 404) nor an isolated verification port (cross-origin → CORS block) can complete a UI add-to-cart locally. CI sets `VITE_API_URL=http://localhost:3000` explicitly and matches `CORS_ORIGIN`'s default, so the test runs for real there. Selectors/testids verified by static review and cross-checked against the working pattern in `tests/e2e/flows/checkout.spec.ts`. Shipped per explicit user sign-off after presenting this tradeoff.
