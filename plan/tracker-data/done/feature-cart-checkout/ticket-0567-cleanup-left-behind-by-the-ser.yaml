      2. `720cd60d`* — Widen `ServerCartPayload`/`ServerCartLine` to the real `GET /api/cart` shape (`pricing`, `userId`, `couponCode`, `couponDiscount`, `currency`, `createdAt`, `updatedAt`); drops the `data as unknown as PricedCart` cast in `cart/index.tsx`.
      3. `7f917325` — Delete 6 dead exports from `useCart.ts` (`invalidateCart`, `setCartData`, `getCachedCart`, `useServerCartItemCount`, `useServerCartSubtotal`, `cartKeys.items()`) and their tests.
      4. `e4ea5bf0` — Correct 3 doc blocks in `cart/index.tsx`, `sale-promotions.spec.ts`, `gallery-membership.spec.ts` that still described the write path as nonexistent.
      5. `82fb24fd` — Fix: a superseded `recoverFromServer` call now still sets `syncError` — "add X fails, add Y succeeds" no longer silently drops X's failure notification.
      6. `c4dac484` — Fix: `deleteCookie` moved inside the try in `mergeGuestCartOnAuth` — a transient DB error during merge no longer destroys the guest cart's only handle with no retry.
      7. `53a4278b` — Fix: `mergeGuestCartInto` now claims the guest cart with an atomic `WHERE is_active = true` compare-and-set before touching any items, closing the concurrent-merge lost-update window.
      8. `9d520282` — New e2e test: a UI-driven Add to Cart (not API-seeded) produces a `[data-testid="cart-saving"]` row on `/cart`.

