    text: |-
      ✅ **Completed**

      **Commits** (in order): `ce390f5d`, `0ca80cbf`, `73aabe75`, `7610fa17`, `c8d80fee`, `580167f0`, `9483e0cf`, `9c80dfe1`, `495da77b`, `181bc9a1`, `66c25e75`, `aaaca424`, `cffb286e`, `bdb48b9c`, `d340c975`, `b0c8ef43`, `4c5b1971`, `c743674b`

      **Summary**: The storefront now writes every cart mutation to the server before checkout runs. `packages/web/app/hooks/useCartActions.ts` is the single write path — add/update/remove/clear all go through it, optimistically updating the Zustand store and reconciling against the server response. The store is now a projection of the server cart: `item.id` is the server's `cartItems.id` (`packages/api/src/database/schema/cart.ts`), not a client-invented id — `packages/web/app/lib/cart-projection.ts` is the pure `GET /api/cart` → `CartItem[]` mapping, and `CartSync` loads/reconciles it on arrival. `POST /api/orders` now reads a cart that reflects what the customer actually added.

      **Two deliberate deviations from this ticket's own implementation steps:**

      1. **Step 3 said to wire call sites to the existing TanStack mutation hooks. They were deleted instead** (commit `b0c8ef43`). `useAddToCart`, `useUpdateCartItem`, `useRemoveFromCart`, `useClearCart`, `useMergeCart` and `useIsCartSyncing` (`packages/web/app/hooks/useCart.ts`) each carried their own optimistic-rollback logic against the TanStack Query cache. Keeping them beside the new store-level optimism in `useCartActions.ts` would have meant two optimistic layers reconciling against one server resource — how a cart starts disagreeing with itself. `grep` confirmed all six had zero call sites outside `useCart.ts` before deletion, and zero references anywhere in `packages/web` after. The write path is now the single hook, `useCartActions.ts`.

      2. **The guest-cart merge moved into API middleware, and `POST /api/cart/merge` was deleted, because the endpoint was uncallable.** It required a `guestSessionId` in the request body, but that id lives only in the httpOnly `cart_session` cookie — unreadable from browser JS — and `GET /api/cart` never returned it either. No browser could ever have called it. `mergeGuestCartInto` (`packages/api/src/routes/cart.ts`) now holds the same merge logic, byte-for-byte, from the old handler, invoked by `mergeGuestCartOnAuth` middleware registered right after `optionalAuth` on every `cartApp` route — an authenticated request carrying a guest cookie is merged and the cookie cleared automatically, no client call required.

      **Verification:**
      - `tests/e2e/cart-server-persistence.spec.ts` (commits `4c5b1971`/`c743674b`) is the real proof this ticket asked for — no stubs, real API, real Postgres on :5440. Adds an item through the actual UI, asserts the `POST /api/cart/items` response, reloads, and re-fetches `GET /api/cart` directly via `page.request` (bypassing the page's own state), confirming the server — not a `localStorage` rehydration — is what came back. 3 stable runs, no flakes.
      - `packages/api`: `cart-guest-merge.test.ts` (8/8), `cart-sale-pricing.test.ts` (15/15), `cart.test.ts` (73/73 when the DB is reachable) all green. Full suite regression: 82 failed / 4051 passed / 265 skipped — matches the documented pre-existing baseline noise (admin/auth/health/server/queues/redis), zero new cart-related failures.
      - `packages/web`: `tests/hooks`, `tests/stores`, `tests/components/cart` — 382/382 passing (down from 416; the 34-test drop is exactly the deleted dead-hook suites, independently re-derived). `tsc --noEmit`: 27 errors, same count and same files as the pre-change baseline, none touching cart.
      - `packages/web/tests/stores/cart.test.ts` (50 tests, the dead `packages/web/src/` tree) was left untouched, as instructed — it does not cover the live store and cleanup is out of scope for this ticket.

      **Files touched** (see `.superpowers/sdd/2026-08-06-server-cart-write-path/progress.md` and the per-task reports alongside it for the full diff-by-diff account): `packages/web/app/stores/cart.ts`, `packages/web/app/hooks/useCartActions.ts` (new), `packages/web/app/lib/cart-projection.ts` (new), `packages/web/app/components/cart/CartSync.tsx`, `packages/web/app/hooks/useCart.ts` (mutation hooks deleted), `packages/web/app/lib/api.ts`, `packages/web/app/components/checkout/PaymentButton.tsx`, `packages/web/app/components/product/ProductDetail.tsx`, `packages/api/src/routes/cart.ts` (merge middleware), corresponding test files, and `tests/e2e/cart-server-persistence.spec.ts`.
