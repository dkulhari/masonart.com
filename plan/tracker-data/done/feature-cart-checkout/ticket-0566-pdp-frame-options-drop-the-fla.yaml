      ✅ **Completed**

      **Commit**: `a0e42a79` - fix(web): the PDP prices frames through the shared formula, flat column included

      **Files Changed**:
      - `packages/web/app/routes/posters/$slug.tsx` - stops pre-computing `priceModifier` into a percentage; hands the row's `pricing: { priceModifier, priceAddition }` through untransformed
      - `packages/web/app/components/product/FrameSelector.tsx` - `FrameOptionData.pricing: FramePriceColumns` replaces `priceModifierType`/`priceModifierValue`; `calculateFramePrice` deleted (with its dead `fixed`/paise branch); `formatPriceModifier` becomes `formatFrameUplift(basePrice, pricing)` over `frameAddition`
