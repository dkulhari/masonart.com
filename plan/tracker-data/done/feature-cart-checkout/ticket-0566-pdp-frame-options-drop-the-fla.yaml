      - `packages/web/tests/routes/posters-frame-pricing.test.ts` - coupling guard rewritten: the route transforms nothing, and both PDP surfaces delegate to `@chobii/shared`

      **Summary**:
      Took the "or better" option from the report rather than widening the derived shape. The PDP no longer owns any frame arithmetic — `FrameOptionData` carries the frame row's own price columns and both the swatches and the buy panel call `frameAddition`, the same helper `POST /api/cart/items` and `POST /api/orders` use and the quickview already used. That closes the flat-`priceAddition` drop and removes the class of drift rather than one instance of it.

      A frame at `priceModifier: '1.40'`, `priceAddition: '150.00'` on a ₹2,000 size now quotes ₹2,950 on the CTA, in the config summary, and in the `framePrice: 950` sent to the cart — previously ₹2,800 / `framePrice: 800`, against a server charging 950.

      Also deleted: `calculateFramePrice`'s `fixed`/paise branch, which no production code ever constructed (only tests did).

