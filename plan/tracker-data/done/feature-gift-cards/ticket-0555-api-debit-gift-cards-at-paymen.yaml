  - id: 3
    action: implement
    description: Debit inside the payment transaction and handle full coverage
    file: packages/api/src/routes/orders.ts
    status: pending
    code: |-
      // Inside POST /:id/payment, before creating the Razorpay order.

      if (order.orderType === 'gift_card' && codes.length > 0) {
        // Paying for a gift card with a gift card cycles balance between
        // instruments and turns every refund into a graph traversal.
        return c.json({ error: 'A gift card cannot be bought with a gift card' }, 400)
      }

      const result = await db.transaction(async (tx) => {
        const applied = await redeemGiftCards(tx, order.id, codes, toPaise(order.total), user.id)
        const giftCardPaise = applied.reduce((sum, a) => sum + a.amountPaise, 0)
        const remainder = toPaise(order.total) - giftCardPaise

        await tx.update(orders)
          .set({ giftCardAmount: (giftCardPaise / 100).toFixed(2), updatedAt: new Date() })
          .where(eq(orders.id, order.id))

        // Exactly zero, never a threshold: a one-paisa remainder is still a
        // payment and still needs verifying.
        if (remainder === 0) {
          await tx.update(orders)
            .set({ status: 'confirmed', paymentStatus: 'paid', paidAt: new Date() })
            .where(eq(orders.id, order.id))
          return { fullyCovered: true, remainder }
        }

        // Inside the transaction on purpose: if this throws, the debit rolls back
        // and the customer keeps their balance.
        const razorpayOrder = await createRazorpayOrder({
          amount: remainder,
          currency: order.currency,
          receipt: order.id,
        })
        await tx.update(orders).set({ paymentDetails: { provider: 'razorpay', orderId: razorpayOrder.id } }).where(eq(orders.id, order.id))
        return { fullyCovered: false, remainder, razorpayOrder }
      })
