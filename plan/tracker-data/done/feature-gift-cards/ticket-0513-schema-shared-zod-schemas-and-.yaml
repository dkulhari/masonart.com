ticket_number: 513
title: Schema - shared Zod schemas and types for gift cards
description: |-
  ## Task
  New `packages/shared/src/schemas/gift-card.ts` with the request and response contracts, exported from the package barrel.

  ## Honour the contracts that already exist
  `packages/shared/src/schemas/checkout.ts:198-199` already declares `appliedGiftCardIds[]` and `giftCardAmount` on the cart, and `:359` declares `giftCardAmount` on the order. Those stay and finally become true. Do not add a second, differently-named field for the same thing.

  ## What never crosses the wire
  The full code appears in exactly one place: the delivery email. No response schema in this file may carry it — every card representation returned to any caller exposes `last4` only. Admin responses are no exception; the issue endpoint returns the code once, from its own dedicated response type, and never again.

  ## Context
  Part of feature: gift-cards
  Phase: 1 — Schema + contracts
  Design: `docs/superpowers/specs/2026-08-06-gift-cards-design.md` §4

  Amounts crossing the wire are integer paise, matching the wallet's existing contracts.
