    description: Write the purchase route and mount it
    file: packages/api/src/routes/gift-cards.ts
    status: pending
    code: |-
      // POST /purchase — creates the order only. The card is minted on payment
      // verification (see the mint ticket): minting here would let an abandoned
      // checkout create spendable money.

      const input = c.req.valid('json') // giftCardPurchaseInputSchema
      const amountRupees = (input.amountPaise / 100).toFixed(2)

      const order = await db.transaction(async (tx) => {
        const [created] = await tx.insert(orders).values({
          orderNumber: await generateOrderNumber(),
          userId: user.id,
          status: 'pending',
          paymentStatus: 'pending',
          orderType: 'gift_card',
          // A voucher ships nothing and is taxed at redemption, not at sale.
          shippingMethod: null,
          shippingCost: '0.00',
          tax: '0.00',
          subtotal: amountRupees,
          discount: '0.00',
          total: amountRupees,
          itemCount: 1,
          currency: 'INR',
          /**
           * The purchase lives here until the card exists. A scheduled card is
           * not minted at payment time (its code could never be recovered for
           * the email months later), so the recipient details need a home
           * between purchase and delivery, and the order is where the purchase
           * already is.
           */
          giftCardPurchase: {
            amountPaise: input.amountPaise,
            recipientEmail: input.recipientEmail,
            recipientName: input.recipientName,
            senderName: input.senderName,
            message: input.message ?? null,
            sendAt: input.sendAt?.toISOString() ?? null,
          },
        }).returning()

        await tx.insert(orderItems).values({
          orderId: created.id,
          productId: null, // already nullable at schema/orders.ts:236
          title: `Gift card — ₹${(input.amountPaise / 100).toLocaleString('en-IN')}`,
          quantity: 1,
          unitPrice: amountRupees,
          lineTotal: amountRupees,
        })

        return created
      })

      // The recipient details are needed at mint time. Stash them on the order's
      // metadata rather than inventing a pending-card row that could be orphaned.
      return c.json({ orderId: order.id, orderNumber: order.orderNumber, total: order.total })
