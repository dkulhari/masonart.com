ticket_number: 550
title: API - POST /api/gift-cards/purchase creates the gift card order
description: |-
  ## Task
  New `packages/api/src/routes/gift-cards.ts`, mounted in `routes/index.ts`. `POST /api/gift-cards/purchase` creates an order with `orderType: 'gift_card'` holding one `order_item` with `productId: null` and title `Gift card — ₹2,000`.

  No card is created here. Payment then reuses `POST /orders/:id/payment` and its verify endpoint unchanged.

  ## Not through the cart (G7)
  `cart_items.productId` and `variantId` are both NOT NULL (`schema/cart.ts:115-121`) and the cart derives `lineTotal` from those rows, so it cannot express a customer-typed amount without dummy product and variant records — which would then have to be excluded by hand from listing, facets, search, the sitemap and the sale resolver.

  Accepted cost: a gift card cannot be bought in the same checkout as a poster.

  ## No shipping, no tax
  No address is collected. `shippingCost` and `tax` stay `'0.00'`. A voucher is neither goods nor services, so the tax point is the redemption rather than the sale — recorded now so future tax work does not tax the voucher and then tax the poster it buys.

  ## Context
  Part of feature: gift-cards
  Phase: 3 — Purchase and delivery
  Design: `docs/superpowers/specs/2026-08-06-gift-cards-design.md` §5

  Requires an authenticated user, as order creation already does.
