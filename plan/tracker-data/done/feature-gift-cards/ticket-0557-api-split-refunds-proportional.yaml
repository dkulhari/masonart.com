  - id: 3
    action: implement
    description: Split the refund across tenders
    file: packages/api/src/routes/admin/orders.ts
    status: pending
    code: |-
      // Everything in paise: refundAmount arrives as a float in rupees, and
      // splitting a float is how a rupee goes missing.
      const refundPaise = Math.round(refundAmount * 100)
      const totalPaise = toPaise(order.total)
      const giftCardPaise = toPaise(order.giftCardAmount)
      const capturedPaise = totalPaise - giftCardPaise

      const giftCardLeg = Math.round((refundPaise * giftCardPaise) / totalPaise)
      // Subtracted, never rounded independently, so the legs sum to exactly the
      // refund.
      const razorpayLeg = refundPaise - giftCardLeg

      if (razorpayLeg > capturedPaise) {
        return c.json({ error: 'Refund exceeds the amount captured by the payment gateway' }, 400)
      }

      // Razorpay first: if it fails the transaction rolls back and the card was
      // never credited.
      if (razorpayLeg > 0) {
        if (!paymentDetails?.paymentId) {
          return c.json({ error: 'Payment ID not found for this order' }, 400)
        }
        await createRefund({ paymentId: paymentDetails.paymentId, amount: razorpayLeg, notes: { reason } })
      }

      // A missing paymentId is legitimate when gift cards covered everything.
      if (giftCardLeg > 0) {
        await db.transaction((tx) => refundToGiftCards(tx, order.id, giftCardLeg))
      }
