ticket_number: 563
title: E2E - buy a card, receive it, redeem part, spend the remainder
description: |-
  ## Task
  One Playwright journey in `tests/e2e/gift-cards.spec.ts` covering the whole instrument:

  1. buy a gift card at `/gift-cards`, pay through the test gateway
  2. read the code from the captured delivery email
  3. apply it at checkout on a poster order — assert the amount due drops and the invoice price does not
  4. complete that order
  5. start a second order and spend the remainder — assert the balance carried over

  ## The assertion that matters most
  After step 3, **the item prices must be unchanged**. A gift card is tender: it reduces what is charged, not what things cost. If the poster's price moved, the card has been implemented as a discount and the tax and reporting behind it are wrong.

  ## Context
  Part of feature: gift-cards
  Phase: 8 — E2E
  Design: `docs/superpowers/specs/2026-08-06-gift-cards-design.md` §11

  Seed data gains a gift card fixture. Scope selectors for mobile and desktop — the same test ids exist in both trees.
