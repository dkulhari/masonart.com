      1. Add returnsApi to frontend api.ts with methods:
         - getOrderReturns(orderId) - Get return requests for order + eligibility
         - createReturn(orderId, data) - Create return request
         - getReturn(returnId) - Get return details
         - cancelReturn(returnId) - Cancel pending return
         - getPolicies() - Get return policies

      2. Create return components in packages/web/app/components/returns/:
         - ReturnEligibilityCheck.tsx - Shows eligibility status and days remaining
         - ReturnRequestForm.tsx - Form with reason dropdown and details textarea
         - ReturnStatusCard.tsx - Status timeline for existing return requests
         - ReturnPolicyDisplay.tsx - Summary of return policy
         - index.ts - Barrel exports

      3. Create return request page at packages/web/app/routes/_authed/account/orders.$id.return.tsx
         - Check eligibility first
         - Show form if eligible
         - Show existing return status if exists

      4. Write component tests

      ## Key API Endpoints:
      - GET /api/orders/:orderId/returns - Returns list + eligibility
      - POST /api/orders/:orderId/returns - Create return
      - GET /api/returns/:id - Get return details
      - DELETE /api/returns/:id - Cancel return
      - GET /api/return-policies - Get policies
