ticket_number: 42
title: Frontend - Return Request Flow
description: |-
  Create customer-facing return request submission flow.

  ## Implementation Details

  ### Route Location
  `packages/web/app/routes/_authed/account/orders/$id/return.tsx`

  ### Components to Create

  **ReturnRequestForm.tsx**
  - Reason selector (dropdown with enum values)
  - Reason details textarea (required)
  - Items to return (if partial returns supported)
  - Submit button with confirmation

  **ReturnEligibilityCheck.tsx**
  - Shows if order is eligible for return
  - Displays return window (e.g., "14 days remaining")
  - Shows return policy summary
  - Error state if outside window

  **ReturnStatusCard.tsx**
  - Current return request status
  - Timeline: requested -> approved -> shipped back -> received -> refunded
  - Admin notes if rejected
  - Refund amount when processed

  **ReturnPolicyDisplay.tsx**
  - Summary of return policy
  - Link to full policy page
  - Conditions for return (unopened, etc.)

  ### User Flow
  1. User clicks "Request Return" on order
  2. Eligibility check (within window, order delivered)
  3. Select reason from dropdown
  4. Enter reason details
  5. Confirm and submit
  6. Show confirmation with next steps

  ### Return Status Page
  - View existing return request
  - Track return progress
  - See refund status

  ## Testing Requirements

  ### Component Tests

  **ReturnRequestForm Tests**
  1. test('renders reason dropdown')
  2. test('requires reason details')
  3. test('validates min length')
  4. test('shows loading on submit')
  5. test('displays success message')

  **ReturnEligibilityCheck Tests**
  6. test('shows eligible when within window')
  7. test('shows ineligible when outside window')
  8. test('displays days remaining')
  9. test('shows error for undelivered order')

  **ReturnStatusCard Tests**
  10. test('shows correct status')
  11. test('displays timeline')
  12. test('shows refund amount when processed')

  ### E2E Tests (tests/e2e/returns/request.spec.ts)
  13. test('return button visible on delivered order')
  14. test('eligibility check displays correctly')
  15. test('form validates before submit')
  16. test('successful submission shows confirmation')
  17. test('return status page shows progress')
  18. test('cannot request return twice')

  ## Acceptance Criteria
  - [ ] Return request form functional
  - [ ] Eligibility validation
  - [ ] Status tracking page
  - [ ] Policy display
  - [ ] Component tests passing
  - [ ] E2E tests passing
