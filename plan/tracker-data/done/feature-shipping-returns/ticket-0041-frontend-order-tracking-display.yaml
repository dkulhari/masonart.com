      Starting implementation of order tracking display components.

      ## Implementation Plan:
      1. Add shipments API to frontend api.ts (types and endpoints)
      2. Create tracking components in packages/web/app/components/order/:
         - TrackingTimeline.tsx - Visual timeline showing shipment progress
         - TrackingStatusBadge.tsx - Status badge with icon and color
         - DeliveryEstimate.tsx - Estimated delivery display
         - OrderTrackingCard.tsx - Main card component combining above
      3. Create customer order detail page at packages/web/app/routes/_authed/account/orders.$id.tsx
      4. Write component tests in packages/web/tests/components/order/

      ## Key Decisions:
      - Following existing patterns from OrderList and admin OrderDetail components
      - Using existing API shipments routes (GET /api/orders/:orderId/shipments, GET /api/shipments/:id/track)
      - Reusing status configuration pattern from OrderList component
      - Timeline will show 6 steps: Order Received → Label Created → Shipped → In Transit → Out for Delivery → Delivered
