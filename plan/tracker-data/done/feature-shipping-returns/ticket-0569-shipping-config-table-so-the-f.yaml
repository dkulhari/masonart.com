      - Result: PASS (9 tests)
      - Regressions: `tests/routes/orders.test.ts`, `gallery-join-order-pricing`, `order-cart-cache` → 132 passing; web `cart-free-shipping` + `ShippingSelector` → 25 passing
      - Typecheck: `bunx tsc --noEmit` → 0 errors in packages/api and packages/shared (packages/web's 22 are pre-existing and unrelated)
