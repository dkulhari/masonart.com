ticket_number: 269
title: Create production Dockerfile with multi-stage build for API and Web
description: |-
  ## Task
  Create a production-optimized Dockerfile using multi-stage builds for both the API (Hono) and Web (React Router v7 SSR) packages.

  ## Requirements
  - Multi-stage build: deps → build → runtime (minimal final image)
  - Use official Bun base image (`oven/bun:1`)
  - Copy only built artifacts and production dependencies to final stage
  - Separate build targets for API and Web (or single Dockerfile with build args)
  - Expose correct ports (API: 3000, Web: 3001)
  - Non-root user in final image
  - `.dockerignore` to exclude node_modules, .env, tests, docs

  ## Acceptance Criteria
  - `docker build --target api .` produces a working API image
  - `docker build --target web .` produces a working Web image
  - Final images are under 200MB each
  - Both images start successfully and serve traffic

  ## Files to Create/Modify
  - `Dockerfile` (new)
  - `.dockerignore` (new or update)
  - `docker/docker-compose.prod.yml` (new)
