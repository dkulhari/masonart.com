ticket_number: 284
title: Add retry logic with exponential backoff for email and SMS services
description: |-
  ## Task
  Email and SMS services currently fail silently on transient errors. Add retry logic to prevent lost notifications.

  ## Requirements
  - Retry transient failures (network errors, 5xx responses) up to 3 times
  - Exponential backoff: 1s, 4s, 16s
  - Don't retry permanent failures (invalid email, 4xx responses)
  - Log each retry attempt with context
  - After max retries, log error and optionally queue for manual review

  ## Services to Update
  - Email (Resend): `packages/api/src/services/email.ts`
  - SMS (2Factor.in): `packages/api/src/services/sms.ts`

  ## Implementation
  - Create shared retry utility: `packages/api/src/lib/retry.ts`
  - Wrap API calls in retry logic
  - Distinguish retryable vs non-retryable errors
