ticket_number: 383
title: 'Sweep - product and review surfaces: monochrome badges, rating token, product type scale'
description: |-
  ## Task
  The product surfaces carry the last brand-coloured chrome that sits directly next to artwork, where it clashes hardest (analysis §3.3).

  - **ProductCard.tsx** — the `Featured` badge is `bg-brand-500` and the `AI` badge is `bg-purple-500`. Both go monochrome: Featured becomes `bg-foreground text-background`, AI keeps its `Sparkles` icon but becomes `bg-background/90 text-foreground border border-foreground/15` so it reads as a marker rather than a brand colour. Title hover `hover:text-brand-600` becomes `hover:text-foreground/60`. Title size `text-base` becomes `text-product` (the measured fluid clamp) — this is the `⚠️ no clamp` row in the analysis token table.
  - **ProductDetail.tsx** — headings drop `font-bold`; the add-to-cart CTA becomes a full-width `Button` pill. Do NOT restructure the buy panel or the frame selector — Phase E.
  - **ProductReviews.tsx**, **reviews/ReviewSummary.tsx** — every `fill-yellow-400 text-yellow-400` becomes `fill-rating text-rating`; drop `font-bold`.
  - **checkout/OrderSummary.tsx** — drop `font-bold`.

  `--mat`, `MEDIA_RATIO`, the square-media contract and the grid geometry are untouchable: they are the #360–#375 product-grid-alignment contract and are covered by E2E tests.

  ## Context
  Part of feature: mesonart-design-parity
  Phase: 3 — Storefront sweep
  Files: `packages/web/app/components/product/{ProductCard,ProductDetail,ProductReviews}.tsx`, `packages/web/app/components/reviews/ReviewSummary.tsx`, `packages/web/app/components/checkout/OrderSummary.tsx`
  Test: `packages/web/tests/components/product/ProductCard.tokens.test.tsx` plus a source guard for the rest.
