ticket_number: 385
title: Guard - storefront token-compliance test and full verification against the main baseline
description: |-
  ## Task
  A sweep with no guard rots back within a few features. Add one test that walks the storefront source tree and fails on the specific regressions this feature exists to prevent — the same shape as the existing `tests/styles/mat-token.test.ts` coupling guard.

  The guard asserts, over `packages/web/app/**/*.tsx` excluding `app/components/admin/**`, `app/routes/admin/**` and `app/components/ai-generator/**`:
  1. No `font-bold` / `font-extrabold` / `font-black` — weight 700 is not loaded, so these render faux-bold.
  2. No `fill-yellow-400` / `text-yellow-400` — the `--rating` token exists for this.
  3. No `bg-brand-` / `from-brand-` / `to-brand-` — the brand scale is admin-and-AI-only now.
  4. No `blur-3xl` — the marketing blob idiom.

  The exemption list lives in the test with a comment explaining each, so the next person adding a directory has to make the case in writing.

  Then run the full verification: web unit suite, typecheck, and the grid E2E — diffed against the main baseline, which already carries ~86 API failures and ~26 TS errors that are not ours.

  ## Context
  Part of feature: mesonart-design-parity
  Phase: 4 — Guard and verification
  File: `packages/web/tests/styles/storefront-token-compliance.test.ts`
  This is the last ticket — it must be written after the sweep, or it fails for reasons unrelated to its own correctness.
