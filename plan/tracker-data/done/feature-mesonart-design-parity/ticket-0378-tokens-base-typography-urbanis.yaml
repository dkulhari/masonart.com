ticket_number: 378
title: 'Tokens - base typography: Urbanist 300 headings, Poppins 300 body, fluid clamp scales'
description: |-
  ## Task
  `--font-heading: 'Urbanist'` is declared at globals.css:126 and consumed nowhere. `__root.tsx` loads Poppins 300/400/500 and Urbanist 300/500 — weight 700 is never loaded, yet 47 files use `font-bold`, so every heading renders faux-bold Poppins.

  Fix at the base layer so headings are right by default rather than per-component:
  - `body` gets `font-weight: 300` and `line-height: 1.2` (measured).
  - `h1..h6` get `font-family: var(--font-heading)`, `font-weight: 300`, `line-height: 1`.
  - H1 renders at the measured display size (~44px) via clamp.
  - Add the three measured fluid scales as tokens and Tailwind `fontSize` entries: `--font-nav-size`, `--font-button-size`, `--font-product-size`.

  This makes the later per-file `font-bold` removal a deletion rather than a rewrite.

  ## Context
  Part of feature: mesonart-design-parity
  Phase: 1 — Tokens
  Files: `packages/web/app/styles/globals.css`, `packages/web/tailwind.config.ts`
  Measured clamps: docs/design/mesonart/mesonart-parity-analysis.md Appendix A.
  Note: `/admin` headings inherit this too. That is acceptable and desirable — it is a font change, not a colour change, and admin already uses the same body font.
