    description: Add the fluid type tokens and the base body/heading rules; register the fontSize utilities in Tailwind
    file: packages/web/app/styles/globals.css
    status: pending
    code: |-
      /* :root — measured on mesonart, Appendix A */
      --font-nav-size:     clamp(0.875rem, 0.748rem + 0.3174vw, 1.125rem);
      --font-button-size:  clamp(0.875rem, 0.8115rem + 0.1587vw, 1rem);
      --font-product-size: clamp(1rem, 0.873rem + 0.3175vw, 1.25rem);
      --font-display-size: clamp(1.75rem, 1.2rem + 2.2vw, 2.75rem);  /* H1 ~44px at 1600 */

      /* @layer base */
      body {
        @apply bg-background text-foreground antialiased;
        font-feature-settings: "rlig" 1, "calt" 1;
        font-weight: 300;
        line-height: 1.2;
      }

      h1, h2, h3, h4, h5, h6 {
        font-family: var(--font-heading);
        font-weight: 300;
        line-height: 1;
      }

      h1 { font-size: var(--font-display-size); }

      /* tailwind.config.ts -> theme.extend */
      fontSize: {
        nav: 'var(--font-nav-size)',
        button: 'var(--font-button-size)',
        product: 'var(--font-product-size)',
        display: 'var(--font-display-size)',
      },
