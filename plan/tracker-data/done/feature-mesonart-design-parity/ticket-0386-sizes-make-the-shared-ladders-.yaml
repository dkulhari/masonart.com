      - `packages/api/src/database/seed.ts` — `variantsByOrientation` deleted, seeding driven by the shared ladder
      - `packages/api/tests/database/seed-variants.test.ts` — new, including a guard that the hand-written table does not come back

      **Summary**:
      Two size systems existed and disagreed. The shared ladders and `getSizesForOrientation()` were referenced only by their own test file — fully unit-tested dead code — while `seed.ts` hand-wrote a 4-step table per orientation with different numbers (seed square 12/18/24/36" against the ladder's 12/16/20/24/30/36/40/48"). The seed won by default because it is what reaches the database.

      There is now one source of truth. Ladders: square 8→13 (ceiling 48→72"), rectangular 8→17 (→80×60"), panoramic 4→13 (→50×100", and no longer uniformly 3:1). Pricing moved from a hand-entered per-variant addition to `priceForSize()` — area-driven with the measured ~31% volume taper, interpolated in log-area space across the step's own ladder so the decline does not become a function of ladder depth. The smallest step prices at exactly `basePrice`, which is load-bearing for the `From <basePrice>` shown on every card. Labels are dual-unit inline.

