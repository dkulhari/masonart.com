      ✅ **Completed**

      **Commit**: `83d1aadf` — feat(shared): wire the size ladders in as the source of truth for variants

      **Files Changed**:
      - `packages/shared/src/constants/sizes.ts` — ladders extended to the measured step counts via a new `buildLadder()`; added `priceForSize()` and `displayLabelDual`; `priceTier` now derived from ladder quartile
