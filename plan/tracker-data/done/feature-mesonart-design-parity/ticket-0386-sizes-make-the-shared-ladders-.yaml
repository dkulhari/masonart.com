      - api: 36 failures against **38 on the parent branch** — two fewer, none size- or variant-related; all pre-existing AI/redis/queue/auth/health suites
      - web: PASS (1601/1601)
      - typecheck: 23 errors, exactly the pre-existing baseline
      - reseed: 41 products now carry 13–17 variants each rather than 4. Square entry step `599.00` == basePrice; unit rate falls 4.16 → 2.87 ₹/in² across the ladder — a 31% taper, matching the measured figure.

      **Deferred (stated out of scope in the ticket)**: the `Show in cm` toggle in `SizeSelector.tsx` is now redundant against dual-unit labels, but removing it is Phase E PDP work. Circle and Set of 2/3 families await the Phase C facet decision. The finish axis stays an add-on list — §5.6.4 explicitly rejects copying their 98-row matrix.
