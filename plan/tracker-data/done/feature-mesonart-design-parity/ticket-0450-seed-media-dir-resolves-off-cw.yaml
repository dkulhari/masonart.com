    text: |-
      ✅ **Completed**

      **Commit**: `4dbc372d` - fix(api): anchor the seed's media directory to the repo, not the caller

      **Files Changed**:
      - `packages/api/src/database/seed-images.ts` - `REPO_ROOT` anchored to `import.meta.url`; `SEED_MEDIA_DIR` and the renamed, now-exported `SEED_IMAGE_CACHE_DIR` derive from it; added `summarizeLocalSeedMedia()`
      - `packages/api/src/database/seed.ts` - `reportReferenceMedia()` logs resolved/total and the directory at the top of `seedProducts()`
      - `packages/api/tests/database/seed-media-dir.test.ts` - new, 7 tests
      - `packages/api/tests/lib/image-processing-seed-media.test.ts` - dropped its duplicate anchored path for the shared constant

      **Root Cause**: `SEED_MEDIA_DIR` defaulted to `join(process.cwd(), ".cache", "seed-media")`. `packages/api/package.json:31` runs the seed with cwd at the package root, so it resolved to `packages/api/.cache/seed-media` — absent. `localSeedMediaSet` returns `[]` for a missing directory and `sourcesFor` reads that as "use the declared URLs", so the run exited 0 having seeded all 41 products from remote stock photos.

      **Location**: `packages/api/src/database/seed-images.ts:39-40` (pre-fix)

      **Fix**: Both cache paths derive from the module's own location. Four levels up lands on the repo root from `src/database/` and from `dist/database/` alike, so the built output behaves the same. The `SEED_MEDIA_DIR` env override is untouched. `seedProducts()` now prints the resolved count and directory before it starts, so a wrong path and a fixture-less clone stop being indistinguishable.

      **Verification**:
      - Command: `npx vitest run tests/database/seed-media-dir.test.ts tests/database/seed-images.test.ts tests/lib/image-processing-seed-media.test.ts tests/lib/image-processing-mat.test.ts tests/lib/image-processing-crop.test.ts`
      - Result: PASS (5 files, 56 tests, 0 failing, 304s)
      - Command: `npx tsc --noEmit` in `packages/api`
      - Result: PASS (exit 0, no diagnostics)

      Red-phase evidence, run from `packages/api`:
      ```
      Expected: "/Users/dhruv/work/masonart.com/.cache/seed-media"
      Received: "/Users/dhruv/work/masonart.com/packages/api/.cache/seed-media"
      ```

      Direct proof of the fix, probe run from the cwd that broke it:
      ```
      cwd                 : /Users/dhruv/work/masonart.com/packages/api
      SEED_MEDIA_DIR      : /Users/dhruv/work/masonart.com/.cache/seed-media
      SEED_IMAGE_CACHE_DIR: /Users/dhruv/work/masonart.com/.cache/seed-images
      summary             : { resolved: 41, total: 41, dir: ".../.cache/seed-media" }
      ```
      41/41 where the broken build resolved 0/41.

      Corroborating disk state before the fix: `packages/api/.cache/seed-images/` existed (written by the bad run) while `packages/api/.cache/seed-media/` never did, and the root `.cache/seed-media/` holds all 168 fixture files.

      **Not verified — needs a reseed**: the acceptance line "room-mockup count is 122 after a reseed" is unrun. It mutates the dev database, so it was left for an explicit go-ahead rather than triggered from this ticket. Everything upstream of that count is proven above; the count is its consequence. Run `bun run seed` in `packages/api` and check:
      ```sql
      SELECT count(*) FROM products p, jsonb_array_elements(p.images) i
      WHERE i->>'type' = 'room-mockup';
      ```
