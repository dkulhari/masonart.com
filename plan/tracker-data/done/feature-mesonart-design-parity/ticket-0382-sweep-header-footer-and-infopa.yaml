ticket_number: 382
title: Sweep - Header, Footer and InfoPage chrome onto the monochrome system
description: |-
  ## Task
  Global chrome, restyled only — the Phase B restructure (centered wordmark, two-row nav, announcement bar) is explicitly out of scope.

  - **Header.tsx** — wordmark drops `font-bold` for `font-heading font-light`; `text-primary` on `.art` stays (it is now near-black, so drop it to plain `text-foreground` and let the wordmark read as one word); nav links move to `text-nav`; the cart count badge keeps `bg-primary text-primary-foreground` and now renders near-black rather than orange, which needs no code change but must be verified.
  - **Footer.tsx** — drop `font-bold` headings for the base heading style; any `text-brand-*` link colour becomes `text-foreground`/`text-muted-foreground`.
  - **InfoPage.tsx** — same treatment; this is the shared shell for about / faq / shipping / returns / terms / privacy / cookies, so it is seven pages for one edit.
  - **__root.tsx** — the skip-link uses `focus:bg-brand-500`; move to `focus:bg-primary focus:text-primary-foreground`. The 404 and error boundaries use `rounded-md bg-primary` — move to `buttonVariants()`.

  ## Context
  Part of feature: mesonart-design-parity
  Phase: 3 — Storefront sweep
  Files: `packages/web/app/components/layout/{Header,Footer,InfoPage}.tsx`, `packages/web/app/routes/__root.tsx`
  Test: `packages/web/tests/components/layout/chrome-tokens.test.ts`
  Header has a mobile drawer with scroll-lock and Escape handling (#348) — do not touch that logic, only classes.
