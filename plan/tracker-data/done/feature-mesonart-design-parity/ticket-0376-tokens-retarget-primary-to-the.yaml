ticket_number: 376
title: Tokens - retarget primary to the monochrome pill palette and add band/highlight/sale tokens
description: |-
  ## Task
  Make `--primary` the measured mesonart near-black (`rgb(23 23 23)` == `hsl(0 0% 9%)`) instead of orange `25 95% 53%`, and add the tokens the sweep needs: `--sale` (rose-600, `225 29 72`), `--band` (beige `#E5E2D5`), `--band-strong` (warm sand `rgb(219 216 194)`), `--highlight` (peach `rgb(255 221 191)`), `--radius-pill` (`3.75rem`), `--border-button` (`2px`).

  The `--brand-*` scale stays defined and stays registered in Tailwind — `/admin` and the AI-generator surface consume it and are out of scope. Only `--primary`, `--ring` and `--sidebar-primary` move.

  `--mat` must NOT be touched: sharp bakes it into image pixels server-side (see the comment at globals.css:62 and tests/styles/mat-token.test.ts).

  Dark mode keeps a pill by inverting: `--primary: 0 0% 98%` / `--primary-foreground: 0 0% 9%`.

  ## Context
  Part of feature: mesonart-design-parity
  Phase: 1 — Tokens
  Files: `packages/web/app/styles/globals.css`, `packages/web/tailwind.config.ts`
  Measured values: docs/design/mesonart/mesonart-parity-analysis.md Appendix A.
  Existing `tests/styles.test.ts` only asserts token EXISTENCE, not values — it must keep passing, which is why `--brand-*` is preserved.
