    text: |-
      ✅ **Completed**

      **Commit**: `25e41dd2` — test(e2e): wishlist reordering and collection staging

      **Files Changed**:
      - `tests/e2e/wishlist-reorder.spec.ts` — 8 tests, chromium
      - `tests/e2e/wishlist-staging.admin.spec.ts` — 8 tests, chromium-admin, serial
      - `packages/api/tests/routes/admin/collections.test.ts` — 3 tests closing the gap flagged on #503

      **A real race the tests exposed, and did not paper over**

      The round-trip assertion failed repeatedly even **serially, single-worker**. Cause: the move applies optimistically while the store's own `load()` may still be in flight from the page mount, and when that resolves it replaces `ids` wholesale — reverting the move on screen.

      The assertion now polls. But the underlying behaviour is real, not a test artifact: **a shopper who reorders within the load window sees their move undone.** Narrow — `load()` normally settles before anyone can click — and I have deliberately *not* patched it at the tail end of this work, because guarding `load()` against in-flight writes touches a store with 85 existing tests and deserves its own ticket rather than a rushed change. Recording it here so it is not rediscovered from scratch.

      **Why the staff spec is serial**

      Every test signs in as the same staff account, and a wishlist belongs to an account. In parallel they mutate one another's list, which trips the reorder endpoint's permutation guard (#500), returns 409, and reloads — wiping the arrangement the test was about to assert. That is the **single-staging-slot property** showing up in the suite, and it is exactly what would happen if two admins shared a login. Documented in the file rather than left as an unexplained `mode: 'serial'`.

      **Two of my own mistakes, both caught by running**
      - `stageThree` originally clicked three hearts blindly. Hearts are a **toggle**, and the admin's server-backed list arrives with whatever earlier tests saved — so it was un-saving items. It now adds only what is missing, checking `aria-pressed`.
      - Product titles were read with `h2, h3`, which matches nothing: ProductCard renders the title inside a `<Link>`, with no heading. That yielded an empty array and a confusing "expected 4, received 0". Same trap noted on #502.

      **Coverage**

      | | |
      |---|---|
      | shopper, chromium | 8 passed — also stable at 2 workers |
      | staff, chromium-admin | 8 passed, serial |
      | API units | 68 passed |
      | web units | 128 passed |

      Signed-out reordering is covered separately from signed-in because they persist through entirely different mechanisms — localStorage versus a PUT — and only one can be broken at a time. Drag is exercised with Playwright's real `dragTo` rather than the synthetic events the unit tests fire.

      **Cleanup**: the staff tests create real collections with stamped slugs. 16 probe rows removed afterwards; the table is back to the seeded 14. Stamping prevents unique-slug collisions across runs, but the rows accumulate — a fixture teardown would beat my manual delete, same note as on the curated-collections E2E.
