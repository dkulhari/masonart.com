ticket_number: 504
title: E2E - order survives a reload, and staging reaches the storefront
description: |-
  ## Task

  One spec per audience.

  **Shopper** (`tests/e2e/wishlist-reorder.spec.ts`, chromium)
  - save three products, reorder with the move buttons, reload, and the order holds
  - the same signed OUT, where persistence is localStorage rather than the API
  - the first row cannot move earlier and the last cannot move later

  **Staff** (`tests/e2e/wishlist-staging.admin.spec.ts`, chromium-admin)
  - heart three products in a deliberate order, press Create collection from these, and land on the edit form
  - give it a title, save, and open `/collections/<slug>` — the products appear **in the staged order**
  - a shopper does not see the staging bar at all

  The order assertion is the point of both. Everything else is scaffolding.

  ## Context

  Feature: wishlist-curation, final phase.

  `waitUntil: 'networkidle'` in `beforeEach`, per the repo convention. Scope selectors for mobile vs desktop — the same testids exist in both trees.

  Run the API through `npm run dev` so `DISABLE_RATE_LIMIT=true` is set; the auth limiter allows 5 logins per 60s across all local traffic and four role setups exceed it (this is what made auth.setup.ts look broken during curated-collections).

  The staff spec creates real collections. Stamp the slug per run so a re-run cannot collide on the unique index, and clean up after.
