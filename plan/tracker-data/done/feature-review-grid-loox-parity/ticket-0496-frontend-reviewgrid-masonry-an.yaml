      Done in a1b87351 — the fused card and the masonry grid, built against docs/design/mesonart/mesonart-reviews-page-loox.png (6 columns, unfiltered) and mesonart-pdp-reviews-loox.png (5 columns, product-filtered).

      **What landed**
      - `app/components/reviews/ReviewGridCard.tsx` — one card, media and words: media slot (photo, or clip with poster + centred play overlay, `+N` corner badge for the extra attachments) → author + Verified check → date → stars → body → "Item type:" → product chip (thumb, title, `#SKU`). A review with no media is this same card with the slot omitted. `composeItemType()` joins the API's parts (#495 returns sizeLabel/frameName/frameType, never a string) and prefers frameName over frameType.
      - `app/components/reviews/ReviewGrid.tsx` — CSS `columns` masonry with `break-inside-avoid` wrappers. No measuring pass, no layout dependency. `xl:columns-6` unfiltered / `xl:columns-5` with a productId — that prop is the only difference between the two deployments. Accumulates pages behind "Show more reviews", owns the lightbox, and walks a flat list of every attachment in the wall so prev/next is not trapped inside one review.
      - `app/components/reviews/ReviewMediaLightbox.tsx` — the wall's lightbox lifted out verbatim and now shared. `ReviewMediaWall` imports it; **not deleted**, the PDP still needs it until #498. Its 11 tests still pass untouched.
      - `hooks/useReviews.ts` — `useReviewCards(productId, page, pageSize)` + `reviewKeys.cards`, and `useCreateReview` now invalidates the card feeds too.
      - `lib/api.ts` — `ReviewItemType` / `ReviewProductChip`, `ReviewFeedItem` gains `verified` + `itemType` + `product.sku`, and a new `reviewsApi.listForProduct()` that goes through `getApiUrl()`. The three existing feed fixtures were updated for the widened shape.

      **Guards carried / added**
      - #488's video rule survives the component swap: `preload="none"`, poster set, `autoplay` null — asserted on the card, not just on the old wall.
      - The media slot's `aspect-ratio` is reserved from the stored dimensions before decode (clamped 0.6–1.8 so one 9:21 screen recording can't reserve a column of nothing), so columns don't re-balance as photos land.
      - `reviewsApi.listForProduct` is asserted to fetch an absolute URL, never a relative `/api` — the #493 bug.

