    text: |-
      REQUIREMENT RE-DERIVED — the description table below was written from the still and gets the structure wrong. Measured spec: docs/design/mesonart/home-reviews-band-measured-spec.md (read off the live loox-dynamic-carousel-widget's open shadow root at viewport 1624).

      THE CORRECTION. It is not one rail of alternating slides. The widget is a two-column CSS grid holding two independently-tracked swipers over the same review list:

        grid-template-columns: 383.994px 1127.76px; gap: 16px; grid-template-rows: 423.994px

      Left column is a FIXED blush plate (#f6efec, radius 40) that quote cards translate through — it never leaves the screen. Right column is a strip of 560x424 media tiles, two fully visible (items-per-view="2"), 8px apart. One index drives both. "Slides alternate card, tile, card" describes what a still of that looks like, not what it is; buildReviewSlides implemented the still faithfully and produced a different band.

      Other measurements that differ from the table:
      - Plate blush is #f6efec, not #f6ebe6.
      - Quote mark is their own 54x38 two-comma path in #78583b, hung -8,-8 OUTSIDE the plate's top-left corner. A typographic &ldquo; in the heading face is a visibly different shape, and inside the plate's overflow-hidden the rounded corner cuts both marks into half-discs.
      - Card interior: grid, padding 56/40, gap 16. Stars 24px #ff8d00. Body 24px/36px #4c4642. Sign-off floored bottom-right: badge 18px #685c53, name 18px #33302e.
      - Header stars are #f5c264 at 16px — a DIFFERENT orange from the slides' #ff8d00.
      - Heading text is "Customer Reviews", 42px/50.4px weight 300.
      - Pagination is Swiper dynamic bullets, left-aligned 64px in from the content edge: five visible, active 24x8 pill, neighbours 8x8, outermost pair 5x5. Not one dot per page, not centred.
      - Arrows 56px white circles centred on the 424 rail — left centre on the content's left edge, right centre 8px inside the right edge.

      REBUILT. Component and its 58 tests rewritten around the two-track model; 205 home/review tests green. Verified live at 1624: plate 384x424, stars 24, sign-off flush to the 56px bottom padding, arrows centred on the rail, pagination 64px in, header-to-rail gap 64 (spec 63).

      Knowingly not matched, and why: SectionBand's 96px section padding and container-wide's 1504 content width are global tokens shared by every band — forking one band away from them is a system decision, not a parity patch. text-section renders the heading at 45px/1.0 against their 42/50.4, same reasoning (#540). Mobile (items-per-view-mobile="3") is still unmeasured — the browser would not change the live page's layout viewport.
  - author: mcp-client
    timestamp: '2026-08-07T11:14:25.633Z'
    text: |-
      DECISION on the three remaining divergences, taken with dhruv: HOLD THE SYSTEM.

      - Heading stays 45px/1.0 via text-section (theirs 42/50.4). #540 deliberately put this heading on the shared band token; forking it buys parity on one band and costs alignment with every band above and below it.
      - Section keeps SectionBand's 96px (theirs 64px). Same reasoning — SectionBand owns the page's vertical rhythm.
      - Content keeps the 1600 page-width cap, so 1504 against their 1528. The cap is itself a measured mesonart number; relitigate it globally or not at all.

      Also decided: our arrows stay centred on the 424 rail. Theirs sit 22px above the tile row's centre. A blind critic named that offset as its single strongest structural tell and then said in the same breath that naming it as the fix means telling the reimplementation to reproduce the original's miscentring. Not copying it.

      These four are now the documented answer, not open gaps. Anything else that differs is a bug.

      Method note for the next parity ticket: docs/design/mesonart/*.png is one frame of an animating component and is not a spec. The stills show three photo tiles at ragged widths (548/348/184); that is Swiper's material effect caught mid-advance, and every slide is a uniform 560 in the live DOM. A blind critic reading only the still called our uniform tiles the giveaway, which would have been a wrong fix. Loox's shadow root is open — read it. It hydrates only after a real wheel scroll into view; scrollIntoView() and window.scrollTo do not trigger it, and Playwright headless never hydrated it at all.
