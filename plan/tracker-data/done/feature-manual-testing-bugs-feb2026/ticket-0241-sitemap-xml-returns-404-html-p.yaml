ticket_number: 241
title: Sitemap.xml returns 404 HTML page instead of XML sitemap
description: |-
  ## Bug
  `/sitemap.xml` returns the app's 404 HTML page instead of a proper XML sitemap. The robots.txt correctly references `Sitemap: https://masonart.com/sitemap.xml` but the endpoint doesn't exist.

  ## Steps to Reproduce
  1. `curl -s http://localhost:3001/sitemap.xml | head -5`
  2. Observe HTML instead of XML

  ## Impact
  - Search engines cannot discover pages via sitemap
  - SEO significantly impacted
  - robots.txt references a non-existent resource

  ## Expected
  Valid XML sitemap with all public URLs
