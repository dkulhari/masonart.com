    text: |-
      ✅ **Completed and verified on production** (commit 16b29250, deployed 2026-07-27).

      Root cause: framework-level — TanStack Start's createStartHandler hard-returns a JSON 500 when Accept lacks text/html or */*. Fix: packages/web/app/server.tsx mirrors that exact rejection predicate for GET/HEAD and answers 406 first; only requests that would have 500'd can match, so browsers/crawlers/server-functions are untouched.

      Verification: TDD via new tests/e2e/accept-header.spec.ts (red 500 → green 406; wildcard + browser Accepts still 200 text/html); regression smoke layout+home 142 passed; production: Accept: application/xml → 406 "Not Acceptable: this server serves text/html". Closes the last of the 13 Feb-2026 manual-testing tickets.
