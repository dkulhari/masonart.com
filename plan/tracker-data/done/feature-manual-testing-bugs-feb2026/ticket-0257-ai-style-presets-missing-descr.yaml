title: AI style presets missing description, category, isPremium fields in API response
description: 'GET /api/ai/style-presets returns only id and name for each preset, missing: description (what the style does), category (artistic/photographic/etc), isPremium (boolean for PRO badge). The frontend shows PRO badges on Photography and Art Deco presets, but the API response has no isPremium field, suggesting this is hardcoded on the frontend. According to the ai-api.md test spec, each preset should have: id, name, description, category, isPremium.'
