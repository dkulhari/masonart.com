ticket_number: 266
title: No rate limiting on authentication endpoints
description: Authentication endpoints (sign-in, sign-up) have no rate limiting headers and no apparent rate limiting enforcement. No X-RateLimit-*, Retry-After, or similar headers found. This allows brute force attacks, credential stuffing, and account enumeration. Auth endpoints should return rate limit headers and 429 after threshold. The API middleware directory has rate-limit referenced and Redis is available.
