    text: |-
      ✅ **Completed**

      **Commit**: `89806688` - fix(auth): send real verification + password-reset emails; add forgot/reset pages

      **What was built** (the 404 was the tip — the whole flow was missing):
      - `/auth/forgot-password` page: email form → authClient.requestPasswordReset → no-enumeration "check your email" state
      - `/auth/reset-password` page: token from emailed link → new-password form with validation → success + redirect to login; invalid/expired-link state
      - API side: `sendResetPassword` hook in Better Auth config (the /request-password-reset endpoint was DISABLED without it — returned 400) + branded reset email template through the existing Resend service

      **Verification**:
      - API: `bunx vitest run tests/routes/auth-emails.test.ts` — 4/4 (red→green TDD; includes no-enumeration and non-prod send-gating assertions)
      - E2E: `bunx playwright test tests/e2e/password-reset.spec.ts --project=chromium` — 5/5 (login link navigates, submit → success state, validation, invalid-link state)
      - Typecheck clean on new files

      **⚠️ Needs deploy** (build-push-deploy) to reach production — batched with #341 and #342.
