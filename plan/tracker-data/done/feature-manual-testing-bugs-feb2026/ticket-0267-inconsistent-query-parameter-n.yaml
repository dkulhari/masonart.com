ticket_number: 267
title: 'Inconsistent query parameter naming: style vs styles on category links'
description: |-
  Home page category links use two different query parameter names for the same filter:

  Using plural `styles=`: /posters?styles=abstract, /posters?styles=nature, /posters?styles=minimalist, /posters?styles=typography
  Using singular `style=`: /posters?style=abstract, /posters?style=botanical, /posters?style=minimalist

  Both params also appear on the /posters page itself. If both work identically this is just a consistency concern, but if only one is read by the filter logic, some category links from the home page silently fail to filter.

  Could not verify actual filter behavior due to API timeout blocking product data.
