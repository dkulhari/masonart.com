ticket_number: 240
title: All static/info pages return 404 (about, contact, faq, shipping, returns, privacy, terms, cookies)
description: |-
  ## Bug
  All 8 informational pages linked from the navigation header, footer, login page, and register page return 404:
  - /about - linked from header nav "About"
  - /contact - linked from footer "Company > Contact"
  - /faq - linked from footer "Company > FAQs"
  - /shipping - linked from footer "Company > Shipping Info"
  - /returns - linked from footer "Company > Returns & Refunds"
  - /privacy - linked from footer legal links AND login/register pages
  - /terms - linked from footer legal links AND login/register pages
  - /cookies - linked from footer legal links

  ## Steps to Reproduce
  ```bash
  for page in about contact faq shipping returns privacy terms cookies; do
    curl -s -o /dev/null -w "$page: %{http_code}\n" http://localhost:3001/$page
  done
  ```
  All return 404.

  ## Impact
  - Users clicking any footer Company link or legal link get a 404
  - Login/Register "Terms of Service" and "Privacy Policy" links are broken
  - Header "About" navigation link is broken
  - Multiple dead links across the entire site

  ## Expected
  Each page should render with appropriate content (even placeholder)
