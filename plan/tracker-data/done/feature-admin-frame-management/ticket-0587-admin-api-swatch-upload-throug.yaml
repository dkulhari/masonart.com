  - id: 3
    action: implement
    description: Add the swatch upload endpoint
    file: packages/api/src/routes/admin/frames.ts
    status: done
    code: |-
      /**
       * Upload one frame swatch.
       *
       * Deliberately NOT `buildProductMedia`. That pipeline mats artwork, measures
       * the art box and honours a crop window, all because a piece of art must never
       * be cropped blindly. A swatch is a photograph of a moulding: it fills its
       * square, there is nothing to measure, and matting it would put a canvas
       * border around a product photo.
       *
       * One upload fills both columns — the variant ladder already contains a
       * thumbnail and a card size, so the form has no second image field to keep in
       * sync.
       */
      adminFramesApp.post("/upload-image", async (c) => {
        const formData = await c.req.formData();
        const file = formData.get("file") as File | null;

        if (!file) {
          return c.json({ error: "No file provided" }, 400);
        }
        if (!ADMIN_IMAGE_MIME_TYPES.includes(file.type)) {
          return c.json(
            { error: "Invalid file type. Supported: JPEG, PNG, WebP" },
            400
          );
        }
        if (file.size > MAX_ADMIN_IMAGE_MB * 1024 * 1024) {
          return c.json(
            { error: `File too large. Maximum size is ${MAX_ADMIN_IMAGE_MB}MB` },
            400
          );
        }

        try {
          const buffer = Buffer.from(await file.arrayBuffer());
          const uploaded = await uploadOptimizedImage(
            buffer,
            file.name,
            file.type,
            { prefix: StoragePaths.FRAMES }
          );

          const variant = (name: string) =>
            uploaded.variants.find((v) => v.name === name)?.url;

          return c.json(
            {
              success: true,
              thumbnailUrl: variant("thumbnail") ?? uploaded.webpUrl,
              imageUrl: variant("card") ?? uploaded.webpUrl,
            },
            201
          );
        } catch (error) {
          console.error("[AdminFrames] Swatch upload failed:", error);
          return c.json({ error: "Failed to upload image" }, 500);
        }
      });
