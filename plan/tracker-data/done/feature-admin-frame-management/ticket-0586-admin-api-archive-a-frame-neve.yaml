      **Summary**:
      `DELETE` reads the target, counts active frames, and either refuses with 409 or flips `isActive` to false. `deleteMock` is asserted never to have been called, so the "archive not delete" rule is pinned by the test rather than by the comment.

      **One decision beyond the ticket**: archiving an already-archived frame returns 200 and writes *nothing*, rather than issuing a redundant update. A second write would only move `updatedAt` for a change nobody requested, and the admin list shows `updatedAt` — so a double-click would make a row look freshly touched when it was not. The idempotence is tested.

      Unarchiving deliberately has no endpoint of its own: it is `PATCH { isActive: true }`, which the #585 route already handles including the cache bust. Tested here rather than assumed, since the two tickets split across it.

