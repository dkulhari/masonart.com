      ✅ **Completed**

      **Commit**: `497ffd68` — feat(admin): a form for creating and editing frames

      **Files Changed**:
      - `packages/web/app/routes/admin/frames/FrameForm.tsx` — new; `FrameForm` and `validateFrame`
      - `packages/web/app/routes/admin/frames/new.tsx` — new
      - `packages/web/app/routes/admin/frames/$id.tsx` — new
      - `packages/web/app/routeTree.gen.ts` — regenerated
      - `packages/web/tests/routes/admin/frames-form.test.tsx` — new, 12 tests

      **Two decisions beyond the ticket:**

      **1. The edit route loads before it renders.** A form that opened blank and PATCHed what it held would blank every field the admin did not retype — the endpoint writes only supplied keys, but an empty string *is* a supplied key. `$id.tsx` therefore renders "Loading frame…" until the row arrives, then seeds every input from it.

      **2. Blank optional fields are dropped from the payload, not sent as `''`.** `toPayload` omits an untouched Material or Colour rather than posting an empty string the schema would then judge against its format rules. Without this, leaving a box empty would produce a validation error the admin never opted into.

      **#591's slot is a comment, not an import.** The ticket said to leave a slot, so `FramePricePreview` is not imported yet — the preview lands there next and the file stays committable in between.

      **Verification**:
      - Command: `bunx vitest run tests/routes/admin/frames-form.test.tsx`
      - Result: PASS (12 tests, 12 passing) — every owned field present; exactly one image input; the slug constraint stated on screen; exactly the three rungs offered; fields seeded when editing; and five validation cases each asserted **against `createFrameInputSchema` itself** rather than against restated numbers, so the form and the API cannot drift
      - Command: `bunx vitest run tests/routes/admin/ tests/lib/admin-nav.test.ts`
      - Result: PASS (8 files, 135 tests passing)

      **Build — the #589 debt is cleared.** Web `tsc --noEmit` is back to **34**, exactly the pre-existing baseline I measured by stashing. The 4 errors #589 carried were forward references to `/admin/frames/new` and `/admin/frames/$id`; both routes now exist and the route tree was regenerated. **0 TypeScript errors are attributable to this feature.**
