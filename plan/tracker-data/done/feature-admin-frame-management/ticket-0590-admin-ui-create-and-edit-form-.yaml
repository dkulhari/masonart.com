ticket_number: 590
title: Admin UI - create and edit form with swatch upload
description: |-
  ## Task

  One form component serving both `new.tsx` and `$id.tsx` under app/routes/admin/frames/.

  Fields: name, type slug, category select, description, material, thickness, color, swatch upload, active, sort order, and the two price fields.

  Validation is `createFrameInputSchema` / `updateFrameInputSchema` from @chobii/shared (#583) — the same schemas the API validates with. A second copy of the bounds in the form is how the screen and the endpoint end up disagreeing about what a frame may hold.

  The swatch upload posts to `POST /api/admin/frames/upload-image` and receives BOTH urls back. There is no second image field — one upload fills `imageUrl` and `thumbnailUrl`, because the variant ladder already contains both sizes.

  The type field is a slug, not a display name: show the constraint (`lowercase-with-hyphens`) rather than letting the admin discover it by being rejected. A duplicate type comes back as 409 — surface the message naming the taken slug, don't render a generic failure.

  The price preview is the NEXT ticket. Leave a slot for it.

  ## Context

  Feature: admin-frame-management. Phase 4 (admin UI). Blocked by the list screen ticket and the upload endpoint ticket.

  Files:
  - packages/web/app/routes/admin/collections/$id.tsx and new.tsx — the form shape to mirror
  - packages/web/app/routes/admin/shipping.tsx — the #570 precedent for validating against a shared constant rather than a local copy

  Test pattern: packages/web/tests/routes/admin/shipping-config.test.tsx — exports the form and its validators so they can be tested without a router.
