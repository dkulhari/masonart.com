ticket_number: 588
title: Public API - category joins the frames response
description: |-
  ## Task

  Add `category: frames.category` to the select in `GET /api/products/frames` (packages/api/src/routes/products.ts:871-887).

  One line, but it is what lets the storefront stop guessing: FrameSelector currently derives the format rung from the type string, and it can only do that because the column was not on the wire.

  While here, assert the cached response and the fresh response have the same shape. The endpoint returns `{ items, fromCache: true }` on a hit and `{ items }` on a miss, and a field added to the select but absent from a cached payload would produce a frame panel that groups correctly only after a cache expiry — the kind of bug that reproduces once an hour.

  ## Context

  Feature: admin-frame-management. Phase 3 (admin API). Blocked by #582 (the column has to exist).

  Files:
  - packages/api/src/routes/products.ts:860-895 — the endpoint
  - packages/api/tests/routes/products.test.ts — existing suite for this route

  `availableSizes` stays in the response and stays out of scope: it is selected here and read by nothing. Do not remove it in this ticket; its fate belongs to the dead-catalogue cleanup.
