    text: |-
      ✅ **Completed**

      **Commit**: `ab56497a` — feat(api): the public frames responses carry the format rung

      **Files Changed**:
      - `packages/api/src/routes/products.ts` — `category` added to **both** frame selections
      - `packages/api/src/routes/admin/frames.ts` — unrelated type fix surfaced by running tsc (see #586)
      - `packages/api/tests/routes/products-frames.test.ts` — new, 6 tests

      **Two findings that changed the work:**

      **1. There are two frame selections, not one.** The ticket said one line in `GET /frames`. But `products.ts` also queries frames inside `GET /:slug` (~line 945), and *that* is the copy the PDP loader maps into `FrameSelector`. Adding the column only to the list endpoint would have left the buy panel — the surface that actually groups by rung — without it, and #592 would have failed on the product page with the list endpoint looking correct. Both now select it, and a test asserts both do.

      **2. The first version of this test was green before the implementation existed.** The suite mocks `db`, and a mocked `select()` returns whatever rows the fixture declared regardless of which columns were requested — so a response-body assertion measures the fixture, not the route. The `verify-fail` step is the only reason this was caught.

      Rewritten to assert on the *selection object* passed to `db.select()`, which is the only place a missing column is observable while `db` is mocked. Added a second test pinning the columns the storefront already relied on, so a future edit cannot quietly drop `priceModifier` or `priceAddition` while adding something new.

      **Verification**:
      - Command: `bunx vitest run tests/routes/products-frames.test.ts tests/routes/products.test.ts`
      - Result: PASS (83 tests passing — 6 new + 77 existing)
      - Command: `bunx vitest run tests/routes/admin/frames.test.ts tests/routes/admin/frames-archive.test.ts tests/routes/products-frames.test.ts`
      - Result: PASS (28 tests passing)
      - Command: `bunx tsc --noEmit`
      - Result: 0 errors — this run is what surfaced the `#586` `count` destructure bug, now fixed

      **Left alone as scoped**: `availableSizes` stays in the response and stays unread by anything; its fate belongs to the dead-catalogue cleanup ticket.
