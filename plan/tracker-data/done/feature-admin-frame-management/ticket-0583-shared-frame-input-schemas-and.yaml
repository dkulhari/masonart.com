      feat(shared): frame input schemas, with the modifier floor the formula implies

      The admin routes and the admin form both need to agree on what a frame may
      hold, so the contract lives in one place rather than in each of them.

      The modifier floor is 1.00 rather than 0 because frameAddition already clamps
      anything below one to no markup. A form that accepted 0.5 would store a
      discount the pricing formula silently discards, and the admin would watch the
      price not move. The test asserts the clamp and the bound together, so the two
      cannot drift apart into a number that validates and does nothing.
