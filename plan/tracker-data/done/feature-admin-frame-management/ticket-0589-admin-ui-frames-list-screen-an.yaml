implementation_steps:
  - id: 1
    action: write-test
    description: Write failing tests for the list rendering, the archived-row treatment, and the sidebar entry
    file: packages/web/tests/routes/admin/frames-list.test.tsx
    expected_result: FAIL
    status: done
    code: |
      /**
       * /admin/frames — the frame catalogue, listed.
       *
       * The one thing worth pinning beyond "a table renders": archived frames are
       * SHOWN, dimmed, with a way back. The admin list endpoint goes out of its way
       * to return them, and a screen that filtered them out would make archiving a
       * one-way door through the only UI that can archive.
       */

      import { describe, it, expect, afterEach } from 'vitest'
      import { render, screen, cleanup } from '@testing-library/react'
      import { readFileSync } from 'node:fs'
      import { join } from 'node:path'
      import { FramesTable, type AdminFrame } from '~/routes/admin/frames/index'

      afterEach(cleanup)

      const FRAMES: AdminFrame[] = [
        {
          id: 'f1',
          name: 'Rolled Canvas',
          type: 'rolled',
          category: 'rolled',
          priceModifier: '1.00',
          priceAddition: '0.00',
          thumbnailUrl: '/frames/rolled.png',
          isActive: true,
          sortOrder: 0,
        },
        {
          id: 'f2',
          name: 'Stretch + Oak Frame',
          type: 'stretch-oak',
          category: 'framed',
          priceModifier: '1.40',
          priceAddition: '250.00',
          thumbnailUrl: '/frames/oak.png',
          isActive: false,
          sortOrder: 9,
        },
      ]

      describe('FramesTable', () => {
        it('lists every frame with its rung and both price columns', () => {
          render(<FramesTable frames={FRAMES} />)
          expect(screen.getByText('Rolled Canvas')).toBeInTheDocument()
          expect(screen.getByText('Stretch + Oak Frame')).toBeInTheDocument()
          expect(screen.getByText(/1\.40/)).toBeInTheDocument()
          expect(screen.getByText(/250/)).toBeInTheDocument()
        })

        it('shows an archived frame rather than hiding it', () => {
          render(<FramesTable frames={FRAMES} />)
          expect(screen.getByText('Stretch + Oak Frame')).toBeInTheDocument()
        })

        it('offers the archived frame a way back', () => {
          render(<FramesTable frames={FRAMES} />)
          const row = screen.getByText('Stretch + Oak Frame').closest('tr')!
          expect(row.textContent).toMatch(/unarchive/i)
        })

        it('offers an active frame the archive action, not unarchive', () => {
          render(<FramesTable frames={FRAMES} />)
          const row = screen.getByText('Rolled Canvas').closest('tr')!
          expect(row.textContent).toMatch(/archive/i)
          expect(row.textContent).not.toMatch(/unarchive/i)
        })

        it('renders an empty catalogue without throwing', () => {
          render(<FramesTable frames={[]} />)
          expect(screen.getByText(/no frames/i)).toBeInTheDocument()
        })
      })

      describe('sidebar registration', () => {
        const sidebar = readFileSync(
          join(process.cwd(), 'app/components/admin/AdminSidebar.tsx'),
          'utf8'
        )

        it('links /admin/frames', () => {
          expect(sidebar).toContain("href: '/admin/frames'")
        })

        it('files it under Catalog, beside the other catalogue axes', () => {
          const frames = sidebar.indexOf("'/admin/frames'")
          const collections = sidebar.indexOf("'/admin/collections'")
          const categories = sidebar.indexOf("'/admin/categories'")
          expect(frames).toBeGreaterThan(-1)
          // Adjacent to the catalogue group rather than up with Orders.
          expect(Math.abs(frames - collections)).toBeLessThan(400)
          expect(Math.abs(frames - categories)).toBeLessThan(400)
        })
      })
