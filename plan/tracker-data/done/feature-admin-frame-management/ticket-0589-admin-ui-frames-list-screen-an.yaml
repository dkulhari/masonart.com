    text: |-
      ✅ **Completed**

      **Commit**: `b88d54f5` — feat(admin): the frame catalogue has a screen, archived rows included

      **Files Changed**:
      - `packages/web/app/routes/admin/frames/index.tsx` — new; `FramesTable` exported for testing, plus the page that loads and archives
      - `packages/web/app/components/admin/AdminSidebar.tsx` — "Frames" in `SECONDARY_NAV_ITEMS`, `Frame` icon imported
      - `packages/web/app/lib/admin-nav.ts` — `/admin/frames` added to `CONTENT_MANAGER_ALLOWED_PREFIXES`
      - `packages/web/app/routeTree.gen.ts` — regenerated
      - `packages/web/tests/routes/admin/frames-list.test.tsx` — new, 10 tests

      **Three decisions beyond the ticket:**

      **1. Content-manager access.** The API gates `/api/admin/frames` with `requireContentManager`, matching collections. `CONTENT_MANAGER_ALLOWED_PREFIXES` drives *both* the sidebar and the `/admin` layout guard, so without adding the path the screen would 403 for a role the endpoint serves. Tested.

      **2. Archived rows say "Archived" in words**, not only via `opacity-60`. Dimming alone is invisible to a screen reader and to a colourblind admin. Tested.

      **3. The archive button surfaces the API's own message.** When the last-active-frame guard fires, its explanation is the only useful part of the failure; a generic "Failed to archive" would leave the admin retrying.

      **On testing approach**: the sibling `collections-list.test.tsx` asserts on source text because TanStack's `Link` throws without router context. I stubbed `Link` and `createFileRoute` instead and rendered for real, which pins actual behaviour rather than the presence of a string. Worth the four lines of mock.

      **A finding from the tests**: rows cannot be located by frame *name*. The Rolled Canvas frame is named the same as the rung it groups under, so its name appears twice in its own row and `getByText` is ambiguous. Rows are located by `type`, which is unique by database constraint. Both of my first two test failures were this, not the component.

      **Route tree**: `bunx @tanstack/router-cli generate` does not work here — it defaults to `src/routes` and this project uses `app/routes` via the `tanstackStart` vite plugin. Regenerated by briefly booting `vite dev --port 3971` and stopping it.

      **Verification**:
      - Command: `bunx vitest run tests/routes/admin/ tests/lib/admin-nav.test.ts`
      - Result: PASS (7 files, 123 tests passing — 10 new, and `collections-list`, `shipping-config`, `promotions`, `review-media`, `admin-nav` all unaffected)

      **Build — 4 errors above baseline, and they are expected.** Web `tsc --noEmit` reports 38; I measured the pre-existing baseline at **34** by stashing this work and rerunning. The 4 are all this file linking to `/admin/frames/new` and `/admin/frames/$id`, which **#590** creates. They resolve there and I will confirm it on that ticket rather than assert it here.
