ticket_number: 589
title: Admin UI - frames list screen and sidebar entry
description: |-
  ## Task

  `packages/web/app/routes/admin/frames/index.tsx` — the list screen, following the shape of routes/admin/collections/index.tsx.

  Columns: swatch thumbnail, name, type, category, modifier, addition, active, sort order, row actions (Edit, Archive/Unarchive).

  **Archived rows render dimmed with an Unarchive action rather than being hidden.** Hiding them would make archiving irreversible through the UI — the admin list endpoint deliberately returns them (ticket #585) precisely so this screen can show them.

  Sidebar entry "Frames" joins the **Catalog** group beside Collections and Categories (AdminSidebar.tsx:137-143), not the top level. It is a catalogue axis, not an operational surface like Orders.

  ## Context

  Feature: admin-frame-management. Phase 4 (admin UI). Blocked by the admin CRUD routes.

  Files:
  - packages/web/app/routes/admin/collections/index.tsx — list screen to mirror
  - packages/web/app/components/admin/AdminSidebar.tsx:137-143 — the Catalog group
  - packages/web/app/routeTree.gen.ts — GENERATED; creating the route file registers it on the next dev/build run. Do not hand-edit it.

  Test pattern: packages/web/tests/routes/admin/collections-list.test.tsx, and shipping-config.test.tsx for the sidebar-registration assertion (it reads AdminSidebar.tsx off disk).

  NOTE: if this screen ever takes search params, router.tsx overrides TanStack's search serialization — validateSearch schemas must coerce numbers and split comma-joined arrays or the route error-boundaries to a blank page. Simplest answer for this screen: no search params.
