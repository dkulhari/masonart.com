ticket_number: 398
title: Seed - assign the new metadata across the catalogue
description: |-
  ## Task

  The new facets are useless while every product has null for them — the sidebar would render twelve Aesthetic options all reading 0.

  Assign `vibe`, `aesthetic`, `medium`, `uniqueness` and `availability` across the 41 seeded products, and widen `rooms` and `subjects` to the fuller §1.3 vocabularies where the existing values already imply them.

  ## Context

  Feature: product-metadata-facets
  Blocked by the schema and shared-vocabulary tickets.

  **Constraints**
  - **Deterministic, not random.** A reseed must produce the same catalogue, or facet counts change between runs and nothing is reproducible. Derive from a stable property (sku or slug), never `Math.random()`.
  - Values must come from `@chobii/shared` facet constants, not be retyped as literals in the seed — that is the drift this feature exists to end.
  - **Seed from the repo root**: `bun run packages/api/src/database/seed.ts`. Running it from `packages/api` loses the root `.env` and silently produces an imageless catalogue (see PLAN-OF-ACTION local traps).
  - Verify afterwards that images survived: `SELECT count(*) FILTER (WHERE jsonb_array_length(coalesce(images,'[]'))=0) FROM products;` must be 0.
  - Every vocabulary value should be reachable — a facet option no product carries is a dead row in the sidebar.
