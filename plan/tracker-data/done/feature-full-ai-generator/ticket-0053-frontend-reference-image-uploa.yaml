ticket_number: 53
title: Frontend - Reference Image Upload UI
description: |-
  ## Overview
  UI component for uploading reference images to guide AI generation style.

  ## Component: ReferenceImageUploader

  ### Features
  1. **Upload Zone**
     - Drag and drop area
     - Click to browse files
     - Accept JPEG, PNG, WebP
     - Max 5MB indicator

  2. **Preview**
     - Show uploaded image thumbnail
     - Remove button
     - File name and size

  3. **Reference Weight Slider**
     - Range: 10% to 100%
     - Default: 50%
     - Tooltip explaining effect
     - Low = loose inspiration, High = close match

  4. **Cost Indicator**
     - Show +20% cost when reference used
     - Update total cost preview

  ## UI Location
  - Collapsible 'Style Reference' section
  - Above prompt input

  ## Files to Create/Modify
  - packages/web/app/components/ai-generator/ReferenceImageUploader.tsx (new)
  - packages/web/app/hooks/useReferenceImage.ts (new hook for upload)
  - packages/web/app/routes/create/index.tsx (integrate)

  ## Acceptance Criteria
  - [ ] File upload works with validation
  - [ ] Image preview displays correctly
  - [ ] Weight slider affects generation
  - [ ] Cost preview updates
  - [ ] Error handling for invalid files
  - [ ] Component tests pass
