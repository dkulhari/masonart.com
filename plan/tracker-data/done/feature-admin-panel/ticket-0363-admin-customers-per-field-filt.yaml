      ✅ **Completed**

      **Commit**: `f9aa99d0` - feat(admin): filter customers by field and joined date range

      **Files Changed**:
      - `packages/api/src/routes/admin/customers.ts` - zod query schema + Drizzle filter/sort/paginate; response is now a `{ data, pagination }` envelope
      - `packages/api/tests/routes/admin/customers.test.ts` - 11 new tests + 3 date-controlled fixtures; existing list test updated to the envelope
      - `packages/web/app/routes/admin/customers.tsx` - `validateSearch` search params, filter bar, sortable headers, pagination; client-side filter removed

      **Summary**:
      All filters evaluate server-side. Query params: `search`, `role` (repeatable), `status`, `joinedFrom`, `joinedTo`, `sortBy`, `sortOrder`, `page`, `pageSize` (max 100). `joinedTo` is widened to end-of-day so the range is inclusive of both bounds; an inverted range is a 400. LIKE wildcards in user input are escaped as literals, and pagination tie-breaks on `id` so pages stay stable. The role filter deliberately lists `trade` and `super-admin` even though this page cannot assign them.

      **Bug found during manual verification** (the reason step 7 mattered): the role multi-select initially failed with `Expected array, received string`, error-boundarying the route. This app overrides TanStack Router's search serialization (`packages/web/app/router.tsx:21-41`) to keep every param a string and stringify via `String(value)` — so an array round-trips comma-joined as `?role=admin,trade`, never as JSON. The schema now parses either shape.

      **Verification**:
      - Command: `cd packages/api && DATABASE_URL=...@localhost:5440/poster_app_dev bunx vitest run tests/routes/admin/customers.test.ts`
      - Result: PASS (22 tests, 22 passing) — was 12 failing / 10 passing at the red step
      - Command: `cd packages/web && bunx vitest run`
      - Result: PASS (35 files, 1380 tests passing)
      - Command: `cd packages/web && bunx tsc --noEmit -p tsconfig.json`
      - Result: 23 errors, all pre-existing in untouched files; 0 in `customers.tsx` (a transient 24th introduced by copying the products page's `search: (prev) => ...` updater was fixed rather than inherited)
      - Manual (headless Chromium, signed in as `test-admin@chobii.art`, API on :3000 + web on :3001): 11/11 checks passed — unfiltered list renders, role filter narrows to 2 rows and writes to the URL, filters survive reload, single-day joined range `2026-07-23..2026-07-23` returns 10 rows all dated 23 Jul (proving both-ends inclusivity), back button restores filters, clear-all resets to 18 rows, debounced search hits the server, pagination advances pages.
      - Live API spot checks also confirmed 400s for inverted range, unknown role, `pageSize=500`, and `DD-MM-YYYY` dates.

      **Note for whoever runs these tests next**: `packages/api/tests/setup.ts` defaults `DATABASE_URL` to port **5433**, which is a different project's Postgres. The chobii dev DB is `poster-app-postgres` on **5440** — without the override the suite fails on `password authentication failed for user "poster_app"`.
