ticket_number: 363
title: "Admin customers: per-field filtering incl. joined date range, server-side"
description: |
  ## Problem

  The admin customers section has almost no filtering. Today:

  - `GET /api/admin/customers` (`packages/api/src/routes/admin/customers.ts:53`) selects **every** user with no query params at all — no filtering, no pagination, ordered `desc(createdAt)`.
  - The page (`packages/web/app/routes/admin/customers.tsx:186`) fetches that whole list and does one **client-side** substring match over name/email (`customers.tsx:127`, `:244`).

  So there is no way to filter by role, by status, or by when someone joined, and the list will not scale as the user table grows.

  ## Wanted

  Filter by each field shown in the table, evaluated server-side:

  | Field | Control |
  |---|---|
  | name / email | search box (existing, moved server-side) |
  | role | multi-select — `customer`, `trade`, `content-manager`, `admin`, `super-admin` |
  | status | select — `active` / the other values in `users.status` |
  | joined (`createdAt`) | **date range** — from / to, inclusive, either end optional |

  Plus sorting (`createdAt`, `name`, `email`, `role`) and pagination, so the endpoint stops returning the entire table.

  Filters belong in URL search params via `validateSearch`, matching the pattern already used by `packages/web/app/routes/admin/products/index.tsx:29-41` — shareable, back-button safe, and SSR-friendly. Include a "clear all" affordance and show the active result count.

  Note `users.role` includes `trade` and `super-admin`, which the role-assignment dropdown deliberately excludes — the **filter** should still list them, since such users exist and need to be findable.

  ## Implementation Steps

  - [ ] **Step 1 [write-test]**: Write failing API tests for the new query params
    - File: `packages/api/tests/routes/admin/customers.test.ts` (extend the existing suite)
    - Run: `cd packages/api && bunx vitest run tests/routes/admin/customers.test.ts`
    - Expected: FAIL — params are ignored today, so every request returns all users
    ```ts
    it('filters by role', async () => {
      const res = await app.request('/api/admin/customers?role=content-manager', { headers: adminHeaders })
      expect(res.status).toBe(200)
      const body = await res.json()
      expect(body.data.every((u: { role: string }) => u.role === 'content-manager')).toBe(true)
    })

    it('filters by joined date range, inclusive on both ends', async () => {
      const res = await app.request(
        '/api/admin/customers?joinedFrom=2026-01-01&joinedTo=2026-01-31',
        { headers: adminHeaders },
      )
      const body = await res.json()
      for (const u of body.data) {
        expect(new Date(u.createdAt) >= new Date('2026-01-01T00:00:00.000Z')).toBe(true)
        expect(new Date(u.createdAt) <= new Date('2026-01-31T23:59:59.999Z')).toBe(true)
      }
    })

    it('rejects an inverted date range with 400', async () => {
      const res = await app.request(
        '/api/admin/customers?joinedFrom=2026-02-01&joinedTo=2026-01-01',
        { headers: adminHeaders },
      )
      expect(res.status).toBe(400)
    })

    it('paginates and reports the unfiltered-page total', async () => {
      const res = await app.request('/api/admin/customers?page=1&pageSize=2', { headers: adminHeaders })
      const body = await res.json()
      expect(body.data.length).toBeLessThanOrEqual(2)
      expect(body.pagination).toMatchObject({ page: 1, pageSize: 2 })
      expect(typeof body.pagination.total).toBe('number')
    })
    ```

  - [ ] **Step 2 [verify-fail]**: Confirm the tests fail
    - Run: `cd packages/api && bunx vitest run tests/routes/admin/customers.test.ts`
    - Expected: FAIL

  - [ ] **Step 3 [implement]**: Add a zod-validated query schema and build the query with Drizzle
    - File: `packages/api/src/routes/admin/customers.ts`
    - Add `zValidator("query", customerQuerySchema)` with `search`, `role` (repeatable), `status`, `joinedFrom`, `joinedTo`, `sortBy`, `sortOrder`, `page`, `pageSize` (max 100). Compose `and(...)` from `ilike` on name/email, `inArray` on role, `eq` on status, and `gte`/`lte` on `createdAt` — `joinedTo` must be widened to end-of-day so the range is inclusive. Refine the schema so `joinedFrom > joinedTo` is a 400. Return `{ data, pagination: { page, pageSize, total, totalPages } }` and keep the `requireAuth` + `requireAdmin` gating untouched.
    - Note: this changes the response from a bare array to an envelope — update the web fetcher in the same change.

  - [ ] **Step 4 [verify-pass]**: API tests pass
    - Run: `cd packages/api && bunx vitest run tests/routes/admin/customers.test.ts`
    - Expected: PASS

  - [ ] **Step 5 [implement]**: Filter bar + URL search params on the page
    - File: `packages/web/app/routes/admin/customers.tsx`
    - Add `searchParamsSchema` + `validateSearch` mirroring `admin/products/index.tsx:29-41`, drive the fetch from those params (debounced search), and replace the client-side `filteredCustomers` filter. Controls: search box, role multi-select, status select, joined from/to date inputs, clear-all, result count, and pagination.

  - [ ] **Step 6 [verify-pass]**: Web suite and typecheck clean
    - Run: `cd packages/web && bunx vitest run && bunx tsc --noEmit -p tsconfig.json`
    - Expected: PASS (no new type errors beyond the known pre-existing ones)

  - [ ] **Step 7 [verify-pass]**: Manual check
    - Sign in as an admin, open `/admin/customers`: each filter narrows the list, the joined range includes rows dated exactly on both bounds, filters survive a page reload and the back button, and clear-all resets to the unfiltered first page.

  - [ ] **Step 8 [commit]**: Commit
    - Run: `git add packages/api/src/routes/admin/customers.ts packages/api/tests/routes/admin/customers.test.ts packages/web/app/routes/admin/customers.tsx && git commit -m "feat(admin): filter customers by field and joined date range (#{ticket-number})"`
