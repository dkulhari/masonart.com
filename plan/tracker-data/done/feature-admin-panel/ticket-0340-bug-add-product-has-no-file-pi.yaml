ticket_number: 340
title: "Bug - Add Product has no file picker: image upload was never implemented (URL-only placeholder)"
description: |-
  ## Bug
  User report: no way to open files to upload a picture in Add Product. Confirmed: ProductForm.tsx:376 comment "in a real app, this would open a file picker" — the Add Image button only appends an empty row with a manual URL field. No product-image upload endpoint exists either.

  ## Fix
  - API: POST /api/admin/products/upload-image (behind existing requireContentManager guard) — multipart file, JPEG/PNG/WebP, size cap, stored via uploadOptimizedImage() under products/ in R2, returns CDN url
  - Web: ProductForm gets an Upload Image button wired to a hidden file input (multiple), per-file upload with progress state, appends returned URLs to the images list; manual URL row retained as fallback

  Files: packages/api/src/routes/admin/products.ts, packages/web/app/components/admin/ProductForm.tsx
