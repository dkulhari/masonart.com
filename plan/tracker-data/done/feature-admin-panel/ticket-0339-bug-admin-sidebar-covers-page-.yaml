ticket_number: 339
title: "Bug - Admin sidebar covers page: site header overlap, drawer below 1024px, dead gap when collapsed"
description: |-
  ## Bug
  User report: opening the admin sidebar hides the page. Reproduced with screenshots — three stacked layout defects:
  1. Admin pages render inside the public site layout; the fixed sidebar (z-50, inset-y-0) overlays the public header (logo/hamburger collision) and duplicates navigation.
  2. Drawer breakpoint is lg (1024px): any window narrower — common laptop split-screen — gets the mobile drawer that dims and covers the whole page instead of a persistent sidebar.
  3. Collapsing the sidebar leaves main content at ml-64 — a dead gap; margin doesn't track collapse state.

  ## Fix
  - Hide the public Header/Footer on /admin routes (admin gets its own chrome)
  - Drop the persistent-sidebar breakpoint lg→md (768px)
  - Lift isCollapsed state to the admin layout so main margin tracks 72px/256px

  Files: packages/web/app/routes/__root.tsx, packages/web/app/routes/admin.tsx, packages/web/app/components/admin/AdminSidebar.tsx
