  ## Error
  `page.goto` with `waitUntil: 'networkidle'` times out at 30s. Page renders fully but mock image URLs keep network connections open, preventing networkidle state.

  ## Fix
  - Changed all `waitUntil: 'networkidle'` to `waitUntil: 'domcontentloaded'`
  - Added explicit wait for "Production Photo Review" heading in beforeEach hooks to ensure React rendering completes

  ## Acceptance Criteria
  - [x] All 37 customer-approval tests pass
