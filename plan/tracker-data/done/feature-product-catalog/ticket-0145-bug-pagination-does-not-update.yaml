ticket_number: 145
title: "Bug: Pagination does not update URL with page parameter"
description: |-
  ## Test Failure
  **File**: `tests/e2e/product-listing.spec.ts`
  **Test**: Product Listing - Pagination › should navigate to next page on Next click
  **Line**: 764

  ## Error (Application Bug)
  ```
  Error: expect(page).toHaveURL(/page=2/) failed

  Expected pattern: /page=2/
  Received string:  "http://localhost:3001/posters"
  ```

  ## Page State
  - Page shows "Showing 37 products"
  - Pagination component is visible with "Page 1" and "Page 2" buttons
  - "Next" button is active and clickable
  - Click on "Next" does not update the URL

  ## Root Cause Analysis
  The pagination component updates state client-side but does not sync the page number to the URL via search params. This breaks:
  1. Browser back/forward navigation for pagination
  2. Sharing links to specific pages
  3. SEO crawlability of paginated content

  ## Expected Behavior
  Clicking "Next" should navigate to `/posters?page=2` (or similar URL with page param).

  ## Classification
  This is an **app bug** - pagination should use URL-based navigation for proper UX and SEO.
