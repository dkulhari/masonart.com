      ✅ **Completed**

      **Commit**: `fcf87169` - fix(web): Add QueryClientProvider for TanStack Query support

      **Root Cause**: The `ProductReviews` component (added in commit `a97623a0`) uses TanStack Query hooks (`useReviews`, `useReviewStats`, `useCreateReview`), but the app was never wrapped with `QueryClientProvider`.

      **Files Changed**:
      - `packages/web/app/routes/__root.tsx` - Added QueryClientProvider wrapper

      **Summary**:
      - Added `QueryClient` and `QueryClientProvider` imports from `@tanstack/react-query`
      - Created SSR-friendly QueryClient factory:
        - Server: New client per request (avoids state sharing)
        - Browser: Singleton (preserves cache across navigations)
      - Wrapped `RootComponent` with `QueryClientProvider`

      **Alignment**: Fix aligns with tech stack spec (`docs/poster-app-tech-stack.md`) which designates TanStack Query for server state management.
