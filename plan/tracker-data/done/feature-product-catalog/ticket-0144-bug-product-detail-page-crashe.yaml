ticket_number: 144
title: "Bug: Product detail page crashes with QueryClient error"
description: |-
  ## Bug Report

  **URL**: `/posters/stay-curious` (and likely all product detail pages)

  **Error Message**:
  ```
  Error
  Something went wrong

  No QueryClient set, use QueryClientProvider to set one
  ```

  ## Root Cause
  React Query is being used in a component that is not wrapped by `QueryClientProvider`. This typically happens when:
  1. A component using `useQuery` is rendered outside the provider tree
  2. SSR hydration mismatch where client doesn't have the provider
  3. A route component is missing the provider wrapper

  ## Expected Behavior
  Product detail page should load and display product information for `/posters/stay-curious`.

  ## Steps to Reproduce
  1. Navigate to `http://localhost:3001/posters/stay-curious`
  2. Observe the error page

  ## Suggested Fix
  - Check `packages/web/app/routes/posters.$slug.tsx` or similar route file
  - Ensure QueryClientProvider wraps the component tree in the root layout
  - Verify SSR configuration passes QueryClient properly
