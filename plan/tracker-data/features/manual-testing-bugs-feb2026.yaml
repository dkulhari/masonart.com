description: |-
  ## Overview
  ## Overview
  Bugs discovered during comprehensive manual testing of the MasonArt platform on Feb 18, 2026. Testing covered all 38 manual test files using Chrome browser automation against localhost dev environment (API: localhost:3000, Web: localhost:3001).

  ## Goals
  - Track all bugs found during manual testing
  - Prioritize fixes based on severity (critical/high/medium/low)
  - Ensure all user-facing issues are addressed before production

  ## Scope
  - **In scope**: UI bugs, broken links, missing pages, API issues, SEO problems, missing static assets
  - **Out of scope**: Features not yet implemented (e.g., newsletter backend, payment integration)

  ## Testing Coverage
  - Health check API, Home page, Layout, Product listing, Product detail, Auth pages, Cart, Checkout, AI Generator, Gallery, SEO meta tags, Sitemap, Robots.txt, Static assets, 404 page, Admin redirects, Footer links, Navigation

  ## Bug Severity Classification
  - **Critical (P0)**: Core features broken, blocking user journeys
  - **High (P1)**: Important features missing, SEO/accessibility issues
  - **Medium (P2)**: Spec deviations, minor UX issues
  - **Low (P3)**: Nice-to-have improvements

  ## Objectives
  - TBD
