description: |-
  ## Overview
  Bugs found during a mobile-viewport sweep of production (chobii.art) at 390x844 (iPhone 14/15) on 2026-07-28. Covered home, product listing, product detail, AI create, gallery, cart, checkout, track, auth, and the 8 static info pages via Playwright-driven Chrome. Findings are a mix of mobile-only defects (transparent nav drawer, iOS input auto-zoom, missing autofill) and viewport-agnostic bugs that the sweep surfaced (empty featured collection, unimplemented related-products section, 404 reviews/stats endpoint). Structural health was good overall: zero horizontal overflow on every page tested, correct viewport meta, and no sub-12px text.

