description: |-
  ## Overview
  Digital wallet system for storing credits, making payments, and managing transactions within the platform.

  ## Objectives
  - Wallet balance display in account
  - Top-up wallet via Razorpay
  - Pay for AI generations using wallet balance
  - Transaction history
  - Automatic refunds on failed generations
  - Admin can configure pricing and markup

  ## Key Features
  - 3 free AI generations for new users
  - Real-time cost preview before generation
  - Razorpay integration for wallet top-ups
  - Live USD/INR exchange rate with 1-hour cache
  - Configurable markup percentage on API costs

  ## Implementation
  Fully implemented with commits:
  - `ff508f54` feat(wallet): Add wallet-based payment system for AI image generation
  - `d4976c6a` test(wallet): Add unit tests and E2E tests for wallet system
