description: |-
  ## Overview
  ## Design

  Full approved design: `docs/superpowers/specs/2026-08-05-sale-promotions-design.md`. Closes the two remaining ❌ rows in mesonart parity analysis §3.1 (sale strip + countdown, floating offer tab) and the Sale/promo page gap in §3.5.

  Site-wide sale capability: a real promotion entity, automatic sale pricing, admin configuration, and every storefront surface that advertises it.

  ## Why

  There is no promotion entity anywhere in the system. `packages/api/src/routes/orders.ts:268` reads `const discount = "0.00"; // TODO: Apply coupon if provided`, and `couponCode` is stored verbatim from client input while `couponDiscount` stays hardcoded `"0.00"` (orders.ts:298-299). A customer can type any code at checkout; it is recorded and changes nothing. `packages/web/app/components/layout/AnnouncementBar.tsx:11-14` records the sale strip as blocked on exactly this.

  ## Decisions (see doc §3)

  - **D1 Automatic only.** No discount codes anywhere. The sale applies by itself to eligible products.
  - **D2 Teased price, gated at cart.** Logged-out visitors see base struck through + sale price + "Members" tag; the cart shows the saving as locked with a Join button. Server charges base until the viewer is a member.
  - **D3 Scope + exclusions.** One promotion targets `all` / `filter` (styles, subjects, rooms, isFeatured) / hand-picked `products`, plus an exclusion list that always wins.
  - **D5 Rolling countdown.** Per-visitor deadline minted into a cookie, clamped by `min(cookieDeadline, endsAt)`, re-minted on the next load when it runs out. `countdownMode` is a config field ('rolling' | 'real'), never hardcoded — see the CCPA dark-patterns note in doc §6.
  - **D6 Never stack.** Highest `priority` wins, ties broken by deeper discount. Promotion-vs-promotion only — codes are D8.
  - **D8 Codes and gift cards: reserved, not built.** No code system ships here, but promotion money and code money get separate columns and the layering order is fixed now (doc §5), so a settled order stays attributable once codes exist.

  ## Data model (doc §4)

  New `packages/api/src/database/schema/promotions.ts`: `promotion` (headline, discountType/Value, scopeType, scopeFilter jsonb, membersOnly, startsAt/endsAt, isEnabled, priority, perCustomerOrderLimit, countdownMode/rollingWindowMinutes/rollingJitterMinutes), `promotion_product`, `promotion_exclusion`. State is **derived**, never stored — no status column. `endsAt` is private and never serialized to the storefront. Orders gain `promotionId` and `promotionDiscount`; `order_items.itemDiscount` starts carrying real numbers. `orders.discount` becomes the derived total `promotionDiscount + couponDiscount` — the promotion never writes into the shared column, or a settled order cannot be attributed once codes exist.

  ## Resolver (doc §5)

  One function, `packages/api/src/lib/promotion-pricing.ts` (modelled on `product-sales.ts`): `resolveSalePrice(product, activePromotions, { isMember }) → { promotionId, percentOff, basePrice, salePrice, locked } | null`. 60s in-process cache. Rounding per line, half-up, 2dp. Called by product list, product detail, cart read, order creation and the /sale page — never reimplemented.

  Stored `cartItem.lineTotal` (cart.ts:196-204) stays a BASE price; sale price resolves at read time, or a cart held across the end of a sale would still charge sale. Server re-resolves at order creation and ignores any client-sent price.

  ## Surfaces (doc §7)

  Sale strip in AnnouncementBar · product card + PDP sale badges · cart locked-saving row · `/sale` landing page + red Sale nav link · admin `/admin/promotions` list and editor. Every surface renders `null` when no promotion is active; no hardcoded "40% OFF" string anywhere.

  ## Out of scope

  Discount codes, stacking, BOGO/tiered/volume, minimum-cart thresholds, loyalty points, scheduled email sends, multi-currency sale pricing, per-variant discount depth.

  **Gift cards are not a discount.** A gift card is tender: it applies after tax against the amount due, carries a balance, is partially consumable, and refunds return to it. It never reaches `resolveSalePrice` and is never written to a discount column — the separate `gift-cards` feature owns it. Shopify's single "Discount code or gift card" input (mesonart's checkout) is one box routing to two unrelated systems.

  ## Depends on / pairs with

  `gallery-membership` supplies `isMember`. Promotions can ship ungated (`membersOnly = false`) before membership exists.

