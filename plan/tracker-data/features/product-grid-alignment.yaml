description: |-
  ## Overview
  ## Overview

  Make the storefront product grid hold perfect rows despite mixed source aspect ratios, add a multi-image hover reveal, and bring the card's visual styling to measured parity with mesonart.com.

  The mechanism is a change of ownership: aspect ratio moves from a per-call-site prop to a **pipeline-guaranteed invariant**. Every stored product image becomes 1500x1500. The frontend then needs no ratio logic at all, and the machinery that existed to manage the variation is deleted rather than extended.

  Full design spec (approved, committed as d5be8533):
  `docs/superpowers/specs/2026-07-30-product-grid-alignment-design.md`
  Research basis (measured reverse-engineering of mesonart.com):
  `docs/research/mesonart-grid/README.md`

  ## Goals

  - Rows align in every grid, at every breakpoint, regardless of source artwork orientation
  - Hover reveals additional product media, positioned by cursor X, with zero card reflow
  - Card styling matches mesonart.com's measured token set
  - Delete the ratio-management code (`ASPECT_RATIO_MAP`, `uniformAspectRatio`) rather than adding another branch to it

  ## Problem being fixed

  Three recorded defects, all traceable to ratio being decided at three separate call sites:

  - **D1** Conflicting ratios in production: `routes/posters/index.tsx:523` passes `aspect-[2/3]`; `routes/index.tsx:251` passes `aspect-[3/4]`
  - **D2** Card chrome does not stretch: the `<a>` is the grid item and stretches, but the inner `div.card-hover` carrying `border border-border bg-card` is content-height, so cards with style tags render taller — ragged bottom edges within a row
  - **D3** Skeleton ratio hardcoded to `aspect-[2/3]` (`ProductCard.tsx:222`), causing a guaranteed layout shift on the home page

  Missing capability: no multi-image hover.

  ## Scope

  **In scope**
  - Collapse three divergent `ProductImage` shapes into one shared type; `type` replaces `isPrimary`; add `crop` and `originalKey`
  - `matToSquare()` and `cropToSquare()` in `packages/api/src/lib/image-processing.ts`
  - Product upload orchestrator branching on image type; reuses existing `processImage()` / `uploadOptimizedImage()` unchanged
  - Retain unprocessed originals under an `originals/` prefix (load-bearing: crops must stay revisable)
  - Admin multi-image upload: per-file `type` selector, square crop/zoom control for photographic types, drag reorder, low-resolution warning
  - Rewrite `ProductCard` into 5 focused files; add cursor-X hover scrub, N-1 dots, quick-add/quick-view reveal
  - Delete `ASPECT_RATIO_MAP`, the `uniformAspectRatio` prop, the `size` variant map, and the bordered card wrapper
  - Adopt mesonart's measured tokens (Poppins/Urbanist, neutral-900 on white, #fafafa mat, fluid 10-20px radius, .5s cubic-bezier(.3,1,.3,1))
  - Reseed the 40 dev products into the new shape
  - Unit, component and an e2e row-alignment regression test

  **Out of scope**
  - Removing the 125 unreachable `dark:` utilities and the `.dark` block (unrelated cleanup)
  - Auto-generated or AI-generated room mockups
  - Focal-point editing for `type: 'main'` (never cropped, so nothing to focus)
  - Editable crop after upload (`originalKey` makes it possible later; no UI now)
  - Quick-view drawer behaviour (button appearance and reveal only)
  - Product detail page ratio (keeps natural ratio)
  - Video media slides (contract permits, no implementation)

  ## Design

  **Approach**: pipeline-guaranteed square asset contract + CSS Grid stretch.

  Two mechanisms, both measured from mesonart:
  1. Ratio lives on the **in-flow `<img>`**, not the wrapper. One image per card sits in normal flow with `aspect-square` and *is* the media box's height. All hover slides are `position:absolute; inset:0` and cannot contribute height.
  2. Rows align by **grid stretch**, not by height-locking text. Mesonart's own card heights differ (measured 359.88 / 376.88 / 379.88px); rows still align because grid sizes each row to its tallest item. Verified across 104 cards: within every row all heights identical, between rows they differ.

  Consequence: no `min-height`, no `line-clamp`, no ratio branching needed for alignment.

  **Key decisions**

  - **1:1 square target**, chosen for orientation neutrality rather than minimum mat. At the 88% inset it is the only ratio with a 0-point portrait/landscape spread (both 48.4% mat) and the only one where square art is not letterboxed (22.6%). A 4:5 box frames portrait better (35.5%) but penalises landscape by 23 points; 26 of 40 products are square, landscape or panoramic.
  - **Artwork is matted, never cropped**: `fit:'contain'` at 88% inset on a flat mat. The 88% inset guarantees a visible mat on every product so square art does not bleed while portrait art floats.
  - **Photographs fill the square via a human-chosen crop**: the rule is "never crop *blindly*", not "never crop". The uploader picks zoom and position; the rect is stored normalised 0..1 against the original.
  - **All media are square, including room mockups** — so no hover slide can ever differ from the box.
  - **Hover images are human-uploaded**, not auto-composited.
  - **Dark mode dropped**: nothing in the codebase sets the `.dark` class — no provider, no toggle, no `classList.add('dark')`. Already unreachable.
  - **Styling identical to mesonart**, full measured token set in the spec's Appendix A.
  - **No data migration** — product is pre-launch; reseed rather than migrate.

  ## Technical considerations

  - **One cross-boundary coupling, the main rot risk**: the mat colour exists both as `MAT_COLOR` baked into pixels by sharp, and as the `bg-mat` CSS token shown during load. If they drift, every card flashes one colour then settles to another. Mitigated by a single exported constant in `@chobii/shared` consumed by both, with a unit test asserting they resolve to the same RGB.
  - Pipeline is an **extension, not greenfield**: `sharp@^0.34.5`, `processImage()`, `IMAGE_SIZES`, `uploadOptimizedImage()` and `StoragePaths` all already exist and are reused unchanged.
  - `processImage()` is deliberately left untouched — it also serves avatars and AI generations, where squaring would be wrong. A thin orchestrator sits beside it on the product path only.
  - Processing runs **inline, no queue**: one image per request at ~400ms.
  - `sizes` must be set on every image. Mesonart omits it, causing a measured 6.7x over-fetch (1080w into a 160.75px card).
  - Stack is **TanStack Router/Start**, not React Router v7 (root CLAUDE.md is stale on this point).
  - New web dependency: `react-easy-crop` (~15KB) for the admin crop control.
  - `product.orientation` stays as merchandising metadata (drives filters and the detail page) but stops touching layout.

  ## Relationship to other features

  - **Supersedes `hero-grid-alignment`**: that feature introduced the `uniformAspectRatio` prop (tickets #287-289) which this design deletes in favour of the pipeline invariant.
  - **Absorbs ticket #360** ("Product grid card sizing: residual height variance + home/listing ratio mismatch"). #360 independently identified D1 and D3 and reached the same conclusion about grid stretch. Its two acceptance criteria become verification checks here rather than separate work.
  - **Extends `image-cdn-storage`**: reuses that feature's storage and WebP/srcset pipeline; adds the squaring step.
  - **Distinct from `room-visualization`**: that is a customer-facing feature where the shopper uploads their own room. Here, room mockups are admin-curated product media.

  ## Objectives
  - TBD
