description: |-
  ## Overview
  # chobi.art External Service Dependencies

  ## Overview
  Resolve the external-service gaps left after the chobi.art rebrand: placeholder credentials in deploy/.env that silently disable staging features (R2 storage, 2Factor SMS, AI provider), rebrand-deferred legacy resources (masonart-named R2 bucket/CDN, DLT SMS templates), and the bundle of registrations required for the future chobi.art production domain cutover.

  ## Goals
  - Staging at chobi.xtoms.xyz fully functional: uploads, AI generation, SMS/OTP
  - No remaining legacy masonart-named external resources in active use
  - Documented, ticketed gate for the chobi.art production cutover (Razorpay webhooks, Resend domain, Cloudflare zone)

  ## Scope
  **In scope:** R2 bucket + CDN migration to chobi names, 2Factor.in key + chobi DLT templates, BETTER_AUTH_SECRET rotation, AI provider key confirmation, production cutover checklist ticket.
  **Out of scope:** UptimeRobot monitoring (already ticket #278 in go-to-production), purchasing the chobi.art domain itself, repo directory rename.

  ## Context
  Sourced from docs/EXTERNAL-SERVICES.md and claude-mem observations #4715/#4872/#4874/#4904. Key gotchas: Razorpay webhooks don't follow redirects (exact-hostname registration); unverified Resend domain = silent 500s on signup; DLT template names are registered IDs — renaming without re-registration breaks SMS; CDN_URL is baked into the web image at build time.

  ## Objectives
  - TBD
