  ## Technical Requirements
  - Wallet integration for all paid features (already implemented)
  - Cost preview before generation including upscaling
  - Reference image storage and processing
  - Prompt suggestion API endpoint
  - Database updates for new presets and user preferences

  ## Payment Model
  Uses existing wallet system - users preload wallet and pay per generation. Free tier gives 3 generations, then wallet balance required.
