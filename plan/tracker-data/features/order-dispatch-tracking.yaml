name: order-dispatch-tracking
title: Order Dispatch Tracking
priority: critical
created: '2026-08-16T21:22:56.705Z'
assignee: unassigned
tags: []
description: |-
  ## Overview
  Admin dispatch UI over the existing shipments API, consolidating the two competing tracking stores so the customer tracking page actually works.

  Sub-project 3 of 5 by build order (spec order 4). Independent of vendors and QC — can ship on its own.

  LIVE BUG this fixes: routes/tracking.ts:122 reads order_shipments and returns `tracking: shipment ? {...} : null` with no fallback. The only writer of order_shipments is routes/admin/shipments.ts, which has NO UI. The admin screen that does exist (/admin/orders/:id → PATCH /orders/:id/shipping) writes carrier/tracking onto the ORDER instead. So an admin enters a tracking number and the customer's tracking page still shows nothing, permanently. The completed order-tracking-notifications feature is structurally starved by this.

  ~~Decision: dispatch is MANUAL at launch — admin creates the shipment in Shiprocket's own dashboard and pastes carrier + AWB into the admin. No Shiprocket API, no token refresh, no webhooks. Honest at low volume; revisit when order volume justifies the integration.~~ **SUPERSEDED 2026-08-30 — see the amendment below.**

  Scope: admin UI over the existing (619-line, UI-less) /api/admin/shipments router; consolidate order-level and order_shipments tracking onto order_shipments as the single source of truth; add missing fields for real dispatch (external AWB/shipment ids, label URL, actual shipped weight/dims, and what YOU paid — essential for margin since the customer now pays ₹0); extend shipment_status with RTO/NDR states which the current 7-state enum lacks.

  ## AMENDMENT — 2026-08-30: promoted from manual to API-integrated

  The fulfilment model changed while production-pipeline was being designed. **Vendors now own the piece from production through despatch, and the courier collects from the vendor's facility.** Goods never come back to us, so nobody here can walk a parcel to a counter — the vendor prints the label.

  That kills the manual decision above. A vendor cannot paste an AWB we generated by hand in a dashboard they cannot see, and giving them our Shiprocket login surrenders pickup control, rate control and our shipping-cost data to a supplier.

  **New decision: our server calls the Shiprocket API.** We create the shipment and the AWB, and hand the vendor a signed, expiring label PDF through their portal. We keep the AWB, the pickup location, the courier choice and the tracking. This feature therefore grows:

  - a Shiprocket client — auth, token refresh, AWB creation, pickup scheduling, courier rate selection, label retrieval, and webhooks if they are used
  - `order_shipments.label_object_token` (a random uuid, never the order id — an order id in a URL path is a stable person-linked handle) so the label object key is identity-free, plus the label object stored under `fulfilment/labels/`
  - the pickup location is the **consolidating vendor's** address, not ours

  **The seam is one function.** production-pipeline exports `isOrderReadyToLabel(orderId, reader?)` from `packages/api/src/lib/production-readiness.ts` and this feature is its **only** consumer — enforced by a source scan there, plus a reverse scan asserting nothing under `lib/production-*` imports anything named shiprocket. Call it inside the transaction that creates the shipment, having taken `FOR UPDATE` on the order's job rows, using the optional `reader` argument provided for exactly that.

  Two properties production-pipeline already guarantees, so this feature need not re-check them: a label cannot be issued until every job on the order has passed photo QC, and once the consolidator's own jobs go `dispatched` the predicate goes false again — **structurally one label per order**.

  Audit actions for this feature (`shipment.*`) are declared **here**, in the same phase as their emitter. #671 fails the build on any action `AUDIT_ACTIONS` declares that nothing emits, so production-pipeline deliberately declares none on this feature's behalf.

  ## Implementation Plan

  **Planned 2026-08-31.** Delivered in TWO passes, deliberately. This section covers
  **pass 1 only** — phases 1-4 below, which are the ticketed ones. Phases 5-10 are the
  Shiprocket integration and are recorded here so they cannot be forgotten, but are NOT
  ticketed yet: they are planned as a second pass once pass 1 is merged.

  **Why split.** The live bug (below) is one column and four read sites away from fixed,
  and the vendor label route answers `503` in every environment today. Neither waits on a
  courier API. Holding a working tracking page hostage to Shiprocket auth, AWB creation,
  webhooks and a new admin screen is a month of the customer seeing nothing where a week
  gets them the truth.

  ### What pass 1 actually fixes

  1. **The split brain.** `PATCH /api/admin/orders/:id/shipping`
     (`routes/admin/orders.ts:939`) writes `orders.shipping_details` (jsonb).
     `GET /api/tracking/*` (`routes/tracking.ts:122`) reads `order_shipments`. The only
     writer of `order_shipments` is `routes/admin/shipments.ts`, which has no UI. So an
     admin types a tracking number and the customer's page shows nothing, permanently.
  2. **The vendor 503.** `lib/vendor-scope.ts:433` reads
     `order_shipments.label_object_token` as a raw SQL fragment against a column that does
     not exist. `GET /api/vendor/jobs/:id/label` therefore answers a deliberate `503`
     everywhere. Landing the column is what unblocks it — and
     `tests/lib/vendor-label-seam.test.ts:211` goes RED the day it lands and names what to
     unwire.
  3. **Two production guards reading the wrong store.** `lib/vendor-scope.ts:991`
     (`ORDER_HAS_LABEL`) and `routes/admin/production-jobs.ts:713`
     (`orderShippingLabel` / `despatchEvidence`) both ask "does this order carry a label"
     of `orders.shipping_details`. After consolidation that jsonb stops being written, so
     both silently answer `false` forever and the `dispatched` edge becomes untakeable.
     They move in the same pass or the pipeline breaks.
  4. **An orphan audit action.** `order.shipment_marked_delivered` is declared in
     `AUDIT_ACTIONS` and emitted by nothing. `POST /admin/shipments/:id/mark-delivered` is
     its obvious emitter and lives in this feature's file. #671 fails the build on exactly
     this, so it is fixed here.

  ### Phase 1: Database Schema
  Location: `packages/api/src/database/{schema,migrations}`
  Pattern: `0023_production_pipeline_statuses.sql` — `ALTER TYPE ... ADD VALUE` in its own
  migration with **zero literal use**, because `drizzle-kit migrate` wraps the whole
  pending batch in one transaction and Postgres refuses a new enum value used in the
  transaction that added it. Splitting across two migration FILES does not help — on a
  fresh database both are in the same batch (#580). Migrations are applied with
  `db:migrate`, **never** `db:push` (#663).
  - [ ] Extend `shipment_status` with the RTO / NDR / cancelled states (+ tests)
  - [ ] Add the dispatch columns to `order_shipments`, including `label_object_token` and
        the `voided_at` marker `lib/vendor-scope.ts` asks for by name (+ tests)

  ### Phase 2: Close the label seam
  Location: `packages/api/src/lib/vendor-scope.ts`, `packages/api/src/routes/vendor.ts`
  Pattern: the failure being deleted is documented at `vendor-scope.ts:400-430` and the
  deletion list is the failure message of `tests/lib/vendor-label-seam.test.ts:211`.
  Follow it literally.
  - [ ] Replace the `LABEL_OBJECT_TOKEN` SQL fragment with `orderShipments.labelObjectToken`
        and delete the whole `42703` → `LabelSeamNotReady` → `503` path (+ tests)
  - [ ] Choose the live label by `voided_at IS NULL`, not by recency — the SEAM the same
        doc block defers to this feature (+ tests)

  ### Phase 3: One tracking store
  Location: `packages/api/src/routes/{admin/orders.ts,admin/shipments.ts,tracking.ts,orders.ts}`,
  `packages/api/src/services/{notifications.ts,email-templates.ts}`,
  `packages/api/src/lib/vendor-scope.ts`, `packages/web/app/components/admin/OrderDetail.tsx`
  Pattern: `order_shipments` becomes the single source of truth. `orders.shipping_details`
  is left in place and stops being WRITTEN; it is not dropped in this pass, so a backfill
  can be re-run and nothing loses history.
  - [ ] Declare `shipment.*` in `AUDIT_ACTIONS`, emit them, and wire the orphan
        `order.shipment_marked_delivered` (+ tests)
  - [ ] `PATCH /admin/orders/:id/shipping` upserts the live `order_shipments` row (+ tests)
  - [ ] Backfill migration: every `orders.shipping_details` that has no shipment row
  - [ ] `GET /api/tracking/*` reads the live (non-voided) shipment (+ tests)
  - [ ] Shipped / delivered notifications and emails read the shipment (+ tests)
  - [ ] The two production label guards read `order_shipments` (+ tests)
  - [ ] Admin and customer order detail render the shipment (+ tests)

  ### Phase 4: E2E
  Location: `tests/e2e`
  - [ ] An admin-entered tracking number reaches the customer tracking page — the
        regression test for the bug this whole feature exists to fix

  ### Phases 5-10 — NOT TICKETED YET (pass 2, the Shiprocket integration)

  Recorded so the split does not read as descoping. Plan these once pass 1 merges.

  | Phase | Location | Content |
  |---|---|---|
  | 5: Carrier config | `api/src/services/shiprocket.ts`, `.env.example` | `SHIPROCKET_*` env, a not-configured refusal, `vendors.shiprocket_pickup_location` (the DECISION: an admin pastes the nickname registered in Shiprocket's own dashboard; we do not auto-register a nullable vendor address) |
  | 6: Shiprocket client | `api/src/services/shiprocket.ts` | Auth and token refresh, courier serviceability and rate selection, create order, assign AWB, fetch label PDF, schedule pickup. **Never** imported under `lib/production-*` — `tests/lib/production-seam.test.ts:203` scans for it |
  | 7: Dispatch library | `api/src/lib/shipment-dispatch.ts` | `buyLabelForOrder`: one transaction, `FOR UPDATE` on the order's job rows, `isOrderReadyToLabel(orderId, tx)` inside it. Stores the PDF at `fulfilment/labels/<token>.pdf` via `lib/storage.ts`. Admitted by `LABEL_READINESS_CONSUMERS`' `lib/shipment-*` entry |
  | 8: Admin API | `api/src/routes/admin/shipments.ts` | Gate `POST /orders/:orderId/ship` on readiness (409 + blockers); a ready-to-label queue from `getOrderLabelReadiness`; buy label; void label |
  | 9: Webhook | `api/src/routes/webhooks/shiprocket.ts` | Verify, map Shiprocket status onto `shipment_status` including RTO/NDR, fire notifications |
  | 10: Admin UI | `web/app/routes/admin/dispatch` | The dispatch queue with blockers, the shipment detail with courier pick and label download, sidebar entry |

  ### Technical Notes
  - Monorepo: Bun workspaces + Turbo. `packages/{api,web,shared}`.
  - API: Hono + `zValidator` + Zod. Drizzle ORM, no raw SQL except documented fragments.
  - API tests: Vitest. Two harnesses — `tests/helpers/query-recorder.ts` when the SQL is
    the subject, `tests/helpers/admin-route-harness.ts` when the response is. Run one file
    with `cd packages/api && bunx vitest run <path>`.
  - `packages/api` tests ARE typechecked (#662); `packages/web` tests are not.
  - The dev database is on port **5440**, not the 5433 in `docker-compose.yml`. Suites that
    need it want `DATABASE_URL` overridden; most mock `src/database` instead.
  - Never run prettier in this repo — it has no config and its defaults rewrite files away
    from the repo's style.
