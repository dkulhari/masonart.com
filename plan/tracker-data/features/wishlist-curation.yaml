description: |-
  ## Overview
  ## Overview

  Two related capabilities on `/wishlist`, sharing one mechanism: **the wishlist is an ordered list, and the order is the point.**

  1. **Reordering** — shoppers drag their saved pieces into the order they actually rank them. A wishlist of thirty items in save order is a pile; in the owner's order it is a shortlist.
  2. **Staging a curated collection** — staff heart products in the order they want them, then create a manual collection from that list in one press.

  The second falls out of the first. `curated-collections` (#461–#475) shipped manual collections whose ordering contract is fully wired, but the admin form takes raw product UUIDs pasted into a textarea — the limitation recorded on #473. Browsing the store and clicking hearts already *is* a product picker; it just had no export.

  ## Why this is cheap

  Three findings from reading the existing code, all of which remove work:

  - **The wishlist is already an ordered array.** `user.wishlist_product_ids` is a `text[]` column on the user row, not a join table. Reordering is writing a reordered array — no migration, no position column, no per-row updates.
  - **`WishlistContents.tsx` already renders "in the order they were saved"**, so the display contract needs no change; only the ability to rewrite that order.
  - **The drag idiom already exists here.** `ProductForm.tsx` reorders product images with plain HTML5 `draggable` + `onDragStart`/`onDragOver`/`onDrop`. No library to add, and following it keeps one pattern in the codebase rather than two.

  ## Scope

  **In scope**

  - `PUT /api/wishlist` — replace the ordered id array, guarded so it must be a **permutation** of what is stored.
  - Store: a `reorder` action, optimistic, persisting to the server when signed in and to localStorage for guests.
  - `/wishlist`: drag-to-reorder, **plus explicit move-up / move-down controls**.
  - Staff-only staging bar: **Copy IDs** and **Create collection from these**.
  - E2E covering the property everything rests on — order out equals order in, through a reload.

  **Out of scope**

  - A drag-and-drop library. The repo already reorders without one.
  - Multiple named wishlists / boards. The staging slot is single and that is a stated limitation, not an oversight.
  - Reordering from the wishlist drawer or the product card heart — the page is where ordering belongs.
  - Replacing the admin form's textarea. It stays as the escape hatch for pasting into an existing collection.

  ## Design

  ### The permutation guard

  A naive "replace the array" endpoint is a data-loss bug: a tab open since before an item was added elsewhere would post a stale list and silently drop it.

  `PUT /api/wishlist` therefore accepts the new order only when its **set** equals the stored set. Different set → 409 with the current list, and the client refreshes rather than overwriting. Same-set-different-order is exactly what a reorder is, so the guard costs nothing legitimate.

  ### Keyboard controls are not optional

  Drag alone is unreachable by keyboard and invisible to a screen reader. Every draggable row also gets move-up / move-down buttons with real labels — the same call made on the admin collections list (#472), for the same reason.

  ### Staging is staff-only

  A "copy product IDs" button on every shopper's wishlist is clutter. Gated on role the way the header's staff entry already is (`staffAreaLabel`). The IDs are not secret — they are already in the DOM and in API responses — so this is about noise, not exposure.

  ### Direct create beats clipboard

  **Create collection from these** posts to `/api/admin/collections` with `kind: 'manual'`, then `PUT /:id/products` with the ordered array, and lands on the new collection's edit form. That removes the copy/paste round trip entirely. **Copy IDs** stays for pasting into a collection that already exists.

  ## Technical Considerations

  - **Guests**: the store persists to localStorage and there is no server call. Reordering must work signed-out; only persistence differs.
  - **Optimism**: the reorder applies locally first. A failed write reloads from the server rather than leaving the list disagreeing with storage — the same contract the admin rail reorder uses.
  - **Single staging slot**: an admin's wishlist is their personal wishlist. Curating a second collection means clearing the first. Say so in the UI rather than letting it be discovered.
  - **Order is the tested property** at every layer: store, endpoint, page, and E2E through a reload.

