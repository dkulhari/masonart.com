description: |-
  ## Overview
  Vendor directory, capabilities, rate cards, vendor portal, plus the minimal production-job record that QC ratings and payables attach to.

  Sub-project 1 of 5 in the fulfilment decomposition (order: vendor-management → production-pipeline → order-dispatch-tracking → production-qc-inspection → shipping-price-baked-in).

  Fulfilment reality this serves: an order is sent out to third-party print shops, then framed, then returned, then dispatched. Multiple vendors exist for both printing and framing. Today the schema has no vendor concept at all, and order_status collapses the entire pipeline into one opaque "processing" state.

  Scope: vendors + contacts; capabilities (kind print|frame, size limits, finishes, stated turnaround) used to filter assignment; per-vendor rate cards with effective dating; vendor logins with a limited, row-scoped portal; a minimal production_jobs record (order, stage, vendor, status, dates, expected/actual amount); job↔order_items join so mixed baskets split; production_job_reviews for QC verdict + defects with full rework history; payables derived from unsettled jobs plus vendor_settlements recording out-of-band payment.

  Explicitly out of scope: the two-stage state machine, routing rules, reprint loops and lead-time calculation (production-pipeline); AI defect inspection (production-qc-inspection); executing vendor payments (stays outside the system by decision).

