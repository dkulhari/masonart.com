    - "`type` becomes text with a unique index and ^[a-z0-9-]$ validation. The frame_type enum has ten values, seven used and three dead (none/walnut/oak) — a hard ceiling, with the free slots named for woods nobody stocks. Unique because getFramePreviewColor (FrameSelector.tsx:409) keys its swatch color map on type, so two frames sharing a type are indistinguishable to any type-keyed lookup."
    - "`category` is a NEW pg enum rather than more free text, because unlike type it is genuinely closed: it is the three rungs frameGroupLabel (FrameSelector.tsx:158) renders as 'Rolled Canvas/Frameless/Framed'. Today frameCategoryLabel (FrameSelector.tsx:146) infers the rung from type — an inference that puts an admin-created moulding in the right bucket only by accident and an admin-created format in the wrong one with no error anywhere. Making it a column turns a client-side guess into data."
    - "The migration is hand-written, not drizzle-kit generate output. Generate emits no backfill, and dropping the enum before backfilling destroys the source data. Order is load-bearing: add category nullable, backfill via CASE on type::text, create frame_category enum + convert + SET NOT NULL, convert type to text, DROP TYPE frame_type last (Postgres refuses to drop a type a column still references)."
    - "DELETE archives (isActive: false) mirroring admin/products.ts:642, never hard deletes. cartItems.frameId and orderItems.frameId are both onDelete 'set null', so a hard delete would silently strip the frame off historical orders. Archiving the last active frame is refused: a PDP with no format options is a broken buy panel."
    - Swatch upload calls uploadOptimizedImage directly with prefix StoragePaths.FRAMES (lib/storage.ts:76, an existing prefix with zero consumers), NOT buildProductMedia. No matting, no art-box measurement, no crop window — those exist because artwork must never be cropped blindly, and a frame swatch is product photography that fills its square. The variant ladder maps thumbnail->thumbnailUrl and card->imageUrl, so one upload fills both columns and the form needs no second image field.
    - "The in-form price preview calls frameAddition() from @chobii/shared directly — not a reimplementation, not a display-formatted copy. This is the entire lesson of #566: that bug exists because the PDP re-derived a formula the server already owned. A preview with its own arithmetic would be the same bug in a worse place, since it is the screen whose job is to convince the admin the number is right. It shows three reference print prices rather than one, because a frame is priced as a percentage precisely so its cost tracks the size of the piece — a single sample would conceal the behaviour being chosen."
    - Every mutation busts CacheKeys.PRODUCT + 'frames'. Without it the 15-minute TTL on GET /api/products/frames (products.ts:862) means an admin saves a price, reloads the PDP, sees the old number, and saves again.
