name: admin-frame-management
title: Admin Frame Management
priority: high
created: "2026-08-07T10:11:58.369Z"
assignee: unassigned
tags: []
description: |-
  ## Overview
  Full admin CRUD for frames, so frame pricing stops being a code deploy.

  Design doc: docs/superpowers/specs/2026-08-07-admin-frame-pricing-design.md (commit cbeeff87)

  ## Overview

  An admin cannot change what a frame costs today. Frames are seeded in code (packages/api/src/database/seed-frames.ts) and reach the storefront through one read-only endpoint (GET /api/products/frames), so repricing the gold moulding is a deploy.

  Storage was never the gap. Every row in `frames` (schema/products.ts:243) already carries its own `priceModifier` (multiplier, decimal 5,2) and `priceAddition` (flat rupees, decimal 10,2). Seven rows are seeded, all with priceAddition "0.00". The missing piece is a write path: no admin route, no admin screen.

  ## Goals

  - An admin can create, edit, archive and reprice frames without a deploy.
  - The price an admin sees while typing is the price the customer is charged — one formula, three surfaces.
  - Frame display grouping becomes data the admin picks, not a client-side guess off the type string.

  ## Scope

  In scope:
  - Migration: `frame_type` pg enum becomes free text; new `frame_category` enum column ('rolled'|'frameless'|'framed').
  - New /api/admin/frames routes: list, get, create, patch, archive, upload-image.
  - Swatch upload to R2 under the existing (unused) StoragePaths.FRAMES prefix.
  - Admin list screen + create/edit form at /admin/frames, sidebar entry in the Catalog group.
  - Live in-form price preview computed by the shared frameAddition() at three reference print prices.
  - FrameSelector reads the new `category` column; frameCategoryLabel deleted.
  - Cache busting on every mutation.

  Out of scope:
  - `availableSizes` editing (dead column — selected into the API response, read by nothing).
  - Scheduled price windows (shippingConfig has effectiveFrom/effectiveTo; frames are not that sale lever).
  - Audit log (no audit table exists anywhere in the schema; first one is its own decision).
  - Per-size price matrix.
  - Changing cart repricing behaviour.

  ## Blocking prerequisite: ticket #566

  frameAddition() in packages/shared/src/constants/frames.ts:570 is THE frame-pricing formula: round(unitPrice * max(0, priceModifier - 1)) + priceAddition. Cart POST and PATCH use it. The PDP does not — posters/$slug.tsx:127 re-derives from the percentage alone and drops priceAddition entirely.

  That is harmless today only because every seeded frame has priceAddition at exactly 0.00. This feature is the event that arms it: the first admin to type a flat addition makes the PDP quote low while checkout charges correctly. So #566 lands first, alone, in its existing home under cart-checkout, where it can be verified against the all-zero data in isolation.

  ## Design

  Approach: extend the existing frames table rather than add a pricing table; mirror the admin/products CRUD shape rather than invent a new one.

  Key decisions:

  1. `type` becomes text with a unique index and `^[a-z0-9-]+$` validation. The enum's ten values (seven used, three dead: none/walnut/oak) are a hard ceiling incompatible with admin-created frames. Unique because getFramePreviewColor (FrameSelector.tsx:409) keys its swatch color map on type.

  2. `category` is a NEW enum, because unlike type it is genuinely closed — the three rungs frameGroupLabel renders as "Rolled Canvas/Frameless/Framed". Today frameCategoryLabel (FrameSelector.tsx:146) infers it from type, which would put an admin-created format in the wrong bucket with no error anywhere.

  3. Migration is hand-written, not drizzle-kit generate output. Generate emits no backfill, and dropping the enum before backfilling destroys the source data. Order is load-bearing: add nullable category, backfill from type, create enum + convert + SET NOT NULL, convert type to text, DROP TYPE frame_type last.

  4. DELETE archives (isActive: false), mirroring admin/products.ts:642. Never hard delete: cartItems.frameId and orderItems.frameId are onDelete "set null", so a hard delete silently strips the frame off historical orders. Archiving the last active frame is refused — a PDP with no format options is a broken buy panel.

  5. Upload calls uploadOptimizedImage directly with prefix StoragePaths.FRAMES, NOT buildProductMedia. No matting, no art-box measurement, no crop window — those exist because artwork must never be cropped blindly; a swatch is product photography and fills its square. The variant ladder maps thumbnail->thumbnailUrl and card->imageUrl, so one upload fills both columns and the form has no second image field.

  6. The price preview calls frameAddition() from @chobii/shared directly — not a reimplementation, not a display-formatted copy. This is the entire lesson of #566: that bug exists because the PDP re-derived a formula the server already owned. A preview with its own arithmetic would be the same bug in a worse place — the screen whose job is to convince the admin the number is right. Three reference print prices, not one, because a frame is priced as a percentage precisely so its cost tracks the size of the piece.

  ## Technical considerations

  - Cache: every mutation must bust CacheKeys.PRODUCT + "frames" or the 15-min TTL (products.ts:862) means an admin saves, reloads the PDP, sees the old number, and saves again.
  - PRODUCT_IMAGE_TYPES and MAX_PRODUCT_IMAGE_MB are module-private in admin/products.ts:209-210; lift to a shared module rather than copy.
  - `export type FrameType` (products.ts:328) collapses to string. Harmless — the storefront already treats type as a plain string.
  - Pre-existing asymmetry, recorded not fixed: sitting carts keep their stored framePrice (cart.ts:791), but the add-dedupe path recomputes framePrice from the current frame row (cart.ts:796), so a price edit does leak into an existing line on a quantity bump.
  - Two dead frame catalogues found while reading, both with ZERO consumers in api and web — filed for a separate non-blocking cleanup ticket, not touched here:
    - ALL_FRAME_OPTIONS / FRAME_BY_TYPE / mat + glass constants in shared/constants/frames.ts (~500 lines)
    - frameTypeSchema (shared/schemas/product.ts:548), a Zod enum over a disjoint hyphenated vocabulary whose own test asserts safeParse('black') fails, plus its only consumers cartItemSchema/orderItemSchema in shared/schemas/checkout.ts:153,300

  ## Testing

  - Migration: the seven seeded rows land as rolled/frameless/five-framed; every type value survives verbatim.
  - API: create/patch/archive; last-active-frame archive refused; every mutation busts the cache key; Zod rejects modifier 0.5 and 9.0.
  - Coupling test: admin preview and the server cart quote produce an identical number for a frame with BOTH a non-zero priceModifier and a non-zero priceAddition — #566's missing case, asserted from the admin side too.
  - Web: form preview driven by frameAddition; FrameSelector groups on category.
  - E2E: admin edits gold frame price, PDP quotes the new number, cart charges it.

  ## Objectives
  - TBD
