description: |-
  ## Overview
  Cross-cutting logging and audit trail. Full spec: `docs/plans/2026-08-17-logging-and-auditing.md`.

  PROBLEM (re-verified 2026-08-17): there is still no audit table anywhere in `packages/api/src/database/schema/`. Actor is recorded only for gift cards (`issued_by_user_id`), promotions on create, approvals, AI moderation (`ai_generation_reviews`) and shipping config. Actor is NOT recorded for refunds (`routes/admin/returns.ts:460,536,606,671`), order cancellation or status changes, role assignment (`routes/admin/customers.ts:355` reads `currentUser` only to block self-demotion, never stores who promoted whom), or product price/stock edits. Money moves and privilege escalates with no record of who did it.

  Logging exists but is thin: pino is configured (`lib/logger.ts`) and one global middleware logs method/path/status/duration (`index.ts:93-102`) — no request id, no actor, no client IP, no redaction config, no correlation to Sentry.

  ## Decisions (settled, see spec Part 2)
  - **D1 Generic append-only `admin_audit_log`**, captured centrally — not per-domain actor columns. The gap is precisely the paths nobody remembered to add a column to. Existing per-domain trails (`ai_generation_reviews`, gift-card ledger) stay.
  - **D2 Two capture layers**: a middleware floor over every non-GET `/api/admin/*` and `/api/vendor/*` request, plus an explicit `recordAudit()` in money/privilege handlers carrying the entity delta. A `c.set("audited", true)` handshake keeps one action to one row.
  - **D3 Tiers**: tier 1 = money + privilege (launch gate, history cannot be backfilled); tier 2 = catalogue + config; the read UI is not a gate but ships here.
  - **D4 Actor snapshotted** (`actor_email`, `actor_role`) as well as referenced — a deleted user must not erase history.
  - **D5 Client IP** via the existing `getClientIp()` (cf-connecting-ip, then the LAST x-forwarded-for hop) — the first hop is client-forgeable (#291).
  - **D6 Immutability in the database**: BEFORE UPDATE OR DELETE trigger. UPDATE always refused; DELETE refused unless the transaction sets `chobii.audit_purge = 'on'` (only the retention job does).
  - **D7 Retention/PII**: 400 days (`AUDIT_RETENTION_DAYS`), daily purge worker, redactor drops `password|token|secret|otp|signature|cvv|card` keys and truncates >2KB strings. India DPDP Act applies.
  - **D8 Failure policy**: `recordAudit()` never throws — an audit failure must not roll back a refund that already happened; it logs at error and alerts. Callers may pass a `tx` for atomicity by choice.
  - **D9 Correlation**: one `request_id` (x-request-id, else cf-ray, else generated) binds the log line, the response header, the audit row and 5xx error bodies.

  ## Objectives
  - Every money and privilege action attributable to a named actor, with before/after, IP and request id
  - No admin/vendor mutation can escape the trail by being forgotten
  - Audit rows unmodifiable and undeletable outside the retention job
  - Admin-only viewer with filters and an entity timeline
  - Structured request logging that joins to audit rows by request id

  ## Implementation Plan

  ### Phase 1: Contract
  Location: `packages/shared/src/schemas`, `packages/api/src/database`
  - [ ] Shared action registry, category/outcome enums, query + entry schemas (+ tests)
  - [ ] `admin_audit_log` table, indexes, migration, immutability trigger (+ DB tests)

  ### Phase 2: Core
  Location: `packages/api/src/lib`, `packages/api/src/middleware`
  - [ ] Redactor + delta helpers (+ tests)
  - [ ] `recordAudit()` service, never-throws, tx-aware (+ tests)
  - [ ] Request-context middleware: request id, child logger, pino redaction (+ tests)

  ### Phase 3: Capture
  Location: `packages/api/src/middleware`
  - [ ] Audit middleware floor over admin + vendor mutations with suppression handshake (+ tests)

  ### Phase 4: Tier 1 — money and privilege
  Location: `packages/api/src/routes/admin`
  - [ ] Returns: approve, reject, refund, store credit
  - [ ] Orders: status change and cancellation
  - [ ] Privilege: role assignment, vendor invites; gift card issue/disable/enable

  ### Phase 5: Tier 2 — catalogue and config
  - [ ] Products, variants, frames, promotions, collections
  - [ ] Shipping config/options, wallet config, vendor rates

  ### Phase 6: Read
  Location: `packages/api/src/routes/admin`, `packages/web/app/routes/admin`
  - [ ] `GET /api/admin/audit-log` + entity timeline, admin-only, cursor paginated
  - [ ] `/admin/audit-log` UI: filters, table, before/after drawer

  ### Phase 7: Ops
  - [ ] Retention purge worker + `AUDIT_RETENTION_DAYS`
  - [ ] E2E spec + OPERATIONS.md runbook section

  ## Technical Notes
  - Project: bun + turbo monorepo; Hono API, Drizzle (migrations in `packages/api/src/database/migrations`), TanStack Router web, vitest + Playwright
  - Test commands must be path-scoped — the machine is shared
  - API tests need `DATABASE_URL=postgresql://poster_app:dev_password@localhost:5440/poster_app_dev`
