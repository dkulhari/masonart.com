description: |-
  ## Overview
  Production photo/video approval system for made-to-order items. Customers receive production photos, can zoom/review, request adjustments, or approve for shipping with timeline visibility.

  ## Objectives
  - Admin uploads production photos/video for order
  - Customer receives email with approval link
  - Full-screen photo view with zoom
  - Request changes with comments
  - Approve for shipping button
  - Timeline showing production → approval → shipped
  - Admin dashboard for pending approvals
  - Deadline reminder if no action taken
  - Approval history logged

  ## Source
  Roadmap Feature 16 (Phase 2)

  ## Testing Strategy

  | Level | Scope | What to Test | Tool |
  |-------|-------|--------------|------|
  | Unit | Per ticket | Schema validation, service functions, hooks | Vitest |
  | Integration | Per ticket | API routes, middleware, database operations | Vitest + app.request() |
  | Component | Per ticket | Complex React components (approval viewer, timeline) | Testing Library |
  | E2E | Per feature | Full approval flows (admin upload → customer approve) | Playwright |

  ## Implementation Plan

  **Note**: Each task includes unit/integration tests. E2E tests are added at feature completion.

  ### Phase 1: Database Schema
  Location: `packages/api/src/database/schema/`
  Pattern: Drizzle ORM with pgTable, pgEnum, relations

  - [ ] Create `productionApprovals` table (id, orderId, orderItemId, status enum [pending_upload, pending_approval, changes_requested, approved, expired], approvalToken, tokenExpiresAt, approvedAt, deadlineAt, createdAt, updatedAt) (+ unit tests)
  - [ ] Create `approvalPhotos` table (id, approvalId, url, thumbnailUrl, sortOrder, uploadedAt, uploadedBy) (+ unit tests)
  - [ ] Create `approvalComments` table (id, approvalId, authorType enum [admin, customer], authorId, comment, createdAt) for change requests and admin notes (+ unit tests)
  - [ ] Add relations to orders/orderItems tables and export types (+ unit tests)

  ### Phase 2: Backend Services
  Location: `packages/api/src/services/`
  Pattern: Async functions with TypeScript types, error handling

  - [ ] Create approval service (`approval.ts`) with functions: createApproval, uploadPhotos, requestChanges, approveProduction, getApprovalByToken (+ unit tests)
  - [ ] Add approval email templates: photo_ready_for_review, changes_requested_response, approval_confirmed, approval_deadline_reminder (+ unit tests)
  - [ ] Create deadline checker service for sending reminder emails (can be cron job or BullMQ scheduled task) (+ unit tests)

  ### Phase 3: Backend API Routes
  Location: `packages/api/src/routes/`
  Pattern: Hono with zValidator, requireAuth middleware

  - [ ] Create admin approval routes (`/api/admin/approvals`): list pending, get by id, upload photos, respond to change request (+ route tests)
  - [ ] Create public approval routes (`/api/approvals/:token`): get approval details, submit changes request, approve for shipping (+ route tests)
  - [ ] Integrate approval creation into order processing flow when order contains made-to-order items (+ route tests)

  ### Phase 4: Frontend - Admin Dashboard
  Location: `packages/web/app/routes/admin/`
  Pattern: React Router v7 with TanStack Table, shadcn/ui components

  - [ ] Create admin approvals list page (`/admin/approvals`) with filters: pending upload, pending approval, changes requested (+ component tests)
  - [ ] Create admin approval detail page (`/admin/approvals/:id`) with photo upload, customer comments view, respond to changes form (+ component tests)
  - [ ] Add approval status badge to admin order detail page with link to approval management (+ component tests)

  ### Phase 5: Frontend - Customer Approval Page
  Location: `packages/web/app/routes/`
  Pattern: Public routes with token-based access, responsive design

  - [ ] Create public approval page (`/approve/:token`) with full-screen photo gallery, zoom capability, timeline display (+ component tests)
  - [ ] Build approval actions component: approve button, request changes form with comment textarea (+ component tests)
  - [ ] Add approval status to customer order detail page (`/account/orders/:id`) with timeline showing production → approval → shipped states (+ component tests)

  ### Phase 6: E2E Tests & Documentation
  Location: `tests/e2e/` and `docs/manual-tests/`
  Pattern: Playwright E2E tests, manual test documentation

  - [ ] E2E test: Admin uploads photos, customer receives email, approves production (+ Playwright spec)
  - [ ] E2E test: Customer requests changes, admin responds, customer approves (+ Playwright spec)
  - [ ] Create manual test documentation for approval workflow (+ docs/manual-tests/photo-approval.md)

  ## Technical Notes
  - Project type: Bun monorepo with Turbo
  - Database: PostgreSQL with Drizzle ORM
  - Backend: Hono API framework with Zod validation
  - Frontend: React Router v7 with file-based routing
  - Email: Resend integration (existing `packages/api/src/services/email.ts`)
  - Image storage: MinIO (existing infrastructure) or CDN
  - Approval tokens: UUID-like tokens similar to order tracking tokens
  - Deadline handling: Consider BullMQ delayed jobs for reminders

  ## Dependencies
  - Requires existing orders and orderItems schemas (already complete)
  - Builds on existing email service infrastructure
  - Uses existing admin panel patterns and components
  - Extends order detail pages (admin and customer)
