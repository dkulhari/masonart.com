description: |-
  ## Overview
  Take MasonArt from development to production-ready state. Addresses critical gaps in deployment infrastructure, security hardening, observability, and bug fixes required for a safe public launch.

  Current production readiness score: 58/100. Target: launch-ready with core functionality, security, and observability.

  ## Goals
  - Fix all P0 bugs blocking launch (routing, auth, security headers)
  - Create deployment infrastructure (Dockerfile, health endpoint, deploy config)
  - Harden security (CORS, CSP, HSTS, rate limiting)
  - Add observability (error tracking, structured logging, alerting)
  - Optimize for production performance (bundling, compression, caching)
  - Ensure database production readiness (backups, pooling, rollback plan)

  ## Scope
  - **In scope**: Bug fixes, deployment infra, security headers, monitoring, production configs
  - **Out of scope**: New features, UI redesigns, additional payment providers

  ## Technical Considerations
  - Many P0 bugs already tracked in manual-testing-bugs-feb2026 feature — those tickets are referenced but not duplicated
  - Deployment target TBD (Railway, Fly.io, AWS ECS)
  - Bun runtime requires specific Dockerfile patterns
  - React Router v7 SSR needs security middleware at the server level

  ## Plan Document
  See docs/plans/2026-02-18-go-to-production-plan.md for full analysis
