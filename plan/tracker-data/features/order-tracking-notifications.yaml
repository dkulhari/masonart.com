assignee: unassigned
tags: []
description: |-
  ## Overview
  Order tracking page showing status timeline, basic email notifications for order confirmation and shipping, and SMS notifications for key updates.

  ## Objectives
  - Order tracking page with status timeline
  - Email notification on order confirmation
  - Email notification when shipped with tracking link
  - SMS notification on order confirmation
  - SMS notification when out for delivery
  - Guest order lookup by order ID and email
  - Integration with shipping provider tracking

  ## Source
  Roadmap Feature 11 (Phase 1)

  ## Implementation Plan

  ### Phase 1: Database Schema
  Location: `packages/api/src/database/schema/`
  Pattern: Drizzle ORM with pgTable, pgEnum, relations

  - [ ] Create `notifications` table for notification log (id, orderId, type, channel, status, sentAt, error)
  - [ ] Create `notificationPreferences` table (userId, emailOrderConfirmation, emailShipped, smsOrderConfirmation, smsOutForDelivery)
  - [ ] Add notification preference relations to users table
  - [ ] Export types and update schema index

  ### Phase 2: Backend Services
  Location: `packages/api/src/services/`
  Pattern: Async functions with TypeScript types, error handling

  - [ ] Create email service (`email.ts`) with Resend/SendGrid integration
  - [ ] Create notification service (`notifications.ts`) to orchestrate email/SMS sending
  - [ ] Add email templates for order confirmation and shipping updates
  - [ ] Extend existing SMS service for transactional messages (not just OTP)
  - [ ] Create notification trigger functions for order status changes

  ### Phase 3: Backend API Routes
  Location: `packages/api/src/routes/`
  Pattern: Hono with zValidator, requireAuth middleware

  - [ ] Create guest order lookup endpoint (`GET /api/orders/track?orderNumber=&email=`)
  - [ ] Add notification preferences endpoints (`GET/PATCH /api/users/notification-preferences`)
  - [ ] Add webhook/internal endpoint for triggering notifications on status change
  - [ ] Integrate notification triggers into existing order status update flows

  ### Phase 4: Frontend - Public Order Tracking
  Location: `packages/web/app/routes/`
  Pattern: TanStack Router with file-based routing, React components

  - [ ] Create public order tracking page (`/track` or `/orders/track`)
  - [ ] Build guest lookup form component (order number + email/phone)
  - [ ] Integrate existing `OrderTrackingCard`, `TrackingTimeline` components
  - [ ] Add tracking link in confirmation emails with token-based access

  ### Phase 5: Frontend - User Notification Preferences
  Location: `packages/web/app/routes/_authed/account/`
  Pattern: Authenticated routes with React Hook Form

  - [ ] Add notification preferences section to account settings
  - [ ] Create toggle components for each notification type
  - [ ] Wire up to notification preferences API

  ### Phase 6: Testing
  Location: `packages/api/tests/` and `packages/web/tests/`
  Pattern: Vitest with describe/it blocks, mock services

  - [ ] Unit tests for email and notification services
  - [ ] API route tests for guest order lookup
  - [ ] API route tests for notification preferences
  - [ ] Component tests for tracking page and preferences UI
  - [ ] E2E test for guest order tracking flow

  ## Technical Notes
  - Project type: Bun monorepo with Turbo
  - Database: PostgreSQL with Drizzle ORM
  - Backend: Hono API framework with Zod validation
  - Frontend: TanStack Start with file-based routing
  - Existing SMS: 2Factor.in integration (expand for transactional)
  - Email provider: Recommend Resend for transactional emails (India-friendly)
  - Existing tracking UI components can be reused

  ## Dependencies
  - Requires existing orders and shipping schemas (already complete)
  - Builds on existing SMS service infrastructure
  - Uses existing order tracking UI components
