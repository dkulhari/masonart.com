description: |-
  ## Overview
  ## Goal
  Restrict reviews to verified purchasers only - users who have ordered and received the product.

  ## Architecture
  Add `orderItemId` to reviews schema, create new endpoint for order-based review creation, add review UI to order detail page, remove review form from product pages.

  ## Tech Stack
  Hono API routes, Drizzle ORM, React components, Playwright E2E tests, Vitest unit tests

  ## Source
  Imported from Superpowers: docs/plans/2026-02-01-verified-purchase-reviews-plan.md

  ## Implementation Summary
  - Database schema: Added orderItemId foreign key to reviews table
  - Backend API: New POST /api/orders/:orderId/items/:itemId/review endpoint
  - Backend API: Enhanced order detail response with review status
  - Frontend: ReviewModal component for order-based submissions
  - Frontend: Removed review forms from product pages
  - Testing: 39 API tests + 29 E2E tests

  ## Objectives
  - TBD
