  decisions:
    - Enum role
    - not a granular permissions system — smallest change
    - follows existing requireRole pattern
    - migrates cleanly to permission groups later
    - Trusted publisher — content-managers publish directly via existing draft -> active product status flow; no approval queue (products default to draft so nothing goes live accidentally)
    - Role assignment capped at content-manager — admin customers-page dropdown can only toggle customer <-> content-manager
    - never grant admin/super-admin (prevents privilege escalation; full role management stays reserved for super-admin)
    - No trade inheritance — content-manager branches off customer in the hierarchy; requireTrade and wholesale pricing untouched
    - No dashboard access — content-managers land on /admin/products; orders
    - customers
    - AI
    - trade
    - reports remain admin-only with Access Denied on direct URL entry
