description: |-
  ## Overview
  ## Overview
  Production launch of masonart.com on the shared Mac mini home server behind a Cloudflare Tunnel — single hostname, path-routed ^/api/.* → api:3000, else → web:3001 (same-origin auth, zero inbound ports). Images build on the dev machine, push to GHCR (latest + git short-sha), the mini only pulls a rendered compose file via deploy/Makefile. Razorpay TEST mode at launch. Full design in docs/GO-LIVE-PLAN.md; day-2 ops in docs/OPERATIONS.md, docs/RUNBOOK-OUTAGE.md, docs/EXTERNAL-SERVICES.md.

  Adapts the proven customs-copilot go-live model; every lesson from its first-deploy bug log (#88–#99, #130, #131) is a design constraint here, not a future incident.

  Prerequisites tracked in go-to-production (89% done): remaining tickets #278 (uptime monitoring) and #283 (backups) must land before the gate.

  ## Objectives
  - Same-origin single-hostname architecture (kill CORS/cross-subdomain cookies)
  - Dev-machine build → GHCR push → mini pull deploy pipeline with sha-tag rollback
  - Fix launch blockers found in plan review (curl-less healthchecks, spoofable XFF rate limits, db:push in prod)
  - Fail-loud prod env contract
  - Go-live gate proven from outside the LAN (phone on LTE)

