design:
  approach: "Single public hostname masonart.com path-routed at the Cloudflare edge (anchored regex ^/api/.* → api:3000, catch-all → web:3001, www → apex bulk redirect); cloudflared container dials outbound-only, TUNNEL_TRANSPORT_PROTOCOL http2. Web bundle baked same-origin via --build-arg VITE_API_URL='' with ?? fallbacks. deploy/Makefile on the dev machine: buildx linux/arm64 → GHCR (latest + git short-sha), gen-compose renders one file (build: keys stripped), scp + ssh pull/up; rollback = IMAGE_TAG=<sha>; panic switch = disable tunnel. Migrations ship in the api image and run via drizzle-kit migrate. Compose project name masonart, no host ports, mem_limits budgeted against the shared 6GB Colima VM. Gate proven from outside the LAN."
  decisions:
    - "Single hostname over api.masonart.com subdomain — same-origin removes the CORS/cross-subdomain-cookie class entirely (cc lesson);Tunnel path field is an anchored regex ^/api/.* — unanchored /api/* swallowed a Vite chunk named api-<hash>.js in customs-copilot (#97);Build on dev machine + GHCR pull — the 8GB mini cannot absorb builds while co-hosting customs-copilot;Tag latest AND git short-sha — sha tags are the rollback mechanism;http2 tunnel transport — QUIC through the home-router NAT degrades (cc #99);drizzle-kit migrate over db:push — push is unsafe against prod schema and the mini has no checkout (cc #93);:? guards on all silently-degrading env vars — unset RESEND/RAZORPAY/R2 vars must fail at render"
    - "not fall back silently (cc #94/#131);cf-connecting-ip over first XFF entry — first entry is attacker-controlled behind the tunnel (cc #95);Healthcheck probes via bun -e / node -e — slim images ship no curl;Razorpay test mode = real provider code + rzp_test keys"
    - "no separate code path;Existing #278/#283 stay in go-to-production and gate this feature rather than being duplicated"
