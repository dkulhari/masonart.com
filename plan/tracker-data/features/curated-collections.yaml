design:
  approach: "One `collections` table with two membership kinds. `kind: 'rule'` stores the existing validated product-filter payload (facets + sort) as jsonb and resolves through the same query path `/api/products` already uses; `kind: 'manual'` resolves through a `collection_products` join carrying an explicit position. Storefront gets `/collections/$slug` reusing the collection-page shell built for /posters, with the collection's rule as the base query and shopper facets narrowing within it. The Discover rail is re-pointed from STYLE_OPTIONS to the collections table and its chips become links rather than filter toggles. Admin gets full CRUD at /admin/collections with a rule builder over the shared facet vocabulary."
  decisions:
    - "Rule AND manual membership, not one or the other. Measured against mesonart: a rule payload reproduces 16 of their 18 chips outright, and the two merchandising ones (Latest Work, Bestseller) are just a sort. Manual covers curation a rule cannot express; rule-only makes 'these six, in this order' impossible, manual-only means re-picking as the catalogue grows."
    - The rule IS the existing filter payload, not a new query language. It stores exactly the fields /api/products already validates, so a collection page is the product list with a pre-applied base filter. No second query planner, no second vocabulary.
    - "Chips become links, not toggles. Deliberate behaviour change on /posters: a chip that toggles `styles` structurally cannot express Bestseller or Set of 2/3. Counts and the empty-collection cull are kept."
    - Supersede the dead `collectionSchema` in packages/shared/src/schemas/product.ts rather than extend it. Its CollectionType is a closed six-value marketing enum that cannot express an admin-authored collection, and it is referenced only by its own test — the same dead-but-tested state styles.ts and the size ladders were in. Deprecate in place with a pointer; do not leave a second collection vocabulary alive.
    - Seed 12 style collections + Latest Work + Best Sellers so the rail cannot empty out on deploy, and today's twelve chips survive in link form.
    - Slugs are admin-authored and unique, not derived from a facet id — a collection may span facets or none.
    - chipArtScale() applies only to the representative-product fallback image. Product `main` images are matted at a fixed fraction of the longest side; an admin-uploaded image is not, so scaling it would crop into it wrongly.
    - Admin writes must bust the collections cache. The style-derived endpoint never had to, because its input was a constants file.
