    text: |-
      ✅ **Completed**

      **Commit**: `d17c1c5b` - feat(api): bulk catalogue import from a CSV manifest and media folder

      **Files Changed**:
      - `packages/api/src/database/import-catalogue.ts` — new: parseManifest, resolveMedia, importCatalogue, and the CLI
      - `packages/api/tests/database/import-catalogue.test.ts` — new: manifest parsing (4 tests)
      - `packages/api/tests/database/import-catalogue-media.test.ts` — new: media resolution + dry-run (4 tests)
      - `packages/api/package.json` — registered `db:import-catalogue`

      **Summary**:
      `bun run db:import-catalogue --manifest <csv> --media-dir <dir>` creates products with their full image set from a CSV plus a folder of images. Flags: `--dry-run`, `--limit <n>`, `--force-media`.

      Every image goes through `buildProductMedia`, so the square contract holds: main matted at 88%, art box measured, 4-size WebP ladder built, untouched source retained under `products/originals/`. Room mockups take the centred square.

      Constraints from the ticket, and how each is met:
      - **`--dry-run` writes nothing** — the database, storage and product-media modules are imported *inside* the write path, so a dry-run never loads anything capable of writing. Not a flag checked at each write site.
      - **Per-row isolation** — failures collect with row number + sku, the run continues, the report prints in file order, exit code 1.
      - **Idempotent on sku** — existing sku updates rather than duplicates; images left alone unless `--force-media`.
      - **Orientation guard (#545)** — a row whose artwork contradicts its declared orientation fails and is reported; `orientationOverride` is the CSV escape hatch.
      - **Storage env** — a real run refuses to start when `R2_ENDPOINT`/`R2_ACCESS_KEY`/`R2_SECRET_KEY`/`R2_BUCKET` are unset, since `storage.ts` otherwise falls back to the dev bucket and reports success.

      Also added beyond the letter of the ticket, because a dry-run that misses them is not a pre-flight: duplicate sku and duplicate slug **within** the manifest are caught before any write, a slug already owned by a different sku in the database fails that row, and image filenames are constrained to bare names so `../../etc/passwd` in a cell cannot be opened and uploaded.

      **Deviation from the ticket description**: `basePrice` requires two decimals (`/^\d+\.\d{2}$/`), which is stricter than the `/^\d+(\.\d{2})?$/` the description quotes from `createProductSchema`. The step-1 test fixture treats a bare `1499` as invalid, and the strictness is defensible for an unattended bulk load — nobody watches a 300-row manifest go in, so a truncating spreadsheet export should fail the dry-run rather than silently reprice the catalogue. Every price in `seed.ts` is already written in this form. Documented at the field.

      **Also fixed**: the ticket's step commands (`bunx vitest run packages/api/tests/...` from the repo root) do not work — the root vitest config only includes `tests/**`. Correct form is `cd packages/api && bunx vitest run tests/database/<file>`.

      **Verification**:
      - Command: `cd packages/api && bunx vitest run tests/database/import-catalogue.test.ts tests/database/import-catalogue-media.test.ts`
      - Result: PASS (8 tests, 8 passing)
      - Command: `cd packages/api && bun run typecheck`
      - Result: PASS (src + tests, clean)
      - Command: `cd packages/api && VITEST_MAX_WORKERS=2 bunx vitest run` (full api suite)
      - Result: 1 failed | 5942 passed | 187 skipped (6130). The single failure is `tests/database/shipping.test.ts` — `shipment_status` enum has 12 values, the test expects 7. Pre-existing drift from the dispatch-tracking work; this ticket touched no shipping code (`git status` shows only the 3 new files + one package.json line).

      **Real dry-runs** against `.cache/seed-media/`:
      - Good 2-row manifest: `rows validated 2 | created 0, updated 0, failed 0`, exit 0.
      - 7-row manifest exercising every failure mode: `validated 1 | failed 6`, exit 1, each reported against its own line —
        ```
        ! row 2 BAD-1: slug: Slug must be lowercase alphanumeric with hyphens
        ! row 3 BAD-2: basePrice: Invalid price format — write the paise, e.g. 1499.00
        ! row 4 BAD-3: Not in --media-dir: nope-main.webp
        ! row 5 BAD-4: mainImage: mainImage must be a filename inside --media-dir, not a path
        ! row 6 BAD-5: orientation: Invalid enum value. Expected 'square' | 'portrait' | ...
        ! row 8 IMP-002: Duplicate slug "good-row" — also used by sku IMP-001
        ```
      - Missing R2 env on a real run: refuses with `Storage is not configured — missing R2_ENDPOINT, R2_ACCESS_KEY, R2_SECRET_KEY, R2_BUCKET.`, exit 1.
      - Unknown flag `--dryrun`: refused with usage, exit 1.

      **Not covered by this ticket**: no product ever gets a size/variant ladder from the importer — the manifest has no variant columns and `bun run seed` is what builds those today. A catalogue loaded through this tool has products and images but nothing purchasable until variants exist. Worth its own ticket before go-live.
