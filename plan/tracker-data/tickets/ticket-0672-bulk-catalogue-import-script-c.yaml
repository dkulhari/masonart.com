ticket_number: 672
title: 'Bulk catalogue import script: CSV manifest + image folder through buildProductMedia'
description: |-
  ## Task

  Loading the real production catalogue is a per-product, per-file manual job today. `/admin/products/new` (`packages/web/app/components/admin/ProductForm.tsx:918`) takes one product at a time, and every image is picked, typed and cropped by hand. The seeder (`packages/api/src/database/seed.ts`) can do it in bulk but is dev-only: it reads a hardcoded slug-to-prefix map and a gitignored `.cache/seed-media/`.

  Build `packages/api/src/database/import-catalogue.ts` — a CLI that reads a CSV manifest plus a media folder and creates products with their full image set, going through the exact same processing path the admin upload uses.

  ## Input contract

  CSV, one row per product. Columns mirror `createProductSchema` (`packages/api/src/routes/admin/products.ts:178`):

  ```
  sku,title,slug,description,basePrice,orientation,styles,subjects,colors,rooms,tags,seoTitle,seoDescription,status,isFeatured,featuredOrder,mainImage,roomImages,altText
  ```

  - Array columns (`styles`, `subjects`, `colors`, `rooms`, `tags`, `roomImages`) are pipe-separated: `abstract|modern`.
  - `mainImage` and `roomImages` are filenames resolved against `--media-dir`.
  - `basePrice` must match `/^\d+(\.\d{2})?$/`; `slug` must match `/^[a-z0-9-]+$/`.

  CLI flags: `--manifest <path>` (required), `--media-dir <path>` (required), `--dry-run`, `--limit <n>`.

  ## Why it must reuse buildProductMedia

  `buildProductMedia()` (`packages/api/src/lib/product-media.ts:52`) is what enforces the square contract the storefront grid depends on: `main` is matted at 88% via `matToSquare` and never cropped, `artBox` is measured, the 4-size WebP variant ladder is generated by `uploadOptimizedImage`, and the untouched source is retained under `products/originals/`. A script that inserts image rows directly would produce products the grid renders wrong. Room mockups use `cropToSquare`; with no crop rect in a CSV they fall back to the centred square, which is the correct default for a mockup.

  ## Constraints

  - **Idempotent on `sku`.** Re-running the same manifest must update, not duplicate. Skip image re-upload when the product already has images and `--force-media` is absent — reprocessing is ~400ms and an R2 write per image.
  - **Per-row isolation.** One bad row must not abort the run. Collect failures, keep going, exit non-zero with a per-row report (row number, sku, reason).
  - **`--dry-run` writes nothing** — no DB, no R2. It validates every row and confirms every referenced image file exists. This is the pre-flight before a real catalogue load.
  - **Orientation.** The create route has a guard that rejects a declared orientation contradicting the measured art box (see `packages/api/tests/routes/admin/product-orientation-guard.test.ts`). The importer must respect it and report the mismatch rather than silently writing the wrong value. `orientationOverride` is the escape hatch — expose it as an optional CSV column.
  - **Storage env.** The script writes through `packages/api/src/lib/storage.ts:29`, which reads `R2_ENDPOINT` / `R2_ACCESS_KEY` / `R2_SECRET_KEY` / `R2_BUCKET`. Fail loudly at startup if unset rather than uploading into the MinIO dev default.

  ## Context

  - Add a `db:import-catalogue` script to `packages/api/package.json` alongside `seed` / `backfill:art-box`, using the same `bun run --env-file=../../.env` shape.
  - `packages/api/src/database/backfill-art-box.ts` is the closest existing precedent for a one-off DB CLI in this repo — follow its argument-parsing and reporting style.
  - The seeder's `localSeedMediaSet()` (`packages/api/src/database/seed-images.ts:131`) is the convention-based cousin of this. It is not being replaced; it stays for dev seeding.
  - Document the CSV columns and a worked example in the script's header comment, since the person filling the manifest is not necessarily a developer.
