    text: |-
      ✅ **Completed**

      **Commit**: `b26a6360` — feat(api): GET /api/collections/:slug

      **Files Changed**:
      - `packages/api/src/routes/collections.ts` — added the `/:slug` handler, `collectionFacetCounts`, `publicCollection`, `emptyPage`, and the query schema.
      - `packages/api/tests/routes/collection-detail.test.ts` — 12 tests.

      **The intersection rule reaches production here**, and it short-circuits: when the merge returns `IMPOSSIBLE` the endpoint answers with an empty page **without issuing any product query**. A test asserts the call count (`does not even query for products when the answer is known`), because "returns nothing" and "returns nothing after asking" look identical from the response.

      **Facet counts are scoped to the collection, and exclude the shopper's own facets.** Two distinct failures avoided:
      - catalogue-wide counts would offer filters that return nothing inside this collection
      - folding the shopper's current selection in would zero every sibling option the instant they tick one, so the sidebar collapses as it is used

      Confirmed live: `/pop-art` reports **5** style facets (its 6 products carry other styles too), `/best-selling` reports **12** — the whole vocabulary, correctly, because that collection is the whole catalogue.

      **Manual ordering** uses `array_position(ARRAY[...]::uuid[], products.id)` and applies only when the shopper has not chosen a sort. The admin's order is the one thing a rule cannot express, so it outranks a stored sort but not an explicit request.

      **Live verification against the restarted API**

      | request | result |
      |---|---|
      | `/pop-art` | 200, total 6, 5 style facets |
      | `/pop-art?styles=ukiyo-e-art` | 200, **total 0** — the intersection rule |
      | `/pop-art?styles=pop-art` | 200, total 6 — narrowing inside |
      | `/best-selling` | 200, total 41, 24 items, 12 style facets |
      | `/best-selling?styles=pop-art` | 200, total 6 |
      | `/best-selling?page=2&pageSize=24` | 200, page 2, 17 items |
      | `/pop-art?sortBy=basePrice&sortOrder=asc` | 200, leads with 899.00 |
      | `/nope-not-real` | **404** |
      | `/pop-art?styles=not-a-style` | **400** |

      **One typecheck trap worth recording**: indexing the sort-column map with `sort.sortBy as keyof typeof products & string` produced ~40 errors, because it resolves against the *table* type rather than the map. Extracting the map to a `const` and indexing with `keyof typeof SORT_COLUMNS` fixes it.

      **Verification**
      - Command: `cd packages/api && npx vitest run tests/routes/collection-detail.test.ts tests/routes/collections.test.ts`
      - Result: PASS — 20 tests, 0 failing
      - Build: `npx tsc --noEmit -p tsconfig.json` — 0 errors in these modules

      **Note**: the dev API on :3000 was restarted before this verification (it had been serving 26-hour-old module state, see #465). It now reflects the working tree.
