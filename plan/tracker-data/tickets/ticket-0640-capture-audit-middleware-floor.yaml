ticket_number: 640
title: Capture - audit middleware floor over admin and vendor mutations
description: |-
  ## Task
  Mount an audit middleware on `/api/admin/*` and `/api/vendor/*`. After `next()`: skip GET/HEAD/OPTIONS, skip when `c.get('audited')` is set (a handler already wrote a precise row), otherwise write one `admin.request` row with method, path, route params and status in metadata, `outcome` derived from the status code, and category `config`.

  This is the floor: a route added next month is audited without its author doing anything.

  ## Context
  Part of feature: admin-audit-log (Phase 3 - Capture)
  Spec: docs/plans/2026-08-17-logging-and-auditing.md D2 and section 3.5
  The suppression handshake is the thing to test: a handler calling recordAudit must produce exactly one row, not two.
