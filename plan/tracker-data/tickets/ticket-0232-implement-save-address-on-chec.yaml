ticket_number: 232
title: Implement save-address-on-checkout
description: |-
  ## Task
  When the "Save address for future orders" checkbox is checked during checkout and order is placed, call `addressesApi.create()` to persist the address. Handle errors gracefully (don't block order if save fails). Skip if the address was already selected from saved addresses.

  ## Context
  Part of feature: saved-addresses
  Phase: Phase 5 - Checkout Integration
  Location: `packages/web/app/routes/checkout/index.tsx`, `packages/web/app/components/checkout/AddressForm.tsx`
  Note: The "Save for future orders" checkbox UI already exists in AddressForm when `isLoggedIn={true}`

  ## Testing Requirements
  - Unit tests for save logic (skip if already saved, handle errors)

  ## Acceptance Criteria
  - [ ] Address saved when checkbox checked and order placed
  - [ ] No save attempt if address was from saved addresses
  - [ ] Order completes even if address save fails
  - [ ] Success feedback shown to user
