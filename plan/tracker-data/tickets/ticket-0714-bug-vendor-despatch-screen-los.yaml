    text: |-
      ✅ **Completed**

      **Commit**: `2905bfa7` - fix(vendor): stop the despatch screen losing dockets and resurrecting sent buckets

      **Files Changed**:
      - `packages/web/app/routes/vendor/index.tsx` — extracted `useVendorDespatch`; skeleton gate; busy Set; piece-count re-sync
      - `packages/web/tests/routes/vendor/vendor-screens.test.tsx` — 7 new tests

      **Summary**:
      All four defects fixed as filed. The two races (1 and 3) were not reachable through the presentational panel, so the loader became an exported hook, `useVendorDespatch`, and both are now tested directly with deferred promises.

      1. `loadCandidates` now runs under `useLatestOnly` (`packages/web/app/lib/latest-request.ts`), the guard already used by the three admin production screens. A stale candidates response no longer overwrites a newer one.
      2. The skeleton renders only when `data === null`, so a refetch keeps every other bucket mounted and its typed docket intact.
      3. `busyGroupId: string | null` became `busyGroupIds: ReadonlySet<string>` on both the hook and `VendorDespatchPanelState`. Keys are added and removed, never assigned, so one send settling cannot unlock another that is still open.
      4. `pieces` follows `group.jobs.length` via an effect keyed on the count — so a bucket that gains a job updates its default, while a count the vendor typed survives a re-read of the same bucket.

      **Note on scope**: extracting the loader also moved `setError(null)` to the START of a read rather than on success. That is half of #715 defect 1 and lands here as a consequence of the extraction, not as a claimed fix — #715 will add the test that pins it.

      **Verification**:
      - Command: `npx vitest run tests/routes/vendor/` (in `packages/web`)
      - Result: PASS (3 files, 293 tests, 293 passing, 0 failing)
      - All 7 new tests were confirmed failing before the fix (step 2)
      - Build: `npm run typecheck` PASS
