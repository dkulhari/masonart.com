ticket_number: 714
title: 'Bug: vendor despatch screen loses draft dockets and resurrects already-sent buckets under concurrent use'
description: |-
  ## Task

  Four state-correctness defects in `packages/web/app/routes/vendor/index.tsx`, all introduced by `5652a799 feat(web): give the vendor portal the screen that sends a parcel`. Each was verified against the file at 1577 lines; line numbers below are current as of that commit.

  Filed by a different session that was working on an unrelated branch — not fixed here, because the file belongs to live work elsewhere.

  ### 1. `loadCandidates` has no stale-response guard (`:1359`)

  `useLatestOnly` exists at `packages/web/app/lib/latest-request.ts` and is already used by `routes/admin/production/index.tsx`, `$id.tsx` and `OrderProductionPanel.tsx`. This screen does not use it. Verified: no occurrence of `useLatestOnly` anywhere in `vendor/index.tsx`.

  Repro: despatch bucket A (its post-write `loadCandidates` starts), immediately despatch bucket B. B's response returns without A or B; the slower A response then lands and overwrites it with a list that still contains B. B reappears as sendable, and "Send this group" returns 409 `JOB_ALREADY_ON_TRANSFER` for work already despatched. Double-clicking "Try again" has the same shape.

  ### 2. Every refetch unmounts in-progress dockets (`:1360`, render at `:1090`)

  `loadCandidates` calls `setCandidatesLoading(true)` unconditionally, and the panel renders `DespatchSkeleton` whenever `isLoading` is true. So a refetch destroys typed input in every *other* bucket.

  Repro: type carrier "Delhivery", reference "DL-9911" and a due date into bucket B, then send bucket A. A's success triggers `loadCandidates()`, the skeleton replaces the list, B unmounts and remounts with empty fields and `pieces` reset. This contradicts the commit's own stated guarantee that two buckets being filled at once do not share fields.

  Fix: keep the previous `data` on screen during a refetch and show the skeleton only when `data === null`, or track initial load separately from refetch.

  ### 3. `busyGroupId` is a single scalar (`:1299`)

  `const [busyGroupId, setBusyGroupId] = useState<string | null>(null)`, consumed at `:1108` as `busy={busyGroupId === key}`. `despatch` sets it on entry and clears it to `null` in `finally`.

  Repro: submit bucket A (busy=A, A disabled). Before A resolves, submit B — B's button is not disabled — so `busyGroupId` becomes B and **A re-enables while A's POST is still open**. When A resolves, `finally` sets `null`, re-enabling B while B's POST is still open. Either click re-fires `POST /api/vendor/transfers`. The unique index on `production_transfer_jobs.job_id` prevents a duplicate parcel, but the vendor sees a spurious "already been sent on a parcel" 409 for a send they never completed.

  Fix: a `Set` or record of busy keys instead of a scalar.

  ### 4. `pieces` never re-syncs when a bucket gains a job (`:932`)

  `const [pieces, setPieces] = useState(String(group.jobs.length))` runs once. The React key is `despatchGroupKey(group)` (`:828`, `:929`), the first job's id, which is stable when a job is *added*.

  Repro: a bucket shows 2 jobs and Pieces auto-fills 2. A third job for the same order passes QC; `loadCandidates` returns 3 jobs under the same first-job id, so the component is reused and Pieces still reads 2. **The vendor sends a docket claiming 2 pieces for a 3-job parcel.**

  Mirror case: if the new job sorts first under the server's `order by stage, id`, the key changes instead and the whole draft is silently discarded — same root cause as defect 2.

  ## Context

  Defects 1 and 2 compound: a queued stale read is more likely precisely when the operator is clicking repeatedly, which is also when they have the most unsaved input to lose.

  All four were confirmed by reading the file directly, not inferred.
