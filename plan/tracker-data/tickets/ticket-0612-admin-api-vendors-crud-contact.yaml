    text: |-
      ✅ **Completed**

      **Commit**: `a006079f` - feat(api): add admin vendors, contacts and capabilities endpoints

      **Files Changed**:
      - `packages/api/src/routes/admin/vendors.ts` (new) - vendors list/create/read/update plus nested contacts and capabilities routes
      - `packages/api/src/index.ts` - import + `app.route("/api/admin/vendors", adminVendorsApp)` alongside the other admin mounts
      - `packages/api/tests/routes/admin/vendors.test.ts` (new) - 37 tests

      **Summary**:
      - Gated `requireAuth + requireAdmin`, NOT `requireContentManager`. A content-manager is 403'd on all ten route/method combinations (parameterised test), vendor-role and customer are 403'd, unauthenticated is 401'd, super-admin passes.
      - List paginated from day one: `pageSize` defaults to 20 and clamps at 100, and the test asserts a LIMIT/offset are applied on a request with no page param — the unbounded collections/frames endpoints were not copied.
      - `amountOwed` comes from `lib/vendor-payables.sumPayable` over the page's unsettled jobs; no second summation was written. `openJobCount` is a SQL COUNT over jobs not in ('qc_passed','cancelled').
      - Capability filter serves assignment: `kind = 'print' AND (max_width_inches >= n OR max_height_inches >= n)`. Asserted by rendering the captured drizzle condition through `PgDialect`, so it is a claim about real SQL. It runs as its own query and feeds an id list back into the page query, so a vendor with two matching capabilities cannot be double-counted in `total` or the page.
      - Rates are read on `GET /:id` but never written — #613 owns rate writes because of the overlap check.

      **Verification**:
      - Command: `cd packages/api && bunx vitest run tests/routes/admin/vendors.test.ts`
      - Result: PASS (37 tests, 37 passing, 0 failing)
      - Command: `cd packages/api && DATABASE_URL=…@localhost:5440/poster_app_dev bunx vitest run tests/server.test.ts`
      - Result: 70 passing, 3 failing — all three pre-existing and unrelated (root endpoint missing `documentation`, `/api/health` returning `healthy` instead of `ok`). Both admin-route-mount assertions pass. Without the 5440 override the same file fails 21 tests on DB connectivity alone.
      - Command: `bunx tsc --noEmit -p tsconfig.json` — no errors in `src/routes/admin/vendors.ts`, `tests/routes/admin/vendors.test.ts` or `src/index.ts`.
      - Route tests mock `db`, which per #387 cannot catch a bad column reference, so every query in the router was additionally executed against the real dev DB on port 5440 via a throwaway script: all ten queries ran clean ("ALL QUERIES OK"); the vendor tables are empty, as expected for a directory nothing has seeded yet.
