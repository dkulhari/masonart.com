ticket_number: 612
title: Admin API - vendors CRUD, contacts, capabilities and role gating
description: |-
  ## Task
  `/api/admin/vendors` — list (paginated, filterable), create, get, update; nested contacts and capabilities routes. Mounted and role-gated.

  ## Context
  Feature: vendor-management. Phase 3 of 7. Depends on Phase 1 + 2.

  Follow `packages/api/src/routes/admin/shipping-config.ts` for file shape: `new Hono<{ Variables: AuthVariables }>()`, `zValidator` + zod schemas at the top, a doc comment explaining the departures from precedent. Mount in `src/index.ts` next to the other `app.route("/api/admin/...")` lines (around line 208-235) with a matching import at the top.

  Gating: `requireAuth, requireAdmin`. **NOT** `requireContentManager` — payables and vendor cost are admin data, and a content-manager must be refused. Test that explicitly; `tests/routes/admin/products-role-access.test.ts` is the existing pattern for a role-access test.

  Endpoints:
  - `GET /api/admin/vendors` — paginated list with name, status, capability summary, open job count, amount owed. Filter by `status` and by capability `kind`. **Paginate from day one**: the collections and frames list endpoints have no LIMIT today and that is a known defect, not a precedent to copy.
  - `POST /api/admin/vendors`, `GET /:id`, `PATCH /:id`
  - `GET|POST /:id/contacts`, `PATCH|DELETE /:id/contacts/:contactId`
  - `GET|POST /:id/capabilities`, `PATCH|DELETE /:id/capabilities/:capId`

  The list's `amountOwed` uses `sumPayable` / the same SQL derivation as `lib/vendor-payables.ts` — do not write a second summation.

  Capability filtering must support the assignment use case: "vendors that can print at least 36 inches" means `kind = 'print' AND (max_width_inches >= n OR max_height_inches >= n)`.
