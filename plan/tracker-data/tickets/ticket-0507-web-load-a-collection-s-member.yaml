    text: |-
      ✅ **Completed**

      **Commit**: `c22243a4` — feat(web): load a collection into the wishlist to reorder it

      **Files Changed**:
      - `packages/web/app/components/admin/LoadIntoWishlist.tsx` — new
      - `packages/web/app/routes/admin/collections/$id.tsx` — mounts it above the form, manual only
      - `packages/web/app/stores/wishlist.ts` — `replaceAll(productIds)`
      - `packages/web/app/lib/api.ts` — `wishlistApi.replace(productIds)`
      - `packages/web/tests/components/admin/LoadIntoWishlist.test.tsx` — 11 tests

      **`replaceAll` is deliberately NOT optimistic**, unlike `reorder`. A drag has to feel instant; a confirmed destructive action does not, and applying it locally before the server agreed would leave a staff member rearranging a list the server never accepted. It throws, and the caller stays on the page and says so rather than navigating away from a write that did not land. There is a test for exactly that (`surfaces a failure instead of navigating`).

      **The warning earns its place rather than being ceremony**
      - It names **how many** saved items will go. "This will clear your wishlist" without a number is a warning nobody can weigh.
      - It offers **Copy current ids** in the same dialog, so a mistake is recoverable by hand.
      - With an **empty wishlist it does not appear at all** — nothing to lose means nothing to weigh, and a confirm dialog over a no-op trains people to click through confirms.

      **Rule collections get nothing.** Their rule *is* their membership; there is no explicit list to load and no ordering to edit. The component returns null rather than rendering a disabled control, because a disabled button invites the question "why not?".

      **Verification**
      - Command: `cd packages/web && npx vitest run tests/components/admin/ tests/stores/ tests/components/wishlist/`
      - Result: PASS — 176 tests across 13 suites, 0 failing
      - Build: `npx tsc --noEmit -p tsconfig.json` — clean

      **Not yet usable end to end.** Loading works, but saving back still only offers "create new" — so right now this produces a *copy*, not an edit. #508 adds the overwrite destination, and #509 proves the loop. Flagging because the feature reads as complete from the admin form and is not.
