ticket_number: 709
title: One Tracking Store - GET /api/tracking reads the live shipment
description: |-
  ## Task
  `routes/tracking.ts` picks a shipment with `orderBy(desc(createdAt))` and no predicate. Once voided labels exist that is the same defect `getVendorJobLabelKey` had: a customer could be shown a dead AWB.

  Both handlers also load `shippingDetails: true` in their `with` clause and no longer need it — nothing reads it after this pass.

  ## Context
  Part of feature: order-dispatch-tracking
  Phase: Phase 3 — One tracking store

  Two handlers, not one: `POST /api/tracking/lookup` (~line 122) and `GET /api/tracking/:orderNumber` (~line 223). They have the same read and the same bug. Fix both, and pull the read into one local helper so a third handler cannot get it wrong.

  The `tracking: shipment ? {...} : null` shape STAYS. It was never the bug — the bug was that nothing wrote the table it reads. A fallback to `orders.shipping_details` would reintroduce the second source of truth this whole phase removes.

  Add `courierName` and `awbNumber` to the response: they are the fields a customer recognises. `carrier` is the aggregator we bought through and means nothing to them.

  The two tracking handlers are anti-enumeration surfaces — a wrong contact returns the same 404 as a missing order. Do not let the new fields change any status code.
