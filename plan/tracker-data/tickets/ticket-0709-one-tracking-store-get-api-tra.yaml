  - id: 3
    action: implement
    description: Pull the read into one helper with the predicate, and use it from both handlers
    file: packages/api/src/routes/tracking.ts
    status: pending
    code: |-
      /**
       * The shipment a customer is actually looking at.
       *
       * ONE helper, used by both handlers, because they had the same read and
       * therefore the same bug — a third handler copying a fourth version of it is
       * how this feature started.
       *
       * `voided_at IS NULL` is the whole point. Without it the newest row wins, and
       * once a label has been voided and re-bought the newest row can be the dead
       * one: the customer is shown an AWB the courier will not honour. The ordering
       * survives as a tiebreak, not as the choice.
       */
      async function liveShipmentFor(orderId: string) {
        const [shipment] = await db
          .select()
          .from(orderShipments)
          .where(and(eq(orderShipments.orderId, orderId), isNull(orderShipments.voidedAt)))
          .orderBy(desc(orderShipments.createdAt), desc(orderShipments.id))
          .limit(1);

        return shipment ?? null;
      }

      /**
       * The tracking block, or null.
       *
       * Null STAYS. It was never the bug — the bug was that nothing wrote the table
       * this reads. Falling back to `orders.shipping_details` would put the second
       * source of truth back that this phase exists to remove.
       */
      function trackingPayload(shipment: Awaited<ReturnType<typeof liveShipmentFor>>) {
        return shipment
          ? {
              // What we bought through, and what actually carries it. The customer
              // recognises the second one.
              carrier: shipment.carrier,
              courierName: shipment.courierName,
              awbNumber: shipment.awbNumber,
              trackingNumber: shipment.trackingNumber,
              trackingUrl: shipment.trackingUrl,
              status: shipment.status,
              shippedAt: shipment.shippedAt,
              estimatedDeliveryAt: shipment.estimatedDeliveryAt,
              deliveredAt: shipment.deliveredAt,
            }
          : null;
      }
