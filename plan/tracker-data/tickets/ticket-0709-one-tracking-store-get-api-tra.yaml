    code: |
      /**
       * A customer is never shown a dead AWB.
       *
       * The read had no predicate at all — newest row wins — which was harmless only
       * because voided labels did not exist. They do now, and `order_shipments` holds
       * both the voided label and its replacement.
       *
       * Both handlers are covered: the lookup and the by-order-number route share the
       * bug because they share the read.
       */

      import { describe, it, expect, vi, beforeEach } from 'vitest'
      import '../setup'

      const recorder = await vi.hoisted(async () =>
        (await import('../helpers/query-recorder')).createQueryRecorder({ rows: 'repeatLast' })
      )
      vi.mock('../../src/database', () => ({ db: recorder.db }))

      describe('the tracking page shows the LIVE shipment', () => {
        beforeEach(() => recorder.reset())

        it('filters on voided_at is null in the lookup handler', async () => {
          await app.request('/api/tracking/lookup', {
            method: 'POST',
            body: JSON.stringify({ orderNumber: 'CH-1', email: 'a@b.com' }),
          })

          const sql = recorder.queries.map((q) => q.sql).join('\n')
          expect(sql.toLowerCase()).toMatch(/voided_at"?\s+is\s+null/)
        })

        it('filters on voided_at is null in the by-order-number handler too', async () => {
          await app.request('/api/tracking/CH-1?email=a%40b.com')

          const sql = recorder.queries.map((q) => q.sql).join('\n')
          expect(sql.toLowerCase()).toMatch(/voided_at"?\s+is\s+null/)
        })

        it('stops loading orders.shipping_details — nothing reads it any more', async () => {
          await app.request('/api/tracking/CH-1?email=a%40b.com')

          const sql = recorder.queries.map((q) => q.sql).join('\n')
          expect(sql).not.toContain('shipping_details')
        })

        it('returns the courier and AWB the customer recognises', async () => {
          // `carrier` is the aggregator we bought through and means nothing to them.
          const res = await app.request('/api/tracking/CH-1?email=a%40b.com')
          const body = await res.json()

          expect(body.tracking).toHaveProperty('courierName')
          expect(body.tracking).toHaveProperty('awbNumber')
        })

        it('still answers null — not a fallback — when there is no shipment', async () => {
          // A fallback to orders.shipping_details would put the second source of
          // truth back, which is the whole defect this phase removes.
          recorder.queue([ORDER_ROW])
          recorder.queue([])

          const res = await app.request('/api/tracking/CH-1?email=a%40b.com')
          const body = await res.json()

          expect(body.tracking).toBeNull()
        })

        it('gives a wrong contact the same answer as a missing order', async () => {
          // The anti-enumeration property. New fields must not change it.
          const res = await app.request('/api/tracking/CH-1?email=wrong%40b.com')
          expect(res.status).toBe(404)
        })
      })
