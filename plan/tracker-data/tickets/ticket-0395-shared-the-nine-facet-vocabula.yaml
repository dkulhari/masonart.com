ticket_number: 395
title: Shared - the nine facet vocabularies as the single source of truth
description: |-
  ## Task

  Create `packages/shared/src/constants/facets.ts` holding every facet vocabulary from analysis §1.3, verbatim per the owner decision.

  | Facet | Count | Shape |
  |---|---|---|
  | Style | 12 | multi |
  | Subject | 17 | multi |
  | Orientation | 6 | single (maps onto the existing enum) |
  | Color | 14 → 13 after deduping Gray/Grey | multi, carries a hex swatch |
  | Vibe | 4 | multi |
  | Room | 12 | multi |
  | Aesthetic | 12 | multi |
  | Medium | 4 | multi |
  | Uniqueness | 1 | single |
  | Availability | 1 | single |

  Each entry is `{ id, label }` — a kebab-case id stored in the database, and a display label. Colours also carry `hex`.

  Export zod enums built from the ids so the API can validate against them, and a type per facet.

  ## Context

  Feature: product-metadata-facets

  **This is the point of the whole feature.** Options are hardcoded in `packages/web/app/components/product/ProductFilters.tsx:75-140` while the API validates them as free-text comma lists. Neither knows about the other.

  **Taxonomy problems to encode deliberately** (documented in the feature description):
  - Gray/Grey are the same colour listed twice. Keep one `gray`.
  - "Colorful Art" is both a Style and a Subject on their storefront. Keep in both.
  - Orientation ids stay `square` / `portrait` / `landscape` / `panoramic` / `round` / `set-of-2-3`; the display labels are Square / Vertical / Horizontal / Panoramic / Circle / Set of 2-3. Renaming the stored values would churn the size ladders, the seed and the grid E2E for a caption.

  **Follow the existing pattern** in `packages/shared/src/constants/` (see `sizes.ts`), and export from `constants/index.ts`.
