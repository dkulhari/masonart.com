    text: |-
      Built. New DeliveryEstimate.tsx — check glyph, "Arrives soon! Get it by <bold range> if you order today".

      No exported lead-time constant existed. The real figure lives as prose, duplicated in app/routes/shipping.tsx and app/routes/faq.tsx: production 2-4 business days, delivery a further 3-7. That gives DEFAULT_LEAD_TIME_DAYS = { min: 5, max: 11 }, exposed as an overridable prop rather than hardcoded dates. The window is computed from the current date with Sat/Sun skipping, reusing the same business-day algorithm ShippingSelector.tsx already uses. An injectable `now` prop keeps the tests deterministic.

      Date formatting uses en-US rather than the site's usual en-IN, because the reference format is month-first ("Aug 13") and en-IN renders "13 Aug". Worth a second look at integration — en-IN may be the more correct choice for our actual customers even though it diverges from the reference.

      Worth noting as a follow-up: the lead time being prose in two route files rather than one exported constant means it can drift. A shared constant would be the better home.

      Still needs a blind critic verdict before this is done.
