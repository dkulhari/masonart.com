      ✅ **Completed**

      **Commit**: `c4838860` - feat(api): ask which couriers serve a route, and pick one

      **Files Changed**:
      - `packages/api/src/services/shiprocket.ts` — `checkServiceability`, `selectCourier`, `selectCourierFor`, `ShiprocketNotServiceableError`, `CourierOption`
      - `packages/api/tests/services/shiprocket-serviceability.test.ts` — 18 tests

      **Verified against the live account through this code, not only fixtures:**

      ```
      mapped options: 1
        {"courierCompanyId":1,"courierName":"Blue Dart Air","ratePaise":15315,
         "etd":"Sep 03, 2026","supportsCod":true,"blocked":false}
      selected: Blue Dart Air @ 15315 paise
      COD selected: Blue Dart Air 20880 paise
      ```

      ## A finding the fixtures could not have produced

      **The COD flag changes the price.** Same route, same weight: ₹153.15 prepaid, ₹208.80 COD. So a quote is only valid for the COD status it was requested with. Quoting prepaid and then shipping COD books a rate we will not be charged, and the difference surfaces on the invoice rather than on the order. Written into the `ServiceabilityQuery` doc comment with the measured numbers, because **#728 will need to quote with the order's real status** rather than quoting once and reusing it.

      ## Design notes

      **Zero couriers is an answer, not a fault.** `ShiprocketNotServiceableError` / `SHIPROCKET_NOT_SERVICEABLE`, naming both pincodes so nobody reads logs to learn which leg failed. It must not share a bucket with "Shiprocket is unreachable" — different sentence, different status. #729 maps it to a 422-style refusal, never a 500.

      **The SLA fields are deliberately unused.** Each record carries ~50 fields including `SLA_Adherence`, `SLA_Breach`, `RTO w/o_Attempt` and `Attempt_Speed`. None tie-break. We have no evidence they mean what their names suggest, and a ranking on a misread field is worse than one on price alone because it *looks* considered. Ties keep the earlier entry, so the result is deterministic without a second invented criterion.

      **Money rounding is reused, not rewritten.** `toPaise` from `lib/razorpay.ts:410`. An odd home, but duplicating `Math.round(x * 100)` is how two paths drift a paisa apart, and `cost_paise` is an integer column. A test pins `153.15 → 15315` and `0.1 + 0.2 → 30`, since `153.15 * 100` is `15314.999…` in binary floating point and truncating would lose a paisa per shipment.

      **Written for one courier, because that is what exists.** The live account offers exactly one. Zero and one lead the tests; "several, pick the cheapest" follows. This is the constraint #735 inherits for its layout.

