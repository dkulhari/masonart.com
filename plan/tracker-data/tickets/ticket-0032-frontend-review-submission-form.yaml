ticket_number: 32
title: Frontend - Review Submission Form
description: |-
  Create review submission form with star rating selector following established form patterns.

  ## Implementation Details

  ### Components Location
  `packages/web/app/components/reviews/`

  ### Components to Create

  **ReviewForm.tsx**
  - Interactive star rating selector (1-5)
  - Title input (optional, max 255 chars)
  - Content textarea (required, min 10 chars, max 5000)
  - Character counter for content
  - Submit button with loading state
  - Success/error feedback

  **InteractiveStarRating.tsx**
  - NOT CREATED - Used existing StarRating component with interactive prop instead

  ### Form Validation
  - Client-side validation matching API schema
  - Real-time feedback on field errors
  - Disable submit until valid

  ### State Management
  - Form state with useState
  - Custom onSubmit handler for API integration
  - Success and error states

  ### User Flow
  1. User clicks "Write a Review" button
  2. Modal or inline form appears
  3. User selects rating, enters review
  4. On submit: loading state, API call
  5. Success: show confirmation, close form
  6. Error: show error message, keep form open

  ## Acceptance Criteria
  - [x] Interactive star rating with accessibility
  - [x] Form validation matching API requirements
  - [x] Loading and error states handled
  - [x] Requires authentication to submit (shows login prompt)
  - [x] Component tests passing (27 tests)
  - [ ] E2E tests for submission flow (deferred to ticket #35)
