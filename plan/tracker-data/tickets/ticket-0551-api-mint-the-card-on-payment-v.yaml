  - id: 3
    action: implement
    description: Mint on verification, keyed on the purchase order
    file: packages/api/src/routes/orders.ts
    status: pending
    code: |-
      // In the verify handler, after the order is marked paid:

      if (order.orderType === 'gift_card') {
        const purchase = order.giftCardPurchase as GiftCardPurchase

        // A future send date means this card must NOT be created yet: the
        // plaintext code is returned once and never stored, so a card minted
        // now could not be emailed in June. The sweep mints it on the day.
        const sendNow = !purchase.sendAt || new Date(purchase.sendAt) <= new Date()

        if (sendNow) {
          try {
            // No "does it already exist" read: that races with the retried
            // verification it is supposed to guard against. The UNIQUE
            // constraint on purchase_order_id decides, and a duplicate here
            // would be duplicated money.
            const { card, code } = await issueGiftCard({
              amountPaise: toPaise(order.total),
              purchaseOrderId: order.id,
              recipientEmail: purchase.recipientEmail,
              recipientName: purchase.recipientName,
              senderName: purchase.senderName,
              message: purchase.message,
              description: `Purchased on order ${order.orderNumber}`,
            })

            await sendGiftCardEmail(card, code)
            await db.update(giftCards).set({ sentAt: new Date() }).where(eq(giftCards.id, card.id))
            // `code` goes out of scope here: never persisted, never logged.
          } catch (error) {
            const message = error instanceof Error ? error.message : String(error)
            // Already minted by a previous verification. Nothing to do.
            if (!message.includes('gift_card_purchase_order_id')) throw error
          }
        }
      }
