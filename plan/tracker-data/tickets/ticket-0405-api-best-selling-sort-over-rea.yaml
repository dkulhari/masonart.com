      Done — commit 1ee4f99c.

      **Verification**
      - `bunx vitest run tests/routes/product-sort.test.ts` — RED at 9 failing / 3 passing, GREEN at 12 passing.
      - `bunx vitest run tests/routes/products.test.ts tests/routes/product-facet-filters.test.ts tests/routes/product-facets.test.ts` — 105 passing, no regression from the ORDER BY change.
      - Ran the full Best-selling query against the **real** dev database (route tests mock `db` and cannot catch a query that will not execute). Returns rows, all `units_sold = 0` with no orders seeded, falling through to the `featured_order` tie-break 0,1,2,3,4. Featured sort returns `[0,1,2,3,4]` where without NULLS LAST it would have led with nulls.

      **Deviation from the ticket's step 4:** the plan called for a pre-aggregated derived table joined into the list query. Shipped as a correlated scalar subquery in `packages/api/src/lib/product-sales.ts` instead. Both avoid the fan-out, but the subquery form adds no chain methods to the query builder, so the existing mocked-`db` test harness keeps working — a derived-table join would have needed `.innerJoin()`/`.as()` support added to every product route suite's mock. The upgrade path if list latency ever demands it is a materialised view, documented in the module header.

      **Sale definition:** `payment_status = 'paid'` AND `status NOT IN ('cancelled','refunded','failed')`. A denylist, so a status added to the enum later counts by default rather than being silently dropped from every seller's total.
