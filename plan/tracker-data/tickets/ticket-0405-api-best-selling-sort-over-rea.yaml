  - id: 4
    action: implement
    description: Build the pre-aggregated sales subquery and join it - NOT a second leftJoin on order_items
    file: packages/api/src/routes/products.ts
    status: pending
    code: |-
      /**
       * Units sold, pre-aggregated.
       *
       * A second leftJoin against order_items would fan out across the existing
       * reviews join: sum(quantity) would multiply by review count and
       * count(reviews.id) would multiply by order-item count. Both numbers
       * corrupt silently. Aggregate first, then join one row per product.
       *
       * Only paid/fulfilled orders count - a pending or cancelled order is not
       * a sale.
       */
      const salesAgg = db
        .select({
          productId: orderItems.productId,
          units: sql<number>`sum(${orderItems.quantity})::int`.as("units"),
        })
        .from(orderItems)
        .innerJoin(orders, eq(orders.id, orderItems.orderId))
        .where(
          and(
            eq(orders.paymentStatus, "paid"),
            inArray(orders.status, ["processing", "shipped", "delivered", "completed"])
          )
        )
        .groupBy(orderItems.productId)
        .as("sales_agg")
  - id: 5
    action: implement
    description: 'Wire the ORDER BY: pin first, then real units, then featuredOrder, then createdAt; NULLS LAST everywhere nullable'
    file: packages/api/src/routes/products.ts
    status: pending
    code: |-
      // replaces the single orderByDirection(orderByColumn) call
      const orderByClause =
        sortBy === "salesCount"
          ? [
              desc(products.isPopular),
              sql`${products.popularOrder} asc nulls last`,
              sql`coalesce(${salesAgg.units}, 0) desc`,
              sql`${products.featuredOrder} asc nulls last`,
              desc(products.createdAt),
            ]
          : sortBy === "featuredOrder"
            ? [
                sql`${products.featuredOrder} ${sql.raw(sortOrder)} nulls last`,
                desc(products.createdAt),
              ]
            : [orderByDirection(orderByColumn)];
      // NOTE: sortOrder is a zod enum of exactly 'asc'|'desc', so sql.raw here is
      // constrained to two literals - not a free-text path.
