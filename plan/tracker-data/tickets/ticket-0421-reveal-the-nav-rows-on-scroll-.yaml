    text: |-
      ✅ **Completed (rework)**

      **Commit**: `f274ce60` - fix(web): the revealed nav row pushes the toolbar down instead of covering it

      **Files Changed**:
      - `packages/web/app/hooks/useChromeOffset.ts` — new; measures the styles row and publishes `--chrome-offset` (compact bar + revealed row) on the document element, re-measuring on resize and clearing on unmount
      - `packages/web/app/components/layout/Header.tsx` — ref on the styles row, wired to the hook; the `HEADER_HEIGHT_CLASS` doc now says the toolbar offsets against the variable, not the constant alone
      - `packages/web/app/components/product/CollectionToolbar.tsx` — `sticky top-[var(--chrome-offset)]` + `transition-[top] duration-200 motion-reduce:transition-none`
      - `packages/web/app/styles/globals.css` — `--chrome-offset: 4rem` collapsed fallback, so the server-rendered pass has it before any client code runs
      - `packages/web/tests/hooks/useChromeOffset.test.ts` — new; 6 cases
      - `packages/web/tests/components/{layout/Header.structure,product/CollectionToolbar}.test.tsx` — 2 new guards

      **Summary**:
      The overlay trade-off from `56f23914` is gone. The revealed styles row now pushes the toolbar down by exactly its measured height, over the same 200ms, instead of passing over it and burying the Hide-filters button.

      Measured rather than hardcoded, deliberately: the row is `hidden md:block`, so its real height is zero on a narrow viewport and the offset has to fall back to the bar on its own; and a second magic number sitting next to `HEADER_HEIGHT_CLASS` is exactly the drift that put the toolbar 37px behind the header in #401. One number, measured at runtime, drives both.

      **Verification**:
      - Browser probe on `/posters` at 1440px, nav revealed: `--chrome-offset` = `101px` (64 bar + 37 row), `CollectionToolbar` computed `top: 101px`, filter rail `top: 181px`. Collapsed: back to `64px`.
      - Command: `bunx vitest run` (packages/web) → PASS, 1801 tests / 70 files, 0 failing.
      - Command: `bunx playwright test tests/e2e/header-reveal.spec.ts --project=chromium --no-deps` → PASS, 7/7. Two new cases: the toolbar's top edge is at or below the revealed row's bottom edge, and `document.elementFromPoint` at the Hide-filters button's centre returns the button itself (visible is not enough — something on top of it would still be "visible"), then clicks it and confirms the label flips to "Show filters".
      - Screenshots of both states reviewed: revealed shows the bar, the styles row, then Hide filters / count / Sort all clear of it; collapsed shows the compact bar with the toolbar directly beneath.
      - Regression sweep, `product-listing.spec.ts` + `collection-page-remainder.spec.ts`: 91 passed. Every failure is in `product-listing.spec.ts` and every one sampled is a stale selector from the #415/#416 redesign, not a layout regression — `aside button:has-text("Price: Low to High")` (sort left the sidebar for the toolbar pill in #416), `text=Active filters:`, `a[href^="/posters/"] h3`. `collection-page-remainder.spec.ts`, which is the spec written against this page's parity work, has no failures.
      - Typecheck: 23 errors, unchanged count, none in the files this ticket touched.

      **Left uncommitted on purpose**: `packages/web/app/routes/posters/index.tsx`. The filter rail there now reads `top-[calc(var(--chrome-offset)+5rem)]`, but the same file carries another session's in-flight #419 work (the toolbar moved to span both columns). That file belongs to #419's commit; committing it here would have dragged unfinished work in.
