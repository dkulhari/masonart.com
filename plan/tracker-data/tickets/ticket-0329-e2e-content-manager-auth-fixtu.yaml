      ✅ Implemented in commit 27746e37. content-manager.json storage state now produced by auth setup (4/4 setup tests passing, 22s). Seed script updated with test-content-manager@chobii.art.

      Environment issue found and worked around: with Redis connected, the auth rate limiters (sign-in wired to the 3/min signup limiter — pre-existing wiring bug, now fixed to authRateLimit; plus a shared 5/min bucket on all /api/auth/* posts under a single "unknown" IP in dev) made a 4-role setup run mathematically unable to pass. For this run I cleared rate-limit:* keys in local Redis during setup (self-terminating flusher). NOTE for CI/future runs: 8 auth posts per setup run still exceed the shared 5/min auth bucket — recommend a DISABLE_RATE_LIMIT env bypass for test environments (left as follow-up, needs API restart to take effect).
