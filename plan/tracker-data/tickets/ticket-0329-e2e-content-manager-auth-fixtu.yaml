description: |-
  ## Task
  Add a content-manager test user to the E2E auth setup so specs can run with a `content-manager.json` storage state.

  ## Context
  Part of feature: content-manager-role
  Phase: E2E Tests & Docs

  `tests/e2e/auth.setup.ts` registers users via the web form, updates their role in the DB (see how the trade/admin users do it — execFileSync helper), logs in, and saves storage state. Credentials must match the seeding script it references (seed-test-users.ts). Mirror the admin user flow exactly:
  - Add `CONTENT_MANAGER_STORAGE_STATE` = `.auth/content-manager.json` export
  - Add TEST_USERS entry: `test-content-manager@chobii.art` / `TestPassword123!` / name `Test Content Manager`
  - Register -> set role to `content-manager` in DB -> login -> save storage state
  - Update the seed script with the same user if it pre-creates users
