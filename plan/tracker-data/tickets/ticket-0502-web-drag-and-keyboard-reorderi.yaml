    text: |-
      ✅ **Completed**

      **Commit**: `00cc02e3` — feat(web): drag and keyboard reordering on the wishlist

      **Files Changed**:
      - `packages/web/app/components/wishlist/ReorderableWishlistGrid.tsx` — new
      - `packages/web/app/components/wishlist/WishlistContents.tsx` — renders it, maps indices
      - `packages/web/app/components/product/ProductGrid.tsx` — `GRID_CLASSES` exported
      - `packages/web/tests/components/wishlist/WishlistReorder.test.tsx` — 11 tests

      **The subtle bug this ticket had to avoid**

      Rendered indices and store indices **diverge**. `products` drops ids whose product has left the catalogue; `ids` keeps them. Reordering by rendered position would move the wrong entry — and the further down the list, the further off. `handleReorder` maps rendered position → id → store index before calling the store. Easy to write the naive version and never notice until a shopper has a dead save.

      **Decisions**
      - **`GRID_CLASSES` exported rather than copied.** Two grids that drift by a gap size look like a rendering bug, and this one sits on the same page shape as the collection grid.
      - **A single-item list shows no reorder controls at all.** Two disabled buttons on one card read as broken rather than as "nothing to do".
      - **Drop target is marked visibly** (`data-drop-target` + a ring). Dragging across thirty cards with no indicator is guesswork.
      - **Move buttons are named after the product** — `Move Alpha earlier`, not `Move item up`. The second tells a screen-reader user nothing about which item they are on.

      **Two test-harness notes**
      - ProductCard renders `<Link>`, which needs router context. Mocked to a plain anchor, following `ProductCard.test.tsx` — a real memory router would be testing TanStack rather than the reordering.
      - ProductCard renders the title **without a heading role**, so the order assertion reads the move-button `aria-label` instead. Worth knowing before writing `getByRole('heading')` against a product card.

      **Browser verification**, signed in as `test-admin`:

      ```
      items       : Digital Cosmos | Synthetic Nature | Neural Dreams
      after move  : Synthetic Nature | Digital Cosmos | Neural Dreams
      after reload: Synthetic Nature | Digital Cosmos | Neural Dreams
      PERSISTED   : true
      ```

      The first card's move-earlier and the last card's move-later render disabled, as intended.

      **Verification**
      - Command: `cd packages/web && npx vitest run tests/components/wishlist/ tests/stores/`
      - Result: PASS — 115 tests, 6 files, 0 failing
      - Build: `npx tsc --noEmit -p tsconfig.json` — clean

      **Not done here**: drag was verified through synthetic `fireEvent.dragStart/dragOver/drop` in tests, not by a real mouse drag in the browser. Playwright's `dragTo` would exercise the HTML5 path properly — worth adding in #504 rather than claiming it works from unit tests alone.
