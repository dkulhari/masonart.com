ticket_number: 502
title: Web - drag and keyboard reordering on /wishlist
description: |-
  ## Task

  Make the saved list rearrangeable.

  - **Drag**: each card is `draggable`, following the idiom already in `packages/web/app/components/admin/ProductForm.tsx` (~line 905) — `onDragStart` records the index, `onDragOver` preventDefaults, `onDrop` moves. No library.
  - **Keyboard**: every card ALSO carries move-up / move-down buttons with real labels (`Move <title> earlier`). This is not a nice-to-have — drag alone is unreachable by keyboard and invisible to a screen reader. The admin collections list (#472) made the same call.
  - A drop target needs a visible indicator, or a drag over thirty cards is guesswork.

  The list must stay in the store's order throughout: `WishlistContents.tsx` already renders `ids.map(...)`, which is the contract to preserve.

  ## Context

  Feature: wishlist-curation, Phase 2. Depends on the store action.

  One collision risk: another session is editing `ProductCard.tsx`, which this grid renders. Keep the changes in `WishlistContents.tsx` and commit by pathspec.

  Reordering is for the owner of the list. It works signed-out too — the store handles the persistence difference, this component should not know about it.
