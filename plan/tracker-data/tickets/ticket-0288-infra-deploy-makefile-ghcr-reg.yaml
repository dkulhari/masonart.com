ticket_number: 288
title: 'Infra: deploy/ Makefile + GHCR registry — dev machine builds/pushes, mini pulls'
description: |-
  Phase: Infra. Create deploy/Makefile driven entirely from the dev machine; the mini holds no repo, no builds, no .env.

  Targets: build/push/build-push (docker buildx linux/arm64 for api+web, tags latest + git short-sha; web build passes --build-arg VITE_API_URL='' in the RAW BUILDX path, not just compose); gen-compose (render compose + deploy/.env into deploy/rendered/docker-compose.yml via --format json, STRIP build: keys); deploy (scp rendered file → ~/masonart-docker-compose.yml, ssh 'pull && up -d' — every remote command prefixed with export PATH=/opt/homebrew/bin:...); rollback (deploy IMAGE_TAG=<sha>); migrate/seed/admin-promote (docker compose exec over ssh); first-boot; login-remote; build-push-deploy alias.

  Also: deploy/.env.example committed, deploy/.env + deploy/rendered/ gitignored; compose project name masonart (no collision with co-hosted customs-copilot); GHCR private packages masonart-api/masonart-web; two classic PATs (write:packages dev / read:packages mini); mini's ~/.docker/config.json must not use credsStore osxkeychain.

  Acceptance: make build-push-deploy from the dev machine brings the stack up on the mini pulling from GHCR; rendered file contains no build: keys and no unexpanded vars; rollback to a prior sha verified.
  Lessons: cc #88, #89, #90, #91, #92.
