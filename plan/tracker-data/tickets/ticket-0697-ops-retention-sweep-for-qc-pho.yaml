ticket_number: 697
title: Ops - retention sweep for QC photos, deleting R2 objects before their rows
description: |-
  ## Task
  Add a 400-day retention sweep for `production-qc/` objects in R2, modelled on `packages/api/src/queues/audit-retention.ts`. It must call `deleteByPrefix('production-qc/<jobId>/')` FIRST and delete the `production_job_photos` rows SECOND.

  ## Context
  Found by #685 during implementation. The design (§7) states the retention requirement but §13's ticket map has no row for it, so it was specified and never filed.

  Two problems, both live now that photo upload has shipped:

  1. **No sweep exists at all.** QC photographs accumulate in R2 forever.
  2. **`production_job_photos.job_id` is `ON DELETE CASCADE`.** Deleting a job removes the rows and leaves the R2 objects orphaned permanently, with nothing left pointing at them to find them by.

  ## Why 400 days specifically

  It matches `AUDIT_RETENTION_DEFAULT_DAYS` in `queues/audit-retention.ts`. The audit row (`production_job.qc_approved` / `.qc_rejected`) and the photograph it refers to must not outlive each other in opposite directions — a verdict whose evidence has expired is worse than neither, and evidence with no verdict is unattributable.

  Design constraints:
  - Objects FIRST, rows SECOND. The row is the only handle on the object; delete it first and the object is unreachable garbage.
  - Model on `queues/audit-retention.ts`: honours an env override, ignores nonsense rather than deleting everything, reports rows removed, logs-and-returns on failure rather than throwing.
  - `deleteByPrefix` already exists in `packages/api/src/lib/storage.ts`.
  - The cascade on `job_id` is correct for the ROWS — do not change the FK. The sweep is what handles the objects.
  - Test the ordering explicitly: a sweep that fails partway must not have deleted rows whose objects survive.
  - Register the worker the way `packages/api/src/background.ts` registers the audit retention worker, honouring `DISABLE_BACKGROUND_WORKERS`.
