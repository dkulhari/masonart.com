      ✅ **Completed**

      **Commit**: `d44dcb2f` — feat(api): sweep QC photographs at 400 days, objects before rows

      **Files Changed**:
      - `packages/api/src/queues/qc-photo-retention.ts` (new) — the sweep, modelled on `queues/audit-retention.ts`
      - `packages/api/tests/services/qc-photo-retention.test.ts` (new) — 18 tests
      - `packages/api/src/lib/storage.ts` — `StoragePaths.productionQcJobPrefix(jobId)`
      - `packages/api/tests/lib/storage.test.ts` — 5 tests for the prefix
      - `packages/api/src/background.ts` — registers the worker behind `DISABLE_BACKGROUND_WORKERS`
      - `packages/api/tests/background-workers.test.ts` — 2 tests (started, stopped, and not started when disabled)
      - `.env.example` — documents `QC_PHOTO_RETENTION_DAYS`
      - `packages/api/src/lib/vendor-scope.ts`, `src/database/schema/production-jobs.ts` — the comments that said the sweep did not exist yet now name it

      **Summary**

      The ordering is the ticket. `object_key` is the only handle on the R2 object, so `deleteByPrefix('production-qc/<jobId>/')` runs FIRST and the row `DELETE` runs SECOND. If the prefix delete throws, that job's rows are **left in place** and it is retried on the next pass — a job that keeps its rows is recoverable, a job that lost them is orphaned forever. The `job_id` FK is untouched: the cascade is correct for the rows.

      Three decisions worth recording:

      1. **Eligibility is per JOB, not per row**, because the prefix is. A job qualifies only once `max(uploaded_at)` has aged out. Sweeping a job with one expired shot and a recent reshoot would destroy the live evidence beside the expired attempt — exactly what `superseded_at` exists to preserve. Hence `GROUP BY job_id HAVING max(uploaded_at) < cutoff`.
      2. **No `SET LOCAL chobii.audit_purge`.** That opt-in is the audit log's immutability trigger talking; `production_job_photos` has no such trigger, so copying it would be cargo cult.
      3. **No transaction**, unlike the sibling. The R2 calls are network round trips over an unbounded object list and would pin a pooled connection for their duration. Per-job sequencing in code is the only atomicity that matters here.

      400 days is `AUDIT_RETENTION_DEFAULT_DAYS`, asserted equal in the suite rather than written down twice — if they drift, one expires first and the survivor is worthless.

      **Verification**:
      - Command: `npx vitest run tests/services/qc-photo-retention.test.ts tests/background-workers.test.ts tests/lib/storage.test.ts tests/services/audit-retention.test.ts` (from `packages/api`)
      - Result: PASS — 4 files, **162 tests passing**, 0 failing
      - Command: `npx tsc --noEmit && npx tsc -p tsconfig.test.json --noEmit` → 0 errors in both

      **Non-vacuity — 11 mutations, each applied alone, each red, each reverted**:

      | # | Mutation | Tests failed |
      |---|---|---|
      | M1 | rows deleted BEFORE objects | 5 |
      | M2 | object-delete failure no longer spares the rows | 3 |
      | M3 | default window 400 → 300 | 2 |
      | M4 | nonsense env value honoured instead of ignored | 1 |
      | M5 | job eligible on its FIRST photo ageing out (`max` → `min`) | 1 |
      | M6 | row DELETE no longer scoped to the job | 3 |
      | M7 | sweep throws instead of logging and returning | 2 |
      | M8 | worker no longer sweeps at startup | 1 |
      | M9 | worker not registered in `background.ts` | 2 |
      | M10 | job prefix loses its trailing slash | 2 |
      | M11 | job prefix skips sanitisation | 1 |

      Sources byte-compared against a pre-mutation backup afterwards; suite re-run green.

