title: Tests - Full AI Generator Feature Test Suite
description: |-
  ## Overview
  Comprehensive test coverage for all Full AI Generator feature additions.

  ## Test Categories

  ### Unit Tests (Vitest)
  1. **Style Presets Tests**
     - All 15 presets have valid configuration
     - Prompt builders work for new presets
     - Model parameters within valid ranges

  2. **Color Palette Tests**
     - CRUD operations
     - Hex color validation
     - Palette limit enforcement

  3. **Reference Image Tests**
     - Upload validation (size, format)
     - Weight parameter handling
     - Cost adjustment calculation

  4. **Prompt Suggestions Tests**
     - Suggestion retrieval per style
     - Cache behavior
     - Filtering/completion logic

  5. **Upscaling Tests**
     - Cost calculation for multipliers
     - Provider integration
     - Refund on failure

  ### E2E Tests (Playwright)
  1. **Full Generation Flow with New Features**
     - Select new style preset
     - Create custom color palette
     - Use prompt suggestion
     - Complete generation

  2. **Reference Image Flow**
     - Upload reference image
     - Adjust weight
     - Generate with reference

  3. **Upscaling Flow**
     - Generate image
     - Select and upscale
     - Download high-res

  ## Files to Create/Modify
  - packages/api/tests/routes/ai-full.test.ts (new)
  - packages/api/tests/ai/style-presets.test.ts (extend)
  - packages/web/tests/e2e/ai-generator-full.spec.ts (new)

  ## Acceptance Criteria
  - [ ] >90% code coverage on new features
  - [ ] All edge cases covered
  - [ ] E2E tests run in CI
  - [ ] No flaky tests
  - [ ] Test documentation updated
