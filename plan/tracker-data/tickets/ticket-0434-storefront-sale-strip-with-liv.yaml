    timestamp: '2026-08-06T05:58:37.743Z'
    text: |-
      Landed in 9a25d337 on feat/mesonart-design-parity.

      - New `packages/web/app/components/layout/SaleStrip.tsx` + 21 tests at `packages/web/tests/components/layout/SaleStrip.test.tsx`.
      - Mounted above `AnnouncementBar` in `__root.tsx`, behind the same `!isAdminRoute` gate. It self-suppresses when no promotion is active, so the mount needs no second condition.
      - Reads `GET /api/promotions/active` (#432) on mount with `credentials: 'include'` — the countdown cookie rides on it, and without the cookie every load would re-mint the window. Absolute `${getApiUrl()}` base: there is no Vite `/api` proxy here.
      - Exports `ActivePromotion` and `formatRemaining`. `formatRemaining` returns `null` at and below zero — that single guard is what keeps a negative clock off the screen. Hours accumulate past 24 rather than wrapping, since `countdownMode: 'real'` can end days out and wrapping only ever understates.
      - `promotion` prop overrides the lookup (an explicit `null` means "none running, do not ask"), matching `JoinGalleryModal`'s shape.

      Two deliberate calls worth recording:

      1. The `ActivePromotion` interface is declared here rather than imported from `components/promo/JoinGalleryModal`. Same five fields. That file was uncommitted and under active edit by another session at the time, and a promotion payload is a contract rather than a modal's property — worth pulling into a shared module when the rest of the §7 surfaces land and there are four copies instead of two.
      2. The lookup runs on mount, not in the root loader, so on a cold load the strip appears a beat after first paint and pushes the page down. Design §6's "no hydration flicker" is about the deadline being resolved server-side, which it is. Moving the fetch into `__root`'s `beforeLoad` would remove the shift, at the cost of a promotion request on every SSR response including the majority with no sale to show. Left as-is and noted in the component.

      `AnnouncementBar`'s omission comment is rewritten, not deleted. The constraint moved rather than expired: the bar has no promotion to read, so it still carries no promotional copy; only the "there is no promotion entity" justification is gone.

      Parity analysis §3.1 row 1 flipped from blocked to done, and the §6 summary row for global chrome updated with it — it named the sale strip as the one outstanding item, which is now the floating offer tab.
