ticket_number: 393
title: Collection - facet counts in the sidebar and a star row on the card
description: |-
  ## Task

  Consume what the API ticket added.

  **Sidebar**: render each facet option's count beside its label, matching mesonart's "Wabi-Sabi Art (788)". An option with a count of 0 under the current filters should be visibly disabled rather than hidden — hiding it makes the list jump as the shopper filters.

  **Card**: a star row plus review count, below the image. Per analysis §1.3.6 mesonart puts it left with the wishlist heart right; the heart is already on the card from feature 1, so this completes that row.

  ## Context

  Feature: collection-page-parity
  Blocked by the API ticket.

  **Files**: `packages/web/app/components/product/ProductFilters.tsx`, `packages/web/app/components/product/ProductCard.tsx`

  **Constraints**
  - **Real data only.** A product with no reviews renders NO star row — not five empty stars, not "0.0". The analysis is explicit that fabricated social proof is a dark pattern.
  - Stars use the `rating` token (`fill-rating text-rating`). `fill-yellow-400` fails the storefront token guard.
  - **The grid-alignment contract.** The star row goes inside the existing content block. No `min-h-`, no `line-clamp-` — `ProductCard.tokens.test.ts` asserts their absence and the E2E asserts equal row heights.
  - Re-run `product-grid-alignment.spec.ts` after touching the card. Note: run it with `--no-deps`; the `auth.setup.ts` projects fail for unrelated pre-existing reasons.
