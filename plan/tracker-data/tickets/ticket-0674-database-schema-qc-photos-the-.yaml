    text: |-
      ✅ **Completed**

      **Commit**: `1f68d31b` — feat(database): add production_job_photos, the QC shot list and its storage keys
      (on `feature/production-pipeline-design`, directly on top of #673's `83ee1c8f`)

      **Files Changed**
      - `packages/api/src/database/schema/production-jobs.ts` — `productionJobPhotos` table, relations, types
      - `packages/api/src/database/migrations/0024_production_job_photos.sql` — new, with the design header
      - `packages/api/src/database/migrations/meta/0024_snapshot.json`, `meta/_journal.json` — idx 24, snapshots unbroken 0000–0024
      - `packages/api/src/lib/storage.ts` — `StoragePaths.productionQcPhoto(jobId, slot, filename)`
      - `packages/shared/src/schemas/production-qc.ts` — new: `QC_SHOT_LIST`, `QC_SHOT_SLOTS`, `QC_STAGES`, `qcSlotSchema`, `qcStageSchema`, `qcShotsForStage`, `requiredQcSlots`
      - `packages/shared/src/schemas/index.ts`, `packages/shared/src/index.ts` — barrel wiring (the entry barrel enumerates modules, so schemas/index.ts alone leaves it unreachable)
      - `packages/api/src/database/schema/index.ts` — barrel comment
      - tests: `tests/database/production-job-photos.test.ts` (new), `tests/database/production-job-photos-live-slot.test.ts` (new), `tests/lib/storage.test.ts`, `packages/shared/tests/schemas/production-qc.test.ts` (new)

      **Summary**

      Data layer only — no routes, no upload handler (#685).

      `production_job_photos`: `job_id` (cascade), `slot` text, `object_key`, `content_type`, `size_bytes`, `uploaded_by` (set null), `uploaded_at`, `superseded_at`, `review_id` (set null). Partial unique index `production_job_photos_live_slot_unique` on `(job_id, slot) WHERE superseded_at IS NULL`, plus `production_job_photos_job_id_idx`. No `updated_at`, no CHECK.

      Shot list — print: `print_full`, `print_colour_reference`, `print_raking_light`, `print_detail` (optional). Frame: `frame_front`, `frame_raking_light`, four separate corner slots, `frame_back`, `frame_detail` (optional). Each corner is its own slot because one slot holds one live photo — a single "corners" entry would be one photograph asserting four mitre joins are clean.

      Storage: `production-qc/<jobId>/<slot>/<filename>` via the existing `sanitizeKeySegment`, following the `reviewMedia` precedent. All three segments sanitised — `slot` too, since the column is text and a value that skipped `qcSlotSchema` can reach the builder.

      Constraints held: `slot` is text not a pgEnum; no enum literal anywhere in 0024; object KEY never a URL (and no `*url*` column exists to tempt one); no CHECK constraints; applied with `db:migrate` against :5440, never `db:push`.

      **Verification**

      - Command: `bunx vitest run tests/database/production-job-photos.test.ts tests/database/production-job-photos-live-slot.test.ts tests/lib/storage.test.ts tests/database/migration-enum-literals.test.ts tests/database/raw-sql-objects.test.ts` (packages/api)
      - Result: PASS — `Test Files 5 passed (5)` / `Tests 152 passed (152)`
      - Command: `bunx vitest run tests/schemas/production-qc.test.ts` (packages/shared)
      - Result: PASS — `Test Files 1 passed (1)` / `Tests 18 passed (18)`
      - Command: `bun run typecheck` (the pre-commit gate, all 3 packages)
      - Result: PASS — `Tasks: 4 successful, 4 total`

      170 tests across the six touched files; 51 of them new.

      **Live database evidence** (:5440, after `db:migrate`)

      ```
      CREATE UNIQUE INDEX production_job_photos_live_slot_unique
        ON public.production_job_photos USING btree (job_id, slot)
        WHERE (superseded_at IS NULL)
      FK job_id     -> production_jobs(id)        ON DELETE CASCADE
      FK uploaded_by-> "user"(id)                 ON DELETE SET NULL
      FK review_id  -> production_job_reviews(id) ON DELETE SET NULL
      ```

      **The live-slot suite is not vacuous.** The same insert sequence was re-run against the index dropped and against a blanket (non-partial) unique, both inside rolled-back transactions:

      ```
      [no-index]        second-live ACCEPTED   | reshoot ACCEPTED
      [blanket-unique]  second-live REFUSED    | reshoot REFUSED
      [shipped partial] second-live REFUSED    | reshoot ACCEPTED, 2 history rows kept
      ```

      Only the shipped predicate passes both assertions — dropping the index breaks "refuses a second live photo", and making it non-partial breaks "allows a reshoot once superseded".

      **Note for #685**: `it.runIf(reachable)` cannot be used in live-DB suites here — the modifier is evaluated at collection time, before `beforeAll` connects, so every test reports as skipped against a perfectly healthy database. The repo's guard is an `if (!reachable) return;` inside the body, with one `it` calling `assertLiveDbReachable`. Caught this suite passing 5-skipped-of-6 before it was fixed.
