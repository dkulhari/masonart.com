    text: |-
      Deviation found in review, corrected in #675.

      `production_job_photos.uploaded_at` and `.superseded_at` landed as bare `timestamp`. The feature design states every NEW column in production-pipeline is `timestamptz` — the point being that `admin_audit_log.created_at` is timestamptz while `production_jobs`' five existing date columns are not, so a year later a job's dates and the audit row proving who set them are not comparable across a server timezone change. Adding two more bare columns recreates exactly the debt the design named.

      Not the implementer's error: the constraint was written into #675's ticket text and omitted from this one. The table was new and empty, so the conversion is free.

      Fixed by `ALTER COLUMN ... TYPE timestamptz` in migration 0025 (#675), with the drizzle DSL updated to match.

      Everything else verified against the ticket's constraints and passing: `slot` is `text` rather than a pgEnum (an ESM value import from @chobii/shared inside schema/ breaks drizzle-kit generate); the column is `object_key`, not a URL, so it can be re-signed under the scope allow-list; the partial unique index predicate is `WHERE superseded_at IS NULL`, touching no enum; FKs are cascade on job_id, set null on uploaded_by and review_id. The migration-enum-literals guard added by #673 is still green.
