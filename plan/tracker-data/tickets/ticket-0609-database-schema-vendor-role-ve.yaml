    text: |-
      Done in dfc43083.

      Deviation on step 8, worth carrying forward: `bun run db:generate` is not usable in this repo right now. The drizzle snapshot history in `src/database/migrations/meta/` stops at `0013_snapshot.json` while migrations run to 0018 — 0014-0018 were hand-written SQL with manual `_journal.json` entries and no snapshots. drizzle-kit therefore diffs current schema against the 0013 snapshot and wants to replay five migrations of unrelated drift, opening with an interactive "Is frame_category created or renamed from frame_type?" prompt. Answering that wrong on a dev database shared with a dozen concurrent sessions is a rename-or-drop coin flip.

      Instead: generated the full schema into a throwaway out-dir with empty history (no prior snapshot means no rename prompts), then assembled `0019_vendor_management_phase_1.sql` from drizzle's own DDL for just the nine new tables, five new enums, 17 FKs, 19 indexes and the `ALTER TYPE user_role ADD VALUE 'vendor'`. Same authoring style as 0014-0018. Audited before applying: no DROP, no TRUNCATE, no ALTER COLUMN, and every ADD CONSTRAINT targets a table created in the same file.

      Applied against 5440 (5433 is surveytrack-postgres, a different project). Verified after: all nine tables present, `user_role` reads customer,trade,content-manager,admin,super-admin,vendor with vendor last, `vendor_users_user_id_unique` present, `__drizzle_migrations` at 20. Server is PG 16.14, so ADD VALUE inside drizzle's transaction is fine — and nothing in 0019 uses the literal, which is what actually bit 0015 (see 0018's note).

      Also updated the pre-existing `tests/schema/user-role.test.ts`, which asserted exactly five roles and would otherwise have failed step 11.

      Tests: `tests/schema/` 18 passing across 6 files; `packages/web tests/lib/admin-nav-vendor-role.test.ts` 2 passing; `bun run typecheck` clean.

      Follow-up someone should own: the meta/ snapshot gap is a live trap for every future schema ticket in this feature. Phase 2 will hit the same prompt.
