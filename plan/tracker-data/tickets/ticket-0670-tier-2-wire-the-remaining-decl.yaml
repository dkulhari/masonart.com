comments:
  - author: mcp-client
    timestamp: '2026-08-31T01:46:36.628Z'
    text: |-
      Note from the production-pipeline run (feature complete, PR #3).

      **Recommendation: settle the waiver list as its own commit first, then wire the rest.** The "declare or waive explicitly" framing is right; splitting the decision from six route edits makes the decision reviewable on its own.

      **Verified at head — the twelve actions still declared with no emitter anywhere in `packages/api/src`:**

      `order.shipment_marked_delivered`, `wallet.adjusted`, `vendor.payable_settled`, `user.status_changed`, `vendor.invited`, `vendor.user_created`, `product_variant.updated`, `product_variant.deleted`, `vendor_rate.updated`, `review.deleted`, `review_media.deleted`, `ai_generation.moderated`.

      That set maps onto #668 (2), #669 (2), this ticket (6), and the waiver list (2), with nothing unaccounted for.

      **One waiver decided by evidence — and my first read of it was wrong, so the reasoning matters more than the conclusion.**

      `wallet.adjusted` cannot be wired today, but not because nothing writes wallet transactions — `services/wallet.ts` writes them in five places. The actual reason: **`adjustWalletBalance` is defined at `services/wallet.ts:652` and called from nowhere.** There is no admin wallet route mounted at all — `index.ts` mounts `/api/wallet` (customer top-up: `/topup`, `/topup/verify`) and `/api/admin/wallet-config` (config only, and `wallet_config.updated` IS wired). The admin adjustment surface the action names does not exist yet.

      So waive it **with that reason recorded**, and the waiver expires the day an admin adjust route lands. A bare "waived" entry would read as "we decided not to audit balance adjustments", which is the opposite of true.

      Worth noting this is the third "exported, never called" case this run turned up. `guardFor` in `lib/production-transitions.ts` sat exported with zero call sites for three phases while three guarded edges went unchecked — a CRITICAL. #693's `labelIssued` chain passed a value that rendered identically to passing nothing. A declared-but-dead *action* is the same shape one layer up, which is what makes #671 worth doing.

      **Everything else in this ticket's scope has a mutating route to emit from** — `products.ts` (7), `reviews.ts` (5), `ai-moderation.ts` (3), `vendor-rates.ts` (3). None of them is blocked; they are wiring work.

      **`user.status_changed`** is the other waiver candidate and I did not verify it. `customers.ts` has 1 mutating route and `user.role_changed` is already wired there, so check whether a status-change path actually exists before waiving it — it may be wiring work rather than a waiver.
