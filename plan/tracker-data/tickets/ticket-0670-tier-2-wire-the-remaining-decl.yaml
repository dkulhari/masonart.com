      - `packages/api/tests/routes/admin/catalogue-audit.test.ts` (+10 cases), `content-config-audit.test.ts` (new, 14 cases), `vendors.test.ts` (2 fixtures updated for the new pre-write read).

      **Three things the wiring had to change to have a `before` at all**
      1. `products.ts` variant PATCH and DELETE selected only `{id, productId}`. Widened to the whole row — the read is now both the existence check and the delta's before.
      2. `collections.ts` PUT `/:id/products` never read the membership it replaces. The DELETE inside the transaction now RETURNs the cleared rows, so the previous list is captured in the same statement that removes it rather than by a racing SELECT beside it.
      3. `collections.ts` PUT `/discover-order` overwrites `discoverOrder` in place. The validation SELECT now carries it, so the previous rail order survives the write.

      **Two judgement calls worth review**
      - **The discover-rail reorder emits ONE row, `entityId: null`.** It is a single decision about an ordering; N rows would read as N edits in the timeline. Before/after are the id arrays.
      - **The bulk moderation routes re-read statuses after the call and emit a row only per generation that actually moved.** `bulkApprove`/`bulkReject` swallow per-id failures and return only totals, so emitting per requested id would assert a moderation for every id in the failed count.

      **Vendors decision**: declared and wired `vendor.created` + `vendor.updated`; `vendor.archived` deliberately not added (no such status in `vendor_status`). Reasoning in the preceding comment.

      **Verification**
