    text: |-
      **Decision on `admin/vendors.ts`: declared and wired — `vendor.created` and `vendor.updated`, but NOT `vendor.archived`.**

      Not a waiver. The two actions are in `AUDIT_ACTIONS` under `config` and emitted from `POST /api/admin/vendors` and `PATCH /api/admin/vendors/:id` in the same commit, so #671's declared-but-dead guard stays satisfied.

      **Why not the floor row.** `admin.request` answers who and when, and for the PATCH it even answers which vendor (the id is in the path). What it cannot answer is *which way*. `status` is the field that matters: suspending a supplier stops work being routed to them, and "someone PATCHed vendor X" reads identically whether they suspended it or corrected a postcode.

      **Why `vendor.archived` is wrong and was not added.** `vendorStatusEnum` is `['active', 'inactive', 'suspended']` (`database/schema/vendors.ts:26`). Nothing archives. An action naming a state the column cannot hold would be dead the day it was declared — exactly the defect this tier of tickets exists to remove. Deactivating or suspending a supplier IS an update, and the delta (`{status: active} → {status: suspended}`) is what says which. The registry comment records this so the next reader does not re-add it.

      **Scope held to the vendor record itself.** The seven contact and capability routes (`:531`–`:711`) keep the floor row. They are directory metadata with no money and no privilege on them, they carry the vendor id in the path, and their consequential use — assigning a job to a vendor with a given capability — is already audited as `production_job.assigned`. If that judgement turns out wrong, the fix is `vendor_contact.*` / `vendor_capability.*`, not stretching `vendor.updated` to cover child rows.

      **`created_by` was considered as an alternative and is not sufficient.** It attributes the create but not the edit (there is no `updated_by`), and it is not searchable alongside the rate card. `vendor_rate.updated` is now emitted from `routes/admin/vendor-rates.ts`; a supplier appearing and a supplier being priced are one story, and reading it should not require joining two tables.
