ticket_number: 670
title: Tier 2 - wire the remaining declared-but-dead catalogue, config and content actions
description: |-
  ## Task

  Seven more actions are declared in `AUDIT_ACTIONS` and emitted by nothing, and every one of them has a live route. #644 wired part of each file and the rest was never finished — `collections.ts` emits `collection.deleted` but not `collection.updated`, `promotions.ts` emits enabled/disabled/deleted but not `created`, `products.ts` emits the three product actions but neither variant action.

  Dead action, and the route that should emit it:

  - `collection.updated` — `admin/collections.ts:110`, `:175`, `:335` (PUT, PUT, PATCH)
  - `promotion.created` — `admin/promotions.ts:258` (POST)
  - `product_variant.updated`, `product_variant.deleted` — `admin/products.ts:1068` (DELETE) plus the variant write path
  - `vendor_rate.updated` — `admin/vendor-rates.ts:356`, `:475`, `:565`. Category `config`, but this is the rate card that prices every production job, so an unlogged edit changes what a supplier is owed.
  - `review.deleted`, `review_media.deleted` — `admin/reviews.ts:538`, `:595`. Both hard-delete rows; the deleted content is unrecoverable, so the audit row is the only surviving description of what was removed.
  - `ai_generation.moderated` — `admin/ai-moderation.ts:310`, `:369`, `:395`

  `admin/vendors.ts` mutates on nine routes (`:380` through `:656`) and has no declared action at all. Either add `vendor.created` / `vendor.updated` / `vendor.archived` to the registry, or record in the ticket that the floor row is judged sufficient for the vendor record itself — one of those, not silence.

  ## Context

  Same pattern throughout: `recordAudit` after the write succeeds, `diffRecords(before, after)` where a prior row is in hand, narrow before/after. `routes/admin/frames.ts:233` is the reference call site.

  For `review.deleted` the delta is inverted from the usual shape — put the removed row's identifying fields in `before` and leave `after` null. A deletion whose audit row says only "deleted" cannot answer whether the right review was removed.

  `ai_generation.moderated` overlaps with the `ai_generation_reviews` table, which carries its own actor column. Duplicate it anyway; the `admin_audit_log` header states that duplication is deliberate so one table answers "who did what", always.

  Extend `packages/api/tests/routes/admin/catalogue-audit.test.ts` rather than starting a new file for the catalogue half; content and config actions can share a new `content-config-audit.test.ts`.
