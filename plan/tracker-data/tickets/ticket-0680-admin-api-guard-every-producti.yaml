    text: |-
      ✅ **Completed**

      **Commit**: `8ca07d63` - feat(api): guard every production job transition and audit it

      **Files Changed**:
      - `packages/api/src/routes/admin/production-jobs.ts` — PATCH /:jobId and POST /:jobId/assign routed through `assertTransition`, wrapped in transactions, audited
      - `packages/api/tests/routes/admin/production-jobs.test.ts` — the `draft -> sent` "this 200 is deliberate" placeholder rewritten into the refusal suite (35 tests → 76)

      **Summary**:
      - **PATCH /:jobId** now SELECTs FOR UPDATE inside a transaction (so `before` exists for `diffRecords`, the 404 comes from the read rather than an empty `returning()`, and `from` is known), calls `assertTransition(from, to, 'admin')`, then writes with the predicate REPEATED in the WHERE (`eq(status, from)`, `isNull(settlementId)`); a row-count mismatch throws and rolls back with a 409 `CONCURRENT_MODIFICATION`.
      - **POST /:jobId/assign** gained the from-status guard it never had — it did not read `job.status` at all, so a cancelled/dispatched/qc_passed job was freely assignable — and its untransacted `db.update` now shares a transaction with its audit write. Optional compare-and-swap `expectedVendorId` answers a mismatch with `currentVendorId`/`currentStatus`.
      - **Refusals are 409** carrying `{ error, code, from, to, allowed }`. 422 stays what it already meant in this router (`missingOrderItemIds`, `unpriced`).
      - **`updateJobSchema.status`** is the enum minus `qc_passed`/`qc_failed`, derived by subtraction so a new status is patchable by default.
      - **A settled job is frozen** to both routes — payables are derived with no stored total, and `settlement_id IS NULL` in the CAS predicate would match nothing anyway.
      - **Audit**: `transitioned` / `assigned` / `reassigned` / `amount_overridden` share the tx; `transition_refused` (outcome `failure`) is written OUTSIDE it, so it survives the rollback it records. One row per act — `draft -> assigned` emits `assigned` alone, and the `assigned -> assigned` self-edge emits no `transitioned` row.
      - **Pricing bug fixed**: `priceItems` added one rate per item ROW, so a line of quantity 3 was priced as one. It now reads `order_items.quantity` and expands to one payable entry per piece, still summed in integer paise by `lib/vendor-payables`.
      - Retired the false header claim ("PATCH accepts any status without a transition guard … a missing guard is the design") and the in-body design comment.

      No `POST /:jobId/transition` was added. `POST /:jobId/reviews` (#681) and the consolidator/readiness/orderId work (#682) were left untouched.

      **Verification**:
      - Command: `npx vitest run tests/routes/admin/production-jobs.test.ts` (in `packages/api`)
      - Result: PASS (76 tests passing, up from 35)
      - Also PASS: `tests/lib/production-transitions.test.ts`, `tests/lib/audit-record.test.ts`, `tests/routes/vendor/jobs.test.ts`, `tests/database/audit-log-schema.test.ts` — 180 passing across the five
      - Build: pre-commit `turbo run typecheck` green (api src + api tests + shared + web)

      **Property coverage**: every legal admin edge (9, table-driven) succeeds with exactly one audit row whose `before`/`after` name `from`/`to`; every illegal edge (11, table-driven) is 409, writes zero `production_jobs` rows, rolls back, and leaves exactly one `outcome: 'failure'` row with `inTx === false`; the six illegal assign from-statuses are refused; a settled job refuses both a move and an amount edit; quantity 3 prices as 300.00 and a 2+3 mixed basket as 482.00.

      **Follow-on, not in scope**: `packages/web/app/routes/admin/production/$id.tsx` renders its "Move to status" `<select>` from the whole enum and PATCHes it, so it now offers moves the API refuses (qc_passed/qc_failed 400, illegal edges 409 — both surface in the existing error banner rather than crashing). Rebuilding that select from `nextStatuses` is Phase 5's "the queue reshaped".
