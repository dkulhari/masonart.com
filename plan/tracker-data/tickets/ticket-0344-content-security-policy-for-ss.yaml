    text: |-
      ✅ **Completed — CSP is now enforced (config-only; lands on next deploy)**

      **Commit**: `c124c13d` — feat(security): enforce Content-Security-Policy on SSR responses

      **Files Changed**:
      - `docker/docker-compose.prod.yml` — `Content-Security-Policy-Report-Only` → `Content-Security-Policy`; added the three missing sources; added `frame-ancestors 'none'`; `customFrameOptionsValue` SAMEORIGIN → DENY; every non-obvious source now carries an inline comment saying which code path needs it
      - `packages/web/app/ssr.tsx` — deleted (dead second server entry, see below)
      - `packages/web/tests/build.test.ts` — the `ssr.tsx exists` assertion re-pointed at `server.tsx`
      - `packages/web/tests/security-headers.test.ts` — new, 12 tests guarding the whole header block

      **What phase 2 actually found**

      The remaining scope was "observe browser-console violations over the next days". That path was dead: production still serves a pre-parity image (its HTML has no font links and `theme-color #f97316`), so the origins that break under the old policy do not appear in a production console at all. Audited the source at HEAD instead. Three real gaps, each of which would have broken production the moment this branch shipped:

      1. **Google Fonts** — `app/routes/__root.tsx` links Poppins + Urbanist. `style-src` had no `https://fonts.googleapis.com`, `font-src` had no `https://fonts.gstatic.com` → site drops to fallback fonts.
      2. **`blob:` images** — `ReferenceImageUploader`, admin `ProductForm` and `lib/product-images.ts` render `URL.createObjectURL(file)` into an `<img>` → upload previews go blank.
      3. **`frame-ancestors`** — absent, so X-Frame-Options was the only anti-framing control. Added `'none'` and moved XFO to DENY to match (no `<iframe>` exists in `packages/web/app`; the Razorpay frame is outbound).

      Checked and deliberately **not** added: `placehold.co` (helper `getPlaceholderImage` has zero callers), Sentry ingest (`initSentry` is never imported), a CDN `connect-src` host (no `fetch()` to an absolute URL anywhere in the app), `accounts.google.com` (`signIn.social` is a JS location assignment, not a cross-origin form post, so `form-action 'self'` does not apply), social/schema.org URLs (link navigations and JSON-LD `@context`, not fetches).

      **Second CSP definition removed** — `packages/web/app/ssr.tsx` defined its own *enforcing* CSP with no Razorpay and no Google Fonts. It never reached the build: `app/server.tsx` is the TanStack Start entry, and `dist/server/server.js` contains server.tsx's 406 branch and zero of ssr.tsx's headers. Live `curl https://chobii.art/` confirms only `content-security-policy-report-only` is served. Left in place it was a landmine — wiring it up later would have silently blocked checkout. The traefik middleware is now the single definition, pinned by the new test.

      **Verification**:
      - Command: `bunx vitest run --root packages/web --config vitest.config.ts tests/security-headers.test.ts`
      - Result: PASS (12 tests, 12 passing) — 10 of those failed before the fix, for the right reasons (fonts absent, `blob:` absent, Report-Only still set, `ssr.tsx` still present)
      - Command: `bunx vitest run --root packages/web --config vitest.config.ts tests/build.test.ts`
      - Result: PASS (122 tests, 122 passing, includes the tsc type check — nothing referenced the deleted file)
      - Command: `docker compose -f docker/docker-compose.prod.yml --env-file deploy/.env config`
      - Result: exit 0, label resolves to the intended header value

      **Still open, needs a human at deploy time**: the ticket's "verify checkout / AI generator / image rendering under the enforced policy on production" cannot be done from here — this change is config-only and reaches prod on the next `make -C deploy deploy`. After that deploy, walk one Razorpay checkout, one AI generation with a reference-image upload, and one Google sign-in with the console open. Any violation there is a missing source in this one label.
