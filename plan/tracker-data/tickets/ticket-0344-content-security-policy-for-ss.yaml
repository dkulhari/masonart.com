ticket_number: 344
title: 'Content-Security-Policy for SSR pages (deferred from #264)'
description: |-
  ## Task
  #264 added HSTS, X-Frame-Options, nosniff, Referrer-Policy, and Permissions-Policy to SSR responses via the traefik middleware (docker/docker-compose.prod.yml web labels). CSP was deliberately deferred: TanStack Start SSR hydration uses inline scripts, so a naive CSP breaks the app.

  ## Scope
  - Inventory what the SSR output actually needs (inline hydration script → nonce or 'unsafe-inline'; image sources: cdn.chobii.art + data:; connect-src: self; Razorpay checkout script domain for payment pages).
  - Add `Content-Security-Policy` (start with Report-Only to validate, then enforce) via the same chobii-web-headers traefik middleware.
  - Verify checkout (Razorpay iframe/script), AI generator, and image rendering under the enforced policy on production.
