ticket_number: 424
title: Schema - shared Zod schemas and types for promotions
description: |-
  ## Task
  Add `packages/shared/src/schemas/promotion.ts`: the promotion record, the scope filter, the admin create/update inputs, and the resolved-price payload every storefront surface consumes.

  The resolved payload is the contract that keeps discount maths in one place: `{ promotionId, headline, percentOff, basePrice, salePrice, locked }`. `endsAt` is deliberately absent — the storefront receives a resolved countdown deadline, never the real end date.

  ## Context
  Part of feature: sale-promotions
  Phase: 1 — Schema + contracts
  Design: `docs/superpowers/specs/2026-08-05-sale-promotions-design.md` §4, §5

  `discountTypeSchema` already exists at `packages/shared/src/schemas/checkout.ts:100` with a third member (`free-shipping`) we do not implement — do not reuse it; promotions are percentage|fixed. Follow the export idiom in `packages/shared/src/schemas/order.ts` (schema + inferred type, named exports).
