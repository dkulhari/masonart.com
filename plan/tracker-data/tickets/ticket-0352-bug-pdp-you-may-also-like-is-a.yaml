ticket_number: 352
title: "BUG: PDP 'You May Also Like' is a hardcoded permanent skeleton — never implemented"
description: |-
  ## Problem

  The 'You May Also Like' section on every product detail page renders five `animate-pulse` grey placeholder blocks that never resolve into products. It is not a loading state — the section was shipped as a hardcoded placeholder and the real implementation never landed.

  **Verified on production chobii.art at 390x844, 2026-07-28** on `/posters/cosmic-harmony`. At 2 columns on mobile this consumes roughly 800px of continuously-pulsing dead space near the bottom of the page, reading as a permanently broken section.

  ## Root cause

  `packages/web/app/routes/posters/$slug.tsx:443-461`:
  ```tsx
  function RelatedProductsSection() {
    return (
      <section ...>
        <h2>You May Also Like</h2>
        <div className="grid grid-cols-2 ...">
          {/* Placeholder for related products - will be implemented with actual products */}
          {[1, 2, 3, 4, 5].map((i) => (
            <div key={i} className="animate-pulse">...</div>
          ))}
  ```

  There is no data fetch behind it. Confirmed `GET /api/products/:id/related` → **404** (no such endpoint exists, by id or by slug).

  ## Fix — decide scope

  Two options; either is acceptable, pick one:
  1. **Implement it** — add a related-products API endpoint (match on shared styles/subjects, exclude the current product, limit 5) and wire the section to it with a real loading state and an empty fallback.
  2. **Remove it** — delete the section until it can be built properly. A missing section is strictly better than a permanently pulsing one.

  Option 2 is the fast unblock; option 1 is the real fix.

  ## Acceptance criteria

  - No permanently-animating skeleton on the PDP
  - If implemented: real related products render, with a genuine loading state and an empty-state fallback
  - If removed: the section is gone and page flow is intact on mobile
