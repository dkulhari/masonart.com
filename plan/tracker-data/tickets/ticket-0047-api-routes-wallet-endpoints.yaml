title: API Routes - Wallet Endpoints
description: |-
  API routes for wallet operations, webhooks, and admin configuration.

  ## Implementation Details

  ### Routes Created

  **routes/wallet.ts:**
  - GET /api/wallet/balance - Get current wallet balance
  - GET /api/wallet/transactions - Get transaction history
  - POST /api/wallet/topup - Initiate Razorpay top-up
  - GET /api/wallet/cost-estimate - Get AI generation cost preview

  **routes/webhooks/wallet.ts:**
  - POST /api/webhooks/wallet - Razorpay payment confirmation webhook
  - Verifies signature and credits wallet

  **routes/admin/wallet-config.ts:**
  - GET /api/admin/wallet/config - Get pricing configuration
  - PUT /api/admin/wallet/config - Update pricing/markup

  ### Modified Routes
  - routes/ai.ts: Integrated wallet payment in generation flow
  - queues/ai-generation.ts: Added automatic refund on generation failure

