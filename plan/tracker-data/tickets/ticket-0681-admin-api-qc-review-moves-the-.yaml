      **Design decision to flag** — "guard that the job is `qc_submitted`" is implemented **as `assertTransition`, not as a hardcoded status literal**. The matrix already encodes exactly that guard (`qc_submitted → qc_passed`, `qc_submitted → qc_failed`) *plus* the one deliberate exception the design carves out: `qc_passed → qc_failed`, "a second review may still fail a job before it leaves", documented in `production-transitions.ts` as reachable **only** through this route. A hardcoded `from !== 'qc_submitted'` refusal would make that edge dead code and would re-decide in the router what #680 established the matrix decides. Every other from-status is refused, and a `pass` is refused from anything but `qc_submitted`.
