    text: |-
      ✅ **Completed**

      **Commit**: `a4b9154a` — feat(api): make the QC verdict move the job, and judge the photos it saw

      **Files Changed**:
      - `packages/api/src/routes/admin/production-jobs.ts` — `POST /:jobId/reviews` rewritten as one transaction; new `GET /:jobId/photos`; `createReviewSchema` now requires a non-empty `defects` on a fail; header docblock updated (route list, decision 4 rewritten, new decision 7 on keys vs signed URLs).
      - `packages/api/tests/routes/admin/production-jobs.test.ts` — the QC section rewritten (23 new/rewritten cases) plus a presigner mock and `/photos` in the role-gating table.

      **Summary**:
      The verdict and the status move are now one fact in one transaction: FOR UPDATE read, settled-job freeze, `assertTransition`, insert the review, guarded UPDATE with the from-status repeated in the WHERE, stamp `review_id` onto every live photo, one audit row. `pass → qc_passed`, `fail → qc_failed`. A refused transition writes nothing — not the review either — so `production_job_reviews` stays append-only with nothing to be sorry about, and the `production_job.transition_refused` row is written OUTSIDE the rolled-back transaction while the `qc_approved`/`qc_rejected` row shares it. Exactly one audit row per verdict; no `transitioned` row beside it.

      `GET /:jobId/photos` returns the whole `QC_SHOT_LIST` for the job's stage with a presigned DOWNLOAD url per live photo (`lib/storage`, **not** `lib/vendor-scope`), `missingRequiredSlots`, and never the object key. Nothing is signed until after the 404. A live photo in a slot outside the stage's list is surfaced with `onShotList: false` rather than dropped.

      **Design decision** (flagged in the earlier comment): the "job is `qc_submitted`" guard is `assertTransition`, not a hardcoded literal. The matrix already encodes it, and hardcoding it would make `qc_passed → qc_failed` — the supervisor overturn, documented in `production-transitions.ts` as reachable only through this route — dead code. A `pass` is refused from anything but `qc_submitted`; a `fail` is additionally allowed from `qc_passed`, which is the edge that exists.

      **Out of scope, noted for whoever picks it up**: `packages/web/app/routes/admin/production/$id.tsx` posts to this route. If its QC form can submit a `fail` with no defects it will now get a 400 — a web-side ticket, not this one.

