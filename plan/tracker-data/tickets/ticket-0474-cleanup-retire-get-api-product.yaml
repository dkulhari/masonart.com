ticket_number: 474
title: Cleanup - retire GET /api/products/collections
description: |-
  ## Task

  Delete the style-derived chips endpoint at `packages/api/src/routes/products.ts:601` and its tests once `/api/collections` has taken over every caller.

  Grep for remaining callers first. Leaving it is how a second collection vocabulary stays alive — which is exactly the state this feature exists to end, and exactly what the `styles.ts` deprecation block warns about.

  Also retire the `collections:v2` cache key so a stale entry cannot outlive the deploy.

  ## Context

  Feature: curated-collections, Phase 7. Depends on the web chips ticket removing the last caller.

  Do not delete this before the web side has moved — verify with grep, not with memory.
