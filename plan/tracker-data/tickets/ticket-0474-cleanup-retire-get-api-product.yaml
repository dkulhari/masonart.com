    text: |-
      ✅ **Completed**

      **Commit**: `eb097941` — refactor(api): retire the style-derived collections endpoint

      **Files Changed**:
      - `packages/api/src/routes/products.ts` — handler removed (181 lines), plus `CANDIDATES_PER_COLLECTION` and the now-unused `STYLE_OPTIONS` import. 1185 → 992 lines.
      - `packages/api/tests/routes/product-collections.test.ts` — deleted.

      **Callers checked before deleting, not assumed.** `grep -rn "products/collections"` over `packages/` and `tests/` returned only the endpoint's own test and two doc comments naming what superseded it.

      **The 55 "failures" in the full route suite are not failures**

      `npx vitest run tests/routes/` reports 7 files / 55 tests failing. Both counts are **identical with `products.ts` at HEAD and with the removal applied**, and every implicated suite passes in isolation — `admin/reviews.test.ts` is 96/96 alone, 0/96 in the combined run. It is parallel-suite interference, the hazard already recorded for this repo. Worth its own ticket; nothing to do with this change.

      **Verification**
      - `products.test.ts`: **77/77 before and after** — the removal touched nothing else in that file
      - `collections.test.ts` + `collection-detail.test.ts` + `products.test.ts`: 97 passing
      - All five collections suites together: 61 passing
      - `npx tsc --noEmit` — clean
      - Stale `product:collections*` keys dropped from the running Redis (none were present — the key had already aged out)

      **A process note worth recording.** While baselining, I swapped `products.ts` for the HEAD copy to compare failure counts, and the shell's cwd had drifted into `packages/api` — so an earlier relative-path write had landed at `packages/api/packages/api/src/routes/products.ts`. The result: my edit was sitting in a stray nested tree while the real file had been restored to HEAD. Caught by diffing both against HEAD and comparing line counts (992 vs 1185) before committing. The stray tree is removed. **After any file swap for baselining, verify the working file is the one you think it is** — `git status` alone showed ` M`, which looked correct.
