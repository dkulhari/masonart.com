ticket_number: 33
title: Integration - Product Page Reviews
description: |-
  Integrate review components into product detail page following existing page patterns.

  ## Implementation Details

  ### Files Modified
  - `packages/web/app/routes/posters/$slug.tsx` - Added reviews section

  ### Files Created
  - `packages/web/app/hooks/useReviews.ts` - TanStack Query hooks for reviews
  - `packages/web/app/components/product/ProductReviews.tsx` - Reviews section component

  ### Integration Points

  **Product Detail Page Updates**
  1. Added ProductReviews component after ProductDetail
  2. Shows review summary with stats
  3. "Write a Review" CTA button
  4. ReviewList with filters and pagination
  5. ReviewForm modal for authenticated users

  **Data Fetching**
  - useReviews hook for fetching product reviews
  - useReviewStats hook for fetching aggregated stats
  - useCreateReview mutation for submitting reviews
  - TanStack Query for caching with 5-minute stale time

  **SEO Considerations**
  - JSON-LD structured data already existed in product page
  - aggregateRating already included when reviews exist

  ## Acceptance Criteria
  - [x] Reviews visible on product pages
  - [x] Summary shows stats section
  - [x] Review list with sorting/filtering
  - [x] Write review button with auth check
  - [x] Structured data for SEO (existing)
  - [ ] E2E tests (deferred to ticket #35)
  - [x] Mobile responsive layout
