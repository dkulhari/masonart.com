ticket_number: 342
title: "BUG: verification emails never sent — sendVerificationEmail is a console.log stub (production signup dead-end)"
description: |-
  ## Bug
  packages/api/src/auth/index.ts:177 — `emailVerification.sendVerificationEmail` is a TODO stub that only console.logs the verification URL in development. No email is ever sent in any environment.

  Production sets `requireEmailVerification: true` (line 164), so on chobii.art every email/password signup creates an account that can never be verified → the user cannot complete signup. Silent dead-end: no error surfaces anywhere.

  ## Impact
  - All production email/password signups since go-live are dead-ended (Google OAuth users unaffected — no verification needed).
  - Any real user who registered on chobii.art with email+password is stuck.

  ## Fix (being done together with #242, same subsystem)
  - Real verification-email sender using the existing `sendEmail` service (services/email.ts) + a branded template.
  - While in there: `emailAndPassword.sendResetPassword` hook (currently absent) for the #242 forgot-password flow.

  ## Follow-up after deploy
  Check production for users with `email_verified = false` created since 2026-07-25 and either resend verification or manually verify them.
