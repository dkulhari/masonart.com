    text: |-
      Reconsider before building this. A blind critic has now judged the reference's own filter row and called it a weakness, not a strength.

      Context: I filed this after the Best Sellers band lost three consecutive blind A/Bs, on the reasoning that a whole row of content they have and we lack was a structural gap no framing rule could close. The band has since won both viewports on the fourth judged round — without this row.

      What the round-4 critic said about the reference's version of it, not knowing which page was which:

      - their rail arrows have dropped off the heading line down onto the filter row, leaving "Best Seller" alone with roughly 1030px of empty line to its right
      - four of their five chips are #fafafa on #ffffff — a 2% step — against one solid-black active chip, so the row reads as one button plus loose text rather than a set
      - on mobile the same four inactive chips are 40px tall, so the row contributes one visible black button and four runs of unhoused text

      So copying it as built would import three defects. That does not mean the feature is wrong — filtering a best-seller rail by style is a reasonable thing to offer, and the row is still the largest structural difference between the two bands. It means this ticket should be a design decision rather than a copy job.

      If it gets built: give the inactive chips a real surface rather than a 2% step, keep the prev/next controls on the heading line, and hold the mobile chips at a 44px touch target. The orientation chip row (#535) already won its own blind A/B on exactly those properties — chip proportion, internal padding and label weight against container — so use it as the in-house precedent rather than the reference.

      Dropping the priority to medium; it is no longer blocking a failing band.
