      ✅ **Completed** — option 1 (sweep to the real weights), as recommended.

      **Commit**: `288c8536` — refactor(web): sweep font-semibold out, and move the weight guard to 600

      **Step 1 re-check (the recommendation still held)**
      - `docs/design/mesonart/mesonart-parity-analysis.md` §2, re-read: Poppins **300** body, Urbanist **300** headings, Poppins **500** product title, Urbanist **500** nav. No 600 anywhere in the measured spec.
      - Re-counted by element type across `packages/web/app`: **176** occurrences — **116 on `h1`–`h6`** (66%), **60** on non-heading emphasis (span 13, button 13, a 11, p 11, div 6, Link 2, strong 1). 146 in storefront scope, 30 in the exempt trees. The plan's assumption (most are headings) is still correct.
      - `globals.css` base layer confirmed: `h1–h6 { font-family: var(--font-heading); font-weight: 300; line-height: 1 }`, so deleting the class on a heading lands on the measured spec rather than on nothing.

      **Files Changed** (62)
      - 58 × `packages/web/app/**/*.tsx` — 116 heading deletions, 60 → `font-medium`
      - `packages/web/tests/styles/storefront-token-compliance.test.ts` — rule widened to `font-(semibold|bold|extrabold|black)` on the `everywhere` scope, with the reasoning recorded in the comment so the next person does not re-derive it
      - `packages/web/tests/components/product/DeliveryEstimate.test.tsx` — asserted `font-semibold` on the `<strong>`; now `font-medium`, test renamed
      - `packages/web/tests/components/tracking/GuestOrderLookup.test.tsx` — fixture `<h2>` carried the class
      - `packages/web/tests/components/home/ProductRail.test.tsx` — stale comment

      **Verification**

      1. Guard bites (RED, then GREEN):
      - Command: `bunx vitest run tests/styles/storefront-token-compliance.test.ts` with a temporary `font-semibold` planted in `app/components/product/__tmp-red.tsx` and `app/routes/admin/__tmp-red.tsx`
      - Result: FAIL — offenders `["components/product/__tmp-red.tsx", "routes/admin/__tmp-red.tsx"]`. Both scopes caught, so `everywhere` really does reach the internal tools.
      - Same command after removing the temp files: PASS (10 tests)

      2. Full web unit suite (ticket step 7):
      - Command: `ALLOW_FULL_SUITE=1 bunx vitest run` in `packages/web`
      - Result: PASS — **179 files, 3348 tests, 0 failing**, 87.3s

      3. Pre-commit gate: `turbo run typecheck` — 4 successful, 4 total.

      4. Visual, against a live build (dev servers on :3000/:3001), before and after on **home, PDP, cart, checkout, login, track**:
      - Computed-style sweep of the PDP after the change returned **no element outside weight 300/400/500** — nothing is being synthesised any more.
      - The cases the ticket flagged as most at risk — `AT A GLANCE` (`text-xs uppercase tracking-[0.18em]`, `ProductTabs`) and the `track` uppercase section labels — read clearly at Urbanist 300. No size, tracking or colour compensation was needed, and no fake weight was restored.

      **Note on scope**: because the widened rule is `everywhere`-scoped, the 30 uses in the admin / vendor / ai-generator trees were swept too. That is deliberate and matches #631's reasoning: a synthesised weight is a rendering defect, not a matter of taste, so the exempt trees do not get to opt out of it.

      **Screenshots**: before/after pairs for the six pages were captured to the session scratchpad for the comparison; they are not committed.
