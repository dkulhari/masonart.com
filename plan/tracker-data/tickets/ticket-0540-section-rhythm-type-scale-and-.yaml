    text: |-
      RHYTHM / TYPE / BUTTON PASS DONE — measured against the bar's live page, not against a capture. Ticket still in-progress: the work is in the tree, uncommitted (see COMMIT below).

      ## The bar was reachable again, so everything here is measured on it

      mesonart.com answered on 2026-08-07. Browser measurements at 1440x900 and 390x844, full pre-scroll, computed styles off their own DOM. It bot-blocks above 1440 (a "Your connection needs to be verified" interstitial at 1600 and 1920), so nothing here claims a number above that width.

      THEIR PAGE                          OURS BEFORE            OURS AFTER
      total height @1440   7028            7057                   7049  (+21, 0.3%)
      total height @390    8394            8556                   8532  (+138, 1.6%)
      bands                12 @1440         11                     11
      band heading @1440   42px w300 L48    44px, two off-scale    42px, all eleven
      band heading @390    24px w300 L20    28px, two off-scale    24px, all eleven
      band CTA             h56 padX26 w400  two at h44 padX28 w500 all at h56 padX26 w400

      ## What was actually wrong

      1. EVERY BAND HEADING WAS ONE STEP TOO BIG. They were all on `text-display`, which is the H1 token — 44px/28px against the bar's 42px/24px. Their band `<h2>`s are genuinely a step under their page titles; ours had no such step, because the token did not exist.

         Added `--font-section-size: clamp(1.5rem, 1.082rem + 1.714vw, 2.8125rem)` and registered it as `text-section`. The linear term is the two-point fit through their measured 24.0 @390 and 42.0 @1440 and reproduces both exactly. Their theme steps at breakpoints rather than interpolating; a clamp is how the rest of our scale is expressed. The 45px ceiling is from their markup — their heading carries `class="heading 45"` — not from pixels, and says so in the comment.

         `--font-display-size` is untouched. H1s (the gift-cards page header, collection headers, the hero) keep the 44px scale that was measured for them.

      2. TWO BANDS WERE OFF THE PAGE SCALE ENTIRELY. Customer Reviews carried its own `text-3xl sm:text-4xl` (36px/30px) and the newsletter `text-2xl sm:text-3xl` (30px/24px). Both now `text-section` like the other nine. Their own "Customer Reviews" heading is the same size as every other band heading — docs/design/mesonart/mesonart-home-reviews-band.png, and confirmed live at 42px.

      3. THE NEWSLETTER WAS THE ONLY CENTRED BAND. `mx-auto max-w-2xl text-center` put its heading at x=384 while every other band's sat at the 48px gutter. Left-aligned; the copy keeps a `max-w-2xl` measure and the form a `max-w-xl`, both left. It is our band, not theirs, so it takes its geometry from the page rather than from a measurement.

      4. TWO CTAs WERE OFF THE BUTTON SYSTEM. Reviews' "View All" and the newsletter's "Subscribe" rendered at the `md` default — 44px tall, 28px of padding, label at font-medium — against the measured pill every other band uses (56 / 26 / body weight). Both now `size: 'pill'`. The newsletter field went `h-11` to `h-14` and `text-sm` to `text-button` with them: a 44px field beside a 56px button is two systems on one row.

         The hero pill stays its measured exception (45px tall, 1px border, on a photograph). Theirs measures 46/28/1 at 1440, so the exception is right.

      ## Vertical rhythm — checked, deliberately not flattened

      Every band's pocket is symmetric already (56/56, 96/96, 40/40, 48/48, 64/64), and each of those numbers was measured by its own band ticket. Their sections carry zero padding on the section element itself — it all sits on inner wrappers — so there is no band-level number of theirs to copy, and making ours uniform would break eleven measurements to satisfy a rule the bar does not follow. Left alone.

      ## The total-height agreement is partly luck, and should not be read as parity

      7049 against 7028 is 0.3%, but it nets two large errors in opposite directions. Per band at 1440, ours minus theirs:

        Best Seller     723 vs 742   -19
        Shop By Popular 877 vs 788   +89
        Shop by Room    800 vs 608   +192
        promo tiles     407 vs 391   +16
        New In          723 vs 675   +48
        Orientation     306 vs 182   +124
        Featured Artists  0 vs 912   -912   (descoped, #536)
        Brand Story     668 vs 654   +14
        Newsletter      400 vs   0   +400   (ours only)
        trust row       258 vs 250   +8

      Their Customer Reviews band is a lazily-injected Loox widget and measured 85+128 mid-load, so it is not comparable and is excluded. The +192 on Shop by Room and +124 on Orientation are real per-band gaps in already-closed tickets (#532, #535) — flagging, not fixing, since neither is this ticket's remit. Mobile's +138 total is the same story with a taller Brand Story.

      ## Files

      - `app/styles/globals.css` — `--font-section-size`, with the two measurements, the fit, and why the ceiling is from markup.
      - `tailwind.config.ts` — `fontSize.section`.
      - `app/routes/index.tsx` — newsletter band: `text-section`, left-aligned, `size="pill"` submit, `h-14`/`text-button` field.
      - `app/components/home/CustomerReviewsSection.tsx` — heading to `text-section`, View All to `size: 'pill'`.
      - `app/components/home/{ProductRail,PopularCategoriesSection,ShopByOrientationSection}.tsx` — `text-display` to `text-section`.
      - NEW `tests/routes/home-rhythm-system.test.ts` — 9 tests. Reads all eleven band sources at once and fails on a heading off `text-section`, a heading back on the H1 token, an ad-hoc `text-*` size, a centred heading, an outline CTA without the pill scale, or the token missing from globals.css / tailwind.config.ts. Two documented exceptions with reasons in the file: BrandStory's heading (a step above on the bar too) and HomeHero's CTA.

      ## Verification

      - `bunx vitest run tests/routes/home-rhythm-system.test.ts` — 9 passed. Confirmed red first: 6 of 7 failed before the fixes, then 3 of 9 after the test was rewritten to the section scale.
      - `ALLOW_FULL_SUITE=1 bunx vitest run` — 2934 passed, 2 failed. Both pre-existing in files not touched here: `tests/styles.test.ts` dark-variant (admin/promotions/index.tsx) and `tests/routes/wishlist-page.test.ts` beforeLoad (wishlist.tsx). The third pre-existing failure this ticket recorded earlier (home-tokens scrims) now passes.
      - `bunx tsc --noEmit` — 22 errors, zero in any file touched here. All in routes/admin/*, routes/track/* and ai-generator/PromptSuggestions.tsx. Same count as before this work.
      - Live re-measure after the change, all eleven bands rendering: headings 42px at 1440 and 24px at 390 on every band, each at the page gutter (L48 / L20); every band CTA h56 padX26 w400.

      Measuring needed the client-query bands (Shop By Popular, promo tiles, Reviews) alive, and the API's CORS allows only :3001, so this ran against a private API on :3010 and a private vite on :4321. Both stopped afterwards; the shared :3001 server was left running and untouched.

      ## COMMIT — not made, deliberately, needs a call

      Every home band component is still UNTRACKED (`??`) — #529-#539 built them and nothing has been committed. `app/routes/index.tsx` imports ten of them, so a commit of this ticket's files alone would not build. The coherent unit is the whole feature's working set, which includes files other agents are in right now (#537, #541, #564). Left in the tree rather than committing across other agents' in-flight work.
