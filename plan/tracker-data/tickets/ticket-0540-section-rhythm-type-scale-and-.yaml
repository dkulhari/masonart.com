      Cross-cutting finding from #535, promote to the top of this ticket and do it FIRST rather than last.

      Measured on four of mesonart's slices and two of ours: their desktop page gutter is 48px. Ours is 20px, on every band. That is `--page-padding` in globals.css.

      Why it cannot wait for the end of the run: every band builder is composing against a 20px gutter, so every band will lose its blind comparison for a reason that has nothing to do with the band. And it must not be special-cased per band — a band with its own gutter misaligns against the page around it.

      Origin is global-chrome-parity, which is closed, so this ticket inherits it.

      Second, smaller, same source: `Orientation` in app/components/product/ProductFilters.tsx is a five-value union that predates `set-of-2-3`, which forces chip search objects to be typed `Record<string, unknown>` — the same workaround AllArtMegaMenu already carries. Widening the union removes both.
