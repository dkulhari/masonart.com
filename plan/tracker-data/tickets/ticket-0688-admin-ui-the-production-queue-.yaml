    timestamp: '2026-08-30T18:44:07.044Z'
    text: |-
      ✅ **Completed**

      **Commit**: `31f62013` — feat(web): reshape the production queue around the new statuses, and assign in bulk

      **Files Changed**:
      - `packages/web/app/routes/admin/production/index.tsx` — vocabulary derived from the shared matrix, relabelled for the workflow, multi-select assign, per-job refusal panel
      - `packages/web/tests/routes/admin/production-queue.test.tsx` — 47 → 114 tests

      **Summary**

      1. **The vocabulary now exists once.** The step-2 deviation recorded above is *withdrawn*: mid-ticket, #689 landed `@chobii/shared/schemas/production-transitions` (commit `1f829294`), which puts `PRODUCTION_JOB_STATUSES` and `PRODUCTION_TRANSITIONS` somewhere `packages/web` can actually import. So the queue writes no status list at all:
         - `PRODUCTION_STATUSES` = `PRODUCTION_JOB_STATUSES` minus `UNREACHABLE_STATUSES`. A status with no in-edge and no out-edge is retired, so decision 9's retirement is *read off the matrix* rather than restated — and it moves when the matrix moves.
         - `ASSIGNABLE_STATUSES` = every status `nextStatuses(from, 'admin')` gives an edge to `assigned` from. Not the three words; #684 is the bill for a hardcoded copy of the matrix.
      2. **`sent` is offered nowhere** — not in the tuple, the labels, the styles or the filter, and there is no string literal for it in the file (asserted). `?status=sent` degrades to an unfiltered queue rather than error-boundarying the route.
      3. **Relabelled.** "Sent"/"Received" was the neutral wording that let the ambiguity survive; `received` → "In production", `qc_submitted` → "Awaiting our QC" (blocked on us, the admin QC queue's content), `dispatched` → "Dispatched by vendor" (custody ended). Amber is reserved for `qc_submitted` so our own backlog is a glance.
      4. **`StatusPill` never indexes blind** — an unlabelled status renders its raw value in a dashed pill, so #696's blank badge cannot return for the next enum value.
      5. **Multi-select assign** (D2, no batch entity): tick N assignable jobs, one vendor, N independent `POST /:jobId/assign` calls. `assignJobsToVendor` is sequential, never throws, and returns one outcome per job — **per-job atomic, batch-level partial**, so one unpriced job does not block nine good ones. A thrown request becomes that job's refusal, not the batch's.
      6. **Refusals are actionable.** `BulkAssignResults` names each refused job and, for the 422, each unpriced item with its size and longest edge — mirroring `AssignmentFailure` in `$id.tsx`. Unknown size is said in words, never a `0`.
      7. **No native dialog.** Two-step inline confirm naming the vendor and the count (`reviews.tsx:270`).
      8. **Only assignable rows are selectable** — matrix edge *and* `settlementId === null`, since a settled job is frozen; disabled rather than omitted, with a title saying which refusal applies. Select-all reaches only the assignable rows on the current page.
      9. **List state in the URL.** Filters and page stay in `validateSearch` with the `router.tsx` coercion + comma-split rules intact; the *selection* deliberately does not (twenty job ids is not a link anyone sends) and is dropped whenever the filters change.
      10. **Three states on every list** — the queue keeps its skeleton/empty/error, and the supplier picker inside the bulk bar gets its own three.

      **Verification**
      - Command: `bun run vitest run tests/routes/admin/production-queue.test.tsx`
      - Result: PASS (114 tests, 114 passing, 0 failing) — was 47 before this ticket
      - Command: `bun run vitest run tests/routes/admin/production-queue.test.tsx tests/routes/admin/production-detail.test.tsx tests/routes/admin/order-production-panel.test.tsx`
      - Result: PASS (232 tests passing) — the two sibling screens that import from this module are unaffected
      - Command: `bun run typecheck` (@chobii/web) — 0 errors. The pre-commit `turbo run typecheck` gate passed across all three packages.
      - RED evidence before implementation: the same file reported `61 failed | 47 passed (108)`.

      **Note for #689**: making `ProductionStatus` the full shared union retired the temporary `statusLabel` / `isQueueStatus` shim in `$id.tsx` (its own comment says "deleted by #688 widening that tuple"). It still compiles and all 63 of its tests pass — the else branch is simply now unreachable and can be deleted.
