    text: |-
      **Implementation steps** (derived; freeform ticket, TDD per /tt-work-ticket)

      1. RED — vocabulary: tests that `PRODUCTION_STATUSES` carries `qc_submitted` + `dispatched`, excludes `sent`, and that every member has a label AND a style. Plus a mechanical drift test that reads `packages/api/src/database/schema/production-jobs.ts` so a status added to the enum fails here.
      2. GREEN — reshape `PRODUCTION_STATUSES` / `STATUS_LABELS` / `STATUS_STYLES`; relabel `received` away from the neutral "Received" and label `qc_submitted` as blocked-on-us; `StatusPill` falls back to the raw value so a legacy row is never a blank badge.
      3. RED/GREEN — search schema: `?status=qc_submitted` and `?status=dispatched` round-trip through router.tsx's string-only serialisation; `?status=sent` degrades to no filter rather than blanking the route.
      4. RED/GREEN — selection: `isAssignable(job)` derived from the matrix rows that have an admin edge to `assigned` (`draft`, `assigned`, `qc_failed`) and settled jobs frozen; checkbox column + select-all-on-page.
      5. RED/GREEN — `BulkAssignBar`: vendor picker with its own loading / empty / error states, two-step inline confirm (no native `confirm()`), one POST per selected job to `POST /:jobId/assign`.
      6. RED/GREEN — `assignJobsToVendor`: per-job atomic, batch-level partial. One 422 does not abort the rest; returns an outcome per job carrying the `unpriced` array.
      7. RED/GREEN — `BulkAssignResults`: names each refused job and each unpriced item with its size and longest edge, mirroring `AssignmentFailure` in `$id.tsx`.
      8. VERIFY — `bun run vitest run tests/routes/admin/production-queue.test.tsx` from `packages/web`, path-scoped (888-test suite, shared 8-core box, two sibling agents live).
      9. COMMIT — `packages/web/app/routes/admin/production/index.tsx` + its test only, staged by explicit path.

      **Deviation to flag on step 2**: the ticket asks to re-export the tuple from `packages/api/src/lib/production-transitions.ts`. That module does not export a status tuple, and `packages/web` cannot import it either way — `@chobii/api`'s `exports` map publishes only `./dist/index.js`, web's `node_modules/@chobii` holds `shared` alone, and the module's transitive import of `database/schema/production-jobs` would pull drizzle-orm into the browser bundle for a nine-string list. So the tuple stays a mirror and is pinned mechanically instead, which is the pattern `packages/shared/src/schemas/production-qc.ts` already documents for the same enum ("Two lists, kept in step by …").
