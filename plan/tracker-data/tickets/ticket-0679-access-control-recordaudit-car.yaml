    text: |-
      ✅ **Completed**

      **Commit**: `3e9564d8` — feat(audit): register the production actions and make recordAudit carry vendorId

      **Files Changed**:
      - `packages/shared/src/schemas/audit-log.ts` — 14 actions added to `AUDIT_ACTIONS` and `AUDIT_ACTION_CATEGORY`; the "declared in the same phase as its emitter" rule written into the `AUDIT_ACTIONS` doc comment.
      - `packages/shared/tests/schemas/audit-log.test.ts` — 6 new tests (18 → 24).
      - `packages/api/src/lib/audit.ts` — `recordAudit` reads `c.get('vendorId')`; transaction rule documented.
      - `packages/api/tests/lib/audit-record.test.ts` — 6 new tests (11 → 17).

      **Summary**

      *Actions.* money (commits or changes what we owe a supplier): `production_job.assigned`, `.reassigned`, `.amount_overridden`, `production_transfer.declared_lost`. fulfilment: `production_job.created`, `.transitioned`, `.transition_refused`, `.photos_submitted`, `.qc_approved`, `.qc_rejected`, `.label_issued`, `production_transfer.dispatched`, `.received`, `order.consolidator_set`. This reconciles #667, which filed all `production_job.*` under `money` — **#667 is superseded in part**: the split is by what the row is *about*, not by table.

      No `production_job.cancelled`: a cancellation is a transition, which keeps "one row per transition" true. A test asserts its absence, with the `order.cancelled` contrast (`routes/admin/orders.ts:66-74`) written into the comment — an order cancellation is itself the money decision; a job cancellation is a state move whose money consequence is a separate `amount_overridden`.

      *vendorId.* Read inside `recordAudit`, not at the call sites — the same reason the category is derived and ip/user-agent/request-id/method/path are captured: a caller cannot get a context fact wrong if a caller never supplies it. `requireVendor` (`middleware/vendor.ts:58`) has set `c.set("vendorId", …)` since it was written and nothing had ever read it. Merged **after** `entry.metadata`, so a caller cannot overwrite it; **absent entirely** when the context has none, so "has a vendorId" keeps meaning "was written for a vendor" rather than degrading to a null on every admin row. The `vendor.request` floor row gets it for free — `middleware/audit.ts:80` writes through `recordAudit`.

      All four hard constraints held and are covered by tests: `AuditContext` stays structural (a test calls `recordAudit` with a plain `{get,set,req}` object, no Hono, no cast); `recordAudit` still swallows a DB failure and still claims `audited` **before** the insert (asserted in the same failing-insert test); the category stays derived.

      *Transaction rule.* Verified first: all 40 `recordAudit` call sites in `packages/api/src` omit `tx` (balanced-paren arg count over every call — the only 3-arg hit was the definition itself). Documented in the doc comment: share the transaction when the row would be a **lie** if the business write rolled back; **never** share it for a refusal, because a refusal row records that a transaction was rolled back and writing it inside that transaction erases the very evidence it exists to preserve. Ends with the rule of thumb — `tx` when the row asserts something the transaction must make true, no `tx` when the row asserts something *about* the transaction.

      **Sequencing — on the record**

      These 14 actions **have no emitter today**. `routes/admin/production-jobs.ts` (#680, #681) and `routes/vendor.ts` (#684) emit them in Phase 3; no emitters were wired here. #671 (feature `admin-audit-log`, still `todo`) adds a build guard that fails on any declared action nothing emits. That guard is **not implemented yet**, so this is safe now — but **#671 must not land before #680/#681/#684**, or it will fail the build on these declarations. A test in `audit-log.test.ts` guards the other half of the rule: nothing is declared for order-dispatch-tracking to fill in later.

      **Verification**:
      - Command: `npx vitest run tests/lib/audit-record.test.ts` (cwd `packages/api`)
      - Result: PASS (17 tests, 17 passing — was 11)
      - Command: `npx vitest run tests/schemas/audit-log.test.ts` (cwd `packages/shared`)
      - Result: PASS (24 tests, 24 passing — was 18)
      - Command: `turbo run typecheck` (pre-commit gate, includes `packages/api` `tsconfig.test.json`)
      - Result: PASS — `Tasks: 4 successful, 4 total`
      - Also re-run green: `packages/api/tests/middleware/audit.test.ts` (11 passing), since the floor row's metadata changed.

      RED was confirmed before each implementation: 3 failing shared tests (`undefined` category for every new action), then 4 failing api tests (`metadata.vendorId` absent, caller's value winning).

      Two earlier gate runs were refused by typecheck errors in a sibling agent's in-flight `lib/vendor-scope.ts` / `tests/routes/vendor/artwork.test.ts`; I waited for those to land rather than touching them or using `--no-verify`. Only my four files were staged, by explicit path.
