ticket_number: 404
title: Schema - curator pin columns and sales index
description: |-
  ## Task

  Add the two curator-pin columns the Best-selling sort needs, plus the index that makes the live sales aggregate cheap.

  - `products.isPopular` boolean, default false, not null
  - `products.popularOrder` integer, nullable
  - index `products_popular_idx` on (isPopular, popularOrder)
  - index `order_items_product_id_idx` on order_items(product_id)

  Mirrors the existing `isFeatured` / `featuredOrder` / `products_featured_idx` triple at packages/api/src/database/schema/products.ts:140-158, so the query shape and admin UI follow a path already in the codebase.

  ## Context

  Part of feature: collection-page-parity-remainder
  Phase: 1 - Schema

  Local trap #3 from docs/design/mesonart/PLAN-OF-ACTION.md: API route tests mock `db`, so they cannot catch a reference to a column that does not exist. A route filtering on a non-existent column once passed 17 green tests. Hence a schema-assumption test that hits the real database (host port 5440, not the 5433 in .env).

  The seed leaves `isPopular` false everywhere - the pin is a curator action, not seed data.
