  - id: 1
    action: write-test
    description: Write failing schema-assumption test for the new columns and indexes against the real database
    file: packages/api/tests/database/product-popularity-columns.test.ts
    command: cd packages/api && bunx vitest run tests/database/product-popularity-columns.test.ts
    expected_result: FAIL
    status: pending
    code: |
      // Follows tests/database/product-facet-columns.test.ts - a REAL db connection,
      // not the mocked `db` the route tests use. This is the only layer that can
      // catch a column that does not exist.
      import { describe, it, expect } from 'vitest'
      import { sql } from 'drizzle-orm'
      import { db } from '../../src/database/client'

      describe('products popularity columns', () => {
        it('has is_popular and popular_order', async () => {
          const rows = await db.execute(sql`
            select column_name, data_type, is_nullable
            from information_schema.columns
            where table_name = 'products'
              and column_name in ('is_popular', 'popular_order')
            order by column_name
          `)
          expect(rows.rows.map((r: any) => r.column_name)).toEqual([
            'is_popular',
            'popular_order',
          ])
        })

        it('indexes the popularity pin and the sales join column', async () => {
          const rows = await db.execute(sql`
            select indexname from pg_indexes
            where indexname in ('products_popular_idx', 'order_items_product_id_idx')
            order by indexname
          `)
          expect(rows.rows.map((r: any) => r.indexname)).toEqual([
            'order_items_product_id_idx',
            'products_popular_idx',
          ])
        })
      })
