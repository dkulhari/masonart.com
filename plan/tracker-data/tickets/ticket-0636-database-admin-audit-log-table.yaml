    text: |-
      Done — commit 3188f068. 10/10 passing (`cd packages/api && bunx vitest run tests/database/audit-log-schema.test.ts`), turbo typecheck green.

      Shipped `schema/audit-log.ts` (table + 2 enums + 6 indexes + relations) and hand-written migration `0021_admin_audit_log.sql`, applied to the dev DB on 5440.

      Two notes for later tickets:
      1. **`drizzle-kit generate` is unusable here** — it goes interactive asking whether `frame_category` is a new enum or a rename of `frame_type` (pre-existing drift from the frames work). Migrations 0014-0020 are all hand-written for the same reason; 0021 follows, with the `_journal.json` entry appended by hand (idx 21, tag `0021_admin_audit_log`).
      2. **Trigger verified live**, not just asserted in a schema test:
         - `UPDATE` → `ERROR: admin_audit_log is append-only: UPDATE is not permitted`
         - `DELETE` → `ERROR: admin_audit_log is append-only: DELETE requires the retention job`
         - `BEGIN; SET LOCAL chobii.audit_purge='on'; DELETE ...` → `DELETE 1`

      The FK is `admin_audit_log_actor_user_id_user_id_fk` → `public.user(id)` (the better-auth table is singular), ON DELETE set null.
