ticket_number: 636
title: Database - admin_audit_log table, indexes and the immutability trigger
description: |-
  ## Task
  Add the append-only `admin_audit_log` table with its six indexes, generate the migration, and hand-append the immutability trigger: UPDATE always refused; DELETE refused unless the transaction has set `chobii.audit_purge = 'on'`.

  ## Context
  Part of feature: admin-audit-log (Phase 1 - Contract)
  Spec: docs/plans/2026-08-17-logging-and-auditing.md section 3.1
  Follow packages/api/src/database/schema/ai-generation-reviews.ts for table style (uuid pk, index map in the third arg, relations block, $inferSelect/$inferInsert type exports). Export it from schema/index.ts.
  Migrations live in packages/api/src/database/migrations; generate with `bunx drizzle-kit generate` then append the trigger SQL to the generated file with a `--> statement-breakpoint` separator.
  Actor is referenced (users.id, onDelete set null) AND snapshotted (actor_email, actor_role).
