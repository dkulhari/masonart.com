ticket_number: 439
title: Schema - gallery membership columns and the session field
description: |-
  ## Task
  `packages/api/src/database/schema/users.ts` gains `galleryMember`, `galleryJoinedAt`, `marketingConsentAt`, `joinSource`. Migration included.

  The field must also be declared in `packages/api/src/auth/index.ts` under `user.additionalFields` (alongside `role`, `tradeStatus`, `aiCreditsRemaining` at lines 253-296) or it never reaches the session payload, and every surface would need a second request to learn whether the viewer is a member.

  Consent is a **timestamp, not a boolean** — a date is what has to be produced if the consent is ever questioned.

  ## Context
  Part of feature: gallery-membership
  Phase: 1 — Schema + auth field
  Design: `docs/superpowers/specs/2026-08-05-sale-promotions-design.md` §8

  Existing customers are NOT backfilled as members — the migration default is `false` for everyone, including accounts that predate it. That is the point of design decision D4: a member is someone who joined, not someone who once bought something.

  Shape assertions go in `tests/database/`, matching `product-popularity-columns.test.ts`.
