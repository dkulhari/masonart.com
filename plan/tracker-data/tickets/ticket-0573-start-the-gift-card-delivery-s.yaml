    text: |-
      ✅ **Completed**

      **Commit**: `03b038c6` - feat(api): start the gift card delivery sweep and the deadline checker

      **Design Decision**: where periodic work starts

      Added `packages/api/src/background.ts` as the single startup site, rather than calling `setInterval` starters inline from `src/index.ts`. Reasons: the block that starts the review media worker is already the app's "background work" section, and the sweeps needed a handle the existing SIGTERM/SIGINT shutdown could stop. `startDeadlineChecker` was started in the same place, as the ticket suggested — it had the same orphaned-export problem.

      **Design Decision**: multiple API processes

      Every instance runs both sweeps. Safe, not accidental: gift card minting races through the unique constraint on `gift_card.purchase_order_id` (covered by `gift-card-delivery.test.ts`), and the deadline checker marks reminders sent before continuing. The cost is duplicate polling, so `DISABLE_BACKGROUND_WORKERS=true` opts an instance out entirely. Not converted to BullMQ — that is a separate decision, and the immediate problem was that they did not run at all.

      **Files Changed**:
      - `packages/api/src/background.ts` (new) - `startBackgroundWorkers()` starting both sweeps, returning an idempotent `stop()`
      - `packages/api/src/index.ts` - calls it in the `NODE_ENV !== "test"` block; stops it in the shutdown handler before closing the review media queue
      - `packages/api/tests/background-workers.test.ts` (new) - coverage

      **Tests**:
      - `tests/background-workers.test.ts`: 7 passing — both sweeps started, `stop()` clears them, double stop is safe, `DISABLE_BACKGROUND_WORKERS` starts nothing, and two source-level assertions that `src/index.ts` actually calls and stops them (the startup block is behind `NODE_ENV !== "test"`, so importing it proves nothing — an exported starter nobody calls is exactly this bug)
      - `tests/services/gift-card-delivery.test.ts`: 15 passing against live Postgres, unchanged — confirms a scheduled card mints and delivers end to end once the sweep runs

      Typecheck: no new errors (`@chobii/shared` export errors in `routes/admin/frames.ts` and `routes/admin/products.ts` are pre-existing, unrelated).
