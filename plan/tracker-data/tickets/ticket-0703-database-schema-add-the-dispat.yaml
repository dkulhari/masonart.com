  - id: 1
    action: write-test
    description: Write the failing test for the new columns, the token contract and the one-live-label index
    file: packages/api/tests/database/order-shipments-dispatch.test.ts
    command: cd packages/api && bunx vitest run tests/database/order-shipments-dispatch.test.ts
    expected_result: FAIL
    status: pending
    code: |
      /**
       * The columns real dispatch needs, and the two that other code already names.
       *
       * `label_object_token` is not a new idea here — `lib/vendor-scope.ts` reads it
       * TODAY as a raw SQL fragment, which is why the vendor label route answers 503
       * everywhere. `voided_at` is the void marker that same file's doc block defers
       * to this feature so `getVendorJobLabelKey` can stop choosing the live label by
       * recency.
       *
       * Column NAMES are asserted, not just the drizzle keys: the SQL fragment in
       * `vendor-scope.ts` spells `label_object_token` as a string, and a schema that
       * named it anything else would leave that route broken with every test green.
       */

      import { describe, it, expect } from 'vitest'
      import { readFileSync } from 'node:fs'
      import { resolve } from 'node:path'
      import { getTableConfig } from 'drizzle-orm/pg-core'

      import { orderShipments } from '../../src/database/schema/shipping'

      const MIGRATION = resolve(
        __dirname,
        '../../src/database/migrations/0027_order_shipments_dispatch.sql'
      )

      /** `LABEL_TOKEN_PATTERN`, copied from lib/vendor-scope.ts:530 on purpose. */
      const LABEL_TOKEN_PATTERN = /^[A-Za-z0-9_-]+$/

      const config = getTableConfig(orderShipments)
      const columnByName = new Map(config.columns.map((c) => [c.name, c]))

      describe('order_shipments carries a real dispatch', () => {
        it('names the label token exactly as vendor-scope spells it', () => {
          // A rename here is silent: the fragment is a string, so the route would
          // keep 503ing with the whole schema suite green.
          expect(columnByName.has('label_object_token')).toBe(true)
          expect(orderShipments.labelObjectToken.name).toBe('label_object_token')
        })

        it('adds the void marker vendor-scope asks for by name', () => {
          expect(columnByName.has('voided_at')).toBe(true)
          expect(columnByName.has('voided_reason')).toBe(true)
        })

        it('adds the carrier handles, the parcel and what we paid', () => {
          for (const name of [
            'awb_number',
            'external_shipment_id',
            'external_order_id',
            'courier_name',
            'shipped_weight_grams',
            'length_cm',
            'width_cm',
            'height_cm',
            'cost_paise',
            'pickup_vendor_id',
          ]) {
            expect(columnByName.has(name), `${name} is missing`).toBe(true)
          }
        })

        it('leaves every column nullable — an unlabelled shipment is an ordinary row', () => {
          for (const name of ['label_object_token', 'awb_number', 'cost_paise', 'voided_at']) {
            expect(columnByName.get(name)!.notNull, `${name} is NOT NULL`).toBe(false)
          }
        })

        it('holds at most ONE live labelled shipment per order', () => {
          // The property `getVendorJobLabelKey` needs. Without it the choice of
          // "which label will the courier honour" is whichever row the planner
          // reached first, and a vendor who reloads gets a different PDF.
          const live = config.indexes.find((i) => getTableConfig(orderShipments) && i.config.name === 'order_shipments_live_label_idx')
          expect(live, 'order_shipments_live_label_idx is missing').toBeDefined()
          expect(live!.config.unique).toBe(true)
          expect(live!.config.where).toBeDefined()
        })

        it('makes the token itself unique — two orders cannot share one object key', () => {
          const sql = readFileSync(MIGRATION, 'utf8')
          expect(sql).toMatch(/unique/i)
          expect(sql).toContain('label_object_token')
        })

        it('adds no enum value — that was 0026, and the two cannot share a batch', () => {
          const sql = readFileSync(MIGRATION, 'utf8').replace(/^\s*--.*$/gm, '')
          expect(sql).not.toContain('ADD VALUE')
        })

        it('accepts the token shape the signed-URL path requires', () => {
          // Documentation of the contract the WRITER must honour: the key is
          // `fulfilment/labels/<token>.pdf` and rides in a URL path.
          expect(LABEL_TOKEN_PATTERN.test('r7Kq2-_aZ9')).toBe(true)
          expect(LABEL_TOKEN_PATTERN.test('a/b')).toBe(false)
          expect(LABEL_TOKEN_PATTERN.test('')).toBe(false)
        })
      })
