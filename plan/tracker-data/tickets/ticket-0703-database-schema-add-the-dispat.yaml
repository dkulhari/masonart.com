      ✅ **Completed**

      **Commit**: `ea285259` - feat(api): give order_shipments the columns a real dispatch records

      **Files Changed**:
      - `packages/api/src/database/schema/shipping.ts` — 13 dispatch columns + the partial unique index + `pickup_vendor_id` index
      - `packages/api/src/database/migrations/0027_order_shipments_dispatch.sql` — annotated; names no `shipment_status` literal anywhere
      - `packages/api/src/database/migrations/meta/{_journal.json,0027_snapshot.json}`
      - `packages/api/tests/database/order-shipments-dispatch.test.ts` — new, 15 tests (DSL shape)
      - `packages/api/tests/database/order-shipments-live-label.test.ts` — new, 5 tests (live Postgres)

      **Summary**:
      Added `label_object_token`, `voided_at`/`voided_reason`, `awb_number`, `external_shipment_id`, `external_order_id`, `courier_name`, `shipped_weight_grams`, `length_cm`/`width_cm`/`height_cm`, `cost_paise`, `pickup_vendor_id`. All nullable — `POST /admin/orders/:orderId/ship` opens a row before any label exists.

      `courier_name` is deliberately separate from `carrier`: `carrier` is the aggregator we bought through, `courier_name` is who actually carries it, and that is the only name a customer recognises on a tracking page.

      The token is `text`, not `uuid` — `LABEL_TOKEN_PATTERN` admits any `[A-Za-z0-9_-]+`, and it is random rather than the order id because the key `fulfilment/labels/<token>.pdf` rides in the PATH of a signed URL.

      **`order_shipments_live_label_idx`** — unique on `(order_id)`, partial on **both** `voided_at IS NULL` **and** `label_object_token IS NOT NULL`. Each half fails differently, so both are asserted against a real Postgres:
      - drop the first → blanket unique → voiding a label permanently prevents buying another
      - drop the second → refuses a second unlabelled row → `POST /orders/:orderId/ship` becomes a 500 on the second call

      Followed the repo's split convention (`production-job-photos.test.ts` beside `production-job-photos-live-slot.test.ts`): DSL shape in one file, real predicate behaviour in another. Every live row is created inside a transaction that always rolls back, so the shared dev DB is untouched.

      Migration applied — 28 migrations now.

