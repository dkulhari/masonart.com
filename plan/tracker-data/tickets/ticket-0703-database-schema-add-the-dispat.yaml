ticket_number: 703
title: Database Schema - Add the dispatch columns to order_shipments, including label_object_token and the void marker
description: |-
  ## Task
  `order_shipments` can hold a carrier name and a tracking number and nothing else. Real dispatch needs the AWB, the aggregator's own ids, the courier that actually carries it, the shipped weight and dimensions, what WE paid (essential for margin now that the customer pays ₹0), the consolidating vendor whose address is the pickup location, and a way to say a label is dead.

  Two of these are not new requests — other code already names them:

  - `label_object_token` is read TODAY by `packages/api/src/lib/vendor-scope.ts:433` as a raw SQL fragment against a column that does not exist. That is why `GET /api/vendor/jobs/:id/label` answers 503 in every environment.
  - `voided_at` is the "void marker" the same file's doc block (`vendor-scope.ts:~640`) defers to this feature by name, so `getVendorJobLabelKey` can stop guessing the live label by recency.

  ## Context
  Part of feature: order-dispatch-tracking
  Phase: Phase 1 — Database Schema

  **Expect `packages/api/tests/lib/vendor-label-seam.test.ts` to go RED when this lands.** That is designed: its failure message is the checklist for the next ticket. Do not fix it here.

  The token must match `LABEL_TOKEN_PATTERN` in `vendor-scope.ts:530` — `/^[A-Za-z0-9_-]+$/` — because the key it builds is `fulfilment/labels/<token>.pdf` and rides in the path of a signed URL. A random token, following the `production_approvals.approval_token` precedent, and **never the order id**: an order id in a URL path is a stable person-linked handle.

  Express the partial unique index in the drizzle DSL, not only in SQL, so `db:push` and `db:migrate` cannot diverge (#663).
