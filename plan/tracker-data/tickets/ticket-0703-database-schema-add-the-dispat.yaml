  - id: 3
    action: implement
    description: Add the dispatch columns and the one-live-label partial unique index to the drizzle table
    file: packages/api/src/database/schema/shipping.ts
    status: done
    code: |-
      // Add inside the orderShipments column object, after `notes`:

          // ------------------------------------------------------------------
          // Dispatch (order-dispatch-tracking)
          // ------------------------------------------------------------------

          /**
           * The identity-free handle on this shipment's label object.
           *
           * The object lives at `fulfilment/labels/<token>.pdf` and the token rides
           * in the PATH of a signed URL, which is the one place an assertion about
           * JSON keys can never reach. So it is RANDOM — following the
           * `production_approvals.approval_token` precedent — and never the order id,
           * which is a stable person-linked handle.
           *
           * Must match `LABEL_TOKEN_PATTERN` in `lib/vendor-scope.ts`.
           */
          labelObjectToken: text("label_object_token").unique(),

          /**
           * This label is dead: voided, or the shipment cancelled.
           *
           * The marker `lib/vendor-scope.ts` asks for by name. Before it,
           * `getVendorJobLabelKey` chose the live label by recency, because the
           * table had no way to say which one a courier would actually honour.
           */
          voidedAt: timestamp("voided_at", { withTimezone: true }),
          voidedReason: text("voided_reason"),

          /** The courier's own handle on the parcel. */
          awbNumber: varchar("awb_number", { length: 64 }),
          /** The aggregator's ids, so a support call can be traced both ways. */
          externalShipmentId: varchar("external_shipment_id", { length: 64 }),
          externalOrderId: varchar("external_order_id", { length: 64 }),
          /**
           * Who actually carries it, which is not `carrier`.
           *
           * `carrier` is the aggregator we bought through (Shiprocket). This is the
           * courier it picked (Delhivery, Bluedart). Collapsing them loses the only
           * field a customer recognises on a tracking page.
           */
          courierName: varchar("courier_name", { length: 100 }),

          /** What actually went out, which is not what the cart estimated. */
          shippedWeightGrams: integer("shipped_weight_grams"),
          lengthCm: integer("length_cm"),
          widthCm: integer("width_cm"),
          heightCm: integer("height_cm"),

          /**
           * What WE paid, in paise.
           *
           * Not what the customer paid — since shipping was baked into the price the
           * customer pays zero, so this is the only number margin can be computed
           * from. Paise because it is a real cost, not a displayed figure.
           */
          costPaise: integer("cost_paise"),

          /**
           * The consolidating vendor, whose address is the pickup location.
           *
           * `restrict`: a vendor who has despatched an order cannot be deleted out
           * from under the record of where the courier collected it.
           */
          pickupVendorId: uuid("pickup_vendor_id").references(() => vendors.id, {
            onDelete: "restrict",
          }),

      // ...and in the table's second argument, beside the existing indexes:

          /**
           * At most ONE live labelled shipment per order.
           *
           * `order_id` is a plain indexed FK, so an order whose label was voided and
           * re-bought carries several rows. Without this, "which label will the
           * courier honour" is answered by whichever row the planner reached first —
           * and a vendor who reloads their label gets a different PDF.
           *
           * Partial on both predicates, not one: an UNLABELLED shipment (the row
           * `POST /orders/:orderId/ship` creates before a label is bought) is an
           * ordinary state and several of them must not collide.
           */
          liveLabelIdx: uniqueIndex("order_shipments_live_label_idx")
            .on(table.orderId)
            .where(sql`${table.voidedAt} is null and ${table.labelObjectToken} is not null`),
          pickupVendorIdIdx: index("order_shipments_pickup_vendor_id_idx").on(
            table.pickupVendorId
          ),
  - id: 4
    action: implement
    description: Generate the migration and annotate it; confirm it contains no ADD VALUE
    file: packages/api/src/database/migrations/0027_order_shipments_dispatch.sql
