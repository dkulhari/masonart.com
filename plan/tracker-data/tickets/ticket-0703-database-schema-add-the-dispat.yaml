      --
      -- Two of these columns are not new requests. `label_object_token` is read TODAY
      -- by lib/vendor-scope.ts as a raw SQL fragment, which is why the vendor label
      -- route answers 503 in every environment; `voided_at` is the void marker that
      -- file's doc block defers to this feature by name.
      --
      -- The partial unique index is the property `getVendorJobLabelKey` needs: at
      -- most one LIVE LABELLED shipment per order. Unlabelled rows are exempt — the
      -- row POST /orders/:orderId/ship writes before a label is bought is ordinary,
      -- and several must not collide.
  - id: 5
    action: verify-pass
