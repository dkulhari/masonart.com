      1. lib/vendor-scope.ts — replace the LABEL_OBJECT_TOKEN sql fragment
      2. routes/vendor.ts — delete the LabelSeamNotReady branch that answers 503
      3. Delete this test, and check the rest of this file still passes.
      Found in: shipping.ts, 0027_order_shipments_dispatch.sql
      ```
      The other 10 cases in that file still pass, including the one asserting the deliberate failure path is intact.

