      == I RE-MEASURED THE REFERENCE MYSELF. ALL THREE CLAIMS CONFIRMED; ROUND 3's 88% IS WRONG.

      Source `scratchpad/shots/bar-desktop-full.png` (reference home page, 1440x900 viewport, deviceScaleFactor 2). Method: locate each grey plate, take the median of its 4..8px border ring as the plate colour, bound the pixels differing from it by more than an ink threshold. Run at thresholds 8, 20 and 45.

      BAND A — the reference's Best Seller row, 322px plates at x 48/389/729/1070:

        art       261x255   261x256   245x304   233x311
        aspect       1.02      1.02      0.81      0.75
        coverage    64.2%     64.3%     71.8%     70.2%
        spread 1.121 / 1.119 / 1.109x at thr 8 / 20 / 45     mean 67.6%

      Card 4 is 233x311 in a 322px plate = 70.2%, NOT 88%. Round 3's other three figures (65/65/73) are right to within a point. So Band A's real coverage spread is 1.12x, not 1.35x — and 0.554 was fitted to a number the reference never had.

      BAND B — the reference's "New In" rail, same page, and the useful one because its stock is genuinely mixed the way ours is (visually confirmed on a crop: four framed pieces with visible mats):

        art       231x301   261x256   306x156   149x301
        aspect       0.77      1.02      1.96      0.49
        coverage    67.0%     64.4%     46.1%     43.2%     spread 1.550x, mean 55.2%
        mat L/T     46/12     33/33     10/80     87/12

      So: the reference draws a near-square at 261x256 / ~64% in BOTH bands — same shape, same scale, twice, which is a rule — and its own mixed-aspect row spreads 1.55x with 80-87px mats on the elongated pieces. Every one of the three measurements in the correction is confirmed. Mine agrees with yours to within a point everywhere.

      A FOURTH ERROR, same cause, worth recording. Round 3 also read Band B as `96 / 65 / 47 / 96 %`, spread 2.05x, and used it to argue the reference tolerates very uneven rows. That is the SAME artefact read at a low threshold: Band B's cards 1 and 4 are photographed against a wall whose tone sits 1-2 levels off the plate (239,238,237 vs 239,239,239), so at thr 8 their bbox swallows the whole plate and reads 100.0%. At thr 20 and 45 they resolve to 67% and 43%. The reference's New In row spreads 1.55x, not 2.05x. Both of round 3's headline reference figures were threshold artefacts of the same kind.

      == THE CHANGE

      `ART_AREA = 0.554` -> `0.64`. ART_MAX_SIDE, the sort, the plate, the mat colour, the meta row and the mobile quick-add are untouched. 0.64 IS the reference's measured near-square coverage; the row's spread is now an OUTPUT of it rather than the thing being tuned, which is the inversion round 3 got wrong.

      Side effect worth naming: the cap now binds below r = ART_AREA/ART_MAX_SIDE^2 = 0.790 instead of 0.684. On the dev census (r 0.48 x1, 0.51-0.53 x15, 0.62 x1, 0.74-0.78 x11, 0.80 x7, 0.98 x8) that is 28 of 41 products rather than 17, and their coverage lands at 0.81*r — 38.9% at r 0.48 up to 63.2% at r 0.78 — against the flat 64% the other 13 share. Coverage now falls away CONTINUOUSLY with shape rather than splitting the row into "full" and "2:1", which is the reference's own profile in Band B (67/64/46/43 across r 0.77/0.98/0.51/0.49).

