    text: |-
      ✅ **Completed**

      **Commit**: `61e0ff56` — test(audit): fail the build when the registry names an action nothing writes

      **Files Changed**:
      - `packages/api/tests/lib/audit-action-coverage.test.ts` — the guard: scans every `.ts`/`.tsx` file under `packages/api/src` for each member of `AUDIT_ACTIONS`
      - `packages/api/tests/lib/audit-action-waivers.ts` — the waiver manifest plus its two failure-message builders, on the `raw-sql-objects.ts` precedent (#663)
      - `packages/shared/src/schemas/audit-log.ts` — registry header now says the declare-with-your-emitter rule is enforced, names the test and the waiver file, and states the guard's limit

      **The dead list was re-derived, not taken from the ticket.** The ticket's "ten of forty-one" predates the wiring tickets. At `63376f5e` the registry holds **58** actions and the scan finds exactly **two** dead — `wallet.adjusted` and `user.status_changed`, the two the ticket predicted. Nothing beyond them, so no Phase 1 route was missed. #668, #669 and #670 between them account for the rest, including the two actions #670 added (`vendor.created`, `vendor.updated`), both wired in `routes/admin/vendors.ts`.

      Both waivers re-verified at head rather than copied:
      - `wallet.adjusted` — `/api/admin/wallet-config` is two GETs and a PUT writing `wallet_config.updated`. `services/wallet.ts` **does** export `adjustWalletBalance()` (line 652) and **no route calls it** — the capability exists, the endpoint does not.
      - `user.status_changed` — `adminCustomersApp` is two GETs plus the role-change PUT at line 356, which writes `user.role_changed` (4 call sites).

      **Three design points worth recording.**

      *Comments are stripped before matching.* Route files carry doc comments quoting the action they are about, and the registry's own prose names actions it explains. Counting a comment as an emitter would let the guard pass on a file documenting an action it no longer writes — the failure mode the guard exists to catch, one level up. Verified the stricter rule changes nothing at head: same two dead actions with and without stripping.

      *The suite proves it can fail.* A matcher that silently matched everything would make every assertion pass vacuously and leave the registry unguarded with a green build. So one test pins `admin.request` to `middleware/audit.ts` and asserts a fabricated action is reported dead, and another asserts the walk actually read the tree.

      *The waiver list cannot become a graveyard.* Three tests hold it honest: a waiver for an action now written fails; a waiver with no reason fails; a waiver for an action no longer in `AUDIT_ACTIONS` fails.

      Took the review comment's framing into the code: the doc block states the honest claim is "every declared action is **written** somewhere", not "emitted". A literal on an unreachable branch still counts — the `guardFor` and `labelIssued` cases were found by mutation testing, and this guard does not close that third direction.

      **Verification**:
      - Command: `npx vitest run tests/lib/audit-action-coverage.test.ts` (in `packages/api`)
      - Result: PASS (6 tests, 6 passing)
      - Red run first: with `DEAD_AUDIT_ACTION_WAIVERS` temporarily emptied, the guard failed naming both dead actions and both remedies — not a bare count. Waivers restored, green.
      - Typecheck: `tsc --noEmit` clean in `packages/shared`; `tsc --noEmit` and `tsc -p tsconfig.test.json --noEmit` both clean in `packages/api`. The pre-commit hook then ran `turbo run typecheck` across all three packages — 4/4 successful.

      **Scope note, stated rather than hidden**: the full api suite was deliberately not run. The machine is shared with concurrent agents and this change adds two new files under `tests/lib/` and edits one doc comment — no runtime surface, so the suite-wide run had no failure it could have found that the scoped run and the workspace typecheck did not. No route file and no existing test was touched.
