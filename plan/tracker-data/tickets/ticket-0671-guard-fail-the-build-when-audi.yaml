    timestamp: '2026-08-31T01:46:53.243Z'
    text: |-
      Note from the production-pipeline run (feature complete, PR #3).

      **production-pipeline no longer blocks this ticket. Verified at head: all 14 of its actions have emitters.**

      | action | emitter |
      |---|---|
      | `production_job.created`, `.assigned`, `.reassigned`, `.amount_overridden`, `.qc_approved`, `.qc_rejected`, `order.consolidator_set` | `routes/admin/production-jobs.ts` |
      | `production_job.transitioned`, `.transition_refused` | `routes/admin/production-jobs.ts` + `routes/vendor.ts` |
      | `production_job.photos_submitted`, `production_transfer.received` | `routes/vendor.ts` + `lib/vendor-scope.ts` |
      | `production_job.label_issued`, `production_transfer.dispatched` | `routes/vendor.ts` |
      | `production_transfer.declared_lost` | `routes/admin/transfers.ts` |

      **This ticket would have caught a real window.** #679 declared all 14 ahead of their emitters — deliberately, as the one place the "declare in the same phase as the emitter" rule was broken, because the emitters were three phases away. Nothing enforced that except a note in a prompt. Phases 3 and 4 closed it, but if they had not, or had landed in a different order, the registry would have advertised 14 actions nothing wrote and no test would have said so.

      **Remaining blockers are exactly #668, #669, #670 and the waiver list** — twelve dead actions, mapping onto those with nothing left over. Your dependency ordering is right. Suggested sequence: #669 → #668 (payables half only) → #670 → this.

      **One limit worth writing into the ticket, so the guard is not mistaken for more than it is.**

      A static scan proves an action *appears* at a call site. It does not prove the call site is reachable. This run produced two cases where that distinction was the whole defect:

      - **`guardFor`** in `lib/production-transitions.ts` was exported, documented as "the checklist for #680/#681/#684", and **called from nowhere for three phases**. Three guarded edges passed through `PATCH` unchecked, one of which (`qc_passed → dispatched`) wedged an order permanently with no repair path. A presence scan would have seen the export and said nothing.
      - **#693's `labelIssued` chain** passed a guard value "upward only" (`true`, never `false`), and `nextVendorActions` blocks only on an explicit `false` — so it rendered identically to passing nothing. Two branches were unreachable in production and the only test touching them fed a value the app never produced.

      Both were found by adversarial review and mutation testing, not by static presence. So the honest claim for this guard is "every declared action is written somewhere", not "every declared action is emitted". Worth stating in the ticket, because the second reading is the one people will take from a green build.

      Related: the reverse direction is already safe — a typo at a call site fails typecheck against `AuditAction`. This guard closes the other direction. The third direction — declared, present, unreachable — stays open, and mutation testing is currently the only thing that finds it.
