ticket_number: 671
title: Guard - fail the build when AUDIT_ACTIONS declares an action nothing emits
description: |-
  ## Task

  Ten of the forty-one actions in `AUDIT_ACTIONS` are emitted by no code at all. Nothing caught that, because the registry's type safety runs one way: a call site with a typo fails typecheck, but a declared action with no call site is invisible. The registry is meant to be the guard rail and it currently describes a trail wider than the one that exists — the viewer's action filter offers `vendor.payable_settled`, and the empty result reads as "never happened" rather than "never recorded".

  Add a test that scans `packages/api/src` for every member of `AUDIT_ACTIONS` and fails on any that no source file emits, with an explicit waiver list for actions declared ahead of their route.

  ## Context

  This is the same class of guard as `packages/api/src/database/raw-sql-objects.ts` from #663: a manifest plus a test that fails when reality drifts from it. Follow that precedent — the failure message must name the dead action and say what to do, not just assert a count.

  Known waivers at the time of writing, both declared with no write route in the codebase:

  - `wallet.adjusted` — `/api/admin/wallet-config` sets config; there is no admin balance-adjustment endpoint.
  - `user.status_changed` — `users.status` is filterable in `admin/customers.ts` but `adminCustomersApp` exposes only two GETs and the role-change PUT at line 356.

  Each waiver carries a one-line reason in the file. A waiver with no reason is how the list becomes a graveyard.

  The scan is a grep over source text, not a runtime check — an action emitted only on an error branch still counts as wired, and requiring runtime coverage would make the guard hostage to fixture completeness. Depends on the other four tickets landing first, or the guard fails on arrival.
