    expected_result: FAIL until the wiring tickets land - names each dead action
    status: pending
    code: |-
      import { describe, it, expect } from 'vitest'
      import { readdirSync, readFileSync, statSync } from 'node:fs'
      import { join } from 'node:path'
      import { AUDIT_ACTIONS } from '@chobii/shared'

      /**
       * Declared ahead of the route that will emit them. A waiver needs a reason:
       * without one the list becomes a graveyard and the guard stops guarding.
       */
      const WAIVED: Record<string, string> = {
        'wallet.adjusted':
          'No admin balance-adjustment endpoint exists; wallet-config sets config only.',
        'user.status_changed':
          'users.status is filterable in admin/customers.ts but has no write route.',
      }

      function sourceFiles(dir: string): string[] {
        return readdirSync(dir).flatMap((entry) => {
          const path = join(dir, entry)
          if (statSync(path).isDirectory()) return sourceFiles(path)
          return path.endsWith('.ts') ? [path] : []
        })
      }

      describe('every declared audit action has an emitter', () => {
        const corpus = sourceFiles(join(import.meta.dirname, '../../src'))
          .map((path) => readFileSync(path, 'utf8'))
          .join('\n')

        it('leaves no action declared that nothing emits', () => {
          const dead = AUDIT_ACTIONS.filter(
            (action) =>
              !WAIVED[action] &&
              !corpus.includes(`'${action}'`) &&
              !corpus.includes(`"${action}"`)
          )

          expect(
            dead,
            `These actions are in AUDIT_ACTIONS but no source file emits them, so the ` +
              `viewer offers a filter that returns nothing forever. Wire a recordAudit ` +
              `call, or add a waiver with a reason in WAIVED above:\n  ${dead.join('\n  ')}`
          ).toEqual([])
        })

        it('keeps the waiver list honest — a waived action that got wired must leave', () => {
          const stale = Object.keys(WAIVED).filter(
            (action) => corpus.includes(`'${action}'`) || corpus.includes(`"${action}"`)
          )
          expect(stale, `Now emitted; drop from WAIVED: ${stale.join(', ')}`).toEqual([])
        })
      })
