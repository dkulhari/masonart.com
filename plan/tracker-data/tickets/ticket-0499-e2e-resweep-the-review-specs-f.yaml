ticket_number: 499
title: E2E - resweep the review specs for the masonry grid
description: |-
  ## Task

  The specs from #492 assert the old structure: a beige aggregate band, numbered page-2 paging, and a media wall separate from the written reviews. All three are gone. Rewrite them against the grid.

  ## Context

  Part of feature: review-grid-loox-parity
  Phase: E2E
  Depends on: every prior ticket

  - `tests/e2e/review-surfaces.spec.ts` (14 specs) and `tests/e2e/review-media-upload.spec.ts` (3 specs). The upload spec should need little or no change — the submission path did not move.
  - Specs to REPLACE, not delete: the aggregate-header assertion becomes the Loox header row; page-2 paging becomes Show-more appending. Deleting coverage instead of porting it is not acceptable.
  - Keep the toast and home-strip specs untouched — those surfaces did not change.
  - **Scope every selector to the desktop or mobile tree.** The same test ids exist in both; the idiom here is `page.locator('div.hidden.lg\\:block')`. Unscoped selectors are the standard false result in this repo.
  - **Guard against vacuous passes.** Assert the grid actually rendered cards (`expect(count).toBeGreaterThan(0)`) before asserting anything about them.
  - **Never run `./scripts/run-tests.sh e2e`** — it silently reseeds the live dev database on port 5440 while its output claims 5433. It destroyed seeded review data during the last feature. Invoke playwright directly: `bunx playwright test tests/e2e/<file>.spec.ts` from the repo root.
  - Port 5173 is a DIFFERENT app and makes specs pass vacuously. Playwright's baseURL is `http://localhost:3001`.
  - Seed state to rely on: 12 approved reviews across 9 products, 9 media rows, 1 video.
