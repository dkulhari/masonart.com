    text: |-
      ✅ **Completed**

      **Commit**: `88392274` — test(e2e): resweep the review specs onto the masonry grid

      **Files Changed**:
      - `tests/e2e/review-surfaces.spec.ts` — 14 specs → 17, ported onto the grid
      - `tests/e2e/review-media-upload.spec.ts` — comments only; the submission path did not move
      - `packages/web/app/lib/api.ts` — `productsApi.productReviewStats(productId)`
      - `packages/web/app/routes/posters/$slug.tsx` — loader reads the poster's review aggregate
      - `packages/web/app/components/product/ProductDetail.tsx` — buy-box star row is now the jump to `#reviews`
      - `packages/web/app/components/product/ProductReviewSection.tsx` — `scroll-mt-20` so the jump clears the sticky header

      **Summary**:
      Every assertion the rebuild invalidated was ported, none dropped.

      - `reviews-aggregate` → the Loox header row: star row, "<N> Reviews" chevron, the average it discloses, the "Write a review" pill, and its position above the wall.
      - `reviews-pagination` → "Show more reviews" asserted as APPENDING: first page still in front and in order, no id twice. The seed is 12 reviews against a page size of 24, so the button never appears on real data — `shrinkFeedPages` rewrites the pageSize on the request's way to the API and changes nothing else. No stubbed payload.
      - `?page=2` keeps its own spec: nothing reads the param now, but validateSearch still coerces it and the deep link must resolve rather than error-boundary blank.
      - `review-feed-row` → `review-grid-card`, with every card's product chip asserted.
      - The media-wall spec → the fusion spec: one grid holding a review with photos and a review without, scoped to the poster, with `review-media-wall`/`review-media-tile` asserted absent. Lightbox + arrow keys follow the grid's flat list; the clip's no-autoplay/no-preload rule is now asserted in a browser too.
      - The h1 on /reviews is asserted as present-but-clipped rather than visible — the reference page has no visible title.
      - Home strip and toast specs untouched.

      **Found and fixed during the sweep**: `/api/products/:slug` carries no review aggregate (the join lives on the LIST endpoint only), so `product.rating` was undefined on every poster — the buy box's star row AND the stars/count on the new PDP header row rendered on nothing. The loader now reads the aggregate from `/api/products/:id/reviews/stats` in parallel with the related row, never throwing. That made the buy-box "(N reviews)" → `#reviews` jump possible, which is now covered.

      **Verification**:
      - `bunx playwright test tests/e2e/review-surfaces.spec.ts --project=chromium --reporter=line` → **21 passed (1.6m)** — 17 specs + 4 auth setup, 0 failed, 0 skipped, 0 fixme
      - `bunx playwright test tests/e2e/review-media-upload.spec.ts --project=chromium --reporter=line` → **6 passed (48.7s)** — 2 specs + 4 auth setup
      - `bunx vitest run tests/routes/posters-review-section.test.tsx tests/lib/api.test.ts` (packages/web) → **138 passed**
      - `bunx tsc --noEmit` (packages/web) → 22 errors, none in any touched file (pre-existing baseline)

      Run separately, never together: the upload spec borrows a seeded review from the same customer whose no-photo review the PDP fusion spec reads.
