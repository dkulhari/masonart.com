ticket_number: 584
title: Shared - lift the image upload guards out of admin/products
description: |-
  ## Task

  `PRODUCT_IMAGE_TYPES` and `MAX_PRODUCT_IMAGE_MB` are module-private constants in packages/api/src/routes/admin/products.ts:209-210. The frames upload endpoint needs the same MIME allowlist and the same size ceiling.

  Lift both into a shared module and have `admin/products.ts` import them, so the two endpoints cannot end up disagreeing about what an admin may upload. Copying them would be exactly the class of duplicate this feature exists to remove.

  Also add the three reference print prices the admin price preview quotes against, beside `frameAddition` in shared/constants/frames.ts. They live in shared rather than in the form because the preview and its test both need the same figures, and a preview whose reference prices drift from its test asserts nothing.

  ## Context

  Feature: admin-frame-management. Phase 2 (shared contracts). Independent of the schema ticket — can run in parallel with it.

  Files:
  - packages/api/src/routes/admin/products.ts:209-210, :257, :263 (the guards and their two uses)
  - packages/shared/src/constants/frames.ts:570 (frameAddition — put the reference prices next to it)

  Reference prices: 1499, 4999, 14999. Three rather than one, because a frame is priced as a percentage precisely so its cost tracks the size of the piece — a single sample row would conceal the behaviour the admin is choosing.
