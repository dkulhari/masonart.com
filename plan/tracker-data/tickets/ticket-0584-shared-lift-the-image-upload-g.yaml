implementation_steps:
  - id: 1
    action: write-test
    description: Write failing test for the shared upload guards and the preview reference prices
    file: packages/shared/tests/constants/frame-preview.test.ts
    expected_result: FAIL
    status: done
    code: |
      /**
       * The figures the admin frame form quotes against, and the upload guards the
       * frames endpoint shares with the products one.
       *
       * The reference prices are shared rather than inlined in the form because the
       * preview and this test both need them: a preview whose sample prices drift
       * from its test is a preview that asserts nothing.
       */

      import { describe, it, expect } from 'bun:test'
      import {
        FRAME_PREVIEW_REFERENCE_PRICES,
        ADMIN_IMAGE_MIME_TYPES,
        MAX_ADMIN_IMAGE_MB,
        frameAddition,
      } from '../../src/index'

      describe('FRAME_PREVIEW_REFERENCE_PRICES', () => {
        it('spans small to large, because a multiplier behaves differently across them', () => {
          expect(FRAME_PREVIEW_REFERENCE_PRICES).toEqual([1499, 4999, 14999])
        })

        it('is more than one price — one sample would hide what a multiplier does', () => {
          expect(FRAME_PREVIEW_REFERENCE_PRICES.length).toBeGreaterThan(1)
        })

        it('produces a visibly different uplift at each rung', () => {
          const frame = { priceModifier: '1.40', priceAddition: '0.00' }
          const uplifts = FRAME_PREVIEW_REFERENCE_PRICES.map((p) =>
            frameAddition(p, frame)
          )
          expect(new Set(uplifts).size).toBe(uplifts.length)
        })
      })

      describe('admin image upload guards', () => {
        it('allows the three formats the product uploader already allows', () => {
          expect(ADMIN_IMAGE_MIME_TYPES).toEqual([
            'image/jpeg',
            'image/png',
            'image/webp',
          ])
        })

        it('keeps the existing 10MB ceiling', () => {
          expect(MAX_ADMIN_IMAGE_MB).toBe(10)
        })
      })
  - id: 2
    action: verify-fail
    description: Confirm the test fails
    command: cd packages/shared && bun test tests/constants/frame-preview.test.ts
    expected_result: FAIL - no export named 'FRAME_PREVIEW_REFERENCE_PRICES'
    status: done
  - id: 3
    action: implement
    description: Add the reference prices beside frameAddition and the upload guards
    file: packages/shared/src/constants/frames.ts
    status: done
    code: |-
      // Append below frameAddition, so the formula and the figures that demonstrate
      // it sit together:

      /**
       * The print prices the admin frame form quotes a frame against.
       *
       * Three rather than one. A frame is priced as a proportion of the piece
       * precisely so its cost tracks the size of it — a single sample row would show
       * the admin a number while hiding the behaviour they are actually choosing.
       * Small, mid and large, spanning the catalogue.
       */
      export const FRAME_PREVIEW_REFERENCE_PRICES: readonly number[] = [
        1499, 4999, 14999,
      ];

      /**
       * What an admin may upload as imagery, shared by the product and frame
       * endpoints. Two endpoints with two private copies of this is how one of them
       * ends up quietly accepting a format the pipeline cannot process.
       */
      export const ADMIN_IMAGE_MIME_TYPES: readonly string[] = [
        'image/jpeg',
        'image/png',
        'image/webp',
      ];

      export const MAX_ADMIN_IMAGE_MB = 10;

      // Export all three from packages/shared/src/index.ts if constants/frames is not
      // already re-exported wholesale.
