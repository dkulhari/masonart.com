    text: |-
      ✅ **Completed**

      **Commit**: `e55ec152` - feat(web): join-the-gallery modal, one email field

      **Files Changed**:
      - `packages/web/app/components/promo/JoinGalleryModal.tsx` - new dialog
      - `packages/web/tests/components/promo/JoinGalleryModal.test.tsx` - 20 tests

      **Summary**:
      - Headline and depth come from `GET /api/promotions/active` (#432). No discount is written down in the component; no active promotion (or a failed lookup) renders `null`. `percentOff: null` (fixed-amount sale) drops the percentage line rather than printing `null%`.
      - The promotion can be handed in via a `promotion` prop by a surface that already fetched it (the banner, #445); otherwise the modal fetches it itself, via `${getApiUrl()}/api/promotions/active` with `credentials: 'include'` so the per-visitor countdown cookie is not re-minted on every open.
      - Exactly one field, asserted by count: `input, select, textarea` inside the dialog must be length 1 and `type="email"`. No name, phone, checkbox or radio.
      - Signed in → `useGalleryMembership().join(source)` in place, with the address prefilled from the session. Guest → `navigate({ href: '/auth/register?join=gallery&email=<encoded>' })`, which #441 picks up.
      - Session read from `useRouteContext({ from: '__root__' })`, not better-auth's `useSession()` — same no-flash reasoning as #443.
      - A `join()` that resolves false sets in-component error state and keeps the dialog open; `onClose` is not called. `window.alert` / `window.confirm` are stubbed in the suite and asserted never called.

      **Spec notes for whoever picks up #445/#446**:
      1. The ticket says "shadcn/ui dialog" but `packages/web/app/components/ui/` has no dialog primitive and the package has no Radix dependency. Followed the repo's actual modal pattern (`components/reviews/ReviewModal.tsx`: `role="dialog"` + `aria-modal` + backdrop + Escape).
      2. `app/routes/auth/register.tsx` still validates search as `z.object({ redirect: z.string().optional() })`, which strips `join` and `email`. Navigation uses `href` (a fully built URL) rather than `{ to, search }` for that reason, but **#441 must widen that schema** or the intent is dropped at the destination.

      **Verification**:
      - Command: `cd packages/web && bunx vitest run tests/components/promo/JoinGalleryModal.test.tsx`
      - Result: PASS (20 tests, 20 passing, 0 failing)
      - Also: `bunx tsc --noEmit -p tsconfig.json` reports no errors in either new file.
