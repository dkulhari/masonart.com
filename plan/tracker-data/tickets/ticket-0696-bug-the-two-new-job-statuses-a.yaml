ticket_number: 696
title: Bug - the two new job statuses are settable and unrenderable before the guard lands
description: |-
  ## Task
  Close the window #673 opened. Add `dispatched` to `CLOSED_JOB_STATUSES`, and extend the status vocabularies in the admin queue and the vendor portal so the two new values render and filter.

  ## Context
  Found by the Phase 1 adversarial review. Feature: production-pipeline.

  #673 added `qc_submitted` and `dispatched` to `production_job_status`. Three places derive from that enum automatically and were widened without anyone touching them; three more are hardcoded 7-value lists and were NOT widened. The mismatch is live right now, before the state machine (#676) and the guarded PATCH (#680) exist.

  Widened automatically, with no guard:
  - `packages/api/src/routes/admin/production-jobs.ts:141` — `status: z.enum(productionJobStatusEnum.enumValues).optional()`, and the handler at `:522-530` does a blind `.set({ ...body, updatedAt })`. Its own comment admits there is no transition guard. So `PATCH {status:'dispatched'}` on a `draft` job succeeds today: terminal state, `dispatched_at` NULL, no vendor, no QC photo, no review row. `{status:'qc_submitted'}` puts a job into the exact state the future label gate reads as its precondition, with an empty shot list.

  NOT widened, so the rows become invisible:
  - `packages/api/src/routes/admin/vendors.ts:101` — `CLOSED_JOB_STATUSES = ['qc_passed','cancelled']` omits `dispatched`, used at `:297` via `notInArray`. **A dispatched job counts as an open job against its vendor forever.** This is the one that survives Phase 2, because no other ticket touches this file.
  - `packages/web/app/routes/admin/production/index.tsx:66-101` — `STATUS_LABELS['dispatched']` is `undefined`, so the badge renders blank; `:143-144` `z.enum(PRODUCTION_STATUSES).catch(undefined)` silently drops `?status=dispatched`, so the row cannot be filtered for.
  - `packages/web/app/lib/vendor-nav.ts:42-69` — same gap in the vendor portal.

  ## Scope boundary

  #680 closes the unguarded PATCH by routing it through `assertTransition`, and #688/#691 rebuild the two UI vocabularies. **This ticket exists for `CLOSED_JOB_STATUSES`, which nothing else touches** — do that one regardless. Treat the rest as the checklist that proves the window is shut, and close it here only if Phase 2 has not reached it yet.

  Design constraints:
  - `dispatched` is a terminal state and means this vendor's custody ended, so it is closed for the purpose of an open-job count. `qc_submitted` is NOT closed — the ball is in our court and the job is still live.
  - Do not add a transition guard here. That is #676 plus #680, and half a state machine in a route is what this feature exists to unpick.
  - Regression test must assert the open-job count against a vendor with a dispatched job, not just that the constant contains the string.
