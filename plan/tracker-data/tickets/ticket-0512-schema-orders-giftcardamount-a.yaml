    description: Add the enum value and the tender column
    file: packages/api/src/database/schema/orders.ts
    status: done
    code: |-
      // At the orderType enum (~line 122), add a fourth value:
      export const orderTypeEnum = pgEnum("order_type", [
        "regular",
        "ai_generated",
        "trade",
        "gift_card", // buys a gift card; no shipping, no tax, not from the cart
      ]);

      // Beside the pricing breakdown, AFTER `total` — its position in the file
      // mirrors its position in the money path: tender comes off the total, it is
      // not one of the discount buckets above it.

          /**
           * Gift card tender applied to this order, in rupees.
           *
           * NOT a discount: never summed into `discount`, never beside
           * couponDiscount / promotionDiscount / tradeDiscount. It reduces the
           * amount due after tax. What Razorpay is asked for stays derived:
           *   toPaise(total) - toPaise(giftCardAmount)
           * so there is exactly one source of truth for what the customer owes.
           */
          giftCardAmount: decimal("gift_card_amount", { precision: 10, scale: 2 })
            .default("0.00")
            .notNull(),
