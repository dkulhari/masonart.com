ticket_number: 512
title: Schema - orders.giftCardAmount and the gift_card order type
description: |-
  ## Task
  Add `orders.giftCardAmount` decimal(10,2) default `'0.00'`, and a fourth value `'gift_card'` on the `orderType` enum (`schema/orders.ts:122`). Migration included.

  ## Tender, not a discount
  `giftCardAmount` is never summed into `orders.discount` and never sits beside `promotionDiscount` / `couponDiscount` / `tradeDiscount` as a discount bucket. It reduces the amount due *after* tax. The charged amount stays derived rather than stored:

  ```
  razorpayAmount = toPaise(order.total) − giftCardAmountPaise
  ```

  Storing a second money total would give two sources of truth for what the customer owes.

  ## Context
  Part of feature: gift-cards
  Phase: 1 — Schema + contracts
  Design: `docs/superpowers/specs/2026-08-06-gift-cards-design.md` §4, §5

  The `gift_card` order type exists because a card is bought through its own flow, not the cart (G7) — `cart_items.productId` and `variantId` are both NOT NULL (`schema/cart.ts:115-121`).
