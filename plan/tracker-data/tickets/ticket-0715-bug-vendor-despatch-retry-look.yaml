ticket_number: 715
title: 'Bug: vendor despatch retry looks inert and queues reads; carrier length only validated server-side'
description: |-
  ## Task

  Two operator-facing defects in `packages/web/app/routes/vendor/index.tsx` from `5652a799`. Verified against the file directly.

  Filed by a different session working on an unrelated branch — not fixed here, because the file belongs to live work elsewhere.

  ### 1. "Try again" gives no feedback and each click queues another read (`:1080`)

  The panel checks `error` before `isLoading` in its render chain (confirmed: the `error ? ... : isLoading ? <DespatchSkeleton /> : ...` ternary), and `loadCandidates` only calls `setCandidatesError(null)` **on success** (`:1364`), inside the `try`.

  So when a read fails and the operator clicks "Try again": the error banner stays, the button stays enabled, and no skeleton or spinner appears. Nothing on screen changes. They click again, and again — each firing an unguarded `GET /transfers/candidates`.

  This compounds the stale-response defect filed alongside this ticket: repeated clicking is exactly what produces out-of-order responses.

  Fix: clear the error (or disable the button) when the retry starts, not when it succeeds.

  ### 2. Carrier and reference length is validated server-side only (`:912`)

  `createTransferSchema` in `packages/api/src/routes/vendor.ts` caps both at `max(120)`. The panel pre-validates only `pieceCount` — confirmed: no `maxLength` attribute anywhere in `vendor/index.tsx`.

  Repro: paste a 150-character carrier name and submit. `.strict()` rejects it and the bucket shows `Invalid request body` verbatim, with nothing indicating which field is wrong. That is precisely the bare-400 outcome the `promisedInstant` handling was written to prevent for the date field.

  Fix: add `maxLength={120}` to both inputs plus the same local check that `piecesValid` already does, so the operator sees which field is wrong before a round trip.

  ## Context

  Both are small, but they land on the same screen and on the same person — a vendor who cannot tell whether their click did anything, and cannot tell which field the server rejected.
