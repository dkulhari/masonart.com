      ✅ **Completed**

      **Commit**: `d0a1069c` - fix(vendor): name the field the despatch docket got wrong, and pin the retry

      **Files Changed**:
      - `packages/web/app/routes/vendor/index.tsx` — `VENDOR_TRANSFER_TEXT_MAX`, `maxLength` on both inputs, `overLongField` check, `canSubmit`
      - `packages/web/tests/routes/vendor/vendor-screens.test.tsx` — 6 new tests

      **Summary**:

      **Defect 2 (carrier/reference length)** — fixed here, TDD'd. Both inputs carry `maxLength={120}`, and a local `overLongField` check names which of the two is too long, mirroring what `piecesValid` already did for the count. The check exists as well as the attribute because `maxLength` stops typing, and neither a paste nor a scripted change is typing. `canSubmit` now folds pieces, length and busy into one predicate.

      **Defect 1 (retry feedback)** — **already fixed, not by this commit.** Extracting the loader into `useVendorDespatch` for #714 moved `setError(null)` from the success path to the start of the read. Its two tests passed the first time they ran, so they were never driven red here. They are committed as regression cover, not as a claim of work done. The observable behaviour: clicking "Try again" clears the banner immediately, the panel falls to the `data === null` branch and shows the skeleton, and the retry button disappears with the banner — so the "each click queues another read" half is closed too, since there is no button to click during the read.

      **Root Cause** (defect 2): `packages/web/app/routes/vendor/index.tsx` — the form pre-validated `pieceCount` only, so carrier and reference reached a `.strict()` schema that answers with an unfielded 400.

