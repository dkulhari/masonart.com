    description: Thread the shipment into the SMS builder
    file: packages/api/src/services/notifications.ts
    status: pending
    code: |-
      // The shipment is PASSED IN, not queried. This module is called from several
      // places and giving it its own read would mean four callers each choosing which
      // shipment is live — which is the exact defect this phase removes.
      //
      // Around line 158:

          case "shipped":
            // The LIVE shipment's URL, or the orders page. The old `||` read a jsonb
            // nothing writes any more, so the fallback would have become the only
            // branch — every shipped SMS pointing at a generic page.
            return `chobii.art: Your order ${orderNumber} has shipped! Track: ${
              shipment?.trackingUrl ?? "chobii.art/orders"
            }`;

      // Add `shipment` to the function's parameters and to every call site. Let the
      // typechecker find them: packages/api is typechecked including its tests
      // (#662), so a missed caller is a build failure, not a runtime surprise.
  - id: 4
    action: implement
    description: Thread the shipment into the email templates
    file: packages/api/src/services/email-templates.ts
    status: pending
    code: |-
      // Lines ~303-307 and ~378. Same rule: passed in, never queried — this module
      // has no database import today and giving it one would make every template test
      // need a mock.
      //
      // The fallbacks STAY, because "no shipment yet" is a real state an email can be
      // sent in. What changes is that they are reached for that reason and not
      // because the code read a column nothing writes.

        const trackingUrl = shipment?.trackingUrl ?? `${SITE_URL}/orders`;
        // The COURIER, not the aggregator. A customer recognises 'Delhivery'; nobody
        // outside this office recognises the name of the platform we bought through.
        const carrier = shipment?.courierName ?? shipment?.carrier ?? "our carrier partner";
        const trackingNumber = shipment?.trackingNumber ?? "";
        const estimatedDelivery = shipment?.estimatedDeliveryAt ?? null;
