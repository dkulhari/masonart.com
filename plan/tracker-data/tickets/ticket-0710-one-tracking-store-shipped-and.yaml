ticket_number: 710
title: One Tracking Store - Shipped and delivered notifications read the shipment
description: |-
  ## Task
  The shipped SMS and the shipped email both read the store nobody writes:

  - `packages/api/src/services/notifications.ts:158` — `order.shippingDetails?.trackingUrl || "chobii.art/orders"`. The `||` means every shipped SMS has quietly linked to a generic page instead of the customer's parcel.
  - `packages/api/src/services/email-templates.ts:303-307` and `:378` — `trackingUrl`, `carrier`, `trackingNumber`, `estimatedDelivery`, all from the same jsonb. The carrier falls back to the string `"our carrier partner"`.

  After this phase that jsonb stops being written, so these go from wrong-but-populated to permanently empty. They move with it.

  ## Context
  Part of feature: order-dispatch-tracking
  Phase: Phase 3 — One tracking store

  Depends on the tracking-read ticket for the `liveShipmentFor` shape — use the same predicate. If it is worth exporting from a shared place rather than duplicating, do that; a second copy of "which shipment is live" is the class of bug this whole phase is about.

  These are pure-ish template functions taking an `order`. Thread the shipment in as a second argument rather than making them query — `email-templates.ts` has no database import today and giving it one would make every template test need a mock.

  Keep the fallbacks, but make them honest. "our carrier partner" is fine when there is genuinely no shipment yet. What is not fine is it appearing because the code read the wrong column.
