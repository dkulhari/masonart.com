    action: write-test
    description: 'Write the failing test: the shipped SMS and email carry the real tracking URL'
    file: packages/api/tests/services/shipped-notification-tracking.test.ts
    command: cd packages/api && bunx vitest run tests/services/shipped-notification-tracking.test.ts
    expected_result: FAIL
    status: pending
    code: |
      /**
       * The shipped notification links to the parcel, not to a generic page.
       *
       * `notifications.ts:158` read `order.shippingDetails?.trackingUrl` and fell
       * back to `chobii.art/orders` with a `||`. Because the admin screen wrote that
       * jsonb and nothing else did, the value was sometimes there — which is why the
       * fallback was never noticed. After this phase the jsonb is not written at all,
       * so the fallback would be the only branch left.
       */

      import { describe, it, expect } from 'vitest'
      import { buildOrderSms } from '../../src/services/notifications'
      import { renderShippedEmail } from '../../src/services/email-templates'
      import '../setup'

      const ORDER = { orderNumber: 'CH-1042', shippingDetails: null } as const
      const SHIPMENT = {
        carrier: 'Shiprocket',
        courierName: 'Delhivery',
        trackingNumber: 'AWB55512345',
        trackingUrl: 'https://track.example/AWB55512345',
        estimatedDeliveryAt: new Date('2026-09-04T00:00:00Z'),
      } as const

      describe('the shipped SMS', () => {
        it('links to the parcel when a shipment exists', () => {
          const text = buildOrderSms('shipped', ORDER, SHIPMENT)
          expect(text).toContain(SHIPMENT.trackingUrl)
          expect(text).not.toContain('chobii.art/orders')
        })

        it('falls back only when there is genuinely no shipment', () => {
          const text = buildOrderSms('shipped', ORDER, null)
          expect(text).toContain('chobii.art/orders')
        })

        it('never reads shippingDetails', () => {
          // The jsonb is not written after this phase. A read of it is a silent
          // permanent empty, not a fallback.
          const withStale = { ...ORDER, shippingDetails: { trackingUrl: 'https://stale.example' } }
          const text = buildOrderSms('shipped', withStale, SHIPMENT)
          expect(text).not.toContain('stale.example')
        })
      })

      describe('the shipped email', () => {
        it('names the COURIER, which is what the customer recognises', () => {
          // `carrier` is the aggregator we bought through.
          const html = renderShippedEmail(ORDER, SHIPMENT)
          expect(html).toContain('Delhivery')
        })

        it('carries the tracking number and the link', () => {
          const html = renderShippedEmail(ORDER, SHIPMENT)
          expect(html).toContain(SHIPMENT.trackingNumber)
          expect(html).toContain(SHIPMENT.trackingUrl)
        })

        it("says 'our carrier partner' only when there is no shipment at all", () => {
          expect(renderShippedEmail(ORDER, null)).toContain('our carrier partner')
          expect(renderShippedEmail(ORDER, SHIPMENT)).not.toContain('our carrier partner')
        })
      })
