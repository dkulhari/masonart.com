ticket_number: 45
title: Database Schema - Extended AI Generator Tables
description: |-
  ## Overview
  Extend database schema to support new AI generator features.

  ## Tasks
  1. Add new style presets to the stylePreset enum (5 new styles)
  2. Create userColorPalettes table for saved custom palettes
  3. Add referenceImageUrl and referenceImageWeight fields to aiGenerations table
  4. Add upscaledImageUrl and upscaleMultiplier fields to AI image data structure
  5. Create aiPromptSuggestions table for caching popular suggestions
  6. Add migration file for all schema changes

  ## Schema Changes
  - New style presets: ink-wash, digital-art, minimalist-modern, impressionist, art-deco
  - userColorPalettes: id, userId, name, colors (JSONB), isDefault, createdAt
  - aiGenerations: referenceImageUrl, referenceImageWeight (0.1-1.0)
  - AIGeneratedImageData: upscaledImageUrl, upscaleMultiplier

  ## Acceptance Criteria
  - [ ] All migrations run successfully
  - [ ] Existing data is preserved
  - [ ] TypeScript types are updated
  - [ ] Indexes added for common queries
