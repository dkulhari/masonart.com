  - id: 4
    action: implement
    description: Read the prior row before PATCH updates it, then record the delta on every production mutation
    file: packages/api/src/routes/admin/production-jobs.ts
    status: pending
    code: |-
      import { recordAudit, diffRecords } from '../../lib/audit'

      // PATCH /:jobId — the update currently runs first, so there is no `before` to
      // diff against. Read it, then update.
      const [existing] = await db
        .select()
        .from(productionJobs)
        .where(eq(productionJobs.id, jobId))
        .limit(1)

      if (!existing) {
        await recordAudit(c, {
          action: 'production_job.status_changed',
          entityType: 'production_job',
          entityId: jobId,
          outcome: 'failure',
          summary: `Refused: production job ${jobId} not found`,
        })
        return c.json({ error: 'Production job not found' }, 404)
      }

      const [job] = await db
        .update(productionJobs)
        .set({ ...body, updatedAt: new Date() })
        .where(eq(productionJobs.id, jobId))
        .returning()

      const { before, after } = diffRecords(existing, job)

      // An amountActual override is a different question from a stage move, and a
      // money filter must find it without also returning every print/frame step.
      await recordAudit(c, {
        action: body.amountActual !== undefined
          ? 'production_job.amount_overridden'
          : 'production_job.status_changed',
        entityType: 'production_job',
        entityId: jobId,
        before,
        after,
        summary: body.amountActual !== undefined
          ? `Job ${jobId} payable overridden to ${body.amountActual}`
          : `Job ${jobId} ${existing.status} → ${job.status}`,
      })

      // POST /:jobId/assign — after the update, and on the 422 refusal path too:
      await recordAudit(c, {
        action: 'production_job.assigned',
        entityType: 'production_job',
        entityId: jobId,
        before: { vendorId: job.vendorId, status: job.status, amountExpected: job.amountExpected },
        after: { vendorId, status: 'assigned', amountExpected },
        summary: `Job ${jobId} assigned to ${vendor.name} at ${amountExpected}`,
      })
