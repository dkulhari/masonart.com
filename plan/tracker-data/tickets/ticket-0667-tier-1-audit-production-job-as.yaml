ticket_number: 667
title: Tier 1 - audit production job assignment, status transitions and amount overrides
description: |-
  ## Task

  `routes/admin/production-jobs.ts` contains zero `recordAudit` calls, and `AUDIT_ACTIONS` declares no `production_job.*` action at all. Every mutation on the production queue lands only the middleware floor row from `index.ts:226` — action `admin.request`, category `config`, summary `PATCH /api/admin/production/<id> → 200`, metadata limited to status/params/query. No `entityType`, no `entityId`, no `before`/`after`, because a middleware cannot know what changed.

  So the audit log can prove somebody hit a job's endpoint and got a 200. It cannot say which stage the job moved from or to, which vendor it was assigned to, or what `amountActual` was overridden to — and that last one is money we pay a supplier.

  This is the same tier as #641 (returns), #642 (orders) and #643 (privilege and tender): money paths that cannot be backfilled.

  ## Context

  Routes to cover in `packages/api/src/routes/admin/production-jobs.ts`:

  - `POST /` (line 279) — job + items created in one transaction
  - `POST /:jobId/assign` (line 397) — prices against the live rate card, writes `vendorId`, `amountExpected`, `assignedAt`, `status: 'assigned'`. This is the moment vendor cost is committed, so it is a `money` row.
  - `PATCH /:jobId` (line 514) — `amountActual` override, dates, `status`. The header states there is deliberately no transition guard, so the audit row is the only record of an illegal or surprising jump.
  - `POST /:jobId/reviews` (line 554) — QC verdict

  **Implementation hazard:** PATCH currently issues the `UPDATE ... RETURNING` first and never reads the prior row, so `before` is not available at the call site. It needs a `SELECT` ahead of the update, then `diffRecords(before, after)` from `lib/audit` — the same shape `routes/admin/frames.ts:233` already uses.

  `production_job_reviews` is already INSERT-only with a `reviewerId`, so its own history survives. The audit row duplicates the actor fact deliberately — the schema header for `admin_audit_log` says one place must answer "who did what", always.

  Category: all `production_job.*` under `money`. The route header justifies `requireAdmin` on exactly that ground — "these rows carry what we pay a supplier".

  Follow the test shape in `packages/api/tests/routes/admin/catalogue-audit.test.ts` (hoisted db mock, `recordAudit` spied via `vi.mock` over `../../../src/lib/audit`).
