ticket_number: 637
title: Core - payload redactor and before/after delta helpers
description: |-
  ## Task
  Add `redactAuditPayload()` and `diffRecords()` in the audit lib. The redactor drops any key matching /password|token|secret|otp|signature|cvv|card/i (recursively, arrays included) and truncates strings over 2KB. `diffRecords` returns only the keys that actually changed, so the jsonb columns stay small.

  ## Context
  Part of feature: admin-audit-log (Phase 2 - Core)
  Spec: docs/plans/2026-08-17-logging-and-auditing.md D7 and section 3.3
  Pure functions, no DB, no Hono — they must be unit-testable without a database.
