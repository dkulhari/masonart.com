ticket_number: 358
title: "BUG: Track page placeholder shows stale 'MA-2024-001234' masonart order prefix"
description: |-
  ## Problem

  The order-number field on `/track` uses the placeholder `e.g., MA-2024-001234`. The `MA-` prefix is left over from the pre-rebrand **masonart** identity. After the rename to chobii.art this either misleads customers about their order-number format, or points at a real inconsistency if orders genuinely still carry an `MA-` prefix.

  **Verified on production chobii.art at 390x844, 2026-07-28.**

  The rebrand tickets (#298-#311, plus corrections #317/#318) swept the codebase for masonart references; this placeholder string was missed.

  ## Fix

  First determine what prefix the order-number generator actually emits today, then either:
  - update the placeholder to match the real format, or
  - if orders really are still prefixed `MA-`, raise that separately — it is a bigger rebrand gap than a placeholder string

  While in here, grep for any other surviving `MA-` / `masonart` user-facing strings.

  ## Acceptance criteria

  - The placeholder matches the order-number format the system actually generates
  - No user-facing `masonart` or `MA-` references remain
