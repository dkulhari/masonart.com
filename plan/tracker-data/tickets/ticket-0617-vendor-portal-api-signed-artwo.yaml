    text: |-
      Done in f89f3783. 107 tests passing across tests/routes/vendor/ + tests/lib/vendor-*.

      Artwork: GET /api/vendor/jobs/:id/artwork/:itemId, 300s presigned URL via getPresignedDownloadUrl. Key resolved by a new scoped read getVendorJobArtwork(vendorId, jobId, itemId) — enrolled in the vendor-scope contract test. Job loaded scoped FIRST, so the presigner is never reached on a cross-vendor miss (asserted as call count 0, not as a 404).

      Isolation suite (tests/routes/vendor/isolation.test.ts) is driven from ROUTE_TABLE, diffed both ways against vendorApp.routes so an uncovered new route fails the first test. Property 2 asserts on the SELECT projection (no wholesale db.select(), no forbidden column) as well as a recursive case-insensitive body walk, and the walker has its own not-vacuous test.

      TWO REAL LEAKS FOUND AND FIXED, both narrowed at source:
      1. getVendorJobItems selected production_job_items.orderItemId — a direct handle into the customer's order, contradicting the module's own "no person-linked order reference" absolute. Nothing consumed it (artwork keys on production_job_items.id). Dropped from the select.
      2. The artwork key was whatever snapshot.imageUrl decoded to, making the route a general-purpose bucket signer. Several prefixes are user-partitioned (ai-generations/<userId>/, avatars/<userId>/) and the key rides inside the signed URL where a JSON-key assertion cannot see it. Allow-listed to products/, failing closed; custom per-customer artwork will need copying to an identity-free job-scoped key before it can reach a vendor.
