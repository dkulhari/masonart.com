    text: |-
      ✅ **Completed**

      **Commit**: `0127ad3` — fix(api): file the vendor invite under privilege, in both directions

      **Files Changed**:
      - `packages/api/src/routes/admin/vendor-invite.ts` — emits `vendor.user_created` and `vendor.invited`
      - `packages/api/tests/routes/admin/vendor-invite.test.ts` — new "the privilege trail" section, 6 cases

      **Summary**:

      Both actions are emitted **after** the grant transaction commits and **without** sharing it (`recordAudit(c, entry)`, two args). Per `lib/audit.ts`: the grant is already true by then so the row is not a lie, and a row that shared the transaction would be rethrown into a grant that had nothing wrong with it — and on the failure path would be rolled back by the very failure it exists to describe.

      Paths covered:

      | path | rows |
      |---|---|
      | new account minted | `vendor.user_created` (user/`newUserId`) + `vendor.invited` (vendor/`id`), both success |
      | existing unlinked vendor login adopted | `vendor.invited` only, `after.created: false` — nothing minted, but access to a vendor's data was granted |
      | compensating-delete rollback | both actions with `outcome: 'failure'`, `before: {id, email}` / `after: null`, and `metadata.orphanRemoved` |

      `orphanRemoved` is the fact nothing else carries: the existing `logger.error` on a failed cleanup is for us, but whoever opens the privilege filter later needs to know whether that account is still out there with a role on it. This is what closes "created-then-deleted leaves no evidence in either direction".

      The invitee's address is snapshotted into `after` on every row — `actor_email` is the admin who sent the invite, not who was let in.

      **Deliberately not in scope**:
      - `user.status_changed` — untouched, waiver list in #671 as the description directs.
      - `AUDIT_ACTIONS` registry — untouched.
      - The 409 (existing customer) and 422 (already linked) refusals mint nothing and grant nothing, so they claim no precise row; `middleware/audit.ts` still files the attempt as a floor row, and the existing assertions that those paths write *nothing* stay meaningful.

      **Verification**:
      - Command: `npx vitest run tests/routes/admin/vendor-invite.test.ts tests/routes/admin/privilege-audit.test.ts` (cwd `packages/api`)
      - Result: PASS — 2 files, **31 tests passing** (was 25 before; 6 new, 0 regressions)
      - Red step evidence: the 6 new cases failed with `expected [] to deeply equal [ 'vendor.user_created', 'vendor.invited' ]` / `expected "vi.fn()" to be called 2 times, but got 0 times` while all 25 pre-existing tests stayed green.
      - Typecheck: `turbo run typecheck` green in the pre-commit gate (4/4 tasks, includes `tsc -p tsconfig.test.json`).

      Note: the test file now stubs `src/lib/audit` the way `privilege-audit.test.ts` does. Besides matching the ticket's stated assertion shape, it keeps `admin_audit_log` inserts out of the recording mock's `queries` array, so the pre-existing refusal assertions (`queries.some(q => q.op === 'insert')` is false) keep meaning "this route wrote nothing".
