ticket_number: 669
title: Bug - vendor invite creates a user and grants a role with no privilege audit row
description: |-
  ## Task

  `vendor.invited` and `vendor.user_created` are in `AUDIT_ACTIONS` under category `privilege`, alongside `user.role_changed` which #643 wired. Neither string appears in `packages/api/src`. `routes/admin/vendor-invite.ts:98` creates a user row and grants that account vendor access, and the only trace is a floor row filed under `config` — so the privilege filter, one of the two launch-gate categories, does not show the single route in the codebase that mints a new privileged account.

  The route already has a compensating delete at line 240 (`db.delete(users)` when the invite fails downstream), which means a created-then-deleted account can currently leave no evidence in either direction.

  ## Context

  `user.status_changed` is also declared and never emitted, but that one is not a wiring bug: `users.status` is readable and filterable in `routes/admin/customers.ts` (line 106, 156, 247) and there is no write endpoint for it — `adminCustomersApp` exposes only two GETs and the role-change PUT at line 356. It belongs on the waiver list in the coverage guard ticket, not here. Add the emitter in the same commit as the future suspend/reactivate endpoint.

  Snapshot the invited email into the row. `actor_email` is the person who sent the invite; the invitee's address is the subject of the action and belongs in `after`.

  Existing suite to extend: `packages/api/tests/routes/admin/vendor-invite.test.ts`. Assertion shape: `packages/api/tests/routes/admin/privilege-audit.test.ts`.
