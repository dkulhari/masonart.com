  - id: 1
    action: write-test
    description: Assert the invite emits both privilege actions, and that a rolled-back invite still leaves evidence
    file: packages/api/tests/routes/admin/privilege-audit.test.ts
    command: cd packages/api && bunx vitest run tests/routes/admin/privilege-audit.test.ts
    expected_result: FAIL - vendor-invite emits neither action
    status: pending
    code: |-
      it('records the account it minted and the vendor it was granted', async () => {
        // ...invite fixtures...
        expect(recordAudit).toHaveBeenCalledWith(
          expect.anything(),
          expect.objectContaining({
            action: 'vendor.user_created',
            entityType: 'user',
            after: expect.objectContaining({ email: 'printer@example.com', role: 'vendor' }),
          })
        )
        expect(recordAudit).toHaveBeenCalledWith(
          expect.anything(),
          expect.objectContaining({
            action: 'vendor.invited',
            entityType: 'vendor',
            entityId: VENDOR_ID,
          })
        )
      })

      it('leaves a failure row when the invite is compensated away', async () => {
        // force the downstream failure that triggers db.delete(users) at line 240
        expect(recordAudit).toHaveBeenCalledWith(
          expect.anything(),
          expect.objectContaining({ action: 'vendor.invited', outcome: 'failure' })
        )
      })
  - id: 2
    action: verify-fail
    description: Confirm the new cases fail while the rest of the privilege suite still passes
    command: cd packages/api && bunx vitest run tests/routes/admin/privilege-audit.test.ts
    expected_result: FAIL - only the new cases
    status: pending
  - id: 3
    action: implement
    description: Emit both actions, including on the compensating-delete path
    file: packages/api/src/routes/admin/vendor-invite.ts
    status: pending
    code: |-
      import { recordAudit } from '../../lib/audit'

      await recordAudit(c, {
        action: 'vendor.user_created',
        entityType: 'user',
        entityId: newUserId,
        after: { email, role: 'vendor', vendorId },
        summary: `Created vendor account ${email} for vendor ${vendorId}`,
      })

      await recordAudit(c, {
        action: 'vendor.invited',
        entityType: 'vendor',
        entityId: vendorId,
        after: { email, userId: newUserId },
        summary: `Invited ${email} to vendor ${vendorId}`,
      })

      // On the compensating path beside `db.delete(users)`: the account is gone but
      // the attempt is not nothing, and a created-then-deleted privileged account
      // with no trail is the exact hole this feature exists to close.
      await recordAudit(c, {
        action: 'vendor.invited',
        entityType: 'vendor',
        entityId: vendorId,
        outcome: 'failure',
        after: { email, userId: newUserId, rolledBack: true },
        summary: `Invite of ${email} rolled back; account ${newUserId} deleted`,
      })
  - id: 4
    action: verify-pass
    description: Privilege suite and the vendor-invite route suite both green
    command: cd packages/api && bunx vitest run tests/routes/admin/privilege-audit.test.ts tests/routes/admin/vendor-invite.test.ts
    expected_result: PASS - no regression
