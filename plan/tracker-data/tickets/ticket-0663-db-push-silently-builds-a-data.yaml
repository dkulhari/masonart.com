implementation_steps:
  - id: 1
    action: verify-pass
    description: First, establish whether production is actually affected. Check the live database for the trigger before changing anything — the fix is different if prod is already missing it.
    command: |-
      # against the production database, read-only
      psql "$PROD_DATABASE_URL" -At -c "SELECT count(*) FROM pg_trigger WHERE tgname='admin_audit_log_immutable_trg';"
    expected_result: 1 = production is fine, this is a dev/docs bug. 0 = production audit log is mutable; stop and escalate before continuing, and apply 0021's trigger block to prod first.
    status: pending
  - id: 2
    action: write-test
    description: Add a schema-level guard that fails loudly on any database missing the trigger, independent of whether the behavioural suite runs
    file: packages/api/tests/database/audit-log-immutability.test.ts
    status: pending
    code: |-
      it("has the immutability trigger installed at all", async () => {
        if (!reachable) return;

        // The behavioural tests below can only fail *after* a statement slips
        // through. This one names the cause: drizzle's DSL cannot express a
        // trigger, so a database built with `db:push` gets the table and none
        // of its protection (#<this ticket>).
        const [trigger] = await client`
          SELECT tgname FROM pg_trigger WHERE tgname = 'admin_audit_log_immutable_trg'
        `;

        expect(
          trigger,
          "admin_audit_log_immutable_trg is missing. This database was almost " +
            "certainly built with `drizzle-kit push`, which cannot create " +
            "triggers. Rebuild it with `bun run db:migrate`.",
        ).toBeDefined();
      });
  - id: 3
    action: verify-fail
    description: Confirm the new guard fails on a push-built database and passes on a migrate-built one
    command: cd packages/api && docker run -d --name gap-check -e POSTGRES_PASSWORD=x -e POSTGRES_USER=x -e POSTGRES_DB=x -p 55663:5432 postgres:16 && sleep 5 && DATABASE_URL='postgresql://x:x@localhost:55663/x' bunx drizzle-kit push --force && DATABASE_URL='postgresql://x:x@localhost:55663/x' bunx vitest run tests/database/audit-log-immutability.test.ts; docker rm -f gap-check
    expected_result: FAIL on the push-built database, naming the missing trigger. Then passes against the normal migrate-built dev database.
    status: pending
  - id: 4
    action: implement
    description: Fix the docs — the root cause. Replace db:push with db:migrate in every setup path, and delete the two prod-compose push commands that contradict deployment.md's own banner.
    status: pending
    code: |-
      # README.md:64, README.md:352
      -   bun run db:push
      +   bun run db:migrate

      # docs/manual-tests/{flow-auth,ai-history,admin-orders,account}.md
      - - [ ] Database migrations applied (`bun run db:push`)
      + - [ ] Database migrations applied (`bun run db:migrate`)

      # docs/TEST-EXECUTION-REMEDIATION.md:56, :190
      - bun run db:push
      + bun run db:migrate

      # docs/deployment.md:174, :218 -- these contradict the file's own line 8
      - docker compose -f docker/docker-compose.prod.yml exec api bun run db:push
      + docker compose -f docker/docker-compose.prod.yml exec api bun run db:migrate

      # Add near the db:push script in packages/api/package.json:
      #   db:push writes the schema directly and cannot create triggers or
      #   functions. admin_audit_log's append-only trigger lives in migration
      #   0021 as raw SQL, so a pushed database has the table without its
      #   protection. Use db:migrate for anything you intend to trust.
  - id: 5
    action: implement
    description: 'Guard the recurrence: make the raw-SQL dependency visible where the next person will look, rather than only in a migration nobody re-reads'
    file: packages/api/src/database/schema/audit-log.ts
    status: pending
    code: |-
      /**
       * Append-only is enforced by a Postgres trigger, NOT by anything in this
       * file. `admin_audit_log_immutable_trg` and its function are raw SQL in
       * migration 0021 because drizzle's DSL cannot express either.
       *
       * Consequence: `drizzle-kit push` creates this table with none of its
       * protection. Provision with `db:migrate`. tests/database/
       * audit-log-immutability.test.ts fails loudly if the trigger is absent.
       *
       * Anything else added here that needs database-level enforcement has the
       * same problem — check it survives a push, or say in the migration that
       * it does not.
       */
  - id: 6
    action: verify-pass
    description: Full audit-log suite green against a properly migrated database, and no doc still recommends push for setup
    command: cd packages/api && DATABASE_URL='postgresql://poster_app:dev_password@localhost:5440/poster_app_dev' bunx vitest run tests/database/audit-log-immutability.test.ts tests/database/audit-log-schema.test.ts && cd ../.. && grep -rn 'db:push' README.md docs/ | grep -v 'never\|not a substitute\|cannot create'
    expected_result: Suites pass. The grep returns only lines that warn against push — no remaining line that recommends it as a setup step.
    status: pending
  - id: 7
    action: commit
    description: Commit the guard, the docs fix and the schema note together
    command: 'git add packages/api/tests/database/audit-log-immutability.test.ts packages/api/src/database/schema/audit-log.ts packages/api/package.json README.md docs/ && git commit -m "fix(audit): stop db:push producing a mutable audit log"'
    status: pending
