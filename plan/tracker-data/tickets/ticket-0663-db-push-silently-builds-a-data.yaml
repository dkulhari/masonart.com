    text: |-
      ## Step 1 unblocked and answered: production is NOT affected

      The SSH host key warning that blocked this was a **false alarm**, and the diagnosis matters because it was misleading in a specific way.

      `deploy/.env` had `DEPLOY_HOST=192.168.29.26`. That address no longer belongs to the mini — DHCP reassigned it. Reverse mDNS says 192.168.29.26 is now `dkmac.local`, a different machine with a different MAC. Fingerprints settle it:

      ```
      dkmacmini2.local   SHA256:6PY41e6guZ41Qh4mCJ2ZydysOAML/HSYNg9RsyDS5/c
      known_hosts stored SHA256:6PY41e6guZ41Qh4mCJ2ZydysOAML/HSYNg9RsyDS5/c   <- identical
      192.168.29.26 live SHA256:5BQgFmz/mojh18UWLILRclqK1uV96v2gLquzqZvt/EU   <- a different host
      ```

      The mini never rotated its key. The config was pointing at the wrong computer. No man-in-the-middle.

      Changed `deploy/.env` to `DEPLOY_HOST=dkmacmini2.local` — a name rather than a DHCP lease, so this cannot recur. (`deploy/.env` is gitignored, `.gitignore:89`, so this is a local config change and not part of any commit.) The mini's IPv4 record `192.168.29.229` is stale and answers neither ping nor port 22; it is reachable over IPv6, which resolving by name handles automatically. Connection confirmed: `hostname` returns `dkmacmini2`, Darwin 25.5.0 arm64.

      ### The production result

      ```
      table=0  trigger=0  function=0  migrations=15
      ```

      **`admin_audit_log` does not exist in production at all.** There is no unprotected audit log there, because there is no audit log there. This ticket's vulnerability does not apply to prod, and no remediation is needed.

      The reason is that prod is 8 migrations behind — last migrated 2026-08-07, stopped at `0014_admin_editable_frames`:

      ```
       15 0014_admin_editable_frames               applied  (2026-08-07 10:40)
       16 0015_gift_card_delivery_index            MISSING
       17 0016_return_store_credit                 MISSING
       18 0017_mixed_cart_gift_cards               MISSING
       19 0018_gift_card_delivery_index_predicate  MISSING
       20 0019_vendor_management_phase_1           MISSING
       21 0020_production_job_fk_restrict          MISSING
       22 0021_admin_audit_log                     MISSING
       23 0022_audit_log_drop_actor_fk             MISSING
      ```

      So the inference in the original report — that prod is fine because the deploy path is `make -C deploy migrate` — is correct in conclusion but not for the reason given. Prod is fine because the feature was never deployed. When 0021 does ship, it ships through `drizzle-kit migrate` (`deploy/Makefile:99`), which replays the raw SQL and creates the trigger. The guard added in `d1126c55` will confirm that rather than assume it.

      ### Two things this surfaced, both outside this ticket

      1. **Production is 8 migrations behind.** Whether that is deliberate (the vendor, gift-card and audit work not yet released) or drift, it is a deploy-state question, not a docs bug. Not filing a ticket unasked — say the word.
      2. **`~/.ssh/known_hosts:24` is now actively wrong.** It maps the mini's key to 192.168.29.26, which is `dkmac`. Anyone connecting to that IP gets the same alarming warning for the same non-reason. Clean it with `ssh-keygen -R 192.168.29.26`. I did not run it — it is outside this ticket and it is your known_hosts. A backup of the file as it stood before I appended the `dkmacmini2.local` entry is at `~/.ssh/known_hosts.bak-663`.

      All 7 implementation steps are now done. Moving the ticket to done.
