ticket_number: 663
title: db:push silently builds a database without the audit-log immutability trigger, and the docs tell you to use it
description: "## Problem\n\n`admin_audit_log` is append-only. That guarantee is not in the schema — it is a Postgres trigger and function written as raw SQL in migration `0021_admin_audit_log.sql`:\n\n```sql\nCREATE OR REPLACE FUNCTION admin_audit_log_immutable() RETURNS trigger AS $$\nBEGIN\n\tIF TG_OP = 'UPDATE' THEN\n\t\tRAISE EXCEPTION 'admin_audit_log is append-only: UPDATE is not permitted';\n\tEND IF;\n\tIF current_setting('chobii.audit_purge', true) IS DISTINCT FROM 'on' THEN\n\t\tRAISE EXCEPTION 'admin_audit_log is append-only: DELETE requires the retention job';\n\tEND IF;\n\tRETURN OLD;\nEND;\n$$ LANGUAGE plpgsql;\n\nCREATE TRIGGER admin_audit_log_immutable_trg\n\tBEFORE UPDATE OR DELETE ON \"admin_audit_log\"\n\tFOR EACH ROW EXECUTE FUNCTION admin_audit_log_immutable();\n```\n\nDrizzle's schema DSL cannot express a trigger or a function, so **`drizzle-kit push` does not create either**. It creates the `admin_audit_log` table and nothing that protects it. `drizzle-kit migrate` does, because it replays the SQL.\n\nA database built with `db:push` has an audit log that anyone with database access can rewrite or erase.\n\n## Verified, not inferred\n\nBuilt a throwaway `postgres:16`, pushed the current schema into it, and inspected:\n\n```\ninformation_schema.tables  admin_audit_log       -> 1   (table created)\npg_trigger admin_audit_log_immutable_trg        -> 0   (absent)\npg_proc    admin_audit_log_immutable            -> 0   (absent)\n```\n\nThen exercised it. Every statement below succeeded, with no error:\n\n```sql\nINSERT INTO admin_audit_log (actor_user_id, actor_email, action, category, outcome)\nVALUES ('attacker','a@x.com','user.delete','privilege','success');   -- INSERT 0 1\n\nUPDATE admin_audit_log SET action='harmless.read' WHERE actor_user_id='attacker';\n-- UPDATE 1;  action is now 'harmless.read'\n\nDELETE FROM admin_audit_log WHERE actor_user_id='attacker';          -- DELETE 1\n-- rows_remaining: 0\n```\n\nAn audit entry recording a privilege action was rewritten to look benign, then deleted outright. On a `migrate`-built database both statements raise.\n\n## The docs point people at push\n\n`bun run db:push` is the documented setup path in:\n\n- `README.md:64` and `README.md:352` — the getting-started flow\n- `docs/manual-tests/flow-auth.md`, `ai-history.md`, `admin-orders.md`, `account.md` — all four say \"Database migrations applied (`bun run db:push`)\"\n- `docs/TEST-EXECUTION-REMEDIATION.md:56` and `:190`\n\nSo every developer and manual-test environment set up by the book has an unprotected audit log.\n\n**`docs/deployment.md` contradicts itself.** Line 8 says \"**never `db:push` against prod**\". Lines 174 and 218 then instruct:\n\n```bash\ndocker compose -f docker/docker-compose.prod.yml exec api bun run db:push\n```\n\nThe banner calls the file a local walkthrough that is superseded, but the prod-compose commands are still sitting there, ready to be copied.\n\n`docs/OPERATIONS.md:124` and `docs/GO-LIVE-PLAN.md:59` get it right, and the real deploy path is `make -C deploy migrate`. Production is very likely fine — this is filed high rather than critical for that reason — but it should be confirmed rather than assumed (step 1).\n\n## Blast radius is exactly one object pair\n\nChecked every migration for raw SQL that the DSL cannot round-trip:\n\n```\ngrep -l \"CREATE FUNCTION\\|CREATE OR REPLACE FUNCTION\\|CREATE TRIGGER\" src/database/migrations/*.sql\n  -> src/database/migrations/0021_admin_audit_log.sql\n```\n\nOnly 0021. No policies, no CHECK constraints, no other functions. So this is one concrete gap, not an open-ended class — but it will recur the next time someone adds raw SQL to a migration, which is what step 5 guards.\n\n## There is already a detector\n\n`tests/database/audit-log-immutability.test.ts` catches this. Run against the push-built database above:\n\n```\n✓ accepts an insert\n× refuses an UPDATE, so the audited cannot edit the audit\n× refuses a DELETE from an ordinary transaction\nAssertionError: the statement was not refused at all: expected undefined to be defined\nTests: 2 failed | 4 passed\n```\n\nThe test is correct and already written. Nothing runs it against a freshly provisioned environment, which is why the gap stayed invisible.\n\n## Context\n\n- Found during #623 (rebuilding the drizzle meta snapshots), where a `pg_dump` diff between a migrate-built and a push-built database showed the function and trigger present in only one of them.\n- `#93` already established that push is unsafe against a production schema, for the separate reason that it drops columns.\n- Do not run prettier on any file touched here — the repo has no prettier config and defaults rewrite whole files."
