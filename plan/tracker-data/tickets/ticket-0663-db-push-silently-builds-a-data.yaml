  - id: 1
    action: verify-pass
    description: First, establish whether production is actually affected. Check the live database for the trigger before changing anything — the fix is different if prod is already missing it.
    command: |-
      # against the production database, read-only
      psql "$PROD_DATABASE_URL" -At -c "SELECT count(*) FROM pg_trigger WHERE tgname='admin_audit_log_immutable_trg';"
    expected_result: 1 = production is fine, this is a dev/docs bug. 0 = production audit log is mutable; stop and escalate before continuing, and apply 0021's trigger block to prod first.
    status: done
  - id: 2
    action: write-test
    description: Add a schema-level guard that fails loudly on any database missing the trigger, independent of whether the behavioural suite runs
    file: packages/api/tests/database/audit-log-immutability.test.ts
    status: done
    code: |-
      it("has the immutability trigger installed at all", async () => {
        if (!reachable) return;

        // The behavioural tests below can only fail *after* a statement slips
        // through. This one names the cause: drizzle's DSL cannot express a
        // trigger, so a database built with `db:push` gets the table and none
        // of its protection (#<this ticket>).
        const [trigger] = await client`
          SELECT tgname FROM pg_trigger WHERE tgname = 'admin_audit_log_immutable_trg'
        `;

        expect(
          trigger,
          "admin_audit_log_immutable_trg is missing. This database was almost " +
            "certainly built with `drizzle-kit push`, which cannot create " +
            "triggers. Rebuild it with `bun run db:migrate`.",
        ).toBeDefined();
      });
  - id: 3
    action: verify-fail
    description: Confirm the new guard fails on a push-built database and passes on a migrate-built one
    command: cd packages/api && docker run -d --name gap-check -e POSTGRES_PASSWORD=x -e POSTGRES_USER=x -e POSTGRES_DB=x -p 55663:5432 postgres:16 && sleep 5 && DATABASE_URL='postgresql://x:x@localhost:55663/x' bunx drizzle-kit push --force && DATABASE_URL='postgresql://x:x@localhost:55663/x' bunx vitest run tests/database/audit-log-immutability.test.ts; docker rm -f gap-check
    expected_result: FAIL on the push-built database, naming the missing trigger. Then passes against the normal migrate-built dev database.
    status: done
