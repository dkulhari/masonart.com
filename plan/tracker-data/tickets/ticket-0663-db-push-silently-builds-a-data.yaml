    text: |-
      Steps 2-7 done and committed. Step 1 (production check) is BLOCKED — see below. Ticket stays in-progress.

      **Commit**: `d1126c55` - fix(database): stop the docs building databases without the audit-log trigger

      ## Reproduced first

      Built two databases from this same schema in the local postgres container, one each way:

      ```
      chobii_migrate_test  table=1 trigger=1 function=1
      chobii_push_test     table=1 trigger=0 function=0
      ```

      Exactly the ticket's finding. Both throwaway databases were dropped afterwards.

      ## Files changed

      - `packages/api/src/database/raw-sql-objects.ts` (new) — manifest of the objects only a migration can create (`admin_audit_log_immutable`, `admin_audit_log_immutable_trg`), each with the migration that creates it and what breaks when it is absent, plus the shared failure message.
      - `packages/api/tests/database/raw-sql-objects.test.ts` (new) — the guard, in two halves. Without a database: scans every migration for CREATE FUNCTION / TRIGGER / POLICY and fails on anything not declared in the manifest. Against a real database: asserts each declared object is present in `pg_proc` / `pg_trigger` / `pg_policy`.
      - `packages/api/src/database/schema/audit-log.ts` — the "append-only" section now says out loud that the trigger is **not** in this file, that push does not create it, and where the manifest is.
      - `README.md` — setup step 5 now `db:migrate`. The command reference still lists `db:push` but with the warning attached instead of presenting it as a peer.
      - `docs/manual-tests/*.md` (14 files) — precondition now `db:migrate`, with "not db:push" and the ticket number.
      - `docs/deployment.md` — both prod-compose `db:push` commands replaced with `db:migrate`. The file no longer contradicts its own banner.
      - `docs/TEST-EXECUTION-REMEDIATION.md` — both occurrences.
      - `scripts/run-tests.sh` — `setup_database()` ran `db:push`, so the project's own test-setup path built unprotected databases. Now `db:migrate`, with the reason in a comment.
      - `packages/api/package.json` — `db:migrate` gains `--env-file=../../.env`.

      ## Why the package.json change

      The README told people to `cd packages/api && bun run db:push`, and that errors: neither `db:push` nor `db:migrate` picks up the root `.env` on its own. Both failed identically, so this is pre-existing and not a regression — but shipping a corrected setup step that still errors is not a fix. `--env-file` matches the existing `dev` and `seed` scripts. Verified that an explicit `DATABASE_URL=...` still overrides the file (bun gives the shell precedence), so pointing drizzle-kit at a throwaway database still works.

      ## Verification

      - **Guard RED on push-built database** — fails naming both objects:
        ```
        This database is missing 2 object(s) that only a migration creates:
          - function admin_audit_log_immutable (0021_admin_audit_log.sql) — ...
          - trigger admin_audit_log_immutable_trg (0021_admin_audit_log.sql) — ...
        That is the signature of a database built with `drizzle-kit push`.
        Rebuild it with `bun run db:migrate`.
        ```
      - **Guard GREEN on migrate-built database** — 4 passed.
      - **Recurrence guard proved red** — added a throwaway `9999_tmp_probe.sql` with an undeclared function and trigger; the test failed naming `tmp_probe_fn` and `tmp_probe_trg` and the migration file. Probe removed.
      - **Audit-log suite on migrate-built database** — 20 passed across `raw-sql-objects`, `audit-log-immutability`, `audit-log-schema`.
      - **`bunx vitest run tests/database/`** — 465 passed, 178 skipped, 0 failed. (The skips are the pre-existing `getDestructiveDbUrl` gate on a non-disposable database.)
      - **`bun run typecheck`** — exit 0, including `tsconfig.test.json`. Pre-commit turbo typecheck across all 3 packages passed.
      - **`bash -n scripts/run-tests.sh`** — syntax OK. `db:migrate` confirmed a safe no-op on an up-to-date database (dev journal 23 rows, 23 migration files, still 23 after).

      ## Step 1 is blocked, and it is the reason this ticket is not done

      The prod check could not be run. SSH to the deploy host fails host key verification:

      ```
      WARNING: REMOTE HOST IDENTIFICATION HAS CHANGED!
      The fingerprint for the ED25519 key sent by the remote host is
      SHA256:5BQgFmz/mojh18UWLILRclqK1uV96v2gLquzqZvt/EU
      Offending ED25519 key in /Users/dhruv/.ssh/known_hosts:24
      ```

      I did not bypass it with `StrictHostKeyChecking=no` — that is the one thing that warning exists to prevent, and on 192.168.29.26 it is most likely a rebuilt/reimaged mini but that has to be confirmed by a human, not assumed by an agent.

      `deploy/Makefile:99-100` runs `drizzle-kit migrate`, so production is very likely fine, but that remains inference. The read-only check to run once SSH is trusted again:

      ```bash
      make -C deploy ssh-mini   # or, directly:
      ssh dhruv@192.168.29.26 "export PATH=/opt/homebrew/bin:\$PATH; \
        docker compose -f ~/chobii-docker-compose.yml exec -T postgres \
        psql -U chobii -d chobii -tAc \"SELECT 'trigger=' || count(*) FROM pg_trigger WHERE tgname='admin_audit_log_immutable_trg'\""
      ```

      Expect `trigger=1`. If it comes back `0`, prod's audit log is rewritable and that is a separate critical ticket, not a docs fix.

      ## Left alone deliberately

      Three dated plan documents still say `db:push`: `docs/plans/2026-02-17-ai-content-moderation-plan.md:377`, `docs/plans/2026-02-01-gemini-direct-provider-plan.md:65`, `docs/plans/2026-02-01-verified-purchase-reviews-plan.md:59`. These are historical records of what was done at the time, not setup paths, so rewriting them would falsify the record. Flagging rather than fixing — say the word if you want them annotated.
