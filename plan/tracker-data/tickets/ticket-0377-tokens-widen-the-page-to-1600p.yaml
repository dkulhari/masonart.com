ticket_number: 377
title: Tokens - widen the page to 1600px and drop page padding to 20px
description: |-
  ## Task
  mesonart's `--page-width` is 1600px with 20px page padding. Ours renders at 1400px / 32px.

  Two places must move together or the change is invisible:
  - `tailwind.config.ts` `theme.container` — `screens['2xl']: '1400px'`, `padding: '2rem'`.
  - `globals.css` `.container-wide` — `max-w-7xl` (1280px), which is what the storefront actually uses everywhere.

  Also retire the orange `theme-color` meta in `__root.tsx` (`#f97316`) — it colours the mobile browser chrome and is the last orange left after ticket 1.

  ## Context
  Part of feature: mesonart-design-parity
  Phase: 1 — Tokens
  Files: `packages/web/tailwind.config.ts`, `packages/web/app/styles/globals.css`, `packages/web/app/routes/__root.tsx`
  Risk: E2E row-alignment tests from #375 assert grid geometry at 1440px viewport. 1600px is above the viewport so the container stays viewport-bound there — verify, do not assume.
