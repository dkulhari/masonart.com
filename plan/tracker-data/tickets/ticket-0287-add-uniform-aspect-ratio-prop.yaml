ticket_number: 287
title: ProductCard - Add uniformAspectRatio prop
description: |-
  ## Task
  Add an optional `uniformAspectRatio` prop to the shared ProductCard component that overrides the orientation-based aspect ratio. This enables grid views to force consistent card heights.

  ## Context
  Part of feature: hero-grid-alignment
  Phase: 1 - ProductCard Enhancement

  ## Implementation Steps

  - [ ] **Step 1 [implement]**: Add uniformAspectRatio prop to ProductCardProps interface
    - File: `packages/web/app/components/product/ProductCard.tsx`
    - Add to ProductCardProps:
    ```tsx
    /** Override aspect ratio for uniform grid alignment (e.g. 'aspect-[3/4]') */
    uniformAspectRatio?: string
    ```
    - Destructure in component function:
    ```tsx
    export function ProductCard({
      product,
      showFeaturedBadge = true,
      showAiBadge = true,
      className,
      size = 'md',
      uniformAspectRatio,
    }: ProductCardProps) {
    ```

  - [ ] **Step 2 [implement]**: Use uniformAspectRatio when provided, fall back to orientation-based ratio
    - File: `packages/web/app/components/product/ProductCard.tsx`
    - Change the aspectRatioClass line from:
    ```tsx
    const aspectRatioClass =
      ASPECT_RATIO_MAP[product.orientation] || ASPECT_RATIO_MAP.portrait
    ```
    - To:
    ```tsx
    const aspectRatioClass =
      uniformAspectRatio || ASPECT_RATIO_MAP[product.orientation] || ASPECT_RATIO_MAP.portrait
    ```

  - [ ] **Step 3 [verify-pass]**: Run typecheck to confirm no type errors
    - Run: `cd packages/web && bunx tsc --noEmit --pretty 2>&1 | head -30`
    - Expected: No errors related to ProductCard

  - [ ] **Step 4 [commit]**: Commit changes
    - Run: `git add packages/web/app/components/product/ProductCard.tsx && git commit -m "feat(ui): add uniformAspectRatio prop to ProductCard (#287)"`
