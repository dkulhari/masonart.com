    text: |-
      ✅ **Completed**

      **Commit**: `b79bfe3d` — feat(web): /collections/$slug, on the shell /posters already runs

      **Files Changed**:
      - `packages/web/app/routes/collections/$slug.tsx` — new. Route, `parseCollectionSearch`, `toApiParams`, `toFilterState`, `toSearch`.
      - `packages/web/app/components/product/ActiveFilterTags.tsx` — extracted from the posters route.
      - `packages/web/app/components/product/MobileFiltersSheet.tsx` — extracted from the posters route.
      - `packages/web/app/routes/posters/index.tsx` — imports both instead of defining them; 1063 → 927 lines.
      - `packages/web/app/lib/api.ts` — `collectionsApi.detail()`.
      - `packages/api/src/routes/collections.ts` — `appliedSort` on the response (see below).
      - `packages/web/tests/routes/collection-slug.test.ts` — 13 tests.

      **On "lift the shell rather than copy it"** — I extracted the two page-local **components**, not one monolithic shell component. The layout JSX in the two routes is similar, but everything inside it is already a shared component (`CollectionToolbar`, `ProductFilters`, `ProductGrid`, `PromoTile`, `DiscoverChips`, and now these two). Collapsing the outer JSX into a single component would have meant a ~15-prop wrapper and reshaping a 1000-line file that another session is actively editing. The parts that would actually drift — the chip semantics, the scroll lock, the facet-tag derivation — are shared. Flagging the judgement call rather than claiming the ticket's exact wording.

      **A bug the browser caught that no test would have.** `/collections/best-selling` displayed **"Sort by: Newest First"** over a list ordered by units sold. The toolbar derived its label from the search params, but the collection's rule *is* the sort and the rule is not in the public payload — so the client had no way to know. Fixed by returning `appliedSort` from `GET /api/collections/:slug` and labelling from that.

      ```
      /collections/best-selling    Sort by: Best selling   ✅
      /collections/new             Sort by: Newest First   ✅
      /collections/pop-art         Sort by: Newest First   ✅
      ```

      **Browser verification** (1440×900):

      | request | result |
      |---|---|
      | `/collections/pop-art` | 200, h1 "Pop Art", 6 cards, facets 2+3+1 = 6 |
      | `/collections/best-selling` | 200, h1 "Best Sellers", 41 total / 24 rendered |
      | `/collections/pop-art?styles=ukiyo-e-art` | **"No products"** + active-filter chip — the intersection rule, visible |
      | `/collections/pop-art?styles=pop-art` | 6 cards |
      | `/collections/nope-not-real` | **404** |
      | `/posters` | unchanged, 24 cards |

      Facet counts are demonstrably scoped: the sidebar on Pop Art reads Square (2), Vertical (3), Horizontal (1) — its six products, not the catalogue's 41.

      **Verification**
      - Command: `cd packages/web && npx vitest run tests/routes/collection-slug.test.ts tests/components/product/`
      - Result: PASS — 259 tests, 13 files, 0 failing
      - Build: `npx tsc --noEmit -p tsconfig.json` — clean
      - API: `npx vitest run tests/routes/collection-detail.test.ts` still 12/12 after adding `appliedSort`

      **Two environment notes**
      1. `routeTree.gen.ts` is generated by the **dev server**, not a script. Typecheck fails with a confusing path-union error until `npm run dev` has run in `packages/web`.
      2. The API crashed mid-verification with `ReferenceError: discoverOrderSchema is not defined` — `bun --hot` holding a pre-rebuild copy of `@chobii/shared`. Restarting fixed it. Rebuild shared → restart the API.
