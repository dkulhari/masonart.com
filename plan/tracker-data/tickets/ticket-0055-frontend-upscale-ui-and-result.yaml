ticket_number: 55
title: Frontend - Upscale UI and Results Enhancement
description: |-
  ## Overview
  Add upscaling option to generation results for selected images.

  ## UI Changes to GenerationResults

  ### Upscale Button
  - Appears on selected/completed images
  - Dropdown with 2x and 4x options
  - Shows cost for each option
  - Disabled if insufficient wallet balance

  ### Upscale Progress
  - Loading state on image card
  - Progress percentage
  - 'Upscaling...' overlay

  ### Upscaled Image Display
  - Badge showing '2x' or '4x' upscaled
  - High-res download button
  - Before/after toggle (optional)

  ## Wallet Balance Integration
  - Show wallet balance near generate button
  - Low balance warning
  - Quick link to add funds

  ## Files to Modify
  - packages/web/app/components/ai-generator/GenerationResults.tsx
  - packages/web/app/hooks/useUpscale.ts (new hook)
  - packages/web/app/routes/create/index.tsx (wallet display)

  ## Acceptance Criteria
  - [ ] Upscale options visible on completed images
  - [ ] Cost preview accurate
  - [ ] Progress tracking during upscale
  - [ ] High-res image accessible after upscale
  - [ ] Wallet balance visible and accurate
  - [ ] Component tests pass
