ticket_number: 379
title: Primitives - Button component with the mesonart pill variants
description: |-
  ## Task
  There is no Button component anywhere in `packages/web` — `app/components/ui/` contains only `OptimizedImage.tsx`, and every button in the app is bespoke inline Tailwind. That absence is precisely why orange never got centralised.

  Build `app/components/ui/Button.tsx` with `class-variance-authority` (already a dependency, ^0.7.1) and `cn` from `~/lib/utils`.

  Variants, measured from mesonart:
  - `solid` (default) — `bg-primary text-primary-foreground`, `rounded-pill`, `border-[length:var(--border-button)] border-primary`, `text-button`.
  - `outline` — transparent fill, `border-primary text-primary`, same pill and border width. This is their `SHOP All ART` hero CTA.
  - `ghost` — no border, hover tint only.
  - `link` — underline on hover, no pill.

  Sizes: `sm` (h-9 px-5), `md` (h-11 px-7, default), `lg` (h-12 px-8), `icon` (h-10 w-10, `rounded-full`).

  Must support `asChild`-style composition without pulling in Radix: export `buttonVariants` so `<Link className={buttonVariants({...})}>` works. That is how the storefront's anchor CTAs migrate.

  ## Context
  Part of feature: mesonart-design-parity
  Phase: 2 — Primitives
  File: `packages/web/app/components/ui/Button.tsx`, test at `packages/web/tests/components/ui/Button.test.tsx`
  Deps present: class-variance-authority ^0.7.1, clsx, tailwind-merge, @testing-library/react ^16.3.1
  Pattern: named export, `cn` from `~/lib/utils` (see ProductCard.tsx).
