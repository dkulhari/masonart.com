    text: |-
      ✅ **Completed**

      **Commit**: `6dd16d1c` — fix(web): featured products read the items envelope, not .products

      **Files Changed**:
      - `packages/web/app/lib/api.ts` — typed `featured()` as `FeaturedProductsResponse`; added `toFeaturedProducts()` as the single place the envelope key is named
      - `packages/web/app/routes/index.tsx` — loader uses the mapper
      - `packages/web/app/hooks/useProducts.ts` — see below
      - `packages/web/tests/lib/featured-products.test.ts` — new regression test
      - `packages/web/tests/hooks/useProducts.test.tsx` — corrected mocks

      **Root Cause**: `GET /api/products/featured` returns `{ items: [...] }`; the loader read `featuredResponse.products`, which never exists. `|| []` yielded an empty array and the page fell through to its "Coming Soon" state on every load — silently, since the surrounding try/catch had nothing to catch.

      **Second instance found**: typing the client surfaced the same defect in `useFeaturedProducts` (`useProducts.ts:254`), which cast the envelope directly to `ProductListItem[]`. Consumers would have received an object where they expected a list. Fixed with the same mapper.

      **Why it survived**: the existing hook tests mocked `productsApi.featured` as a bare array, matching the old incorrect cast rather than the real endpoint. The mocks now return the real envelope.

      **Verification**:
      - Command: `bunx vitest run` (packages/web)
      - Result: PASS — 1362 passed / 1362, 32 files
      - Command: `bun run typecheck` → 26 errors, identical to the `main` baseline (diffed; all pre-existing, none in touched files)
      - Live check at 390x844 on local dev: Featured Collection renders 7 real cards (Cosmic Harmony, Golden Flow, Mountain Majesty, Monstera Dreams) instead of "Coming Soon"
