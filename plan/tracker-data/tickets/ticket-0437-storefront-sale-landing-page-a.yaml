ticket_number: 437
title: Storefront - /sale landing page and the red Sale nav link
description: |-
  ## Task
  A page for the sale: headline, countdown, and the grid of products the promotion actually applies to (scope minus exclusions, resolved server-side). Plus the red **Sale** link at the end of nav row 2, matching theirs.

  No active promotion → the nav link is absent and `/sale` returns a plain empty state rather than a 404, so an old link from an email does not dead-end.

  ## Context
  Part of feature: sale-promotions
  Phase: 4 — Frontend
  Design: `docs/superpowers/specs/2026-08-05-sale-promotions-design.md` §7
  Closes: mesonart parity analysis §3.5 "Sale/promo page"

  Reuse the existing collection grid rather than building a second one — the page is a product list with a promotion filter. Nav row 2 is generated from `STYLE_OPTIONS` in `Header.tsx` (see §3.1 row 4); the Sale link is appended after it, not woven into the style list.
