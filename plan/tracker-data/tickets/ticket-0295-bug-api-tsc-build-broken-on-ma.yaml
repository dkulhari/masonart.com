title: 'BUG: api tsc build broken on main — ~60 type errors block the production image build'
description: |-
  Found while executing #294-adjacent verification: `bun run build` (tsc) in packages/api fails with ~60 errors across 12 files (admin/returns, admin/reviews, admin/shipments, admin/shipping, admin/notifications, returns, shipments, ai, queues/ai-generation, services/sms, database/seed-test-users, index.ts). Dev never noticed because `bun run dev` executes TS directly. The Docker api image runs `bun run build`, so this is a hard launch blocker.

  Error classes: TS18048/TS2532 possibly-undefined after .returning()/[0] indexing (add guards matching surrounding route idioms), TS6133 unused declarations (remove), TS2739 style-prompt Record missing 5 newer art styles in ai-generation.ts, TS2322/TS2345 CORS origin + undici/bun Request mismatch in index.ts, string|null narrowing in returns/shipments notification calls.

  Acceptance: bunx tsc --noEmit clean in packages/api; docker build --target api succeeds; unit suite no worse than before.
