    text: |-
      ✅ **Completed**

      **Commit**: `5fc9f820` — feat(web): sale pricing in the PDP buy panel, behind one SalePrice component

      **Files Changed**:
      - `packages/web/app/components/product/SalePrice.tsx` (new) — the one component that prints a possibly-discounted price: sale price, base struck through, percent-off marker, "Members" tag when locked. Pure/hook-free so it can mount once per grid cell.
      - `packages/web/tests/components/product/SalePrice.test.tsx` (new) — 19 tests.
      - `packages/web/app/components/product/ProductDetail.tsx` — buy panel renders SalePrice + the countdown echo; reads `useGalleryMembership()`.
      - `packages/web/tests/components/product/ProductDetail.sale.test.tsx` (new) — 9 tests.
      - `packages/web/app/routes/posters/$slug.tsx` — pipes `response.sale` through the loader untouched.
      - `packages/web/app/components/product/ProductCard.tsx` — **edited but NOT committed**, see below.

      **Summary**:
      Both selling surfaces render through one component, so a discounted card and the buy panel cannot describe the same saving differently. Nothing computes a discount: every figure is read off the resolved `product.sale` payload (#428), and `percentOff` is printed rather than derived.

      The buy panel shows the artwork's sale rather than a frame-inclusive one, matching `priceCartLine` — the frame is added back at full price, so a frame-inclusive discount here would promise a saving checkout declines to give.

      Countdown echo reuses `useActivePromotion`/`useCountdown`, which format through SaleStrip's own `formatRemaining`. One cookie-minted deadline, no second clock. Echoed only when the running promotion is the one that priced this poster, so a promotion the product is excluded from cannot hang a clock over a full-price piece.

      Colour is the reserved `--sale` token only — parity §3.3 rules out a third loud colour beside the orange Featured and purple AI badges.

      **Verification**:
      - Command: `bunx vitest run tests/components/product/SalePrice.test.tsx tests/components/product/ProductDetail.sale.test.tsx tests/components/product/ProductCard.test.tsx tests/components/product/ProductCard.tokens.test.ts`
      - Result: PASS (4 files, 72 tests, 28 of them new)
      - `bunx tsc --noEmit`: 22 errors, all pre-existing, none in any touched file.

      ---

      ⚠️ **Two things a human needs to know**

      **1. ProductCard.tsx is edited but deliberately uncommitted.** The file holds live uncommitted work from a different session (rating-row parity refactor + a new `sku` field). The #435 edit — `sale?: SalePricing | null` on `ProductCardData`, plus swapping the price span for `<SalePrice>` — is applied in the working tree so it is not lost, but was not staged or committed. It needs landing once that session commits. Their `ProductCard.test.tsx` (27 tests) and `ProductCard.tokens.test.ts` (17) both pass against the edit.

      **2. A `git commit --amend` of mine raced another agent and rewrote their commit.** I amended a SalePrice fix onto what I believed was my own HEAD; between the `git log` check and the amend, agent #436 committed `4487c24e` ("fix(web): quote cart savings only for lines the page is showing"). The amend produced `6eb64913`, which contains **all of their work intact** plus my 14-line SalePrice change. Nothing was lost. By the time I noticed, a third agent had already committed `fd38bf0d` on top, so unwinding would have meant rewriting two commits while others were actively committing — I left history alone rather than risk compounding it. Net effect: #436's commit hash is `6eb64913`, not `4487c24e`, and it carries one extra file belonging to #435. **Never use `git commit --amend` in this shared worktree.**

      **3. Dependency note**: `ProductDetail.tsx` imports `~/hooks/useActivePromotion`, which is still **untracked** in the working tree (created by the #437 session). My commit builds fine against the working tree but is not self-contained until that file is committed.
