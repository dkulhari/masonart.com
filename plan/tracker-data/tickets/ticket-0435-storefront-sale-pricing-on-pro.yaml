ticket_number: 435
title: Storefront - sale pricing on product cards and the PDP buy panel
description: |-
  ## Task
  Show the sale on the two surfaces that sell: the grid card and the product buy panel. Base price struck through, sale price beside it, percent-off marker, and a "Members" tag when `locked`. PDP additionally carries the countdown echo their buy panel runs (parity §1.4 item 6).

  All of it reads `product.sale` from the API (T6). No component computes a discount.

  ## Context
  Part of feature: sale-promotions
  Phase: 4 — Frontend
  Design: `docs/superpowers/specs/2026-08-05-sale-promotions-design.md` §7

  Files: `packages/web/app/components/product/ProductCard.tsx`, the PDP buy panel under `app/routes/posters/`. Parity §3.3 already flags our orange/purple badges as clashing with a monochrome system — do not add a third loud colour; the sale marker follows the existing token set. Card tests live in `packages/web/tests/components/product/`.
