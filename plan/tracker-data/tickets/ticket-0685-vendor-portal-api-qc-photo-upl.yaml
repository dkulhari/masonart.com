    text: |-
      ✅ **Completed**

      **Commit**: `e8544122` — feat(api): let a vendor photograph the piece, direct to R2 (on `feature/production-pipeline-design`, directly on top of #684's `f9a17196`)

      **Files Changed**
      - `packages/api/src/routes/vendor.ts` — the four routes, and the `production_job.photos_submitted` audit row on the successful `received -> qc_submitted` edge
      - `packages/api/src/lib/vendor-scope.ts` — `listVendorJobPhotos`, `assertVendorMayUploadQcPhoto`, `recordVendorQcPhoto`, `retractVendorQcPhoto`; the shot-list guard now returns what it saw
      - `packages/api/src/lib/production-transitions.ts` — `QC_PHOTO_UPLOAD_STATUSES`, derived from the `shot-list-complete` edge
      - `packages/shared/src/schemas/production-qc.ts` — `QC_PHOTO_CONTENT_TYPES`, `QC_PHOTO_MAX_BYTES`
      - `packages/api/tests/routes/vendor/photos.test.ts` — new, 32 tests
      - `packages/api/tests/routes/vendor/isolation.test.ts` — 4 ROUTE_TABLE entries; Property 3 generalised
      - `packages/api/tests/routes/vendor/jobs.test.ts`, `tests/lib/vendor-scope.test.ts` — two allow-lists repaired

      **Summary**

      `review-media.ts`'s presign → complete pattern, reused verbatim: bytes go direct to R2, `complete` re-validates because the two calls are fifteen minutes apart. `complete` verifies the returned key by REBUILDING it from `(jobId, slot, filename)` rather than prefix-testing it — a QC key carries the slot as well as the job, and equality disposes of traversal, bucket-qualified paths and full URLs in one move.

      A re-upload and a `DELETE` both stamp `superseded_at`; nothing here deletes a row. Write order is stamp-then-insert inside one transaction with the job row locked `FOR UPDATE`, so the partial unique index on `(job_id, slot) WHERE superseded_at IS NULL` is never tripped and two concurrent completes serialise rather than race.

      The upload window is derived from the guard (`QC_PHOTO_UPLOAD_STATUSES` = statuses a vendor can take a `shot-list-complete` edge from), not listed — #684's lesson about second copies of the matrix.

      **Three things worth flagging to the next ticket**

      1. **The 400-day retention sweep is NOT in this ticket and is not filed anywhere.** No sweep exists for `production-qc/` today. `production_job_photos.job_id` is `ON DELETE CASCADE`, so deleting a job drops the rows and leaves the R2 objects orphaned forever. Whoever writes it must call `deleteByPrefix('production-qc/<jobId>/')` FIRST and delete rows second — a cascade cannot reach into object storage. `queues/audit-retention.ts` is the sibling to model it on. The design (§7) calls this "a real task, not a footnote"; §13's ticket map has no row for it.

      2. **No per-upload audit action, deliberately.** `presign`, `complete` and `DELETE` write no audit row of their own — the `AUDIT_ACTIONS` registry declares nothing for them, and #671 fails the build on an action nothing emits, so inventing one here would be the mirror of that defect. The middleware floor covers each request, and `production_job.photos_submitted` records the final accepted set with slots and keys.

      3. **No settlement freeze on the photo writes**, unlike `updateVendorJob`. The freeze exists because payables are derived with no stored total; a photo row carries no amount and moves no job, so there is nothing for it to falsify. Stated in the module doc so it reads as a decision rather than an omission.

      **Two allow-lists were silently examining nothing** — the same failure mode #678 and #684 each hit once:
      - `tests/lib/vendor-scope.test.ts` tested a NAME PATTERN, `/^(list|get|find|query)/`. `updateVendorJob` never matched it and neither would `recordVendorQcPhoto`, so the module's *writes* were exactly what it could not see. Now an account: every exported function is enrolled and proved to refuse a falsy vendorId, or named as a pure helper, with a not-vacuous test.
      - the `FOR UPDATE` source scan asserted a literal `1`. Now counted against the number of `db.transaction(` sites, so a transaction added without a lock fails instead of a magic number needing a manual bump.

      `JOB_KEYED_TABLES` re-checked: the new queries touch `production_jobs` and `production_job_photos` only, both already listed.

      Scope disjointness re-verified after the change, and *widened*: the isolation route table now names the one scope each route may sign in, and every key handed to **either** presigner — upload as well as download — must land in exactly one scope and it must be the route's own. The upload presigner was previously unwatched entirely, which would have left half the signing surface outside the allow-list the label exception depends on.

      Not touched, per the scope boundary: transfers (#686), the label route (#687), `routes/admin/production-jobs.ts`.

      **Verification**
      - Command: `npx vitest run tests/routes/vendor/photos.test.ts tests/routes/vendor/isolation.test.ts tests/routes/vendor/jobs.test.ts tests/routes/vendor/artwork.test.ts tests/lib/vendor-scope.test.ts tests/lib/production-transitions.test.ts` (in `packages/api`)
      - Result: PASS — Test Files 6 passed (6), Tests 285 passed (285)
      - Baseline before the ticket: 163 across the three vendor route suites. `photos.test.ts` is 32 new tests; `isolation.test.ts` went 69 → 95.
      - Typecheck: `turbo run typecheck` green across `@chobii/shared`, `@chobii/api` (src *and* `tsconfig.test.json`) and `@chobii/web` — run as the pre-commit gate.
