ticket_number: 384
title: Sweep - remaining storefront routes off font-bold, brand orange and rounded-lg CTAs
description: |-
  ## Task
  The long tail: every remaining non-admin route file that still reaches for `font-bold`, `bg-brand-*`/`text-brand-*`, `fill-yellow-400`, or a hand-rolled `rounded-lg bg-primary` CTA.

  Enumerate with:
  ```
  grep -rlE 'font-bold|font-extrabold|font-black|\b(bg|text|border|from|to)-brand-|fill-yellow-400' packages/web/app --include=*.tsx | grep -v '/admin'
  ```

  Covers: `routes/posters/{index,$slug}.tsx`, `routes/cart/index.tsx`, `routes/checkout/{index,success}.tsx`, `routes/create/index.tsx`, `routes/gallery/index.tsx`, `routes/track/index.tsx`, `routes/approve/$token.tsx`, `routes/auth/*` (4 files), `routes/_authed/account/*` (9 files).

  Rules, applied uniformly:
  - `font-bold` / `font-extrabold` / `font-black` on a heading → delete (the base layer supplies Urbanist 300); on non-heading emphasis → `font-medium`.
  - `bg-brand-*` on a CTA → the `Button` primitive or `buttonVariants()`.
  - `text-brand-*` on a link → `text-foreground` with `hover:text-foreground/60`.
  - `fill-yellow-400` → `fill-rating`.
  - A price shown as discounted → `text-sale`.

  `/admin/**` is deliberately skipped — internal tool, out of scope, and excluding it keeps the blast radius on the storefront.

  ## Context
  Part of feature: mesonart-design-parity
  Phase: 3 — Storefront sweep
  Depends on: the Button primitive.
  The AI-generator components under `app/components/ai-generator/` may keep `--brand-*` — they are the differentiator surface and are not part of the mesonart-facing storefront chrome. Do not sweep them; the guard ticket must exempt that directory explicitly.
