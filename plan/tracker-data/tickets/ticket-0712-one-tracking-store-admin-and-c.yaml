  - id: 5
    action: write-test
    description: Write the failing component test for the admin order detail panel
    file: packages/web/tests/routes/admin/order-detail-shipment.test.tsx
    command: cd packages/web && bunx vitest run tests/routes/admin/order-detail-shipment.test.tsx
    expected_result: FAIL
    status: pending
    code: |
      /**
       * The panel the admin typed into does not go blank after they save.
       *
       * `OrderDetail.tsx` rendered `order.shippingDetails`, which the API stopped
       * returning. web tests are NOT typechecked (#662 covers api only), so a stale
       * prop type fails nothing — this has to be asserted by rendering.
       */

      import { describe, it, expect } from 'vitest'
      import { render, screen } from '@testing-library/react'
      import '../../setup'

      import { OrderDetail } from '../../../app/components/admin/OrderDetail'

      const SHIPMENT = {
        id: 'ship-1',
        carrier: 'Shiprocket',
        courierName: 'Delhivery',
        awbNumber: 'AWB55512345',
        trackingNumber: 'AWB55512345',
        trackingUrl: 'https://track.example/AWB55512345',
        status: 'in_transit',
        estimatedDeliveryAt: '2026-09-04T00:00:00.000Z',
        costPaise: 8900,
      }

      describe('the admin order shipment panel', () => {
        it('renders the courier and the tracking number', () => {
          render(<OrderDetail order={{ ...BASE_ORDER, shipment: SHIPMENT }} />)

          expect(screen.getByText('Delhivery')).toBeInTheDocument()
          expect(screen.getByText('AWB55512345')).toBeInTheDocument()
        })

        it('links out to the carrier', () => {
          render(<OrderDetail order={{ ...BASE_ORDER, shipment: SHIPMENT }} />)

          expect(screen.getByRole('link', { name: /track/i })).toHaveAttribute(
            'href',
            SHIPMENT.trackingUrl
          )
        })

        it('shows what we paid — the margin number, admin-only', () => {
          render(<OrderDetail order={{ ...BASE_ORDER, shipment: SHIPMENT }} />)
          expect(screen.getByText(/89/)).toBeInTheDocument()
        })

        it('renders an empty state, not a crash, when nothing has shipped', () => {
          render(<OrderDetail order={{ ...BASE_ORDER, shipment: null }} />)
          expect(screen.getByText(/no shipment/i)).toBeInTheDocument()
        })
      })
