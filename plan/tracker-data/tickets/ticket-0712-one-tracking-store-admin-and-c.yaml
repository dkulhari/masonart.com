  - id: 1
    action: write-test
    description: Write the failing test for both API projections
    file: packages/api/tests/routes/order-detail-shipment.test.ts
    command: cd packages/api && bunx vitest run tests/routes/order-detail-shipment.test.ts
    expected_result: FAIL
    status: pending
    code: |
      /**
       * Order detail shows the shipment, on both sides of the fence.
       *
       * Both projections returned `shippingDetails`, which this phase stopped
       * writing. Left alone, the admin types a tracking number, the save succeeds,
       * and the panel it was typed into goes blank.
       *
       * The customer projection is checked for what it must NOT carry as much as for
       * what it must: cost, weight, dims and the label token are internal, and
       * `routes/tracking.ts` is the reference for the public shape.
       */

      import { describe, it, expect, vi, beforeEach } from 'vitest'
      import '../setup'

      const recorder = await vi.hoisted(async () =>
        (await import('../helpers/query-recorder')).createQueryRecorder({ rows: 'repeatLast' })
      )
      vi.mock('../../src/database', () => ({ db: recorder.db }))

      const INTERNAL_FIELDS = [
        'costPaise',
        'shippedWeightGrams',
        'lengthCm',
        'widthCm',
        'heightCm',
        'labelObjectToken',
        'externalShipmentId',
        'externalOrderId',
        'pickupVendorId',
      ]

      describe('GET /api/admin/orders/:id', () => {
        beforeEach(() => recorder.reset())

        it('returns the live shipment', async () => {
          const res = await app.request(`/api/admin/orders/${ORDER_ID}`, { headers: adminSession() })
          const body = await res.json()

          expect(body).toHaveProperty('shipment')
        })

        it('does not also return shippingDetails — two shapes is the split brain again', async () => {
          const res = await app.request(`/api/admin/orders/${ORDER_ID}`, { headers: adminSession() })
          const body = await res.json()

          expect(body).not.toHaveProperty('shippingDetails')
        })

        it('may show an admin what we paid — that is the margin number', async () => {
          const res = await app.request(`/api/admin/orders/${ORDER_ID}`, { headers: adminSession() })
          const body = await res.json()

          expect(body.shipment).toHaveProperty('costPaise')
        })
      })

      describe("GET the customer's own order", () => {
        beforeEach(() => recorder.reset())

        it('returns the same public shape the tracking route does', async () => {
          const res = await app.request(`/api/orders/${ORDER_ID}`, { headers: customerSession() })
          const body = await res.json()

          expect(body.shipment).toHaveProperty('trackingNumber')
          expect(body.shipment).toHaveProperty('courierName')
        })

        it('withholds every internal field', async () => {
          const res = await app.request(`/api/orders/${ORDER_ID}`, { headers: customerSession() })
          const body = await res.json()

          for (const field of INTERNAL_FIELDS) {
            expect(body.shipment, `${field} leaked to the customer`).not.toHaveProperty(field)
          }
        })

        it('reads the live shipment, not the newest', async () => {
          const res = await app.request(`/api/orders/${ORDER_ID}`, { headers: customerSession() })
          await res.json()

          expect(recorder.queries.map((q) => q.sql).join('\n').toLowerCase()).toMatch(
            /voided_at"?\s+is\s+null/
          )
        })
      })
