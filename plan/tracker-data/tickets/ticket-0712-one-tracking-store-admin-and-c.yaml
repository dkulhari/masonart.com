ticket_number: 712
title: One Tracking Store - Admin and customer order detail render the shipment
description: |-
  ## Task
  Three read surfaces still project `orders.shipping_details`, which is no longer written:

  - `packages/api/src/routes/admin/orders.ts:556` — `GET /api/admin/orders/:id`
  - `packages/api/src/routes/orders.ts:920` — the customer's own order detail
  - `packages/web/app/components/admin/OrderDetail.tsx:905-1053` — the block that renders it, plus the form at `:1053` whose `currentDetails` prop feeds the PATCH

  Left alone, all three render an empty panel on every order shipped after this pass: the admin types a tracking number, the page saves it, and the panel it came from goes blank.

  ## Context
  Part of feature: order-dispatch-tracking
  Phase: Phase 3 — One tracking store

  Depends on the PATCH rewrite, which already changed that endpoint's RESPONSE to return `shipment`. This ticket does the two GETs and the component.

  The API returns `shipment` — the live row, same predicate as everywhere else in this phase. Do not return both `shipment` and `shippingDetails`; a component reading whichever is populated is the split brain wearing a different hat.

  The customer-facing projection at `routes/orders.ts:920` must not gain fields the tracking route deliberately withholds. Compare against `trackingPayload` in `routes/tracking.ts` and match it — cost, weight, dims, external ids and the label token are internal.

  `packages/web` tests are NOT typechecked, so a stale prop type will not fail the gate. Check the component renders with the new shape rather than trusting types.
