    text: |-
      🔴 **Follow-up: two UI defects this ticket introduced, found by `/code-review high`**

      **Fix commit**: `cb1628cf`

      **1. The modal seeded `carrier` from `courierName`.** I wrote `carrier: order.shipment.courierName ?? order.shipment.carrier`. That field round-trips straight back into `order_shipments.carrier`, so the **first save overwrote the aggregator with the courier** — permanently destroying the very distinction this ticket introduced, and the one `getShippedTemplate` and the schema doc both rely on.

      The panel still *displays* the courier (that is the name on the parcel). The field that round-trips now seeds from `carrier`.

      **2. An ISO timestamp fed to `<input type="date">`.** `estimatedDeliveryAt` serialises as `2026-09-05T00:00:00.000Z`; a `date` input silently renders **blank** for anything that is not `YYYY-MM-DD`, and the blank then saved as `undefined`. Sliced to `.slice(0, 10)`.

      Compounded with the #707 merge bug, opening the modal to change *anything* corrupted the carrier and nulled the stored estimated delivery.

      **3. Four e2e tests I never checked.** `tests/e2e/admin-orders.spec.ts` still mocked `shippingDetails` and asserted `h3:has-text("Shipping Details")`, so it would have rendered the "No shipment yet" empty state and failed on all four assertions. Repointed to the shipment shape; the PATCH mock now returns `shipment` like the real route.

      That last one is a gap in my verification, not just my code: my completion note said the component was "verified by rendering", and I ran the web **unit** suite — but I never grepped the e2e specs for the shape I had renamed. `packages/web` tests are not typechecked, so nothing else would have caught it.

      **Verification**: api **6018 passed | 0 failed**; web **3805 passed | 0 failed**; `tsc --noEmit` clean on `packages/web`.
