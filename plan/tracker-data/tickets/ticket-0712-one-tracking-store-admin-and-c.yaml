    text: |-
      ✅ **Completed**

      **Commit**: `a5c522e6` - feat(web): show the shipment on order detail, not the store nobody writes

      **Files Changed**:
      - `packages/api/src/routes/tracking.ts` — helpers exported as `liveShipmentForOrder` / `trackingPayloadForOrder`
      - `packages/api/src/routes/admin/orders.ts` — admin detail returns the whole shipment row
      - `packages/api/src/routes/orders.ts` — customer detail goes through the tracking allow-list
      - `packages/web/app/components/admin/OrderDetail.tsx` — new `Shipment` type, panel rewritten, form reseeded
      - `packages/api/tests/routes/order-detail-shipment.test.ts` — new, 4 tests
      - `packages/api/tests/routes/order-promotion-pricing.test.ts` — fixture gap

      **Summary**:
      Three surfaces still projected `orders.shipping_details`. Left alone, the admin types a tracking number, the save succeeds, and the panel it was typed into goes blank.

      **The two sides get different shapes, deliberately:**
      - **Admin gets the whole row**, including `costPaise`. Shipping is baked into the item price so the customer pays nothing for it — that makes what *we* paid the only number margin can be read from, and this is the screen it belongs on.
      - **The customer goes through the same allow-list `/api/tracking/*` uses**, by *importing* it rather than rebuilding it. One definition of "what a customer may see about a parcel" means adding a dispatch column cannot widen this surface without widening the tracking page too. A test pins that nine internal fields (`costPaise`, `labelObjectToken`, the external ids, weight, dimensions, `pickupVendorId`) never appear.

      **Two UI decisions:**
      - The panel shows the **courier**, not the aggregator — `courierName` is the name on the delivery. It prefers the AWB over the internal tracking number for the same reason.
      - It renders an **explicit empty state** instead of hiding itself. A panel that disappears when its data is missing is precisely how `orders.shipping_details` went unread for months; "No shipment yet" is a fact.

      The shipping form is seeded from the same shipment, so the value it starts with and the value the save returns are one object.

      **One fixture gap**, same class as #710: `order-promotion-pricing.test.ts` mocked a `db` with no `query.orderShipments`, so order detail 500'd once it resolved a shipment. That suite is about promotion figures, so "no shipment" is the right answer — the read just has to exist.

      **Verification**:
      - api: **6017 passed | 0 failed | 188 skipped (6205)**
      - web: **180 files, 3805 passed | 0 failed**
      - Scoped: new suite 4/4; web `tests/routes/admin` 524/524
      - Typecheck: PASS across all three packages, `packages/web` included

      **Note**: `packages/web` tests are not typechecked in this repo, so the component change was verified by rendering and by `tsc --noEmit` on the package, not by test types.
