    timestamp: '2026-09-01T04:27:27.894Z'
    text: |-
      Design decisions written into packages/api/src/services/shiprocket.ts, and what they are answering.

      1. The order of the write decisions is data, not prose. The file's correctness rested on branch
         ORDER — move the token check, the already-exists check or the AWB attribution check by one
         position and an unknown outcome becomes a definite refusal whose text is "safe to correct and
         ask again", i.e. an instruction to mint a second real courier order or waybill. Nothing but a
         numbered list in a 200-line header held that in place. There are now four ordered clause tables
         (`COURIER_WRITE_CLAUSES`) assembled by `orderedClauses(open, definite)`: the two parameters have
         different element types, so a definite refusal cannot be written among the open clauses without
         a typecheck failure, and the concatenation happens in exactly one place. The order INSIDE each
         group is pinned by name, every clause has a scenario driving the real client, every adjacency is
         either driven with a body that satisfies BOTH clauses or listed as mutually exclusive with a
         reason, and the verdict a clause declares is checked against the HTTP status
         SHIPROCKET_REFUSAL_STATUS gives its error.

      2. The two writes now share their first three refusal clauses through one factory
         (`sharedRefusalClauses`). Every defect found in this file across four rounds was one argument
         applied to one write and dropped on its sibling; a shared factory makes that drift something you
         have to work at.

      3. `saysAlreadyExists` reads the SUBJECT of the sentence, not the words. Laravel's
         `The :attribute has already been taken.` is decided on the attribute against a closed list of
         things this client MAKES, so "The order items.0.sku has already been taken." and
         "The pickup location has already been taken." no longer come back as a 409 about the order — and
         the pickup-location refusal is reachable for that wording again. The residual (a subjectless
         "already exists" now reads as a definite refusal) is stated on the function.

      4. `assignAwb` coalesces on the Shiprocket shipment id, the same mechanism the create has. The
         absence used to be defended by a claim about what Shiprocket does with a repeated `shipment_id`
         — a fourth unverified premise in a file whose header asserts there are exactly three. The
         premise is retired rather than documented.

      5. The in-flight maps are described as covering OVERLAP only. The entry is released in a `finally`,
         before the caller has written the ids, so the lookup-vs-write window is the caller's lock and
         nothing else; the header used to claim otherwise.

      6. A consignee with a blank pincode/phone/email is refused before the network
         (SHIPROCKET_CONSIGNEE_INVALID, 422), which is what makes clause 0 of the header true. The
         message names the fields and never the customer's values.

      7. `courier_id` goes through `finiteNumber`, so a NaN no longer reaches the wire as
         `"courier_id": null`.

      Ticket's three named properties, all covered:
        - a successful create returns both ids  -> "returns both ids Shiprocket answers with, as strings"
        - a timed-out create then retried does not duplicate -> "a create that times out and is then
          retried does not make a second order", with the paired control that an unreconciled retry DOES
          create a second order (so the test is not vacuous)
        - an AWB answer naming a different courier stores the one that came back -> "returns the courier
          that ANSWERED, not the one requested", asserted in both directions
      `pickup_location` is the vendor nickname, trimmed but never case-folded, and a Shiprocket rejection
      of it is classified into a refusal that names OUR value and tells the admin which column to fix.
