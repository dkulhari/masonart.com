ticket_number: 605
title: Photo approvals section is unreachable from the admin sidebar
description: |-
  ## Problem

  `/admin/approvals` is fully built — `packages/web/app/routes/admin/approvals/index.tsx` (557 lines), `approvals/$id.tsx` (686 lines), backed by `packages/api/src/routes/admin/approvals.ts` (468 lines, mounted at `/api/admin/approvals`), and the `photo-approval-workflow` feature is at 100%.

  It appears in neither `NAV_ITEMS` nor `SECONDARY_NAV_ITEMS` in `packages/web/app/components/admin/AdminSidebar.tsx`, and there is no quick-action card for it on the dashboard. The only way in is to type the URL.

  Customer-submitted photos therefore queue up with nothing in the UI pointing an operator at the queue. This is the mirror image of the dead-links bug: four nav entries with no screen, one screen with no nav entry.

  ## Fix

  - Add an `Approvals` entry to `NAV_ITEMS` (operational surface — belongs in the primary list next to Reviews / AI Moderation, not under the Settings group).
  - Confirm the intended role gate. `approvals.ts:108-109` uses `requireAuth` + `requireAdmin`, so it must stay invisible to `content-manager` — `isAdminNavItemVisible` already handles this correctly as long as `/admin/approvals` is not added to `CONTENT_MANAGER_ALLOWED_PREFIXES`.
  - Consider a pending-count badge; `NavItem` already supports `badge` (`AdminSidebar.tsx:49`) and `GET /api/admin/approvals/stats` already exists (`approvals.ts:197`), but no nav item uses either today.

  ## Verification

  - `AdminSidebar.test.tsx`: Approvals renders for `admin`/`super-admin`, and does **not** render for `content-manager`.
  - Covered by the route-tree parity test proposed in the dead-links ticket, from the other direction: every admin route should be reachable from the nav, or be explicitly listed as an intentional detail-only route.
