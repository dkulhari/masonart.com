    text: |-
      ✅ **Completed** — commit `29611f2f`. The ticket's premise was wrong: this was never data-dependence.

      **Root cause, one missing character**: the block registered `page.route('**/api/admin/orders', ...)`, but the dashboard requests `/api/admin/orders?pageSize=5&sortBy=createdAt&sortOrder=desc` (`packages/web/app/routes/admin/index.tsx:113`). Without the trailing `*` the glob matched nothing, the mock never engaged, the real API answered with the real orders, and the dashboard correctly rendered a list where the test wanted an empty state. `setupDashboardMocks` has always had the star — which is why every other block in the file works.

      **Second bug, same block**: `page.locator(':has-text("No orders yet")')` matches every ANCESTOR containing that string — `html` and `body` included — so `.locator('svg').first()` returned the first icon anywhere on the page (a sidebar icon). The assertion neither proved the cart icon was present nor failed when it was absent. Now anchored on the message's own parent.

      **Verification**:
      - Command: `SKIP_E2E_SERVER=true E2E_BASE_URL=http://localhost:4321 E2E_API_URL=http://localhost:3010 bunx playwright test tests/e2e/admin-dashboard.spec.ts --project=chromium`
      - Result: PASS — **85 passed**, 0 failed (was 82 passed / 3 failed)

      No database reset needed, then or now. The suggested "make the E2E scope its own data" is moot — the mock already did, it just wasn't reaching.
