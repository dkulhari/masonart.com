ticket_number: 399
title: Web - sidebar facet groups driven by the shared vocabularies
description: |-
  ## Task

  Replace the hardcoded option literals in `packages/web/app/components/product/ProductFilters.tsx:75-140` with the shared vocabularies, and add the new groups: Vibe, Aesthetic, Medium, Uniqueness, Availability.

  With nine facet groups the rail gets long — the existing `FilterSection` collapse already handles that; pick sensible default-expanded sections rather than opening all nine.

  ## Context

  Feature: product-metadata-facets
  Blocked by the shared vocabulary and API tickets.

  **Constraints**
  - **No local literals.** A guard test must assert the component imports the vocabularies rather than redeclaring them — that drift is the whole reason for this feature.
  - Orientation renders mesonart's labels (Vertical / Horizontal / Circle / Set of 2-3) over our stored ids (portrait / landscape / round / set-of-2-3).
  - Counts from #392 apply to the new groups too; zero-count options stay disabled rather than hidden.
  - Filter state currently has fixed keys (`styles`, `subjects`, `colors`, `rooms`, …). Adding five more means touching `FilterState`, the URL search params, `validateSearch` (params arrive as strings — coercion must hold), and the clear-all handler. Missing one leaves a filter that cannot be cleared.
  - The storefront token guard applies: no `font-bold`, no brand utilities.
