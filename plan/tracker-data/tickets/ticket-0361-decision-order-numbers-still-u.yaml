    text: |-
      ✅ **Completed** — decision recorded and implemented: switch to `CA-` (chobiiart).

      **Commits**:
      - `6f01bb2f` — feat(api): issue order numbers under the chobii CA- prefix
      - `288c8536` — the two web-side edits (the `/track` placeholder and its mirrored test fixture) were swept into another session's commit while this ticket was in flight. Content is correct and in `main`; only the attribution is wrong.

      **Files Changed**:
      - `packages/api/src/lib/order-number.ts` — `ORDER_NUMBER_PREFIX` is now `CA`; added `LEGACY_ORDER_NUMBER_PREFIXES` (`MA`), `ORDER_NUMBER_PREFIXES`, `isOrderNumber()` and `orderNumberYearPrefixes()`
      - `packages/api/src/routes/admin/orders.ts` — deleted its private copy of the constant, now imports the shared helper; 5 lookup gates
      - `packages/api/src/routes/orders.ts` — 4 lookup gates
      - `packages/api/src/database/seed-orders-reviews.ts` — seed fixtures moved off a third prefix, `CH-SEED-`, to `CA-SEED-`
      - `packages/api/tests/lib/order-number.test.ts` — new
      - `packages/api/tests/routes/{orders,admin/orders}.test.ts` — removed the tautological `Order Number Format` blocks
      - `packages/web/app/routes/track/index.tsx` — placeholder now `e.g., CA-2026-001234`

      **Decisions taken inside the switch**:
      1. **Reads accept both prefixes.** Both order routes gate on the prefix *before* they will query, so a bare flip would have turned every historical `MA-` number into a 400. `isOrderNumber()` tests against `CA-` and `MA-`, and is now the only definition of that check — `admin/orders.ts` had been carrying a duplicate constant that would have had to be flipped in lockstep.
      2. **The year sequence continues; it does not reset.** `generateOrderNumber` counts rows under *every* known prefix for the year. Counting `CA-` alone would have restarted at 000001 mid-year and put two different orders at sequence 1 in it — the reporting cost weighed on this ticket.
      3. **The separator is part of the check.** `startsWith("CA")` alone would read "CANCELLED" as an order number.

      **Found while doing it**: seed orders were numbered `CH-SEED-####`, a prefix no lookup ever recognised — a seeded order could not be opened in admin by its number at all. Fixed by renumbering the seeds rather than widening the accepted prefix set for dev-only data.

      **Verification**:
      - Command: `pnpm exec vitest run tests/lib/order-number.test.ts tests/routes/orders.test.ts tests/routes/admin/orders.test.ts tests/routes/tracking.test.ts` (in `packages/api`)
      - Result: PASS — `Test Files 4 passed (4)`, `Tests 278 passed (278)`. The route suites look orders up by `MA-` numbers throughout, so their passing is the evidence that legacy numbers still resolve.
      - Command: `pnpm run typecheck` in `packages/api` (src + tests) and `packages/web`
      - Result: PASS — 0 errors. This gate caught a real defect mid-work: the mechanical rename produced `const isOrderNumber = isOrderNumber(id)`, shadowing the import at all 9 call sites. The tests passed anyway; only the typecheck saw it.
      - Command: `pnpm exec vitest run tests/components/tracking/GuestOrderLookup.test.tsx` (in `packages/web`)
      - Result: PASS — 20 passed.

      **Left out deliberately**: `docs/manual-tests/*.md` still quote `MA-` examples. They were already wrong in a second way — they describe the format as `MA-YYYYMMDD-XXX`, which the generator has never emitted — so sedding the prefix would leave an incorrect format wearing a new brand. Worth its own ticket.

      **Not covered by any test**: production back-compat rests on `MA-` staying in `LEGACY_ORDER_NUMBER_PREFIXES`. The dev database has 0 real orders, so nothing local would fail if it were dropped.
