    text: |-
      📄 **Docs cleanup** (follow-up in the same ticket, at user request)

      **Commit**: `1b6760e7` — docs(manual-tests): correct the documented order number format

      The earlier comment deferred this. Doing it turned up more than a stale prefix: across seven files the manual tests described **four different formats**, and `generateOrderNumber` has never emitted any of them.

      | File | Documented | Reality |
      |---|---|---|
      | admin-orders.md, admin-dashboard.md | `MA-YYYYMMDD-XXX` | `CA-YYYY-NNNNNN` |
      | account.md | `MA-20240115-0001` | `CA-YYYY-NNNNNN` |
      | order-tracking.md | `MA-2024-001` (3-digit sequence) | `CA-YYYY-NNNNNN` |
      | orders-api.md (×3), order-confirmation.md | `ORD-XXXXXXXX` | `CA-YYYY-NNNNNN` |

      Sweeping the prefix alone would have left every one of these wrong, just wearing a new brand. All seven now carry the real format.

      **Three places gained a line, not just a correction** — the spots where the back-compat this ticket introduced is actually exercised by hand: admin search by order number, admin fetch by order number, and the format summary in `orders-api.md`. Each now records that `MA-` numbers still resolve, so a tester meeting one does not file it as a bug.

      **Left alone**: `docs/plans/2026-02-01-verified-purchase-reviews-plan.md` keeps its `MA-TEST-` fixtures. It records a plan executed in February, not a live procedure — editing it would misreport what was written at the time.

      **Verification**:
      - Command: extracted every order-number-shaped token (`\b(?:CA|MA)-[0-9A-Z-]+`) from `docs/manual-tests/*.md` and matched each against the generator's format `^(CA|MA)-\d{4}-\d{6}$`, allowing the two deliberate partial-search examples (`CA-2026`, `MA-2024`) and the `CA-YYYY-NNNNNN` placeholder.
      - Result: PASS — 17 examples checked, 0 mismatches.

      Markdown only; no code changed, so the test and typecheck evidence from the previous comment still stands.
