ticket_number: 638
title: Core - recordAudit service that never throws and accepts a transaction
description: |-
  ## Task
  Implement `recordAudit(c, entry, tx?)`: derive the actor from `c.get('user')` (id + email + role snapshot), the IP from the existing `getClientIp()`, the request id from `c.get('requestId')`, redact the payload, insert one row, and set `c.set('audited', true)` so the middleware floor suppresses its own row.

  It must never throw: a failed audit write logs at error with the request id and calls the existing alert path, then returns. An audit failure must not roll back a refund that already happened.

  ## Context
  Part of feature: admin-audit-log (Phase 2 - Core)
  Spec: docs/plans/2026-08-17-logging-and-auditing.md D8 and section 3.3
  Reuse `getClientIp` from packages/api/src/middleware/rate-limit.ts - do not write a second IP resolver.
  Route tests mock `db`, so assert the insert through the mock; a real-DB assertion belongs to the schema/integration ticket.
