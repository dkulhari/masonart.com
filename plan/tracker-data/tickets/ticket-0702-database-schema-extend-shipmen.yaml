  - id: 3
    action: implement
    description: Add the five values to the drizzle enum, in lifecycle order
    file: packages/api/src/database/schema/shipping.ts
    status: done
    code: |-
      /**
       * Shipment status enum for tracking order delivery lifecycle.
       *
       * Sorted as the work moves, not as the values were added: an NDR happens on a
       * delivery ATTEMPT so it sits before `delivered`, and the three ways a parcel
       * ends up somewhere other than the customer sit after it.
       *
       * `failed` is a failed DELIVERY and always was — it is NOT a voided label.
       * `cancelled` is the voided one. Keeping them apart is the whole reason this
       * type grew: `order_shipments` had no way to say "this label is dead", so
       * `lib/vendor-scope.ts` had to guess the live label by recency.
       */
      export const shipmentStatusEnum = pgEnum("shipment_status", [
        "pending", // Shipment created, awaiting label
        "label_created", // Shipping label generated
        "shipped", // Package handed to carrier
        "in_transit", // Package in transit
        "out_for_delivery", // Out for final delivery
        "undelivered", // NDR: an attempt failed, the courier is holding it
        "delivered", // Successfully delivered
        "rto_initiated", // On its way back to the pickup location
        "rto_delivered", // Back at the pickup location
        "lost", // The courier cannot account for it
        "cancelled", // The label was voided or the shipment cancelled
        "failed", // Delivery failed
      ]);
  - id: 4
    action: implement
    description: Generate the migration, then annotate it and strip anything that is not an ADD VALUE
    file: packages/api/src/database/migrations/0026_shipment_dispatch_statuses.sql
    command: cd packages/api && bun run db:generate
    status: done
    code: |-
      -- order-dispatch-tracking phase 1: the states a real courier reports.
      --
      -- ADD VALUE statements and NOTHING else, deliberately.
      --
      -- `drizzle-kit migrate` wraps the whole pending batch in ONE transaction, and
      -- Postgres refuses any use of a value added by `ALTER TYPE ... ADD VALUE` in
      -- that same transaction: `unsafe use of new value "x" of enum type y`. Note
      -- that splitting the ADD VALUE and its first use across two migration FILES
      -- does not help — on a fresh database both files are in the same batch. That is
      -- #580, and 0023 is the precedent.
      --
      -- So: no backfill here, no index predicate, no CHECK constraint. The dispatch
      -- COLUMNS are a separate migration for the same reason.
      --
      -- BEFORE places each value in lifecycle order rather than appending it, so the
      -- enum's sort order still reads as the sequence of work and matches the drizzle
      -- DSL array. `delivered` and `failed` are pre-existing values, so naming them
      -- here is a catalog lookup, not a use of anything new.

      -- An attempt failed and the courier is holding the parcel. NOT `failed`, which
      -- is the end of the line.
      ALTER TYPE "public"."shipment_status" ADD VALUE 'undelivered' BEFORE 'delivered';--> statement-breakpoint
      -- Going back to the pickup location, and arrived there.
      ALTER TYPE "public"."shipment_status" ADD VALUE 'rto_initiated' BEFORE 'failed';--> statement-breakpoint
      ALTER TYPE "public"."shipment_status" ADD VALUE 'rto_delivered' BEFORE 'failed';--> statement-breakpoint
      -- The courier cannot account for it.
      ALTER TYPE "public"."shipment_status" ADD VALUE 'lost' BEFORE 'failed';--> statement-breakpoint
      -- The LABEL is dead. `failed` is a failed delivery and never meant this.
      ALTER TYPE "public"."shipment_status" ADD VALUE 'cancelled' BEFORE 'failed';
