      **Summary**:
      Added `undelivered`, `rto_initiated`, `rto_delivered`, `lost`, `cancelled`. `cancelled` is the load-bearing one: a dead LABEL is not a failed DELIVERY, and having no word for it is why `lib/vendor-scope.ts` guesses the live label by recency. #705 consumes it.

      Placement uses `BEFORE` anchors so `enumsortorder` reads as the sequence of work. Verified against the live catalog, not just the DSL.

      **Two things found in passing, both real:**

      1. `migration-enum-literals.test.ts` (#673/#580 guard) had a latent false positive. Its `ADD_VALUE` regex matched only as far as the added value, leaving ` BEFORE 'x'` in the residue it scans for unsafe uses. So adding `'cancelled'` to `shipment_status` was reported as `0023` unsafely using it — on `production_job_status`, a different type. `addedEnumValues()` is keyed by value NAME across all enums while Postgres blacklists a (type, value) pair. It had stayed green only because no added value had yet collided with an anchor. Regex now consumes the anchor; a pinning test was added so nobody "fixes" it later by weakening the scan.

      2. `shipping.test.ts` pinned the enum in three places, two as `toHaveLength(7)`. Now one `SHIPMENT_STATUS_LIFECYCLE` list asserted three ways.

      **Migration applied to the shared dev DB on :5440** (user approved — it turns other sessions' copy of `shipping.test.ts` red until this branch merges, since theirs expects 7 values):
