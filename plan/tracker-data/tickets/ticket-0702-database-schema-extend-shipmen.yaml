ticket_number: 702
title: Database Schema - Extend shipment_status with the RTO, NDR and cancelled states
description: |-
  ## Task
  `shipment_status` has seven values and stops at `failed`, which means a failed DELIVERY. It has no word for a voided label, for an NDR the courier is holding, for a parcel travelling back to us, or for one that was lost. Dispatch cannot record what a courier actually reports without them.

  Five new values: `undelivered` (NDR), `rto_initiated`, `rto_delivered`, `lost`, `cancelled` (the label was voided or the shipment cancelled — NOT a delivery failure).

  ## Context
  Part of feature: order-dispatch-tracking
  Phase: Phase 1 — Database Schema

  Pattern to follow: `packages/api/src/database/migrations/0023_production_pipeline_statuses.sql`. That migration is `ALTER TYPE ... ADD VALUE` statements and **nothing else**, and its header says why: `drizzle-kit migrate` wraps the whole pending batch in ONE transaction, and Postgres refuses any use of a value added by `ALTER TYPE ... ADD VALUE` in that same transaction. Splitting the ADD VALUE and its first use across two migration FILES does not help — on a fresh database both files are in the same batch. That is #580.

  So: no backfill, no index predicate, no CHECK constraint in this migration. `BEFORE` places each value in lifecycle order rather than appending, so the enum's sort order still reads as the sequence of work and matches the drizzle DSL array.

  Migrations are applied with `db:migrate`, never `db:push` (#663).
