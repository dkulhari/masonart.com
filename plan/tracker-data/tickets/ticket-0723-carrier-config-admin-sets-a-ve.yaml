      - Result: PASS — **4 files, 70 tests, 0 failed**
      - Command: `cd packages/web && bunx vitest run tests/routes/admin/`
      - Result: PASS — **19 files, 501 tests, 0 failed**
      - Command: `bun run typecheck` → 4 tasks successful
      - `tests/e2e` greped for vendor shape assertions: no exact-key checks, and `admin-vendor-lifecycle.spec.ts` fills by label and submits, so an optional empty field does not disturb it.
