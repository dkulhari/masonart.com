    text: |-
      ✅ **Completed** — phase 5 is done.

      **Commit**: `fd0ca676` - feat(admin): let an admin set a vendor's Shiprocket pickup nickname

      **Files Changed**:
      - `packages/api/src/routes/admin/vendors.ts` — `shiprocketPickupLocation` on `createVendorSchema`
      - `packages/api/tests/routes/admin/vendors.test.ts` — 8 new tests
      - `packages/api/tests/database/vendor-shiprocket-pickup.test.ts` — the column half of the cap pairing
      - `packages/web/app/routes/admin/vendors/VendorForm.tsx` — the field
      - `packages/web/app/routes/admin/vendors/$id.tsx` — `AdminVendor` type and `toFormValues`
      - `packages/web/tests/routes/admin/vendor-form-shiprocket.test.ts` — 5 tests

      **The one that would have hurt.** `toFormValues` in `$id.tsx` maps the fetched vendor into form values. Omit the new line and opening the form shows an empty box for a vendor that *has* a pickup location — and the first save sends `null` and wipes it. That is #707's partial-update data loss, one form along, and I nearly shipped it: I added the field to `VendorForm` before checking the hydration path. It is now a compile error rather than a matter of remembering, since `VendorFormValues` requires the key and `packages/web` app code is typechecked.

      **The cap is asserted from both sides.** The column is unbounded `text`, so the 200 cap is ours and storage cannot be what rejects a value. The route suite pins 200 accepted / 201 refused; the schema suite pins `PgText` with no `length`. The review found a 100-char zod cap over a `varchar(64)` — a value the API accepted and the database refused. Both ends are now pinned so that cannot recur here.

      **`''` never reaches the column.** Zod trims and transforms blank to `null`; `VendorForm`'s existing `orNull()` already did the client half. Tested on both: `'   '` and an explicit `null` both store `null`.

      **No new audit action, as the ticket asked me to check.** `vendors.ts` already emits `vendor.updated` with `diffRecords(before, after, Object.keys(body))`, so a field added to the body flows into the delta unaided, and `vendor.updated` is already declared in `AUDIT_ACTIONS` — #671's build guard is not tripped. Verified by reading the handler; I did not add a test for it, since that suite does not mock `recordAudit` and the path is generic.

      **Accessibility detail worth recording**: the hint sits *outside* the `<label>`. A label that wraps its input contributes all of its text to that input's accessible name, so help text inside it becomes part of the name the field answers to — and part of every `getByLabel` for it. Linked with `aria-describedby`.

      **Honest note on TDD order**: the API tests were written first and observed failing (6 of 8 red). The web test was written *after* the form change, so it never had a RED phase. It still asserts real behaviour — an omitted key reads `undefined`, not the nickname — but it was not driven out test-first.

      **Verification**:
