      ✅ **Completed**

      **Commit**: `b794153b` - test(e2e): an admin ships an order through the dispatch screen and the customer sees the AWB

      **Files Changed**:
      - `tests/e2e/production-pipeline.spec.ts` - two tests added before the handover step, so the whole chain runs on one order: "an admin buys the label from the dispatch screen, and the courier is asked exactly once" and "the customer sees the AWB, from a clean context". Two hardenings of the existing chain: the order picker skips orders already carrying a shipment row (the #713 tracking E2E leaves one behind on whichever order it picked, and `ORDER_HAS_LABEL` rightly counts a tracking number — the "REFUSAL: frame job cannot claim handover" step was failing on that leftover, not on code), and the screen-driven assign step waits for its own response before the job status is read (a real race: the click's request left after the status read).
      - `scripts/e2e/shiprocket-stub.ts` - the courier that buys nothing: answers login, serviceability, create/adhoc, assign/awb, generate/label (a plain-http loopback label URL), the label file, generate/pickup and cancel, in the documented shapes; keeps a ledger at `/__calls` the spec counts
      - `playwright.config.ts` - the stub is a web server started first; the API's `bun run dev` gets `SHIPROCKET_BASE_URL=http://127.0.0.1:4977/v1/external` and stub credentials (none of them real)
      - `turbo.json` - `globalPassThroughEnv` for `DISABLE_RATE_LIMIT` and the `SHIPROCKET_*` variables, so turbo hands them to the API task by name
      - `packages/api/src/services/shiprocket.ts` - `isFetchableLabelUrl` admits plain http to the loopback ADDRESS only (127.0.0.1 / [::1]); `localhost` is a hostname and stays refused; test added

      **What the spec proves, with Shiprocket stubbed and nothing else**: the ready queue shows the order as ready with no blockers; the parcel is entered and Buy is double-clicked; the ship route answers 201 with a body carrying no `labelObjectToken`, `costPaise`, `pickupVendorId` or URL; the receipt at the top of the page names the waybill and the row leaves the ready list; the stub's ledger shows exactly one of each — quote, create, assign, label, file fetch, pickup; the row is `label_created` with the stub's AWB and courier; `GET /api/admin/shipments/:id/label` returns `application/pdf` bytes beginning `%PDF-`; a fresh browser context with no session hits `/api/tracking/lookup` and `/track` and finds the same waybill, with none of the three internals in the customer body; vendor B's handover then succeeds against a label a courier actually issued.

      **Not asserted, on purpose**: the admin ORDER detail (`GET /api/admin/orders/:id`, #712) returns the shipment row whole — cost included — because the admin order screen renders what we paid. The allow-list the tickets demand is on the ship route's own response and on the customer side; both are asserted.

      **Verification** (private server pair on :3010/:4321 pointed at the stub on :4977, postgres :5440, redis and minio started for the run):
      - `SKIP_E2E_SERVER=true E2E_BASE_URL=http://localhost:4321 E2E_API_URL=http://localhost:3010 bunx playwright test tests/e2e/production-pipeline.spec.ts --project=chromium` → **22 passed, 1 skipped** (the pre-existing `test.skip` at "the consolidator signs the carrier label"), 0 failed, 1.4 min. Executed, not skipped: both new tests ran and passed; earlier runs failed them for real reasons (row marker cleared by the refetch, `customer.email` field name) before passing.
      - `bunx vitest run tests/services/shiprocket-label-pickup.test.ts tests/services/shiprocket-courier-writes.test.ts` → 37 + 182 passed; `bunx tsc --noEmit` clean; pre-commit turbo typecheck 4/4
      - Servers torn down after the run; the stub's ledger showed the full purchase sequence exactly once on every passing run.
