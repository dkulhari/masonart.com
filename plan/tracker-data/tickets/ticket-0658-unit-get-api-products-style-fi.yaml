ticket_number: 658
title: Unit - GET /api/products style filtering fails against the seeded database
description: |-
  ## Finding
  Baseline sweep 2026-08-17, present at `485fa949`:

  ```
  tests/routes/products.test.ts
    > Products Runtime Tests (Database Required) > GET /api/products - List Products > should filter by styles
  ```

  A runtime test against the real database, so it is either a genuine filter defect or an assumption about seeded data that the current seed no longer satisfies. The seed has been reshaped several times since (art-box backfill, orientation correction, watermark work), so the second is likely — but it needs checking rather than assuming, because a broken `styles` filter is a customer-visible catalogue bug.

  ## Steps
  - Run the query the route builds against the dev database by hand and compare with what the test expects
  - If the seed changed, re-derive the fixture from what the seed actually writes; if the filter is wrong, fix it and keep the test
