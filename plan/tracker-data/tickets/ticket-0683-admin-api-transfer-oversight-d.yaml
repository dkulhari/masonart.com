    text: |-
      ✅ **Completed**

      **Commit**: `43dbc870` — feat(api): admin transfer oversight, and the replacement job for a lost parcel

      **Files Changed**:
      - `packages/api/src/routes/admin/transfers.ts` (new) — `GET /api/admin/transfers` and `POST /api/admin/transfers/:id/lost`, plus the exported `transferState` pure function and its SQL twin.
      - `packages/api/tests/routes/admin/transfers.test.ts` (new) — 37 tests.
      - `packages/api/src/index.ts` — mounts the router at `/api/admin/transfers`, after the `/api/admin` catch-all mounts (checked: neither `adminOrderShipmentsApp` nor `adminNotificationsApp` still carries a single-segment `GET /:id`, which is what killed the vendor directory and production queue once before).
      - `packages/api/tests/helpers/query-recorder.ts` — adds a `for` link so a `FOR UPDATE` read is recordable. Additive; the four other suites on this helper still pass.

      Nothing in `routes/admin/production-jobs.ts`, `routes/vendor.ts` or `routes/admin/shipments.ts` was touched.

      **Summary**

      `POST /:id/lost` runs entirely in one `db.transaction`: `SELECT … FOR UPDATE` on the transfer; 404 unknown; **409 if `received_at` is set**; 409 if already lost; a guarded `UPDATE … WHERE id = ? AND received_at IS NULL AND lost_at IS NULL RETURNING id` whose row-count mismatch rolls everything back; `SELECT … FOR UPDATE` over the jobs on the parcel; **422 if any job is not `from_vendor_id`'s**; the originals' `production_job_items` read; one batch insert of `draft` replacement jobs with `replaces_job_id` set (count checked against the lost-job count, mismatch → rollback); the same order items re-inserted under the new job ids; then `recordAudit(c, …, tx)`.

      The core decision holds mechanically: **the route issues no `UPDATE` against `production_jobs` at all**, so the original stays `dispatched` with its payable intact. Replacements are created unassigned and unpriced — `draft` is where assignment prices against the rate card live at that instant, so copying A's amount forward would charge a different vendor's work at A's rate.

      Audit contract, both directions: the success row shares `tx` (it asserts something the transaction must make true) and carries `lostJobIds` + `replacementJobIds`; every refusal row is written **without** `tx`, from the catch, after the rollback. `recordAudit`'s rethrow is deliberately not caught — an aborted audit insert gives a 500, never a 200 over a silent rollback.

      No status enum was added. State derives from the three timestamps through `transferState` (arrival wins over a lost stamp), and `?state=` renders as timestamp predicates — asserted by a test that fails if the word `status` ever appears in that WHERE clause.

      **Correction carried from the plan comment**: `production_job_items` has no live-claim index. `0019_vendor_management_phase_1.sql:105` gives it the composite `UNIQUE("job_id","order_item_id")`; the only live-claim index nearby is `production_job_photos_live_slot_unique` (0024), on a different table. So no claim needed releasing, and the original's item rows are deliberately left in place — they are the record of what its intact payable was for. Deleting them would have destroyed exactly that.

      **Verification**:
      - Command: `npx vitest run tests/routes/admin/transfers.test.ts` (from `packages/api`)
      - Result: PASS (37 tests, 37 passing, 0 failing)
      - Output: `Test Files 1 passed (1) / Tests 37 passed (37)`

      - Command: `npx vitest run tests/routes/admin/transfers.test.ts tests/routes/admin/vendors.test.ts tests/routes/admin/vendor-rates.test.ts tests/routes/admin/vendor-payables.test.ts tests/routes/vendor/jobs.test.ts tests/database/production-transfers.test.ts`
      - Result: PASS (196 tests) — the suites sharing `query-recorder.ts` are unaffected by the `for` link.

      - Command: `bun run typecheck` (the pre-commit gate, all three packages)
      - Result: PASS — `Tasks: 4 successful, 4 total`. The commit went through the hook, not around it.

      **Mutation check** (evidence the suite bites, not just passes). Three deliberate breakages were introduced and reverted; each was caught by exactly one intended test:
      | Mutation | Test that failed |
      |---|---|
      | refusal audit given `tx` | records every refusal OUTSIDE the transaction, or the refusal erases itself |
      | predicate dropped from the guarded UPDATE's WHERE | stamps lost_at and lost_note, repeating the predicate in the WHERE |
      | one `.for("update")` removed | takes FOR UPDATE on both reads inside the transaction |

      **Not staged**: `plan/tracker-data/` was left dirty. `.index.json` and `features/production-pipeline.yaml` are being written concurrently by sibling agents on #684/#685/#686, and committing a ticket file without its index would land an inconsistent pair.
