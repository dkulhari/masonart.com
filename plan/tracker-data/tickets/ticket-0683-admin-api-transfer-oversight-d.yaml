      4. [implement] `POST /:id/lost` in ONE `db.transaction`: `SELECT … FOR UPDATE`; 409 on `received_at`; 409 on an existing `lost_at`; guarded `UPDATE … WHERE received_at IS NULL AND lost_at IS NULL RETURNING id` with a row-count mismatch rolling back; read the jobs on the parcel; 422 if any is not `from_vendor_id`'s; copy their `production_job_items`; insert one `draft` replacement per lost job with `replaces_job_id` set; `recordAudit(c, …, tx)`.
      5. [implement] Mount in `src/index.ts`.
      6. [verify-pass] `npx vitest run tests/routes/admin/transfers.test.ts` from `packages/api`.
      7. [verify-pass] `npx tsc --noEmit` and `npx tsc -p tsconfig.test.json --noEmit` (#662 gate: tests are typechecked).
      8. [commit] Stage only the four files by path.

      **Correction to the ticket brief.** The brief says `production_job_items` carries "a live-claim unique index from 0024/0025" that must be released before the replacement's rows insert. It does not. `0019_vendor_management_phase_1.sql:105` gives it a plain composite `UNIQUE("job_id","order_item_id")`, and no migration adds a partial index over `order_item_id` — the only live-claim index in this area is `production_job_photos_live_slot_unique` (0024), on a different table. So the replacement's item rows insert cleanly under a new `job_id`, and the original's rows are deliberately **left in place**: they are the record of what the original's still-intact payable was for. Deleting them to "release a claim" would have destroyed exactly that. Everything still happens in one transaction, for the reasons that do apply.
