title: Mobile bottom tab bar — Home, Menu, Search, Shop, Cart, Account
description: |-
  BAR: mesonart at 390 pins a six-item bottom tab bar to the viewport for the whole session — Home, Menu, Search, Shop, Cart, Account, each a line icon over a small label, on white with a hairline top border and safe-area padding.

  OURS TODAY: nothing. Our mobile header carries only the wordmark, a cart icon and a hamburger, so search and account are two taps away.

  This is global chrome, so land it where the header and footer live rather than inside the home route, and make sure it does not cover the last band of any page or the cart drawer. Judged on the home page at 390.
