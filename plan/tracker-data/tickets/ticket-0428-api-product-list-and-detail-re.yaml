    text: |-
      ✅ **Completed**

      **Commit**: `2e85f7f1` — feat(api): resolved sale price on the product list and detail

      **Files Changed**:
      - `packages/api/src/routes/products.ts` — `sale` on the list and detail payloads, viewer-keyed cache keys, `rooms` added to the list projection
      - `packages/api/tests/routes/product-sale-pricing.test.ts` — new, 16 tests

      **Summary**:
      `GET /api/products` and `GET /api/products/:slug` attach `sale: ResolvedSalePrice | null`, resolved through `lib/promotion-pricing`. `getActivePromotions` + `loadPromotionProductSets` are called once per request via a `loadSaleContext` helper and the sets handed to every line, so a 24-card grid costs the same two queries as a one-card one — asserted with `toHaveBeenCalledTimes(1)` over a three-product page.

      `endsAt` never crosses the wire: only the resolved payload is serialised, never the promotion row. Asserted on `JSON.stringify(body)` for both routes.

      Cache keys carry the viewer (`:member` / `:guest`) on the list **and** the detail route. The ticket only called out `PRODUCT_LIST`, but `CacheKeys.PRODUCT}${slug}` had the identical leak — `sale.locked` is the whole payload difference on a members-only sale.

      Membership reads `galleryMember` off the session user. It is a Better Auth additional field and is not on the `AuthUser` interface, so `readIsMember` casts locally rather than editing the shared middleware; guests default to non-member, which fails safe (price shown locked, base charged).

      **Two spec defects found**:
      1. The step-3 code sketch resolved against singular `style`/`subject`/`room`. The columns are `text[]` (`schema/products.ts:111-114`). Fixtures use arrays and there is an explicit test that a filter-scoped promotion matches the array columns.
      2. Step 5 named `tests/routes/product-collections.test.ts`, which does not exist. Substituted the route's real neighbours: `products`, `product-sort`, `product-facet-filters`, `review-card-shape`, `product-facets`.

      Also: the list projection did not select `rooms`, one of the three axes a `filter`-scoped promotion can name. A room-scoped sale would have priced the PDP (whole row) and not the grid. Added it.

      **Verification**:
      - Command: `cd packages/api && bunx vitest run tests/routes/product-sale-pricing.test.ts`
      - Result: PASS (16 tests, 16 passing) — red first at 13 failing / 3 vacuous
      - Regression: `product-facets` + `products` + `product-sort` + `product-facet-filters` + `review-card-shape` → PASS (134 tests, 134 passing)
      - Build: `bunx tsc --noEmit` in packages/api → 0 errors (after `cd packages/shared && bunx tsc` to refresh the gitignored dist)
