      - `bunx vitest run tests/routes/admin/product-popularity.test.ts` — RED at 4 failing, GREEN at 7 passing.
      - `bunx vitest run tests/routes/admin/products.test.ts` — passing.
      - Ran the admin list query with the units-sold subquery against the **real** dev database: 20 rows in 121ms.

      **On `products-role-access.test.ts`:** it shows 1–3 timeout failures, and the set shuffles between identical runs — I measured 1 and 3 failures with my change *stashed*, and 2 and 2 with it applied. Overlapping ranges, all `Test timed out in 5000ms`, none touching the columns this ticket added. This is the varying-failing-file-set baseline PLAN-OF-ACTION.md records for `packages/api` under parallelism, not a regression.

      **Environment note worth carrying:** `packages/api/vitest.config.ts` falls back to `DATABASE_URL` port **5433** when the variable is unset, which is a different project's postgres. Suites that use the real `db` (this one does — it mocks only Better Auth) fail differently depending on whether the caller exported 5440. Every run above was pinned to 5440 explicitly.

      Reuses `unitsSoldSql()` from `packages/api/src/lib/product-sales.ts`, so the storefront sort and the admin column can never drift on what counts as a sale.
