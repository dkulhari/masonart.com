ticket_number: 408
title: API - admin sees real units sold and can pin a product as popular
description: |-
  ## Task

  Admin side of the popularity signal, in packages/api/src/routes/admin/products.ts:

  1. The product **list** (:353) gains `unitsSold` - the same paid/fulfilled aggregate the storefront sort uses. This is what makes curation informed rather than blind.
  2. `createProductSchema` (:122) and therefore `updateProductSchema` (:158) accept `isPopular` and `popularOrder`, alongside the existing `isFeatured` / `featuredOrder` at :149-150.
  3. The update handler writes them, matching the pattern at :582-585.

  ## Context

  Part of feature: collection-page-parity-remainder
  Phase: 2 - API
  Depends on the columns from the schema ticket and the aggregate shape from the sort ticket.

  The pin reorders, it never rewrites the number. An admin looking at a pinned product still sees its true `unitsSold` - that separation is the whole point of showing both.
