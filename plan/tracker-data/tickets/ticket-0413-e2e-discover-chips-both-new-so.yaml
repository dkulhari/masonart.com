    expected_result: FAIL until the UI tickets land
    status: pending
    code: |
      import { test, expect } from '@playwright/test'

      test.beforeEach(async ({ page }) => {
        await page.goto('/posters', { waitUntil: 'networkidle' })
      })

      test('discover chips filter the grid', async ({ page }) => {
        const rail = page.getByRole('list', { name: /discover/i })
        await expect(rail).toBeVisible()
        const chip = rail.getByRole('link').first()
        const label = await chip.textContent()
        await chip.click()
        await expect(page).toHaveURL(/styles=/)
        await expect(page.getByRole('button', { name: new RegExp(label ?? '', 'i') })).toBeVisible()
      })

      test('sort offers eight options including the two new ones', async ({ page }) => {
        await page.getByRole('button', { name: /^Sort by:/ }).click()
        const options = page.getByRole('option')
        await expect(options).toHaveCount(8)
        await expect(page.getByRole('option', { name: 'Featured' })).toBeVisible()
        await expect(page.getByRole('option', { name: 'Best selling' })).toBeVisible()
      })

      test('best selling round-trips through the URL', async ({ page }) => {
        await page.getByRole('button', { name: /^Sort by:/ }).click()
        await page.getByRole('option', { name: 'Best selling' }).click()
        await expect(page).toHaveURL(/sortBy=salesCount/)
        await expect(page.getByRole('button', { name: /Sort by: Best selling/ })).toBeVisible()
      })

      test('promo tile matches the real review aggregate', async ({ page }) => {
        const stats = await page.request.get('http://localhost:3000/api/reviews/stats')
        const { reviewCount } = await stats.json()
        const tile = page.getByTestId('promo-tile')
        if (reviewCount >= 10) await expect(tile).toBeVisible()
        else await expect(tile).toHaveCount(0)
      })
