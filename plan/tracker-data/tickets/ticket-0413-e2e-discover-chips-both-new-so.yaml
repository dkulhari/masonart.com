  Project convention: unit and integration tests per ticket, E2E per feature.

  Traps from CLAUDE.md and PLAN-OF-ACTION.md:
  - `page.goto(path, { waitUntil: 'networkidle' })` in `beforeEach`
  - Scope selectors to the desktop tree (`div.hidden.lg\\:block`) - the same test ids exist in both mobile and desktop trees
  - Run with `--no-deps`: the four `auth.setup.ts` projects fail to log in test users for pre-existing reasons and this spec needs no auth
  - Port :5173 is a DIFFERENT app; the web dev server is :3001 and the API :3000, DB on host port 5440
