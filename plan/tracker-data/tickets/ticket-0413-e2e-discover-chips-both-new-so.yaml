    text: |-
      Done — commit 9853e5b1.

      **Verification**
      - `bunx playwright test tests/e2e/collection-page-remainder.spec.ts --project=chromium --no-deps` — RED at 3 failing / 13 passing, GREEN at **16 passed**.
      - `bunx playwright test tests/e2e/product-grid-alignment.spec.ts --project=chromium --no-deps` — **18 passed**, unchanged.
      - Full web suite 1753 passing, shared 880 passing, typecheck 23.

      **The three initial failures were a real bug, not a flaky test.** The promo tile rendered in jsdom and never in the browser. Cause: `hooks/useReviews.ts` fetches against a relative `API_BASE = '/api'`, and `packages/web/vite.config.ts` has **no proxy** for `/api` — the request never left the dev server. The endpoint was returning a perfectly good aggregate to curl the whole time. Moved the fetcher to `lib/api.ts`, where everything goes through `getApiUrl()`.

      Worth carrying: **every other fetch in `hooks/useReviews.ts` has the same shape** — per-product review lists, stats, create, vote all use the relative `API_BASE`. This ticket did not touch them, but if reviews are silently not loading anywhere client-side, that is where to look.

      **E2E lives at the repo root** `tests/e2e/`, not `packages/web/tests/e2e/`. Running playwright from the package directory gives `Project(s) "chromium" not found. Available projects: ""`.

      **Environment note for the api gate.** `packages/api/vitest.config.ts` defaults `DATABASE_URL` to port **5433**, and that server now rejects `poster_app` with `password authentication failed`. Under a plain `bunx vitest run` every database-backed api test therefore fails — 19 of them in `tests/routes/products.test.ts` alone — with nothing wrong in the code. Pinned to 5440, that file is **76 passing, 1 failing**, and the one failure is pre-existing: `should filter by styles` requests `?styles=minimalist,abstract`, ids that are not in the vocabulary #395-#399 introduced, so a 400 is the correct response and the test is stale.
