title: E2E - discover chips, both new sorts, promo tile
description: |-
  ## Task

  Feature-level E2E at packages/web/tests/e2e/collection-page-remainder.spec.ts:

  - Discover chips render, clicking one filters the grid and updates the URL, clicking again clears it
  - Sort menu offers 8 options; selecting Featured and Best selling each round-trips through the URL and re-renders the grid
  - Promo tile: present when the catalogue aggregate clears the threshold, absent when it does not - assert against the real state, do not stub a number in
  - Grid alignment survives the promo tile

