ticket_number: 47
title: Backend - Custom Color Palette API
description: |-
  ## Overview
  API endpoints for managing user-created custom color palettes.

  ## Endpoints to Implement
  1. **POST /api/ai/palettes** - Create new palette
     - Name (max 50 chars)
     - Colors array (3-8 hex colors)
     - Optional: isDefault flag

  2. **GET /api/ai/palettes** - List user's palettes
     - Return all saved palettes
     - Include preset system palettes

  3. **DELETE /api/ai/palettes/:id** - Delete palette
     - Only allow deleting own palettes

  4. **PATCH /api/ai/palettes/:id** - Update palette
     - Allow renaming and color changes

  ## Integration
  - Modify generation endpoint to accept paletteId or customColors
  - Pass palette colors to prompt builder for generation
  - Store used palette reference in generation record

  ## Files to Create/Modify
  - packages/api/src/routes/ai.ts (add palette endpoints)
  - packages/api/src/services/ai-palette.ts (new service)

  ## Acceptance Criteria
  - [ ] CRUD operations for palettes work correctly
  - [ ] Palette colors influence generation output
  - [ ] Max 20 palettes per user
  - [ ] Input validation for hex colors
  - [ ] Unit tests for all endpoints
