    code: |
      // Cases this file must cover:
      //   1. POST creates a job and its production_job_items in one transaction; a
      //      failure partway leaves no orphan job.
      //   2. Two jobs over different order_items of the SAME order, assigned to two
      //      different vendors, both succeed. This is the mixed-basket split and is
      //      the reason items join to order_items rather than to the order.
      //   3. POST /:jobId/assign computes amountExpected from the rate card in force
      //      AT THE ASSIGNMENT INSTANT. Seed a rate of 100.00 plus a future rate of
      //      150.00 and assert the job is priced at 100.00 — a scheduled rise must
      //      not be charged early.
      //   4. Longest edge drives the band: a 24x36 item prices from the 36 band, and
      //      a 36x24 item prices identically. Orientation must not change the price.
      //   5. Assigning when an item's size has no covering band -> 422 naming the
      //      item and the size. Assert amountExpected was NOT written as 0 — a
      //      silent zero is an unbillable job with no explanation.
      //   6. PATCH sets amountActual and the payable for that job becomes the
      //      override, not the expectation.
      //   7. POST /:jobId/reviews twice with verdict fail then once with pass leaves
      //      THREE review rows, newest first, and no row was mutated. Append-only is
      //      how rework history survives.
      //   8. GET queue filters by stage, status and vendor, and paginates.
      //   9. A content-manager gets 403.
