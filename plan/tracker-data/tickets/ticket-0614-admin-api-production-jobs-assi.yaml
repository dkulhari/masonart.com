      ✅ **Completed**

      **Commit**: `50581058` - feat(api): add production job queue, assignment pricing and QC reviews

      **Files Changed**:
      - `packages/api/src/routes/admin/production-jobs.ts` (new) - the admin production router
      - `packages/api/tests/routes/admin/production-jobs.test.ts` (new) - 34 tests
      - `packages/api/src/index.ts` - two lines: the import and `app.route("/api/admin/production", adminProductionApp)`

      **Summary**:
      - `GET /` paginated queue (default 20, capped 100) filterable by stage/status/vendorId, each row carrying `payableAmount` from `lib/vendor-payables.jobPayableAmount`.
      - `POST /` validates the order exists and that every submitted `orderItemId` is on THAT order (422 with `missingOrderItemIds` otherwise), then writes the job and its `production_job_items` in one `db.transaction`.
      - `GET /:jobId` job + items (with variant dimensions) + reviews newest-first + payable.
      - `POST /:jobId/assign` takes ONE `new Date()` before the loop and passes it to `selectRateInForce` for every item, with the band chosen by `longestEdgeInches`. Misses collect into a 422 `{ unpriced: [{ orderItemId, longestEdge, size }] }` and nothing is written — no zero default. Amounts are summed by `sumPayable` in integer paise.
      - `PATCH /:jobId` amountActual override + dueAt/sentAt/receivedAt + status, deliberately with NO transition guard (state machine belongs to production-pipeline).
      - `POST /:jobId/reviews` INSERT-only; `reviewerId` comes from the session.
      - `requireAuth, requireAdmin` — content-manager 403 on every route, asserted per-route.

      Notable test-harness detail: the recording db mock now models `db.transaction` (tagging every query issued inside it) plus a failure injector, which is how "a partway failure leaves no orphan job" is asserted without a database. `vi.mock`'s factory is hoisted, so the db mock is built by a function *declaration* — a `const` dies in the TDZ.

      Deliberately out of scope: per-item quantity multiplication on `amountExpected` (spec says sum the resolved rates), and any status transition rules.

      **Verification**:
      - Command: `cd packages/api && bunx vitest run tests/routes/admin/production-jobs.test.ts`
      - Result: PASS (34 tests, 34 passing, 0 failing)
      - Output: `Test Files 1 passed (1) / Tests 34 passed (34)`
      - `bunx tsc --noEmit` reports no errors in `production-jobs.ts`; the only hit near my edits is `./routes/admin/vendor-invite` (ticket #615's file, in flight).
