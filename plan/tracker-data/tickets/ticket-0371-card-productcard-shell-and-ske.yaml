ticket_number: 371
title: Card - ProductCard shell and skeleton; delete ASPECT_RATIO_MAP and uniformAspectRatio
description: |-
  ## Task

  Rebuild the card shell around the new media component, and **delete the ratio machinery** rather than adapt it. This is where defects D2 and D3 are resolved.

  **D2 - ragged card bottoms.** The `<a>` is the grid item and stretches, but the inner `div.card-hover` carrying `border border-border bg-card` is content-height, so cards whose products have style tags render taller. Mesonart's `.product-card--standard` is `background: transparent` with `border: 0` - the matted image **is** the card. Adopting that deletes the bordered wrapper entirely, so there is nothing left to be ragged. D2 dissolves rather than being patched.

  **D3 - skeleton shift.** `ProductCard.tsx:222` hardcodes `aspect-[2/3]` regardless of the prop, so the home page shifts on load. Extract the skeleton and have it import `MEDIA_RATIO`, making a future mismatch impossible.

  **Deletions:**
  - `ASPECT_RATIO_MAP` (`ProductCard.tsx:59-65`)
  - the `uniformAspectRatio` prop and its type union
  - the `size` variant map ('sm'/'md'/'lg') - one ratio means it has no job
  - `div.card-hover border border-border bg-card rounded-lg`

  `product.orientation` stays on the product as merchandising metadata (it drives filters and the detail page) but stops touching layout.

  ## Context

  Part of feature: product-grid-alignment
  Phase: 4 - Card and grid
  Depends on: T7

  Current file is 241 lines; the split keeps each piece focused:
  ```
  ProductCard.tsx          shell: media + title + price + badges   ~120
  ProductCardSkeleton.tsx  extracted, imports MEDIA_RATIO           ~30
  ```

  Content block keeps `grow` so it absorbs the slack when grid stretches the card - that is what makes rows align without any min-height or line-clamp.

  ## Acceptance criteria
  - No `aspect-[` literal remains anywhere in the product components except via MEDIA_RATIO
  - Skeleton and resolved card occupy an identical box
  - No bordered wrapper; the mat is the card surface
  - Badges (featured / AI) still render
