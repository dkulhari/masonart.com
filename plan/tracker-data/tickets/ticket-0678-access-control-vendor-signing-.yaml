    text: |-
      ✅ **Completed**

      **Commit**: `bdb6df26` — feat(api): replace the dead customer-data absolute with R1/R2/R3 and scoped signing

      **Files Changed**:
      - `packages/api/src/lib/vendor-scope.ts` — module header rewritten to R1/R2/R3 (+ the "no pickup address, no delivery pincode" note); `VENDOR_ARTWORK_PREFIXES` → `VENDOR_SIGNING_SCOPES`; `objectKeyFromImageRef` → `objectKeyForScope(scope, ref)`; new `getVendorJobLabelKey(vendorId, jobId)`
      - `packages/api/tests/routes/vendor/isolation.test.ts` — header replaced by R1/R2/R3; Property 3 generalised to all signatures + disjointness; new Property 4 (the carrier label)
      - `packages/api/tests/routes/vendor/artwork.test.ts` — extended to the scope-disjointness property, both directions, plus the route-level refusals

      **Summary**:

      The dead justification is gone. `objectKeyForScope` keeps today's fail-closed logic, traversal rejection and bucket-prefix stripping byte-for-byte; the only change is that the prefix list is now `VENDOR_SIGNING_SCOPES[scope]` instead of one flat constant, and the scope is the **caller's**, passed in, never inferred from the key — inferring it would let the data decide which rules apply to itself.

      `getVendorJobLabelKey` puts all three conditions in **one** WHERE (`production_jobs.id`, `production_jobs.vendor_id`, `order_consolidation.vendor_id`, `label_object_token IS NOT NULL`), so a non-consolidator resolves to `null` before a key is built and the presigner is never reached. The key is `fulfilment/labels/<token>.pdf` — identity-free by construction, never `<orderId>`.

      **Seam declared, not implemented**: `order_shipments.label_object_token` does not exist yet and belongs to `order-dispatch-tracking`. It is referenced as a SQL fragment (`LABEL_OBJECT_TOKEN`) rather than added to `schema/shipping.ts`, which would put this feature's name on another sub-project's table and produce a migration nobody owns. The comment names the one-line swap for `orderShipments.labelObjectToken` when it lands. Nothing calls the function yet, so the fragment cannot fail in production today.

      TTL is untouched at 300s. `routes/vendor.ts` keeps its zero-database-import invariant — no routes were added (`GET /api/vendor/jobs/:id/label` is **#687**).

      **Verification**:
      - Command: `packages/api $ npx vitest run tests/routes/vendor/isolation.test.ts tests/routes/vendor/artwork.test.ts tests/routes/vendor/jobs.test.ts`
      - Result: PASS — `Test Files 3 passed (3)` / `Tests 105 passed (105)` (isolation 62, artwork 20, jobs 23 unchanged)
      - Command: `npx tsc --noEmit && npx tsc -p tsconfig.test.json --noEmit` → clean, both. Pre-commit `turbo run typecheck` passed across all 3 packages.

      **Verified by mutation, not only by green** — a security suite that cannot fail is worse than none:
      | Mutation | Caught by |
      |---|---|
      | drop `eq(orderConsolidation.vendorId, vendorId)` from the WHERE | 1 test (`puts all THREE conditions in one WHERE`) |
      | widen `label` scope to also accept `products/` | 6 tests across both files |
      | weaken the token guard + the `..` traversal check | 2 tests |
      | derive the key from `jobId` instead of the opaque token | 2 tests (incl. `builds a key that embeds no order, job or vendor identifier`) |

      The existing "the walker actually finds a planted key — the suite is not vacuous" guard stays and gained a sibling, `the scope matcher actually finds a match`, so "every presign call is in exactly one scope" cannot pass by examining nothing.

      **Left for the ticket that owns it**: `packages/api/src/routes/vendor.ts:39-42` still carries the dead premise ("Dispatch is in-house, so a vendor never needs any of it"). Deliberately not touched — #687 rewrites that header when it adds the label route, and a sibling agent is active in that phase.
