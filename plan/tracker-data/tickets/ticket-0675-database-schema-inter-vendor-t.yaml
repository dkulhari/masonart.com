ticket_number: 675
title: Database Schema - inter-vendor transfers, order consolidation and job lifecycle columns
description: |-
  ## Task
  Add `production_transfers` + `production_transfer_jobs`, `order_consolidation`, and the new columns on `production_jobs` (`qc_submitted_at`, `dispatched_at`, `replaces_job_id`). Change `production_jobs.settlement_id` FK to `restrict`. Write the `sent`-retirement backfill script.

  ## Context
  Feature: production-pipeline. Phase 1 of 7.

  production_transfers: order_id, from_vendor_id, to_vendor_id, carrier, reference (the A-to-B docket), piece_count, cost_amount decimal(10,2), dispatched_at, expected_by, received_at, lost_at, lost_note, created_by, timestamps.

  order_consolidation: order_id PK, vendor_id, decided_by, decided_at.

  Design constraints:
  - The transfer is its own entity because the two-status encoding provably cannot express it: in the consolidation case the rolled poster has frame_id NULL, so vendor B has NO JOB for it at all. Also one parcel carries several jobs, freight money has nowhere to sit, and 'lost' is a gap with no docket to chase.
  - NO transfer status enum. State derives from dispatched_at / received_at / lost_at, mirroring production_jobs' own date-driven shape. A fourth state later then costs a nullable timestamp, not a migration.
  - Unique index on production_transfer_jobs(job_id): a job is on at most one transfer, ever. A lost transfer produces a replacement job, so the original never needs a second.
  - order_consolidation is a separate table, not a column on orders, so a supplier FK stays off the customer table and out of every wholesale select() of orders. The PK enforces one consolidator per order; absence is meaningful.
  - cost_amount is decimal(10,2) INR, matching orders/products/vendor_rates. NOT paise, NOT whole rupees.
  - ALL new timestamp columns are `timestamptz`. admin_audit_log.created_at already is; production_jobs' five existing ones are not, and converting them is recorded debt, not this ticket.
  - settlement_id going to `restrict` fixes a real hole: ON DELETE set null means deleting a settlement silently un-settles every job it paid for.
  - The `sent` backfill is a SCRIPT. No enum literal in any migration.
