    text: |-
      ✅ **Completed**

      **Commit**: `30df9d11` — feat(database): inter-vendor transfers, order consolidation and job lifecycle columns
      Sits directly on top of `1f68d31b` (#674) and `83ee1c8f` (#673) on `feature/production-pipeline-design`. Phase 1 is complete, in order.

      **Files Changed**
      - `packages/api/src/database/schema/production-transfers.ts` (new) — `production_transfers`, `production_transfer_jobs`, `order_consolidation`, their relations and types
      - `packages/api/src/database/schema/production-jobs.ts` — `qc_submitted_at`, `dispatched_at`, `replaces_job_id` (self-FK, set null); `settlement_id` FK `set null` → `restrict`; the two `production_job_photos` columns to `timestamptz`
      - `packages/api/src/database/schema/index.ts` — exports the new module
      - `packages/api/src/database/migrations/0025_production_transfers.sql` (new) — generated by drizzle-kit, then hand-headed with the reasoning
      - `packages/api/src/database/migrations/meta/_journal.json` + `meta/0025_snapshot.json` (new) — idx 25, chain unbroken 0000 → 0025
      - `packages/api/src/database/retire-sent-status.ts` (new) + `db:retire-sent-status` in `package.json`
      - `packages/api/tests/database/production-transfers.test.ts` (new, 42 tests)
      - `packages/api/tests/database/retire-sent-status.test.ts` (new, 11 tests)

      **Summary**

      The transfer is its own entity, not "A's job dispatched, B's job received" — in the consolidation case the rolled poster has `frame_id NULL`, so vendor B has no job to move at all. No transfer status enum: state derives from `dispatched_at` / `received_at` / `lost_at`. `production_transfer_jobs` carries both the composite PK *and* a unique index on `job_id` alone, which is not redundant — `(t1, j)` and `(t2, j)` are two valid pairs, so without it one job rides two parcels. `order_consolidation` is a table, keeping a supplier FK off `orders`. `cost_amount` is `numeric(10,2)` INR. Zero CHECK constraints. Every new column is `timestamptz`; `production_jobs`' five pre-existing bare `timestamp` columns are untouched named debt, and are now pinned by a test so a sweep has to be deliberate.

      **Decision recorded: `sent` retires to `assigned`, not `received`.** `received` is now a vendor-attested fact and a precondition both the QC queue and the label gate read; promoting a `sent` row would fabricate an attestation nobody made. `assigned` records only what we know, and `assigned → received` is a legal vendor edge, so retired rows resume normally. `sent_at` is untouched, so the dispatch date survives the demotion.

      **Also fixed — a #674 deviation**: `production_job_photos.uploaded_at` and `.superseded_at` landed as bare `timestamp`. 0025 alters both to `timestamptz` (free — the table was new and empty), so a photo row stays comparable with the `admin_audit_log.created_at` row describing it across a server timezone change.

      **Verification**

      - Command: `bunx vitest run tests/database/production-transfers.test.ts tests/database/retire-sent-status.test.ts tests/database/migration-enum-literals.test.ts tests/database/raw-sql-objects.test.ts tests/database/production-job-photos.test.ts tests/database/production-job-photos-live-slot.test.ts tests/database/migrations.test.ts`
      - Result: PASS — 7 files, 111 passed, 63 skipped (destructive suites gated on `TEST_DATABASE_URL`, pre-existing)
      - Command: `bunx vitest run tests/schema/production-jobs.test.ts tests/lib/vendor-payables.test.ts tests/routes/admin/vendor-payables.test.ts tests/routes/admin/production-jobs.test.ts tests/routes/vendor/jobs.test.ts tests/routes/vendor/artwork.test.ts tests/routes/admin/vendors.test.ts`
      - Result: PASS — 7 files, 136 passed (every consumer of the changed schemas)
      - Command: `bun run typecheck` → 0 errors, src and tests
      - Command: `bun run db:migrate` against :5440 (never `db:push`, #663) → applied; 26 migrations recorded. Introspection confirms all three tables, `production_transfer_jobs_job_id_unique` on `(job_id)`, `settlement_id` now `ON DELETE RESTRICT`, both photo columns `timestamp with time zone`, and **zero CHECK constraints** on the new tables.
      - The backfill script was exercised against a real row (inserted, run, cleaned up, zero residue): dry-run reported `{found:1, updated:0}` without writing; the real run moved `sent` → `assigned` with `sent_at` byte-identical; a second run reported `{found:0, updated:0}`.
      - `bunx drizzle-kit generate` reports "No schema changes" — the DSL, `0025_snapshot.json` and the migration all agree, with no drift.

      **Constraint compliance**: no enum literal in any migration (the repo guard is green, and the 0025 header names the three values in prose only — comments are stripped before scanning, as that guard documents); no transfer status enum; no CHECK constraints; `cost_amount` decimal(10,2); `order_consolidation` its own table; applied with `db:migrate` on :5440.

      **One wart named rather than hidden**: `order_consolidation.decided_by` is `ON DELETE set null` per the ticket, but `NULL` also means "system default" — so deleting an admin's account retroactively re-labels their decision as a system one. Cascade and restrict are both worse, and `admin_audit_log` snapshots `actor_email`/`actor_role` at write time precisely so the durable "who" survives the account. Documented in the schema module.
