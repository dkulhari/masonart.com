    code: |
      import { describe, it, expect } from 'vitest'
      import sharp from 'sharp'
      import { MAT_CANVAS } from '@chobii/shared'
      import { buildSeedImage } from '../../src/database/seed-images'

      const png = (w: number, h: number) =>
        sharp({ create: { width: w, height: h, channels: 3, background: { r: 7, g: 7, b: 7 } } }).png().toBuffer()

      describe('buildSeedImage', () => {
        it('produces the new contract shape', async () => {
          const img = await buildSeedImage(await png(800, 600), 'p.jpg', 'Alt text', 0)
          expect(img).toMatchObject({
            altText: 'Alt text', type: 'main', sortOrder: 0,
            width: MAT_CANVAS, height: MAT_CANVAS,
          })
          expect(img.originalKey).toBeTruthy()
        })

        it('carries no legacy keys', async () => {
          const img = await buildSeedImage(await png(800, 800), 'p.jpg', 'a', 0)
          expect(img).not.toHaveProperty('isPrimary')
          expect(img).not.toHaveProperty('alt')
        })

        it('satisfies the square contract for an off-ratio source', async () => {
          const img = await buildSeedImage(await png(800, 600), 'p.jpg', 'a', 0)
          expect(img.width).toBe(img.height)
        })
      })
