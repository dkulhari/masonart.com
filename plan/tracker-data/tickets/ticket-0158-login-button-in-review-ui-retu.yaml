      **Root Cause Analysis**:

      The bug was caused by: Incorrect login URL path in the ReviewForm component

      Location: `packages/web/app/components/reviews/ReviewForm.tsx:228`

      What happened:
      - The ReviewForm shows a "Sign In" prompt when isAuthenticated is false
      - The login button has href="/login" (line 228)
      - The actual login route is at /auth/login (in routes/auth/login.tsx)
      - Clicking the button navigates to a non-existent route, resulting in 404

      Fix approach:
      - Change href="/login" to href="/auth/login" in ReviewForm.tsx
