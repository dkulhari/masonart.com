ticket_number: 158
title: Login button in review UI returns 404 for unauthenticated users
description: |-
  ## Bug Description

  When a user is not logged in and views the review UI, a login button is presented to prompt them to sign in. However, clicking this login button results in a 404 error instead of navigating to the login page.

  ## Steps to Reproduce

  1. Open a product page with reviews while not logged in
  2. Look for the login prompt/button in the review section
  3. Click the login button
  4. Observe 404 error

  ## Expected Behavior

  Clicking the login button should navigate the user to the login page (e.g., `/login` or `/login?redirect=/products/[slug]`).

  ## Actual Behavior

  Clicking the login button results in a 404 page not found error.

  ## Possible Causes

  - Incorrect href on the login button/link
  - Missing route for the login redirect path
  - Typo in the URL path
