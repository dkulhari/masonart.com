      Full `tests/lib`: 660 passed, 0 failed. `typecheck | grep room-mockup`: empty.

      Each task got its own scoped review; the branch then got a whole-branch review on the strongest model, one fix wave, and a scoped re-review. Final verdict: all findings addressed, no Critical or Important breakage.

      ## The one Important finding, and why no task review could have caught it

      `frame-renders.json` shipped the slugs `oak`, `black`, `white`, `gold`, `frameless`. The catalogue's `frames.type` values (`packages/api/src/database/seed-frames.ts:53,68,84,100,116,132,148`) are `rolled`, `frameless`, `gold`, `silver`, `black`, `white`, `wood`.

      `oak` matches no purchasable frame — it came from the storefront's `FRAME_SWATCH` map in `ChooseOptions.tsx:136-143`, a different vocabulary. Meanwhile `wood` and `silver` are sellable and were unrenderable. `oak` was also the first key and the spec's own example, so it is exactly what a template author would have reached for.

      Origin was the design spec's illustrative example; the plan copied it and the implementer transcribed it faithfully. Every scoped review checked the file against the plan and was right to pass it. Only a whole-branch reviewer looking across to `seed-frames.ts` could see it. Fixed in d3567f57 — now `wood`, `black`, `white`, `gold`, `silver`, `frameless`. `rolled` is deliberately excluded: a rolled canvas ships in a tube and is never hung, so it has no room shot.

      Caught while `room-templates.json` was still `[]`, so it cost nothing. After templates existed it would have been a re-render of the whole catalogue.

      ## Verified end to end

      The whole-branch reviewer did not only read — it executed the driver's sequence against a synthetic room and poster, and confirmed:

      - All three contract filenames produced at correct dimensions.
      - Aspect ratio preserved (`framed-main.jpg` at 0.682, matching the framed rectangle).
      - The spec §8 handoff works: `framed-main.jpg` → `matToSquare()` → `measureArtBox()` returns a real art box, not `undefined`, with no change to the upload pipeline.
      - The `white` moulding clears `ART_MAT_TOLERANCE` against `MAT_COLOR`, so the mat scan does not eat into a white frame.
      - `.cache/` and `out/` are gitignored at any depth, so no generated image can pollute the tree.

      ## Parked — real, small, not blocking

      1. **Residual `oak` in two worked examples** — `docs/superpowers/specs/…-design.md:99` and `docs/runbooks/room-mockup-generator.html:699`. The data file, spec §5 and the runbook's reference table are all correct; these two illustrations still show the dead slug. Anyone copy-pasting one gets a loud named failure at load (`templates.ts:116-120`), not a silent bad render.
      2. **Contact-sheet caption clipping** — `generate-room-mockups.ts:137` appends `— room-<id>.jpg` so the operator can see which file to delete, but `outputs.ts:92-98` renders captions into a fixed 420×34 cell with no truncation, and the id is what clips first. Verified empirically. Not a regression, but it under-delivers its own intent.
      3. **`--templates` default detection is a string sentinel** — `generate-room-mockups.ts:58-61` compares against the literal `.cache/room-templates`, so an explicit `--templates .cache/room-templates` is also repo-root-anchored, contradicting the comment at `:29-32`. The literal is duplicated at `cli-args.ts:62` with no shared constant and no driver-level test.

      ## Still true: the tool ships unable to run

      `room-templates.json` is `[]`. Until blank-wall room photographs exist it fails with `No room templates defined — nothing to render.` Intended. The follow-up is photography and measurement, not code.
