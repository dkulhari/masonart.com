ticket_number: 701
title: 'Room mockup generator: composite a poster into blank-wall room templates with frame shadows'
description: |-
  ## Task

  Producing a product's room-mockup gallery images was not a process at all. Every product in the seeded catalogue has the shape `1 main + 3 room mockups` (`packages/api/src/database/seed-images.ts:131` globs `<prefix>-main.webp` plus `<prefix>-room-N.webp`), but those came in as finished reference imagery. For a real product the only options were photographing the framed piece in a styled room, per poster, or compositing by hand in an image editor and uploading one file at a time through `/admin/products/new`.

  This builds an offline CLI that takes poster artwork plus a library of blank-wall room templates and emits candidate room mockups, a framed main image, and a numbered contact sheet for human review. Output filenames feed directly into the #672 bulk import manifest.

  ## Origin

  Started as a feasibility spike on 2026-08-30. The question was whether Sharp alone could composite a poster into a room photo convincingly. It could, and the finding that made it work is the shadow: a single drop shadow always reads as a sticker pasted onto a photo, while a **tight dark contact shadow plus a wide faint ambient shadow** reads as an object with real thickness. That pair, scaled off a per-frame `depthRatio`, is what sells frame depth on a straight-on wall — including for frameless stretched canvas, where the shadow is the only depth cue available.

  ## Documents

  - Design spec: `docs/superpowers/specs/2026-08-31-room-mockup-generator-design.md`
  - Implementation plan: `docs/superpowers/plans/2026-08-31-room-mockup-generator.md`
  - Runbook (HTML artifact): see comments
  - Branch: `feature/room-mockup-generator`, worktree `/Users/dhruv/work/masonart-room-mockups`

  ## Deliberately out of scope

  - **Generating the AI room photographs** — supplied, not produced here.
  - **Angled / perspective rooms.** Straight-on walls only. Sharp offers `.affine()` but no four-point homography; perspective would be a different design, not an extension.
  - **Any admin UI.** Review is a contact sheet and deleting files.
  - **Auto-detecting the wall rectangle.** Measured by eye once per template.
  - **Per-frame room variants.** `selectedFrame` in `packages/web/app/components/product/ProductDetail.tsx:159` feeds price and the cart payload only — it never swaps the gallery image, so the storefront has no consumer for a room shot per frame.
  - **Writing to the database or R2.** The tool reads local files and writes local files.

  ## Known follow-up

  The tool ships **unable to run**: `room-templates.json` is `[]` until blank-wall room photographs exist, and `loadTemplates` fails loudly with `No room templates defined` rather than rendering nothing. That is intended — the spec is explicit that template quality, not code, is the real cost of this feature.

  When generating the rooms, keep them clear of the MESON ART watermark baked into `.cache/seed-media/` artwork (#546).
