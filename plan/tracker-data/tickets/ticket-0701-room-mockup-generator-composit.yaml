      Task 5's driver, data files and package script are in progress at the time of writing.

      ## Decisions worth keeping

      **Two shadows, not one.** A single drop shadow reads as a sticker pasted onto a photograph. A tight dark contact shadow plus a wide faint ambient shadow reads as an object with thickness. This was the spike's central finding.

      **Depth changes shadow size, not darkness.** Blur and offset scale with `depthRatio`; opacity is fixed. Darkening with depth reads as the room's lighting changing rather than the object changing. The spec's testing section originally said opacity scales too — corrected during plan review.

      **`placement` is a bounding box, not a stretch target.** Artwork is fitted inside at its own aspect ratio and centred, so a portrait and a landscape poster both land correctly in the same room.

      **One moulding per room template, not a matrix.** `selectedFrame` in `ProductDetail.tsx:159` drives price and the cart payload only — it never swaps the gallery image. Rendering every frame against every room would turn ~8 candidates into ~40 with nowhere to display them.

      **Plan defect found during implementation.** The plan's `renderFramedMain` derived one margin from the framed image's longer edge and applied it to all four sides. Adding the same absolute margin to numerator and denominator always pulls a ratio toward 1, so this squared the very image the function exists to keep unsquared (500x1000 art came out at ratio 0.577 against an asserted 0.5). Fixed by scaling each axis by its own edge. The test was not weakened.

      ## Known state on delivery

      The tool ships **unable to run**. `room-templates.json` is `[]` and `loadTemplates` fails with `No room templates defined — nothing to render.` until blank-wall room photographs exist. Intended behaviour — the spec is explicit that template quality, not code, is the real cost.

      Follow-up, none of it code:
      1. Generate 6-8 blank-wall room images, straight-on, consistently lit. Keep them clear of the MESON ART watermark baked into `.cache/seed-media/` artwork (#546).
      2. Put them in `.cache/room-templates/`.
      3. Measure each wall rectangle and add an entry to `room-templates.json` with its `light` direction and moulding.
      4. Dry run, real run, then look at a contact sheet and tune the rectangles.

      ## Unrelated defect found on the way

      `main` does not typecheck. `packages/api/src/lib/audit.ts:233` and `packages/api/src/routes/admin/audit-log.ts:101` both fail TS2769 — the `"fulfilment"` audit category is used in code but absent from `auditCategoryEnum` at `packages/api/src/database/schema/audit-log.ts:66`. This breaks the `.githooks/pre-commit` typecheck gate for every TypeScript commit on main, not just this branch. Confirmed pre-existing: this branch differs from `main` only by the room-mockup files and the two documents. Not fixed here — it belongs to whichever ticket introduced the category. Worth its own ticket.
