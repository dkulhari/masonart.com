  - author: mcp-client
    timestamp: '2026-08-17T02:39:17.131Z'
    text: |-
      Done in 9fe39902. `tests/e2e/admin-vendor-lifecycle.spec.ts` — 9 tests, chromium, --workers=1, all passing; verified against the DB afterwards (job qc_passed / amount_expected 450.00 / settled, one `pass` review with its notes, one 450.00 settlement with the run's NEFT reference), so the pass is not vacuous. It failed twice for real reasons first.

      Two app defects the spec surfaced, both fixed in the same commit:

      1. `app.route("/api/admin", adminShipmentsApp)` in `packages/api/src/index.ts` also mounted that router's `GET /:id`. `GET /api/admin/:id` therefore swallowed every single-segment admin list route registered after it: `/api/admin/vendors`, `/api/admin/production`, `/api/admin/returns` and `/api/admin/approvals` all answered `400 Invalid shipment ID`. The vendor directory and the production queue were dead in the running app; the screens showed their honest "nothing was loaded" banner, which is why the heading-only assertion in the first draft of this spec passed over it. Fixed by splitting `POST /orders/:orderId/ship` into `adminOrderShipmentsApp`, so nothing with a bare `/:id` is mounted at `/api/admin`. Likely relevant to #605 (photo approvals unreachable).

      2. `GET /api/admin/orders` 500ed on every request: the user lookup bound `sql`${users.id} = ANY(${userIds})``, which Postgres rejects with `op ANY/ALL (array) requires array on right side` as soon as one order has a userId. Now `inArray(users.id, userIds)`, and the catch logs the cause instead of swallowing it behind a generic 500.

      STILL OPEN — worth its own ticket: the same broken `= ANY(${...})` bind exists in three more admin list endpoints and will 500 them the same way:
      - `packages/api/src/routes/admin/returns.ts:263`
      - `packages/api/src/routes/admin/shipments.ts:210`
      - `packages/api/src/routes/admin/reviews.ts:283`

      Notes for whoever runs this next:
      - Run it alone: `SKIP_E2E_SERVER=true bunx playwright test tests/e2e/admin-vendor-lifecycle.spec.ts --project=chromium --workers=1`. It needs the web server on :3001 and the API on :3000.
      - The file name deliberately avoids `.admin.spec.ts`, which would run it in both the `chromium` and `chromium-admin` projects.
      - Every run leaves two vendors, two jobs, a settlement and one invited vendor login behind; nothing is cleaned up, and the directory assertions ask for `pageSize=100` to survive the accumulation.
      - `packages/api/src/database/set-test-user-password.ts` is new test support: the invite endpoint mints the account with a password nobody knows and mails a reset link, and there is no mailbox here to read it from.
