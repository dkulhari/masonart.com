ticket_number: 698
title: Admin API - expose the consolidator decision, so the panel stops reading it from the audit log
description: |-
  ## Task
  Add a read that returns `order_consolidation` including `decided_by`, so `OrderProductionPanel` can show whether the consolidator was a system default or an admin decision without inferring it from an audit row.

  ## Context
  Found by #690 during implementation. Feature: production-pipeline.

  #682 writes `order_consolidation.decided_by` and audits `order.consolidator_set` with `metadata.decision` of `system_default` or `admin_confirmed` — but **no route ever returns the column**. `GET /api/admin/orders/:orderId/production-readiness` returns `consolidatorVendorId` alone.

  So #690's panel reads provenance off the newest successful `order.consolidator_set` audit row, and renders **unknown** when that read fails rather than assuming a default. That is the correct fallback given what exists, but it is the wrong source.

  ## Why this matters beyond tidiness

  The distinction is load-bearing by design. The system PROPOSES a consolidator and an admin CONFIRMS it; `decided_by = NULL` means "nobody chose this, the rules did". Rule 3 in particular — most order items, ties by earliest `assigned_at` — is explicitly only a proposal, because the real criterion (who is nearest the customer, which leg is cheapest) is not modelled. Making an arbitrary choice a *confirmed* one is what keeps it visible and auditable instead of silently arbitrary.

  Reading that through the audit log has two problems:
  - **The audit log has 400-day retention** (`queues/audit-retention.ts`). `order_consolidation.decided_by` does not expire. After the sweep runs, the panel would show `unknown` for a fact the database still holds.
  - It couples a UI display to an audit query, which is a filtered, paginated, admin-and-super-admin-only endpoint. A content-manager cannot read the audit log at all.

  Design constraints:
  - Return the row, not a derived boolean — `vendorId`, `decidedBy`, `decidedAt`. The panel decides how to render it.
  - Absence is meaningful: no row means not yet decided, which is different from a system default.
  - Once this lands, replace the audit-log indirection in `OrderProductionPanel.tsx` and delete the fallback. The comment there names this ticket as the thing to replace it with.
  - Do not widen it into a general consolidation history endpoint — the audit log is the history.
