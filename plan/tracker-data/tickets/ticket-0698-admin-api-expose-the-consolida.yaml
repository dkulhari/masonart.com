      ✅ **Completed**

      **Commit**: `d12162e0` - feat(api): return the order_consolidation row, so the panel stops reading the audit log

      **Files Changed**:
      - `packages/api/src/routes/admin/production-jobs.ts` — new `GET /api/admin/orders/:orderId/consolidator`, placed between the POST and the readiness GET (the FOR-UPDATE source scan slices `[post .. first get]`, so ordering is load-bearing). Gated by the `use("/:orderId/consolidator", requireAuth, requireAdmin)` that already covered the write.
      - `packages/api/tests/routes/admin/production-jobs.test.ts` — 8 new tests + the read added to the order-scoped role-gating matrix.
      - `packages/web/app/routes/admin/production/OrderProductionPanel.tsx` — reads the new route; `fetchConsolidatorProvenance`, `provenanceFromAuditEntries` and `ConsolidatorAuditEntry` deleted.
      - `packages/web/tests/routes/admin/order-production-panel.test.tsx` — rewritten against the new source.

      **Summary**

      The route returns the ROW, not a verdict:

      ```json
      { "orderId": "…", "consolidation": { "orderId", "vendorId", "decidedBy", "decidedByEmail", "decidedAt" } }
      ```

      - **Absence is meaningful.** No row is `consolidation: null` with a 200, not a 404 and not a default-shaped row. "Nobody has decided" and "the rules chose" stay two facts.
      - **`decidedByEmail` is the `decided_by` FK resolved**, exactly as the POST resolves `vendor_id` to a name — not an extra fact. It is nullable for two reasons that `decidedBy` tells apart: the system decided, or the account was deleted (`ON DELETE set null` nulls `decided_by` with it, per the schema note). The durable answer to "who" is still the audit log, which snapshots the email at write time.
      - **Not widened into history.** One order, one current row. `basis` (`sole_vendor` / `confirmed_proposal` / `admin_override`) is deliberately absent — it is history, and history stays the audit log's job. The panel never rendered it.

      Panel side: `provenanceFromConsolidation(row)` maps `decidedBy === null → system_default`, otherwise `admin_confirmed`. The email never decides. #690's three states survive the source change and are still distinct — read FAILED, read RUNNING, order has NO row — with their test ids intact and their wording moved off "the audit trail".

      **Verification**
      - Command: `npx vitest run tests/routes/admin/production-jobs.test.ts` (packages/api)
      - Result: PASS (169 tests, 169 passing)
      - Command: `npx vitest run tests/routes/admin/order-production-panel.test.tsx` (packages/web)
      - Result: PASS (66 tests, 66 passing)
      - `npm run typecheck` clean in both packages. `packages/web` excludes `tests/` from typecheck, so the test file was typechecked separately via a throwaway tsconfig: no new errors (the 12 reported are pre-existing `noUncheckedIndexedAccess` hits on `JOBS[0]` spreads, none in the new code).

      **Non-vacuity — 10 mutations, each applied, run, and reverted**

      API (each turned the suite red):
      1. `decidedBy` dropped from the `.select({…})` projection
      2. `.limit(1)` removed
      3. `where` on `vendor_id` instead of `order_id`
      4. absence answered as a default-shaped row
      5. absence answered 404

      Web (each turned the suite red):
      6. `decidedByEmail` deciding instead of `decidedBy`
      7. no row read as a system default
      8. the `provenanceError` branch collapsed into the no-row branch
      9. `fetchOrderConsolidation` pointed back at `/api/admin/audit-log`
      10. a `!response.ok` swallowed as `null` instead of thrown

      **Mutation 3 initially SURVIVED.** `expect(render(read?.where).params).toContain(ORDER_ID)` passes when the same uuid is matched against the wrong column — the parameters render identically. The assertion now pins the rendered SQL column (`"order_consolidation"."order_id"`) as well as the value, and the mutation turns red.
