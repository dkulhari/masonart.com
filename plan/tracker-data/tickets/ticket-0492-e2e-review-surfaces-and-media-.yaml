      Unblocked and complete.

      The photo-upload spec was `test.fixme()`'d on #493 (`/account/orders/$id` never rendered, so `ReviewModal` — the only mount point of the upload flow — was unreachable). #493 landed in bc63c02d and also cleared two bugs it had been hiding: `ReviewModal` posting to a relative `/api/...` URL across origins, and the success refetch unmounting the confirmation dialog.

      The fixme is gone. Full run against the live app on :3001:

      ```
      20 passed (1.2m)
      ```

      17 specs across `tests/e2e/review-surfaces.spec.ts` (14) and `tests/e2e/review-media-upload.spec.ts` (3), plus auth setup projects. Covers: the `/reviews` destination including the aggregate header and the page-2 search-coercion path that would otherwise error-boundary blank; the home strip and its View All plus desktop nav links; the PDP media wall with lightbox open, Escape close and arrow traversal; the toast arriving, linking through, staying dismissed for the session, and being suppressed on `/checkout` before it can fetch; and a signed-in review submission carrying a photo end to end.

      Video upload is deliberately not covered here — the transcode is async and the assertion would degenerate into a sleep. `packages/api/tests/queues/review-media.test.ts` covers it instead.

      The one `test.skip` remaining is a data guard (lightbox stepping needs at least two uploads), not a disabled assertion.
