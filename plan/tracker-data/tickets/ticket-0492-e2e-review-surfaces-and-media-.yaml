      Target confirmed as the real app, not the :5173 impostor: `toHaveTitle(/chobii\.art/)` is the first assertion in the file.

      **Blocker — #493**

      `/account/orders/$id` never renders. `app/routes/_authed/account/orders.tsx` is a leaf page that file-based routing has made the PARENT of `orders.$id.tsx`, and it renders no `<Outlet />`, so every child URL renders the order LIST. Verified in a browser:

      ```
      {"target":"/account/orders/CH-SEED-0006",                         "h1":"Order History","writeReview":0}
      {"target":"/account/orders/b4a39113-cf0d-436f-b8d3-d7c115d09b8d", "h1":"Order History","writeReview":0}
      ```

      `orders.$id.tsx` is the only mount point of `ReviewModal` → `ReviewForm` → `ReviewMediaUpload`, so the photo upload shipped in #485 has no reachable entry point. Pre-existing on `main` (`git show main:...orders.tsx | grep -c Outlet` → 0). It stayed invisible because `tests/e2e/reviews.spec.ts` `test.skip()`s itself whenever the Write Review button is absent — exactly this symptom.

      The spec is left whole rather than softened; dropping the `fixme` is the acceptance test for #493.

      **Two design notes on the specs**

      1. No exact review count is ever asserted. The surfaces encode a threshold (ten approved reviews before an average is printable), so the threshold is what is asserted — the suite survives the next review anybody writes.
      2. Nothing waits on a clock for an absence. The toast's `/checkout` suppression is proved by the `/api/reviews` request the gated component never makes (matched on exact pathname, since `/media` and `/stats` share the prefix), which needs no window at all. Positive cases wait on the element, never on a timer.

      **Incident during this ticket — seed data damaged and fully restored**

      An early version of the upload spec's teardown deleted "whatever review is on the order item now" rather than the id it created. The order-detail API resolves an item's review by (productId, userId) and this customer owns two order items for the same poster, so the teardown removed a *different* seeded review — "Better in person" — and its 3 media rows cascaded with it. Restored via a one-off script that re-inserted the row verbatim from `SEED_ORDERS` and re-ran the idempotent `seedReviewMedia()`; the script was deleted afterwards. Verified back to baseline: `{"pending":2,"approved":12,"rejected":0,"total":14}` and `wabi-sabi-study` carrying 2 photos + 1 video again. The spec now captures `createdReviewId` off the POST response and deletes only that, with the reasoning written into the file so it cannot be re-introduced. A before/after check across the final run shows the database unchanged.

      **Remaining for this ticket**: step 3 stays pending until #493 lands and the `fixme` comes off.
