    action: write-test
    description: Write the failing end-to-end walkthrough
    file: tests/e2e/order-dispatch-tracking.spec.ts
    command: SKIP_E2E_SERVER=true E2E_BASE_URL=http://localhost:3010 npx playwright test tests/e2e/order-dispatch-tracking.spec.ts
    expected_result: FAIL
    status: pending
    code: |
      /**
       * The bug this feature exists for, proved end to end.
       *
       * `PATCH /admin/orders/:id/shipping` wrote `orders.shipping_details`;
       * `GET /api/tracking/*` read `order_shipments`. Nothing bridged them, so an
       * admin entered a tracking number, the save succeeded, and the customer's page
       * showed nothing. Forever.
       *
       * Every unit test in this phase asserts a write target or a predicate against a
       * mocked database. None of them can see that the two halves meet. This can.
       */

      import { test, expect } from '@playwright/test'

      test.describe('an admin-entered tracking number reaches the customer', () => {
        test.beforeEach(async ({ page }) => {
          await page.goto('/admin/orders', { waitUntil: 'networkidle' })
        })

        test('saves on the admin screen and shows on the public tracking page', async ({ page }) => {
          // Title is STATIC — a title built from a variable breaks the runner here.
          const order = await seedShippableOrder()

          await page.goto(`/admin/orders/${order.id}`, { waitUntil: 'networkidle' })

          await page.getByLabel('Carrier').fill('Delhivery')
          await page.getByLabel('Tracking number').fill('AWB55512345')
          await page.getByRole('button', { name: /save shipping/i }).click()

          // The panel must not go blank after the save — that was the second half of
          // the defect: the value went to a store the page did not read back.
          await expect(page.getByText('AWB55512345')).toBeVisible()

          // The customer's view, in a clean context: no admin session, the public
          // lookup only.
          await page.context().clearCookies()
          await page.goto('/track', { waitUntil: 'networkidle' })

          await page.getByLabel('Order number').fill(order.orderNumber)
          await page.getByLabel('Email').fill(order.email)
          await page.getByRole('button', { name: /track/i }).click()

          await expect(page.getByText('AWB55512345')).toBeVisible()
          await expect(page.getByText('Delhivery')).toBeVisible()
        })

        test('a customer never sees a voided label', async ({ page }) => {
          const order = await seedOrderWithVoidedAndLiveLabel()

          await page.goto('/track', { waitUntil: 'networkidle' })
          await page.getByLabel('Order number').fill(order.orderNumber)
          await page.getByLabel('Email').fill(order.email)
          await page.getByRole('button', { name: /track/i }).click()

          await expect(page.getByText(order.liveAwb)).toBeVisible()
          await expect(page.getByText(order.voidedAwb)).toHaveCount(0)
        })
      })
