ticket_number: 713
title: E2E - An admin-entered tracking number reaches the customer tracking page
description: |-
  ## Task
  The regression test for the bug this whole feature exists to fix. Every unit test in this phase asserts a write target or a predicate against a mocked database; none of them proves the two halves meet.

  Drive it end to end: an admin opens an order, enters a carrier and tracking number, saves. A customer then looks the order up on the public tracking page and sees that tracking number.

  Before this feature, that walkthrough failed silently — the save succeeded and the tracking page showed nothing.

  ## Context
  Part of feature: order-dispatch-tracking
  Phase: Phase 4 — E2E

  Also update `tests/e2e/production-pipeline.spec.ts:1130`, whose comment reads "Manual dispatch is today's reality — the Shiprocket client is...". Half of that is still true after pass 1 (there is no Shiprocket client yet) and half is not (a shipment row now exists and the vendor label route no longer 503s). Correct it rather than leaving a comment that will be read as current.

  Project gotchas that bite here:
  - `await page.goto('/path', { waitUntil: 'networkidle' })` in `beforeEach`.
  - Scope selectors for mobile vs desktop — the same test ids exist in both trees. `const desktopFilters = page.locator('div.hidden.lg\\:block')`.
  - Playwright test titles must be STATIC. A title built from a variable breaks the runner here.
  - Port `:5173` is a DIFFERENT app and makes E2E pass vacuously. Run your own server pair (`:3010` web / `:4321` api), with `FRONTEND_URL` matching the web port or all auth setup fails, and `VITE_API_PROXY_TARGET` overriding the hardcoded `:3000` proxy.
