ticket_number: 400
title: Chrome - announcement bar above the header
description: |-
  ## Task

  The beige strip mesonart runs above everything (analysis §1.1): social icons left, a rotating message centre with prev/next arrows, region right.

  Ours: social icons left, rotating message centre. **No region selector** — we are INR-only and a selector with one option is furniture.

  Messages must be TRUE of us. "Free shipping over ₹999" and "30-day returns" already appear on the home page trust row, so they are safe. No invented offers — the analysis' real-data-only constraint.

  ## Context

  Feature: global-chrome-parity
  New component: `packages/web/app/components/layout/AnnouncementBar.tsx`, rendered above `<Header />` in `app/routes/__root.tsx`.

  **Constraints**
  - `bg-band` (the measured beige from Phase A), not a new colour.
  - Rotation must pause on hover and respect `prefers-reduced-motion` — a message that moves while being read is worse than a static one.
  - Arrows are real buttons with accessible names, not decorative glyphs.
  - The header is `sticky top-0`; the announcement bar scrolls away above it, so it must NOT be sticky or the two fight for the same offset. The collection toolbar sits at `top-16` and assumes the header alone occupies that space.
  - Hidden on `/admin` alongside Header and Footer — `__root.tsx` already branches on `isAdminRoute`.
