comments:
  - author: mcp-client
    timestamp: '2026-08-31T01:46:20.985Z'
    text: |-
      Note from the production-pipeline run (feature complete, PR #3).

      **Recommendation: do the `vendor.payable_settled` half now; defer `order.shipment_marked_delivered`.**

      **Why the payables half got more valuable.** production-pipeline made cancellation a routine, reachable transition and reworked payables around it (#695). The shipped predicate is `settlement_id IS NULL AND (status <> 'cancelled' OR amount_actual IS NOT NULL)` — on a cancelled job the rate card's `amount_expected` is a guess, only an admin-stated `amount_actual` is a debt. The rule now has one owner in `lib/vendor-payables`, in both a JS and a SQL form.

      That makes "who settled this, when, against which jobs" a question with real weight. Today it lands only as a coarse `admin.request POST /api/admin/vendors/:id/settlements → 201` with no amount, no reference, no job ids. `routes/admin/vendor-payables.ts` has the settlement POST and already does `SELECT … FOR UPDATE` + row-count-mismatch rollback, so there is a clean transaction to attach to.

      Two constraints from this run, both now enforced elsewhere in the codebase:
      - **Share `tx`** — a settlement row that rolled back must not leave an audit row claiming a supplier was paid. `recordAudit` now **rethrows** when given a `tx` (it swallows only when writing independently), so a shared-tx audit failure fails the handler rather than silently rolling the settlement back behind a 201. That was a HIGH found in Phase 2.
      - **Never share `tx` for the refusal row.** `SettlementRejected` currently writes no precise row. A refusal records that a transaction was rolled back, so writing it inside that transaction erases the evidence it exists to preserve. Write it from a `catch` outside `db.transaction(...)`.

      **Why to defer the shipment half.** `order.shipment_marked_delivered` would go in `routes/admin/shipments.ts`, and **`order-dispatch-tracking` is about to rewrite that file entirely** — production-pipeline's amendment promoted it from "dispatch is MANUAL at launch, no Shiprocket API" to API-integrated, because vendors now despatch directly and print carrier labels. Wiring it now means writing it twice, against a route shape that is changing.

      Verified at head: both actions are still declared with no emitter anywhere in `packages/api/src`.
