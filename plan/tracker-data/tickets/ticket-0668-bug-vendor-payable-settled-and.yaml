ticket_number: 668
title: Bug - vendor.payable_settled and order.shipment_marked_delivered are declared but nothing ever emits them
description: |-
  ## Task

  `AUDIT_ACTIONS` declares both actions and `AUDIT_ACTION_CATEGORY` files them under `money`, so the audit viewer offers them in its action filter. Neither string appears anywhere in `packages/api/src` outside the shared registry. Selecting either filter returns an empty list forever, and the emptiness reads as "this never happened" rather than "this was never recorded".

  Both routes exist and both move money or close a money window:

  - `POST /api/admin/vendors/:id/settlements` (`routes/admin/vendor-payables.ts:226`) — pays a supplier. It already takes `FOR UPDATE` on the jobs so two admins cannot double-settle, which is exactly the contention the audit row is wanted for.
  - `POST /api/admin/shipments/:id/mark-delivered` (`routes/admin/shipments.ts:569`) — delivery is what starts the return window, so a disputed return date turns on who marked it and when.

  ## Context

  Both files currently import no audit helper. They are covered only by the floor row (`admin.request`, category `config`) — which means a `money` category filter, the launch gate the feature was built around, misses a supplier payment entirely.

  Existing tests to extend rather than duplicate: `packages/api/tests/routes/admin/vendor-payables.test.ts` and `packages/api/tests/routes/admin/shipments.test.ts`. The audit assertion shape lives in `packages/api/tests/routes/admin/orders-audit.test.ts`.

  Record the settlement amount and the job ids in `after` — a settlement with no amount in the trail answers none of the questions a settlement dispute asks. Record refusals too: a settlement rejected because a job was already settled is evidence.
