  - id: 3
    action: implement
    description: Emit vendor.payable_settled on the settlement route, inside the same transaction as the write
    file: packages/api/src/routes/admin/vendor-payables.ts
    status: pending
    code: |-
      import { recordAudit } from '../../lib/audit'

      // recordAudit accepts a transaction, so the trail and the settlement commit or
      // roll back together — a settlement that failed to commit must not leave a row
      // claiming a supplier was paid.
      await recordAudit(c, {
        action: 'vendor.payable_settled',
        entityType: 'vendor',
        entityId: id,
        after: { settlementId: settlement.id, amount, reference, paidAt, jobIds },
        summary: `Settled ${amount} to vendor ${id} across ${jobIds.length} job(s), ref ${reference}`,
      }, tx)
  - id: 4
    action: implement
    description: Emit order.shipment_marked_delivered with the status it moved from
    file: packages/api/src/routes/admin/shipments.ts
    status: pending
    code: |-
      import { recordAudit } from '../../lib/audit'

      // `existing` is already read above for the already-delivered guard, so the
      // prior status is in hand — no extra query.
      await recordAudit(c, {
        action: 'order.shipment_marked_delivered',
        entityType: 'order_shipment',
        entityId: shipmentId,
        before: { status: existing.status },
        after: { status: 'delivered', deliveredAt: now.toISOString() },
        summary: `Shipment ${shipmentId} on order ${existing.orderId} marked delivered`,
