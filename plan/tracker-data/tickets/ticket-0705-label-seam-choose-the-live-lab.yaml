ticket_number: 705
title: Label Seam - Choose the live label by voided_at, not by recency
description: |-
  ## Task
  `getVendorJobLabelKey` picks `ORDER BY created_at desc, id desc LIMIT 1` over an order's labelled shipments. Its own doc block says why that is a placeholder and names this feature as the owner of the fix:

  > `order_shipments` has no void marker at all — `shipment_status` runs pending → label_created → … → delivered/failed, and `failed` is a failed DELIVERY, not a voided label... **SEAM, owned by `order-dispatch-tracking`:** the day that feature lands a void / cancellation marker, the `ORDER BY` below must become a predicate on it.

  The marker landed. Newest-labelled is now measurably wrong: void a label, buy a new one in the same second, and the tie-break is `id`, which is random. A vendor reloading their label page gets a different PDF.

  ## Context
  Part of feature: order-dispatch-tracking
  Phase: Phase 2 — Close the label seam

  The `ORDER BY` does not go away — it stays as a total-order tiebreak so the result is deterministic even if the partial unique index were ever dropped. The predicate is what makes the answer CORRECT; the ordering is what makes it STABLE. Belt and braces here is cheap and the failure it prevents is a customer's address in the wrong vendor's hands.

  The database already refuses two live labelled shipments per order (`order_shipments_live_label_idx`), so in practice the predicate selects exactly one row. Assert that agreement — a predicate that disagreed with the index would be a bug neither could show alone.
