    text: |-
      ✅ **Completed**

      **Commit**: `c46c0598` - fix(api): hand a vendor the live label, not the most recent one

      **Files Changed**:
      - `packages/api/src/lib/vendor-scope.ts` — fifth predicate `isNull(orderShipments.voidedAt)`; the deferring doc block and the stale `ORDER BY` comment rewritten
      - `packages/api/tests/lib/vendor-label-seam.test.ts` — new section 4, 4 tests

      **Root Cause**:
      `getVendorJobLabelKey` chose the label with `ORDER BY created_at DESC, id DESC LIMIT 1`. That was a **proxy**, not the fact: when it was written `order_shipments` had no void marker, so "most recently bought" stood in for "still valid".

      It fails in the exact case it exists for. An order carries several shipment rows once a label is voided and re-bought; if the re-buy lands in the same clock tick as the void, `created_at` ties and the winner falls to `id` — random. A vendor who reloads gets a different PDF each time, one of which the courier will refuse, and nothing on the page tells them which.

      **Fix**: `voided_at` landed in #703, so the choice is now made from the fact — a label is live when it names an object **and** has not been killed. Five predicates in one WHERE, no branch in application code where any can be skipped.

      **The `ORDER BY` stays, demoted to a tiebreak.** I deliberately did not delete it. `order_shipments_live_label_idx` (partial unique on `(order_id)` where those same two conditions hold) means the database allows at most one row through the predicate, so on any *migrated* database the ordering decides nothing. It is kept for one built with `db:push`, where a partial index can be absent (#663) — there the predicate still returns the right set, and the ordering makes the pick within it total rather than planner-dependent. A test asserts it survives, so nobody removes it as dead code.

      **Also removed**: the `SEAM, owned by order-dispatch-tracking` note. This feature was that owner and this ticket was that change; a test now fails if the note reappears, because a deferral left standing sends the next reader hunting for work already done.

      **Two halves, deliberately split** (the repo's existing convention):
      - This file asserts the **query** — the recording db is blind to a WHERE, so a fixture queueing two rows would be testing the mock.
      - `tests/database/order-shipments-live-label.test.ts` asserts the **behaviour** against a real Postgres: two live labelled shipments on one order are refused, a re-buy after a void is accepted, and several unlabelled rows are fine.

      **Verification**:
      - Command: `cd packages/api && bunx vitest run`
      - Result: **PASS — 5967 passed | 0 failed | 188 skipped (6155)**
      - Scoped: `vendor-label-seam.test.ts` 16/16. Label + scope + all `tests/routes/vendor` + the live-label DB suite: **386/386 across 8 files**.
      - Typecheck: PASS across all three packages.
      - Red-before-green was honest: the two *behavioural* assertions failed for the right reasons (no `voided_at` in the rendered WHERE; SEAM note still present), while the two asserting already-landed state passed throughout — which is correct, since #703/#704 put those in place.
