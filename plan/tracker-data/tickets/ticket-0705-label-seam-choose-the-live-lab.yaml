      // In getVendorJobLabelKey's WHERE, add a fifth condition:

              // ...AND a label actually exists...
              isNotNull(orderShipments.labelObjectToken),
              // ...AND it is the LIVE one. Not the newest: void a label and buy a
              // replacement in the same second and the tie-break is `id`, which is
              // random — a vendor who reloads gets a different PDF, and one of them
              // is a label the courier will not honour.
              isNull(orderShipments.voidedAt)

      // The ORDER BY STAYS. The predicate makes the answer correct; the ordering
