  - id: 1
    action: write-test
    description: 'Write the failing test: a voided label never wins, and the predicate is in the WHERE'
    file: packages/api/tests/lib/vendor-label-seam.test.ts
    command: cd packages/api && bunx vitest run tests/lib/vendor-label-seam.test.ts
    expected_result: FAIL
    status: pending
    code: |
      describe('the LIVE label is chosen by the void marker, not by recency', () => {
        it('puts voided_at is null in the WHERE, beside the other four conditions', async () => {
          // Asserted as a QUERY: the recording db is blind to a WHERE, so a
          // behavioural fixture would be testing the mock. Same reason the other
          // four predicates are asserted this way.
          recorder.reset()
          recorder.queue([{ token: 'r7Kq2-_aZ9' }])

          await app.request('/api/vendor/jobs/' + JOB_ID + '/label', {
            headers: vendorSessionFor(VENDOR_ID),
          })

          const sql = recorder.queries.map((q) => q.sql).join('\n')
          expect(sql).toContain('voided_at')
          expect(sql.toLowerCase()).toMatch(/voided_at"?\s+is\s+null/)
        })

        it('keeps the ordering as a TIEBREAK, so the answer is stable as well as correct', () => {
          // The predicate makes it correct; the ordering makes it deterministic even
          // if the partial unique index were ever dropped. Removing the ORDER BY
          // because "the index guarantees one row" trades a cheap guard for a bug
          // that only appears on a database somebody built with db:push.
          const src = readFileSync(resolve(API_SRC, 'lib/vendor-scope.ts'), 'utf8')
          expect(src).toContain('orderShipments.createdAt')
          expect(src).toContain('orderShipments.id')
        })

        it('agrees with the index the database enforces', () => {
          // A predicate that disagreed with order_shipments_live_label_idx would be a
          // bug neither could show alone: the query would return rows the index
          // thinks cannot coexist, or refuse rows it happily stores.
          const schema = readFileSync(resolve(API_SRC, 'database/schema/shipping.ts'), 'utf8')
          expect(schema).toContain('order_shipments_live_label_idx')
          expect(schema).toMatch(/voided_at|voidedAt/)
          expect(schema).toMatch(/label_object_token|labelObjectToken/)
        })

        it('the doc block no longer defers the fix to a later feature', () => {
          const src = readFileSync(resolve(API_SRC, 'lib/vendor-scope.ts'), 'utf8')
          expect(
            src,
            'the SEAM note still says order-dispatch-tracking owns a fix that has landed'
          ).not.toContain('SEAM, owned by `order-dispatch-tracking`')
        })
      })
