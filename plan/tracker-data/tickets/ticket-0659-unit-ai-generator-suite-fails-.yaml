ticket_number: 659
title: Unit - AI generator suite fails asserting the Gemini provider is used
description: |-
  ## Finding
  Baseline sweep 2026-08-17, present at `485fa949`:

  ```
  tests/ai/generator.test.ts
    > AI Generator - Gemini Provider > generateImages with Gemini > uses gemini provider a…
  ```

  One test, isolated from the rest of the suite's failures, about which provider `generateImages` selects. Provider selection is configuration-sensitive (`gemini-direct-provider` was a whole feature), so this is most likely an environment-dependent assertion — the test asserts a provider the local env does not select.

  ## Steps
  - Determine whether the selection is driven by env in a way the test does not pin
  - Pin it in the test rather than in the developer's shell
