    text: |-
      Made detectable, not fixed — the bucket policy lives outside this repo.

      Shipped in commit `46fbac61`:
      - `scripts/check-bucket-cors.mjs` — sends the preflight a browser would send and reports whether a cross-origin GET is allowed.
      - `docs/OPERATIONS.md` §3c — the runbook entry, beside the audit-trail one.

      **The check is honest about its own limits, which matters here.** Dev MinIO echoes back whatever `Origin` it is sent, so it is effectively a wildcard and the script passes for `https://not-an-allowed-origin.example`. Rather than let that read as assurance, the script detects the echo and reports INCONCLUSIVE, saying a pass in dev proves nothing about R2. It only has teeth pointed at the production bucket.

      Verified locally: dev MinIO returns `allow-origin: http://localhost:4321`, `allow-methods: GET` — so the local environment is fine and was never the risk.

      **Still outstanding, and needs someone with dashboard or wrangler access:**
      1. Run `node scripts/check-bucket-cors.mjs https://chobii.art` against production R2.
      2. If it fails, set the policy: `GET` and `PUT`, for the production origin and whatever origin staging uses, plus the preflight.
      3. Preferably check the config in rather than leaving it a dashboard click. The audit-log trigger (#663) is the precedent — a required object survived unmade because nothing recorded that it had to exist.

      Leaving this ticket **todo** deliberately. The detection landed; the configuration has not, and closing it would misrepresent that.
