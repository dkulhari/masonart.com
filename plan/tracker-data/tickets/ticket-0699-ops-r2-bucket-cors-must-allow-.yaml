ticket_number: 699
title: Ops - R2 bucket CORS must allow GET from the app origin, or every QC photo fails to display
description: |-
  ## Task
  Verify and configure the R2 bucket's CORS policy to allow `GET` from the app origin, not only `PUT`. Add a check that catches the gap before a vendor does.

  ## Context
  Found by #692 during implementation. There is **no bucket-CORS configuration anywhere in this repo**, so nothing verifies this and no test can.

  #692 renders QC photographs by fetching the bytes from R2 and displaying them from a local `blob:` URL, rather than putting the presigned URL in an `<img src>`. That is deliberate and required: `packages/web/tests/routes/vendor/no-customer-data.test.tsx` bans `X-Amz-Signature` from the vendor screen's `innerHTML`, and R2 of the customer-data rule forbids a signed URL being parked in the portal's DOM.

  The consequence is a runtime dependency that unit tests cannot see:

  - The presigned **PUT** already needs CORS for upload to work at all, so upload will appear fine.
  - The **GET** is new. If the bucket allows only PUT, every photo slot renders "could not be shown" while the upload path looks healthy.

  The failure is graceful — it never falls back to a link carrying the signature — but it silently breaks the QC review loop, and photo QC is what gates the shipping label. A vendor would be unable to prove they did the work.

  ## Why this cannot be caught by the existing suites

  Every vendor test mocks the network. 149 tests pass against a mocked R2. The first real signal would be a vendor reporting that photographs do not display, after which nobody would suspect CORS because uploading worked.

  Design constraints:
  - Allowed origins must cover the production app origin and whatever origin the staging/dev app runs on — `chobii.art` plus the local dev port.
  - `GET` and `PUT` both, plus whatever preflight the browser sends for a `fetch` with credentials.
  - Prefer configuration checked into the repo (or a documented `wrangler`/dashboard step in `docs/deployment.md`) over an undocumented dashboard click — the audit-log trigger incident (#663) is the precedent for why an unrecorded manual step is a defect in itself.
  - Add an ops check: a smoke test or runbook step that fetches one object from the app origin and fails loudly, rather than relying on a vendor to notice.
  - `docs/OPERATIONS.md` is where the audit trail runbook lives; this belongs beside it.
