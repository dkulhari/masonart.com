      Second follow-up now filed too: **#663** — "db:push silently builds a database without the audit-log immutability trigger" (admin-audit-log, bug, high).

      Both follow-ups from the completion note are now tracked: #662 (test typechecking) and #663 (this one). Nothing left open from #633.

      Filed higher than I first described it, because verifying it turned up more than the trigger gap: `db:push` is the **documented setup path** in `README.md`, all four `docs/manual-tests/*.md` files, and `TEST-EXECUTION-REMEDIATION.md` — and `docs/deployment.md` contradicts itself, warning "never db:push against prod" on line 8 while lines 174 and 218 run exactly that against `docker-compose.prod.yml`.

      Proved the impact rather than reasoning about it: pushed the schema into a throwaway postgres:16, confirmed the table exists with `pg_trigger` and `pg_proc` both at 0, then rewrote an audit row recording a `privilege` action to `harmless.read` and deleted it — both statements succeeded with no error.

      Good news bounding it: only migration 0021 contains raw SQL across the whole history, so this is one object pair rather than an open-ended class. And `tests/database/audit-log-immutability.test.ts` already detects it (2 failures against the push-built database) — nothing just runs it against freshly provisioned environments.

      Step 1 of #663 is checking production before anything else; the real deploy path is `make -C deploy migrate`, so prod is likely unaffected, but that should be confirmed not assumed.
