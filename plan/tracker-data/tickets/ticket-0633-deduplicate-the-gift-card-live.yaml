    text: |-
      ✅ **Completed** — five commits, one per piece.

      | Commit | Piece |
      |---|---|
      | `6a26169f` | connectLiveDb / closeLiveDb across 11 suites |
      | `09e55e86` | freshGiftCardCode across 7 suites |
      | `103ef5e9` | redeem/refund row factories |
      | `8e0d9473` | header-auth + Razorpay mocks |
      | `cf51aa51` | row factories extended to the 5 route suites |

      **Baseline (the contract)**: 11 files, 138 tests. Every commit re-verified against it. Final state: **11 files, 138 tests, identical.**

      **New helpers**
      - `tests/helpers/live-db.ts` — `connectLiveDb()`, `closeLiveDb()`
      - `tests/helpers/gift-card-fixtures.ts` — `freshGiftCardCode()`, `razorpayMocks()`
      - `tests/helpers/gift-card-row-factories.ts` — `createGiftCardRowFactories()` (new file)
      - `tests/helpers/admin-route-harness.ts` — `headerRequireAuth()`, `headerAdminMocks()` (extended, not forked, as asked)

      **Acceptance criteria**
      - Five pieces each a single copy under `tests/helpers/` — yes.
      - No behaviour change — 138/138 before and after.
      - redeem/refund no longer a clone — 139 duplicated lines (19.12%) down to 60 (10.36%); the pair went 727 lines to 579.
      - Scan below 2.93% — **2.72%**. Clones touching gift-card files: 14 → 5.

      **The purge-order trap, resolved rather than stepped in**: the suites deleted `gift_card_transactions` before `order_gift_cards`; the #630 helper does the reverse. Checked the FK edges in `src/database/schema/gift-cards.ts` — the two tables reference `gift_card` and `orders` but never each other, so their relative order is free. The only load-bearing ordering is that both precede `gift_card`, which `order_gift_cards` is FK'd to `ON DELETE RESTRICT`. Both spellings satisfy it. Unified on the helper deliberately.

      **Corrections to the ticket**
      1. redeem/refund were **400 and 365 lines**, not "~160". The 127 figure was the clone-region total.
      2. The seven `freshCode` copies differed in **counter width as well as prefix**, and the width was load-bearing: every copy padded so prefix + pid + counter came to exactly 16. A 3-letter prefix padded to 7, a 4-letter to 6. Proved the shared version byte-identical to all seven over 63 cases before switching.
      3. The four enumerated commits did **not** meet the acceptance criteria — 14 gift-card clones remained, 7 of them real (route-suite `makeCard`, `balanceOf`, two more hand-rolled purges). Hence the fifth commit.

      **Two things worth their own tickets**

      1. **The test tree is not typechecked.** `packages/api/tsconfig.json` includes only `src/**/*`, so `turbo run typecheck` never looks at `tests/`. It currently carries ~1100 type errors. This is not theoretical: a script of mine deleted six `let counter` declarations that were still used by `orderNumber`, and the pre-commit typecheck passed clean. I caught it only by building a throwaway tsconfig that includes tests, and gated every commit on a byte-identical error-set diff against that baseline. Turning it on for real needs those ~1100 fixed first.

      2. **`db:push` skips the audit trigger** — carried over from #623. `admin_audit_log_immutable()` is raw SQL in migration 0021 that drizzle's DSL cannot express, so a database built with `db:push` silently lacks the append-only guarantee.

      **What is left, deliberately**: 5 clones. One is production code (`src/routes/cart.ts` vs `src/routes/gift-cards.ts`) — different subject. Four are import blocks and module-level lifecycle bindings, which the ticket said not to chase and was right to: TypeScript cannot share an import list, and hiding a suite's own `beforeAll`/`afterEach` behind a helper makes it harder to read, not easier.

      **Verification notes**
      - The `requireAdmin` predicate was checked as load-bearing, not assumed: replacing `() => adminAllowed` with `() => true` fails exactly one test ("expected 200 to be 403") and no others.
      - The #580 contract still holds: pointed a suite at a dead port and the reachability test fails rather than the suite passing empty.
      - One early scan run reported "No duplicates found" — it had analysed **0 files**, because I ran it from `packages/api` with a `packages` path. Re-run from the repo root for the real numbers above.
      - `poster-app-postgres` (port 5440) was stopped at the start; restarted it, and left it running.
