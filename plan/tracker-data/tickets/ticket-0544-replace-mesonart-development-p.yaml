ticket_number: 544
title: Replace mesonart development placeholder photography before production
description: |-
  BLOCKS GO-LIVE.

  The home page bands (hero, Shop by Room, promo tiles, Brand Story) are built against interior/lifestyle photographs downloaded from mesonart.com, because this repo has no photography of its own — only product artwork in MinIO, 7 frame swatches and 4 category jpgs.

  Those photographs belong to mesonart.com. Shipping them on chobii.art would be using another company's licensed imagery on a commercial storefront.

  Current containment:
  - files live in packages/web/public/dev-reference/, which is git-ignored (.gitignore line 96), so nothing infringing is in git history
  - repopulated by scripts/dev/fetch-reference-imagery.sh, which is committed and carries the warning
  - packages/web/public/dev-reference/README.md restates it at the point of use

  To close: source our own interiors — shoot them, license stock, or render room mockups with our own AI generator using our real artwork — drop them in at the same paths under a committed directory, and delete the dev-reference references. The bands should need no layout changes.

  Until this is closed the home page must not be deployed.
