    text: |-
      🔴 **Follow-up: a data-loss regression this ticket introduced, found by `/code-review high`**

      **Fix commit**: `cb1628cf` - fix(api): stop a partial shipping save wiping the fields it was not sent

      **What I broke.** The jsonb handler this ticket replaced only assigned a key when `input.<field> !== undefined`. Writing the shipment row lost that merge: `awbNumber`, `externalShipmentId` and `estimatedDeliveryAt` were written as `input.X ?? null` straight into the UPDATE of the live row. Only `carrier` and `trackingNumber` fell back.

      **Why it mattered more than it looks.** The admin modal has **no AWB field at all**, so an admin correcting a typo'd tracking number silently dropped an AWB written by `POST /orders/:orderId/ship`, by the 0028 backfill, or by the production-pipeline flow — which PATCHes `awbNumber` and nothing else. `ORDER_HAS_LABEL` and `despatchEvidence` read `awb_number`, so that could **flip the `dispatched` guard back to unsatisfied and strand a consolidator mid-order** — the exact failure #711 exists to prevent, reintroduced from the other side.

      **Why my tests missed it.** The suite I wrote never exercised a partial update against an existing row — every case either created a shipment or sent both fields. A regression test now pins the merge:
      ```
      AssertionError: the AWB was wiped by a partial save: expected null to be 'AWB-KEEP-ME'
      ```

      **Also fixed here** (same commit, related class):
      - `updateShippingSchema` caps matched the old jsonb, not the columns these now land in. `awbNumber`/`shipmentId` allowed 100 chars into `varchar(64)` → Postgres `22001` surfacing as a generic 500, a validation mistake reported as a server fault. `trackingUrl` had no cap against `varchar(500)`.
      - `z.string()` accepts `""`, which stored as an empty string rather than NULL — and `ORDER_HAS_LABEL` asks `coalesce(...) is not null`, so an **empty tracking number would have counted as a label**. `.min(1)` on all of them.

      **Verification**: api **6018 passed | 0 failed**; web **3805 passed | 0 failed**; typecheck green across all three packages.
