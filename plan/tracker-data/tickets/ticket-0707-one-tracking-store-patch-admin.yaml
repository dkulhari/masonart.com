implementation_steps:
  - id: 1
    action: write-test
    description: 'Write the failing test: the PATCH must reach order_shipments and the tracking route must then see it'
    file: packages/api/tests/routes/admin/order-shipping-upsert.test.ts
    command: cd packages/api && bunx vitest run tests/routes/admin/order-shipping-upsert.test.ts
    expected_result: FAIL
    status: pending
    code: |
      /**
       * The split brain, closed.
       *
       * `PATCH /admin/orders/:id/shipping` wrote `orders.shipping_details`;
       * `GET /api/tracking/*` reads `order_shipments`. Nothing bridged them, and the
       * only writer of `order_shipments` had no UI — so an admin typed a tracking
       * number and the customer's page stayed empty forever.
       *
       * These assert the WRITE TARGET, not a round trip: the recording db is blind to
       * what a real Postgres would do with the row, and the round trip is the E2E's
       * job. What matters here is that the statement goes to the right table.
       */

      import { describe, it, expect, vi, beforeEach } from 'vitest'
      import '../../setup'

      const recorder = await vi.hoisted(async () =>
        (await import('../../helpers/query-recorder')).createQueryRecorder({ rows: 'repeatLast' })
      )
      vi.mock('../../../src/database', () => ({ db: recorder.db }))

      describe('PATCH /admin/orders/:id/shipping writes the store the customer reads', () => {
        beforeEach(() => recorder.reset())

        it('touches order_shipments', async () => {
          recorder.queue([{ id: ORDER_ID, orderNumber: 'CH-1', status: 'processing' }])

          const res = await app.request(`/api/admin/orders/${ORDER_ID}/shipping`, {
            method: 'PATCH',
            headers: adminSession(),
            body: JSON.stringify({ carrier: 'Delhivery', trackingNumber: 'AWB123' }),
          })

          expect(res.status).toBe(200)
          const sql = recorder.queries.map((q) => q.sql).join('\n')
          expect(sql).toContain('order_shipments')
        })

        it('does NOT write orders.shipping_details any more', async () => {
          // The jsonb column stays in the schema — the backfill needs it and nothing
          // loses history — but a second writer is a second source of truth, which is
          // the defect.
          recorder.queue([{ id: ORDER_ID, orderNumber: 'CH-1', status: 'processing' }])

          await app.request(`/api/admin/orders/${ORDER_ID}/shipping`, {
            method: 'PATCH',
            headers: adminSession(),
            body: JSON.stringify({ carrier: 'Delhivery', trackingNumber: 'AWB123' }),
          })

          const writes = recorder.queries.filter((q) => /update .*"orders"/i.test(q.sql))
          for (const write of writes) {
            expect(write.sql, 'shipping_details is still being written').not.toContain(
              'shipping_details'
            )
          }
        })

        it('still stamps orders.shipped_at — that is the order timeline, not a shipment fact', async () => {
          recorder.queue([{ id: ORDER_ID, orderNumber: 'CH-1', status: 'processing' }])

          await app.request(`/api/admin/orders/${ORDER_ID}/shipping`, {
            method: 'PATCH',
            headers: adminSession(),
            body: JSON.stringify({ carrier: 'Delhivery', trackingNumber: 'AWB123' }),
          })

          expect(recorder.queries.map((q) => q.sql).join('\n')).toContain('shipped_at')
        })

        it('updates the LIVE row rather than opening a second one', async () => {
          recorder.queue([{ id: ORDER_ID, orderNumber: 'CH-1', status: 'processing' }])
          recorder.queue([{ id: SHIPMENT_ID, carrier: 'Delhivery' }])

          await app.request(`/api/admin/orders/${ORDER_ID}/shipping`, {
            method: 'PATCH',
            headers: adminSession(),
            body: JSON.stringify({ trackingNumber: 'AWB999' }),
          })

          const sql = recorder.queries.map((q) => q.sql).join('\n')
          expect(sql.toLowerCase()).toMatch(/voided_at"?\s+is\s+null/)
        })

        it('refuses to open a shipment with no carrier rather than inventing one', async () => {
          // `carrier` is NOT NULL. Defaulting it to 'unknown' would put a word the
          // customer reads on a tracking page there because a form was incomplete.
          recorder.queue([{ id: ORDER_ID, orderNumber: 'CH-1', status: 'processing' }])
          recorder.queue([])

          const res = await app.request(`/api/admin/orders/${ORDER_ID}/shipping`, {
            method: 'PATCH',
            headers: adminSession(),
            body: JSON.stringify({ trackingNumber: 'AWB123' }),
          })

          expect(res.status).toBe(400)
        })

        it('records that a customer-visible tracking number changed', async () => {
          recorder.queue([{ id: ORDER_ID, orderNumber: 'CH-1', status: 'processing' }])

          await app.request(`/api/admin/orders/${ORDER_ID}/shipping`, {
            method: 'PATCH',
            headers: adminSession(),
            body: JSON.stringify({ carrier: 'Delhivery', trackingNumber: 'AWB123' }),
          })

          expect(recorder.queries.map((q) => q.sql).join('\n')).toContain('admin_audit_log')
        })
      })
