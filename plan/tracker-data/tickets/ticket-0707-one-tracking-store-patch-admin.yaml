    text: |-
      ✅ **Completed** — this is the defect the whole feature exists for.

      **Commit**: `b213a61f` - fix(api): make an admin-entered tracking number reach the customer

      **Files Changed**:
      - `packages/api/src/routes/admin/orders.ts` — the handler now upserts the live `order_shipments` row inside a transaction
      - `packages/api/tests/routes/admin/order-shipping-upsert.test.ts` — new, 7 tests

      **Root Cause**:
      `PATCH /api/admin/orders/:id/shipping` merged into `orders.shipping_details` (jsonb). `GET /api/tracking/*` reads `order_shipments`. The only writer of `order_shipments` was `routes/admin/shipments.ts`, which has no UI. The admin screen that existed wrote to a store the customer page does not read — save returned 200, tracking page stayed empty, permanently.

      **Fix**: upsert the LIVE shipment, by the same predicate `lib/vendor-scope.ts` uses (`voided_at IS NULL`, ordering as tiebreak) — a voided label and its replacement both hang off the order and only one is the one a courier honours.

      **Three deliberate choices:**
      1. **`orders.shipping_details` is not written and not cleared.** It is #708's backfill source. A pass that starts writing elsewhere *and* destroys the old store leaves nothing to re-run against.
      2. **Missing carrier on a shipment-less order is a 400, not a default.** `carrier` is NOT NULL and the value is read by the customer; an incomplete admin form must not put "unknown" on a tracking page.
      3. **The audit row is inside the transaction.** A tracking number a customer can read with no row naming who typed it is an unanswerable support call.

      **Found in passing:** line 1009 carried a comment claiming this handler set `orders.shippedAt` when a tracking number was added. **It never did** — `shippedAt` is stamped on status change at two other sites. I deleted the comment rather than implementing it: making tracking-entry silently mark an order shipped is a behaviour change this ticket did not ask for. Flagging it in case that behaviour is actually wanted — it would be its own ticket.

      **One test bug of mine:** the "does not write the jsonb" assertion first used `JSON.stringify` on the call args and threw `Converting circular structure to JSON` — a drizzle table is circular (`column.table` points back). Rewritten to read the table name off the write target, which is also a stronger assertion.

      **Verification**:
      - Command: `cd packages/api && bunx vitest run`
      - Result: **PASS — 5974 passed | 0 failed | 188 skipped (6162)**
      - Scoped: new suite 7/7; admin orders + orders-audit + upsert = **140/140 across 3 files**
      - Typecheck: PASS across all three packages

      **Note for #712**: the response now returns `shipment` instead of `order.shippingDetails`. `packages/web/app/components/admin/OrderDetail.tsx` still reads the old shape and will render an empty panel until #712 lands.
