  - id: 3
    action: implement
    description: Rewrite the handler to upsert the live shipment inside one transaction
    file: packages/api/src/routes/admin/orders.ts
    status: pending
    code: |-
      // Replace the body of PATCH /:id/shipping (around line 939).
      //
      // One transaction, because three facts have to become true together: the
      // shipment carries the tracking number, the order is stamped shipped, and the
      // audit row says who did it. A tracking number a customer can read, with no row
      // naming who typed it, is the shape of an unanswerable support call.
      //
      // `orders.shippingDetails` is deliberately NOT written and NOT cleared. It is
      // the backfill's source; a pass that starts writing elsewhere AND destroys the
      // old store leaves nothing to re-run against.

        const result = await db.transaction(async (tx) => {
          const [existingOrder] = await tx
            .select({
              id: orders.id,
              orderNumber: orders.orderNumber,
              status: orders.status,
              shippedAt: orders.shippedAt,
            })
            .from(orders)
            .where(eq(orders.id, id))
            .limit(1);

          if (!existingOrder) return { error: "Order not found", status: 404 } as const;

          // The LIVE shipment: not the newest. A voided label and its replacement
          // both hang off the order, and `order_shipments_live_label_idx` is what
          // makes at most one of them live.
          const [existing] = await tx
            .select()
            .from(orderShipments)
            .where(and(eq(orderShipments.orderId, id), isNull(orderShipments.voidedAt)))
            .orderBy(desc(orderShipments.createdAt), desc(orderShipments.id))
            .limit(1);

          // `carrier` is NOT NULL. An admin who typed a tracking number and no
          // carrier has made a mistake worth telling them about — defaulting it puts
          // a placeholder on the page the customer reads.
          if (!existing && !input.carrier) {
            return { error: "A carrier is required to open a shipment", status: 400 } as const;
          }

          const trackingNumber = input.trackingNumber ?? existing?.trackingNumber ?? null;
          const carrier = input.carrier ?? existing!.carrier;
          const trackingUrl =
            input.trackingUrl ??
            (trackingNumber ? generateTrackingUrl(carrier, trackingNumber) : null);

          const [shipment] = existing
            ? await tx
                .update(orderShipments)
                .set({ carrier, trackingNumber, trackingUrl, updatedAt: new Date() })
                .where(eq(orderShipments.id, existing.id))
                .returning()
            : await tx
                .insert(orderShipments)
                .values({ orderId: id, carrier, trackingNumber, trackingUrl, status: "pending" })
                .returning();

          // The order timeline, which is a fact about the ORDER and stays here.
          // `routes/tracking.ts` returns it separately from `tracking` for that
          // reason.
          if (trackingNumber && !existingOrder.shippedAt) {
            await tx
              .update(orders)
              .set({ shippedAt: new Date(), updatedAt: new Date() })
              .where(eq(orders.id, id));
          }

          // `tx`, not `db`: this row asserts something the transaction must make
          // true, so it shares the transaction's failures. See lib/audit.ts.
          await recordAudit(
            c,
            {
              action: "shipment.tracking_updated",
              entityType: "order_shipment",
              entityId: shipment.id,
              summary: `Tracking set on order ${existingOrder.orderNumber}`,
              before: existing
                ? { carrier: existing.carrier, trackingNumber: existing.trackingNumber }
                : null,
              after: { carrier, trackingNumber },
            },
            tx
          );

          return { shipment } as const;
        });
  - id: 4
    action: implement
    description: Return the shipment in the response, and stop returning shippingDetails from this route
    file: packages/api/src/routes/admin/orders.ts
    status: pending
    code: |-
      // The response used to hand back `shippingDetails`. It now hands back the
      // shipment — the thing that was actually written. Returning the jsonb after
      // writing somewhere else would tell the admin screen its edit did not take.
      //
      // `packages/web/app/components/admin/OrderDetail.tsx` is updated in its own
      // ticket; until then it renders nothing for this block, which is honest.

        if ('error' in result) return c.json({ error: result.error }, result.status);

        return c.json({
          message: "Shipping details updated",
          shipment: result.shipment,
        });
