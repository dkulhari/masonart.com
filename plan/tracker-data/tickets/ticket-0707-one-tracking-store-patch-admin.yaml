ticket_number: 707
title: One Tracking Store - PATCH /admin/orders/:id/shipping writes order_shipments, not the jsonb
description: |-
  ## Task
  This is the bug the whole feature exists for.

  `PATCH /api/admin/orders/:id/shipping` (`packages/api/src/routes/admin/orders.ts:939`) merges carrier, tracking number and tracking URL into `orders.shipping_details`, a jsonb column. `GET /api/tracking/*` (`routes/tracking.ts:122`) reads `order_shipments` and returns `tracking: shipment ? {...} : null` with no fallback. The only writer of `order_shipments` is `routes/admin/shipments.ts`, which has no UI.

  So the admin screen that exists writes to a store the customer page does not read. An admin enters a tracking number and the customer's tracking page shows nothing. Permanently. The whole completed `order-tracking-notifications` feature is starved by this.

  Make the handler upsert the live `order_shipments` row instead.

  ## Context
  Part of feature: order-dispatch-tracking
  Phase: Phase 3 — One tracking store

  Depends on the audit ticket: this emits `shipment.tracking_updated`, and `AuditAction` is a closed tuple.

  `orders.shipping_details` is NOT dropped and NOT cleared. It stops being written. Leaving it means the backfill can be re-run and nothing loses history; dropping it in the same pass that starts writing elsewhere is how a bad backfill becomes unrecoverable.

  `orders.shipped_at` KEEPS being set here — it is the order timeline, which `routes/tracking.ts` returns separately from `tracking`, and it is not a shipment fact.

  Upsert target: the live row, meaning `voided_at is null`. If none exists, insert one. `carrier` is NOT NULL on the table, so an insert with no carrier supplied needs a value — refuse with 400 rather than inventing `'unknown'`: an admin who typed a tracking number and no carrier has made a mistake worth telling them about.
