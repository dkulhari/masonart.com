    text: |-
      ✅ **Completed**

      **Commit**: `f0e942b9` — fix(api): stop a cancelled job stranding a phantom payable
      **Branch**: `feature/production-pipeline-design`

      ## What the predicate turned out to be

      Not `status <> 'cancelled'`. That is what the task line and §11 both say, and it is wrong: §10.6 requires an explicit `amountActual` when cancelling an assigned-or-later job, so a blanket status exclusion would silently delete agreed kill fees, and it would contradict `transfers.ts` leaving a lost transfer's original payable intact.

          settlement_id IS NULL AND (status <> 'cancelled' OR amount_actual IS NOT NULL)

      On a cancelled job, `amount_expected` (the rate card's guess) is not a payable; only an `amount_actual` an admin stated is. Correct in both worlds — whether or not §10.6's write-side refusal is ever implemented.

      ## Design/code divergences, reported not resolved silently

      - §10.6's "cancelling an assigned-or-later job without an `amountActual` is refused" is **not implemented** — `PATCH /:jobId` has no cancel-specific amount logic.
      - The ticket's "cancelling from draft or assigned should also null the amounts" is **not implemented**, and disagrees with §10.6 about `assigned`.

      Neither is added here. The read-side predicate makes the payable zero by default without a destructive write and preserves `amount_expected` as the record of what the job was priced at. Both are still open if someone wants the write-side invariant.

      ## Files Changed

      - `packages/api/src/lib/vendor-payables.ts` — one owner for the rule: `isJobPayable`, the drizzle twin `payableJobsCondition()`, `jobPayableAmount` no longer falling back to the expectation on a cancelled job, and `sumRupees` split out. `PayableJob.status` is **required**, so a new call site cannot forget it.
      - `packages/api/src/lib/vendor-scope.ts` — `getVendorPayableTotal` (site 3, the one the VENDOR reads).
      - `packages/api/src/routes/admin/vendor-payables.ts` — the list WHERE (site 1), the settlement UPDATE WHERE (site 2), `status` in the FOR UPDATE verification read, and a 422 naming a phantom rather than stamping it paid.
      - `packages/api/src/routes/admin/vendors.ts` — **site 4**, `amountOwed`, which no document names. Its comment claimed "the same predicate lib/vendor-payables documents" while spelling out half of it.
      - `packages/api/src/routes/admin/production-jobs.ts` — pricing calls `sumRupees` instead of building fake `PayableJob` rows to borrow `sumPayable`'s adder.
      - `packages/web/app/routes/vendor/index.tsx` + `jobs/$id.tsx` — **site 5**, the portal named in the ticket title. Both re-implemented `amountActual ?? amountExpected` in the "You are paid" column; one exported helper now mirrors `jobPayableAmount`. Status already renders beside the amount on all three surfaces.
      - 4 test files.

      Payables stay DERIVED — no stored total added; the SUM is unchanged, only the row set narrows. No `recordAudit` call sites touched, so the refusal-transaction rule does not apply. `'cancelled'` is bound as a parameter from application code.

      ## Verification

      - `packages/api`: `bunx vitest run` over 17 named files (vendor-payables lib+route, vendor-scope, vendors, production-jobs, transfers, vendor routes, readiness/seam/rates) → **783 passed**
      - `packages/web`: `bunx vitest run tests/routes/vendor tests/routes/admin-vendor-payables.test.tsx` → **285 passed**
      - typecheck: api src + `tsconfig.test.json` + web → **0 errors** (pre-commit `turbo run typecheck` also green)

      ## Non-vacuity — 14 mutations, each watched red, each reverted

      | # | Mutation | Red |
      |---|---|---|
      | M1 | `payableJobsCondition` loses the cancellation half (pre-#695) | 5 |
      | M2 | `status <> 'cancelled'` **alone** — the task line's literal fix | 4 |
      | M3 | `isJobPayable` always true | 2 |
      | M4 | `isJobPayable` excludes every cancelled job (kill fee deleted) | 6 |
      | M5 | `jobPayableAmount` back to unconditional COALESCE | 1 |
      | M6 | `getVendorPayableTotal` reverts | 1 |
      | M7 | payables list WHERE reverts | 2 |
      | M8 | settlement UPDATE WHERE reverts | 1 |
      | M9 | the not-payable refusal deleted | 1 |
      | M10 | `status` dropped from the verification select | 1 |
      | M11 | `vendors.ts` amountOwed WHERE reverts | 1 |
      | M12 | web helper reverts to COALESCE | 2 |
      | M13 | web helper zeroes every cancelled job | 1 |
      | M14 | job detail reads `amountExpected` raw | 1 |

      Both directions are covered, which is the point: M1 proves the fix is present, M2 and M4 prove it is not the over-fix.

      The route mock was upgraded so the payables list AND the aggregate are answered by evaluating the **compiled WHERE** (`render(where)`), not a hand-copied filter — it distinguishes "names cancelled" from "spares agreed amounts" so the two wrong shapes produce two different numbers. A predicate that never reaches the database can no longer leave these green.
