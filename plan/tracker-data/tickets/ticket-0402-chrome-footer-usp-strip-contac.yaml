ticket_number: 402
title: Chrome - footer USP strip, contact column and beige restyle
description: |-
  ## Task

  The footer is already four columns — the analysis' "3-col" reading was out of date. What is missing (§3.1):

  - **USP strip** above the columns: Handcrafted · Free Shipping · Eco Friendly · Safe Payments, with icons.
  - **Contact column** — address, WhatsApp, email. Replaces or joins the existing columns to reach mesonart's four content columns plus the newsletter.
  - **Beige restyle** via `SectionBand tone="beige"` or the `bg-band` token.

  ## Context

  Feature: global-chrome-parity
  File: `packages/web/app/components/layout/Footer.tsx` (grid at :15, columns at :43, :65, :87)

  **Constraints**
  - USP claims must be true. "Free Shipping" is real over ₹999 — say so rather than implying it is unconditional. "Eco Friendly" needs something behind it; if there is no substantiation, use a claim we can stand behind instead of copying theirs.
  - Contact details come from `@chobii/shared` brand constants where they exist rather than being retyped.
  - The token guard applies: no `font-bold`, no brand utilities.
  - The footer is not `container-wide`-nested inside another band — `SectionBand` already wraps its children in one.
