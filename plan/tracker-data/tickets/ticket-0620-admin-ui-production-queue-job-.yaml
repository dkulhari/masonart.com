ticket_number: 620
title: Admin UI - production queue, job detail with QC review, and the order production panel
description: |-
  ## Task
  `/admin/production` queue, `/admin/production/$id` detail with the QC review form, and a production panel on the existing `/admin/orders/$id`.

  ## Context
  Feature: vendor-management. Phase 5 of 7. Depends on the production API and the vendors screens.

  **Queue** — filter by stage, status and vendor; paginated; state in the URL via `validateSearch` with the coercion/split hazard handled (`router.tsx` overrides TanStack's serialisation). Skeleton, empty and error states, all three.

  **Assignment** is where the capability filter earns its keep: when assigning a job, show only vendors with a capability covering that stage and the largest item's longest edge, and show each candidate's rate for that size. If the API returns 422 because an item has no covering band, name the item and the size — do not present it as a generic failure, because the fix is "add a rate band", which the admin can do immediately.

  **QC review form** — verdict pass/fail plus free-text defects and notes. Every submission appends a row; the detail screen shows the full review history in order. A rejected-then-reworked-then-passed job displays three entries, and that history being visible is the reason the reviews live in their own table.

  **Order production panel** — on `/admin/orders/$id`, show the jobs covering that order's items, which items are on which job, and which items are on no job at all. That last one matters: an order item with no production job is invisible work, and this panel is the only place it would show up.

  Same four rules as the other admin screens: no native `confirm()`, three list states, URL state, pagination.
