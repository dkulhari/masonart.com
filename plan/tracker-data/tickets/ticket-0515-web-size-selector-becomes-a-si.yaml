title: 'web: size selector becomes a single 52px dropdown instead of a stacked price list'
description: 'Reference uses one native-styled `<select>`: height 52px, radius 6px, background rgba(23,23,23,0.024), padding 0 26px, Poppins 16px/300, full column width, placeholder first option ''Select a Size'', option labels carrying both units — `24\"H x 20\"W/ 61H x 51W CM` — and no prices. Ours renders every variant as a full-width card with its own price, which fills the whole viewport. Rework SizeSelector.tsx. Preserve the existing selection callback contract, availability/out-of-stock handling and aria semantics, and either wire up or remove the dead inches/cm toggle at SizeSelector.tsx:98.'
