    text: |-
      **Follow-up landed** — commit `4dd38195`, `fix(web): name the products row-menu trigger for screen readers`.

      The previous comment left this as "worth its own ticket". On review that was over-cautious: the #634 constraint was behaviour-preserving in the sense of not changing how the admin screens look or act, and adding an accessible name to an icon-only button changes neither. `RowActionsMenu` already took a `label` prop, so it was one line.

      `ProductsTable`'s trigger is now `aria-label={\`Product actions for ${product.title}\`}`, and it picks up `aria-haspopup`/`aria-expanded` from the shared shell the same way the orders trigger does.

      **Verification**:
      - Command: `cd packages/web && bunx vitest run tests/components/admin/ tests/styles/`
      - Result: PASS — 15 files, **160 tests** (159 baseline + one new assertion pinning the products trigger's name and open state)
      - Typecheck: PASS via the pre-commit gate, 0 errors

      `label` stays optional on `RowActionsMenu` so the component does not force a name on a future caller that genuinely has no row identity to put in one, but both current callers now pass it.

      All four commits for this ticket are pushed to `origin/main` (`ce922da1`).
