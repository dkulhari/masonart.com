    text: |-
      ✅ **Completed**

      **Commits**:
      - `12b1cf62` — test(web): pin the shared behaviour of the admin tables before extracting it
      - `ec160434` — refactor(web): extract StatusBadge, SortableHeader and RowActionsMenu from the admin tables
      - `bbe812c6` — refactor(web): extract the AdminDataTable shell from the admin tables

      **Files Changed**:
      - `packages/web/tests/components/admin/admin-tables-shared.test.tsx` — new, 28 characterization tests over both tables
      - `packages/web/app/components/admin/StatusBadge.tsx` — new, region 1
      - `packages/web/app/components/admin/SortableHeader.tsx` — new, region 2
      - `packages/web/app/components/admin/RowActionsMenu.tsx` — new, region 3
      - `packages/web/app/components/admin/AdminDataTable.tsx` — new, regions 4 and 5 (`AdminDataTable` + `AdminTableSkeleton`)
      - `packages/web/app/components/admin/OrdersTable.tsx` — 716 → 556 lines
      - `packages/web/app/components/admin/ProductsTable.tsx` — 736 → 586 lines

      **Summary**:
      All five clone regions are now single shared components. The test came first, on its own commit, so the refactor diff is reviewable against it.

      Three differences between the two tables became props rather than being flattened away:
      - `StatusBadge` keeps `styles`/`labels` with each caller. Order status, payment status and product status are three different vocabularies; one map exhaustive over all three would be worse than the duplication. `labels` is optional — product statuses render the raw value through `capitalize`, as before.
      - `AdminDataTable` takes `isFiltered` rather than the empty-state copy. An empty table means two different things — nothing exists, or nothing matched — and only the second is worth advising about. Passing the boolean keeps the sentence in one place.
      - `AdminDataTable` takes `rowClassName` for the tint on a selected product row. OrdersTable has no row selection and passes nothing.

      `RowActionsMenu` gives its children a `close` callback so an item can dismiss the menu after running. ProductsTable's "View in Store" link deliberately does not, and still does not.

      Palette classes moved verbatim; nothing was retokenised.

      **Verification**:
      - Command: `cd packages/web && bunx vitest run tests/components/admin/ tests/styles/`
      - Result: PASS — 15 files, 159 tests, identical to the pre-refactor baseline recorded at step 2
      - Command: `bun run typecheck`
      - Result: PASS — 0 errors, 4/4 turbo tasks
      - Command: `npx jscpd@5.0.12 packages --format typescript,tsx,javascript,jsx --ignore '...' --min-lines 15`
      - Result: total duplication **2.62%**, down from the 2.93% baseline. Grepping the clone list for OrdersTable/ProductsTable/AdminDataTable/RowActionsMenu/StatusBadge returns nothing — all five pairs are gone.

      **Browser verification** (step 11, on localhost:3001 as admin):
      - `/admin/orders` — badges render in their own palettes (Confirmed blue, Paid green, Pending amber), Package and DollarSign cell icons intact, pagination footer reads "Showing 1 to 10 of 20 orders".
      - Sort ladder: clicking `Total` sorted ascending, swapped the double chevron for the up chevron, and re-ordered the rows.
      - Row menu: opened with View Details / Update Status / separator / Cancel Order (amber) / Initiate Refund (red); the click-away backdrop closed it.
      - The `aria-label="Order actions for MA-2026-000042"`, `aria-haspopup` and `aria-expanded` from #625 survive the extraction — confirmed in the accessibility tree.
      - `/admin/products` — thumbnails, Active/Featured badges, sortable headers, pagination all correct. Row menu opens with View Details / Edit Product / View in Store / separator / Archive (amber) / Delete (red).
      - Row selection tints the row and raises the "1 selected · Archive · Delete" bulk bar.
      - Empty state: searching a non-matching string renders the ImageIcon, "No products found" and the "Try adjusting your search or filter" hint, with the pagination footer hidden.
      - No console errors.

      **Follow-up, deliberately not fixed here**: ProductsTable's row-menu trigger still has no accessible name — the accessibility tree shows it as a bare `button`. #625 named that defect and fixed only the orders side. `label` is optional on `RowActionsMenu` for exactly that reason. Adding it would change the products DOM, which is outside a behaviour-preserving refactor; worth its own ticket.
