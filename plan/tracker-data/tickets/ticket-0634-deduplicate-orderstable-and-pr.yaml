    code: |
      /**
       * What OrdersTable and ProductsTable must keep doing while their shared parts
       * are extracted (#630 follow-on).
       *
       * These assertions describe behaviour that exists TODAY. They are written
       * before the refactor so the extraction has something to be checked against —
       * the only spec that renders either table right now is product-popularity,
       * which would stay green through almost any regression here.
       */

      import { describe, it, expect, afterEach } from 'vitest'
      import { render, screen, cleanup, within } from '@testing-library/react'

      import { OrdersTable } from '~/app/components/admin/OrdersTable'
      import { ProductsTable } from '~/app/components/admin/ProductsTable'

      afterEach(cleanup)

      describe('the admin tables share a shell', () => {
        it('renders the empty state when there are no rows', () => {
          render(<OrdersTable orders={[]} isLoading={false} />)
          expect(screen.getByText(/no orders/i)).toBeInTheDocument()
        })

        it('renders skeleton rows, not an empty state, while loading', () => {
          const { container } = render(<OrdersTable orders={[]} isLoading />)
          expect(container.querySelectorAll('.animate-pulse').length).toBeGreaterThan(0)
          expect(screen.queryByText(/no orders/i)).toBeNull()
        })

        it('gives every sortable header a button that toggles the sort', () => {
          render(<ProductsTable products={[]} isLoading={false} />)
          const header = screen.getByRole('button', { name: /title/i })
          expect(header).toBeInTheDocument()
        })
      })
