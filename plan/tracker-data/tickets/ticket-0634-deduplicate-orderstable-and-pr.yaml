ticket_number: 634
title: 'Deduplicate OrdersTable and ProductsTable: status badges, sortable header, row menu and table shell'
description: |-
  ## Task

  `packages/web/app/components/admin/OrdersTable.tsx` and `ProductsTable.tsx` are near-copies of each other outside their column definitions. #630 took the pagination footer out into `<TablePagination>`; five clone regions survive, totalling ~180 duplicated lines.

  These are **production admin UI with almost no test coverage** — the only spec touching either file is `tests/components/admin/product-popularity.test.tsx`. That is the reason this is worth doing (two copies of a table shell drift silently) and also the reason to be careful: write a characterization test first, before moving anything.

  ## The clone regions

  **1. Status badge — `OrdersTable.tsx:116-180` (a self-clone: `OrderStatusBadge` vs `PaymentStatusBadge`)**

  Both are the identical shape — a `Record<Status, string>` of classes, a `Record<Status, string>` of labels, and one `<span>`:

  ```tsx
  function OrderStatusBadge({ status }: { status: OrderStatus }) {
    const styles: Record<OrderStatus, string> = { pending: 'bg-amber-100 …', … }
    const labels: Record<OrderStatus, string> = { pending: 'Pending', … }
    return <span className={cn('inline-flex items-center rounded-full border px-2 py-0.5 text-xs font-medium', styles[status])}>{labels[status]}</span>
  }
  ```

  Extract a `<StatusBadge styles labels status />`, or a `makeStatusBadge(styles, labels)` factory. `ProductsTable` has the same shape for its own status set.

  **Note, do not fix here:** these maps use raw palette classes (`bg-amber-100`, `text-green-700`) rather than design tokens. Moving them is in scope; re-colouring them is not — that would change how the admin screens look and belongs in its own ticket.

  **2. Sortable column header — `OrdersTable.tsx:322-347` vs `ProductsTable.tsx:255-280` (26 lines)**

  Identical apart from the generic: `Column<AdminOrder, unknown>` vs `Column<AdminProduct, unknown>`. The asc/desc/unsorted chevron ladder is duplicated verbatim. Extract a generic `<SortableHeader<TData> column>{children}</SortableHeader>`.

  **3. Row actions dropdown — `OrdersTable.tsx:233-253` vs `ProductsTable.tsx:143-163` (21 lines)**

  The `MoreHorizontal` trigger, the full-screen click-away backdrop, and the absolutely-positioned menu shell. Only the menu *items* differ. Extract `<RowActionsMenu>` taking the items as children.

  **4. Table shell — `OrdersTable.tsx:584-628` + `643-662` vs `ProductsTable.tsx:604-648` + `666-685` (45 + 20 lines, the big one)**

  `<thead>` from `getHeaderGroups()`, the five-row loading skeleton, the empty state, and the `<tbody>` cell loop. Only the empty-state icon and copy differ (`Package` in Orders). Extract `<AdminDataTable table columns isLoading emptyIcon emptyTitle emptyBody />`.

  **5. Skeleton widths block — `OrdersTable.tsx:701-716` vs `ProductsTable.tsx:721-736` (16 lines)**

  The `[150, 200, 140, …].map(...)` pulse-bar rows inside `OrdersTableSkeleton` / `ProductsTableSkeleton`. Fold into the extracted skeleton, taking the width array as a prop.

  ## Acceptance criteria

  - Each region above is one shared component under `packages/web/app/components/admin/`.
  - **Behaviour-preserving**: both admin tables look and act exactly as before — same classes, same sort ladder, same empty and loading states, same menu behaviour including click-away.
  - The raw palette classes in the badge maps are moved as-is, not retokenised.
  - `bun run typecheck` stays at 0 errors.
  - Re-running the scan shows these five pairs gone and total duplication below the current 2.93%.

  ## Context

  - Follow-on from #630. `<TablePagination>` (`app/components/admin/TablePagination.tsx`) is the pattern to copy: props for what genuinely differs, one named constant for a class string repeated across siblings.
  - Coverage is thin. `tests/components/admin/product-popularity.test.tsx` is the only spec that renders either table, so a green run proves very little on its own. Step 1 is a characterization test that renders both tables and asserts the header sort ladder, the empty state and the loading skeleton — otherwise there is nothing to catch a regression.
  - `tests/styles/storefront-token-compliance.test.ts` guards design tokens. It passes today with these raw palette classes in place, so the extraction must not move them into a path the guard covers differently. Run `bunx vitest run tests/styles/` after the badge extraction.

  ## Verification

  ```
  cd packages/web
  bunx vitest run tests/components/admin/ tests/styles/
  cd ../.. && bun run typecheck
  ```

  Then visually confirm both screens — `/admin/orders` and `/admin/products` — still sort, paginate, open their row menus and render their empty states.

  Then re-run the scan scoped as the #630 baseline was:

  ```
  npx jscpd@5.0.12 packages \
    --format typescript,tsx,javascript,jsx \
    --ignore '**/node_modules/**,**/migrations/**,**/dist/**,**/build/**,**/.turbo/**,**/*.d.ts' \
    --min-lines 15
  ```
