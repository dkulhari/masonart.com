    description: 'Characterization test: render both tables and pin the shared behaviour before moving any of it'
    file: packages/web/tests/components/admin/admin-tables-shared.test.tsx
    command: cd packages/web && bunx vitest run tests/components/admin/admin-tables-shared.test.tsx
    expected_result: PASS - this test describes CURRENT behaviour, so it must pass before the refactor and after it. If it fails now, the assertion is wrong, not the component.
