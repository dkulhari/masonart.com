ticket_number: 410
title: Web - Discover chip carousel on the collection page
description: |-
  ## Task

  Build `DiscoverChips` (analysis §1.3.2) and render it under the beige header band on /posters. Today the only "discover" on that page is a word in the SEO paragraph.

  - Horizontally scrollable row of circular image chips, one per collection from `GET /api/products/collections`, with prev/next arrows
  - Chip = circular image + label + count
  - Click toggles `?styles=<id>`; the active chip is visually marked and its second click clears
  - No image on a collection -> a monochrome initial-letter fallback, never a broken img

  ## Context

  Part of feature: collection-page-parity-remainder
  Phase: 3 - Web
  Files: packages/web/app/components/product/DiscoverChips.tsx (new), packages/web/app/routes/posters/index.tsx

  **Routing trap:** router.tsx overrides TanStack search serialization, so `styles` travels as a comma-joined string and `validateSearch` splits it back. A chip must go through the existing `handleFiltersChange` (posters/index.tsx:418-473), never a raw navigate - a hand-built search object error-boundaries the route to a blank page.

  **Token guard:** consumes Button/primary/accent/band tokens. `font-bold`, `fill-yellow-400`, `brand-*`, `blur-3xl` and brand gradients all fail packages/web/tests/styles/storefront-token-compliance.test.ts.

  Scroll container needs keyboard reachability - arrows are buttons, the rail is focusable and arrow-key scrollable, not a mouse-only affordance.
