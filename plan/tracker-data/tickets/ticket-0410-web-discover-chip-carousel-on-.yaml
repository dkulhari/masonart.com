      // Presentational only: it receives collections and reports selection upward.
      // Fetching lives in the route so the chip row cannot fire its own request on
      // every filter change.
      export interface DiscoverCollection {
        id: string
        label: string
        count: number
        image: string | null
      }

      export interface DiscoverChipsProps {
        collections: DiscoverCollection[]
        activeStyle: string | undefined
        onSelect: (styleId: string | undefined) => void
        className?: string
      }
      // - <ul> rail, overflow-x-auto, scroll-smooth, snap-x
      // - each chip: rounded-full 80px media, object-cover; no image -> initial on --mat
      // - active chip carries aria-current="true" and a ring in the primary token
      // - arrows: Button variant="outline" size="icon", scrollBy(rail.clientWidth * 0.8)
      // - arrows hidden when the rail does not overflow
