      import { render, screen, fireEvent } from '@testing-library/react'
      import { describe, it, expect, vi } from 'vitest'
      import { DiscoverChips } from '~/components/product/DiscoverChips'

      const collections = [
        { id: 'abstract', label: 'Abstract', count: 12, image: 'https://x/a.jpg' },
        { id: 'minimalist', label: 'Minimalist', count: 3, image: null },
      ]

      describe('DiscoverChips', () => {
        it('renders one chip per collection with its count', () => {
          render(<DiscoverChips collections={collections} activeStyle={undefined} onSelect={vi.fn()} />)
          expect(screen.getByRole('link', { name: /Abstract/ })).toBeInTheDocument()
          expect(screen.getByText('12')).toBeInTheDocument()
        })

        it('falls back to an initial when a collection has no image', () => {
          render(<DiscoverChips collections={collections} activeStyle={undefined} onSelect={vi.fn()} />)
          expect(screen.queryByRole('img', { name: /Minimalist/ })).toBeNull()
        })

        it('marks the active collection and clears it on a second click', () => {
          const onSelect = vi.fn()
          render(<DiscoverChips collections={collections} activeStyle="abstract" onSelect={onSelect} />)
          const chip = screen.getByRole('link', { name: /Abstract/ })
          expect(chip).toHaveAttribute('aria-current', 'true')
          fireEvent.click(chip)
          expect(onSelect).toHaveBeenCalledWith(undefined)
        })

        it('renders nothing when there are no collections', () => {
          const { container } = render(<DiscoverChips collections={[]} activeStyle={undefined} onSelect={vi.fn()} />)
          expect(container).toBeEmptyDOMElement()
        })
      })
