    text: |-
      Done in 12fb5221. 36 tests passing (19 payables/settlements, 17 invite), `bun run typecheck` clean.

      - `src/routes/admin/vendor-payables.ts` — GET /:id/payables (derived via lib/vendor-payables), GET /:id/settlements, POST /:id/settlements. Verification read takes FOR UPDATE inside the transaction; unknown job / foreign vendor / already-settled are each 422 with no write, and the UPDATE re-states the predicate so a partial match rolls back.
      - `src/routes/admin/vendor-invite.ts` — POST /:id/invite. Account via `auth.api.signUpEmail`, role promotion + vendor_users link in one transaction, compensating delete of the Better Auth account if that transaction fails (signup cannot join our tx). Existing non-vendor account -> 409, already-linked -> 422, UNIQUE(user_id) race -> 422 on both the mint path and the adopt-an-unlinked-vendor-account path. Best-effort `requestPasswordReset` after commit; failure is reported as `passwordResetSent: false`, not as a failed invite.
      - Both mounted at /api/admin/vendors via narrow appends to src/index.ts (#613 and #614's lines untouched).

      Carried-over #611 assertion is test "agrees with lib/vendor-scope.getVendorPayableTotal on the same rows": the db mock evaluates the vendor-scope aggregate with an independent decimal-string sum (not sumPayable) over the same seeded rows, and the test also renders the aggregate's WHERE to confirm it is scoped to the vendor and to settlement_id IS NULL.

      Gap worth a follow-up: nothing checks the settlement `amount` against the sum of the named jobs. Deliberate — partial and rounded payments are real — but it means a typo'd amount is recorded silently. A warning field on the response (owed vs paid) would cost nothing.
