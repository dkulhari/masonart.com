ticket_number: 406
title: API - GET /api/products/collections for the Discover chips
description: |-
  ## Task

  New endpoint feeding the Discover chip carousel (analysis §1.3.2). Per style, returns:

  - `id` and `label` from STYLE_OPTIONS in `@chobii/shared` (packages/shared/src/constants/facets.ts:44) - the single source of truth, no fourth parallel vocabulary
  - `count` of active products carrying that style
  - `image`: the square media of one representative active product - highest `featuredOrder`, else newest

  Styles with zero active products are omitted: a chip that leads to an empty grid is worse than no chip.

  ## Context

  Part of feature: collection-page-parity-remainder
  Phase: 2 - API
  File: packages/api/src/routes/products.ts

  Register BEFORE the `/:slug` route, or "collections" is read as a product slug - the same trap the `/facets` route documents at :533.

  Follow the `/facets` caching pattern: versioned cache key (`CacheKeys.PRODUCT}collections:v1`), `getCached` / `setCached`, TTL alongside the other product TTLs. `styles` is a `text[]` column, so it needs `unnest` to group - see the `arrayFacet` helper in the facets route.
