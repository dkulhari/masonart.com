      Done — commit 32a74022.

      **Verification**
      - `bunx vitest run tests/routes/product-collections.test.ts` — RED at 8 failing, GREEN at 8 passing.
      - Ran the grouped query against the **real** dev database: 12 style rows returned, every one with a representative image resolved. Top rows: ukiyo-e-art (12), wabi-sabi-art (9), graffiti-art (9), hyperrealism-art (7).

      **Deviation from the ticket's step 3:** the plan used `db.execute` with a `distinct on` second query for the representative image. Shipped as a single grouped query instead — `array_agg(image order by featured_order asc nulls last, created_at desc))[1]` picks the winner per group in the same scan, and it stays on `db.select`, which is what the route suites' mocked `db` exposes. `db.execute` is not on that mock.

      **Image resolution** prefers the element explicitly typed `main` and falls back to `images -> 0`, which the `ProductImage` contract documents as the main image after sorting.

      **Free-text guard:** the response is built by iterating `STYLE_OPTIONS`, not the query result. That supplies the labels, fixes the order, and silently drops any value in the column outside the vocabulary — such a value has no label and filtering on it would 400.
