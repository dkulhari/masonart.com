      Added updateVendorJob to lib/vendor-scope — the only mutation there, scoped twice (pre-read plus vendorId in the UPDATE's WHERE) and returning the re-read customer-free column list rather than the raw .returning() row, which would carry orderId. Enrolled it in tests/lib/vendor-scope.test.ts's scopedFns so it is covered by the refuses-without-vendorId assertions (10 passing).

      tests/routes/vendor/jobs.test.ts: 23 passing. Real requireAuth/requireVendor/vendor-scope over a recording db mock, so the isolation assertions read the WHERE clause that actually reached the driver. Covers scoped list + pagination, 404 (not 403) on another vendor's job, status/date update, amounts ignored, 400 on an amounts-only body, self-QC refused, 404 with zero UPDATE issued on a foreign job, scoped rates, settlements + derived payable total, and 403 on every route for a vendor-role user with no link, an admin with no link, and a suspended vendor. Every response body is asserted free of customer fields.
