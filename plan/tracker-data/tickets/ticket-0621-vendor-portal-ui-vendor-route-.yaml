      **Summary**:
      Guard: no session → `redirect('/auth/login', { search: { redirect: location.href } })`; logged-in non-vendor → Access Denied, never a redirect. ADMIN and super-admin are denied — asserted, along with the reverse (the admin guard denies `vendor`) and with a source assertion that this file imports nothing from the admin route.

      Artwork: the signed URL is requested in the click handler and used in the same tick. Tests assert zero fetches at render, one fetch on click with `credentials: 'include'`, and that no signed URL is ever in an href.

      Isolation: every screen rendered against fixtures polluted with `customerName`, `customerEmail`, `shippingAddress`, `phone`, `orderId`, `orderNumber`, `orderItemId`, `userId`, `retailPrice`, `buyerNote` — whole innerHTML checked, plus a meta-test proving the assertion has teeth.

      Also pinned: exactly four screens under the layout (directory listing asserted), no native `confirm()`/`alert()` in any of the five files, every error block digit-free, `vendorJobsSearchSchema` / `vendorPaymentsSearchSchema` coerce URL strings and `.catch()` garbage to defaults instead of error-boundarying to a blank page.

