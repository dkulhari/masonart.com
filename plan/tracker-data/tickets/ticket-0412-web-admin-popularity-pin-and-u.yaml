ticket_number: 412
title: Web - admin popularity pin and units-sold column
description: |-
  ## Task

  Admin surface for the popularity signal, under packages/web/app/routes/admin/products/:

  - Product list gains a **Units sold** column reading `unitsSold` from the admin API - the real figure, sortable
  - Product form gains a **Popular** toggle and an order field, following whatever pattern the existing Featured toggle and featured-order field already use
  - The two are shown side by side deliberately: the pin reorders, the number stays true, and a curator should be able to see when they disagree

  ## Context

  Part of feature: collection-page-parity-remainder
  Phase: 3 - Web
  Depends on the admin API ticket.

  Zero units sold everywhere is the expected state until real orders exist - the column reads 0, it does not hide itself. Admin UI is internal, so `--brand-*` is allowed here; the storefront token guard does not cover these routes.
