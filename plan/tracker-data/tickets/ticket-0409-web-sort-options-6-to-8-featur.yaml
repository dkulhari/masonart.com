    text: |-
      Done — commits 8589913e and bad215e2.

      **Verification**
      - `bunx vitest run tests/components/product/CollectionToolbar.test.tsx` — RED at 4 failing, GREEN at 15 passing.
      - `bunx vitest run tests/components/product/` — 144 passing across 9 files, no regression.
      - `bun run typecheck` — **23 errors, baseline restored** (see below).

      **Caught a real regression on the gate.** The first commit took typecheck to 24. Three separate errors surfaced once turbo got past its cache:

      1. `app/lib/api.ts` — the web API client carries its **own** `sortBy` union, independent of `ProductFilters`'s `SortOption`. Widening one and not the other meant the route could not pass the value the toolbar now offers.
      2. `routes/products.ts` — my nulls-last helper typed its parameter as `typeof products.featuredOrder`, which is a *column-specific* type in drizzle, so passing `popularOrder` failed. Widened to `AnyColumn`.
      3. `seed-orders-reviews.ts` — `noUncheckedIndexedAccess` makes an array lookup `string | undefined`, against a NOT NULL author column.

      Worth carrying: **`sortBy` is declared in three places** — the API zod enum, `ProductFilters.SortOption`, and `lib/api.ts`. Adding a sort value means touching all three, and only the typecheck catches the one you forget. That is the same one-source-of-truth problem features #395-#399 fixed for facet vocabularies; sort was not part of that sweep.

      Also corrected the comment block above `SORT_OPTIONS`, which claimed all three missing options needed a signal we lacked. Only Best selling did.
