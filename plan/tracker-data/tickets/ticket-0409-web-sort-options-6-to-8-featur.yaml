ticket_number: 409
title: Web - sort options 6 to 8 (Featured, Best selling)
description: |-
  ## Task

  `SORT_OPTIONS` in packages/web/app/components/product/CollectionToolbar.tsx:22 holds 6. Add two:

  - `featuredOrder-asc` -> "Featured"
  - `salesCount-desc` -> "Best selling"

  The id scheme stays `${sortBy}-${sortOrder}` - the route splits on the hyphen at posters/index.tsx:419. These are new sortBy values, not a new scheme.

  Also update the comment block at :18-21, which currently states all three missing options need a signal we lack. After this ticket only "Most relevant" is out, and it is out because it has no honest definition without a search query - not because of a missing signal.

  `SortOption` in packages/web/app/routes/posters/index.tsx (:85) must gain `salesCount`, or the typecheck baseline moves.

  ## Context

  Part of feature: collection-page-parity-remainder
  Phase: 3 - Web

  The existing test asserts `SORT_OPTIONS` has length 6 (tests/components/product/CollectionToolbar.test.tsx:37) - that assertion is the failing test for this ticket.

  Router search params are strings: router.tsx overrides TanStack serialization, so anything read back out of `validateSearch` needs coercion. `sortBy`/`sortOrder` are already plain strings, so this ticket adds no coercion work - but do not assume that for any new param.
