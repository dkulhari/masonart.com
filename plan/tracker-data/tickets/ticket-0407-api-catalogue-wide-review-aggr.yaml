ticket_number: 407
title: API - catalogue-wide review aggregate for the promo tile
description: |-
  ## Task

  `GET /api/reviews/stats` - one aggregate across the whole catalogue, approved reviews only: `{ averageRating, reviewCount }`.

  The existing stats route is per-product (packages/api/src/routes/reviews.ts:165, mounted under `/products/:productId/reviews`). The promo tile needs the catalogue figure and there is no endpoint for it.

  `averageRating` is null, not 0, when there are no approved reviews - the same rule the product list already applies at products.ts:337. The tile renders nothing on null.

  ## Context

  Part of feature: collection-page-parity-remainder
  Phase: 2 - API

  This is the only real social-proof number we have. mesonart's promo tile reads "Rated 4.9/5 by 9,000+ Users"; ours says whatever is true, or says nothing. Never a rounded-up or seeded figure.
