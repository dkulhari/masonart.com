      Done — commit bbfbf9be.

      **Verification**
      - `bunx vitest run tests/routes/review-catalogue-stats.test.ts` — RED at 6 failing, GREEN at 6 passing.
      - `bunx vitest run tests/routes/reviews.test.ts` — existing suite unaffected by the new route registration.
      - Ran the aggregate against the **real** dev database: `{ avg: null, n: 0 }`.

      **Consequence worth recording: the promo tile will not render in dev.** The catalogue currently holds **zero** reviews of any status, not just zero approved ones — `select status, count(*) from reviews group by status` returns an empty set. That is the designed behaviour (null average, tile renders nothing) but it means §1.3.6 ships invisible until reviews exist. Seeding reviews is blocked on the same thing it always was: reviews need a real `order_item_id` and no orders are seeded (local trap #4).

      **Two guards added beyond the ticket steps:**
      - The average is coerced to a number. Postgres hands `numeric` back as a string, which renders correctly and then silently concatenates the first time anything does arithmetic on it.
      - A failed query returns 500 rather than a zeroed aggregate. A tile reading "0 reviews" because the database is down is a lie with a nicer face than an error.
