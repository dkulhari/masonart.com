ticket_number: 516
title: API - featured products endpoint returns no sale price, so the home rail disagrees with the grid
description: |-
  ## Task
  #428 added resolved sale pricing to the product list (`products.ts:246`) and detail (`:812`) routes, both correctly keyed on member state via `viewerCacheSuffix`. The **featured** handler (~`products.ts:596-631`) was not in that ticket's scope and still returns rows with no `sale` field, and its cache key `${CacheKeys.PRODUCT}featured:${limit}` carries no viewer suffix.

  Consequence: during a sale the home page's featured rail shows base prices while the same products show struck-through sale prices on `/posters`. Same catalogue, two prices, one screen apart.

  Resolve sale pricing there the same way the list route does — `getActivePromotions()` + `loadPromotionProductSets()` once per request, `resolveSalePrice` per row — and add the viewer suffix to the cache key so a guest's locked body is never served to a member.

  ## Context
  Part of feature: sale-promotions
  Phase: 3 — API surfaces
  Design: `docs/superpowers/specs/2026-08-05-sale-promotions-design.md` §5, §7

  Found while verifying #428. Check the row projection includes every facet column `resolveSalePrice` reads — the same omission bit the list route, where `rooms` was missing and a room-scoped sale priced the PDP but not the grid.

  Worth a sweep while here: any other handler returning product rows to the storefront needs the same treatment or it becomes the next disagreement.
