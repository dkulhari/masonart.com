    text: |-
      ✅ **Completed**

      **Commit**: `fd38bf0d` — fix(api): price the featured rail and the related row, so the catalogue agrees with itself

      **Files Changed**:
      - `packages/api/src/routes/products.ts` — sale resolution + viewer cache suffix + facet columns on the `featured` and `:slug/related` handlers
      - `packages/api/tests/routes/product-sale-pricing.test.ts` — 15 new tests across two describe blocks

      **Summary**:
      `GET /api/products/featured` now reads member state off the session, keys its cache `featured:${limit}${viewerCacheSuffix(isMember)}`, selects `rooms` alongside the other facet columns, resolves `sale` per row through `loadSaleContext` + `resolveSalePrice`, and caches the **priced** rows rather than the bare ones (the old key lived 15 minutes, so caching pre-resolution rows would have kept the rail unpriced well into a running sale).

      `GET /api/products/:slug/related` got the same treatment — it feeds the identical `ProductCard` on the PDP and was missing `rooms` *and* `isFeatured* from its projection on top of the unkeyed cache.

      One test asserts against the projection object handed to `db.select(...)` rather than a fixture. With `db` mocked, that is the only assertion in the file capable of catching a column missing from a projection — the precise gap that let #428's `rooms` omission through.

      **Verification**:
      - Command: `bunx vitest run tests/routes/product-sale-pricing.test.ts` (with `DATABASE_URL` overridden from `.env` to port 5440; the repo default of 5433 is a different application's database and silently reports skips as green)
      - Result: PASS (34 tests, 34 passing, 0 failing) — 19 pre-existing #428 tests plus 15 new
      - Red-first evidence: the same command reported **15 failed | 19 passed** before the implementation landed, failing on `sale` being `undefined`, `rooms` absent from the projection, and guest/member cache keys comparing equal
      - Type-check: `bunx tsc --noEmit` in `packages/api` — 0 errors

      **Follow-up recommended**: `GET /api/collections/:slug` carries the same bug (see the sweep comment above). It needs `optionalAuth` wired onto `collectionsApp` plus auth mocks in `collection-detail.test.ts` and `collections.test.ts`, which is its own ticket.
