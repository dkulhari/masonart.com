    text: |-
      ✅ **Completed**

      **Commit**: `215bd665` — feat(api): the label-readiness seam, with a guard on each side of it

      **Files Changed**:
      - `packages/api/src/lib/production-readiness.ts` (new) — the seam: `evaluateLabelReadiness` (pure, over a snapshot), `loadOrderProductionSnapshot`, `getOrderLabelReadiness`, `isOrderReadyToLabel`, `proposeConsolidator`, `consolidatorOverrideAllowed` / `canOverrideConsolidator`, and the `LABEL_READINESS_CONSUMERS` manifest with its matcher and failure messages.
      - `packages/api/tests/lib/production-readiness.test.ts` (new) — 45 tests.
      - `packages/api/tests/lib/production-seam.test.ts` (new) — 16 tests.

      **Summary**

      `isOrderReadyToLabel` is literally `blockers.length === 0` over `getOrderLabelReadiness` — not `readiness.ready`, and never a second query. `ready` is asserted to equal `blockers.length === 0` on *every* case the suite builds, so a "not ready with no reason" fails the suite rather than reaching `OrderProductionPanel.tsx`.

      The predicate is pure over an `OrderProductionSnapshot`; the five reads are a separate function. That is what makes six interacting conditions testable without seeding an order chain per condition — the same split `vendor-payables.ts` uses. `reader` defaults to `db` and has the shape `lib/audit.ts` already established (`{ select: typeof db.select }`), which a drizzle `tx` satisfies, so order-dispatch-tracking can evaluate this inside the transaction that writes the shipment. Both directions are tested: with a reader the module `db` is never touched; without one it is.

      Blockers: `no_jobs`, `no_consolidator`, `item_uncovered`, `job_not_qc_passed`, `goods_not_at_consolidator`, `transfer_in_flight`, `transfer_lost` — one code per condition of §5, each carrying a renderable message plus the jobId / orderItemId / transferId / stage it concerns.

      **The emergent property is asserted, twice.** Once the consolidator's OWN jobs go `dispatched`, readiness goes FALSE again — a dispatched job with no inbound received transfer to C is `goods_not_at_consolidator`. Second test covers the framed case where the earlier B→A leg *was* received and the order is still not ready for a second label. One label per order, structurally: no `label_created_at` column, no lock, nothing to remember.

      Coverage: `frame_id IS NULL` needs a print job; `frame_id` set needs print AND frame (a framed line covered only by its print job is a poster in a tube). Gift-card lines and `orderType = 'gift_card'` need none, and an order with nothing to produce returns ready with zero blockers rather than being wedged out of fulfilment by `no_jobs`.

      Consolidator selection per §5: sole vendor → automatic (`needsConfirmation: false`, i.e. `decided_by = NULL`); a frame job → its vendor; otherwise most distinct order items with ties broken by earliest `assigned_at`, then vendor id so the proposal cannot change on refresh. The last two are proposals (`needsConfirmation: true`). `consolidatorOverrideAllowed` is the predicate — the 409 is #682's route, as scoped.

      **Both scans, and both proved able to fail**

      Manifest-plus-scan shape of `database/raw-sql-objects.ts`: the allow-list lives beside the function, the scanning lives in the suite.

      - Forward: no file under `packages/api/src` contains `isOrderReadyToLabel(` outside `routes/admin/shipments.ts` / `lib/shipment-*` (plus the defining module, excluded by name rather than by a regex that could be fooled).
      - Reverse: no file under `lib/production-*` imports anything named `shiprocket`. Import *statements* are scanned, not whole files — static, multi-line, side-effect, dynamic and `require` — so `production-readiness.ts`, which must name the courier in its own failure message, is not reported for describing itself.

      Each scanner is pure over `{path, contents}` and runs twice on every CI run: over the real tree expecting nothing, and over a planted corpus expecting exactly the offender back. Then proved against the real tree by hand:

      ```
      src/routes/admin/__seam-probe.ts   -> "finds no unauthorised caller" FAILED, naming routes/admin/__seam-probe.ts
      src/lib/production-probe.ts        -> "finds no carrier import" FAILED, naming lib/production-probe.ts
      ```

      Both probes deleted; suite back to 16/16. `routes/admin/shipments.ts` was not touched — nothing calls the gate yet, which is the point.

      **Verification**
      - Command: `bunx vitest run tests/lib/production-readiness.test.ts tests/lib/production-seam.test.ts` (cwd `packages/api`)
      - Result: PASS — `Test Files 2 passed (2) | Tests 61 passed (61)`
      - Also: `bunx vitest run tests/lib/production-transitions.test.ts` alongside → 108 passed (3 files), confirming #676 is unaffected.
      - Gate: `bun run typecheck` → `Tasks: 4 successful, 4 total` (api src + api tests + shared + web). Pre-commit hook ran it again and passed.
