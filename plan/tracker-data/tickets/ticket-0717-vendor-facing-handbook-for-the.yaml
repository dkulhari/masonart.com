      **Summary**:
      A single self-contained HTML page — no external assets beyond Google Fonts — in eight sections: the three tabs, the job lifecycle, the shot lists, sending a parcel, receiving one, what you are paid, what to do when a button refuses, and what the portal withholds on purpose.

      Written from the code rather than from memory. Every label is verbatim: `VENDOR_JOB_STATUS_LABELS`, `VENDOR_ACTION_COPY` (including the confirmation questions), `QC_SHOT_LIST` slot-for-slot for both stages, `QC_PHOTO_CONTENT_TYPES` / `QC_PHOTO_MAX_BYTES` / `MAX_QC_PHOTOS_PER_JOB`, and `createTransferSchema`'s field bounds. The status chips use the portal's own palette, so a chip in the handbook matches the chip on the vendor's screen.

      The two sections that do real work: nine actual refusal messages mapped to a plain remedy — three of which ("nobody has been chosen to assemble this order", "you are assembling this order yourself", "written off as lost") read as errors but are instructions to do nothing — and a section stating the isolation rules plainly so nobody hunts for a withheld field.

      Design: cool workshop-paper neutrals, Archivo / Source Serif 4 / IBM Plex Mono, full light and dark token sets including the unstamped `prefers-color-scheme` case, tables scrolling inside their own containers, and a print stylesheet that drops the contents rail and avoids breaking a lifecycle stage across pages.

