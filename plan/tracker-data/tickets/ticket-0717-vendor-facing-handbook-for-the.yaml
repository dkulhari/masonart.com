      - Published and rendered at the URL above
      - `diff` confirms the committed copy is byte-identical to the published file
      - No test suite applies — this is a static document with no imports into the app

      **Left open on purpose** (the reason to reopen rather than delete this ticket):
      1. **Payments is thin** — the settlement cadence is not in the code, so the page explains what a settled job means and stops rather than inventing a policy.
      2. **No contact route** — nothing in the code names how a vendor reaches support, so the page says "ask us".
      3. **HEIC advice unverified** against a current iOS version.
      4. The README's Customer / Trade / Admin guides it sits beside are still dead links — those documents do not exist.
