ticket_number: 717
title: Vendor-facing handbook for the production portal
description: |-
  ## Task

  Write the document a workshop reads before they touch the vendor portal for the first time, and keep a copy in the repo so it can be revised with the code it describes.

  The production pipeline shipped its whole vendor surface — queue, QC shot lists, inter-vendor parcels, the despatch screen — with no vendor-facing documentation at all. Every refusal the API can answer with is written for a vendor to read, but nothing told them what the statuses mean, which photographs are required before "Send for approval" does anything, or that three of the refusals are instructions to do nothing rather than errors.

  ## Scope

  - A single self-contained HTML page, written from the code rather than from memory: status labels from `VENDOR_JOB_STATUS_LABELS`, button names and confirmation questions from `VENDOR_ACTION_COPY`, both shot lists slot-for-slot from `QC_SHOT_LIST`, file rules from `QC_PHOTO_CONTENT_TYPES` / `QC_PHOTO_MAX_BYTES` / `MAX_QC_PHOTOS_PER_JOB`, and the transfer fields from `createTransferSchema`.
  - Published as a shareable artifact, and committed to `docs/user-guide/` so it is revised alongside the portal.
  - Status chips reuse the portal's own palette, so the chips in the handbook are the chips on the vendor's screen.

  ## Known gaps, deliberately left

  - **Payments is thin.** The settlement cadence is not in the code, so the page says what a settled job means and stops there rather than inventing a policy.
  - **No contact route.** Nothing in the code names how a vendor reaches support, so the page says "ask us" rather than inventing an address or an SLA.
  - **HEIC advice unverified.** The "Most Compatible" camera setting is real iPhone guidance but has not been checked against a current iOS version.

  These are why this ticket is worth reopening rather than deleting: the page is correct as far as the code goes, and incomplete exactly where the code was silent.
