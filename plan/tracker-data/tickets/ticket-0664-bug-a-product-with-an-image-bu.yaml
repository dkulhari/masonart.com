    text: |-
      🌐 **Browser verification** (follow-up to `970de4e7`)

      Checked against a local server pair (API :3010, web :4321) on the seeded dev DB, logged in as `admin@chobii.art`, editing "Synthetic Nature" (`6de2a31d-bb93-4025-a8e4-1c8106ec1e3c`, 4 images).

      **No `required` left in the rendered form**
      ```
      {"altInputs":4,"anyRequired":false,"requiredAnywhereInForm":[],"formValid":true}
      ```
      `document.querySelectorAll('form [required]')` returns an empty list, so the browser has nothing to refuse. That is the defect gone at the source.

      **Warning is per-row and reactive**
      Cleared the main image's alt text to a single space. Exactly one `[data-testid="alt-text-warning"]` appeared, on that row only, reading "No alt text — hurts SEO and screen readers"; the three rows that still had alt text stayed clean. Typing a value back cleared the warning immediately (`warningsAfterTyping: 0`). `form.checkValidity()` stayed `true` throughout.

      **The save actually goes through**
      With the blank-alt row mounted and the form in the state that used to block, clicked Save Changes. It persisted:
      ```
      updatedAt: 2026-08-30T07:04:45.401Z
        main         | altText= ' '
        room-mockup  | altText= 'Synthetic Nature framed on a wall'  (x3)
      ```
      Previously this click was a no-op. Restored the original alt text through the UI and saved again (`updatedAt: 2026-08-30T07:05:38.515Z`, `altText= 'Synthetic Nature artwork'`), so the dev DB is back as it was.

      **Correction to the ticket's diagnosis**
      The ticket attributes the silence to a required control inside a *collapsed* section. `FormSection` renders `{isOpen && <div>{children}</div>}`, so collapsing unmounts the rows outright — confirmed live: `altInputsStillMounted: 0` after collapsing Images. A collapsed section therefore could not have been the blocker; the block came from the section in its default-open state, where the empty required input is mounted. This does not change the fix (the input was the blocker either way, and the unit test reproduced it with `onSubmit` called 0 times), but the "not focusable" console line likely came from a different render state than the one described.

      **Not covered**: console capture started after the save, so the absence of the "An invalid form control ... is not focusable" line is not evidenced from the log — it is implied by there being no `required` attribute at all.
