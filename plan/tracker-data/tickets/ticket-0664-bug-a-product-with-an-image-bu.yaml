    text: |-
      ✅ **Completed**

      **Commit**: `970de4e7` - fix(web): stop missing alt text from silently blocking the product save

      **Decision**: took the second option from the ticket — soft warning, not a hard block. The API accepts an empty `altText` and older rows carry one, so making it a validated requirement would still refuse the save, just legibly: an admin editing a title would be forced to write alt text for images they never touched. Reporting it keeps Save working.

      **Files Changed**:
      - `packages/web/app/lib/product-images.ts` - new `isAltTextMissing()` predicate (undefined / empty / whitespace-only all count as missing)
      - `packages/web/app/components/admin/ProductForm.tsx` - dropped `required` from the saved-image and staged-upload alt text inputs; added an `AltTextWarning` amber note rendered per row when alt text is missing
      - `packages/web/tests/components/admin/ProductForm.alt-text.test.tsx` - new, 5 tests
      - `packages/web/tests/components/admin/ProductForm.images.test.tsx` - replaced the now-wrong `marks the alt text input required` assertion from #368, with a comment pointing at the new file
      - `packages/web/tests/lib/product-images.test.ts` - 2 tests for the predicate

      **Summary**:
      The `Alt text` input was marked `required` on every image row. An image with an empty `altText` failed native constraint validation, so the browser refused the submit before React saw it — no request, no banner, and `validateForm()` never ran. Inside the collapsible Images section Chrome could not focus the control to show its bubble, so it gave up silently and only logged "An invalid form control ... is not focusable".

      Alt text is now reported rather than enforced. Both alt text inputs lost `required`; a row without alt text shows a non-blocking amber warning ("No alt text — hurts SEO and screen readers").

      **No native `required` remains anywhere in `ProductForm.tsx`** — verified by grep, the only hits left are the `validateForm()` message strings for title/sku/slug/basePrice. Every requirement now routes through `validateForm()`, which reports next to the field. The invariant holds: Save either works or says why.

      **Verification**:
      - RED first: the new `submits a product whose image has no alt text` test failed with `expected "vi.fn()" to be called 1 times, but got 0 times` — jsdom enforces `required` too, so the test reproduced the exact defect before the fix.
      - Command: `npx vitest run tests/components/admin/ProductForm.images.test.tsx tests/components/admin/ProductForm.alt-text.test.tsx tests/components/admin/product-popularity.test.tsx tests/lib/product-images.test.ts tests/lib/product-images.crop.test.ts` (in `packages/web`)
      - Result: PASS (5 files, 38 tests, 0 failing)
      - Build: `turbo run typecheck` PASS via the pre-commit gate (4 tasks successful)

      **Not done**: no browser check of the rendered warning, and the E2E fixtures from #652 still set `altText` so they exercise the happy path only. The unit tests cover the regression.
