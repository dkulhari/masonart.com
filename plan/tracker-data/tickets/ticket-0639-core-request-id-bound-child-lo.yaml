ticket_number: 639
title: Core - request id, bound child logger and pino redaction
description: |-
  ## Task
  Add `requestContext()` middleware: take `x-request-id`, else `cf-ray`, else generate one; set `requestId` and a bound child logger on the context; echo `x-request-id` on the response. Replace the ad-hoc log line in index.ts with one carrying requestId, actor id, client IP, status and duration. Add a `redact` config to the pino instance for cookie/authorization headers and password/token/otp/signature fields. Include the request id in 5xx error bodies so a support ticket carries the join key.

  ## Context
  Part of feature: admin-audit-log (Phase 2 - Core)
  Spec: docs/plans/2026-08-17-logging-and-auditing.md D9 and section 3.4
  Existing logger: packages/api/src/lib/logger.ts (createChildLogger already exists and is unused). Existing request log: packages/api/src/index.ts:93-102.
