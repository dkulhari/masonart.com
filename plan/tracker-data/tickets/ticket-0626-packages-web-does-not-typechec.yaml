    text: |-
      ✅ **Completed**

      **Commit**: `7f974443` — fix(web): drive the typecheck from 22 errors to zero

      **Result**: `npx tsc --noEmit -p packages/web` exits **0**.

      **Two clusters were live defects, not noise**

      1. **`StatsCardProps` never declared `onClick`.** The four filter tiles on `/admin/ai-moderation` passed it, React dropped it, and clicking them did nothing — and they are the only way to filter that queue. Now declared, and rendered as a real `<button>` rather than a div with a handler, so it is keyboard-reachable. Covered by a new 3-test file (`tests/components/admin/stats-card-click.test.tsx`), written RED first: it failed on `Unable to find an accessible element with the role "button"`.
      2. **Six `navigate({ to })` calls with no `search`** on routes that declare required search params. The pushed URL fails the target route's own `validateSearch`, and a throw there error-boundaries to a blank page rather than a message — the exact failure mode the vendors screen documents. Fixed by passing the shared `lib/admin-nav` defaults; added `ADMIN_ORDERS_SEARCH` beside the existing products/vendors/production constants, plus `tests/lib/admin-search-defaults.test.ts` proving each constant parses under the schema of the route it targets, including through `router.tsx`'s string round trip.

      **The rest**
      - Two `updateSearch` reducers typed `prev` as their own route's params; TanStack types that argument as the union of every route's params (all optional), so they never typechecked. Now merge onto `Route.useSearch()` — same value, already narrowed.
      - The admin guard read `context.session.user.role`, absent from Better Auth's inferred session type (it comes from `additionalFields`). Now narrows to the file's own `User` shape first, as the component in the same file already did.
      - Six unused imports/locals; one nullable behind an optional chain that did not cover the arithmetic.

      **Found mid-fix, not in the original ticket**: `RouterContext` in `__root.tsx` and two types in `gallery/index.tsx` were unexported while appearing in exported route signatures. With `composite: true` / `declaration: true` that is TS4023 on nearly every route — **130 further errors** that a stale `.tsbuildinfo` had been hiding, and that surfaced the moment an edit to a widely-imported module invalidated it. Exporting the three types cleared all of them. Worth knowing: the "22" was never the real number, and any future baseline claim should be made after a cache-invalidating run.

      **Verification**
      - Typecheck: `npx tsc --noEmit -p packages/web` → 0 errors (was 22, briefly 152 once the cache invalidated).
      - Tests: `npx vitest run tests` (full web unit suite, justified — this touched `__root.tsx`, `StatsCard` and two route search reducers) → **3264 passing**, 174 files.
      - 3 failures, **all pre-existing on HEAD in files this commit does not touch**, verified with `git show HEAD:<file>`: two storefront-token violations in the vendor portal (`vendor.tsx`, `vendor/jobs/$id.tsx` — banned `font-bold` / `bg-brand-*` classes, arrived with #621), and `wishlist-page.test.ts` asserting the source does not contain `beforeLoad` when the word appears in a comment. Neither is mine to fix here; both deserve a ticket.

      **Follow-up worth filing**: the typecheck should now become a gate (CI step or pre-commit), otherwise this ticket gets rewritten in three months. It is only worth gating now that the count is zero.
