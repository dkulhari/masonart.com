      // app/components/ui/SectionBand.tsx
      import { cn } from '~/lib/utils'

      const TONES = {
        plain: '',
        beige: 'bg-band',
        sand: 'bg-band-strong',
        ink: 'bg-foreground text-background',
      } as const

      export interface SectionBandProps
        extends React.HTMLAttributes<HTMLElement> {
        tone?: keyof typeof TONES
      }

      /** Full-bleed band with the standard rhythm. mesonart alternates white/beige. */
      export function SectionBand({ tone = 'plain', className, children, ...props }: SectionBandProps) {
        return (
          <section className={cn('py-16 sm:py-24', TONES[tone], className)} {...props}>
            <div className="container-wide">{children}</div>
          </section>
        )
      }

      // app/components/ui/DisplayHeading.tsx
      import { cn } from '~/lib/utils'

      export interface DisplayHeadingProps
        extends React.HTMLAttributes<HTMLHeadingElement> {
        as?: 'h1' | 'h2'
        children: string
      }

      /**
       * mesonart splits display headings into per-word spans and reveals them in
       * sequence. The whitespace between words is preserved so the accessible name
       * and copy-paste stay intact.
       */
      export function DisplayHeading({ as: Tag = 'h1', className, children, ...props }: DisplayHeadingProps) {
        const words = children.split(/(\s+)/)
        return (
          <Tag className={cn('font-heading font-light tracking-tight', className)} {...props}>
            {words.map((word, i) =>
              /^\s+$/.test(word) ? (
                word
              ) : (
                <span
                  key={i}
                  data-word
                  className="inline-block animate-word-reveal"
                  style={{ animationDelay: `${(i / 2) * 60}ms` }}
                >
                  {word}
                </span>
              )
            )}
          </Tag>
        )
      }

      /* tailwind.config.ts -> keyframes + animation */
      // 'word-reveal': { from: { opacity: '0', transform: 'translateY(0.4em)' }, to: { opacity: '1', transform: 'none' } }
      // 'word-reveal': 'word-reveal .5s cubic-bezier(.3,1,.3,1) both'

      /* globals.css — honour reduced motion */
      // @media (prefers-reduced-motion: reduce) {
      //   .animate-word-reveal { animation: none; opacity: 1; transform: none; }
      // }
