    text: |-
      ✅ **Completed**

      **Commit**: `825be54e` - feat(api): record where a courier collects from a vendor

      **Files Changed**:
      - `packages/api/src/database/schema/vendors.ts` — `shiprocketPickupLocation: text('shiprocket_pickup_location')`, nullable, no default, placed with the address block
      - `packages/api/src/database/migrations/0029_vendor_shiprocket_pickup.sql` — the additive ALTER
      - `packages/api/src/database/migrations/meta/{_journal.json,0029_snapshot.json}`
      - `packages/api/tests/database/vendor-shiprocket-pickup.test.ts` — 5 tests, drizzle object + migration text
      - `packages/api/tests/database/vendor-shiprocket-pickup-live.test.ts` — 3 tests, real Postgres

      **Two suites, not one.** Split the way `order-shipments-dispatch` is split from `order-shipments-live-label`. The object suite asserts the DSL and the migration text — including that the ALTER carries neither NOT NULL nor DEFAULT, since either turns an additive migration into a table rewrite. The live suite asserts what a database actually does: that the column is *there* (a generated-but-never-applied migration fails exactly there while the object suite stays green), and that `Chobii Warehouse #2 (Andheri East)` comes back byte for byte. Anything normalising inner spaces or case would produce a value matching nothing on Shiprocket's side, and it would fail at dispatch rather than at the screen where it was typed.

      **A guard earned its keep.** I hand-wrote the migration and the journal entry first. `production-transfers.test.ts > migration bookkeeping` failed with `missing snapshot for 0029_vendor_shiprocket_pickup` — a hand-written journal entry has no `meta/0029_snapshot.json`, and the next `db:generate` would have diffed against a stale chain. Backed it out (dropped the column, deleted the `__drizzle_migrations` row), regenerated through `drizzle-kit generate`, then renamed `0029_flaky_dragon_man` to the repo's descriptive convention and retagged the journal before applying. The generated statement was identical to the hand-written one; the snapshot was the whole difference.

      **On `''` as unset.** Not enforced with a CHECK constraint — no migration in this repo uses one, and the actual write path already handles it: `VendorForm.tsx`'s `orNull()` trims and maps `''` to null. #723 adds the zod half. The live suite pins that an unconfigured vendor reads `NULL`, not `''`, which is the #670 property that matters.

      **Exposure**: admin-only by construction. `src/routes/vendor.ts` never selects from `vendors`, so the column cannot reach the vendor portal.

      **Verification**:
      - Command: `bunx vitest run tests/database/vendor-shiprocket-pickup.test.ts tests/database/vendor-shiprocket-pickup-live.test.ts tests/database/production-transfers.test.ts tests/schema/vendors.test.ts tests/routes/admin/vendors.test.ts`
      - Result: PASS — **5 files, 92 tests passed, 0 failed**
      - Command: `bun run db:migrate` (dev DB, port 5440) → `migrations applied successfully!`
      - Command: `bun run typecheck` → 4 tasks successful, all three packages

      Unblocks #723.
