      ✅ **Completed**

      **Commit**: `35f7bd8b` - feat(api): hand a vendor the carrier label as bytes, never as fields

      **Files Changed**:
      - `packages/api/src/routes/vendor.ts` - `GET /jobs/:id/label`, `LABEL_URL_TTL_SECONDS = 300`, header R1/R2/R3 rationale. No db import added (zero-database-import invariant intact, asserted by jobs.test.ts:862 and transfers.test.ts:993).
      - `packages/api/src/lib/vendor-scope.ts` - comment only: the seam note said "nothing calls it yet (the route is #687)". Now records that the route turns the throw into a 500, deliberately not a 404, and that no fallback may substitute anything person-linked.
      - `packages/api/tests/routes/vendor/isolation.test.ts` - ROUTE_TABLE entry (`scope: 'label'`), Property 3's scope helpers hoisted to module scope, Property 4 grown a route half. 118 -> 138 tests.

      **Summary**:
      `{ jobId, url, expiresInSeconds, expiresAt }` and nothing else. R1 takes no exception — the PII is inside the PDF, never beside it. `getVendorJobLabelKey` runs FIRST; a `null` ends the request at the 404 before `getPresignedDownloadUrl` is reached. TTL 300s, read off artwork in the test rather than written down twice. Key is `fulfilment/labels/<token>.pdf`, identity-free by construction. `production_job.label_issued` written on success, after the URL exists, no `tx`.

      Property 4 additions: exactly four body keys; the label scope has exactly ONE door on the whole vendor surface; a customer planted in the shipment row reaches neither the JSON nor the audit row; a non-consolidator 404s with the presigner never called; a 500 from the presigner leaves no `label_issued` row. Plus a SOURCE SCAN over the handler — authorise before sign, audit after sign, no `tx` — because a handler that signs first and discards is invisible to every fixture.

      Deleted rather than kept green: a test that queued another vendor's token and expected a refusal. The recording db is blind to the WHERE, so it tested the mock. Replaced by an assertion on the predicate the route sends (both vendor columns bound to the caller).

      **Verification**:
      - Command: `bunx vitest run tests/routes/vendor/{isolation,artwork,jobs,photos,transfers}.test.ts tests/routes/admin/vendor-invite.test.ts tests/lib/{vendor-scope,audit-record}.test.ts`
      - Result: PASS (8 files, 363 tests passing)
      - Command: `bun run typecheck` (tsc --noEmit && tsc -p tsconfig.test.json --noEmit) -> clean
      - RED first: 16 failures before the route existed, all "route not registered".
      - Not vacuous — every new property shown going red on a planted mutation: sign-before-authorise (6 red, incl. the source scan), audit-before-sign (2), TTL 900 (1), `orderId` in the body (3). The plant guard and the ordering comparator carry their own not-vacuous tests.

      **Out of scope, untouched**: `routes/admin/*`; `order_shipments.label_object_token` (order-dispatch-tracking); the three `packages/web/tests/routes/vendor/*` suites (Phase 6, the label handover card does not exist yet).
