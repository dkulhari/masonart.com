ticket_number: 630
title: Deduplicate test scaffolding and shared UI blocks across api and web packages
description: |-
  Remove the remaining duplications found by the DRYwall/jscpd scan on 2026-08-17. The two pure app-code clones are handled in the sibling ticket; this ticket covers the copied test harnesses plus two shared-UI clones.

  Scan baseline: 389 clones, 9,171 duplicated lines, 3.47% of 264,475 lines across `packages/**` (TS/TSX; generated drizzle migration snapshots and the mirrored `.claude`/`.agents`/`.gemini` skill docs were excluded as noise).

  ## Test scaffolding clones

  1. **Cache-purge harness — 150 lines**
     `packages/api/tests/routes/admin/product-cache-purge.test.ts:47-196`
     `packages/api/tests/routes/admin/promotion-cache-purge.test.ts:36-187`
     The whole harness (Hono app setup, `HTTPException` handling, drizzle mocks) is copied.
     Extract to `packages/api/tests/helpers/cache-purge-harness.ts`.

  2. **Drizzle query recorder — 88 + 66 lines**
     `packages/api/tests/routes/admin/vendor-rates.test.ts:37-124`
     `packages/api/tests/routes/admin/vendors.test.ts:38-125`
     `packages/api/tests/routes/admin/production-jobs.test.ts:81-146`
     `packages/api/tests/routes/vendor/jobs.test.ts:67-132`
     The same `RecordedQuery` interface and chainable query-builder mock (`from`/`leftJoin`/`innerJoin`/`groupBy`/…) appears in all four.
     Extract to `packages/api/tests/helpers/query-recorder.ts`.

  3. **Select-queue helper — 46 + 45 lines**
     `packages/api/tests/routes/review-card-shape.test.ts:31-76` and `:191-235`
     `packages/api/tests/routes/review-feed.test.ts:25-71` and `:134-178`
     Duplicated import block and the `queueSelects(...)` helper ("queue one result array per `db.select()` call, in call order").
     Extract to `packages/api/tests/helpers/select-queue.ts`.

  4. **Vendor portal session fixture — 51 lines**
     `packages/api/tests/routes/vendor/artwork.test.ts:176-226`
     `packages/api/tests/routes/vendor/jobs.test.ts:159-210`
     Identical `sessionFor(role, id)` builder.
     Extract to `packages/api/tests/helpers/vendor-session.ts` (can live beside the query recorder).

  5. **Gift-card afterEach teardown — 46 lines**
     `packages/api/tests/routes/gift-card-payment.test.ts:89-134`
     `packages/api/tests/routes/gift-card-release.test.ts:95-140`
     Same Razorpay mock reset and cleanup block.
     Extract to a shared teardown helper.

  6. **TanStack router mock — 56 lines**
     `packages/web/tests/routes/admin/dashboard-order-stats.test.tsx:14-69`
     `packages/web/tests/routes/admin/dashboard-product-stats.test.tsx:15-73`
     Same `vi.mock('@tanstack/react-router', ...)` block.
     Extract to `packages/web/tests/helpers/router-mock.tsx`.

  7. **Review fixtures — 55 lines**
     `packages/web/tests/components/reviews/ReviewGrid.test.tsx:43-97`
     `packages/web/tests/routes/posters-review-section.test.tsx:52-108`
     Duplicated `ReviewCardData` fixture block.
     Extract to `packages/web/tests/fixtures/reviews.ts`.

  8. **Admin route test harness — 52 lines**
     `packages/api/tests/routes/admin/collection-membership.test.ts:12-63`
     `packages/api/tests/routes/admin/frames.test.ts:17-67`
     Same `selectMock`/`insertMock`/`updateMock` scaffolding. Fold into the shared helper from item 2 if the shapes line up.

  ## Shared UI clones

  9. **Paginated list block — 98 lines**
     `packages/web/app/routes/_authed/account/ai-creations.tsx:554-651`
     `packages/web/app/routes/_authed/account/orders.index.tsx:328-424`
     Same loading/error/empty handling plus the `<Pagination>` wiring.
     Extract a `<PaginatedList>` component (or a `usePaginatedList` hook if the rendering diverges too much).

  10. **Admin table pagination controls — 54 lines**
      `packages/web/app/components/admin/OrdersTable.tsx:675-728`
      `packages/web/app/components/admin/ProductsTable.tsx:698-751`
      Identical TanStack Table pagination control markup.
      Extract `<TablePagination table={table} />` into `packages/web/app/components/admin/`.

  ## Acceptance criteria

  - Each listed clone pair is replaced by a single shared helper, fixture, or component.
  - Extracted test helpers live under a `tests/helpers/` or `tests/fixtures/` directory in their own package — do not cross the api/web package boundary.
  - No test behaviour changes: the same assertions run, and every touched suite still passes.
  - Shared UI extractions are behaviour-preserving; the account pages and admin tables look and act the same.
  - Re-running the scan shows these clone pairs gone and total duplication meaningfully below the 3.47% baseline.

  ## Notes

  - Prefer doing this in small commits, one clone group at a time — a single sweeping commit is hard to review and risks silently changing a mock's behaviour.
  - Watch for near-identical-but-not-identical mocks: parameterize rather than forcing one call site to change its expectations.

  ## Verification

  Run the touched suites per group rather than the whole tree, e.g.:

  ```
  bunx vitest run packages/api/tests/routes/admin
  bunx vitest run packages/api/tests/routes/vendor
  bunx vitest run packages/api/tests/routes/review-card-shape.test.ts packages/api/tests/routes/review-feed.test.ts
  bunx vitest run packages/web/tests/routes/admin
  bunx vitest run packages/web/tests/components/reviews
  ```

  Then re-run the duplication scan scoped the same way as the baseline:

  ```
  npx jscpd@5.0.12 packages \
    --format typescript,tsx,javascript,jsx \
    --ignore '**/node_modules/**,**/migrations/**,**/dist/**,**/build/**,**/.turbo/**,**/*.d.ts' \
    --min-lines 15
  ```
