      ✅ **Completed**

      **Commits** (one per clone group, oldest first):
      - `e4c65513` test(api): extract the shared cache-purge harness
      - `1ba34407` test(api): share the recording drizzle mock and the admin route harness
      - `dceade0a` test(api): share the reviews select-queue recorder
      - `45a572a6` test(api): share the vendor session fixture and the gift-card teardown
      - `dc9f68c6` test(web): share the router mock, dashboard fetch stub and review fixtures
      - `2c9c2ba4` refactor(web): extract TablePagination from the admin tables
      - `5604418f` refactor(web): extract the account Pagination component
      - `e59d232b` test(api): share the admin session fixture and the route-app builder

      **New shared files**:
      - `packages/api/tests/helpers/cache-purge-harness.ts` — in-memory Redis fake + cache-purge caller session (item 1)
      - `packages/api/tests/helpers/query-recorder.ts` — RecordedQuery + chainable drizzle mock, with transaction bookkeeping, injectable failures and a `rows: 'repeatLast'` queue (item 2)
      - `packages/api/tests/helpers/admin-route-harness.ts` — `chainReturning`, header-driven auth middleware, `requestAs` (item 8)
      - `packages/api/tests/helpers/select-queue.ts` — recording `db.select()` for the reviews reads (item 3)
      - `packages/api/tests/helpers/vendor-session.ts` — portal caller (item 4)
      - `packages/api/tests/helpers/gift-card-fixtures.ts` — Razorpay reset + children-first row purge (item 5)
      - `packages/api/tests/helpers/admin-session.ts`, `route-app.ts` — admin caller and the one Hono mount with the `HTTPException` passthrough (follow-on: four helpers had grown their own copy)
      - `packages/web/tests/helpers/router-mock.tsx` — TanStack router stand-in (item 6)
      - `packages/web/tests/helpers/admin-dashboard-fetch.ts` — URL-routed fetch stub + stats fixtures
      - `packages/web/tests/fixtures/reviews.ts` — ReviewCardData fixtures + page envelope (item 7)
      - `packages/web/app/components/ui/Pagination.tsx` — account pagination (item 9)
      - `packages/web/app/components/admin/TablePagination.tsx` — admin table pagination (item 10)

      **Notes on judgement calls**:
      - Items 2 and 8 were NOT forced into one shape. `frames`/`collection-membership` mock `db` with plain `vi.fn()`s, not a recording builder — a shared helper would have had to change what those suites assert. They got their own harness.
      - `ai-creations` kept its purple active-page colour through an `activeClassName` prop rather than being silently moved onto the primary token, so the extraction is behaviour-preserving as required.
      - Every `vi.mock` factory that needs a helper uses `await vi.hoisted(async () => await import(...))` or an async factory — a plain top-level import would die in the temporal dead zone under `vi.mock` hoisting.

      **Verification**:
      - Command: `DATABASE_URL='postgresql://poster_app:dev_password@localhost:5440/poster_app_dev' bunx vitest run <13 touched api specs>`
      - Result: PASS — 13 files, 252 tests, 0 failing. Identical to the pre-refactor baseline (252 passing).
      - Command: `bunx vitest run <7 touched web specs + tests/styles/>`
      - Result: PASS — 10 files, 101 tests, 0 failing.
      - Command: `bun run typecheck` (turbo, all 3 packages) — PASS, gated on every commit by the pre-commit hook.

      **Duplication scan** (`npx jscpd@5.0.12 packages --format typescript,tsx,javascript,jsx --min-lines 15`, same ignores as the baseline):

      | | clones | duplicated lines | % |
      |---|---|---|---|
      | baseline | 389 | 9,171 | 3.47% |
      | now | 361 | 7,746 | **2.93%** |

      All ten named clone pairs are gone from the report. What remains in those files is different, smaller regions — the largest survivors are a wider gift-card fixture family spanning eight suites (`admin-gift-card-refund`, `gift-card-quote`, `gift-card-purchase`, `services/gift-card-*`) and other regions of `OrdersTable`/`ProductsTable` (column defs, toolbar, skeleton), none of which were in this ticket's scope.

      **Baseline gotcha for whoever runs these next**: the four live-DB suites here need `DATABASE_URL='postgresql://poster_app:dev_password@localhost:5440/poster_app_dev'`. Without it they fail against `:5433`, which is a different project's Postgres.
