ticket_number: 515
title: Service - issue a gift card and write its ledger row
description: |-
  ## Task
  New `packages/api/src/services/gift-card.ts` with `issueGiftCard()`, modelled on `services/wallet.ts`.

  One database transaction inserts the `gift_card` row and its opening `issue` ledger entry. A card whose balance has no matching ledger row is unauditable, so the two can never be written separately.

  Returns the plaintext code **once**, to its caller. It is never persisted and never returned again — the caller is responsible for putting it in the delivery email or showing it to the admin who issued it.

  ## Two callers, one function
  - customer purchase: `purchaseOrderId` set, `issuedByUserId` null
  - admin issuance: `issuedByUserId` set, `purchaseOrderId` null

  ## Context
  Part of feature: gift-cards
  Phase: 2 — Code and service
  Design: `docs/superpowers/specs/2026-08-06-gift-cards-design.md` §4, §9

  Collision on `codeHash` is astronomically unlikely at 2^80 but the unique index is authoritative: retry generation on a unique-violation rather than pre-checking, which would race.
