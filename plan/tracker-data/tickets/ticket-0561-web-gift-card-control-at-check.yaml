ticket_number: 561
title: Web - gift card control at checkout and the amount-due line
description: |-
  ## Task
  In `packages/web/app/components/checkout/OrderSummary.tsx`: a gift card code input, the list of applied cards with a remove action, and an **Amount due** line showing total minus gift cards.

  Applying a code calls the quote endpoint (#gc-11) and shows what it would cover. The codes are sent with payment initiation (#gc-12), which is where the debit actually happens.

  ## Its own control, not the coupon box
  `OrderSummary.tsx:201` already contains a complete coupon input that never renders, because no caller passes `onApplyCoupon`. Leave it dormant. There are no coupon codes in this system (sale-promotions D1), so labelling one box for both would promise something that does not exist.

  ## Show the tender as tender
  Gift cards must not appear in the discount rows. The line reads as a payment against the total, below tax — the same place it sits in the money path. A customer who sees it as a discount will expect it to change the price on the invoice.

  When cards cover the whole total, the pay button says so and the flow skips the payment gateway.

  ## Context
  Part of feature: gift-cards
  Phase: 7 — Storefront
  Design: `docs/superpowers/specs/2026-08-06-gift-cards-design.md` §7, §10
