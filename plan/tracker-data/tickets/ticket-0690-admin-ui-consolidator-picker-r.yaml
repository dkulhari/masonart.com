    text: |-
      **Implementation steps** (derived — the ticket carries no YAML steps)

      1. RED — `fetchOrderProductionJobs` makes exactly ONE `GET /api/admin/production?orderId=` request and never pages.
      2. GREEN — rewrite data access; delete `MAX_SCAN_PAGES`, `SCAN_PAGE_SIZE`, `OrderProductionScan.truncated`, the `truncated` prop and the `admin-order-production-truncated` branch, plus the two tests that cover them.
      3. RED — readiness: every `LabelBlockerCode` renders a distinct, actionable explanation; a failed read renders an error and never "ready"; `ready` only over a successful read.
      4. GREEN — `OrderReadinessPanel` + `BLOCKER_ACTIONS` keyed by code, with a fallback for a code the API adds later.
      5. RED — consolidator picker: system default vs admin confirmed visibly distinguishable; 409 `TRANSFER_DISPATCHED` explained rather than swallowed; 422 `CONFIRMATION_REQUIRED` / `NOTHING_TO_PROPOSE` explained.
      6. GREEN — `ConsolidatorPicker`, `setOrderConsolidator`, and provenance.
         **Note on provenance**: no GET exposes `order_consolidation.decided_by` — `production-readiness` returns only `consolidatorVendorId`, and #682 added no read route. The panel therefore reads the newest successful `order.consolidator_set` row from `GET /api/admin/audit-log?entityType=order&entityId=…`, whose `metadata.decision` is exactly `system_default` / `admin_confirmed`. When that read fails or finds nothing, the panel says the provenance is unknown rather than assuming either.
      7. RED/GREEN — transfers on the order from `GET /api/admin/transfers?orderId=`: list, empty, error, and the four derived states.
      8. Verify by path (`packages/web/tests/routes/admin/order-production-panel.test.tsx`), typecheck, commit.

      `unassignedOrderItems` survives the rewrite unchanged — it is still the only surface where an order item on no job at all appears.
