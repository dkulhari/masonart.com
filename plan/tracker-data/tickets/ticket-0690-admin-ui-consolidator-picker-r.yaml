    timestamp: '2026-08-30T18:40:30.197Z'
    text: |-
      ✅ **Completed**

      **Commit**: `cf16ee00` — feat(web): give the order panel a consolidator, its blockers and its parcels

      **Files Changed**:
      - `packages/web/app/routes/admin/production/OrderProductionPanel.tsx` — the scan deleted, the three new sections added
      - `packages/web/tests/routes/admin/order-production-panel.test.tsx` — truncation cases deleted, 39 tests added (16 → 55)

      Neither sibling file (`index.tsx` #688, `$id.tsx` #689) was touched; only these two paths were staged.

      **What was deleted, and why that is the ticket**
      `MAX_SCAN_PAGES`, `SCAN_PAGE_SIZE`, `OrderProductionScan.truncated`, the `truncated` prop and the whole `admin-order-production-truncated` branch, plus the two tests over them. `scanOrderProductionJobs` became `fetchOrderProductionJobs`: **one** `GET /api/admin/production?orderId=` request, no page loop. The guard's reason for existing went with #682.

      What did **not** go is the reason it existed. A single page can still be too small, so `total > items.length` throws rather than quietly returning a short list — an error the admin can see, at three lines instead of a page loop. Each of the four reads backing the panel drops its data **with** its error, so no stale answer ever sits under a failure banner.

      **The new surface**
      - **Consolidator picker** — `POST /api/admin/orders/:orderId/consolidator`, with a `<select>` and a button; no native dialogs (the `admin-native-dialogs` source guard passes). Options are only the vendors holding a live job on the order, since a consolidator holding none is itself a blocker. A 409 `TRANSFER_DISPATCHED` is rendered with the API's own sentence **and** the next step (declare the parcel lost; re-routing is a call to the carrier), as are the 422s.
      - **Provenance** — no GET exposes `order_consolidation.decided_by`; `production-readiness` returns the vendor id alone. So the panel reads the newest successful `order.consolidator_set` row from `GET /api/admin/audit-log`, whose `metadata.decision` is exactly `system_default` / `admin_confirmed`. A read that fails or finds no recognised decision renders **unknown**, never an assumed default — guessing "the system chose" off a missing actor would invent the claim the column exists to make checkable.
      - **Readiness** — the blocker LIST, never a bare "not ready". All nine codes carry a distinct next step (`BLOCKER_ACTIONS`), an unknown future code still renders its message, and a failed read renders an error that says *"unknown is not the same as ready"* and cannot fall through to the ready branch even when a previous successful readiness is still in hand.
      - **Transfers** — `GET /api/admin/transfers?orderId=`: both ends of the leg, the state derived from its timestamps, carrier and docket, and the note on a lost parcel. A failed read never reads as an order with no transfers.
      - `unassignedOrderItems` is byte-for-byte unchanged, and all four of its tests still pass.

      **Verification**
      - Command: `cd packages/web && npx vitest run tests/routes/admin/order-production-panel.test.tsx`
      - Result: PASS (55 tests, 55 passing, 0 failing — 39 new, 2 deleted)
      - Also PASS: `npx vitest run tests/routes/admin/admin-native-dialogs.test.tsx` (5 passing — the source guard over `app/routes/admin`)
      - Build: the pre-commit gate ran `bun run typecheck` on the commit itself — **4/4 tasks successful** (shared, api src + api tests, web)

      **Mutation-checked, not just run.** The readiness/consolidator/transfer components were written before their tests, so red was proven by mutation instead of by ordering — a stronger check. All ten mutations were killed:

      | Mutation | Tests turned red |
      |---|---|
      | readiness renders the verdict before the error check | 1 |
      | readiness renders "not ready" with no blocker list | 2 |
      | `blockerAction` returns one string for every code | 3 |
      | provenance assumes `system_default` when nothing says so | 1 |
      | both provenances render the same sentence | 1 |
      | the consolidator refusal is swallowed | 2 |
      | the `orderId` filter is dropped and the queue paged again | 1 |
      | a short page is returned silently instead of refused | 1 |
      | a cancelled job's vendor is offered in the picker | 1 |
      | the transfers error branch is dropped | 1 |
