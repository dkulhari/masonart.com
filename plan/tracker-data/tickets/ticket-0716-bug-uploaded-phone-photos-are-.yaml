    text: |-
      ## Possible interaction with #545's orientation guard — worth checking during the fix

      #545 ("Product orientation column contradicts the artwork for 6 of 14 collection representatives") was closed on 2026-08-13. It listed three suspects for why the column disagreed with the pixels — seed data, an import, or a derivation that never ran. **EXIF orientation is a fourth that nobody listed.**

      It was resolved by adding a rule plus a guard rather than by finding a systemic root cause:

      - `packages/shared/src/constants/orientation.ts` — the orientation rule
      - `packages/api/src/routes/admin/products.ts` — a guard that refuses a declared orientation contradicting the measured art box, with `orientationOverride` as the escape hatch
      - two corrected seed values, each with its measurement
      - `packages/api/src/database/backfill-art-box.ts` — audits the column against that second opinion

      That guard is the interaction worth checking, and it is more concerning than the root-cause question.

      ### The dependency chain

      ```
      upload -> buildProductMedia() -> measureArtBox()  [no autoOrient]
             -> artBox -> orientation guard -> accept / 400
      ```

      `measureArtBox` reads the pixels. This ticket is that it reads them in the **stored** orientation. So for any image carrying an orientation tag, the art box is measured on a rotated rectangle — and the guard's verdict is computed from it.

      The consequence is not just a wrong column. It is that the guard added specifically to catch this class of drift **can produce the wrong verdict on exactly the inputs it was built to police**: a portrait photograph stored landscape measures landscape, so a correct `portrait` declaration gets refused with a 400, and a wrong `landscape` one is accepted. `backfill-art-box.ts` audits against the same measurement, so it would agree with the wrong answer rather than catch it.

      An admin hitting the refusal has one obvious move — set `orientationOverride` — which silently writes the value the guard was protecting against.

      ### Not a claim, a thing to verify

      I have not confirmed that any real catalogue image is affected, and #545's own symptom looks adequately explained by `measureArtBox` not peeling a wall off until #594 (see the comment at `packages/api/src/database/seed.ts:172`). The seeded catalogue is also unlikely to carry orientation tags, since it came from stock and reference sources rather than phones.

      Two concrete things to do while fixing this ticket:

      1. **Add a guard test with an EXIF-tagged fixture.** `packages/api/tests/routes/admin/product-orientation-guard.test.ts` has 11 cases; none of them use a tagged image. That is the gap that would let this recur.
      2. **Re-run `backfill-art-box.ts` after the fix** and diff the results. Any product whose `artBox` changes was measured wrong, and its `orientation` column should be re-derived rather than trusted.

      If orientation values drift again after this ticket lands, this chain is the first place to look.
