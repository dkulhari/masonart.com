      - Result: PASS (29 files, 803 tests, 0 failing)
      - Pre-fix evidence: the same new suite ran 8 failed / 1 passed — the one pass being the fixture's own sanity check that it really carries `orientation: 6`
      - Build: `bun run typecheck` PASS (turbo, 3 packages, includes `tsconfig.test.json`) — ran as the pre-commit gate
