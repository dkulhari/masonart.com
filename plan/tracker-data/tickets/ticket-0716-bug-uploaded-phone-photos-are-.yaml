      ✅ **Completed**

      **Commit**: `9481d8f2` — fix(api): mat and crop the photo the admin saw, not the one on disk

      **Files Changed**:
      - `packages/api/src/lib/image-processing.ts` — new private `autoOriented()`; called at the entry of `processImage`, `convertToWebP`, `getImageMetadata`, `matToSquare`, `measureArtBox` and `cropToSquare`
      - `packages/api/tests/lib/image-processing-orientation.test.ts` — new, 9 cases
      - `packages/api/tests/lib/product-media.test.ts` — one case added at the `buildProductMedia` seam

      **Summary**:

      `autoOriented()` materialises the displayed rectangle before anything measures it. Materialised rather than chained, which is the subtlety the ticket named: `sharp(x).metadata()` reports the input's stored dimensions, so an `.autoOrient()` further along the same pipeline does not correct a read taken earlier.

      An untagged source — `orientation` absent or 1 — is returned untouched rather than re-encoded, so the catalogue path costs one metadata read and no lossy round-trip. A source sharp cannot read is also returned untouched; every caller already has its own fallback and an unreadable asset must never fail an upload.

      `processImage` now generates the whole variant ladder from the oriented buffer, not just the original.

      **On the two things the #545 comment asked for**

      1. *Tagged fixture against the guard.* Placed at `buildProductMedia`, not in `product-orientation-guard.test.ts`. That suite feeds the route an `artBox` in the request payload, so a tagged image never reaches the code under test there — it would have proved nothing. `buildProductMedia` is where `measureArtBox` actually runs and where the guard's input is produced, so that is where the gap was. Confirmed non-vacuous: reverted `image-processing.ts` to HEAD and the new case failed, restored and it passed.

      2. *Re-ran `backfill-art-box.ts`.* Read-only, `--dry-run --force`, so every stored box was re-measured with the fix rather than skipped:

      ```
      [dry run] products touched 41/41 | images scanned 163, measured 41, skipped 122, failed 0
      Every orientation agrees with its artwork.
      ```

      Nothing was written. **No catalogue image is affected** — consistent with the comment's own expectation that the seeded catalogue came from stock and reference sources rather than phones. No `orientation` column needs re-deriving.

      **Verification**:
