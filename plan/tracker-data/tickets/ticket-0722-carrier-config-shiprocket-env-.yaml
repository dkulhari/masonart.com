    text: |-
      ✅ **Completed**

      **Commit**: `377a1597` - feat(api): make "Shiprocket is not configured" a state, not a crash

      **Files Changed**:
      - `packages/api/src/services/shiprocket.ts` — new. `isShiprocketConfigured`, `getShiprocketConfig`, `assertShiprocketConfigured`, `ShiprocketError`, `ShiprocketNotConfiguredError`, `SHIPROCKET_ENV_VARS`
      - `packages/api/tests/services/shiprocket-config.test.ts` — 15 tests
      - `.env.example` — a Shiprocket section, placed before Gift Cards

      **No client, by design.** Auth, serviceability, AWB assignment, label PDFs and pickup scheduling are phase 6 and every one is gated on credentials nobody has. What phase 5 can deliver is the refusal, and it is worth delivering first.

      **The seam held.** Under `services/`, not `lib/` — `production-readiness.ts:910` declares `PRODUCTION_LIB_FORBIDDEN_IMPORT = 'shiprocket'` and the reverse scan names `../services/shiprocket` in its own fixtures. Ran `production-seam.test.ts` with `--reporter=verbose` rather than reading a total: all 16 named tests executed, including `finds no carrier import under lib/production-*` (28ms — it really walked the tree) and all six CAN-fail cases.

      **Env is read per call, and that is a deliberate departure from `lib/razorpay.ts`.** Razorpay reads credentials into module-level `const`s at import time, which freezes configuration before any test can set it — which is why `isRazorpayConfigured` has no test that observes it returning both values. The unconfigured path is the only path that exists today, so it had to be the reachable one. `isShiprocketConfigured()` is now asserted false, true, and false-on-half-set within a single run.

      **Blank is absent.** A present-but-empty key is the failure mode that looks configured and is not — the same property #670 pinned one layer down, where an empty string satisfying `IS NOT NULL` let a blank tracking number count as a label. Pinned here with `SHIPROCKET_PASSWORD='   '`.

      **The refusal names variables, never values.** Tested on the half-set path specifically, because that is the one where a credential exists to leak into a log line or a response body. Same rule `routes/vendor.ts:559` follows.

      **`.env.example` is held to the module.** `SHIPROCKET_ENV_VARS` is exported and a test asserts every entry has a documented line, so a variable added later without documentation fails the suite instead of surprising whoever deploys. A second test refuses a real-looking login in the example.

      **Verification**:
      - Command: `bunx vitest run tests/services/shiprocket-config.test.ts` → PASS, **15 tests**
      - Command: `bunx vitest run tests/lib/production-seam.test.ts --reporter=verbose` → PASS, **16 tests**, each named in the output
      - Command: `bunx vitest run tests/setup/env.test.ts` → PASS, 61 passed / 3 skipped (the other reader of `.env.example`)
      - Command: `bun run typecheck` → 4 tasks successful, all three packages
