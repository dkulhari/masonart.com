title: Web - /admin/audit-log viewer with filters and a before/after drawer
description: |-
  ## Task
  Add the admin viewer route: filter bar (category, action, actor, date range, free text), a table (time, actor, action, entity, outcome), and a detail drawer rendering the before/after diff. Link it from the admin nav.

  ## Context
  Part of feature: admin-audit-log (Phase 6 - Read)
  Spec: docs/plans/2026-08-17-logging-and-auditing.md section 3.7
  CRITICAL: router.tsx overrides TanStack search serialisation, so `validateSearch` must coerce numbers and split comma-joined arrays or the route error-boundaries to a blank page. Reuse the shared query schema.
  All client-side fetches go through app/lib/api.ts getApiUrl() - a relative '/api' fetch 404s in dev (no Vite proxy).
  Reuse the extracted TablePagination component rather than a new pager.
