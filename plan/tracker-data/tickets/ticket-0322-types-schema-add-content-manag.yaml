title: Types & Schema - Add content-manager to role enums and migration
description: |-
  ## Task
  Add `content-manager` as a new role value in ALL FOUR role definitions, then generate/apply the Drizzle migration (Postgres `ALTER TYPE "user_role" ADD VALUE`).

  ## Context
  Part of feature: content-manager-role
  Phase: Types & Database Schema

  Role definitions live in 4 places that must stay in sync:
  1. `packages/api/src/database/schema/users.ts:56` — `userRoleEnum` pgEnum
  2. `packages/api/src/auth/index.ts:328` — `UserRole` TS union
  3. `packages/shared/src/types/user.ts:15` — shared `UserRole` TS union
  4. `packages/shared/src/schemas/user.ts:17` — `UserRoleSchema` Zod enum (NOTE: this one is already missing `super-admin` — fix that too)

  Insert `content-manager` between `trade` and `admin` to reflect hierarchy position. Postgres enum ADD VALUE is non-reversible — accepted in design.
