    timestamp: '2026-08-30T19:18:31.527Z'
    text: |-
      ✅ **Completed**

      **Commit**: `2bdacf65` — feat(web): rebuild the vendor portal's job actions from the transition matrix (branch `feature/production-pipeline-design`)

      **Files Changed**:
      - `packages/web/app/lib/vendor-nav.ts` — `VENDOR_JOB_STATUSES` is now the closure of `@chobii/shared`'s matrix from `assigned`, in enum order; `draft` and `sent` fall out by construction. New: `vendorStatusLabel` / `vendorStatusStyle` (humanised fallback + `VENDOR_UNKNOWN_STATUS_STYLE`), `nextVendorActions(status, guards)`, `vendorNoActionReason(status)`, `VendorJobAction`, `VendorGuardState`. Relabelled: `received` = "In production", `qc_submitted` = "Sent for approval", `qc_failed` = "Changes needed", `qc_passed` = "Approved — ready to ship", `dispatched` = "Handed over".
      - `packages/web/app/routes/vendor/index.tsx` — pill reads the fallback helpers; the wire type is `ProductionJobStatus` (rows still carry `sent`); the filter's options and `z.enum` are the derived tuple.
      - `packages/web/app/routes/vendor/jobs/$id.tsx` — new exported `VendorJobActions` renders `nextVendorActions(status, guards)`; "Mark ready & sent back" and the "Sent back to us" line deleted; `patchVendorJobStatus` typed `VendorJobStatus` and sends `{ status }` only (no browser-clock dates); `actionError` kept apart from the page error so a 409 no longer blanks a good read (#684).
      - `packages/web/tests/routes/vendor/vendor-screens.test.tsx` — the block driving `vendor-job-mark-sent` rewritten; new suites written against the matrix rather than a restated list.

      **Summary**:
      The file was the second copy of the state machine the relocation was meant to eliminate. Every action and every status now derives from `@chobii/shared/schemas/production-transitions`, following `routes/admin/production/{index,$id}.tsx`. A vendor is never offered `qc_passed`, `qc_failed` or `cancelled` because those edges name `admin` in the matrix, not because this file subtracts them.

      `sent` decision: unreachable and unfilterable (the closure never touches a status with no in-edges) but still **renderable**. Retirement is a statement about transitions, not a drop of the pgEnum value, and `db:retire-sent-status` has not run against production data — so `VENDOR_JOB_STATUS_LABELS` is keyed partially, exactly as the admin queue's is, and any unknown status humanises into a neutral dashed pill. An empty badge reads as a rendering fault (#696); a one-off `sent:` entry would fix today's row and leave the next enum value just as blank.

      `guards` is the seam #692 (`shot-list-complete`) and #693 (`open-transfer-or-order-label`) fill in. Absent means unknown, and unknown does not disable a legal move — the API is the authority.

      **Verification**:
      - Command: `bunx vitest run tests/routes/vendor/{vendor-screens,no-customer-data,layout-guard}.test.tsx` (cwd `packages/web`)
      - Result: PASS — 3 files, **103 tests passing, 0 failing** (vendor-screens 81, up from 46)
      - Command: `bun run typecheck` → 4/4 tasks successful (pre-commit hook re-ran it clean)

      **Mutation check — 10 mutations, every one red** (assertions proven able to fail):
      | # | Mutation | Red |
      |---|---|---|
      | M1 | closure seeded from `draft` instead of `assigned` | 4 |
      | M2 | `sent: 'Sent back'` restored to the labels | 4 |
      | M3 | actions read `nextStatuses(status, 'admin')` | 13 |
      | M4 | an *unknown* guard blocks the button | 2 |
      | M5 | `qc_submitted` dropped from the labels | 1 |
      | M6 | humanised fallback removed, index blind | 2 |
      | M7 | deleted `vendor-job-mark-sent` control re-added | 19 |
      | M8 | actionless sentence replaced by an empty strip | 4 |
      | M9 | a failed write routed into the page error | 1 |
      | M10 | pill indexed blind, no fallback | 27 |

      **Note for whoever owns the E2E suite**: `tests/e2e/admin-vendor-lifecycle.spec.ts:419-421` drives `vendor-job-mark-sent`. It was already stale against head before this ticket — line 435 asserts `admin-production-status` has value `'sent'`, and that `<select>` was replaced by `TransitionPanel` in #684. Out of this ticket's named files and left untouched.
