    text: |-
      ✅ **Completed**

      **Commits**: `860f107e` - fix(web): count active filters in one place, so the drawer agrees too. The derivation, its tests and the route wiring were swept into `35c48d4a` (#454's chips move) — same working tree, two sessions running at once.

      **Files Changed**:
      - `packages/web/app/lib/activeFilters.ts` — new; `buildActiveFilterTags()` and `countActiveFilters()`, both derived from `FACET_GROUPS`
      - `packages/web/app/routes/posters/index.tsx` — badge, chip builder and `removeFilter` all read the helper; `ActiveFilterKey` replaces `keyof FilterState` so price can be one chip over two bounds
      - `packages/web/app/components/product/ProductFilters.tsx` — the drawer's own sum, the third copy, now reads the same helper
      - `packages/web/tests/lib/activeFilters.test.ts` — new; 20 cases, parametrised over the vocabulary
      - `tests/e2e/product-listing.spec.ts` — the `fixme` comes off, plus a case for one of the five #415 facets

      **Summary**:

      Not "add the six missing fields" — there were **three** hand-written lists (route badge, drawer badge, chip builder) and all three disagreed. One derivation from `FACET_GROUPS` now feeds all of them, so the count is *defined* as the number of chips. Add an eleventh facet group to `@chobii/shared` and the chips, the badge and their tests follow it; that is what stops this recurring.

      Two judgement calls worth recording:

      - **Price counts once, not twice.** The old sum added `priceMin` and `priceMax` separately, so a range read as two active filters. It is one filter with two bounds, and it now gets one chip that clears both.
      - **`=== true`, not `!== undefined`.** The old test chipped "Featured" for `?isFeatured=false` — the URL can carry an explicit false, and a chip claiming the opposite of the filter is worse than no chip.

      The helper's tests are parametrised over `FACET_GROUPS` rather than a fixed key list, for the same reason the bug happened: a hardcoded list of ten is a list that will be nine again.

      **Verification**:
      - Command: `bunx vitest run tests/lib/activeFilters.test.ts` → PASS, 20 tests
      - Command: `bunx playwright test tests/e2e/product-listing.spec.ts --project=chromium --no-deps --workers=2` → PASS, 113 expected, 0 unexpected, 1 skipped (that one is #452's `fixme`, still blocked)
      - Two of those 113 are new: the isFeatured chip that was `fixme` against this ticket, and `?vibe=tranquility-and-zen` covering the five facets #415 added
      - Typecheck: 23 errors, unchanged count, none in the files this touched
      - Full `bunx vitest run` shows 6 failures in `ProductCard.test.tsx` — that is the parallel session's in-flight #420 `ChooseOptions` work, untracked in the tree. The file passes 22/22 when run alone.
