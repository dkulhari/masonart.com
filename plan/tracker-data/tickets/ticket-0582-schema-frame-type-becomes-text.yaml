    action: commit
    description: Commit
    command: git add packages/api/src/database packages/api/tests/database/frames-schema.test.ts && git commit
    status: done
    code: |-
      feat(db): a frame's type is a slug it owns, and its rung is a column

      The frame_type enum had ten values, seven in use and three named for woods
      nobody stocks. That was survivable while frames were seeded in code; it is a
      ceiling the moment an admin can create one. `type` becomes text with a unique
      index — unique because the storefront's swatch colour fallback is keyed on it.

      `category` is new and stays an enum, because unlike type it is genuinely
      closed: it is the three rungs the frame panel renders as Rolled
      Canvas/Frameless/Framed. FrameSelector inferred that rung from the type
      string, which lands an admin-created moulding in the right group by accident
      and an admin-created format in the wrong one silently.

      The migration is hand-written because drizzle-kit emits no backfill, and its
      order is load-bearing twice over: the backfill has to precede SET NOT NULL or
      the seeded rows fail it, and DROP TYPE has to follow the column conversion or
      Postgres refuses it. Both orderings are asserted rather than commented.
