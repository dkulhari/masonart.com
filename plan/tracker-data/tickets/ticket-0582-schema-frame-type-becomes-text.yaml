  - author: mcp-client
    timestamp: '2026-08-07T10:52:21.498Z'
    text: |-
      🧪 **Migration 0014 executed for real — the gap this ticket's completion comment flagged is now closed.**

      Not against the dev database. `poster-app-postgres` on :5440 is shared with other sessions and 0014 drops a type with no down-migration, so instead: a throwaway `frames_migration_check` database on the same server, built to the pre-0014 state (the `frame_type` enum, the `frames` table as at 0013, its three indexes, and the seven seeded rows), then 0014 applied to it. Dropped afterwards.

      **Every statement executed clean, in order:**
      ```
      ALTER TABLE / UPDATE 7 / CREATE TYPE / ALTER TABLE ×3 / DROP TYPE / DROP INDEX / CREATE INDEX
      ```

      **The backfill produced exactly the mapping the test asserts textually:**
      ```
       Rolled Canvas          | rolled    | rolled
       Frameless              | frameless | frameless
       Stretch + Gold Frame   | gold      | framed
       Stretch + Silver Frame | silver    | framed
       Stretch + Black Frame  | black     | framed
       Stretch + White Frame  | white     | framed
       Stretch + Wood Frame   | wood      | framed
      ```

      **Final column state** — `type` is `text NOT NULL`, `category` is `frame_category NOT NULL`, and `frame_type` no longer exists.

      **The unique index is real, not just declared:**
      ```
      INSERT ... VALUES ('Dupe', 'gold', 'framed', '1.40');
      ERROR: duplicate key value violates unique constraint "frames_type_idx"
      DETAIL: Key (type)=(gold) already exists.
      ```

      Also confirmed by grep that `frames.type` was the only column ever using the `frame_type` enum (`0000_simple_blindfold.sql:35`), so the `DROP TYPE` has no other dependent.

      **One caveat worth carrying forward**: if any environment has ended up with two frames sharing a `type`, `CREATE UNIQUE INDEX` will abort the migration. Drizzle wraps a migration in a transaction so it rolls back cleanly rather than half-applying — and a duplicate type *should* block it, since the uniqueness is a real invariant the storefront's swatch lookup depends on. Worth a `SELECT type, count(*) FROM frames GROUP BY type HAVING count(*) > 1` before running this anywhere with data that did not come from the seed.
