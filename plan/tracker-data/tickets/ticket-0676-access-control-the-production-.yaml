    text: |-
      ✅ **Completed**

      **Commit**: `09dbcf7d` — feat(api): add the production job transition matrix

      **Files Changed**:
      - `packages/api/src/lib/production-transitions.ts` (new) — the matrix, `assertTransition`, `nextStatuses`, `isTransitionAllowed`, `guardFor`, `ProductionTransitionError`, and the derived `VENDOR_SETTABLE_STATUSES` / `TERMINAL_STATUSES` / `UNREACHABLE_STATUSES`.
      - `packages/api/tests/lib/production-transitions.test.ts` (new) — 47 tests.

      **Summary**:
      `PRODUCTION_TRANSITIONS` is a mapped type over `ProductionJobStatus`, so it is total by construction — a status added to the enum with no row is a *compile* error, not a silent denial — and the anti-drift test deep-equals its key set against `productionJobStatusEnum.enumValues`. 17 legal triples out of 243 possible ones.

      - `sent`: zero in-edges, zero out-edges. The empty row is the retirement.
      - `dispatched` / `cancelled`: terminal, derived as "has in-edges, has no out-edges", which is what distinguishes them from `sent` rather than a hand-written list.
      - `assigned -> assigned` is the only self-edge and is permitted, not refused — reassign + reprice.
      - `qc_passed` has exactly one in-edge, from `qc_submitted`; asserted as a reachability property (delete `qc_submitted` from the graph and BFS from every node) rather than edge-by-edge, so a future edge routing around QC fails.
      - `system` has no edge anywhere: creation has no `from`, so it is not a transition.
      - Every edge names the `guard` a route must still evaluate (`shot-list-complete`, `review-verdict-pass|fail`, `open-transfer-or-order-label`, `priced-from-rate-card`), so the checklist for #680/#681/#684 sits beside the edge instead of only in the design doc.
      - `ProductionTransitionError` carries `httpStatus: 409`, `code: 'ILLEGAL_TRANSITION'` and `toResponseBody() -> { error, code, from, to, allowed }`, with `allowed` scoped to the *asking* actor.
      - `VENDOR_SETTABLE_STATUSES` is derived from the vendor edges and comes out `['received', 'qc_submitted', 'dispatched']`, typed as a non-empty tuple so it drops straight into `z.enum`. `routes/vendor.ts:81`'s stale `['sent', 'received']` literal was deliberately left alone for #684.

      Pure module — its only import is the schema's enum declaration, which never reaches the connection. No Hono, no `db`, no concurrency logic (that is #680).

      **Verification**:
      - Command: `cd packages/api && bunx vitest run tests/lib/production-transitions.test.ts`
      - Result: PASS (47 tests, 47 passing, 0 failing)
      - Output: `Test Files 1 passed (1) / Tests 47 passed (47)`
      - Command: `bunx tsc --noEmit && bunx tsc -p tsconfig.test.json --noEmit` (packages/api) — PASS, 0 errors. The pre-commit gate (`turbo run typecheck`, all 3 packages) also passed on the commit.
      - **Mutation-checked, not just green**: temporarily adding a `cancelled -> dispatched` edge failed 7 tests (the literal allowed-set, `TERMINAL_STATUSES`, the no-resurrection test, the live-status set, both reachability tests, and the empty-remedy message). Reverted before committing.

