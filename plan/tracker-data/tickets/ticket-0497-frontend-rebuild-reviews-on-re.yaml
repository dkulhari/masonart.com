ticket_number: 497
title: Frontend - rebuild /reviews on ReviewGrid with the Loox header row
description: |-
  ## Task

  Replace the invented aggregate band and numbered paging on `/reviews` with what mesonart actually renders: a star row, "<N> Reviews", a "Write a review" pill, then the unfiltered masonry grid, then "Show more reviews".

  ## Context

  Part of feature: review-grid-loox-parity
  Phase: Frontend
  Depends on: ReviewGrid

  - Reference: `docs/design/mesonart/mesonart-reviews-page-loox.png`. The header is one compact row, NOT the beige `SectionBand` + `DisplayHeading` treatment currently there. Mesonart has no big score band on this page — that is the home strip, which is a different surface and stays as-is.
  - **Keep `validateSearch` coercing `page`.** `packages/web/app/routes/router.tsx` overrides TanStack's search serialisation, so a bare `z.number()` throws and error-boundaries the route to a blank page. Show-more appends, but the `page` param must keep working for deep links.
  - The `>= 10` suppression rule applied to the old aggregate band. The new header shows a raw count and star row, which is honest at any sample size — but if the catalogue has zero approved reviews the page still needs a real empty state rather than "0 Reviews" over nothing.
  - Do not touch the home strip (`CustomerReviewsSection`) or the toast — both already match mesonart.
  - Existing E2E in `tests/e2e/review-surfaces.spec.ts` asserts the old aggregate header and page-2 paging. Those assertions will need updating; the ticket that deletes ReviewMediaWall handles the spec sweep, so coordinate rather than half-updating.
  - vitest gotcha: stub localStorage/sessionStorage in `vi.hoisted` above the imports if you hit `setItem is not a function`.
