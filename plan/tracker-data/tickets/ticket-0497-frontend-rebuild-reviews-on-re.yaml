      ✅ **Completed**

      **Commit**: `329f8f31` — feat(web): rebuild the reviews page on the masonry grid

      **Files Changed**:
      - `packages/web/app/routes/reviews.tsx` — beige `SectionBand`/`DisplayHeading` band, `ReviewsAggregate`, `ReviewFeedRow`/`ReviewFeedList` and the numbered pager deleted; replaced by the compact Loox header row (`ReviewsHeader`) over `<ReviewGrid pageSize={24} />` with no `productId`, plus a real `ReviewsEmptyState`.
      - `packages/web/tests/routes/reviews.test.tsx` — rewritten for the new page: header row, CTA, chevron disclosure, unfiltered grid, empty catalogue, and a guard that the band cannot be imported back.

      **Summary**:
      - Header is one row: star row (from `/api/reviews/stats`), "<N> Reviews" + chevron, "Write a review" outline pill on the right. No score band — that treatment belongs to the home strip, which was not touched.
      - The chevron is a real disclosure (`aria-expanded`) revealing the exact average; it is not a fake affordance.
      - The count segment is absent — not zeroed — while the aggregate is in flight, so the row never flashes "0 Reviews".
      - Zero approved reviews renders `reviews-empty` ("No reviews yet" + Browse posters) instead of the header and the wall.
      - "Write a review" links to `/account/orders`: the API creates a review against an order item, so a form on this page could not be submitted.
      - **`validateSearch` still coerces `page`** (`z.coerce.number().int().min(1).catch(1)`) — router.tsx hands params over as strings and a bare `z.number()` blanks the route. The grid appends via "Show more reviews"; `page` is retained so links shared while the pager existed still resolve.
      - `MIN_REVIEWS_FOR_AGGREGATE` kept exported — `CustomerReviewsSection.test.tsx` pins the home strip's threshold to it.

      **Verification**:
      - Command: `cd packages/web && bunx vitest run tests/routes/reviews.test.tsx`
      - Result: PASS (17 tests, 17 passing, 0 failing)
      - Output: `✓ tests/routes/reviews.test.tsx (17 tests) 812ms` / `Test Files 1 passed (1)` / `Tests 17 passed (17)`
      - Red first: same command before the rewrite gave `Tests 9 failed | 8 passed (17)` — missing `ReviewsHeader`/`ReviewsPage` exports and the band still imported.
      - Neighbours: `bunx vitest run tests/components/home/CustomerReviewsSection.test.tsx tests/components/reviews/ReviewGrid.test.tsx tests/components/reviews/ReviewToast.test.tsx` → `Tests 45 passed (45)`.
      - Types: `bunx tsc --noEmit` reports no errors in `app/routes/reviews.tsx` (pre-existing baseline errors elsewhere, e.g. `app/routes/track/index.tsx`, untouched).

      **Known follow-up (#499)**: `tests/e2e/review-surfaces.spec.ts` still asserts `reviews-aggregate`, `review-feed-row`, `reviews-pagination` and the visible "Reviews & Ratings" heading. Those four assertions now fail by design; left for the spec sweep rather than half-updated here.
