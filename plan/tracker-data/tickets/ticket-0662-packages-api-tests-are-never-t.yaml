implementation_steps:
  - id: 1
    action: implement
    description: Add packages/api/tsconfig.test.json — separate from tsconfig.json, which cannot include tests because rootDir is ./src
    file: packages/api/tsconfig.test.json
    status: pending
    code: |-
      {
        "extends": "../../tsconfig.json",
        "compilerOptions": {
          "noEmit": true,
          "composite": false,
          "declaration": false,
          "declarationMap": false,
          // Test code is held to a lower bar than src on this one flag only.
          // Nothing ships from tests/, and `result.images[0]` being possibly
          // undefined is noise in a test that just asserted the array has two
          // entries. Everything that catches a genuinely broken test stays on.
          "noUncheckedIndexedAccess": false,
          // MUST stay empty. Naming types here (e.g. ["@types/bun"]) fails
          // resolution with TS2688 and silently suppresses every other error,
          // so the config reports clean on broken code.
          "types": []
        },
        "include": ["src/**/*", "tests/**/*"]
      }
  - id: 2
    action: verify-pass
    description: Self-test the config, then record the baseline. A config reporting zero errors is indistinguishable from one that is not looking — prove it looks before trusting it.
    command: cd packages/api && printf '\nconst __probe = __definitelyNotDefined;\n' >> tests/helpers/live-db.ts && npx tsc -p tsconfig.test.json 2>&1 | grep -c __definitelyNotDefined && git checkout -- tests/helpers/live-db.ts && npx tsc -p tsconfig.test.json 2>&1 | grep -c 'error TS'
    expected_result: Probe count 1 (config genuinely checks), then 882 errors. If the probe count is 0, the config is inert — fix it before going further.
    status: pending
  - id: 3
    action: implement
    description: Add a typed json<T>() test helper and move the 413 res.json() call sites onto it — the single biggest category, 500 errors
    file: packages/api/tests/helpers/http.ts
    status: pending
    code: |-
      /**
       * `Response.json()` is typed `unknown`, so every `body.field` read in a
       * route test is a type error (500 of them, #<this ticket>). Tests already
       * know the shape they expect — this lets them say so once.
       */
      export async function json<T = Record<string, unknown>>(
        res: Response,
      ): Promise<T> {
        return (await res.json()) as T;
      }
  - id: 4
