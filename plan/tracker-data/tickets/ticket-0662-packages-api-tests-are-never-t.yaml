    text: |-
      ✅ **Completed**

      **Commits**: `ce922da1` — typecheck the tests/ tree and clear the mechanical error classes; `33a8eaed` — take tests/ to zero type errors and put them behind the gate

      **Files Changed**:
      - `packages/api/tsconfig.test.json` — new; the tests-only config
      - `packages/api/tests/helpers/json.ts` — new; typed `readJson<T>()`
      - `packages/api/package.json` — `typecheck` now runs both configs
      - 95 test files across `packages/api/tests/`

      **Burn-down** (each measured, not estimated):

      | After | Errors |
      |---|---|
      | before | 1244 |
      | `noUncheckedIndexedAccess: false` for tests | 882 |
      | `readJson()` migration (523 call sites) | 274 |
      | delete 71 unused declarations | 203 |
      | hand triage | **0** |

      The predicted 882 was hit exactly. `readJson()` beat the predicted 382 because the nested `(await app.request(…)).json()` form and five local `return res.json()` helpers were migrated too — 523 sites, not 413.

      **Named `readJson`, not `json`**: 136 call sites already declare `const json = await res.json()`. `const json = await json(res)` is a temporal-dead-zone reference to the binding being declared — it would typecheck and throw at runtime.

      **The #633 trap fired, in reverse.** `tests/database/orders.test.ts` declares `testVariantId` in two describe blocks. Deleting the dead one's assignments broke the live one, and the typechecker caught it (TS2454). The `productVariants` insert kept its side effect and lost only the dead binding it fed.

      **Defects found by reading the residual**:
      - `country` where `OrderShippingAddress` requires `countryCode` — four files, not just the one this ticket named
      - `email-templates.test.ts` declared `shippingDetails` dates as `Date`; production declares ISO strings. It also set `paymentMethod`/`paymentId` at the top level (the row nests them under `paymentDetails`) and `billingAddress` (the column is `billingAddressId`)
      - 19 inserts across four database suites omitted `id`. `user.id`/`session.id` are `text PRIMARY KEY NOT NULL` with no default — every one would have failed on a NOT NULL violation. **Type-verified only**: those suites are among the 5 skipped without a test database, so this is not runtime-proven
      - `collection-resolver.test.ts` guarded with `merged && merged.styles`. `IMPOSSIBLE` is a symbol and symbols are truthy, so the guard never guarded
      - `middleware/wallet.test.ts` passed provider `'fal'` and model `'flux-pro'`; neither is accepted
      - `users.test.ts` chained `.where()` twice on one select
      - six mocks declared fewer parameters than the function they stand in for
      - `order-reviews.test.ts` had one test missing the `if (!app) return` guard the rest of the file has
      - six files declared an `isDatabaseAvailable` skip-guard that nothing ever read

      Two casts are upstream: postgres.js types `TransactionSql` as `Omit<Sql, …>`, and `Omit` drops the call signature.

      **Verification**:
      - Command: `npx tsc -p tsconfig.test.json --noEmit`
      - Result: **0 errors**, down from 1244
      - Self-tested at zero: appending an undefined identifier still reports `TS2304`, so the zero means the config is looking, not blind
      - Command: `npx vitest run` (full packages/api suite)
      - Result: PASS — 189 files passed | 5 skipped (194); 5029 tests passed | 187 skipped (5216); **0 failed**
      - Test declaration count unchanged at 4533 vs `bbe812c6`
      - Gate proof: appending `${counterThatWasDeleted}` to a staged test file — the #633 failure mode — makes `.githooks/pre-commit` exit 1 with `TS2304: Cannot find name` and "commit refused". Before this ticket the same edit was a `FULL TURBO` cache hit.
