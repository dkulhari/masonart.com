ticket_number: 662
title: packages/api tests are never typechecked — 1244 latent errors, and a broken test file passes the gate
description: |-
  ## Problem

  `packages/api/tsconfig.json` has `include: ["src/**/*"]`. The `tests/` tree is **not typechecked** — not by `npx tsc --noEmit`, not by `turbo run typecheck`, not by the pre-commit hook. There is no eslint/biome config at the repo root either, so nothing checks test files but vitest.

  **To be clear about scope: all of this is in test code. `src/` typechecks clean — 0 errors. Nothing here ships to production.**

  ## Why it matters anyway

  Tests are code that can be wrong, and a test file that fails to run protects nothing.

  This is not theoretical. During #633 a refactor script deleted six `let counter` declarations that were still used by `orderNumber`. `turbo run typecheck` passed clean and the pre-commit hook let it through. Only vitest caught it, at runtime. That whole class of error — undefined identifiers, wrong arity, wrong object shapes — is invisible today.

  Some errors also point at real fidelity gaps between tests and production. Confirmed example: `tests/services/email-templates.test.ts:58` builds a shipping address with `country: 'India'`, but `OrderShippingAddress` (`src/database/schema/orders.ts:28`) declares `countryCode: string` as **required** and has no `country` field. That test exercises a shape production never produces. Inert today — the template reads neither field — but that is drift nobody can currently see.

  ## Measured current state

  1244 errors across 102 of 192 test files. Dominated by two idioms, not 1244 distinct problems:

  | Code | Count | What it is |
  |---|---|---|
  | TS18046 | 535 | `'body' is of type 'unknown'` — from `await res.json()` |
  | TS2532 | 230 | `Object is possibly 'undefined'` — indexed access |
  | TS18048 | 215 | `'mood' is possibly 'undefined'` — indexed access |
  | TS2345 | 117 | `'string \| undefined' not assignable to 'string'` |
  | rest | 147 | long tail |

  Worst files: `tests/database/migrations.test.ts` (70), `tests/database/ai.test.ts` (63), `tests/database/users.test.ts` (56), `tests/routes/tracking.test.ts` (54), `tests/routes/health.test.ts` (49).

  ## Agreed scope: relax indexed access for tests

  Test code is held to a lower bar than `src` here, deliberately. `noUncheckedIndexedAccess` off for `tests/` only. Nothing ships from this tree, and the errors it produces (`result.images[0]` possibly undefined) are noise in a test that has just asserted the array has two entries. The flag stays on for `src`.

  Everything that catches a genuinely broken test — undefined identifiers, wrong arity, wrong shapes — is still on.

  ## Measured burn-down

  Each number below was measured, not estimated:

  | After | Errors |
  |---|---|
  | today | 1244 |
  | `noUncheckedIndexedAccess: false` for tests | **882** |
  | typed `json<T>()` helper (500 errors, 413 call sites) | **382** |
  | delete 71 unused declarations (TS6133) | **311** |
  | triage the residual by hand | 0 |

  ## A separate tsconfig is required, not just tidier

  Widening `include` in `packages/api/tsconfig.json` does **not** work. It sets `rootDir: "./src"` with `composite`/`declaration` for the build, so adding tests fails with TS6059 on every test file:

  ```
  error TS6059: File '.../tests/ai/presets.test.ts' is not under 'rootDir' '.../src'.
  ```

  So: leave `tsconfig.json` alone and add `tsconfig.test.json` beside it, run as a second command in the `typecheck` script.

  ## Trap: `types` silently suppresses everything

  Setting `"types": ["@types/bun", "vitest/globals"]` in the test config makes resolution fail with TS2688 and **silently suppresses every other error** — the config then reports clean on genuinely broken code. This wasted time during #633.

  Use `"types": []`. And self-test any such config before trusting it: append a reference to an undefined identifier and confirm it errors. A config that reports zero errors is indistinguishable from one that is not looking.

  ## Context

  - Sibling ticket: #626 did the same job for `packages/web` src (22 errors).
  - Discovered during #633.
  - The full 1244-line error dump is reproducible with the config in step 1.
  - Do not run prettier on any file touched here — the repo has no prettier config and defaults rewrite whole files.
