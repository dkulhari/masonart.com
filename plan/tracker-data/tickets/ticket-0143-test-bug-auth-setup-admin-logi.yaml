ticket_number: 143
title: "Test Bug: Auth setup admin login timeout"
description: |-
  ## Test Failure
  **File**: `tests/e2e/auth.setup.ts`
  **Test**: authenticate as admin
  **Line**: 220

  ## Error (Test Infrastructure Issue)
  ```
  Test timeout of 30000ms exceeded.
  Error: locator.isVisible: Target page, context or browser has been closed
    at loginUser (tests/e2e/auth.setup.ts:75:68)
  ```

  ## Classification
  This is a **test bug** - identical root cause to the customer login timeout issue. The admin login flow takes longer than expected, causing timeout cascades.

  ## Root Cause
  Same as ticket #142 - the login flow is slow and the waitForURL timeout (10s) is insufficient.

  ## Suggested Fix
  Same as ticket #142:
  - Increase the `waitForURL` timeout from 10s to 20s
  - Or investigate why the login redirect is slow
  - Or use the pre-seeded test users with verified credentials
