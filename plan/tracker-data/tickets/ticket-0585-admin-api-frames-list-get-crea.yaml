    code: |
      /**
       * Admin CRUD for frames.
       *
       * Three things here carry weight beyond the usual CRUD shape:
       *
       * 1. **Cache busting.** GET /api/products/frames caches for fifteen minutes.
       *    An admin who saves a price, reloads the PDP and sees the old number will
       *    save again — the obvious first bug, and invisible in a unit test unless
       *    it is asserted here.
       * 2. **Archived rows are returned, not filtered.** The screen dims them and
       *    offers Unarchive. A list that hides them makes archiving irreversible
       *    through the UI.
       * 3. **A duplicate type is a 409, not a 500** escaping the unique index. The
       *    admin has to be told which slug is taken.
       */

      import { describe, it, expect, vi, beforeEach } from 'vitest'
      import '../../setup'

      const selectMock = vi.fn()
      const insertMock = vi.fn()
      const updateMock = vi.fn()
      const deleteCached = vi.fn()

      vi.mock('../../../src/database', () => ({
        db: {
          select: (...a: unknown[]) => selectMock(...a),
          insert: (...a: unknown[]) => insertMock(...a),
          update: (...a: unknown[]) => updateMock(...a),
        },
      }))

      vi.mock('../../../src/lib/cache', async (importOriginal) => ({
        ...(await importOriginal<Record<string, unknown>>()),
        deleteCached: (...a: unknown[]) => deleteCached(...a),
      }))

      // Auth: mirror tests/routes/admin/collections.test.ts exactly — X-Test-User
      // header carries the role, requireAdmin allows admin and super-admin.

      const ADMIN = JSON.stringify({ id: 'u1', role: 'admin' })

      const frameRow = {
        id: 'f1',
        name: 'Stretch + Gold Frame',
        type: 'gold',
        category: 'framed',
        priceModifier: '1.40',
        priceAddition: '0.00',
        isActive: true,
        sortOrder: 2,
      }

      describe('GET /api/admin/frames', () => {
        beforeEach(() => vi.clearAllMocks())

        it('returns archived frames too — the screen dims them rather than hiding them', async () => {
          // Arrange select() to resolve [frameRow, {...frameRow, id:'f2', isActive:false}]
          // Assert the response contains BOTH, and that no isActive filter was applied.
        })

        it('rejects a non-admin', async () => {
          // No X-Test-User -> 401; role 'customer' -> 403
        })
      })

      describe('POST /api/admin/frames', () => {
        beforeEach(() => vi.clearAllMocks())

        it('creates a frame and busts the frames cache', async () => {
          // Assert 201, and deleteCached called with a key containing 'frames'
          expect(deleteCached).toHaveBeenCalled()
        })

        it('rejects a modifier the pricing formula would ignore', async () => {
          // body priceModifier '0.5' -> 400, no insert attempted
