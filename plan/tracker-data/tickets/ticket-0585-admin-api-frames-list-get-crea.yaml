      ✅ **Completed**

      **Commit**: `9901b551` — feat(api): admin CRUD for frames, with the cache drop the price edit needs

      **Files Changed**:
      - `packages/api/src/routes/admin/frames.ts` — new; GET `/`, GET `/:id`, POST `/`, PATCH `/:id`
      - `packages/api/src/lib/pg-errors.ts` — new; `isUniqueViolation` lifted out of `admin/collections.ts`
