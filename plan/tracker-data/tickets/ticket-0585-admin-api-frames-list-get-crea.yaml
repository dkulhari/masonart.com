      **Beyond the ticket**:
      Rather than writing a second `isUniqueViolation`, I extracted the existing one from `admin/collections.ts` into `lib/pg-errors.ts`. Its comment records that Drizzle wraps the driver error so the pg code sits on `error.cause.code` and not `error.code` — that was worked out against the live database, and a fresh copy in the frames route would very likely have checked only the top level and turned every duplicate type into a 500. Same class of duplicate #584 removed for the image guards. `collections.test.ts` passes 26/26 unchanged, which is the evidence the extraction is behaviour-preserving.

      Two small shared helpers inside the route: `purgeFramesCache()` so a later write cannot invent a near-miss cache key, and `takenType()` so create and update phrase a taken slug identically.

      **Verification**:
      - Command: `bunx vitest run tests/routes/admin/frames.test.ts`
      - Result: PASS (14 tests, 14 passing) — covers archived rows being returned, 401/403 gates, cache bust asserted on both POST and PATCH with the literal key `product:frames`, 400 on a `0.5` modifier and on a display-name type, 404 on unknown id, and 409 on duplicate type for both create and update
      - Command: `bunx vitest run tests/routes/admin/collections.test.ts`
      - Result: PASS (26 tests, 26 passing) — the extraction check
      - Command: `bunx tsc --noEmit`
      - Result: 0 errors

      **Pre-existing failure, not a regression**: `tests/server.test.ts` reports `21 failed | 52 passed`. I ran it with my changes stashed and got the identical `21 failed | 52 passed`, so it is the worktree's missing database, not the new mount.
