ticket_number: 585
title: Admin API - frames list, get, create, patch with cache busting
description: |-
  ## Task

  New `packages/api/src/routes/admin/frames.ts`, mounted at `/api/admin/frames` in src/index.ts behind the same admin auth middleware as its siblings.

  - `GET /` — all frames INCLUDING archived. Archived rows are returned, not filtered: the UI dims them and offers Unarchive. Filtering them here would make archiving irreversible through the UI.
  - `GET /:id`
  - `POST /` — create, validated by `createFrameInputSchema`
  - `PATCH /:id` — partial, validated by `updateFrameInputSchema`

  Every mutation busts `CacheKeys.PRODUCT + "frames"`. Without it the 15-minute TTL on `GET /api/products/frames` (products.ts:862) means an admin saves a price, reloads the PDP, sees the old number, and saves again.

  A duplicate `type` must surface as **409**, not as a 500 escaping the unique index — the admin needs to be told which slug is taken. Pattern already established in admin/collections.ts for slug collisions.

  ## Context

  Feature: admin-frame-management. Phase 3 (admin API). Blocked by #582 (schema) and #583 (input schemas).

  Files:
  - packages/api/src/routes/admin/collections.ts — closest CRUD sibling; copy its shape, its auth wiring and its cache-busting
  - packages/api/src/routes/admin/products.ts:642 — archive-not-delete precedent (next ticket)
  - packages/api/src/index.ts:38 — where admin routes are imported and mounted

  Test pattern: packages/api/tests/routes/admin/collections.test.ts. The admin route suites MOCK `db` (`vi.mock('../../../src/database')`) and mock the auth middleware via an X-Test-User header — no live database needed.
