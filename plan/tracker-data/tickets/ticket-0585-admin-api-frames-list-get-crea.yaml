      feat(api): admin CRUD for frames, with the cache drop the price edit needs

      Repricing a frame was a deploy. This is the write path: list, read, create and
      patch, mirroring the collections admin routes.

      Every mutation drops the frames cache key. The public list caches for fifteen
      minutes, so without it an admin saves a price, reloads the product page, sees
      the old number and saves again — the first bug anyone would hit, and the one a
      mocked-db suite will not catch unless it is asserted.

      The list deliberately returns archived frames rather than filtering them: the
      screen dims them and offers Unarchive, and a list that hides them would make
      archiving irreversible from the UI. A duplicate type surfaces as a 409 naming
      the taken slug instead of a 500 escaping the unique index.
