    text: |-
      ✅ **Completed** — but the scope changed materially. Read this before #707.

      **Commit**: `0352e227` - feat(api): audit a shipment being opened and retracked

      **⚠️ The branch was REBASED onto main during this ticket.** It was 27 commits stale, and #671 had landed there — the ticket was written against a world that no longer existed.

      **What main already had that this ticket assumed it had to build:**
      | Ticket assumed | Reality on main |
      |---|---|
      | Wire the orphan `order.shipment_marked_delivered` | Already wired at `routes/admin/shipments.ts:688` (`40963758`) |
      | Write an emitter-coverage guard | `tests/lib/audit-action-coverage.test.ts` + `audit-action-waivers.ts` (`a0228da9`) |
      | 14 declared-but-unemitted actions | Down to **2**, both with documented waiver reasons (`wallet.adjusted`, `user.status_changed`) |

      My "14 orphans" measurement was an artifact of the stale branch. Main had already fixed 8 in `40963758`, `8517d83d`, `ee00a616`.

      **So three things were discarded rather than shipped:**
      1. My scoped `audit-actions-emitted.test.ts` — deleted, it duplicated main's better global guard which has a waiver mechanism mine lacked.
      2. My duplicate wiring of `order.shipment_marked_delivered` — dropped. I had copied main's implementation verbatim to keep the merge clean; once rebased it was simply redundant.
      3. The reasoning about scoping the guard to this feature — moot.

      **What actually shipped:** `shipment.created` and `shipment.tracking_updated`, declared in `packages/shared/src/schemas/audit-log.ts` and emitted from `routes/admin/shipments.ts`. Category `fulfilment` — a parcel changing hands is not a money event; what we *paid* a carrier is, and that action arrives in the Shiprocket pass with the code that writes the cost.

      **Two defects the gates caught, both mine:**
      - Pre-commit typecheck: I dereferenced `.returning()` results, which drizzle types `T | undefined`. The surrounding code never did. Fixed with optional chaining rather than new control flow.
      - The rebase auto-merged **both** copies of the `recordAudit` import (mine at line 34, main's at 36). Duplicate identifier; caught by typecheck.

      **Verification**:
      - Command: `cd packages/api && bunx vitest run`
      - Result: **PASS — 5963 passed | 0 failed | 188 skipped (6151)**, on the rebased branch
      - **Main's own `audit-action-coverage.test.ts` (#671) passes 6/6** with the two new actions — that is the real guard for this ticket, not one I wrote
      - `packages/shared` audit-log: 26/26. Typecheck: PASS across all three packages.

      **Infrastructure incident during verification** — an earlier full run showed 88 failures that were **not code**. The shared Postgres on `:5440` was at `max_connections=100`, refusing even the superuser reserve. Root cause: a stray `nohup`'d `bun run --hot src/index.ts` on `:3000` from a *different* Claude session (`ad66048d`), 11 hours old, holding all 100 connections while logging **895 "too many clients" errors** into a 2.7 MB log — both the cause and a victim, serving nothing. A container restart did **not** fix it (it reconnected instantly); reaping PID 73065 did. `--hot` leaks a pool per reload, so any long-lived dev server here is a time bomb.
