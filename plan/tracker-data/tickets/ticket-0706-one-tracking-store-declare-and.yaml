implementation_steps:
  - id: 1
    action: write-test
    description: 'Flip the guard: every declared shipment.* action must have an emitter, and the orphan must gain one'
    file: packages/shared/tests/schemas/audit-log.test.ts
    command: cd packages/shared && bunx vitest run tests/schemas/audit-log.test.ts
    expected_result: FAIL
    status: pending
    code: |
      // REPLACE the test at line ~142, 'declares nothing for a later phase to emit'.
      // Its comment says it is holding the line until order-dispatch-tracking has
      // emitters. It does now, so the assertion inverts rather than being deleted:
      // the rule (#671) never changed, only which side of it we are on.

        /**
         * #671: an action nothing emits fails the build. The registry used to hold
         * NOTHING for this feature because its emitters did not exist; now they do,
         * so the same rule is asserted from the other direction — every declared
         * `shipment.*` action is emitted somewhere under `packages/api/src`.
         *
         * `order.shipment_marked_delivered` is checked with them. It was declared
         * long before this feature and emitted by nothing at all, which is the exact
         * defect the rule exists to catch.
         */
        it('emits every fulfilment action it declares', () => {
          const apiSrc = resolve(__dirname, '../../../api/src')
          const sources = readdirSync(apiSrc, { recursive: true, encoding: 'utf8' })
            .filter((f) => f.endsWith('.ts'))
            .map((f) => readFileSync(resolve(apiSrc, f), 'utf8'))
            .join('\n')

          const mustEmit = AUDIT_ACTIONS.filter(
            (a) => a.startsWith('shipment.') || a === 'order.shipment_marked_delivered'
          )

          expect(mustEmit.length, 'the scan found no actions to check — it is vacuous').toBeGreaterThan(0)

          for (const action of mustEmit) {
            expect(sources, `${action} is declared and emitted by nothing (#671)`).toContain(
              `"${action}"`
            )
          }
        })

        it('declares only the shipment actions THIS pass emits', () => {
          // label_issued and voided belong to the Shiprocket pass and must arrive
          // with their emitters, not ahead of them.
          const shipmentActions = AUDIT_ACTIONS.filter((a) => a.startsWith('shipment.'))
          expect([...shipmentActions].sort()).toEqual(['shipment.created', 'shipment.tracking_updated'])
        })

        it('files a parcel moving under fulfilment, not money', () => {
          expect(AUDIT_ACTION_CATEGORY['shipment.created']).toBe('fulfilment')
          expect(AUDIT_ACTION_CATEGORY['shipment.tracking_updated']).toBe('fulfilment')
        })
  - id: 2
    action: verify-fail
    description: Confirm the test fails
    command: cd packages/shared && bunx vitest run tests/schemas/audit-log.test.ts
    expected_result: FAIL - shipment.created is not in AUDIT_ACTIONS, and order.shipment_marked_delivered is emitted by nothing
    status: pending
  - id: 3
    action: implement
    description: Declare the two actions and their category
    file: packages/shared/src/schemas/audit-log.ts
    status: pending
    code: |-
      // In AUDIT_ACTIONS, in the Fulfilment block beside the production actions:

        // Fulfilment — the courier leg. A parcel moving is not a money event; what
        // we PAID a carrier is, and that action arrives with its emitter in the
        // Shiprocket pass, not here.
        'shipment.created',
        'shipment.tracking_updated',

      // And in AUDIT_ACTION_CATEGORY:

        'shipment.created': 'fulfilment',
        'shipment.tracking_updated': 'fulfilment',
  - id: 4
    action: implement
    description: Emit shipment.created on shipment creation and shipment.tracking_updated on the PATCH
    file: packages/api/src/routes/admin/shipments.ts
    status: pending
    code: |-
      // POST /api/admin/orders/:orderId/ship — after the insert returns, sharing
      // nothing: the insert is a single statement and there is no transaction to
      // share. A row asserting a shipment exists beside no shipment would be worse
      // than none, so this goes AFTER the write, not before.

            await recordAudit(c, {
              action: "shipment.created",
              entityType: "order_shipment",
              entityId: newShipment.id,
              summary: `Shipment opened for order ${order.orderNumber} with ${data.carrier}`,
              after: {
                orderId,
                carrier: data.carrier,
                trackingNumber: data.trackingNumber ?? null,
              },
            });

      // PATCH /api/admin/shipments/:id — with a before/after diff, because the whole
      // point of this row is that someone changed a tracking number a customer is
      // reading.

            await recordAudit(c, {
              action: "shipment.tracking_updated",
              entityType: "order_shipment",
              entityId: id,
              summary: `Tracking updated on shipment ${id}`,
              before: existing,
              after: updated,
            });
  - id: 5
    action: implement
    description: 'Wire the orphan: mark-delivered emits the action that was declared for it'
    file: packages/api/src/routes/admin/shipments.ts
    status: pending
    code: |-
      // POST /api/admin/shipments/:id/mark-delivered — `order.shipment_marked_delivered`
      // has been declared since the audit-log feature and emitted by nothing. It is
      // filed under `money` in AUDIT_ACTION_CATEGORY, which is right: delivery is
      // what closes a return window and settles what we owe.

            await recordAudit(c, {
              action: "order.shipment_marked_delivered",
              entityType: "order_shipment",
              entityId: id,
              summary: `Shipment ${id} marked delivered by hand`,
              before: { status: existing.status, deliveredAt: existing.deliveredAt },
              after: { status: "delivered", deliveredAt },
            });
