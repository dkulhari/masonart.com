    command: cd packages/shared && bunx vitest run tests/schemas/audit-log.test.ts && cd ../api && bunx vitest run tests/routes/admin/shipments.test.ts tests/lib/audit-record.test.ts
    expected_result: PASS
    status: done
  - id: 7
    action: commit
    description: Commit
    command: 'git add packages/shared/src/schemas/audit-log.ts packages/shared/tests/schemas/audit-log.test.ts packages/api/src/routes/admin/shipments.ts && git commit -m "feat(api): audit a shipment being opened, retracked and marked delivered"'
    status: done
