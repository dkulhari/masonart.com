ticket_number: 706
title: One Tracking Store - Declare and emit shipment.*, and wire the orphan order.shipment_marked_delivered
description: |-
  ## Task
  This feature needs audit actions, and one already-declared action has no emitter.

  `AUDIT_ACTIONS` in `packages/shared/src/schemas/audit-log.ts` declares `order.shipment_marked_delivered`. Nothing in `packages/api/src` emits it — grep returns only the declaration and its category. #671 fails the build on exactly that shape. Its obvious emitter is `POST /api/admin/shipments/:id/mark-delivered`, which lives in this feature's own file.

  Add two actions this pass emits: `shipment.created` and `shipment.tracking_updated`. Both are `fulfilment` — a parcel moving is not a money event; what we PAID for it is, and that lands in pass 2 with its own emitter.

  Declare nothing else. `shipment.label_issued` and `shipment.voided` belong to the Shiprocket pass and must be declared in the same phase as their emitters.

  ## Context
  Part of feature: order-dispatch-tracking
  Phase: Phase 3 — One tracking store

  **This ticket must land before the PATCH rewrite**, which emits `shipment.tracking_updated` and cannot reference an undeclared action — `AuditAction` is a closed tuple, so it is a type error.

  `packages/shared/tests/schemas/audit-log.test.ts:142` currently asserts that NO action starts with `shipment.`, with a comment explaining it is holding the line for #671. That test flips here: the actions now have emitters, so the assertion becomes "every declared `shipment.*` action is emitted by some file under `packages/api/src`".

  `recordAudit(c, entry, tx?)` — pass `tx` when the row asserts something the transaction must make true, and share its failures. See `lib/audit.ts:264`.
