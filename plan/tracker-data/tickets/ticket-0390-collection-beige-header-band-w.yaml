ticket_number: 390
title: Collection - beige header band with display H1, breadcrumbs and description
description: |-
  ## Task

  Replace `PageHeader` in `packages/web/app/routes/posters/index.tsx:563` with the mesonart collection header (analysis §1.3.1).

  Today it is a flat `bg-muted/30` band with a plain h1 and a result count. mesonart's is a beige band carrying breadcrumbs (Home / Collections / All Artwork), a display H1 with the per-word reveal, and an SEO description paragraph.

  Everything needed already exists from Phase A and is currently used only on the home page:
  - `SectionBand tone="beige"` — `app/components/ui/SectionBand.tsx`
  - `DisplayHeading` — `app/components/ui/DisplayHeading.tsx`

  The result count moves OUT of here and into the toolbar (next ticket), where mesonart puts it.

  ## Context

  Feature: collection-page-parity

  **Breadcrumbs** should be real markup (`<nav aria-label="Breadcrumb">` + ordered list), not a decorative string, and should carry `BreadcrumbList` JSON-LD — the SEO work in #244 already established structured data on this page via `ItemListJsonLd`.

  **Constraint**: `SectionBand` wraps its children in `.container-wide` already, so the band must not be nested inside another one.

  **Do not** put the count here; the toolbar owns it.
