  - id: 2
    action: implement
    description: Replace the SQL fragment with the real column and delete the seam machinery
    file: packages/api/src/lib/vendor-scope.ts
    status: pending
    code: |-
      // DELETE, in full:
      //   - the LABEL_OBJECT_TOKEN doc block and `const LABEL_OBJECT_TOKEN = sql`...``
      //   - const LABEL_OBJECT_TOKEN_COLUMN
      //   - const UNDEFINED_COLUMN
      //   - export class LabelSeamNotReady
      //   - the isMissingLabelSeam helper and the cause-chain walker it uses, IF
      //     nothing else calls them (grep first)
      //
      // In getVendorJobLabelKey, the select and the predicate become ordinary column
      // references:

        const read = db
          // Narrow on purpose, like every read above: the token and nothing else.
          // `orders`, `order_shipments` and `order_consolidation` all hold or point
          // at customer data, and a wholesale select of any of them would drag it
          // across a boundary R1 says it may never cross.
          .select({ token: orderShipments.labelObjectToken })
          .from(productionJobs)
          .innerJoin(orderConsolidation, eq(orderConsolidation.orderId, productionJobs.orderId))
          .innerJoin(orderShipments, eq(orderShipments.orderId, productionJobs.orderId))
          .where(
            and(
              eq(productionJobs.id, jobId),
              // The job is theirs...
              eq(productionJobs.vendorId, vendorId),
              // ...AND they are the one despatching the order...
              eq(orderConsolidation.vendorId, vendorId),
              // ...AND the job is in a status where a label is legitimately needed,
              // which is derived from the matrix rather than listed here...
              inArray(productionJobs.status, [...LABEL_ACCESS_STATUSES]),
              // ...AND a label actually exists. All four, or no row.
              isNotNull(orderShipments.labelObjectToken)
            )
          )
          .orderBy(desc(orderShipments.createdAt), desc(orderShipments.id))
          .limit(1)

        // The try/catch is GONE. It existed to convert `42703` on a column that did
        // not exist into a deliberate refusal; the column exists, so every failure
        // this read can now produce is a real one and must travel.
        const rows = await read
