ticket_number: 704
title: Label Seam - Read the real column and delete the 42703 to 503 path
description: |-
  ## Task
  `packages/api/src/lib/vendor-scope.ts` reads `order_shipments.label_object_token` as a raw SQL fragment because the column did not exist. Postgres raised `42703`, a catch turned it into `LabelSeamNotReady`, and `routes/vendor.ts` answered a fixed `503`. The column landed in the previous ticket, so all of that is now scaffolding around a working query — and worse than useless: it converts every genuine failure of that read into "not available yet".

  `packages/api/tests/lib/vendor-label-seam.test.ts:211` is already RED and its failure message is the checklist. Follow it literally.

  ## Context
  Part of feature: order-dispatch-tracking
  Phase: Phase 2 — Close the label seam

  Delete list, from that test's own message:
  1. `lib/vendor-scope.ts` — replace the `LABEL_OBJECT_TOKEN` sql fragment with `orderShipments.labelObjectToken`, and delete the catch in `getVendorJobLabelKey` that turns 42703 into `LabelSeamNotReady`.
  2. `routes/vendor.ts` — delete the `LabelSeamNotReady` branch that answers 503 on `GET /jobs/:id/label`.
  3. Delete that test, and check the rest of the file still passes.

  What must NOT change: the ordering of the four authorisation predicates, and the rule that nothing is signed before they all pass. `getPresignedDownloadUrl` is reached only after the read returns a row. A signed URL that is generated and then withheld has still been generated.

  Keep the whole `LABEL_ACCESS_STATUSES` section of the test file — that is the status bound, not the seam.
