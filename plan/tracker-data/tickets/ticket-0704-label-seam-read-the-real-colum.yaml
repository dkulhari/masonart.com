  - id: 5
    action: write-test
    description: 'Write the test that the route now WORKS: a live label signs and returns a URL'
    file: packages/api/tests/lib/vendor-label-seam.test.ts
    command: cd packages/api && bunx vitest run tests/lib/vendor-label-seam.test.ts
    expected_result: FAIL
    status: pending
    code: |
      describe('the label route works now that the column exists', () => {
        it('signs the token as fulfilment/labels/<token>.pdf and answers 200', async () => {
          // The whole point of the previous ticket: this used to be a 503 in every
          // environment, including production.
          recorder.queue([{ token: 'r7Kq2-_aZ9' }])

          const res = await app.request('/api/vendor/jobs/' + JOB_ID + '/label', {
            headers: vendorSessionFor(VENDOR_ID),
          })

          expect(res.status).toBe(200)
          const body = await res.json()
          expect(body.jobId).toBe(JOB_ID)
          expect(typeof body.url).toBe('string')
          expect(body.expiresInSeconds).toBeGreaterThan(0)
        })

        it('still answers 404 — never 503 — when no label row matches', async () => {
          recorder.queue([])

          const res = await app.request('/api/vendor/jobs/' + JOB_ID + '/label', {
            headers: vendorSessionFor(VENDOR_ID),
          })

          expect(res.status).toBe(404)
        })

        it('names no column, table or driver in any body it produces', async () => {
          recorder.queue([])

          const res = await app.request('/api/vendor/jobs/' + JOB_ID + '/label', {
            headers: vendorSessionFor(VENDOR_ID),
          })
          const text = await res.text()

          for (const leak of ['label_object_token', 'order_shipments', '42703', 'column']) {
            expect(text.toLowerCase()).not.toContain(leak)
          }
        })
      })
