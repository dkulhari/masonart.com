    text: |-
      ✅ **Completed**

      **Commit**: `ed691fc7` - fix(api): let a vendor actually fetch the label for the order they consolidate

      **Files Changed** (157 insertions, 345 deletions):
      - `packages/api/src/lib/vendor-scope.ts` — −163 lines: the SQL fragment, `LABEL_OBJECT_TOKEN_COLUMN`, `UNDEFINED_COLUMN`, `LabelSeamNotReady`, `causeChain`, `isMissingLabelSeam`, and the try/catch
      - `packages/api/src/routes/vendor.ts` — the 503 branch, its import, and the doc section describing the seam
      - `packages/api/tests/lib/vendor-label-seam.test.ts` — rewritten around what is now true
      - `packages/api/tests/lib/vendor-scope.test.ts` — the export account no longer names a deleted class

      **Summary**:
      `GET /api/vendor/jobs/:id/label` answered **503 in every environment, production included**. The read is now an ordinary column reference plus `isNotNull`.

      Nothing else about the read moved: the four authorisation conditions keep their order, and `getPresignedDownloadUrl` is still reached only after the read returns a row. A signed URL that is generated and then withheld has still been generated.

      **Deleting the catch was the point, not a side effect.** It converted *every* failure of that read into "not available yet". With the column present, that would have reported a genuine outage as an ordinary empty state — a bug that hides until someone goes looking. Replaced with tests asserting a connection error and a `42703` both travel, and that neither reaches a response body.

      **Test file rewritten:**
      - Deleted: the tripwire pair. It fired on exactly the commit it was written for and named what to unwire.
      - Kept untouched: the whole `LABEL_ACCESS_STATUSES` status-bound section — that is what stops a cancelled job fetching a customer's address.
      - Kept: the "does NOT echo the driver on the generic 500" case, now the *only* guard on this route's error body.
      - New: the route works end to end — 200 with a signed URL, the key built from the token and never from a path naming the order, the audit row written only after the URL exists, and a miss answering 404 rather than 503.

      **Two things worth noting:**

      1. Two of my new tests initially failed because `beforeEach` resets the spies and they asserted on state from a prior test without issuing their own request. My bug in the new tests, not the implementation — fixed by making each self-contained.
      2. `tests/lib/vendor-scope.test.ts` enumerates this module's exports and named `LabelSeamNotReady`. That suite *passed* either way (the account only requires real exports to be listed), so this was not caught by a failure — I found it by grep. Left the array in place, empty, with the reason recorded, so the next error type has a documented home.

      **Verification**:
      - Command: `cd packages/api && bunx vitest run`
      - Result: **PASS — 5825 passed | 0 failed | 188 skipped (6013)**. Fully green; #703's deliberate red is resolved.
      - Scoped: `tests/lib/vendor-label-seam.test.ts` 12/12. Label + scope + all `tests/routes/vendor` suites: 377/377 across 7 files.
      - Typecheck: PASS. This is the gate that would catch a stale `LabelSeamNotReady` import, since `packages/api` tests are typechecked (#662). Pre-commit `turbo run typecheck` also green across all three packages.
      - Grep confirms only two references to the deleted names survive, both prose describing what was removed.
