    timestamp: '2026-08-31T14:07:54.136Z'
    text: |-
      📌 **Decision: split the transaction. Do not hold locks across the courier call.**

      Dhruv chose the second of the two options the ticket left open (2026-08-31).

      So the shape is **lock → mark intent → commit → call → reconcile**, not one long transaction wrapped around the Shiprocket request.

      **Why it is the more correct one.** A courier API call inside an open transaction holds `FOR UPDATE` locks on the order's job rows for as long as Shiprocket takes to answer. That is an external service with no latency guarantee: a slow response blocks every other reader of those rows, and a hung one holds them until the statement timeout. On a pool this app shares with a dev box running many sessions, that is how one dispatch takes the database down.

      **What must still hold.** The concurrency property does not weaken: two admins pressing Ship at once must still produce exactly one label. That now comes from the *intent row* committed in step 2, not from a lock held through step 4 — a second caller finds the intent already recorded and refuses, instead of waiting on a lock.

      **The failure mode this must not ship**, unchanged from the ticket: a bought label with no row recording it. Splitting the transaction makes this *more* likely, not less, because the commit and the purchase are now separate events. So the intent row has to be written **before** the call and reconciled **after** it, and a crash between the two must leave a row that a later reconcile can recognise as "we may have bought this — go and check" rather than as either done or never-started.

      That reconcile path is part of this ticket, not a follow-up. An intent row with no reconciliation is worse than the long transaction it replaced.

      **Test accordingly.** The concurrency test still has to prove one label from two simultaneous callers, and it must fail when the intent row is removed — proved by actually removing it, the way `order-shipments-live-label.test.ts` proves its index rather than asserting the index is merely defined.
  - author: mcp-client
    timestamp: '2026-08-31T14:50:23.503Z'
    text: |-
      ⚠️ **Input from #725: quote with the order's real COD status, not once and reused.**

      Measured on the live account while implementing serviceability — same route, same weight:

      | | rate |
      |---|---|
      | prepaid | ₹153.15 → 15315 paise |
      | COD | ₹208.80 → 20880 paise |

      A Shiprocket quote is only valid for the COD flag it was requested with. So `buyLabelForOrder` must read the order's actual payment method and pass it into `selectCourierFor({ ..., cod })`. Quoting prepaid and then shipping COD books a rate we will not be charged, and the ~₹55 difference lands on the Shiprocket invoice rather than on the order — where nothing reconciles it.

      This matters more under the split-transaction shape decided above: the quote happens before the commit and the purchase happens after, so if anything can change the order's COD status in between, the reconcile step has to notice that the rate it booked no longer matches the shipment it bought.

      `selectCourierFor` already refuses with `SHIPROCKET_NOT_SERVICEABLE` when a COD order has only non-COD couriers, so that path is handled — the risk here is the quieter one of quoting the wrong flag and getting a valid answer.
