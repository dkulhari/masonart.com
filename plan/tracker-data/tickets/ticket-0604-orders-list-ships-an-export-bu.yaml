    text: |-
      ✅ **Completed**

      **Commit**: `f72c9b81` — fix(admin): drop the orders Export button that only opened an alert()

      **Decision**: took the removal branch of the ticket's two options, not the CSV implementation. The button comes back when `GET /api/admin/orders/export` exists; the call site now carries a comment stating that contract (download must match the filters the list is showing) so the next person does not re-add a stub.

      **Files Changed**:
      - `packages/web/app/routes/admin/orders/index.tsx` — removed the Export button and its `alert('Export functionality coming soon')` handler; dropped the now-unused `Download` lucide import; left a comment recording why the control is absent and what brings it back.
      - `packages/web/tests/routes/admin/orders-export-button.test.tsx` (new) — 3 tests.

      **Tests**:
      1. `/admin/orders` renders no Export control (renders the page with fetch stubbed, asserts no button named /export/i and no "export" text).
      2. No native dialog opens on the way to a rendered orders list (`alert` stubbed, asserted uncalled).
      3. Source guard: walks every `.ts`/`.tsx` under `app/routes/admin` and asserts none calls `alert(` — bare or `window.`-qualified, with `setAlert(`-style names excluded by lookbehind. This is the ticket's grep guard turned into a failing test, and it covers every admin screen, not just orders.

      **Verification**:
      - Command: `npx vitest run tests/routes/admin/orders-export-button.test.tsx` (cwd `packages/web`)
      - Result: PASS — `Test Files 1 passed (1) | Tests 3 passed (3)`
      - RED first: before the fix the suite failed 2/3 for the right reasons — Export button found in the DOM, and `app/routes/admin/orders/index.tsx` listed as an `alert(` offender.
      - Typecheck: `npx tsc --noEmit -p packages/web` reports **one pre-existing** error in this file, `orders/index.tsx(272,15) TS2322` in the `updateSearch` navigate callback — present on `main`, untouched by this diff (the diff only removes an import line and the button JSX). No new type errors.

      **Out of scope, worth a ticket**: the same file still calls blocking `prompt()` (status update at ~line 293, refund reason at ~line 341) and `confirm()` (cancel order at ~line 326). Identical harness-freezing hazard, but the ticket scoped the guard to `alert(`, so the source guard does not yet fail on them. Widening that regex is the natural follow-up once those three flows get inline UI.
