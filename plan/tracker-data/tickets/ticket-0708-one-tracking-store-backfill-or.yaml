  - id: 1
    action: write-test
    description: Write the failing test asserting the migration's shape and its safety properties
    file: packages/api/tests/database/order-shipments-backfill.test.ts
    command: cd packages/api && bunx vitest run tests/database/order-shipments-backfill.test.ts
    expected_result: FAIL
    status: pending
    code: |
      /**
       * The customers who could never track their parcel.
       *
       * Every order whose tracking was typed into the old admin screen has it in
       * `orders.shipping_details` and no `order_shipments` row, so
       * `GET /api/tracking/*` answered `tracking: null`. Fixing the writer does not
       * reach them — the data has to move.
       *
       * Asserted as TEXT, like every migration test here: the suite has no live
       * database and a mocked one would be testing the mock.
       */

      import { describe, it, expect } from 'vitest'
      import { readFileSync } from 'node:fs'
      import { resolve } from 'node:path'

      const MIGRATION = resolve(
        __dirname,
        '../../src/database/migrations/0028_backfill_order_shipments.sql'
      )
      const sql = readFileSync(MIGRATION, 'utf8')
      const body = sql.replace(/^\s*--.*$/gm, '')

      describe('the old tracking data reaches the store the customer reads', () => {
        it('inserts into order_shipments from orders', () => {
          expect(body).toMatch(/insert\s+into\s+"?order_shipments"?/i)
          expect(body).toContain('shipping_details')
        })

        it('is idempotent by construction, not by luck', () => {
          // A migration that is only accidentally idempotent gets run twice by
          // someone who does not know that.
          expect(body.toLowerCase()).toContain('not exists')
        })

        it('skips orders that already have a live shipment', () => {
          expect(body.toLowerCase()).toMatch(/voided_at"?\s+is\s+null/)
        })

        it('carries a tracking handle or is not worth a row', () => {
          // An empty shipment tells the customer nothing the order status does not,
          // and it would occupy the live-shipment slot a real label needs.
          expect(body).toMatch(/trackingNumber|awbNumber/)
          expect(body.toLowerCase()).toContain('is not null')
        })

        it("defaults carrier to 'Unknown' rather than dropping a real tracking number", () => {
          // NOT NULL, and there is nobody to ask in a migration. The interactive path
          // refuses instead; here the alternative is losing the data.
          expect(body).toContain("'Unknown'")
        })

        it('uses no enum value added by 0026 — so the batch order cannot matter', () => {
          // #580: a value added by ALTER TYPE cannot be used in the same transaction,
          // and on a fresh database every pending migration is one batch. Sticking to
          // pre-existing values sidesteps it rather than depending on ordering.
          for (const added of ['undelivered', 'rto_initiated', 'rto_delivered', "'lost'", "'cancelled'"]) {
            expect(body, `${added} was added by 0026`).not.toContain(added)
          }
        })

        it('leaves the source column alone', () => {
          // Not cleared, not dropped. That is what makes this re-runnable if the
          // mapping turns out wrong.
          expect(body.toLowerCase()).not.toMatch(/drop\s+column/)
          expect(body.toLowerCase()).not.toMatch(/set\s+shipping_details\s*=\s*null/)
        })
      })
