  - id: 3
    action: implement
    description: Hand-write the backfill migration and register it in the journal
    file: packages/api/src/database/migrations/0028_backfill_order_shipments.sql
    status: pending
    code: |-
      -- order-dispatch-tracking phase 3: move the tracking nobody could read.
      --
      -- `PATCH /admin/orders/:id/shipping` wrote `orders.shipping_details` for months
      -- while `GET /api/tracking/*` read `order_shipments`, so every customer whose
      -- tracking was typed into the admin screen saw `tracking: null`. Fixing the
      -- writer does not reach them; the rows have to move.
      --
      -- IDEMPOTENT BY CONSTRUCTION. The NOT EXISTS below means a second run inserts
      -- nothing. Say so out loud: a migration that is only accidentally idempotent
      -- gets run twice by somebody who does not know that.
      --
      -- The SOURCE COLUMN IS NOT TOUCHED. `orders.shipping_details` keeps its data
      -- and keeps its column. If this mapping turns out wrong, deleting the inserted
      -- rows and re-running is the whole recovery; a migration that moved and then
      -- destroyed would leave nothing to re-run against.
      --
      -- USES NO VALUE ADDED BY 0026. `pending`, `shipped` and `delivered` are all
      -- pre-existing, so this cannot trip #580 whatever order the batch runs in.

      INSERT INTO "order_shipments" (
        "order_id",
        "carrier",
        "tracking_number",
        "tracking_url",
        "awb_number",
        "external_shipment_id",
        "status",
        "shipped_at",
        "delivered_at",
        "estimated_delivery_at",
        "notes"
      )
      SELECT
        o."id",
        -- NOT NULL, and there is nobody to ask inside a migration. The interactive
        -- path refuses a missing carrier; here the alternative is dropping a real
        -- tracking number on the floor.
        COALESCE(NULLIF(o."shipping_details" ->> 'carrier', ''), 'Unknown'),
        NULLIF(o."shipping_details" ->> 'trackingNumber', ''),
        NULLIF(o."shipping_details" ->> 'trackingUrl', ''),
        NULLIF(o."shipping_details" ->> 'awbNumber', ''),
        NULLIF(o."shipping_details" ->> 'shipmentId', ''),
        CASE
          WHEN o."delivered_at" IS NOT NULL THEN 'delivered'
          WHEN o."shipped_at" IS NOT NULL THEN 'shipped'
          ELSE 'pending'
        END::"public"."shipment_status",
        o."shipped_at",
        o."delivered_at",
        (NULLIF(o."shipping_details" ->> 'estimatedDelivery', ''))::timestamp,
        'Backfilled from orders.shipping_details by migration 0028'
      FROM "orders" o
      WHERE
        o."shipping_details" IS NOT NULL
        -- A row with no handle at all tells the customer nothing the order status
        -- does not, and it would occupy the live-shipment slot a real label needs.
        AND COALESCE(
          NULLIF(o."shipping_details" ->> 'trackingNumber', ''),
          NULLIF(o."shipping_details" ->> 'awbNumber', ''),
          NULLIF(o."shipping_details" ->> 'shipmentId', '')
        ) IS NOT NULL
        AND NOT EXISTS (
          SELECT 1
          FROM "order_shipments" s
          WHERE s."order_id" = o."id"
            AND s."voided_at" IS NULL
        );
