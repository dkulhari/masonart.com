ticket_number: 708
title: One Tracking Store - Backfill orders.shipping_details into order_shipments
description: |-
  ## Task
  Every order whose tracking was entered through the old admin screen has its carrier and tracking number in `orders.shipping_details` and no `order_shipments` row. Those customers have been unable to track their parcels. Fixing the writer does not help them — the data has to move.

  Write a migration that opens an `order_shipments` row for every order that has usable `shipping_details` and no live shipment.

  ## Context
  Part of feature: order-dispatch-tracking
  Phase: Phase 3 — One tracking store

  `orders.shipping_details` is the SOURCE and is left intact. Not cleared, not dropped. That is what makes this re-runnable if the mapping turns out wrong, and it is why the column survives this pass.

  Idempotent by construction: the insert is guarded by `NOT EXISTS` against a live shipment on the same order, so running it twice inserts nothing the second time. State that in the file — a migration that is only accidentally idempotent gets run twice by someone who does not know that.

  `carrier` is NOT NULL. Unlike the interactive path, there is nobody to ask here, so a row with a tracking number and no carrier gets `'Unknown'` — the alternative is dropping a real tracking number on the floor. Rows with NO tracking handle at all are skipped: an empty shipment tells the customer nothing the order status does not.

  The `shipping_details` shape is `OrderShippingDetails` in `packages/api/src/database/schema/orders.ts:61` — `carrier`, `trackingNumber`, `trackingUrl`, `awbNumber`, `shipmentId`, `estimatedDelivery`, `shippedAt`, `deliveredAt`. All optional.

  This migration writes `status`, so it must NOT share a batch with `0026`, which adds enum values — keeping it to pre-existing values (`pending`, `shipped`, `delivered`) sidesteps #580 entirely. Do that rather than relying on batch ordering.
