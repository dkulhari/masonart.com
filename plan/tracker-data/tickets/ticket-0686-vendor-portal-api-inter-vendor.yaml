    text: |-
      ✅ **Completed**

      **Commit**: `493ffa4d` — feat(api): let vendors despatch and receive a parcel, blind to each other

      **Files Changed**:
      - `packages/api/src/lib/vendor-scope.ts` — `listVendorTransfers`, `getVendorTransfer`, `createVendorTransfer`, `markVendorTransferReceived`; the seven-field projection plus a caller-relative `direction`; nine new refusal codes
      - `packages/api/src/routes/vendor.ts` — the four routes, still zero database imports
      - `packages/api/tests/routes/vendor/transfers.test.ts` — new, 38 tests
      - `packages/api/tests/routes/vendor/isolation.test.ts` — 4 `ROUTE_TABLE` entries, 3 allow-list additions, per-route row overrides, and a widened `unscopedReads`
      - `packages/api/tests/lib/vendor-scope.test.ts` — the four new exports enrolled in the account

      **Summary**

      `GET /transfers`, `GET /transfers/:id`, `POST /transfers`, `POST /transfers/:id/received`.

      - **B is told seven fields and no eighth.** `direction` is a SQL `case` over the caller's own id, so neither vendor column is ever selected — it answers "is this coming to me", never "who is at the other end".
      - **The two ends cannot borrow each other's write.** Both the receipt's locked read and its UPDATE name `to_vendor_id` (so the sender gets a 404, not a 403); the insert takes `from_vendor_id` from the session. `to_vendor_id` is derived from `order_consolidation` joined off the caller's own job.
      - **`cost_amount` has no field in either direction** — `.strict()`, so an attempt is a 400 rather than a dropped field.
      - **The parcel and its jobs move together.** Insert the transfer → insert the links → *evaluate* `open-transfer-or-order-label` against the parcel that now exists → move the jobs with the predicate repeated. One transaction, so neither half can exist without the other.
      - **The order id never enters the process.** Written through a scoped SQL sub-select; "one order" is a `count(distinct)`. Verified the generated SQL renders as valid Postgres (`cost_amount` takes `default`).
      - **Audit**: `.dispatched` / `.received` share `tx` and carry the job ids + docket; refusals are written outside it; a 404 gets no row.

      **Three allow-list silences closed** (constraint 5): `production_transfers` → `SCOPED_TABLES` with `unscopedReads` now judging a WRITE by the row it binds (an insert has no WHERE, so the old rule could only call every insert unscoped or invisible — it chose invisible); `production_transfer_jobs` → `JOB_KEYED_TABLES`, whose gate now reads JOINs and accepts a scoped parcel; and **`orders`** → `ORDER_KEYED_TABLES`, joined by the despatch guard since #684 but unreachable from the route table until now — the table holding the most customer data on this boundary had been unexamined for two tickets.

      **Verification**:
