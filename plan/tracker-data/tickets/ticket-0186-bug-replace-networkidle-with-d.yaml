ticket_number: 186
title: 'Bug: Replace networkidle with domcontentloaded in all admin E2E tests'
description: |-
  ## Issue
  Admin pages have ongoing network activity (polling, heartbeats) that prevents networkidle from resolving, causing intermittent 30s timeouts across admin-products, admin-orders, admin-dashboard, admin-auth tests.

  ## Fix
  Replaced all networkidle with domcontentloaded in admin test files. Tests use explicit element assertions that auto-wait for content to appear.

  ## Files Changed
  - tests/e2e/admin-products.spec.ts
  - tests/e2e/admin-orders.spec.ts
  - tests/e2e/admin-dashboard.spec.ts
  - tests/e2e/admin-auth.spec.ts
