ticket_number: 448
title: Re-point product-listing.spec.ts at the redesigned collection page
description: |-
  ## Task

  `tests/e2e/product-listing.spec.ts` fails ~24 cases against selectors the #404–#419 redesign removed. Verified while working #421: these are stale tests, not app bugs. Left alone they make the suite unreadable — a real regression on this page would land in a sea of red that everyone has learned to ignore.

  `tests/e2e/collection-page-remainder.spec.ts`, written against the redesign, passes clean. That is the model.

  ## Context

  Each category checked against current source, not guessed:

  - **Card title / price** (2 cases) — spec wants `a[href^="/posters/"] h3`. `ProductCard.tsx:134-142` renders `<p><Link>{product.title}</Link></p>`; there is no `h3` on the card any more.
  - **Sort from URL** (4 cases) — spec wants `aside button:has-text("Price: Low to High")`. Sort left the filter sidebar for the toolbar pill in #416; `SORT_OPTIONS` now lives in `CollectionToolbar.tsx` and the sidebar has no sort control at all.
  - **Active filter tags** (6 cases) — spec scopes `text=Active filters:` to `div.hidden.lg\:block`. The label still exists (`routes/posters/index.tsx:1009`) and the desktop wrapper is at `:737`, but #419 moved the toolbar out of the products column; re-check the scoping rather than assuming the label is gone.
  - **"Special" filters section** (5 cases) — `FACET_GROUPS` (`packages/shared/src/constants/facets.ts:210`) is ten groups and none of them is Special. **This one is a decision, not a cleanup**: `isAiGenerated` and `isFeatured` are still in the search-param contract, the API still filters on them, and `ActiveFilterTags` still renders a Featured tag — but no sidebar control produces either any more. Either re-home the two toggles or delete the tests deliberately; do not quietly drop coverage for a filter that is still in the URL contract. Ask before choosing.
  - **Mobile filter sheet** (2 cases), **accessible filter sidebar header**, **navigate from home page category link** — re-verify individually against the current markup.
  - **Performance** (3 cases) — likely flake rather than staleness: "should render header quickly" failed in the full run and passed on a targeted re-run. Confirm before touching thresholds.

  ## Constraints

  - Fix the selectors, do not weaken the assertions. A test that now only checks `toBeVisible()` on a wrapper div is worse than the failing one it replaced.
  - New `data-testid`s are fine where the markup genuinely has no stable handle (`collection-toolbar` was added for exactly that reason in #421). Do not add one to dodge a selector that could just be correct.
  - Run with `--no-deps`: the `auth.setup` project fails on the local dev instance and blocks the whole chromium project otherwise.

  ## Acceptance

  `bunx playwright test tests/e2e/product-listing.spec.ts --project=chromium --no-deps` is green, or any remaining case is `test.skip` with a comment naming the ticket that removed the feature it covered. The Special-filters question is answered explicitly in a ticket comment either way.
