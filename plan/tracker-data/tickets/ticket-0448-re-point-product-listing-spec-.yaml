    text: |-
      ✅ **Completed**

      **Commit**: `4cef51d4` - test(e2e): re-point the product listing spec at the redesigned collection page

      **Files Changed**:
      - `tests/e2e/product-listing.spec.ts` — 37 failing cases repaired, 2 turned into `test.fixme` against new bug tickets, 5 dead-UI cases moved to URL-level coverage

      **Summary**:

      Started at 77 passed / 37 failed. Ends at 111 passed / 0 failed / 2 fixme.

      **The vocabulary was most of it.** `?styles=abstract` fails validation since #395 — `abstract` is a SUBJECT; styles are `minimalist-art`, `pop-art`, … So every test built on it was asserting against an *unfiltered* page: no chip, no clear-all, no narrowed grid. Two more of the same kind: `orientation=portrait` is still the parameter but the rail labels it "Vertical" (#415), and a chip renders the raw id with hyphens spaced (`minimalist art`), not the label. All of it now comes from constants at the top of the file rather than being spelled out per test.

      **Re-pointed to where things moved**: sort to the toolbar pill and its in-place panel (#416); the rail's missing "Filters" heading (#415) — the test now asserts the *absence*, since that removal is deliberate parity, and the drawer keeps its own; card title to `<p><Link>` and price to the column beside it rather than inside the product anchor; the count to "N products" in the toolbar.

      **Three were failing on their own merits, not staleness**: `has-text("Color")` also matched the "Colorful Art" discover chip (exact role name fixes it); Colors is one of the four groups open by default, so the test that clicked its header to "expand" it was closing it; and four describes navigated with plain `goto`, so clicks landed on server-rendered HTML before hydration — `networkidle` fixes those.

      **Special filters** — per your call, the five dead-UI cases became URL-level coverage of `isAiGenerated` / `isFeatured` under "URL State", including one that checks `isFeatured` actually narrows the count rather than merely surviving the URL. The sidebar block now asserts the section is *gone*, so the #415 decision is pinned.

      **`should render header quickly`** was measuring Vite compiling the route on first hit — 3.1s of build, not of page. It warms the route, then measures a reload.

      **Two bugs found, both filed, both `fixme` rather than papered over**:
      - **#452** — every home category tile links `?styles=<slug>` with pre-#395 slugs (`abstract`, `nature`, `minimalist`, `typography`); none is a valid style id, so the four busiest entry points into /posters land on a collection that cannot filter by what the tile promised.
      - **#453** — `activeFilterCount` (routes/posters/index.tsx:592) omits `isFeatured`, `vibe`, `aesthetic`, `medium`, `uniqueness` and `availability`. That sum gates the entire chip row and the mobile badge, so filtering by any of them narrows the grid with no visible reason. Verified in the browser: `?isAiGenerated=true` chips; `?isFeatured=true` shows nothing, while the API filters correctly.

      Repointing either test at something that passes would have made the suite green and left both bugs in place.

      **Verification**:
      - Command: `bunx playwright test tests/e2e/product-listing.spec.ts tests/e2e/collection-page-remainder.spec.ts tests/e2e/header-reveal.spec.ts --project=chromium --no-deps --workers=2`
      - Result: PASS — 134 expected, 0 unexpected, 2 skipped (the two `fixme`s above)
      - `product-listing.spec.ts` alone: 111 passed, 0 failed, 2 fixme
      - Note on `--workers=2`: at the default worker count the dev server saturates and unrelated cases fail on 18s page loads. That is machine contention, not the page — the same run at 2 workers is clean. Worth knowing before anyone reads a full-parallel run as a regression.
