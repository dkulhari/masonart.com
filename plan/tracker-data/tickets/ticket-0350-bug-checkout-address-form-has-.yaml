      **Test-location note**: covered by a component test rather than E2E. `/checkout` short-circuits to "Your cart is empty" without a seeded cart, and seeding a guest cart cross-origin (web :4321 → api :3000) fails on session cookies — a test-infra problem unrelated to these attributes. The component test asserts the rendered markup, which is exactly what browser autofill heuristics read, and needs no server. The E2E spec I first wrote was removed rather than left failing.

