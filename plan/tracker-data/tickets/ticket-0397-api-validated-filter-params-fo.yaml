ticket_number: 397
title: API - validated filter params for the new facets, and facet counts for them
description: |-
  ## Task

  Teach `GET /api/products` and `GET /api/products/facets` about the new metadata.

  1. **Filter params** — `vibe`, `aesthetic`, `medium`, `uniqueness`, `availability`, alongside the existing comma-separated array filters.
  2. **Validate against the shared vocabularies.** Today the array params are `z.string().optional()` and every value is interpolated into a postgres literal by `sql.raw` with hand-rolled quote escaping (~`products.ts:167`). Validating against a closed vocabulary makes that structurally safe and turns a typo into a 400 rather than a silently empty result set.
  3. **Facet counts** — extend `/api/products/facets` to cover the new facets.

  ## Context

  Feature: product-metadata-facets
  Blocked by the schema ticket.

  **Constraints**
  - Existing callers pass `styles=a,b`. Validation must accept that shape, not require an array.
  - An unknown value is a 400 with a useful message. Silently ignoring it is worse: the shopper sees an unfiltered grid and believes it was filtered.
  - The facets endpoint is cached (`CacheKeys.PRODUCT + "facets"`). Adding facets changes the payload shape — the cache key must change with it, or a stale entry serves the old shape after deploy.
  - **Route tests mock `db`**, so they cannot catch a bad column. Add schema assertions and verify against the real database (the #387 lesson).
