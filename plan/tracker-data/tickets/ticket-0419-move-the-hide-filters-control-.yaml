    text: |-
      ✅ **Completed**

      **Commit**: `946e5927` — feat(web): put the Hide filters pill at the head of the rail it collapses

      **Files Changed**:
      - `packages/web/app/routes/posters/index.tsx` — CollectionToolbar moves out of the products column and spans both columns; rail sticky offset picks up the toolbar's 5rem
      - `packages/web/tests/routes/posters-toolbar-placement.test.ts` — new, 5 tests

      **Summary**:
      Measured mesonart at 1440px first (headless Chromium, computed boxes) rather than reading the screenshot:

      ```
      .page-width.facet-topbar   x=0    w=1440  h=56   spans BOTH columns
        .facet-wrapper > button  x=48   w=176   h=56   "Hide filters"
        "3906 products"          x=262
        sort control             x=1130 w=262
      "Style" (first facet head) x=48   y=903          directly beneath it
      first product card         x=408                 grid clears the rail
      ```

      That changed the shape of the fix. Their pill is **not** nested inside the rail — it heads a full-width row the count and sort share, and its left edge is the rail's left edge. Clicking it leaves the button at x=48 (before and after) while the facets vanish and the grid reflows to x=48.

      So the toolbar moved out of the products column instead of the button moving into the `<aside>`. Nesting it would have matched the picture and broken the behaviour: the aside is `lg:hidden` once filters are hidden, so the only way back would have gone with it.

      Ours now measures the same way: toggle x=20 (container gutter) before and after, count x=202, sort flush to the right margin, cards reflowing 352 → 20.

      **Interaction with #421** (in flight in a parallel session): the rail's sticky offset went from `calc(var(--chrome-offset)+1rem)` to `+5rem` — the toolbar's own height, a 56px pill inside `py-3`. Now that the bar passes over this column, a rail pinned any higher scrolls under a translucent bar. Measured at 1440: toolbar pins at 64, rail at 144, flush. That one line of #421's uncommitted work rode along in this commit because this change rewrote it; the rest of #421 (Header.tsx, CollectionToolbar.tsx, globals.css, header-reveal.spec.ts) is untouched and still uncommitted.

