    text: |-
      ✅ **Completed**

      **Commit**: `60769492` — feat(web): sticky generate bar on the mobile create page

      **Files Changed**:
      - `packages/web/app/routes/create/index.tsx`

      **Implementation**: option 1 from the ticket — a sticky bottom bar on mobile carrying the generate action plus a readout of the selected style and aspect ratio, mirroring the "Apply Filters" affordance on `/posters`. It also solves the no-feedback problem: previously nothing on screen confirmed a style had registered.

      An `IntersectionObserver` hides the bar whenever the inline button is genuinely on screen, so the two never appear together — the bar is a way to reach the action early, not a duplicate CTA. Disabled state and wallet-balance gating are shared with the inline button. `pb-24 md:pb-0` on the page wrapper reserves room so the bar never covers content.

      **Verification** (390×844, local dev):
      - At `scrollY: 0` (inline button ~2700px away) → bar visible, showing "Wabi Sabi / Portrait", Generate correctly disabled on an empty prompt
      - Scrolled to the inline button (`scrollY: 2258`, in view) → sticky bar removed from the DOM
      - Screenshot confirms placement and readout
      - Web suite 1362/1362; typecheck 26 errors = `main` baseline

      Desktop layout untouched (`md:hidden`).
