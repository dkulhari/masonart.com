ticket_number: 356
title: "UX: /create 'Generate Poster' CTA sits 3.2 screens down on mobile"
description: |-
  ## Problem

  On the AI generator page the primary action — **Generate Poster** — sits at y=**2726px** on a 844px-tall viewport, i.e. **3.2 full screens** below the fold. The user must scroll past 15 style-preset cards laid out 2-across and then the aspect-ratio selector before the button that actually does the thing comes into view.

  **Verified on production chobii.art at 390x844, 2026-07-28.** Page height 4702px; CTA computed `position: static` (not sticky).

  There is no persistent affordance — once the user scrolls into the preset grid, nothing on screen indicates how to proceed or that a selection has been registered.

  ## Suggested fix

  Make the generate action reachable from anywhere in the flow. Options, roughly in order of preference:
  1. **Sticky bottom action bar** on mobile showing the current selection (style + ratio) with the Generate button — mirrors the 'Apply Filters' pattern already used well in the `/posters` filter drawer
  2. Collapse the preset grid to a horizontally-scrolling row or a 'show all' expander so the CTA moves near the fold
  3. Duplicate the CTA above the preset grid

  Option 1 matches an existing pattern in this codebase and also solves the no-feedback problem.

  ## Acceptance criteria

  - Generate action is reachable without hunting, from any scroll position on mobile
  - Current style + aspect-ratio selection is visible alongside it
  - Desktop layout is not regressed
