ticket_number: 34
title: Admin Panel - Review Moderation Dashboard
description: |-
  Create admin dashboard for review moderation following existing admin panel patterns.

  ## Implementation Details

  ### Route Location
  `packages/web/app/routes/admin/reviews.tsx`

  ### Components

  **AdminReviewsPage**
  - Page layout matching other admin pages
  - Stats cards at top (pending, approved, rejected, today)
  - Filterable review list below
  - Bulk actions support

  **ReviewRow (inline component)**
  - Product name with external link
  - Author avatar and info
  - Star rating display
  - Content preview with expandable details
  - Status badge
  - Quick approve/reject buttons
  - Action menu with delete option

  **Reject Modal**
  - Moderator notes textarea
  - Confirm/Cancel buttons

  **AdminReviewFilters (inline)**
  - Status filter pills (all, pending, approved, rejected)
  - Search input for product/author

  ### Features Implemented
  - Stats cards with real-time counts (pending, approved, rejected, today)
  - Pending count badge on filter pill
  - Bulk approve/reject selected reviews
  - Row selection with select all
  - Expandable rows for full content view
  - Quick approve/reject on pending reviews
  - Moderator notes on rejection
  - Search by product or author
  - Pagination with prev/next
  - Delete review functionality

  ### Navigation
  - Added "Reviews" to admin sidebar with MessageSquare icon
  - Stats cards link to filtered views

  ## Acceptance Criteria
  - [x] Admin-only access enforced (via parent /admin route)
  - [x] Stats dashboard with pending count
  - [x] Filter and search functionality
  - [x] Quick approve/reject workflow
  - [x] Moderator notes tracked
  - [ ] E2E tests passing (deferred to ticket #35)
  - [x] Matches existing admin panel styling
