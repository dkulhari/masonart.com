    action: write-test
    description: 'Write failing tests for the shared ConfirmDialog primitive: resolves true on confirm, false on cancel, false on Escape, restores focus to the trigger, and renders as an aria-modal dialog.'
    file: packages/web/tests/components/admin/confirm-dialog.test.tsx
