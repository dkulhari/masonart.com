    text: |-
      ✅ **Completed**

      **Commit**: `cf331ff6` - feat(api): give imported products their size ladder

      **Files Changed**:
      - `packages/api/src/database/import-catalogue.ts` — `buildVariantRows`, `syncVariants`, transaction around product+ladder, `variantsPlanned`/`variantsWritten` on the report, header docs
      - `packages/api/tests/database/import-catalogue-variants.test.ts` — new, 6 tests

      **Summary**:
      Every imported row now gets the full size ladder for its orientation, priced off its own `basePrice`, through `buildVariantsForOrientation`. Product and ladder are written in one transaction.

      **The upsert-vs-replace decision — the ticket got this wrong and the code corrects it.**

      The ticket said delete-then-insert "is simpler and is fine before launch". That is not safe, and the reason is in the schema:

      ```
      cart_items.variant_id    ON DELETE CASCADE   (packages/api/src/database/schema/cart.ts:153)
      order_items.variant_id   ON DELETE SET NULL  (packages/api/src/database/schema/orders.ts:351)
      ```

      Deleting a variant to re-insert an identical one silently empties every customer cart holding that size, and severs order history from the row it was bought as. Neither raises an error. And nothing stops the script being re-run after launch — a re-import to fix a `seoTitle` is *most likely* when the shop is live. So: matched on `variantSku`, updated in place. Rows keep their ids, and everything pointing at them survives.

      Two consequences, both deliberate:
      - A size that leaves the ladder is **deactivated**, not deleted — same reason.
      - `stockQuantity` / `isInStock` are never touched on an existing row. The ladder's stock numbers are a seeding curve; once live, the admin's figure is the measurement.

      **Unladdered orientations fail the row.** `round` and `set-of-2-3` return `[]` from the ladder. The seeder falls back to portrait (`seed.ts:1694`); copying that would price and size a round poster for a rectangle it is not, in the one setting where nobody would notice. Checked *before* the row counts as validated, so `--dry-run` refuses a catalogue that would import as unbuyable.

      **Verification**:
      - Command: `cd packages/api && bunx vitest run tests/database/import-catalogue.test.ts tests/database/import-catalogue-media.test.ts tests/database/import-catalogue-variants.test.ts`
      - Result: PASS (14 tests, 14 passing — 6 new)
      - Command: `cd packages/api && bun run typecheck`
      - Result: PASS (src + tests, clean)
      - Command: full api suite, `VITEST_MAX_WORKERS=2`
      - Result: **1 failed | 5948 passed | 187 skipped**. The pre-change baseline measured earlier today was 5942 passing with the same single failure (`tests/database/shipping.test.ts`, `shipment_status` enum drift from #703/#706). 5942 + 6 new = 5948. No regressions.

      **Live proof against the dev database** (two disposable `ZZTEST-` products, deleted afterwards):

      ```
      rows validated 2 | created 2, updated 0, media skipped 0, failed 0
      variants written 26 of 26 planned
      ```
      - `SELECT count(*) FROM products p WHERE NOT EXISTS (SELECT 1 FROM product_variants v WHERE v.product_id = p.id)` → **0**, the check the ticket asked for.
      - Set `stock_quantity = 777` on `ZZTEST-1-12x12`, then re-ran the same manifest: `created 0, updated 2, variants written 26 of 26`.
      - Counts after re-run: still **13 / 13**. No duplication.
      - **md5 of the variant ids, ordered — identical before and after: `c260a49db0fcd56b6c0dd8292507bbeb`.** This is the real proof it upserts rather than delete-and-reinsert; the rows carts would point at are the same rows.
      - Stock after re-run: **777**, preserved.
      - Test rows removed; dev DB back to 0 products without variants.

      **CLI output** now reports purchasability separately from row counts:
      ```
      [dry run] rows validated 2 | created 0, updated 0, media skipped 0, failed 0
      [dry run] variants that would be written: 34
      ```
      and on an unladdered row:
      ```
      ! row 2 RND-1: No size ladder for orientation "round", so this product would have
        nothing to sell. Give it a laddered orientation (square, portrait, landscape, panoramic).
      ```

      **Incidental finding**: the #672 orientation guard works against real artwork. The first real-import attempt was rejected — `The artwork measures square, but this row declares portrait` — because I had guessed orientations for the seed-media files. That is the guard doing its job; the manifest was wrong, not the code.

      **Left alone**: images uploaded by the two test imports remain as orphan objects in the local MinIO `poster-app-dev` bucket. Dev-only, harmless, and cleaning them would mean deleting from R2 by key — out of scope here.
