ticket_number: 719
title: Give imported products their size ladder — the importer creates nothing purchasable
description: |-
  ## Task

  `db:import-catalogue` (#672, commit `d17c1c5b`) creates products with their full image set and **zero variants**. A product with no rows in `product_variants` has no size to pick and no price to charge — the PDP renders, the size list is empty, and nothing can go in a cart. So the go-live catalogue load currently produces a storefront of things that cannot be bought.

  `bun run seed` is the only thing that builds ladders today, and it is dev-only: it walks its own hardcoded `sampleProducts` array, so it cannot ladder a product that arrived any other way.

  Teach `packages/api/src/database/import-catalogue.ts` to build each imported product's ladder.

  ## The ladder already exists — call it, do not rebuild it

  `buildVariantsForOrientation(orientation, basePrice)` (`packages/api/src/database/seed-variants.ts:107`) returns the whole `Omit<NewProductVariant, 'productId'>[]` for one product: sizes from the shared ladder, dual-unit labels, `priceForSize` scaling off the product's own base price, stock and sort order. It is the single source of truth and it is tested.

  The seed's own call site (`seed.ts:1694-1721`) is the shape to copy, including the variant sku:

  ```
  variantSku: `${sku}-${widthInches}x${heightInches}`
  ```

  Do **not** write a second ladder. `seed-variants.ts` exists precisely because a hand-written copy in `seed.ts` had already drifted from the shared one and silently won — see its header comment.

  ## The part that needs real thought: re-running

  #672 is idempotent on `sku`, and this must be too — but `variantSku` is **not unique in the schema** (`packages/api/src/database/schema/products.ts:222` is a plain `text("variant_sku")`, no unique constraint). Nothing at the database level stops a second import from doubling every product's size list. A catalogue re-imported three times to fix a typo would offer each poster its ladder three times over, at identical prices, and the PDP would render all of them.

  So the importer owns this. Decide and implement one of:

  - Replace the product's variants when it rebuilds them (delete-then-insert inside a transaction), or
  - Upsert per `variantSku`, leaving stock alone.

  The second preserves `stockQuantity` that has drifted from the seeded default, which matters once the catalogue is live and someone has been editing stock in the admin. The first is simpler and is fine before launch. Pick one, and say in the code comment which and why.

  Mirror #672's `--force-media` shape: an existing product's variants should not be silently rebuilt on every re-run, because rebuilding reprices. A re-import to fix a `seoTitle` must not quietly reprice the catalogue.

  ## Orientations with no ladder

  `LADDERED_ORIENTATIONS` (`seed.ts:23`) is `square | portrait | landscape | panoramic`. The manifest also accepts `round` and `set-of-2-3`, and `buildVariantsForOrientation` returns `[]` for both.

  The seeder's answer is to **fall back to portrait** (`seed.ts:1694`). Do not copy that here. A round poster sold against a portrait ladder is priced and sized for a rectangle it is not, and an unattended bulk load is exactly where that goes unnoticed. Fail the row and report it — the operator can then decide, the same way the orientation guard already works in #672.

  ## Constraints

  - **`--dry-run` still writes nothing.** It should report how many variants each row *would* get, so the pre-flight tells the operator the catalogue will actually be purchasable before the real run.
  - **Per-row isolation holds.** A row whose ladder cannot be built fails alone; the rest still import.
  - Variants belong in the same transaction as the product, so a failure halfway cannot leave a product with a partial ladder.

  ## Verification worth doing

  Beyond unit tests, the thing that actually proves this: import a manifest, then check no product has zero variants —

  ```sql
  SELECT count(*) FROM products p
  WHERE NOT EXISTS (SELECT 1 FROM product_variants v WHERE v.product_id = p.id);
  ```

  must be 0, and re-running the same manifest must leave the variant count unchanged.

  ## Context

  - Blocked by nothing; #672 is done and on `main`.
  - `packages/api/tests/database/import-catalogue.test.ts` and `import-catalogue-media.test.ts` are the existing test files to extend. Run them with `cd packages/api && bunx vitest run tests/database/<file>` — the repo-root form does not work, the root vitest config only includes `tests/**`.
  - `priceForSize` and `getSizesForOrientation` live in `@chobii/shared`; the importer should reach them only through `buildVariantsForOrientation`.
