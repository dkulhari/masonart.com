ticket_number: 270
title: Add health check endpoint at /api/health with component status
description: |-
  ## Task
  Create a `GET /api/health` endpoint that reports the health of all critical dependencies. Required by hosting platforms for readiness/liveness probes.

  ## Requirements
  - Return JSON with overall status and individual component checks
  - Components to check: PostgreSQL connectivity, Redis connectivity, BullMQ queue status
  - Return 200 if all healthy, 503 if any component unhealthy
  - Response format:
    ```json
    {
      "status": "healthy",
      "timestamp": "2026-02-18T08:30:00.000Z",
      "version": "1.0.0",
      "uptime": 12345,
      "components": {
        "database": { "status": "healthy", "latency_ms": 5 },
        "redis": { "status": "healthy", "latency_ms": 2 },
        "queue": { "status": "healthy", "active_jobs": 0 }
      }
    }
    ```
  - No authentication required (public endpoint)
  - Lightweight — no heavy queries, just connectivity checks

  ## Files to Create/Modify
  - `packages/api/src/routes/health.ts` (new)
  - `packages/api/src/index.ts` (register route)

  ## Related
  - Existing ticket #245 (health check response format) — this supersedes it
