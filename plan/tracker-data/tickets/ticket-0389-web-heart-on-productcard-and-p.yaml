ticket_number: 389
title: Web - heart on ProductCard and ProductDetail, count badge in the header
description: |-
  ## Task

  Wire the affordances.

  **`ProductCard`** — a heart in the existing content block. Per analysis §1.3.6 mesonart puts it right of the star row, below the image. We have no star row yet (that lands with `collection-page-parity`), so the heart goes right-aligned in the content row for now, sharing the line with the title/price block.

  **`ProductDetail`** — `ProductDetail.tsx:406` already renders a button with `aria-label="Add to wishlist"` and no handler. Wire it; make the label reflect state (`Add to`/`Remove from`).

  **`Header`** — count badge on a new wishlist link, matching the cart badge treatment already there.

  ## Context

  Feature: wishlist (mesonart parity, PLAN-OF-ACTION feature 1)
  Blocked by the store ticket.

  **Hard constraints**
  - **Monochrome.** Filled heart is `text-foreground` / `fill-foreground`, outline is `text-muted-foreground`. NOT red — `tests/styles/storefront-token-compliance.test.ts` fails the build on anything outside the palette, and `--sale` is reserved for sale prices.
  - **The grid-alignment contract (#360–#375).** `ProductCard`'s row alignment is CSS-grid stretch plus `grow` on the content block, with deliberately no `min-height` and no `line-clamp`. The heart must not add either. `tests/components/product/ProductCard.tokens.test.ts` asserts this.
  - **Header badge must be hydration-gated**, same as the cart count (#498).
  - **Signed-out users**: the heart prompts sign-in rather than silently failing. No guest wishlist — that is out of scope.
  - Accessible name must change with state, and the control needs `aria-pressed`.
