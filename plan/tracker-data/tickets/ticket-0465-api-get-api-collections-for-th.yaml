    text: |-
      ✅ **Completed**

      **Commit**: `95dfbc22` — feat(api): GET /api/collections for the Discover rail

      **Files Changed**:
      - `packages/api/src/routes/collections.ts` — new. `GET /` with `?discover=true`.
      - `packages/api/src/lib/collection-imagery.ts` — new. `assignRepresentatives` (pure), `representativesFor`, `candidateDepth`, `mainImagesByProductId` (for #466).
      - `packages/api/src/lib/redis.ts` — added `CacheKeys.COLLECTION`.
      - `packages/api/src/index.ts` — mounted at `/api/collections`.
      - `packages/api/tests/routes/collections.test.ts` (8), `packages/api/tests/lib/collection-imagery.test.ts` (7).

      **A real bug caught by reading the live endpoint, not by a test**

      First live response served **12 distinct images across 14 chips** — `new`, `best-selling` and `bohemian-art` all showed the same artwork.

      Cause: `CANDIDATES_PER_COLLECTION = 5`, inherited from #406 where twelve style chips drew on ~40 products. Latest Work and Best Sellers resolve to the *entire* catalogue, so their shortlists were identical to each other and overlapped every style collection's. Both exhausted their five and hit the `shortlist[0]` fallback, landing on a product `bohemian-art` had already claimed.

      Fixed with `candidateDepth(cohortSize) = max(5, cohortSize)`. A collection can lose at most `cohort - 1` candidates to those picking before it, so a shortlist of `cohort` guarantees a free pick. Verified against the live database: **14 of 14 distinct**.

      A regression test now covers the shape (`finds a free candidate when only the head of the shortlist is taken`). Worth noting the original test suite passed with the bug present — the pure assignment was correct all along; the shortlist feeding it was too short.

      **⚠️ The running dev API on :3000 is serving stale code**

      `bun run --hot src/index.ts`, up 26 hours, does not re-evaluate `src/lib/collection-imagery.ts`. It picked up the *new* route and mount fine, but keeps the old lib module:

      | | distinct images |
      |---|---|
      | module invoked directly (bun, same DB) | **14 of 14** ✅ |
      | HTTP `:3000` after cache bust + touch | 12 of 14 ❌ |

      Not a code problem — the same inputs give the right answer off the filesystem. **#469 and #470 need this process restarted before any browser verification**, or they will be checking month-old module state. Left running rather than killed, because other sessions are using it.

      **Design note carried into the payload**: `imageIsMatted` is on the wire because the client cannot infer it, and `orientation` is nulled when the admin supplied the image. Getting this wrong means scaling an unmatted upload by the mat-compensation factor and cropping into it.

      **Verification**
      - Command: `cd packages/api && npx vitest run tests/routes/collections.test.ts tests/lib/collection-imagery.test.ts`
      - Result: PASS — 15 tests, 0 failing
      - Wider run `tests/routes/collections.test.ts tests/routes/product-collections.test.ts tests/lib/`: 427/428. The one failure is `tests/lib/redis.test.ts > should set and get string value`, a live-Redis round-trip. **Pre-existing and flaky**: checked out `redis.ts` at HEAD and the same suite failed **5** tests; with this change it fails 1. My diff adds a constant to `CacheKeys` and cannot affect `setCached`/`getCached`.
      - Build: `npx tsc --noEmit` — 0 errors in the new modules

      **Repo hazard hit while working**: `packages/web/app/routeTree.gen.ts` was left `UU` (unmerged) by a concurrent session, which breaks `git stash` and any index write. Committed with `git commit -- <paths>` so the other session's staged files were not swept in.
