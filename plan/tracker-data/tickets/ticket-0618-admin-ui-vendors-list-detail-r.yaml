ticket_number: 618
title: Admin UI - vendors list, detail, rate card editor and nav wiring
description: |-
  ## Task
  `/admin/vendors` list, `/admin/vendors/new`, `/admin/vendors/$id` with contacts, capabilities and the rate card editor. Nav entry wired into both places that must agree.

  ## Context
  Feature: vendor-management. Phase 5 of 7. Depends on Phase 3.

  Routes live in `packages/web/app/routes/admin/`. Follow the existing `admin/products` directory for structure.

  **Four rules these screens must not break** — all four come from the admin consistency audit, and every one of them is a defect present in the existing admin:
  1. **No native `confirm()` / `alert()`.** Use the inline two-step pattern established by `ReviewMediaStrip` (`reviews.tsx:269` documents why: native dialogs block the automation harness outright). Nine admin files violate this today, which is why those destructive paths have no E2E coverage at all.
  2. **Skeleton, empty AND error states on every list.** Only 4 of 13 existing admin lists have all three.
  3. **List state in the URL via `validateSearch`.** REPO HAZARD: `router.tsx` overrides TanStack's search serialisation, so the schema MUST coerce numbers and split comma-joined arrays — otherwise the route error-boundaries to a blank page. `ADMIN_PRODUCTS_SEARCH` in `app/lib/admin-nav.ts` is the precedent for defaults that external links must spell out.
  4. **Paginate from day one.** The collections and frames list endpoints have no LIMIT today; vendor jobs will outgrow both.

  **Nav wiring** goes into `components/admin/AdminSidebar.tsx` AND `app/lib/admin-nav.ts` TOGETHER — that pairing is the repo's stated guard against route/nav drift, and #603 exists because it was bypassed. Vendors is operational, so it belongs in the primary nav list, not the Settings group. Do NOT add these paths to `CONTENT_MANAGER_ALLOWED_PREFIXES`: payables and vendor cost are admin data.

  Rate card editor: effective dating is a first-class field, not an advanced toggle. Surface the 422 overlap response by naming the conflicting band inline on the offending row.
