    text: |-
      ✅ **Completed**

      **Commit**: `3402b848` - test(e2e): start the gift card checkout tests from an empty cart

      **Files Changed**:
      - `tests/e2e/gift-cards.spec.ts` — `checkoutWithAnItem` now deletes the cart before seeding, and asserts the cart holds exactly one line instead of more than zero

      **Root Cause**: a dirty shared cart, not a client-side stall

      The instrumentation the previous comment asked for answered the question on the second try. In a stalled run the page console printed:

      ```
      [#661] handlePayment catch: Error: Payment gateway not configured
      ```

      So the success path never ran, and `navigate()` was never reached — both of the previous session's suspects were wrong.

      `POST /api/orders/:id/payment/initiate` returned **503**. The order it was refusing:

      | line | qty | line total |
      |---|---|---|
      | Synthetic Nature (poster) | 2 | 3398.00 |
      | Gift card — ₹2,500 | 1 | 2500.00 |

      total **5898.00**, against **1699.00** on every passing run.

      These tests share one signed-in customer, so they share one server-side cart, and it outlives the browser context Playwright throws away between tests. A gift card line left by "buying a gift card alongside a poster" was still there. Gift card tender is capped to exclude gift card lines (#579), so the card could not cover an order containing one; the remainder was genuine, the server wanted a gateway, dev has none, and the 503 rolled the debit back. The client's catch called `syncCartWithServer()`, the cart was already emptied by order creation, and the page swapped to the empty-cart panel — on `/checkout`, with nothing wrong in the trace.

      Which is also why it looked like a load problem. It is a cross-test ordering problem; load only changed how often the tests interleaved.

      **Location**: `tests/e2e/gift-cards.spec.ts:102` (`checkoutWithAnItem`), cap at `packages/api/src/routes/orders.ts:1120`

      **Fix**: `DELETE /api/cart` through the page's own origin before seeding, then poll for exactly one line. A leftover now fails loudly at the seeding step instead of quietly changing what the order costs.

      **Verification**:
      - Command: `SKIP_E2E_SERVER=true E2E_BASE_URL=http://localhost:4321 E2E_API_URL=http://localhost:3010 bunx playwright test tests/e2e/gift-cards.spec.ts --project=chromium --retries=0`, 5 rounds, with `DATABASE_URL=…5440… bunx vitest run tests/routes` looping alongside, load average 10-16
      - Result: PASS — 13 passed in each of 5 rounds, `TOTAL_FAILED_ROUNDS=0`
      - Before: the same harness failed **2 of 4** rounds on this test, both with the 503 above
      - Also green: 4 further rounds run with the instrumentation still in place
      - Typecheck: `turbo run typecheck` clean (pre-commit gate); 0 errors attributable to the spec under `tests/tsconfig.json`

      **Filed from this work**:
      - **#665** (high) — the real customer-facing defect underneath: checkout shows ₹0 due when the cart holds a gift card line, because the tender cap exists only on the server, and the resulting 503 presents as an empty cart.
      - **#666** — a separate, pre-existing flake seen once in 9 rounds: the admin liability test asserts a delta on a *global* figure while parallel workers issue cards.
