      ✅ **Completed** — commit `d662af04`

      **Root cause**: the button was removed deliberately by `f72c9b81` (#604) — it was wired to `alert('Export functionality coming soon')`, so it exported nothing and its blocking native dialog froze E2E runs that clicked near it. `packages/web/app/routes/admin/orders/index.tsx:478` already carries a comment saying no Export button belongs there. The assertion outlived the button.

      **Fix**: assertion deleted, replaced in place by a comment explaining why there is no Export test — the next person to notice the gap should find the reasoning rather than re-add it. If orders export comes back as a real feature it needs its own ticket and a test against a real download.

