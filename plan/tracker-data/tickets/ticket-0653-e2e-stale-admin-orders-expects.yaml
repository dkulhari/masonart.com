title: E2E stale - admin-orders expects the Export button that was deliberately removed
description: |-
  ## Finding
  Workflow testing 2026-08-17: `tests/e2e/admin-orders.spec.ts` fails **1 of 127** — `should display Export button`.

  `f72c9b81` dropped that button on purpose: it only opened an `alert()`. The spec was not updated, so the suite now fails for doing the right thing.

  ## Fix
  Delete the assertion. If order export is still wanted as a feature, it needs its own ticket and its own test — not a resurrected button that does nothing.
