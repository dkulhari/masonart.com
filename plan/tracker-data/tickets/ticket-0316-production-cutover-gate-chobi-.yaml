ticket_number: 316
title: Production Cutover Gate - chobi.art domain external registrations
description: |-
  ## Task
  Checklist ticket for the future chobi.art production domain cutover — every item is an exact-hostname external registration that will NOT carry over from chobi.xtoms.xyz:

  1. **Domain**: purchase chobi.art, create Cloudflare zone, add tunnel public hostname (the *.xtoms.xyz wildcard does NOT cover it)
  2. **Razorpay**: swap rzp_test_ → rzp_live_ keys; RE-REGISTER webhook against https://chobi.art (webhooks do not follow redirects — silent payment-callback failure otherwise); new RAZORPAY_WEBHOOK_SECRET
  3. **Resend**: verify chobi.art sending domain (SPF + DKIM) — unverified domain causes silent 500s on signup; switch EMAIL_FROM from noreply@xtoms.xyz to the branded domain
  4. **Sentry**: SENTRY_ENVIRONMENT=production for the new stack
  5. **SEO**: 301 redirect router chobi.xtoms.xyz → chobi.art (pattern from customs #160 app.→customs. rename)
  6. **R2/CDN**: decide whether production gets its own bucket (chobi-prod) per .env.example

  ## Context
  Part of feature: chobi-external-services
  Blocked on: domain purchase (user decision). Sources: docs/EXTERNAL-SERVICES.md, claude-mem #4872/#4874. Keep staging permanently on Razorpay test mode per docs/GO-LIVE-PLAN.md.
