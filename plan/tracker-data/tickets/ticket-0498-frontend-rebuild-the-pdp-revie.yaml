ticket_number: 498
title: Frontend - rebuild the PDP review section on ReviewGrid and retire ReviewMediaWall
description: |-
  ## Task

  Collapse the PDP's two review surfaces into one. `ReviewMediaWall` (media-only tiles) and `ProductReviews` (written list) become a single product-filtered `ReviewGrid` under the Loox header row.

  This is the ticket that deletes the invented split.

  ## Context

  Part of feature: review-grid-loox-parity
  Phase: Frontend
  Depends on: ReviewGrid, and the /reviews rebuild landing first

  - Reference: `docs/design/mesonart/mesonart-pdp-reviews-loox.png`. Header row is star row + "66 Reviews" + chevron + "Write a review" pill, then the grid, then "Show more reviews".
  - PDP is `packages/web/app/routes/posters/$slug.tsx`. It currently mounts `ReviewMediaWall` above `ProductReviews`.
  - DELETE `packages/web/app/components/product/ReviewMediaWall.tsx` and its test file once nothing imports it. Check with grep before deleting, not after.
  - `ProductReviews.tsx` may still be needed for the write-a-review entry point and the rating summary — read it before assuming it can go. Retire only what the grid genuinely replaces; leaving a dead component is better than breaking the review-submission path, which #493 already showed is easy to sever.
  - The buy-box star row links down to the review section. Verify that anchor still lands correctly after the restructure.
  - Keep the `preload="none"` / no-autoplay video assertions from #488 alive — they moved into the grid's tests, they must not simply vanish with the deleted file.
  - vitest gotcha: stub localStorage/sessionStorage in `vi.hoisted` above the imports if you hit `setItem is not a function`.
