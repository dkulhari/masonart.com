    text: |-
      ✅ **Completed**

      **Commit**: `be0e16c2` — feat(web): collapse the PDP's two review surfaces into one ReviewGrid

      **Files Changed**:
      - `packages/web/app/components/product/ProductReviewSection.tsx` (new) — the unified section: `id="reviews"`, sr-only "Customer Reviews" h2, Loox header row, product-filtered `ReviewGrid`, plus a matching skeleton for the route's pendingComponent
      - `packages/web/app/components/reviews/ReviewSectionHeader.tsx` (new) — the header row lifted out of `routes/reviews.tsx` so the PDP and /reviews render ONE component. `scopeLabel` is the only difference ("for this poster" vs "across the catalogue")
      - `packages/web/app/routes/posters/$slug.tsx` — mounts `ProductReviewSection`; `ReviewMediaWall` and `ProductReviews` no longer mounted
      - `packages/web/app/routes/reviews.tsx` — uses the shared header, re-exports it as `ReviewsHeader` so #497's tests still resolve
      - `packages/web/app/components/reviews/ReviewGrid.tsx` — regains the wall's focus-return-to-trigger
      - `packages/web/app/components/reviews/index.ts`, `ReviewMediaLightbox.tsx` (stale prose)
      - **Deleted**: `app/components/product/ReviewMediaWall.tsx` + `tests/components/product/ReviewMediaWall.test.tsx`
      - **New tests**: `tests/routes/posters-review-section.test.tsx` (13), `tests/components/reviews/ReviewMediaLightbox.test.tsx` (8), +1 in `ReviewGrid.test.tsx`

      **Summary**:
      The invented split is gone. One product-filtered grid under the Loox header row — media-bearing and text-only reviews in the same masonry (5 columns on a PDP vs 6 unfiltered), "Show more reviews" at the foot.

      Care taken on the three flagged hazards:

      1. **Review-submission path preserved.** `ProductReviews.tsx` owned the only "leave a review" link on the PDP ("Purchased this item? Leave a review from your order history"). The header row's "Write a review" pill is now that link, pointing at the same `/account/orders`. Asserted directly. `ProductReviews.tsx` is **left in place, unmounted** rather than deleted — a live tokens test (`ProductCard.tokens.test.ts:43`) still reads it, and per the ticket a dead component beats a severed path.
      2. **Grepped before deleting.** Nothing imported `ReviewMediaWall`; the new suite asserts the file is gone AND that no file under `app/` mentions it, so a dangling import cannot come back silently. The `preload="none"` / no-autoplay assertions were verified present in `ReviewGridCard.test.tsx:223` before removal. **But** the old test file was also the only coverage of the shared `ReviewMediaLightbox` (focus trap, Escape, arrow keys, not a native `<dialog>`) — that would have vanished with it, so those moved into a new `ReviewMediaLightbox.test.tsx`. The wall's focus-return-to-trigger was a real behaviour the grid lacked; added to `ReviewGrid` with a test rather than dropped.
      3. **Anchor verified.** `id="reviews"` moved onto the new `<section>`, with the grid inside it. Note for the record: the buy-box star row in `ProductDetail.tsx:302-313` is **not** an anchor link today — it is a plain display div, and the only `href="#"` in the app is the skip-link. So `#reviews` is a target with no in-page link pointing at it; the target survives, and the e2e locators (`page.locator('#reviews')`) still resolve. Worth a look in #499 if the star row was meant to link down.

      **Verification**:
      - Command: `cd packages/web && bunx vitest run tests/routes/posters-review-section.test.tsx tests/components/reviews/ReviewMediaLightbox.test.tsx tests/components/reviews/ReviewGrid.test.tsx tests/components/reviews/ReviewGridCard.test.tsx tests/routes/reviews.test.tsx`
      - Result: PASS (5 files, 68 tests, 68 passing, 0 failing)
      - Output:
      ```
       ✓ tests/routes/reviews.test.tsx (17 tests) 543ms
       ✓ tests/routes/posters-review-section.test.tsx (13 tests) 714ms
       ✓ tests/components/reviews/ReviewGridCard.test.tsx (17 tests) 196ms
       ✓ tests/components/reviews/ReviewGrid.test.tsx (13 tests) 370ms
       ✓ tests/components/reviews/ReviewMediaLightbox.test.tsx (8 tests) 154ms
       Test Files  5 passed (5)
            Tests  68 passed (68)
      ```
      - Wider sweep: `bunx vitest run tests/components/reviews tests/components/product` → 22 files, 465 passed, 0 failed.
      - Type-check: `bunx tsc --noEmit` → 22 pre-existing errors, all in `admin/*`, `track/*`, `ai-generator/PromptSuggestions.tsx`. **Zero errors reference any file this ticket touched, created or deleted** — grep for `ReviewMediaWall|ProductReviewSection|ReviewSectionHeader|ReviewGrid|ReviewMediaLightbox|routes/reviews|posters/$slug|ProductReviews` over the output returns nothing. No dangling references to the deleted component.

      **Left red on purpose**: `tests/e2e/review-surfaces.spec.ts` — the "PDP customer media wall" describe block (4 assertions on `review-media-wall` / `review-media-tile` / the "pictures above prose" ordering) is now testing a surface that no longer exists. Left for #499's sweep as instructed. Also unrelated and pre-existing: `tests/routes/home-tokens.test.ts` and `tests/routes/wishlist-page.test.ts` fail from another agent's concurrent edits to `globals.css` / `routes/index.tsx` / `ProductCard.tsx` in the shared working tree — those files are not in this commit.
