ticket_number: 147
title: 'Bug: Active filter tag click doesn''t update URL'
description: |-
  ## Issue
  Clicking an active filter tag to remove it updates the client-side React state but doesn't call `navigate()` to update the URL.

  ## Test
  `tests/e2e/product-listing.spec.ts` - "should remove individual filter on tag click"

  ## Steps to Reproduce
  1. Go to `/posters?styles=abstract,minimalist`
  2. Click the "abstract" filter tag to remove it
  3. URL remains `/posters?styles=abstract,minimalist` (should become `/posters?styles=minimalist`)

  ## Root Cause
  The `onFiltersChange` callback in the active filter tags component only updates local state without calling TanStack Router's `navigate()` function.

  ## Expected Behavior
  URL should update to reflect the removed filter, maintaining SEO-friendly URL state.

  ## Fix Location
  `packages/web/app/routes/posters/index.tsx` - the handler passed to filter tag removal needs to call `navigate()` similar to how filter selection works.

  ## Related
  This is the same pattern as the pagination fix - need to sync URL state with filter changes.
