    text: |-
      ✅ **Completed**

      **Commit**: `076ec6dc` - fix(ui): Mobile filter sheet leaves visible backdrop for close tap

      **Files Changed**:
      - `packages/web/app/routes/posters/index.tsx` - Changed sheet width from `w-full max-w-sm` to `w-[85vw] max-w-sm` so backdrop is visible on narrow viewports
      - `tests/e2e/product-listing.spec.ts` - Unskipped backdrop click test, updated click position to target visible backdrop area

      **Summary**:
      The mobile filter sheet used `w-full` which made it 375px on a 375px viewport, covering the entire screen with no visible backdrop to tap for dismissal. Changed to `w-[85vw]` (318.75px on 375px viewport) leaving ~56px of visible backdrop on the left side that users can tap to close the sheet. The `max-w-sm` (384px) cap is preserved for larger mobile viewports.

      **Tests**: E2E test passes 5/5 across all browsers (chromium, firefox, webkit, Mobile Chrome, Mobile Safari). Full product-listing spec: 567 passed.
