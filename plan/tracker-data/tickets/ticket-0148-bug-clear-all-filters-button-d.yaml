ticket_number: 148
title: 'Bug: Clear all filters button doesn''t update URL'
description: |-
  ## Issue
  Clicking "Clear all" filters button updates the client-side React state but doesn't call `navigate()` to update the URL.

  ## Test
  `tests/e2e/product-listing.spec.ts` - "should clear all filters on Clear all click"

  ## Steps to Reproduce
  1. Go to `/posters?styles=abstract&orientation=portrait`
  2. Click "Clear all" button in filter sidebar
  3. URL remains `/posters?styles=abstract&orientation=portrait` (should become `/posters`)

  ## Root Cause
  The `clearAllFilters` callback in ProductFilters.tsx only calls `onFiltersChange` with empty filters, without navigating to update the URL.

  ## Expected Behavior
  URL should reset to `/posters` (no query params) when clearing all filters.

  ## Fix Location
  `packages/web/app/routes/posters/index.tsx` - need to add a `handleClearFilters` function that:
  1. Clears local filter state
  2. Calls `navigate({ to: '/posters', search: {} })`

  ## Related
  Same pattern as filter tag removal bug - URL state needs to sync with filter changes.
