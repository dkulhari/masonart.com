    content: |
      Investigation found the application code was correct - handleFiltersChange in posters/index.tsx already calls navigate().
      The actual issue was test timing: tests weren't waiting for React hydration before interacting with filter components.
      Fixed by adding waitUntil: 'networkidle' to page.goto() and appropriate timeouts to URL assertions.
      Test now passes across all browsers.
