    text: |-
      ✅ **Completed**

      **Commit**: `f37ff783` — feat(web): give the vendor portal a shot-list uploader and a verdict banner

      **Files Changed**
      - `packages/web/app/routes/vendor/jobs/$id.tsx` — the shot-list uploader, the verdict banner, the presign/PUT/complete client, the blob-backed photo display, and the page wiring
      - `packages/web/app/lib/vendor-nav.ts` — `VENDOR_PHOTO_UPLOAD_STATUSES` / `vendorMayUploadPhotos`, derived from the shared matrix
      - `packages/web/tests/routes/vendor/vendor-screens.test.tsx` — 56 new tests
      - `packages/web/tests/routes/vendor/no-customer-data.test.tsx` — 3 new tests, extending the pollution over the photo panel

      **What landed against each hard constraint**

      1. **Submit is enabled only when every required slot is live.** The guard's evidence is computed from the entries the panel is *rendering* rather than from the response's `missingRequiredSlots`, so the button and the tiles cannot disagree — a submit greyed out beside a shot list that looks complete is the same "refusal you cannot act on" one layer up. Before the photos are read the guard is left **absent**, which `nextVendorActions` treats as unknown and leaves the move live; #691 documented that rule and it is the right one, since the API evaluates the guard either way. When the API refuses anyway, `patchVendorJobStatus` now keeps the refusal body instead of flattening it into a sentence — `VendorJobWriteError` carries `missingSlots`, and the strip renders them as `QC_SHOT_LIST[].label` plus the raw key.
      2. **Re-upload supersedes.** No `DELETE` is issued on the replace path (asserted directly over the fetch calls), and `supersededPhotoId` is *announced* — the API's own comment says a silently swapped thumbnail hides that the earlier row is still on file, so the slot says so.
      3. **Direct to R2.** presign → PUT → complete, `review-media.ts`'s pattern. The PUT carries no credentials and no header but `Content-Type` (the signature is the auth). `complete` runs only after a successful PUT — a row for an object that never landed is QC evidence of nothing. Content type and size are refused in the browser before a presign is spent, in the API's own wording.
      4. **R2 / the DOM.** `QcPhotoImage` fetches the bytes and renders them from a local `blob:` URL rather than putting the presigned URL in `src`. The admin panel's `<img src={photo.url}>` is deliberately *not* copied: `no-customer-data.test.tsx` bans `X-Amz-Signature` from this screen's `innerHTML`, and it is right to — a signed URL in the markup is a capability sitting in every screenshot and bug report a vendor ever files. A failure (R2 CORS, an expired signature, a `url: null` from R3 failing closed) says so in words and is never answered with a link carrying the signature. The suite's two new mechanical assertions — no `iframe`/`embed`/`object`, no signature in `innerHTML` — are made over the whole job screen with a photograph actually rendered, so neither passes vacuously.
      5. **Defect chips on a fail.** One chip per defect, not a comma-joined sentence. The banner shows the *latest* verdict (sorted, not `reviews[0]` — showing the wrong row means telling a vendor to redo approved work). A fail arriving with no defect gets a sentence: the API refuses one, so an empty chip row would be a regression tell, and it would read as "we found nothing wrong", inverting the verdict.
      6. **No native dialogs.** Withdrawal uses the existing `InlineConfirm`; the portal-shape test that greps for `confirm(`/`alert(` still passes.
      7. **Skeleton, empty and error on the list.** The skeleton and the error render *alongside* the slots rather than instead of them — the shot list is knowable without the request, and an empty panel during a load tells a print shop nothing is asked of them. Only a stage whose shared shot list is genuinely empty gets the empty state.

      **One design note worth carrying forward**: the upload window is derived, not listed. `vendorMayUploadPhotos` filters the shared matrix for statuses with a vendor `shot-list-complete` out-edge — the same computation `QC_PHOTO_UPLOAD_STATUSES` makes in `packages/api/src/lib/production-transitions.ts`. Repeating `['received']` here would be the third copy of the state machine.

      **Verification**
      - Command: `bunx vitest run tests/routes/vendor/vendor-screens.test.tsx tests/routes/vendor/no-customer-data.test.tsx` (from `packages/web`)
      - Result: PASS — `Test Files 2 passed (2)` / `Tests 149 passed (149)`. Baseline before this ticket was 90, so 59 new tests.
      - Command: `bun run typecheck` (packages/web) → clean. The pre-commit hook also ran the workspace typecheck: 4 packages, 4 successful.

      **Mutation evidence (the assertions can fail)**
      26 mutations applied one at a time to the source, suite run, reverted. **26/26 went red.**

      The first pass had 3 survivors, and reporting them matters more than the score:
      - *"a pass shows defect chips too"* — survived because the pass fixture had `defects: null`, so the mutant fell into the same branch. A pass carrying a stale defect list would have rendered red chips under "we approved this job" with nothing catching it. Added a test for exactly that.
      - *"the photograph is embedded in an `object` element"* — my mutation was dead code and never executed. Rewritten to actually swap `<img>` for `<object>`; four tests then went red.
      - *"the upload window is a hardcoded `['sent']`"* — **a real gap.** Every picker test passed `canUpload` explicitly, so nothing exercised `vendorMayUploadPhotos` at all and a stale literal survived untouched. Closed with a property written from a different vantage point than the derivation — the window is open exactly when the guarded submit is on offer, over every status — plus two screen-level tests (a `received` job shows a picker per slot; a `dispatched` one shows none and says why).

      Representative kills: dropping `missingSlots` from the 422 → 1 red; routing the PUT through our API → 1 red; issuing a DELETE before the presign → 3 red; putting the signed URL in `src` → 4 red across both suites; treating an unread shot list as incomplete → 34 red.
