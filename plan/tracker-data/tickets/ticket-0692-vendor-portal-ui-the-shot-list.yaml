    text: |-
      **Derived implementation steps** (TDD, red before green on every one)

      Read first: #691 (`2bdacf65`) rebuilt the action strip; `nextVendorActions(status, guards)` already renders a disabled button + `blockedReason` for a `shot-list-complete` guard it knows is `false`. Nothing about the action vocabulary gets re-derived here — this ticket only supplies the evidence for that guard and adds two panels.

      Design decisions taken before writing code:

      1. **The shot list's STRUCTURE comes from `QC_SHOT_LIST` in shared; the PHOTOS come from `GET /photos`.** Merged client-side exactly as `qcShotEntries` merges them server-side, so every slot renders while the photos are still loading or after they fail — a vendor has to know what to shoot even when we cannot tell them what they already shot. An `onShotList: false` photo from the API is appended, never dropped (`slot` is `text` with no enum under it).
      2. **The signed download URL is NEVER put in `src`.** `no-customer-data.test.tsx` bans `X-Amz-Signature` from `innerHTML`, and the admin screen's `<img src={photo.url}>` is not copyable here for that reason. The photo is fetched as bytes and rendered from a `blob:` object URL, revoked on unmount. Bytes still come straight from R2; the signature lives in a variable, not the DOM. No `iframe`/`embed`/`object` anywhere.
      3. **The 422 is surfaced, not swallowed.** `patchVendorJobStatus` currently throws `new Error(body.error)` and drops `missingSlots`. It gets a typed error carrying the parsed body, and the refusal renders the missing slots as the vendor's own words (`QC_SHOT_LIST[].label`) beside the raw key.
      4. **The upload window is derived, not listed.** `QC_PHOTO_UPLOAD_STATUSES` in the API is `STATUS_VALUES.filter(from => some edge with guard 'shot-list-complete' and actor 'vendor')`. The web side derives the same set off the same shared matrix rather than repeating `['received']` — #684 is the standing lesson on what a literal costs.

      Steps:

      - [ ] 1 [write-test] uploader renders every slot of `QC_SHOT_LIST` for the job's stage, required badges included — asserted against the shared constant, not a list restated in the test
      - [ ] 2 [write-test] submit is disabled until every required slot is live; `guards['shot-list-complete']` stays ABSENT while the photos have not loaded (unknown must not disable a legal move)
      - [ ] 3 [write-test] a 422 renders the missing slot names
      - [ ] 4 [write-test] re-upload: presign → PUT → complete, no DELETE issued, new photo shown, `supersededPhotoId` announced as "the earlier one stays on file"
      - [ ] 5 [write-test] verdict banner renders defect chips on a fail, nothing on a pass
      - [ ] 6 [write-test] no `iframe`/`embed`/`object` in the container and no `X-Amz-Signature` in `innerHTML`, over the polluted fixture with photos and a failed verdict
      - [ ] 7 [write-test] skeleton / empty / error on the photo list, error winning
      - [ ] 8 [verify-fail] all of the above red for the right reason
      - [ ] 9 [implement] `vendorMayUploadPhotos` in `lib/vendor-nav.ts` (derived); `VendorQcShotList`, `QcVerdictBanner`, `SignedPhoto`, the three fetchers and the page wiring in `routes/vendor/jobs/$id.tsx`
      - [ ] 10 [verify-pass] both vendor suites green, `bun run typecheck` clean
      - [ ] 11 [mutation] mutate each new assertion, watch it go red, revert, report the count
      - [ ] 12 [commit] staged by explicit path
