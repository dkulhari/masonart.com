ticket_number: 711
title: One Tracking Store - The two production label guards read order_shipments
description: |-
  ## Task
  Two production-pipeline guards ask "does this order carry a shipping label" of `orders.shipping_details`:

  - `packages/api/src/lib/vendor-scope.ts:991` — `ORDER_HAS_LABEL`, a SQL fragment coalescing `awbNumber`, `trackingNumber` and `shipmentId` out of the jsonb.
  - `packages/api/src/routes/admin/production-jobs.ts:713` — `orderShippingLabel()`, feeding `despatchEvidence()`, which decides whether a job may take the `dispatched` edge on the basis `open-transfer-or-order-label`.

  After this phase nothing writes that jsonb. Both silently start answering "no label", and the `dispatched` edge becomes untakeable for any order whose only evidence was the label — a pipeline with no way to despatch, which `lib/production-transitions.ts` calls "an edge nothing in the codebase can take".

  This is not optional cleanup. It moves in the same pass or production breaks.

  ## Context
  Part of feature: order-dispatch-tracking
  Phase: Phase 3 — One tracking store

  **R1 is preserved exactly.** `ORDER_HAS_LABEL` is a BOOLEAN on the vendor boundary and stays one: the AWB is a courier's handle on a customer's parcel and no vendor-facing projection may name it. The vendor needs the answer, never the value. `despatchEvidence` is admin-side and may keep naming the label in its `detail` — that is an audit payload, not a vendor projection.

  No seam violation: these read `order_shipments`, a table. Neither imports anything named `shiprocket`, so the reverse scan in `tests/lib/production-seam.test.ts:203` stays green. `vendor-scope.ts` is `lib/vendor-*` and not covered by that scan at all, but do not give it a reason to be.

  "Carries a label" means a LIVE shipment with a handle: `voided_at IS NULL` and at least one of `label_object_token`, `awb_number`, `tracking_number`. A voided label is not evidence that goods left.
