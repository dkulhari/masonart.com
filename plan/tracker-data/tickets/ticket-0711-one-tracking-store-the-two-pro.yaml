    status: pending
    code: |
      /**
       * "Does this order carry a label" — asked of the store that has the answer.
       *
       * Two guards asked it of `orders.shipping_details`. That jsonb stops being
       * written this phase, so both would answer `false` forever and the `dispatched`
       * edge would become untakeable: a pipeline with no way to despatch, which is
       * the failure `lib/production-transitions.ts` names as "an edge nothing in the
       * codebase can take".
       *
       * R1 is not relaxed by any of this. The vendor-facing guard stays a BOOLEAN —
       * the AWB is a courier's handle on a customer's parcel, and the vendor needs
       * the answer, never the value.
       */

      import { describe, it, expect, vi, beforeEach } from 'vitest'
      import { readFileSync } from 'node:fs'
      import { resolve } from 'node:path'
      import '../setup'

      const API_SRC = resolve(__dirname, '../../src')

      const recorder = await vi.hoisted(async () =>
        (await import('../helpers/query-recorder')).createQueryRecorder({ rows: 'repeatLast' })
      )
      vi.mock('../../src/database', () => ({ db: recorder.db }))

      describe('the vendor-facing guard', () => {
        beforeEach(() => recorder.reset())

        it('reads order_shipments, not the jsonb', () => {
          const src = readFileSync(resolve(API_SRC, 'lib/vendor-scope.ts'), 'utf8')
          const guard = src.slice(src.indexOf('ORDER_HAS_LABEL'), src.indexOf('ORDER_HAS_LABEL') + 900)

          expect(guard).not.toContain('shippingDetails')
          expect(guard).toMatch(/orderShipments|order_shipments/)
        })

        it('stays a BOOLEAN — R1 says no vendor projection names the AWB', () => {
          const src = readFileSync(resolve(API_SRC, 'lib/vendor-scope.ts'), 'utf8')
          expect(src).toContain('sql<boolean>')
        })

        it('does not count a VOIDED label as evidence goods left', () => {
          const src = readFileSync(resolve(API_SRC, 'lib/vendor-scope.ts'), 'utf8')
          const guard = src.slice(src.indexOf('ORDER_HAS_LABEL'), src.indexOf('ORDER_HAS_LABEL') + 900)
          expect(guard.toLowerCase()).toMatch(/voided_at|voidedat/)
        })
      })

      describe('the admin despatch guard', () => {
        beforeEach(() => recorder.reset())

        it('queries order_shipments when it looks for a label', async () => {
          // The `open-transfer-or-order-label` guard. Its second branch was the
          // jsonb read; it is the branch that keeps a consolidator able to despatch.
          recorder.queue([])
          recorder.queue([{ id: SHIPMENT_ID, awbNumber: 'AWB1', voidedAt: null }])

          await takeDispatchedEdge(JOB_ID)

          const sql = recorder.queries.map((q) => q.sql).join('\n')
          expect(sql).toContain('order_shipments')
          expect(sql).not.toContain('shipping_details')
        })

        it('refuses the edge when the only label on the order is voided', async () => {
          recorder.queue([])
          recorder.queue([])

          const result = await takeDispatchedEdge(JOB_ID)

          expect(result.satisfied).toBe(false)
        })
      })

      describe('the seam is untouched by any of this', () => {
        it('still imports nothing named shiprocket under lib/production-*', () => {
          // These guards read a TABLE. If a fix here ever reached for a carrier
          // client, tests/lib/production-seam.test.ts would say so — assert it here
          // too, beside the change that could cause it.
          const src = readFileSync(resolve(API_SRC, 'lib/production-readiness.ts'), 'utf8')
          expect(src.toLowerCase()).not.toMatch(/from ['"].*shiprocket/)
        })
      })
