  - id: 3
    action: implement
    description: Repoint the vendor-facing boolean guard
    file: packages/api/src/lib/vendor-scope.ts
    status: pending
    code: |-
      /**
       * Does the order carry a live shipping label?
       *
       * Asked as a BOOLEAN rather than fetched: the AWB is a courier's handle on a
       * customer's parcel, and R1 says no vendor-facing projection names it. The
       * vendor needs the answer, never the value — that part is unchanged.
       *
       * What changed is the STORE. This used to coalesce three fields out of
       * `orders.shipping_details`, which `order-dispatch-tracking` stopped writing:
       * the guard would have answered `false` for every order forever, and a
       * consolidator would never have been able to take the `dispatched` edge again.
       *
       * A VOIDED label is not evidence that goods left. It is evidence that a label
       * was bought and then killed.
       */
      const ORDER_HAS_LABEL = sql<boolean>`exists (
        select 1
        from ${orderShipments}
        where ${orderShipments.orderId} = ${orders.id}
          and ${orderShipments.voidedAt} is null
          and coalesce(
            ${orderShipments.labelObjectToken},
            ${orderShipments.awbNumber},
            ${orderShipments.trackingNumber}
          ) is not null
      )`
  - id: 4
    action: implement
    description: Repoint the admin despatch-evidence guard
    file: packages/api/src/routes/admin/production-jobs.ts
    status: pending
    code: |-
      // Delete `orderShippingLabel()` and the `OrderShippingDetails` import with it —
      // nothing else in this file uses either.
      //
      // In despatchEvidence(), the second branch reads the shipment instead:

        // The order already carries a label: the consolidator handed the goods to
        // the courier. `evaluateLabelReadiness` reads this same case as "dispatched
        // and on no inter-vendor transfer".
        //
        // LIVE only. A voided label is evidence a label was bought and then killed,
        // not evidence anything left the building.
        const [shipment] = await tx
          .select({
            id: orderShipments.id,
            awbNumber: orderShipments.awbNumber,
            trackingNumber: orderShipments.trackingNumber,
            labelObjectToken: orderShipments.labelObjectToken,
          })
          .from(orderShipments)
          .where(
            and(
              eq(orderShipments.orderId, job.orderId),
              isNull(orderShipments.voidedAt),
              or(
                isNotNull(orderShipments.labelObjectToken),
                isNotNull(orderShipments.awbNumber),
                isNotNull(orderShipments.trackingNumber)
              )
            )
          )
          .limit(1);

        // Admin-side, and the detail is an AUDIT payload rather than a vendor
        // projection — naming the handle here is what lets a dispute say WHICH label
        // the edge was taken on. R1 constrains the vendor boundary, not this one.
        const label = shipment
          ? (shipment.awbNumber ?? shipment.trackingNumber ?? shipment.id)
          : null;

        return label
          ? { satisfied: true, detail: { basis: "order_label", orderLabel: label } }
          : { satisfied: false, detail: { transferId: null, orderLabel: null } };
