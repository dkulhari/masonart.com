  - id: 1
    action: write-test
    description: 'Write the failing test: both guards read order_shipments and a voided label is not evidence'
    file: packages/api/tests/lib/order-label-guard.test.ts
    command: cd packages/api && bunx vitest run tests/lib/order-label-guard.test.ts
