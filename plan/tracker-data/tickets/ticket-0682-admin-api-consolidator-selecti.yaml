    timestamp: '2026-08-30T15:34:20.216Z'
    text: |-
      ✅ **Completed**

      **Commit**: `04dc6d82` — feat(api): let an order say who consolidates it, and why it cannot ship

      **Files Changed**:
      - `packages/api/src/routes/admin/production-jobs.ts` — the `orderId` filter on the queue, plus a second router (`adminOrderProductionApp`) holding `POST /api/admin/orders/:orderId/consolidator` and `GET /api/admin/orders/:orderId/production-readiness`
      - `packages/api/src/index.ts` — mounts that router on `/api/admin/orders`, beside `adminOrdersApp`
      - `packages/api/tests/routes/admin/production-jobs.test.ts` — 34 new tests

      **Summary**:
      - **`orderId` filter**: one field on `listQuerySchema`, one `eq()`, on both the page query and the COUNT (or `total` would describe a different set than `items`). `OrderProductionPanel.tsx` was NOT touched — it already sends `orderId`; #690 removes its scan.
      - **Consolidator**: the system proposes, an admin confirms. `decided_by IS NULL` is written only for `sole_vendor`; `frame_vendor` and `most_items` come back 422 `CONFIRMATION_REQUIRED` carrying the proposal, so an arbitrary choice can never reach the table claiming there was nothing to decide. Override refused 409 `TRANSFER_DISPATCHED` once the first transfer dispatched; confirming the SAME vendor after dispatch is still allowed (nothing is re-routed), and a FIRST decision is never an override or an order with goods in transit and no row would be permanently unlabelable. Re-confirming what already stands writes nothing and audits nothing.
      - **Readiness**: one `getOrderLabelReadiness(orderId)` call, returning `blockers` + `blockerCodes`. Nothing re-derived; the seam scan in `tests/lib/production-seam.test.ts` still passes because `isOrderReadyToLabel` is untouched. A missing order answers 200 with `order_not_found` rather than 404.
      - **Rules live in the lib**: `proposeConsolidator`, `consolidatorOverrideAllowed` and `loadOrderProductionSnapshot` are called, never re-implemented — the proposal is computed from exactly the rows the label gate later reads.
      - **Concurrency**: the ORDER row is read `FOR UPDATE` (the serialiser), the existing decision is read under the same lock, the predicate is repeated in the UPDATE's `WHERE`, and a row-count mismatch rolls back with `CONCURRENT_MODIFICATION`. `order_consolidation.order_id` is the primary key, so the database is what ultimately leaves one row.
      - **Audit**: `order.consolidator_set` shares the transaction on a write and is written OUTSIDE it on a refusal; `metadata.decision` is `system_default` or `admin_confirmed`, with `basis` (`sole_vendor` / `confirmed_proposal` / `admin_override`). Uses `consolidatorVendorId`, not `vendorId`, which `recordAudit` reserves.
      - Gated per PATH, not `use('*')`: this router shares its mount with `routes/admin/orders.ts`, and a `*` middleware would run the session lookup twice for that whole tree.

      **Verification**:
      - Command: `cd packages/api && npx vitest run tests/routes/admin/production-jobs.test.ts`
      - Result: PASS (136 tests, 136 passing, 0 failing — 34 new)
      - Also PASS: `npx vitest run tests/lib/production-seam.test.ts tests/lib/production-readiness.test.ts` (67 passing — the single-consumer scan is untouched)
      - Build: `bun run typecheck` — 4/4 tasks successful (api src + api tests + shared + web); the pre-commit gate passed on the commit itself
      - Mutation-checked, not just run: forcing `decidedBy = user.id` and disabling the override guard turned 5 of the new tests red, so they discriminate rather than merely execute
