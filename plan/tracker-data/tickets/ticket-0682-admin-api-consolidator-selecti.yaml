      **Implementation steps (derived, TDD order)**

      Everything lands in `packages/api/src/routes/admin/production-jobs.ts` + `tests/routes/admin/production-jobs.test.ts`, plus one mount line in `src/index.ts`.

      1. [write-test] `orderId` filter on GET /api/admin/production: only that order's jobs, condition renders `order_id`, and the column carries `production_jobs_order_id_idx`. Expect FAIL.
      2. [implement] one field on `listQuerySchema`, one `eq(productionJobs.orderId, orderId)` condition. Expect PASS.
      3. [write-test] POST /api/admin/orders/:orderId/consolidator — the three proposal rules (sole vendor / frame vendor / most items), decided_by NULL vs actor, 409 after the first transfer dispatched, 404s, CONCURRENT_MODIFICATION rollback, audit inside tx for a set and OUTSIDE for a refusal. Expect FAIL.
      4. [implement] second Hono app `adminOrderProductionApp` in the same file, mounted at `/api/admin/orders`. Uses `loadOrderProductionSnapshot` + `proposeConsolidator` + `consolidatorOverrideAllowed` from `lib/production-readiness.ts` — no rule is re-derived here. FOR UPDATE on the order row (the serialiser) and on the existing `order_consolidation` row; the predicate repeated in the UPDATE's WHERE; row-count mismatch rolls back.
      5. [write-test] GET /api/admin/orders/:orderId/production-readiness returns the blocker LIST with codes, not a bare boolean. Expect FAIL.
      6. [implement] one `getOrderLabelReadiness(orderId)` call, nothing re-derived.
      7. [verify] `npx vitest run tests/routes/admin/production-jobs.test.ts` from packages/api + `pnpm --filter @chobii/api typecheck`.
      8. [commit] stage only the three files by explicit path.

      Per-route `requireAuth, requireAdmin` on the two new routes rather than `use('*')`: a `use('*')` in a router mounted at `/api/admin/orders` also matches `adminOrdersApp`'s own routes and would run the session lookup twice for the whole admin orders tree.
