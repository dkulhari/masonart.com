title: "Ops: owner console setup + mini bootstrap execution"
description: |-
  Phase: Ops. Execute the no-code setup from docs/GO-LIVE-PLAN.md §3–§4 and docs/EXTERNAL-SERVICES.md. Mostly owner console work + hands-on-mini steps.

  Checklist:
  - Cloudflare: masonart.com zone Active; tunnel 'masonart' created, token → deploy/.env; TWO Published-application routes with ANCHORED path regex ^/api/.* ordered before catch-all; www → apex bulk redirect; dashboard shows exactly ONE connector replica (linux_arm64).
  - R2: bucket masonart-prod, versioning ON, scoped token, custom domain cdn.masonart.com; curl -sI a known object → 200.
  - Resend: domain verified (SPF/DKIM in the CF zone), prod API key, EMAIL_FROM=noreply@masonart.com.
  - 2Factor.in: prod key, DLT-approved sender ID + templates, balance check.
  - Razorpay TEST: rzp_test keys; webhook https://masonart.com/api/webhooks/razorpay (payment.captured, payment.failed, refund.processed + order events); secret via openssl rand -hex 32.
  - AI provider: Replicate/Google AI Studio key with billing limits set.
  - Sentry prod DSNs (api+web); Slack #prod-alerts webhook.
  - GHCR: two classic PATs; make login-remote on the mini; remove credsStore osxkeychain from mini's ~/.docker/config.json.
  - Mini: static DHCP reservation; wired Ethernet confirmed (cc #100 — Wi-Fi ran at 88% loss); mkdir /backups; install nightly pg_dump cron (OPERATIONS §2, 02:45 slot); docker stats headroom check after first deploy.
  - First boot: make build-push-deploy && make first-boot (migrate → seed → seed:admin), sign up, make admin-promote EMAIL=<owner>.

  Acceptance: every checklist line executed and recorded on this ticket; stack Up (healthy) on the mini pulling from GHCR.
  Lessons: cc #85, #88, #97 (anchored regex), #130 (autostart chain already installed host-wide).
