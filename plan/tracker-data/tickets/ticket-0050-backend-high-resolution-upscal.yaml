ticket_number: 50
title: Backend - High-Resolution Upscaling Service
description: |-
  ## Overview
  Allow users to upscale their selected AI generation to higher resolution.

  ## Endpoint
  **POST /api/ai/generations/:id/upscale**
  - Request body: { multiplier: 2 | 4 }
  - Only for completed generations with selected image
  - Returns upscaled image URL

  ## Upscaling Options
  1. **2x Upscale** - Double resolution (e.g., 1024→2048)
  2. **4x Upscale** - Quadruple resolution (e.g., 1024→4096)

  ## Provider Integration
  - FAL.ai Real-ESRGAN model for upscaling
  - Alternative: Replicate ESRGAN
  - Store upscaled image separately

  ## Pricing
  - 2x: 1.5x base generation cost
  - 4x: 2.5x base generation cost
  - Deduct from wallet before processing

  ## Implementation
  - Add upscaling service in packages/api/src/ai/upscaler.ts
  - Store upscaled URL in image data JSONB
  - Track upscale status (pending, completed, failed)

  ## Files to Create/Modify
  - packages/api/src/routes/ai.ts (upscale endpoint)
  - packages/api/src/ai/upscaler.ts (new service)
  - packages/api/src/database/schema/ai-generations.ts

  ## Acceptance Criteria
  - [ ] Upscaling produces higher quality images
  - [ ] Wallet deduction correct for each multiplier
  - [ ] Failed upscales refund wallet
  - [ ] Progress tracking for long upscales
  - [ ] Unit tests for upscale service
