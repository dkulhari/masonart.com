ticket_number: 198
title: 'Bug: sitemap tests fetch from wrong server (web instead of API)'
description: |-
  ## Failing Test
  **File**: `tests/e2e/sitemap.spec.ts`
  **Test**: Sitemap - Accessibility › should return 200 status for sitemap.xml
  **Line**: 95

  ## Error
  Sitemap.xml returns 404 because tests fetch from web server (port 3001) but the sitemap is generated by the API server (port 3000) at the `/sitemap.xml` route.

  ## Fix
  - Added API_BASE_URL constant pointing to http://localhost:3000
  - Updated all `page.goto('/sitemap.xml')` calls to use API_BASE_URL
  - Including the no-JavaScript test which creates a new browser context

  ## Acceptance Criteria
  - [x] All 52 sitemap tests pass
