ticket_number: 396
title: API - schema columns for the new facets and a migration
description: |-
  ## Task

  Add the metadata the new facets need to `packages/api/src/database/schema/products.ts`.

  - `vibe`, `aesthetic`, `medium` — `text[]`, matching how `styles`/`subjects`/`colors`/`rooms` are already stored.
  - `uniqueness`, `availability` — single-valued `text`. A product has one edition type and one availability; an array invites contradictory rows.
  - Extend `orientationEnum` with `set-of-2-3`. `round` already covers mesonart's "Circle".

  Generate the migration with `drizzle-kit generate` (output lands in `src/database/migrations`, per `drizzle.config.ts:8`).

  ## Context

  Feature: product-metadata-facets
  Blocked by the shared vocabularies ticket.

  **Constraints**
  - Postgres will not drop an enum value later — adding `set-of-2-3` is effectively permanent. It is added because mesonart genuinely treats it as an orientation facet (§5.2), even though it describes panel count rather than proportion.
  - `getSizesForOrientation` in `@chobii/shared` has no ladder for `set-of-2-3` and returns an empty array. `buildVariantsForOrientation` already handles that, and `seed.ts` falls back to portrait for unladdered orientations — verify that path still behaves rather than assuming.
  - Do NOT hand-write the migration; generate it, then read what was generated before applying.
  - Apply against the dev database on **5440** and confirm the columns exist.
