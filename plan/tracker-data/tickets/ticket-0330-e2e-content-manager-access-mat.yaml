title: E2E - content-manager access matrix spec
description: |-
  ## Task
  Write the E2E spec proving the content-manager access matrix in both directions.

  ## Context
  Part of feature: content-manager-role
  Phase: E2E Tests & Docs

  Use `test.use({ storageState: CONTENT_MANAGER_STORAGE_STATE })` (import from auth.setup.ts). Assertions:
  1. Visiting `/admin` redirects to `/admin/products`
  2. `/admin/products` renders the product management UI (can open the new-product form)
  3. Sidebar shows Products (and Collections/Categories if present) but NOT Orders, Customers, Dashboard, Analytics, Settings
  4. Direct navigation to `/admin/orders` and `/admin/customers` shows the Access Denied screen
  5. Product publish flow: can change a draft product's status to active (trusted publisher)
  6. Regression: customer storage state still cannot access `/admin/products` (Access Denied)

  Follow selector/wait patterns from existing admin specs (admin-products.spec.ts) and the CLAUDE.md E2E guidance (networkidle, scoped selectors).
