    expected_result: PASS if all prior tickets are implemented; investigate any failure as a real access-control gap
    status: pending
    code: |-
      import { test, expect } from "@playwright/test";
      import { CONTENT_MANAGER_STORAGE_STATE, CUSTOMER_STORAGE_STATE } from "./auth.setup";

      test.describe("Content Manager access", () => {
        test.use({ storageState: CONTENT_MANAGER_STORAGE_STATE });

        test("/admin redirects to /admin/products", async ({ page }) => {
          await page.goto("/admin", { waitUntil: "networkidle" });
          await expect(page).toHaveURL(/\/admin\/products/);
        });

        test("can access product management", async ({ page }) => {
          await page.goto("/admin/products", { waitUntil: "networkidle" });
          // assert product list heading + New Product action visible
        });

        test("sidebar hides admin-only sections", async ({ page }) => {
          await page.goto("/admin/products", { waitUntil: "networkidle" });
          // expect Products nav visible; Orders/Customers/Dashboard/Analytics/Settings not visible
        });

        test("direct nav to admin-only section shows Access Denied", async ({ page }) => {
          await page.goto("/admin/orders", { waitUntil: "networkidle" });
          await expect(page.getByText("Access Denied")).toBeVisible();
          await page.goto("/admin/customers", { waitUntil: "networkidle" });
          await expect(page.getByText("Access Denied")).toBeVisible();
        });
      });

      test.describe("Customer cannot manage products (regression)", () => {
        test.use({ storageState: CUSTOMER_STORAGE_STATE });
        test("customer gets Access Denied on /admin/products", async ({ page }) => {
          await page.goto("/admin/products", { waitUntil: "networkidle" });
          await expect(page.getByText("Access Denied")).toBeVisible();
        });
      });
  - id: 2
