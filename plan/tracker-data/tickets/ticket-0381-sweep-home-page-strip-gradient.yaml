ticket_number: 381
title: 'Sweep - home page: strip gradients and blur blobs, adopt bands, pills and DisplayHeading'
description: |-
  ## Task
  `app/routes/index.tsx` is the loudest surviving piece of the old orange marketing identity. Per analysis §5 A.4, strip it back to the monochrome system.

  Per section:
  - **HeroSection** — delete `bg-gradient-to-br from-brand-50 via-background to-brand-100/30` and both `blur-3xl` blob divs; delete the orange `bg-brand-100 text-brand-700` badge; H1 becomes `DisplayHeading` with `gradient-text` removed; the two CTAs become `buttonVariants({variant:'solid'|'outline', size:'lg'})` anchors; trust-row stars move from `fill-yellow-400 text-yellow-400` to `fill-rating text-rating`.
  - **FeaturedProductsSection / ValuePropsSection / NewsletterSection** — wrap in `SectionBand`; `h2` drops `font-bold` (base layer now supplies Urbanist 300); "View all" links drop `text-brand-600` for `text-foreground`.
  - **CategoriesSection** — becomes `SectionBand tone="beige"`. The four per-category `from-*/to-*` gradient washes stay: they are a text-legibility scrim over category photography (see the #357 comment at index.tsx:370), not brand colour. Only the `bg-muted/30` section background changes.
  - **AIGeneratorSection** — keep it (our differentiator, explicitly retained per the design), but restyle: `bg-gradient-to-br from-brand-600 to-brand-800` becomes `SectionBand tone="ink"`, both `blur-3xl` blobs deleted, the white CTA becomes an outline pill on ink.
  - **ProductsPlaceholder** — `text-brand-600` becomes `text-foreground`.

  ## Context
  Part of feature: mesonart-design-parity
  Phase: 3 — Storefront sweep
  File: `packages/web/app/routes/index.tsx`
  Test: `packages/web/tests/routes/home-tokens.test.ts` (source-level; the route module cannot be rendered standalone because it calls `createFileRoute` and a server function)
  Depends on: Button, SectionBand, DisplayHeading primitives.
