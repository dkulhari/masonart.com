      Done in 5bdaa819. 28 tests in packages/web/tests/routes/admin-vendor-payables.test.tsx, all passing, run 6x for flake.

      New file: packages/web/app/routes/admin/vendors/$id.payables.tsx — exports VendorPayablesSection and no Route, so the file router leaves it alone (same arrangement as VendorForm.tsx / FrameForm.tsx). routeTree.gen.ts therefore needed no regeneration.

      Notes for whoever picks up #622 (E2E):
      - Error path renders ONLY the error + retry. No total, no settlement form, and the whole subtree is digit-free — the test asserts container.textContent has no '0' and no /\d/ at all.
      - Two-step confirm test ids: vendor-settlement-submit → vendor-settlement-confirm-panel → vendor-settlement-confirm / -cancel. The panel restates both the amount being recorded and the derived total of the selected jobs. Any selection or amount change disarms it.
      - The amount is DERIVED from the selection (amountEdited ? draft : derivedTotal), not synced by an effect. The effect version was genuinely flaky: it left one render where the field was empty and the record button disabled, and a fast click landed in that window.
      - Step 5's grep now returns nothing at all over app/routes/admin/vendors/. The only hit was a prose `confirm()` in $id.tsx's InlineConfirm doc comment (pre-existing from #618); reworded to "a native browser dialog" so the audit grep is self-clean rather than needing a human to eyeball each hit.

      Wired as a tab in $id.tsx (details | payables) rather than a child route — a $id.payables ROUTE would make /admin/vendors/$id a layout and force every existing section onto an Outlet. The $id.tsx edit is 43 lines with no re-indentation of the existing sections.

      Web typecheck: 25 errors, none in routes/admin/vendors/**. The delta over the ~22 baseline is app/routes/vendor.tsx and app/routes/admin/production/** from the concurrent #617/#620 work, not this.
