      - Typecheck: 23, unchanged

      **Note on suite stability**: `cart`, `products`, `returns` and `reviews` appeared in the full-run failure set but pass in isolation (236 tests). The failing *file set* varies between full runs — these are DB-contention flakes under parallelism, not regressions.
