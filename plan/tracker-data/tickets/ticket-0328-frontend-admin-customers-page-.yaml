ticket_number: 328
title: Frontend - Admin customers page with role dropdown
description: |-
  ## Task
  Create the `/admin/customers` page (sidebar already links to it, but the route file does not exist): a user list table with a role dropdown per row allowing admins to toggle `customer` <-> `content-manager`.

  ## Context
  Part of feature: content-manager-role
  Phase: Frontend

  - Data: `GET /api/admin/customers`; mutation: `PUT /api/admin/customers/:id/role` (both created in the backend phase)
  - Follow the structure of an existing admin list page (e.g. `packages/web/app/routes/admin/orders/` or `reviews.tsx`) for loader/fetch patterns and table styling; use shadcn/ui Select for the dropdown
  - Rows whose role is `admin`/`super-admin` render the role as static text (no dropdown) — the API refuses to modify them anyway
  - This page is admin-only: it's outside the content-manager allowed prefixes, so the layout guard from the earlier ticket already blocks content-managers
  - Show a toast/inline feedback on success or failure of role change
