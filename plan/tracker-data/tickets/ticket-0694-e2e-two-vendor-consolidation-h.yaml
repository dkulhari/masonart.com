    text: |-
      **Implementation steps (derived — this ticket had none)**

      1. `tests/e2e/production-pipeline.spec.ts` — serial two-vendor consolidation happy path (`most_items` basis, so the consolidator must be *confirmed*), plus the four refusals interleaved at the moment each is actually reachable.
      2. Repair (not replace) `tests/e2e/admin-vendor-lifecycle.spec.ts` — `vendor-job-mark-sent` → `-received`, the `admin-production-status` `<select>` → `TransitionPanel` buttons, and `selectOption('qc_passed')` → the review form that now moves the job.
      3. Run each spec alone, chromium only, against a private server pair on :3020/:4322 (`:3000/:3001` and `:3010/:4321` are other sessions' and 16h stale).
      4. Mutation-prove both: break something real, watch red, revert.
      5. Commit; close session; mark done.

      **Findings that shaped the design** (recorded before writing a line):

      - **The label seam is wider than the ticket assumed.** `getVendorJobLabelKey` names `order_shipments.label_object_token` inside the SELECT list, so Postgres raises `42703` at *parse* time — before any WHERE predicate is applied. The documented `404 "Label not found"` for a non-consolidator is therefore **unreachable in every environment**: consolidator and non-consolidator alike get `503 LABEL_NOT_AVAILABLE`. The 404-with-presigner-never-called discrimination is covered where it can be — `packages/api/tests/routes/vendor/isolation.test.ts` — and the E2E asserts the honest 503.
      - **`ORDER_HAS_LABEL` does *not* read the missing column.** It reads `orders.shipping_details ->> awbNumber|trackingNumber|shipmentId`. So "B confirms handover" *is* reachable today, via the real, pre-existing manual-dispatch route `PATCH /api/admin/orders/:id/shipping`. Only the signed label PDF is blocked.
      - **No seeded order has a framed item** (`select count(frame_id) … having > 0` → 0 rows), so the frame stage cannot be driven without fixture surgery. The happy path uses §5's own case 3 (two print vendors, `most_items`, `CONFIRMATION_REQUIRED`), and the "frame job dispatching before its print passed" refusal is asserted as the guard that actually mechanises it — `open-transfer-or-order-label` → `409 GUARD_UNSATISFIED` — at the moment the consolidator is `qc_passed` with no parcel out and no label on the order.
      - DB verified migrated to 0025 (26 rows in `drizzle.__drizzle_migrations`; `production_transfers`, `production_transfer_jobs`, `order_consolidation`, `production_job_photos` all present; `label_object_token` genuinely absent).
  - author: mcp-client
    timestamp: '2026-08-30T21:13:55.170Z'
    text: |-
      ✅ **Completed**

      **Commit**: `80b79ecc` — test(e2e): drive the production pipeline end to end, and revive the spec it broke

      **Files Changed**
      - `tests/e2e/production-pipeline.spec.ts` (new, 1178 lines) — the two-vendor consolidation chain plus the four refusals
      - `tests/e2e/admin-vendor-lifecycle.spec.ts` — **repaired**, not replaced
      - `packages/api/src/lib/vendor-scope.ts` — `isMissingLabelSeam` now walks the `cause` chain
      - `packages/api/tests/lib/vendor-label-seam.test.ts` — its fixture now builds the shape the driver actually produces

      **The dead spec: repaired.** Its subject (vendor onboarding, rate cards, isolation, payables, settlement, two access-denied paths) is all still live — seven working tests. Only the mechanics of moving a job moved, so replacing it would have discarded working coverage to fix three lines. The three dead spots now assert the change that killed them: `sent` is retired so its control must **not** exist; the status `<select>` must **not** exist; and a verdict IS a transition, so a job nobody submitted has no verdict to record (`admin-production-review-unavailable`, and the panel offering only `cancelled` out of `received`). Two latent faults fixed while in there: the order finder now pages (a two-line order had fallen off the first fifty, which is why it also failed on data), and its money assertions are quantity-aware, which they never were.

      **Two defects the end-to-end run found — both fixed here**
      1. `GET /api/vendor/jobs/:id/label` answered **500, not the documented 503**, in every environment. Drizzle does not hand callers the driver's error: it wraps it in a `DrizzleQueryError` whose message is the SQL and nothing else, and hangs the `postgres.js` error — carrying `42703` and "does not exist" — on `cause`. `isMissingLabelSeam` read only the top level, so neither half of its test could be answered and the 503 branch was unreachable. The entire point of that seam — a fixed body narrating no schema to a supplier, from the one route that carries a customer's address — was inoperative.
      2. `vendor-label-seam.test.ts` **could not fail on that.** It fabricated a bare `Error` with the code and the sentence on one object — a shape the driver never produces. Mutating the fix now reds 2 of its 11 tests; before, it stayed green against a detector that returned `false` for every real request. That is the sixth vacuous suite in this feature, and it was guarding the exact bug it was written for.

      **What I chose about "the label signs"** — the ticket's honesty requirement. The seam is wider than the ticket assumed: `label_object_token` is named in `getVendorJobLabelKey`'s **SELECT list**, so `42703` is raised during parse analysis, before any WHERE predicate. The documented `404 "Label not found"` that distinguishes a non-consolidator is therefore unreachable **for anybody** today — consolidator and non-consolidator get the identical 503. Asserting a 404 there would have been asserting a fixture the test built itself. So:
      - readiness flipping `true` on its own terms is asserted for real (every job passed, goods at the consolidator, transfer received, and the anti-double-label property afterwards);
      - the label route's documented `503 LABEL_NOT_AVAILABLE` is asserted in the API **and** on the vendor's screen, together with the assertion that the message names no column, table or driver, no `iframe`/`embed`/`object`, and no `X-Amz-Signature` in the DOM;
      - the signing step is a `test.fixme` naming its exact precondition, so it is switched on with the seam rather than rediscovered. The 404 discrimination stays asserted where a db has the column (`tests/routes/vendor/isolation.test.ts`), and the tripwire connects the two.

      `ORDER_HAS_LABEL` reads `orders.shipping_details`, not the missing column, so **"B confirms handover" is genuinely reachable** — the admin records the AWB through the real, pre-existing `PATCH /api/admin/orders/:id/shipping`. Nothing is stubbed.

      **Two liberties, both stated in the spec header rather than buried**
      - No seeded order line carries a `frame_id` (zero rows), so the frame job is an admin-created job beside the print job rather than a coverage requirement; the `item_uncovered` clause is the one readiness clause this file does not exercise, and `tests/lib/production-readiness.test.ts` does.
      - §5 rule 3 (two print vendors on a two-line order) was built first and abandoned on evidence: 116 orders / 120 items means **four** two-line orders exist and each run consumes one irreversibly. Single-line orders are abundant, so the spec is repeatable.

      **Proof it can fail** (a vacuous E2E is worse than none):
      | Mutation | Result |
      |---|---|
      | drop the `shot-list-complete` guard from `received → qc_submitted` | REFUSAL: incomplete shot list → RED (200 where a 422 belonged) |
      | QC review records the row but stops moving the job | "the verdict moves it" → RED on its own assertion |
      | un-retire `sent` as a vendor edge | repaired lifecycle spec → RED (`vendor-job-mark-sent` count 1, expected 0) |
      | read only the top-level error in `isMissingLabelSeam` | tripwire → RED, 2 of 11 |

      All four reverted; `git diff` verified clean before committing.

      **Verification** — private server pair `:3020`/`:4322` (`:5173` is a different app; `:3000`/`:3010` are other sessions'), `SKIP_E2E_SERVER=true`, chromium only, `--workers=1`, one spec at a time, never two admin suites at once. DB confirmed at migration 0025 via `db:migrate` (26 rows in `drizzle.__drizzle_migrations`; all three new tables present; `label_object_token` genuinely absent).

      - `npx playwright test tests/e2e/production-pipeline.spec.ts --project=chromium --workers=1` → **16 passed, 1 fixme** (3 runs, stable, ~38s)
      - `npx playwright test tests/e2e/admin-vendor-lifecycle.spec.ts --project=chromium --workers=1` → **9 passed** (2 runs, stable, ~28s)
      - `bunx vitest run tests/lib/vendor-label-seam.test.ts tests/routes/vendor tests/lib/production-readiness.test.ts` → **401 passed / 7 files**
      - `turbo run typecheck` (pre-commit gate, api src + api tests + shared + web) → **0 errors**

      One flake was found and fixed rather than retried: the QC step read the job status straight after clicking submit, and `expect(review-error).toHaveCount(0)` is equally true *before* the request leaves the browser. It now waits on the review appearing — a positive signal — then polls.

      **Follow-up worth filing** (not done here, outside this ticket): `docs/DEV_ENVIRONMENT.md` still documents `bunx drizzle-kit push --force` as the schema command, contradicting #663 and every other doc; and it documents no private-server-pair recipe, so each agent rediscovers `FRONTEND_URL` / `VITE_API_PROXY_TARGET` / `E2E_API_URL`.
