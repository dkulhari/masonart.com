ticket_number: 635
title: Contract - shared audit action registry and zod schemas
description: |-
  ## Task
  Add the shared contract every other ticket compiles against: the typed audit action registry, the category/outcome enums, the list-query filter schema and the entry schema.

  An unknown action name must fail typecheck — that is the mitigation for a generic jsonb table having no compile-time shape.

  ## Context
  Part of feature: admin-audit-log (Phase 1 - Contract)
  Spec: docs/plans/2026-08-17-logging-and-auditing.md section 3.2
  Follow packages/shared/src/schemas/gift-card.ts for file shape and export style (named exports, zod, no semicolons where the file omits them).
  The router serialises every search param as a string, so the query schema must coerce numbers and split comma-joined arrays.
