ticket_number: 592
title: Storefront - FrameSelector groups on category instead of guessing
description: |-
  ## Task

  `FrameSelector` reads `frame.category` and `frameCategoryLabel` is deleted.

  Today `frameCategoryLabel` (FrameSelector.tsx:146) infers the format rung from the type string: `rolled` and `frameless` map to themselves, everything else falls through to "Framed". That works only because the seven seeded types are known in advance.

  With admin-created frames it stops working, and stops working *silently*: a new moulding lands in the right bucket by accident, and a new **format** — the case that matters — lands in "Framed" with nothing anywhere to signal it.

  - `FrameOptionData` gains `category`.
  - `frameGroupLabel` (FrameSelector.tsx:158) maps category to its display label instead of calling `frameCategoryLabel`.
  - The PDP loader (posters/$slug.tsx:127) passes `category` through from the API response.
  - `ChooseOptions.tsx` — check whether the quickview groups too; if it does, it takes the same column.

  Leave `getFramePreviewColor` (:409) alone. It is a swatch **fallback** keyed on type, only used when a frame has no image, and it already degrades to `bg-muted`. Every admin-created frame will have an uploaded swatch.

  ## Context

  Feature: admin-frame-management. Phase 5 (storefront). Blocked by #582 (column) and the public API ticket (it has to be on the wire).

  Files:
  - packages/web/app/components/product/FrameSelector.tsx:41-65 (FrameOptionData), :146, :158, :161
  - packages/web/app/routes/posters/$slug.tsx:127 — the loader mapping, recently rewritten by #566
  - packages/web/app/components/product/ChooseOptions.tsx
