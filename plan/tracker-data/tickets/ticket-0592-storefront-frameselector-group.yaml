    text: |-
      ✅ **Completed**

      **Commit**: `bf71c51b` — fix(web): the frame panels group on the column instead of guessing from type

      **Files Changed**:
      - `packages/web/app/components/product/FrameSelector.tsx` — `frameCategoryLabel` deleted; `CATEGORY_LABELS` map added; `frameGroupLabel` now exported; `FrameCategory` type and `category` field added to `FrameOptionData`
      - `packages/web/app/components/product/ChooseOptions.tsx` — `category` threaded through the response type, `QuickviewFrame`, and the mapping; hardcoded heading replaced
      - `packages/web/app/routes/posters/$slug.tsx` — `category` in the response type and passed through the loader
      - `packages/web/tests/components/product/FrameSelector.category.test.tsx` — new, 8 tests
      - `FrameSelector.test.tsx`, `ChooseOptions.test.tsx` — fixtures given their rungs

      **The quickview fix, which the ticket did not ask for.**

      The ticket said: check whether the quickview groups, and if it does, give it the column. It **doesn't** group — `ChooseOptions.tsx` printed the literal string `Rolled Canvas/Frameless/Framed:`. So the ticket's condition was strictly not met.

      But that literal is safe only while the catalogue always carries all three rungs, which is exactly the assumption this feature removes. An admin who archives every rolled frame would leave the quickview heading promising an option the panel beneath it does not offer, while the PDP — which derives the label — correctly narrowed to "Frameless/Framed". Two surfaces, same product, disagreeing about what is for sale.

      It is three lines, so I fixed it rather than filing it. `frameGroupLabel` now takes `ReadonlyArray<{ category: FrameCategory }>` instead of `FrameOptionData[]` — the two panels have different frame shapes, and the narrower structural type is what lets one helper serve both instead of a second copy that drifts.

      **Left alone as scoped**: `getFramePreviewColor` still keys on `type`. It is a swatch *fallback* used only when a frame has no image, and it already degrades to `bg-muted`; every admin-created frame will have an uploaded swatch.

      **Verification**:
      - Command: `bunx vitest run tests/components/product/`
      - Result: 23 of 24 files pass, **440 passing / 4 failing**
      - The 4 failures are `ProductCard.test.tsx` and are **pre-existing** — I stashed the whole change and reran it, getting the identical `4 failed | 23 passed`. Unrelated to frames (heart placement, catalogue code, price scale).
      - Frame suites all green: `FrameSelector` 32, `FrameSelector.category` 8, `ChooseOptions` 40
      - Command: `bunx tsc --noEmit` → 34, exactly the measured baseline

      **A note on the test that mattered**: `frameGroupLabel([frame({ type: 'rolled', category: 'framed' })])` must return `'Framed'`. It is a deliberately contradictory row — if that assertion ever passes only because type and category happen to agree, the inference has crept back in.
