ticket_number: 54
title: Frontend - Prompt Suggestions UI
description: |-
  ## Overview
  Display AI-powered prompt suggestions to help users craft better prompts.

  ## Component: PromptSuggestions

  ### Features
  1. **Suggestion Pills**
     - Show 5-8 clickable suggestion chips
     - Click to insert into prompt input
     - Fade animation on insert

  2. **Contextual Updates**
     - Refresh suggestions when style changes
     - Show 'Popular' tag on trending prompts
     - Shuffle button to get new suggestions

  3. **Loading State**
     - Skeleton pills while loading
     - Subtle fade-in when ready

  ## Integration with PromptInput
  - Suggestions appear below prompt textarea
  - Clicking appends to existing prompt (not replace)
  - Keyboard shortcut: Tab to cycle through suggestions

  ## Files to Create/Modify
  - packages/web/app/components/ai-generator/PromptSuggestions.tsx (new)
  - packages/web/app/components/ai-generator/PromptInput.tsx (integrate)
  - packages/web/app/hooks/usePromptSuggestions.ts (new hook)

  ## Acceptance Criteria
  - [ ] Suggestions load for each style
  - [ ] Click inserts prompt correctly
  - [ ] UI is non-intrusive
  - [ ] Works on mobile
  - [ ] Component tests pass
