      ✅ **Completed**

      **Commit**: `a6f5f0ca` - fix(auth): Resolve test auth setup timeout and password hash issues

      **Root Cause**: 
      The test user seed script used Bun's bcrypt hash format (`$2b$10$...`), but Better Auth expects scrypt format (`salt:key`). This caused "Invalid password hash" errors.

      **Files Changed**:
      - `packages/api/src/database/seed-test-users.ts` - Import `hashPassword` from `better-auth/crypto`
      - `packages/api/src/index.ts` - Clone request for Better Auth handler
      - `playwright.config.ts` - Increase setup test timeout to 60s
      - `tests/e2e/auth.setup.ts` - Increase waitForURL timeout to 25s, add page closed guard

      **Tests**:
      - All 172 auth tests pass in ~1.4 minutes
