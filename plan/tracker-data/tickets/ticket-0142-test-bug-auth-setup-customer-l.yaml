ticket_number: 142
title: "Test Bug: Auth setup customer login timeout"
description: |-
  ## Test Failure
  **File**: `tests/e2e/auth.setup.ts`
  **Test**: authenticate as customer
  **Line**: 148

  ## Error (Test Infrastructure Issue)
  ```
  Test timeout of 30000ms exceeded.
  Error: locator.isVisible: Target page, context or browser has been closed
    at loginUser (tests/e2e/auth.setup.ts:75:68)
  ```

  ## Classification
  This is a **test bug** - the login flow takes longer than the 10-second waitForURL timeout, causing a cascade that results in the 30-second test timeout. The browser context is closed during cleanup while the error check is still executing.

  ## Root Cause
  1. `waitForURL` at line 69 times out after 10 seconds
  2. Catch block tries to check for error messages at line 75
  3. Meanwhile, the 30-second test timeout fires
  4. Playwright closes the browser during cleanup
  5. Line 75 fails because the browser is already closed

  ## Suggested Fix
  - Increase the `waitForURL` timeout from 10s to 20s
  - Or investigate why the login redirect is slow
  - Or use the pre-seeded test users with verified credentials instead of registering new ones
