ticket_number: 645
title: Read - GET /api/admin/audit-log with filters, cursor paging and an entity timeline
description: |-
  ## Task
  Add the read API: `GET /api/admin/audit-log` (filters: actor, action, category, entityType, entityId, from, to, free text; cursor pagination) and `GET /api/admin/audit-log/entity/:type/:id` for one entity's timeline.

  RBAC: `admin` and `super-admin` only - explicitly NOT `content-manager`, because entries carry customer emails.

  ## Context
  Part of feature: admin-audit-log (Phase 6 - Read)
  Spec: docs/plans/2026-08-17-logging-and-auditing.md section 3.6
  Validate query params with `auditLogQuerySchema` from @chobii/shared via @hono/zod-validator. Follow routes/admin/gift-cards.ts for router shape and the admin guard. Mount in index.ts. Bind id arrays as arrays (see e3c2620d).
