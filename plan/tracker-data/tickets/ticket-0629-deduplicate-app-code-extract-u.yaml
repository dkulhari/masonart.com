ticket_number: 629
title: 'Deduplicate app code: extract useScrollTrack hook and share track route types/helpers'
description: |-
  Remove the two real application-code duplications found by the DRYwall/jscpd scan on 2026-08-17. Test-scaffolding duplication is tracked separately in its sibling ticket.

  ## Clone 1 — scroll track logic (61 duplicated lines)

  - `packages/web/app/components/home/ProductRail.tsx:136-196`
  - `packages/web/app/components/product/ProductCarousel.tsx:65-118`

  Both components carry the same horizontal scroll-track implementation: a `trackRef` on the `<ul>`, a `useId()` heading id, optimistic edge-state defaults ("assume the track starts at its left edge with more to scroll, until a real measurement lands"), and the scroll/resize measurement that drives the prev/next affordances.

  Extract into a shared hook, e.g. `packages/web/app/hooks/useScrollTrack.ts`, returning the ref plus the derived `canScrollLeft` / `canScrollRight` (or equivalent) state and the scroll handlers. Both components then consume the hook.

  This is the highest-value clone in the scan: pure app code, self-contained, low risk.

  ## Clone 2 — order tracking routes (101 + 57 = 158 duplicated lines)

  - `packages/web/app/routes/track/$token.tsx:40-140` and `:367-423`
  - `packages/web/app/routes/track/index.tsx:46-146` and `:574-630`

  The two track routes duplicate the `OrderStatus` union and the surrounding type block, and duplicate a run of helper functions near the bottom of each file.

  Extract the shared types into something like `packages/web/app/lib/track-types.ts` and the helpers into `packages/web/app/lib/track-helpers.ts` (or co-locate both in one module if they are cohesive). Import from both routes.

  Note: both track route files already have uncommitted modifications in the working tree, so coordinate with whatever is in flight there before starting.

  ## Acceptance criteria

  - `ProductRail` and `ProductCarousel` share one scroll-track hook; no duplicated measurement logic remains between them.
  - Both `track/` routes import shared types and helpers; no duplicated `OrderStatus` union or helper bodies remain.
  - Behaviour is unchanged — this is a pure refactor, no visual or functional deltas.
  - Existing unit/component tests for these files still pass; add coverage for the extracted hook if none exists.
  - Re-running the scan shows these five clone pairs gone.

  ## Verification

  ```
  bunx vitest run packages/web/tests/components/home
  bunx vitest run packages/web/tests/components/product
  bunx vitest run packages/web/tests/routes/track
  ```

  Then re-run the duplication scan scoped the same way as the baseline:

  ```
  npx jscpd@5.0.12 packages \
    --format typescript,tsx,javascript,jsx \
    --ignore '**/node_modules/**,**/migrations/**,**/dist/**,**/build/**,**/.turbo/**,**/*.d.ts' \
    --min-lines 15
  ```
