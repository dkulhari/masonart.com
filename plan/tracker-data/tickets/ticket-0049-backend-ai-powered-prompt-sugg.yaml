ticket_number: 49
title: Backend - AI-Powered Prompt Suggestions
description: |-
  ## Overview
  Provide intelligent prompt suggestions based on selected style, color mood, and partial user input.

  ## Endpoint
  **GET /api/ai/prompt-suggestions**
  - Query params: style, colorMood, partialPrompt (optional)
  - Returns array of 5-8 suggested prompts
  - Cached per style+mood combination

  ## Suggestion Sources
  1. **Static curated suggestions** per style
     - 20+ handcrafted prompts per preset
     - Cover common use cases (nature, abstract, portraits, etc.)

  2. **Popular prompts** from public gallery
     - Most liked generations' prompts (anonymized)
     - Filtered for appropriateness

  3. **Dynamic completion** (optional enhancement)
     - If partialPrompt provided, filter/complete suggestions
     - Simple keyword matching, no external API needed

  ## Implementation
  - Create aiPromptSuggestions.ts with curated prompts
  - Query public gallery for trending prompts
  - Cache suggestions in Redis (1 hour TTL)

  ## Files to Create/Modify
  - packages/api/src/routes/ai.ts (suggestions endpoint)
  - packages/api/src/ai/prompt-suggestions.ts (new file)

  ## Acceptance Criteria
  - [ ] Returns relevant suggestions for each style
  - [ ] Popular prompts pulled from gallery
  - [ ] Fast response (<100ms with cache)
  - [ ] No inappropriate content in suggestions
  - [ ] Unit tests for suggestion logic
