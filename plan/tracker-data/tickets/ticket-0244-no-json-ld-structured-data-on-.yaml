ticket_number: 244
title: No JSON-LD structured data on any pages
description: |-
  ## Bug
  No `<script type="application/ld+json">` structured data found on any page (home, product listing, product detail). This is important for rich search results.

  ## Steps to Reproduce
  ```bash
  curl -s http://localhost:3001 | grep 'application/ld+json'  # empty
  curl -s http://localhost:3001/posters | grep 'application/ld+json'  # empty
  ```

  ## Impact
  - No rich snippets in Google search results
  - No product schema for e-commerce SEO
  - No organization schema for brand presence

  ## Expected
  JSON-LD for Organization (home), Product (detail pages), BreadcrumbList, and ItemList (listing pages)
