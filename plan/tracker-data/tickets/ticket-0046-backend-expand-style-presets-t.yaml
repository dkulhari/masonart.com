ticket_number: 46
title: Backend - Expand Style Presets to 15 Total
description: |-
  ## Overview
  Add 5 new style presets to the AI generator, bringing total to 15 diverse artistic styles.

  ## New Presets to Add
  1. **Ink Wash** - Asian-inspired ink painting with gradient washes
  2. **Digital Art** - Modern digital illustration, gaming/concept art style
  3. **Minimalist Modern** - Clean lines, geometric simplicity, Scandinavian design
  4. **Impressionist** - Monet-inspired brushstrokes, light play, outdoor scenes
  5. **Art Deco** - 1920s geometric patterns, gold accents, glamorous

  ## For Each Preset Configure
  - Prompt modifiers and keywords
  - Negative prompts
  - Model parameters (CFG scale, steps, sampler)
  - Quality enhancers
  - Recommended aspect ratios
  - Preferred AI provider
  - Color mood suggestions

  ## Files to Modify
  - packages/api/src/ai/style-presets.ts
  - packages/shared/src/types/ai.ts (if needed)

  ## Acceptance Criteria
  - [ ] 5 new presets defined with full configuration
  - [ ] GET /api/ai/style-presets returns all 15 presets
  - [ ] Each preset generates appropriate imagery
  - [ ] Unit tests for preset validation
