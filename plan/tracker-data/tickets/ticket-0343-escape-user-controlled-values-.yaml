ticket_number: 343
title: Escape user-controlled values in order/approval email templates (pre-existing pattern)
description: |-
  ## Task
  The order/shipping/approval templates in packages/api/src/services/email-templates.ts interpolate user-controlled values (shippingAddress.fullName, address lines, review comments, AI prompt text) into HTML without escaping — same class as the auth-template issue fixed in commit 87a8e456 (which added an `escapeHtml` helper to this file).

  ## Scope
  Apply `escapeHtml` to every user-originated interpolation in the pre-existing templates (getOrderConfirmationTemplate, getShippedTemplate, getOutForDeliveryTemplate, getDeliveredTemplate, formatShippingAddress — note it joins with <br> so escape the parts, not the joined string — approval + AI templates with user prompts/comments). Add tests mirroring tests/services/auth-email-templates.test.ts.

  ## Context
  HTML injection in emails = phishing-content injection risk; requires a paying customer (address fields) or generation user (prompts), so lower urgency than the signup-name vector, but same fix.
