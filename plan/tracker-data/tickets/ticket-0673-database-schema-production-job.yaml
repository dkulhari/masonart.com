    text: |-
      ✅ **Completed**

      **Commit**: `83ee1c8f` — feat(database): add the production workflow statuses and the fulfilment audit tier (on `feature/production-pipeline-design`, directly atop the design commit `4924ab3d`)

      **Files Changed** (12, staged by explicit path — the tree carried unrelated dirty files from other sessions)
      - `packages/api/src/database/migrations/0023_production_pipeline_statuses.sql` — three `ALTER TYPE … ADD VALUE` statements and nothing else
      - `packages/api/src/database/migrations/meta/_journal.json` — idx 23, additive only
      - `packages/api/src/database/migrations/meta/0023_snapshot.json` — 0022's state with both enums advanced, `prevId` chained onto 0022
      - `packages/api/src/database/schema/production-jobs.ts` — `qc_submitted`, `dispatched`
      - `packages/api/src/database/schema/audit-log.ts`, `packages/shared/src/schemas/audit-log.ts`, `packages/web/app/routes/admin/audit-log/index.tsx` — the three `fulfilment` sites, plus `CATEGORY_STYLES`
      - 5 test files, one of them new (`migration-enum-literals.test.ts`)

      **Summary**

      `qc_submitted` and `dispatched` are positioned with `BEFORE` rather than appended, so the enum's sort order reads as the sequence of work and matches the drizzle DSL array — confirmed identical in both databases below, which is what keeps drizzle-kit from reading the difference as drift.

      `sent` stays in the type **and in the DSL array**. Beyond the stated reason (dropping a value means recreating the type and rewriting every dependent column, and rows carry it until #675 runs), there is a second one worth recording for **#676**: spec §10 property 1 asserts the transition matrix is *total* over every `(status, status, actor)` triple and that `sent` has zero edges in both directions. That test is unwritable if `sent` is not a member. The retirement is the matrix's job, never this enum's.

      `fulfilment` is appended — the audit tiers have no workflow order to preserve.

      Deliberately **not** here: no backfill (script, #675), no CHECK constraint (zero exist in the repo, and `raw-sql-objects.test.ts` scans only `FUNCTION|TRIGGER|POLICY`, so one would be silently absent from every push-built database — the exact shape of #663).

      **New guard for the tickets that follow.** `packages/api/tests/database/migration-enum-literals.test.ts` turns the feature's governing rule into a test: no value introduced by `ALTER TYPE … ADD VALUE` may appear as a literal in any migration. It is a pure filesystem check, because the failure only reproduces on a fresh database. Its one escape hatch is an explicit `::text` cast — the construction that makes `0014:10` safe today. **#674 and #675, taking 0024 and 0025, will fail this test if they put `qc_submitted`, `dispatched` or `fulfilment` in SQL.** The `::text` exemption is statement-scoped and therefore coarse; that limitation is documented in the file rather than papered over.

      **Verification**
      - Command: `vitest run` scoped to each path, no pathless runs
        - `packages/api` — `tests/schema/production-jobs.test.ts`, `tests/database/audit-log-schema.test.ts`, `tests/database/migration-enum-literals.test.ts`, `tests/schema/migration-meta-integrity.test.ts`, `tests/database/raw-sql-objects.test.ts`, `tests/routes/admin/audit-log.test.ts` → **41 passed (6 files)**
        - `packages/shared/tests/schemas/audit-log.test.ts` → **18 passed**
        - `packages/web/tests/routes/admin/audit-log.test.tsx` → **20 passed**
        - Total **79 passing**. RED first: 10 of these failed before the implementation, each for the intended reason.
      - Typecheck: `turbo run typecheck` via the pre-commit hook → 4/4 successful (api src + `tsconfig.test.json`, shared, web), 0 errors.
      - **Fresh database** (the case that matters, and the one no already-migrated database can prove): created an empty database on :5440 and ran `drizzle-kit migrate` over all 24 migrations. Applied successfully — the one-transaction batch replay the enum-literal rule exists to protect.
      - Dev database :5440 via `bun run db:migrate` → now at 24. **Never `db:push`.**
      - Both databases report the same order as the DSL:
        - `production_job_status` = `draft,assigned,sent,received,qc_submitted,qc_passed,qc_failed,dispatched,cancelled`
        - `audit_category` = `money,privilege,catalogue,config,content,fulfilment`
        - `0` CHECK constraints in `public`.
      - Negative control on the new guard: injected `UPDATE production_jobs SET status = 'dispatched'` into 0023 and it failed, naming file, line, value, origin migration and both remedies. Reverted; green again.
      - Throwaway database dropped.

      **Note for the feature owner**: `packages/web/app/routes/admin/production/index.tsx` (`PRODUCTION_STATUSES`), `packages/web/app/lib/vendor-nav.ts` (`VENDOR_JOB_STATUSES`), `packages/api/src/routes/vendor.ts:81` (`VENDOR_SETTABLE_STATUSES`) and `packages/api/src/lib/vendor-scope.ts:303` (`VendorSettableStatus`) all still carry the old vocabulary including `sent`. Left untouched on purpose — they belong to #676, #684, #688 and #691. Nothing breaks meanwhile: they are independent consts, they typecheck, and a widened enum cannot invalidate a narrower list.
