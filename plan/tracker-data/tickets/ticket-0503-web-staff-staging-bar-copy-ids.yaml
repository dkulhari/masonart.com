ticket_number: 503
title: 'Web - staff staging bar: copy ids, or create a collection from them'
description: |-
  ## Task

  A bar above the wishlist grid, **staff only**, turning the list into a curated collection.

  - Reads the count: *"12 items — staging for a collection"*, with a line saying this is the admin's own wishlist and curating a second collection means clearing it. Better stated than discovered.
  - **Copy IDs** — the ordered ids to the clipboard, for pasting into a collection that already exists.
  - **Create collection from these** — POST `/api/admin/collections` with `kind: 'manual'`, then PUT `/:id/products` with the ordered array, then navigate to that collection's edit form so a title can be given.

  Gate on role the way the header's staff entry does (`staffAreaLabel(session?.user?.role)` in `~/lib/admin-nav`). Product ids are not secret — they are already in the DOM and in API responses — so this is about not putting internal identifiers in every shopper's face.

  This retires the limitation recorded on #473: the admin form's manual picker is a textarea of raw UUIDs, and browsing the store with hearts is a far better picker that already exists.

  ## Context

  Feature: wishlist-curation, Phase 2. Depends on reordering, because the order is the entire value.

  Clipboard: `navigator.clipboard.writeText` is unavailable on insecure origins and in some browsers. Fall back to showing the ids in a selectable field rather than failing silently — a copy button that does nothing is worse than no button.
