    text: |-
      ✅ **Completed**

      **Commit**: `581ff626` — feat(web): stage a curated collection from the wishlist

      **Files Changed**:
      - `packages/web/app/components/wishlist/WishlistStagingBar.tsx` — new
      - `packages/web/app/routes/wishlist.tsx` — mounts it, reads the role from the root route context
      - `packages/api/src/routes/admin/collections.ts` — GET `/:id` now returns `productIds`
      - `packages/web/app/routes/admin/collections/$id.tsx` — loads them
      - `packages/web/tests/components/wishlist/WishlistStagingBar.test.tsx` — 13 tests

      **A destructive bug in #473 that this exposed**

      The first staged collection came back from the round trip with **zero members**, despite the PUT succeeding.

      `$id.tsx` set `productIds: []` because it never loaded existing membership — a shortcut I took in #473 and noted at the time. `CollectionForm` replaces the member list on save, so **saving any manual collection posted an empty array and wiped its curation.** Not a staging bug: opening a hand-curated collection, fixing a typo in its title and pressing Save would have silently deleted every product in it.

      Fixed at both ends — the admin GET returns the members, the form loads them. This is the sort of thing that only shows up when a feature is exercised end to end rather than through its own tests; #473's suite was green and stayed green.

      **Decisions**
      - **Created unpublished.** A half-built collection should not be reachable while it is being assembled. The admin ticks Published when it is ready — which is also why the first live check returned 404, correctly.
      - **Create posts, then navigates to the edit form.** Prompting for a title here would be a worse version of the form that already exists.
      - **Clipboard falls back to a selectable textarea.** `navigator.clipboard` is absent on insecure origins; a copy button that silently does nothing is worse than no button.
      - **One staging slot, stated in the UI.** It is the admin's personal wishlist, so curating a second collection means clearing the first. Better said than discovered.

      **End-to-end verification**

      ```
      staged order : Synthetic Nature | Digital Cosmos | Neural Dreams
      → Create collection from these → named, published →
      storefront h1: Staged From Wishlist
      members      : 0:Synthetic Nature , 1:Digital Cosmos , 2:Neural Dreams
      ```

      Read back from the database, not from the page, because the page could render the right products in the wrong order and look fine at a glance. Probe rows cleaned up afterwards.

      **Verification**
      - `cd packages/web && npx vitest run tests/components/wishlist/` — 33 passing
      - `cd packages/api && npx vitest run tests/routes/admin/collections.test.ts tests/routes/admin/collection-membership.test.ts` — 36 passing
      - `npx tsc --noEmit` clean in both packages

      **One gap worth naming**: the admin GET returning `productIds` has no test of its own — it is covered only by the end-to-end run. #504 should assert it, since it is now load-bearing against data loss.
