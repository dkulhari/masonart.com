ticket_number: 647
title: Ops - retention purge worker behind the immutability guard
description: |-
  ## Task
  Add a daily retention job: inside one transaction `SET LOCAL chobii.audit_purge = 'on'`, delete rows older than `AUDIT_RETENTION_DAYS` (default 400), log the deleted count. Register it with the existing background workers and document the env var in .env.example.

  This is the only code path allowed to delete an audit row - the trigger refuses every other one.

  ## Context
  Part of feature: admin-audit-log (Phase 7 - Ops)
  Spec: docs/plans/2026-08-17-logging-and-auditing.md D6, D7, section 3.8
  Follow packages/api/src/background.ts and queues/review-media.ts for worker registration and shutdown.
  The integration test needs the real DB: prefix with DATABASE_URL=...5440. Assert an UPDATE raises, a DELETE without the guard raises, and the guarded purge removes only aged rows.
