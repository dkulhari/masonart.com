    text: |-
      BUILT, awaiting blind verdict.

      The builder probed the live reference rather than trusting the spec doc, and found two errors in it — both now corrected in docs/design/pdp-parity-reference.md:
      - mobile thumbnails are 62px on a 78px pitch (x = 20/98/176/254/332), not the "~72px" the doc claimed
      - the reference's H1 is already 42px at 768, not desktop-only. Ours was text-[30px] lg:text-[42px], which made our tablet H1 the only element on the page smaller than the page it copies. Now text-[24px] md:text-[42px], matching the reference's 24px at 390.
      The "~16px side padding" in the doc was also wrong: the reference's artwork is 350x350 at x=20, i.e. it fills the content column — that gutter is container-wide's own 20px, not padding the gallery adds.

      Quantity + add-to-cart now share one row at 390 as the reference does (its stepper is 99px, button 234px; ours is 100px and 238px). Ours previously wrapped to two rows.

      Structural fix worth recording: the CTA had min-w-0, which switches off the min-content floor on a whitespace-nowrap button, letting the flex line squeeze the button narrower than its own label — the text then escapes and the document gains a horizontal scrollbar. Removing min-w-0 means the label's true width drives the wrap decision, so an unusually long price BREAKS THE ROW instead of overflowing. Verified against the worst case "Add to cart - ₹1,29,999.00" (198px of label vs 180.6px today) — wraps cleanly.

      Overflow is 0 at 390/768/1024/1440, and also at 360/414/640/1280. Desktop geometry unchanged: buy panel x=796 w=485, H1 42px/300, image 658 square, CTA 343x60. 768 now matches the reference exactly (CTA x=162 w=586 pad 26px, both).

      One cross-file change: ProductTabs' tab bar was centred, and centring a wrapped row at 390 produced a three-row zigzag with each row centred on its own axis. Now left-aligned below md, centred from md. Two-per-row is arithmetically impossible there — the labels measure 143 + 203 = 346 in a 350px column — so it stays three rows, just aligned.

      Test added: exactly one thumbnail carries aria-current="true" AND the mark MOVES on selection. A mark that never moves is indistinguishable from a hardcoded one.

      Blind critic running now.
